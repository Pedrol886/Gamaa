          package com.gama.assistant

          import android.content.ContentUris
          import android.content.Context
          import android.provider.CalendarContract
          import org.json.JSONObject
          import java.text.Normalizer
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          object GamaMemoryConsentPolicy {
              fun allowAdaptiveLearning(raw: String): Boolean {
                  val text = normalize(raw)

                  val explicitMemory = listOf(
                      "lembre disso",
                      "lembra disso",
                      "guarde isso",
                      "guarda isso",
                      "quero que voce lembre",
                      "pode guardar",
                  ).any { it in text }

                  if (explicitMemory) return true

                  val sensitive = listOf(
                      "segredo",
                      "desabafo",
                      "conversa intima",
                      "relacionamento",
                      "briga em casa",
                      "problema de saude",
                      "doenca",
                      "medicamento",
                      "senha",
                      "pin",
                      "documento pessoal",
                  ).any { it in text }

                  return !sensitive
              }

              private fun normalize(value: String): String =
                  Normalizer.normalize(value.lowercase(Locale("pt", "BR")), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}+"), "")
                      .replace(Regex("[^a-z0-9 ]+"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
          }

          object GamaWhatsAppDialogue {
              fun handleAsync(context: Context, raw: String, callback: (String) -> Unit): Boolean {
                  val active = GamaTaskStateStore.current(context)

                  if (active?.kind == "whatsapp_send" && active.state == GamaTaskStateStore.State.WAITING_USER) {
                      return continueTask(context, active, raw, callback)
                  }

                  val parsed = WhatsAppCommandParser.parse(raw) ?: return false
                  val recipient = parsed.target.trim()

                  if (recipient.isBlank()) return false

                  if (parsed.message.isNullOrBlank()) {
                      val data = JSONObject()
                          .put("stage", "message")
                          .put("recipient", recipient)
                          .toString()

                      GamaTaskStateStore.start(
                          context = context,
                          kind = "whatsapp_send",
                          goal = "Enviar uma mensagem para $recipient",
                          data = data,
                          prompt = "O que você quer mandar para $recipient?",
                      )

                      GamaTaskStateStore.transition(context, GamaTaskStateStore.State.WAITING_USER)
                      callback("Certo. O que você quer mandar para $recipient?")
                      return true
                  }

                  prepareConfirmation(context, recipient, parsed.message, callback)
                  return true
              }

              private fun continueTask(
                  context: Context,
                  task: GamaTaskStateStore.Task,
                  raw: String,
                  callback: (String) -> Unit,
              ): Boolean {
                  val data = runCatching { JSONObject(task.data) }.getOrElse { JSONObject() }
                  val stage = data.optString("stage")
                  val recipient = data.optString("recipient")

                  if (recipient.isBlank()) {
                      GamaTaskStateStore.clear(context)
                      return false
                  }

                  if (isCancellation(raw)) {
                      GamaPendingProposalStore.clear(context)
                      GamaTaskStateStore.clear(context)
                      callback("Certo. Cancelei a mensagem.")
                      return true
                  }

                  if (stage == "message") {
                      val body = WhatsAppCommandParser.followUpBody(raw).trim()
                      if (body.isBlank()) {
                          callback("O que você quer mandar para $recipient?")
                          return true
                      }

                      prepareConfirmation(context, recipient, body, callback)
                      return true
                  }

                  if (stage == "confirm") {
                      when (GamaConversationLanguage.confirmation(raw)) {
                          GamaConversationLanguage.Confirmation.YES -> {
                              val proposal = GamaPendingProposalStore.load(context)

                              if (proposal == null || proposal.tool != "whatsapp_send") {
                                  GamaTaskStateStore.failRecoverable(context, "Confirmação perdeu a proposta de envio.")
                                  callback("Perdi somente a etapa de confirmação. Diga a mensagem novamente e eu continuo.")
                                  return true
                              }

                              val request = GamaWhatsAppSendParser.fromPayload(proposal.payload)
                              if (request == null) {
                                  GamaTaskStateStore.failRecoverable(context, "Payload de WhatsApp inválido.")
                                  callback("Não consegui reconstruir a mensagem. Diga o texto novamente.")
                                  return true
                              }

                              GamaPendingProposalStore.clear(context)
                              GamaTaskStateStore.transition(context, GamaTaskStateStore.State.RUNNING)

                              when (GamaNotificationListener.replyToWhatsApp(request.recipient, request.message)) {
                                  GamaReplyStatus.SENT -> {
                                      val result = "Mensagem enviada para ${request.recipient} pelo recurso de resposta do Android."
                                      GamaTaskStateStore.complete(context, result)
                                      callback(result)
                                  }

                                  GamaReplyStatus.NO_MATCH,
                                  GamaReplyStatus.UNAVAILABLE,
                                  GamaReplyStatus.FAILED -> {
                                      val fallback = GamaPendingProposalStore.Proposal(
                                          tool = "whatsapp_send",
                                          payload = request.toPayload(),
                                          prompt = request.confirmation(),
                                      )

                                      GamaToolExecutor.executeAsync(context, fallback) { result ->
                                          if (result.contains("enviada", ignoreCase = true)) {
                                              GamaTaskStateStore.complete(context, result)
                                          } else {
                                              GamaTaskStateStore.failRecoverable(context, result)
                                          }
                                          callback(result)
                                      }
                                  }
                              }

                              return true
                          }

                          GamaConversationLanguage.Confirmation.NO -> {
                              GamaPendingProposalStore.clear(context)
                              GamaTaskStateStore.clear(context)
                              callback("Certo. Não vou enviar.")
                              return true
                          }

                          GamaConversationLanguage.Confirmation.UNKNOWN -> {
                              if (raw.trim().length >= 4) {
                                  prepareConfirmation(context, recipient, WhatsAppCommandParser.followUpBody(raw), callback)
                              } else {
                                  callback("Só preciso saber se posso enviar a mensagem preparada.")
                              }
                              return true
                          }
                      }
                  }

                  return false
              }

              private fun prepareConfirmation(context: Context, recipient: String, message: String, callback: (String) -> Unit) {
                  val request = GamaWhatsAppSendParser.Request(
                      recipient = recipient,
                      message = GamaConversationRepair.latestClause(message).trim().take(4000),
                  )

                  if (request.message.isBlank()) {
                      callback("O que você quer mandar para $recipient?")
                      return
                  }

                  val proposal = GamaPendingProposalStore.Proposal(
                      tool = "whatsapp_send",
                      payload = request.toPayload(),
                      prompt = request.confirmation(),
                  )

                  GamaPendingProposalStore.save(context, proposal)

                  val data = JSONObject()
                      .put("stage", "confirm")
                      .put("recipient", recipient)
                      .put("message", request.message)
                      .toString()

                  if (GamaTaskStateStore.current(context)?.kind == "whatsapp_send") {
                      GamaTaskStateStore.transition(context, GamaTaskStateStore.State.WAITING_USER, data, request.confirmation())
                  } else {
                      GamaTaskStateStore.start(context, "whatsapp_send", "Enviar uma mensagem para $recipient", data, request.confirmation())
                      GamaTaskStateStore.transition(context, GamaTaskStateStore.State.WAITING_USER)
                  }

                  callback(request.confirmation())
              }

              private fun isCancellation(raw: String): Boolean {
                  val text = normalize(raw)
                  return text in setOf("cancelar", "cancela", "cancele", "esquece", "deixa pra la", "deixa para la")
              }

              private fun normalize(value: String): String =
                  Normalizer.normalize(value.lowercase(Locale("pt", "BR")), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}+"), "")
                      .replace(Regex("[^a-z0-9 ]+"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
          }

          object GamaExamRouter {
              fun handle(context: Context, raw: String): String? {
                  val active = GamaTaskStateStore.current(context)

                  if (active?.kind == "exam_calendar" && active.state == GamaTaskStateStore.State.WAITING_USER) {
                      val data = runCatching { JSONObject(active.data) }.getOrElse { JSONObject() }
                      val base = data.optString("base")

                      if (base.isNotBlank()) {
                          GamaTaskStateStore.clear(context)
                          return handle(context, "$base ${raw.trim()}")
                      }
                  }

                  val text = normalize(raw)
                  val examWord = listOf("prova", "teste", "avaliacao", "simulado").any { it in text }
                  if (!examWord) return null

                  val query = listOf(
                      "quando e minha prova",
                      "quando eh minha prova",
                      "quando vai ser minha prova",
                      "qual dia e minha prova",
                      "que dia e minha prova",
                      "que horas e minha prova",
                      "minhas provas",
                      "proximas provas",
                  ).any { it in text }

                  if (query) return upcoming(context)

                  val create = text.contains("tenho prova") ||
                      text.contains("tenho teste") ||
                      text.contains("tenho avaliacao") ||
                      text.contains("tenho simulado") ||
                      text.contains("vai ter prova") ||
                      text.contains("minha prova e")

                  if (!create) return null

                  val hasDate = Regex("""\b(hoje|amanha|segunda|terca|quarta|quinta|sexta|sabado|domingo)\b""").containsMatchIn(text) ||
                      Regex("""\b\d{1,2}/\d{1,2}(?:/\d{2,4})?\b""").containsMatchIn(text) ||
                      Regex("""\bdia\s+\d{1,2}\b""").containsMatchIn(text)

                  val hasTime = Regex("""\b(?:as\s+)?\d{1,2}(?::\d{2}|h\d{0,2})?\s*(?:horas?)?\b""").containsMatchIn(text)

                  if (!hasDate || !hasTime) {
                      val missing = when {
                          !hasDate && !hasTime -> "data e horário"
                          !hasDate -> "data"
                          else -> "horário"
                      }

                      val data = JSONObject()
                          .put("base", raw.trim())
                          .put("missing", missing)
                          .toString()

                      GamaTaskStateStore.start(
                          context = context,
                          kind = "exam_calendar",
                          goal = "Registrar uma prova na agenda",
                          data = data,
                          prompt = "Qual é $missing?",
                      )
                      GamaTaskStateStore.transition(context, GamaTaskStateStore.State.WAITING_USER)

                      return if (missing == "data e horário") {
                          "Qual é o dia e o horário da prova?"
                      } else {
                          "Qual é a $missing da prova?"
                      }
                  }

                  val cleaned = raw
                      .replace(Regex("(?i)^\\s*gama[,:;.!?\\s-]*"), "")
                      .replace(Regex("(?i)^\\s*(?:eu\\s+)?tenho\\s+"), "")
                      .trim()

                  val result = GamaCalendarManager.handle(context, "marque $cleaned")
                      ?: return "Entendi a prova, mas não consegui converter a informação em um evento."

                  if (result.startsWith("Pronto", ignoreCase = true)) {
                      GamaTaskStateStore.complete(context, result)
                  }

                  return result
              }

              private fun upcoming(context: Context): String {
                  if (!GamaCalendarManager.hasReadPermission(context)) {
                      GamaCalendarManager.openPermissionScreen(context)
                      return "Preciso da permissão de calendário para procurar suas próximas provas."
                  }

                  val now = System.currentTimeMillis()
                  val end = Calendar.getInstance().apply {
                      timeInMillis = now
                      add(Calendar.DAY_OF_MONTH, 60)
                  }.timeInMillis

                  val uri = CalendarContract.Instances.CONTENT_URI.buildUpon().also {
                      ContentUris.appendId(it, now)
                      ContentUris.appendId(it, end)
                  }.build()

                  val projection = arrayOf(
                      CalendarContract.Instances.TITLE,
                      CalendarContract.Instances.BEGIN,
                  )

                  val exams = mutableListOf<Pair<Long, String>>()

                  runCatching {
                      context.contentResolver.query(
                          uri,
                          projection,
                          null,
                          null,
                          "${CalendarContract.Instances.BEGIN} ASC",
                      )?.use { cursor ->
                          val titleIndex = cursor.getColumnIndex(CalendarContract.Instances.TITLE)
                          val beginIndex = cursor.getColumnIndex(CalendarContract.Instances.BEGIN)

                          while (cursor.moveToNext()) {
                              val title = cursor.getString(titleIndex).orEmpty()
                              val normalized = normalize(title)

                              if (listOf("prova", "teste", "avaliacao", "simulado").any { it in normalized }) {
                                  exams += cursor.getLong(beginIndex) to title
                              }
                          }
                      }
                  }

                  if (exams.isEmpty()) return "Não encontrei nenhuma prova marcada nos próximos sessenta dias."

                  val formatter = SimpleDateFormat("EEEE, dd/MM 'às' HH:mm", Locale("pt", "BR"))
                  val descriptions = exams.take(4).map { (time, title) ->
                      "$title em ${formatter.format(Date(time))}"
                  }

                  return "Suas próximas provas são: ${descriptions.joinToString("; ")}."
              }

              private fun normalize(value: String): String =
                  Normalizer.normalize(value.lowercase(Locale("pt", "BR")), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}+"), "")
                      .replace(Regex("[^a-z0-9:/ ]+"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
          }
