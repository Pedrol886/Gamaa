name: Build Zevron 1.0 FIX102 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write

concurrency:
  group: zevron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    env:
      # Run #92. Compilou o APK e deixou somente 2 testes falhando.
      FIX101_COMMIT: a3feb7aeb8983c6fdf7fe9eab44bfeb75170358b

      FIX99_COMMIT: f0b431456536578a079380430e28e084fdd31819
      FIX98_COMMIT: bf1b2d549ce2973a607dc09ce57931857b3dfb90
      FIX93_COMMIT: 9921e17c918a2ea358ade085c05b06af85d0b7fb
      FIX97_COMMIT: 1e349c21c1fd344f357f8c84cf656f9ba0565a45

      GAMA_67_COMMIT: 87d85998667f9e51e39860991398a2e31cd5f3c7
      GAMA_43_COMMIT: ae7f8993cad81d749ffdf04dfc84d828705b1a1a

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # CARREGA O FIX101 DO RUN #92
      # ============================================================

      - name: Load FIX101 workflow
        run: |
          set -euo pipefail

          git cat-file -e "${FIX101_COMMIT}^{commit}"
          git cat-file -e "${FIX99_COMMIT}^{commit}"
          git cat-file -e "${FIX98_COMMIT}^{commit}"
          git cat-file -e "${FIX93_COMMIT}^{commit}"
          git cat-file -e "${FIX97_COMMIT}^{commit}"
          git cat-file -e "${GAMA_67_COMMIT}^{commit}"
          git cat-file -e "${GAMA_43_COMMIT}^{commit}"

          git show \
            "${FIX101_COMMIT}:.github/workflows/build-gama.yml" \
            > /tmp/fix101.yml

          test -s \
            /tmp/fix101.yml

          grep -Fq \
            'Build Zevron 1.0 FIX101 APK' \
            /tmp/fix101.yml

          grep -Fq \
            'FIX101 repair Zevron math parser' \
            /tmp/fix101.yml

          grep -Fq \
            'FIX101 migrate legacy command tests' \
            /tmp/fix101.yml

          echo \
            "FIX101 do run #92 carregado." \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # RUNNER DE ETAPAS HISTÓRICAS
      # ============================================================

      - name: Create historical step runner
        run: |
          set -euo pipefail

          cat > /tmp/run_historical_step.py <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys

          if len(sys.argv) != 3:
              raise SystemExit(
                  "Uso: run_historical_step.py WORKFLOW STEP"
              )

          workflow_path = Path(
              sys.argv[1]
          )

          step_name = sys.argv[2]

          if not workflow_path.is_file():
              raise SystemExit(
                  f"Workflow não encontrado: {workflow_path}"
              )

          workflow = workflow_path.read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              r"^      - name: "
              + re.escape(step_name)
              + r"\n(?P<body>.*?)(?=^      - name: |\Z)",
              re.MULTILINE | re.DOTALL,
          )

          match = pattern.search(
              workflow
          )

          if match is None:
              raise SystemExit(
                  f"Etapa não encontrada: {step_name}"
              )

          body = match.group(
              "body"
          )

          working_directory = None

          wd = re.search(
              r"^        working-directory:\s*(.+?)\s*$",
              body,
              re.MULTILINE,
          )

          if wd:
              working_directory = (
                  wd.group(1)
                  .strip()
              )

          lines = body.splitlines()

          run_start = None

          for index, line in enumerate(
              lines
          ):
              if line.strip() == "run: |":
                  run_start = index + 1
                  break

          if run_start is None:
              raise SystemExit(
                  f"run não encontrado: {step_name}"
              )

          script_lines = []

          for line in lines[run_start:]:

              if line.strip() == "":
                  script_lines.append("")
                  continue

              if not line.startswith(
                  "          "
              ):
                  break

              script_lines.append(
                  line[10:]
              )

          script = (
              "\n".join(
                  script_lines
              )
              + "\n"
          )

          if not script.strip():
              raise SystemExit(
                  f"Script vazio: {step_name}"
              )

          root = Path.cwd()

          cwd = root

          if working_directory:
              cwd = (
                  root /
                  working_directory
              )

          if not cwd.exists():
              raise SystemExit(
                  f"Diretório ausente para {step_name}: {cwd}"
              )

          print()
          print("=" * 76)
          print("Executando:", step_name)
          print("Diretório:", cwd)
          print("=" * 76)

          result = subprocess.run(
              [
                  "bash",
                  "-euo",
                  "pipefail",
                  "-c",
                  script,
              ],
              cwd=str(cwd),
              env=os.environ.copy(),
          )

          if result.returncode != 0:
              raise SystemExit(
                  f"{step_name} falhou: {result.returncode}"
              )
          PY

          python3 -m py_compile \
            /tmp/run_historical_step.py

      # ============================================================
      # RECONSTRÓI O MESMO SOURCE DO RUN #92
      #
      # Todas essas etapas JÁ passaram no #92.
      # ============================================================

      - name: Rebuild verified FIX101 source
        run: |
          set -euo pipefail

          STEPS=(
            "Load FIX99 source workflow"
            "Create stable step runner"
            "Load FIX98 workflow"
            "Create previous workflow runner"
            "Prepare historical stable sources"
            "Create FIX93 workflow runner"
            "Restore exact stable Gama base"
            "Apply stable runtime and anti-noise"
            "Apply stable FIX93"
            "Install Zevron core"
            "Apply verified Kotlin return fix"
            "FIX101 repair Zevron math parser"
            "FIX101 migrate legacy command tests"
            "Add FIX101 regression tests"
            "Verify Zevron conversation rules"
          )

          for step in "${STEPS[@]}"; do

            python3 \
              /tmp/run_historical_step.py \
              /tmp/fix101.yml \
              "$step"

          done

          PKG="_gama_build/app/src/main/java/com/gama/assistant"

          REQUIRED=(
            "_gama_build/app/build.gradle.kts"
            "_gama_build/app/src/main/AndroidManifest.xml"
            "$PKG/GamaService.kt"
            "$PKG/ConversationSession.kt"
            "$PKG/GamaTimePolicy.kt"
            "$PKG/ZevronConversationEngine.kt"
            "$PKG/ZevronMathTool.kt"
            "$PKG/ZevronAppTool.kt"
            "$PKG/ZevronCalendarFlow.kt"
            "$PKG/ZevronLocalRouter.kt"
            "_gama_build/tools/download_models.sh"
          )

          for file in "${REQUIRED[@]}"; do

            if [ ! -s "$file" ]; then
              echo \
                "::error::Arquivo obrigatório ausente: $file"
              exit 1
            fi

          done

          echo \
            "Source exato do FIX101 reconstruído." \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # FIX102
      #
      # FALHA 1 DO #92:
      #
      # ConversationSession.isGoodbye(
      #     "Zevron, pode descansar"
      # )
      #
      # ainda possuía regras com "gama".
      #
      # Agora removemos o nome do assistente antes de analisar
      # o comando. Mantemos "gama" como compatibilidade interna.
      # ============================================================

      - name: FIX102 repair conversation goodbye
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/gama/assistant/ConversationSession.kt"
          )

          source = path.read_text(
              encoding="utf-8"
          )

          function_start = source.find(
              "fun isGoodbye("
          )

          if function_start < 0:
              raise SystemExit(
                  "ConversationSession.isGoodbye não encontrado."
              )

          marker = (
              '.replace(Regex("\\\\s+"), " ").trim()'
          )

          marker_position = source.find(
              marker,
              function_start
          )

          if marker_position < 0:
              raise SystemExit(
                  "Normalização de isGoodbye não encontrada."
              )

          insert_at = (
              marker_position
              + len(marker)
          )

          tail = source[
              insert_at:
              insert_at + 300
          ]

          if (
              '.removePrefix("zevron ")'
              not in tail
          ):

              addition = '''
                .removePrefix("zevron ")
