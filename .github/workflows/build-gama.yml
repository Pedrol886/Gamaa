      - name: Verify final APK metadata and package size
        working-directory: _gama_build
        run: |
          set -euo pipefail
          test -s dist/Gama.apk
          test -s dist/Gama.apk.sha256
          test -s dist/apk-info.txt
          test -s dist/install-mode.txt
          test -s dist/signing-cert-sha256.txt
          grep -q "name='com.gama.assistant'" dist/apk-info.txt
          grep -q "versionCode='2030" dist/apk-info.txt
          grep -q "versionName='Gama 6.0'" dist/apk-info.txt
          (cd dist && sha256sum -c Gama.apk.sha256)
          apk_bytes="$(wc -c < dist/Gama.apk)"
          test "$apk_bytes" -gt 1000000
          echo "APK bytes: $apk_bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "Install mode: $(cat dist/install-mode.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "Brain process: isolated :gama_brain with Binder death supervision" >> "$GITHUB_STEP_SUMMARY"
          echo "Main process: no killProcess / no stopSelf in GamaService" >> "$GITHUB_STEP_SUMMARY"
          echo "Microphone: worker recovery + progressive backoff watchdog" >> "$GITHUB_STEP_SUMMARY"
          echo "Voice: exact installed voice selection can be persisted" >> "$GITHUB_STEP_SUMMARY"
          echo "Intro: native Canvas particle formation preserved and densified" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/install-mode.txt
            _gama_build/dist/signing-cert-sha256.txt
            _gama_build/dist/signature-info.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-6.0-FIX88-tests
          path: |
            _gama_build/app/build/reports/tests
