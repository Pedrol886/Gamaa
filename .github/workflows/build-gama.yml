          cat > "$SRC/AssistantStateController.kt" <<'KOTLIN'
          package com.gama.assistant

          object AssistantStateController {
              enum class State {
                  SLEEPING,
                  WAKE_DETECTED,
                  AWAITING_SPEECH,
                  LISTENING,
                  ENDPOINT_PENDING,
                  THINKING,
                  PLANNING,
                  EXECUTING_ACTION,
                  VERIFYING,
                  SPEAKING,
                  FOLLOW_UP_LISTENING,
                  RECOVERING,
              }

              @Volatile
              private var current =
                  State.SLEEPING

              fun state():
                  State =
                  current

              @Synchronized
              fun transition(
                  next: State
              ): State {
                  current =
                      next

                  return current
              }

              @Synchronized
              fun sleep() {
                  current =
                      State.SLEEPING
              }
          }
          KOTLIN

          cat > "$SRC/GamaSupervisor.kt" <<'KOTLIN'
          package com.gama.assistant

          object GamaSupervisor {
              enum class State {
                  SLEEPING,
                  WAKE_DETECTED,
                  AWAITING_SPEECH,
                  LISTENING,
                  ENDPOINT_PENDING,
                  THINKING,
                  PLANNING,
                  EXECUTING_ACTION,
                  VERIFYING,
                  SPEAKING,
                  FOLLOW_UP_LISTENING,
                  RECOVERING,
              }

              fun state():
                  State =
                  State.valueOf(
                      AssistantStateController
                          .state()
                          .name
                  )

              fun onWakeDetected() {
                  transition(
                      State.WAKE_DETECTED
                  )
              }

              fun onWakeAccepted() {
                  transition(
                      State.AWAITING_SPEECH
                  )
              }

              fun onAwaitingSpeech() {
                  transition(
                      State.AWAITING_SPEECH
                  )
              }

              fun onListening() {
                  ifAwake(
                      State.LISTENING
                  )
              }

              fun onEndpointPending() {
                  ifAwake(
                      State.ENDPOINT_PENDING
                  )
              }

              fun onThinking() {
                  ifAwake(
                      State.THINKING
                  )
              }

              fun onPlanning() {
                  ifAwake(
                      State.PLANNING
                  )
              }

              fun onExecuting() {
                  ifAwake(
                      State.EXECUTING_ACTION
                  )
              }

              fun onVerifying() {
                  ifAwake(
                      State.VERIFYING
                  )
              }

              fun onSpeaking() {
                  ifAwake(
                      State.SPEAKING
                  )
              }

              fun onFollowUpListening() {
                  ifAwake(
                      State.FOLLOW_UP_LISTENING
                  )
              }

              fun onRecovering() {
                  ifAwake(
                      State.RECOVERING
                  )
              }

              fun onConversationClosed() {
                  AssistantStateController
                      .sleep()
              }

              fun acceptWake(
                  text: String,
                  sessionActive: Boolean,
                  voiceEvidence: Boolean,
              ): Boolean =
                  !sessionActive &&
                      voiceEvidence &&
                      VoicePolicy.hasWake(
                          text
                      )

              fun acceptGoodbye(
                  text: String,
                  sessionActive: Boolean,
                  voiceEvidence: Boolean,
                  finalEndpoint: Boolean,
              ): Boolean =
                  sessionActive &&
                      finalEndpoint &&
                      voiceEvidence &&
                      ConversationSession
                          .isGoodbye(
                              text
                          )

              fun maySpeakProactively(
                  sessionActive: Boolean,
                  eventAgeMs: Long,
              ): Boolean =
                  sessionActive &&
                      eventAgeMs in
                      0L..20_000L

              fun shouldDrainProactiveQueue(
                  sessionActive: Boolean
              ): Boolean =
                  sessionActive

              private fun transition(
                  state: State
              ) {
                  AssistantStateController
                      .transition(
                          AssistantStateController
                              .State
                              .valueOf(
                                  state.name
                              )
                      )
              }

              private fun ifAwake(
                  state: State
              ) {
                  if (
                      this.state() !=
                      State.SLEEPING
                  ) {
                      transition(
                          state
                      )
                  }
              }
          }
