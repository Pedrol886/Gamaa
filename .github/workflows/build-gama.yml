name: Build Gama 10.5.0 UNIFIED172 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-gama.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-unified172-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    env:
      GAMA_BASE_RUN_ID: "37317067822"
      GAMA_BASE_ARTIFACT: "Gama-10.4.2-NATURAL171-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore exact NATURAL171 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download \
            "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -x _gama_build/gradlew
          grep -Fq 'versionName = "Gama 10.4.2 Natural Voice Core"' _gama_build/app/build.gradle.kts

      - name: Baseline integrity guard
        working-directory: _gama_build
        run: |
          set -euo pipefail
          BASE_KT_FILES="$(find app/src/main/java/com/gama/assistant -maxdepth 1 -type f -name '*.kt' | wc -l | tr -d ' ')"
          BASE_KT_LINES="$(cat app/src/main/java/com/gama/assistant/*.kt | wc -l | tr -d ' ')"

          if [ "$BASE_KT_FILES" -lt 130 ]; then
            echo "::error::Base incompleta: apenas $BASE_KT_FILES arquivos Kotlin."
            exit 1
          fi

          if [ "$BASE_KT_LINES" -lt 29000 ]; then
            echo "::error::Base reduzida: apenas $BASE_KT_LINES linhas Kotlin."
            exit 1
          fi

          echo "BASE_KT_FILES=$BASE_KT_FILES" >> "$GITHUB_ENV"
          echo "BASE_KT_LINES=$BASE_KT_LINES" >> "$GITHUB_ENV"
          echo "PASS: base preservada com $BASE_KT_FILES arquivos e $BASE_KT_LINES linhas Kotlin."

      - name: Apply Unified Brain Gemini patch
