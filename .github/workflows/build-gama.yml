name: Build Gama 10.5.1 MONOLITH173 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-gama.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-monolith173-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Monolith workflow guard
        run: |
          set -euo pipefail
          WORKFLOW=".github/workflows/build-gama.yml"
          test -s "$WORKFLOW"
          WORKFLOW_LINES="$(wc -l < "$WORKFLOW" | tr -d ' ')"
          if [ "$WORKFLOW_LINES" -lt 7000 ]; then
            echo "::error::Workflow monolítico foi reduzido para $WORKFLOW_LINES linhas."
            exit 1
          fi
          if grep -Fq 'gh run download' "$WORKFLOW"; then
            echo "::error::Este workflow não pode baixar a base do Gama de artifact antigo."
            exit 1
          fi
          echo "PASS: workflow monolítico com $WORKFLOW_LINES linhas e sem restore externo."

      - name: Materialize complete embedded Gama source
