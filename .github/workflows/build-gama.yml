          if count != 1:
              raise SystemExit('versionName Gama 4.8 não encontrado.')
          gradle.write_text(g, encoding='utf-8')

          main = Path('app/src/main/java/com/gama/assistant/MainActivity.kt')
          if main.is_file():
              main.write_text(main.read_text(encoding='utf-8').replace('Gama 4.8', 'Gama 4.9'), encoding='utf-8')

          energy = r'''package com.gama.assistant
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.*
          import android.util.AttributeSet
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.sin

          class GamaEnergyView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {
              enum class Mode { LISTENING, THINKING, SPEAKING }
              var mode: Mode = Mode.LISTENING
                  set(value) { field = value; invalidate() }
              private var phase = 0f
              private var released = false
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND }
              private val fill = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val dots = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val animator = ValueAnimator.ofFloat(0f, 1f).apply {
                  duration = 1450L
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener { phase = it.animatedValue as Float; invalidate() }
              }
              init { setLayerType(LAYER_TYPE_SOFTWARE, null); animator.start() }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val size = minOf(width, height).toFloat()
                  if (size <= 0f) return
                  val cx = width / 2f; val cy = height / 2f; val t = phase * PI * 2.0
                  val activity = when (mode) { Mode.LISTENING -> .55f; Mode.THINKING -> .72f; Mode.SPEAKING -> 1f }
                  val pulse = (.5 + .5 * sin(t * if (mode == Mode.SPEAKING) 3.0 else 1.4)).toFloat()
                  line.setShadowLayer((size * .055f).coerceAtLeast(3f), 0f, 0f, Color.rgb(255,132,36))
                  fill.color = Color.argb((24 + 28 * pulse).toInt(),255,132,36)
                  canvas.drawCircle(cx, cy, size * (.19f + .02f * pulse), fill)
                  val points = if (size < resources.displayMetrics.density * 140f) 76 else 132
                  for (ringIndex in 0 until 5) {
            val base = size * (.29f + ringIndex * .035f)
            val ratio = when (mode) { Mode.LISTENING -> .017f; Mode.THINKING -> .026f; Mode.SPEAKING -> .044f }
            val amp = size * ratio * (.66f + pulse * .55f) * (1f - ringIndex * .07f)
            val path = Path()
            for (i in 0..points) {
                val a = i.toDouble() / points * PI * 2.0
                val wobble = sin(a * (3.0 + ringIndex) + t * (1.0 + ringIndex * .18)) * amp +
                    sin(a * 7.0 - t * 1.8 + ringIndex) * amp * .34
                val r = base + wobble.toFloat()
                val x = cx + cos(a).toFloat() * r; val y = cy + sin(a).toFloat() * r
                if (i == 0) path.moveTo(x,y) else path.lineTo(x,y)
            }
            path.close()
            line.strokeWidth = size * (.0043f + (4 - ringIndex) * .00042f)
            line.color = Color.argb((92 + activity * 105 - ringIndex * 8).toInt().coerceIn(40,220),255,144,45)
            canvas.drawPath(path,line)
                  }
                  if (mode == Mode.THINKING) {
            dots.color = Color.rgb(255,188,94)
            val orbit = size * .40f; val radius = (size * .011f).coerceAtLeast(1.8f)
            for (i in 0 until 4) {
                val a = t * 1.55 + i * PI / 2.0
                canvas.drawCircle(cx + cos(a).toFloat()*orbit, cy + sin(a).toFloat()*orbit, radius, dots)
            }
                  }
              }
              fun release() { if (!released) { released = true; animator.cancel() } }
              override fun onDetachedFromWindow() { release(); super.onDetachedFromWindow() }
          }
          '''
