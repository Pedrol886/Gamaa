          # ============================================================
          # CORRECT MOUTH ANIMATION
          # ==============================================================

          cat > "$SRC/GamaEnergyView.kt" <<'KOTLIN'
          package com.gama.assistant

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.RectF
          import android.util.AttributeSet
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.sin

          class GamaEnergyView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null,
          ) : View(
              context,
              attrs,
          ) {
              enum class Mode {
                  LISTENING,
                  THINKING,
                  SPEAKING,
              }

              var mode:
                  Mode =
                  Mode.LISTENING
                  set(value) {
                      field =
                          value
                      invalidate()
                  }

              private val logo:
                  Bitmap =
                  BitmapFactory
                      .decodeResource(
                          resources,
                          R.drawable
                              .gama_red_core,
                      )

              private val bitmapPaint =
                  Paint(
                      Paint.ANTI_ALIAS_FLAG or
                          Paint.FILTER_BITMAP_FLAG
                  )

              private val glowPaint =
                  Paint(
                      Paint.ANTI_ALIAS_FLAG
                  )

              private val ringPaint =
                  Paint(
                      Paint.ANTI_ALIAS_FLAG
                  ).apply {
                      style =
                          Paint.Style.STROKE
                  }

              private var phase =
                  0f

              private var released =
                  false

              private val animator =
                  ValueAnimator
                      .ofFloat(
                          0f,
                          1f,
                      )
                      .apply {
                          duration =
                              1_000L

                          repeatCount =
                              ValueAnimator
                                  .INFINITE

                          interpolator =
                              LinearInterpolator()

                          addUpdateListener {
                              phase =
                                  it.animatedValue
                                      as Float

                              invalidate()
                          }
                      }

              init {
                  setLayerType(
                      LAYER_TYPE_SOFTWARE,
                      null,
                  )

                  animator.start()
              }

              override fun onDraw(
                  canvas: Canvas
              ) {
                  super.onDraw(
                      canvas
                  )

                  if (
                      width <= 0 ||
                      height <= 0 ||
                      logo.width <= 0 ||
                      logo.height <= 0
                  ) {
                      return
                  }

                  val size =
                      minOf(
                          width,
                          height,
                      )
                          .toFloat()

                  val radians =
                      phase *
                          (
                              PI *
                                  2.0
                              )

                  val speechWave =
                      (
                          abs(
                              sin(
                                  radians *
                                      3.0
                              )
                          ) *
                              0.48 +
                              abs(
                                  sin(
                                      radians *
                                          5.4 +
                                          0.72
                                  )
                              ) *
                              0.34 +
                              abs(
                                  sin(
                                      radians *
                                          7.7 +
                                          1.3
                                  )
                              ) *
                              0.18
                          )
                          .toFloat()
                          .coerceIn(
                              0f,
                              1f,
                          )

                  val statePulse =
                      when (
                          mode
                      ) {
                          Mode.LISTENING ->
                              (
                                  0.5 +
                                      0.5 *
                                      sin(
                                          radians *
                                              1.2
                                      )
                                  )
                                  .toFloat()

                          Mode.THINKING ->
                              (
                                  0.5 +
                                      0.5 *
                                      sin(
                                          radians *
                                              1.9
                                      )
                                  )
                                  .toFloat()

                          Mode.SPEAKING ->
                              speechWave
                      }

                  val cx =
                      width /
                          2f

                  val cy =
                      height /
                          2f

                  glowPaint.style =
                      Paint.Style.FILL

                  glowPaint.color =
                      Color.argb(
                          when (
                              mode
                          ) {
                              Mode.LISTENING ->
                                  40

                              Mode.THINKING ->
                                  65

                              Mode.SPEAKING ->
                                  82
                          },
                          225,
                          20,
                          32,
                      )

                  glowPaint.setShadowLayer(
                      size *
                          0.12f,
                      0f,
                      0f,
                      Color.rgb(
                          180,
                          10,
                          20,
                      ),
                  )

                  canvas.drawCircle(
                      cx,
                      cy,
                      size *
                          (
                              0.40f +
                                  0.014f *
                                  statePulse
                              ),
                      glowPaint,
                  )

                  glowPaint.clearShadowLayer()

                  val scale =
                      minOf(
                          width *
                              0.91f /
                              logo.width
                                  .toFloat(),

                          height *
                              0.91f /
                              logo.height
                                  .toFloat(),
                      )

                  val drawWidth =
                      logo.width *
                          scale

                  val drawHeight =
                      logo.height *
                          scale

                  val left =
                      cx -
                          drawWidth /
                              2f

                  val top =
                      cy -
                          drawHeight /
                              2f

                  /*
                   * Esta é SOMENTE a pequena peça vermelha inferior
                   * marcada pelo usuário como a boca.
                   *
                   * O focinho e a cabeça permanecem imóveis.
                   */
                  val mouthLeftPx =
                      (
                          logo.width *
                              0.465f
                          )
                          .toInt()

                  val mouthRightPx =
                      (
                          logo.width *
                              0.575f
                          )
                          .toInt()

                  val mouthTopPx =
                      (
                          logo.height *
                              0.825f
                          )
                          .toInt()

                  val mouthBottomPx =
                      (
                          logo.height *
                              0.945f
                          )
                          .toInt()

                  drawRegion(
                      canvas,
                      Rect(
                          0,
                          0,
                          logo.width,
                          mouthTopPx,
                      ),
                      RectF(
                          left,
                          top,
                          left +
                              drawWidth,
                          top +
                              mouthTopPx *
                              scale,
                      ),
                  )

                  drawRegion(
                      canvas,
                      Rect(
                          0,
                          mouthTopPx,
                          mouthLeftPx,
                          mouthBottomPx,
                      ),
                      RectF(
                          left,
                          top +
                              mouthTopPx *
                              scale,
                          left +
                              mouthLeftPx *
                              scale,
                          top +
                              mouthBottomPx *
                              scale,
                      ),
                  )

                  drawRegion(
                      canvas,
                      Rect(
                          mouthRightPx,
                          mouthTopPx,
                          logo.width,
                          mouthBottomPx,
                      ),
                      RectF(
                          left +
                              mouthRightPx *
                              scale,
                          top +
                              mouthTopPx *
                              scale,
                          left +
                              drawWidth,
                          top +
                              mouthBottomPx *
                              scale,
                      ),
                  )

                  drawRegion(
                      canvas,
                      Rect(
                          0,
                          mouthBottomPx,
                          logo.width,
                          logo.height,
                      ),
                      RectF(
                          left,
                          top +
                              mouthBottomPx *
                              scale,
                          left +
                              drawWidth,
                          top +
                              drawHeight,
                      ),
                  )

                  val mouthLift =
                      if (
                          mode ==
                          Mode.SPEAKING
                      ) {
                          drawHeight *
                              0.050f *
                              speechWave
                      } else {
                          0f
                      }

                  drawRegion(
                      canvas,
                      Rect(
                          mouthLeftPx,
                          mouthTopPx,
                          mouthRightPx,
                          mouthBottomPx,
                      ),
                      RectF(
                          left +
                              mouthLeftPx *
                              scale,

                          top +
                              mouthTopPx *
                              scale -
                              mouthLift,

                          left +
                              mouthRightPx *
                              scale,

                          top +
                              mouthBottomPx *
                              scale -
                              mouthLift,
                      ),
                  )

                  ringPaint.strokeWidth =
                      (
                          size *
                              0.010f
                          )
                          .coerceAtLeast(
                              2f
                          )

                  ringPaint.color =
                      Color.argb(
                          when (
                              mode
                          ) {
                              Mode.LISTENING ->
                                  100

                              Mode.THINKING ->
                                  145

                              Mode.SPEAKING ->
                                  180
                          },
                          245,
                          35,
                          48,
                      )

                  canvas.drawCircle(
                      cx,
                      cy,
                      size *
                          (
                              0.445f +
                                  0.006f *
                                  statePulse
                              ),
                      ringPaint,
                  )
              }

              private fun drawRegion(
                  canvas: Canvas,
                  source: Rect,
                  destination: RectF,
              ) {
                  if (
                      source.width() <=
                      0 ||
                      source.height() <=
                      0 ||
                      destination.width() <=
                      0f ||
                      destination.height() <=
                      0f
                  ) {
                      return
                  }

                  canvas.drawBitmap(
                      logo,
                      source,
                      destination,
                      bitmapPaint,
                  )
              }

              fun release() {
                  if (
                      !released
                  ) {
                      released =
                          true

                      animator.cancel()
                  }
              }

              override fun onDetachedFromWindow() {
                  release()

                  super
                      .onDetachedFromWindow()
              }
          }
