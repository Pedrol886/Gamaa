name: Build Gama 8.0.1 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-8-0-1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GAMA_BASE_RUN_ID: "37030299438"
      GAMA_BASE_ARTIFACT: "Gama-JARVIS-FILM-CORE-FIX110-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure complete Gama source exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s app/build.gradle.kts ]; then
            echo "Projeto Android ausente no repositório; restaurando a última base que compilou."
            gh run download "$GAMA_BASE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$GAMA_BASE_ARTIFACT" \
              --dir .
          fi
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/gama/assistant/GamaService.kt
          test -s app/src/main/java/com/gama/assistant/VoicePolicy.kt
          test -s settings.gradle.kts
          test -s build.gradle.kts

      - name: Apply consolidated Gama 8 voice core
        run: |
          set -euo pipefail
          if grep -Fq 'private var wakeRecognizer: Recognizer? = null' app/src/main/java/com/gama/assistant/GamaService.kt; then
            echo "Gama 8 voice core already present."
          else
            printf '%s' '' | base64 -d | xz -d > /tmp/gama8.patch
            echo "5126d9e69c954f0df4a1bc62335912acc1705a933f24664c9aa66cc60a90b91a  /tmp/gama8.patch" | sha256sum -c -
            patch -p1 --batch --forward < /tmp/gama8.patch
          fi
          grep -Fq 'private var wakeRecognizer: Recognizer? = null' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'Recognizer(model, SAMPLE_RATE.toFloat(), "[\"gama\", \"gamma\", \"[unk]\"]")' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'textMode || !running' app/src/main/java/com/gama/assistant/GamaService.kt

      - name: Audit consolidated capabilities inline
        run: |
          set -euo pipefail
          PKG="app/src/main/java/com/gama/assistant"
          test -s "$PKG/GamaMissionStore.kt"
          test -s "$PKG/GamaConversationRepair.kt"
          test -s "$PKG/GamaSystemAwareness.kt"
          test -s "$PKG/ZevronPlanner.kt"
          grep -Fq 'android.permission.WRITE_CALENDAR' app/src/main/AndroidManifest.xml
          grep -Fq 'GamaMissionStore' "$PKG/GamaService.kt"
          grep -Fq 'GamaConversationRepair' "$PKG/GamaService.kt"
          grep -Fq 'GamaSystemAwareness' "$PKG/GamaService.kt"
          grep -Fq 'interruptSpeechForBargeIn' "$PKG/GamaService.kt"
          grep -Fq 'wakeRecognizer' "$PKG/GamaService.kt"
          echo "Gama 8.0.1 consolidated capability audit passed."

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Gama 8.0.1 version
        run: |
          set -euo pipefail
          VC=$((22100000 + GITHUB_RUN_NUMBER))
          sed -Ei "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $VC/" app/build.gradle.kts
          sed -Ei 's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "Gama 8.0.1"/' app/build.gradle.kts
          grep -F 'versionName = "Gama 8.0.1"' app/build.gradle.kts

      - name: Run critical unit tests
        continue-on-error: true
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests 'com.gama.assistant.VoicePolicyTest' \
            --tests 'com.gama.assistant.ConversationSessionTest' \
            --tests 'com.gama.assistant.ZevronPlannerTest' \
            --tests 'com.gama.assistant.ZevronContextResolverTest' \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-critical-tests.log"

      - name: Build Gama 8.0.1 APK
        run: |
          set -euo pipefail
          if [ -x tools/download_models.sh ]; then bash tools/download_models.sh; fi
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" dist/Gama.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Gama.apk
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)

      - name: Upload Gama 8.0.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.0.1-APK
          path: |
            dist/Gama.apk
            dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Publish Gama 8.0.1 release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="gama-v8.0.1-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "dist/Gama.apk#Gama.apk" \
            "dist/Gama.apk.sha256#Gama.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 8.0.1" \
            --notes "Correção do #117: restaura automaticamente a base compilável quando o projeto Android não foi enviado ao repositório, reaplica o núcleo consolidado Gama 8 e gera o APK." \
            --latest

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.0.1-diagnostics
          path: |
            gama-build.log
            gama-critical-tests.log
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: warn
