      - name: Fix WhatsApp colon parser regression
        run: |
          set -euo pipefail
          python3 - <<'PY_FIX88'
          from pathlib import Path

          parser = Path("_gama_build/app/src/main/java/com/gama/assistant/GamaWhatsAppSendParser.kt")
          if not parser.is_file():
              raise SystemExit("GamaWhatsAppSendParser.kt não encontrado.")

          source = parser.read_text(encoding="utf-8")
          wrong = ':\\\\s*(.+)$"""),'
          correct = ':\\s*(.+)$"""),'

          if wrong not in source:
              if correct in source:
                  print("FIX88 já estava aplicado.")
              else:
                  raise SystemExit("Padrão de dois-pontos do WhatsApp não encontrado para correção.")
          else:
              source = source.replace(wrong, correct, 1)
              parser.write_text(source, encoding="utf-8")

          check = parser.read_text(encoding="utf-8")
          if wrong in check:
              raise SystemExit("Regex antigo ainda presente após FIX88.")
          if correct not in check:
              raise SystemExit("Regex corrigido não foi encontrado após FIX88.")

          print("FIX88 WhatsApp colon parser correction applied.")
          PY_FIX88

