              r'''private fun openKnownAppFastLane(
                      command: String,
                      sequence: Long,
                  ): Boolean {
                      val app =
                          GamaAppRegistry
                              .resolveOpenRequest(
                                  command
                              )
                              ?: return false

                      if (isDeviceLocked()) {
                          pendingCommand.set(
                              command,
