          grep -Fq \
            'getInstalledApplications' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'isDebuggable = false' \
            app/build.gradle.kts

          grep -Fq \
            'versionName = "Gama 10.3.0 Personal Android Core"' \
            app/build.gradle.kts

          echo "PASS: auditoria estrutural concluída."

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          test -d "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Gradle wrapper
        working-directory: _gama_build
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            gradle wrapper \
              --gradle-version 8.9
          fi

          chmod +x gradlew

          ./gradlew --version

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./
