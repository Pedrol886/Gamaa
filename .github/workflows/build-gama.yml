      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Portuguese offline speech model
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip" \
            -o /tmp/vosk.zip
          rm -rf /tmp/vosk app/src/main/assets/model
          mkdir -p /tmp/vosk
          unzip -q /tmp/vosk.zip -d /tmp/vosk
          mv /tmp/vosk/vosk-model-small-pt-0.3 app/src/main/assets/model

      - name: Verify AndroidX config
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^android.useAndroidX=true$' gradle.properties
          grep -q '^android.enableJetifier=true$' gradle.properties

      - name: Build APK
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Gama-Orb.apk
          ls -lh Gama-Orb.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gama-Orb-APK
          path: Gama-Orb.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="gama-${{ github.run_number }}"
          gh release create "$TAG" Gama-Orb.apk \
            --title "Gama Orb $TAG" \
            --notes "Gama v23 estável: removido pré-carregamento pesado do Gemma para evitar falhas contínuas; humanoide usa quadros menores e pré-carregados; avatar permanece durante a conversa bloqueada; wake Gama aceita variações do Vosk; comandos de baixa confiança pedem repetição; seleção de voz masculina em português foi ampliada; pesquisa rápida e recuperação do microfone mantidas."Gama" mais tolerante; pesquisa com timeout equilibrado; recuperação de falhas mantida; seleção de voz masculina reforçada quando o aparelho disponibiliza uma voz pt-BR masculina."Gama"; pesquisas genéricas vão direto para Wikipedia em thread separada; timeouts menores; cérebro local é pré-aquecido e responde em segundo plano; tela apagada e logo na tela bloqueada mantidas."
