name: Build Gama 10.0.0 JARVIS Context Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-10-jarvis-context-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      GAMA_BASE_RUN_ID: "37223023380"
      GAMA_BASE_ARTIFACT: "Gama-9.5.0-PERSONAL-INTELLIGENCE-source"
      GAMA_EXPECTED_CERT_SHA256: "6933EDA890C29567A8F4B6CEAD7A39A442DF109D43B813A19F3F6FA7F39B078C"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-10.0.0-JARVIS-CONTEXT-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"
            echo "::warning::GAMA_SIGNING_SEED não está configurado."
            echo "::warning::O APK será Release, mas será FRESH-INSTALL-ONLY."
          elif printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-10.0.0-JARVIS-CONTEXT-APK" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GAMA_SIGNING_SEED deve possuir exatamente 64 caracteres hexadecimais."
            exit 1
          fi
      - name: Restore exact successful FIX154 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download \
            "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaPersonalCore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/ZevronMathTool.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/ZevronJarvisCore.kt
          test -s _gama_build/tools/download_models.sh

          grep -Fq \
            'versionName = "Gama 9.5.0 Personal Intelligence Core"' \
            _gama_build/app/build.gradle.kts

          grep -Fq \
            'isDebuggable = false' \
            _gama_build/app/build.gradle.kts

          echo "PASS: fonte verde do run #155/FIX154 restaurada."
      - name: Apply Gama 10 JARVIS intelligence upgrade
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PYUP'
          from pathlib import Path
          import base64

          def decode(value: str) -> str:
              return base64.b64decode(value.encode('ascii')).decode('utf-8')

          def write_b64(path: str, data: str) -> None:
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(decode(data), encoding='utf-8')

          def replace_once(path: str, old_b64: str, new_b64: str, label: str) -> None:
              p = Path(path)
              value = p.read_text(encoding='utf-8')
              old = decode(old_b64)
              new = decode(new_b64)
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              p.write_text(value.replace(old, new, 1), encoding='utf-8')

          write_b64('app/src/main/java/com/gama/assistant/GamaSpokenNumbers.kt', '')
          write_b64('app/src/main/java/com/gama/assistant/GamaRepeatTool.kt', '')
          write_b64('app/src/main/java/com/gama/assistant/GamaKnowledgePolicy.kt', '')
          write_b64('app/src/main/java/com/gama/assistant/ContextSanityCheck.kt', '')
          write_b64('app/src/main/java/com/gama/assistant/ZevronLocalRouter.kt', '')
          write_b64('app/src/main/java/com/gama/assistant/ZevronMathTool.kt', '')
          write_b64('app/src/test/java/com/gama/assistant/GamaSpokenNumbersTest.kt', '')
          write_b64('app/src/test/java/com/gama/assistant/GamaRepeatToolTest.kt', '')
          write_b64('app/src/test/java/com/gama/assistant/GamaKnowledgePolicyTest.kt', '')
          write_b64('app/src/test/java/com/gama/assistant/ZevronMathToolTest.kt', '')
          write_b64('app/src/test/java/com/gama/assistant/ContextSanityCheckTest.kt', '')

          replace_once('app/src/main/java/com/gama/assistant/GamaService.kt', 'YW5zd2VyV2l0aEJyYWluQXN5bmMoCiAgICAgICAgICAgIFpldnJvbkphcnZpc0NvcmUuYnJhaW5JbnN0cnVjdGlvbihub3JtYWxpemVkQ29tbWFuZCkKICAgICAgICApIC8vIFpFVlJPTjEwNV9KQVJWSVNfQlJBSU5fUFJPTVBUCiAgICAgICAgICAgIHJldHVybgo=', '', 'public knowledge before brain')
          replace_once('app/src/main/java/com/gama/assistant/GamaService.kt', 'ICAgICAgICBwcml2YXRlIGZ1biBhbnN3ZXJXaXRoQnJhaW5Bc3luYygKICAgICAgICAgICAgcXVlc3Rpb246IFN0cmluZywKICAgICAgICAgICAgY2xlYW5Db250ZXh0OiBCb29sZWFuID0gZmFsc2UsCiAgICAgICAgKSB7Cg==', '', 'public knowledge helper')
          replace_once('app/src/main/java/com/gama/assistant/GamaService.kt', '', '', 'brain recovery public fallback')

          # Hard guards for the intended upgrade.
          checks = {
              'app/src/main/java/com/gama/assistant/GamaService.kt': [
                  'answerWithPublicKnowledgeAsync',
                  '!AiSetup.isInstalled(this)',
                  'GamaKnowledgePolicy.canUsePublicFallback(prompt)',
              ],
              'app/src/main/java/com/gama/assistant/ZevronMathTool.kt': [
                  'GamaSpokenNumbers.normalizeMath(text)',
              ],
              'app/src/main/java/com/gama/assistant/ZevronLocalRouter.kt': [
                  'GamaRepeatTool.handle(raw)',
              ],
          }
          for name, tokens in checks.items():
              value = Path(name).read_text(encoding='utf-8')
              for token in tokens:
                  if token not in value:
                      raise SystemExit(f'upgrade invariant missing in {name}: {token}')

          print('PASS: Gama 10.0 JARVIS Context Core upgrade applied.')
          PYUP

      - name: Audit JARVIS upgrade before build
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"
          TEST="app/src/test/java/com/gama/assistant"

          required=(
            "$SRC/GamaSpokenNumbers.kt"
            "$SRC/GamaRepeatTool.kt"
            "$SRC/GamaKnowledgePolicy.kt"
            "$SRC/GamaService.kt"
            "$SRC/ZevronMathTool.kt"
            "$SRC/ZevronLocalRouter.kt"
            "$SRC/ActiveTaskContext.kt"
            "$SRC/GamaOrchestrator.kt"
            "$SRC/GamaPersonalCore.kt"
            "$TEST/GamaSpokenNumbersTest.kt"
            "$TEST/GamaRepeatToolTest.kt"
            "$TEST/GamaKnowledgePolicyTest.kt"
          )

          for file in "${required[@]}"; do
            test -s "$file"
          done

          grep -Fq 'GamaSpokenNumbers.normalizeMath(text)' "$SRC/ZevronMathTool.kt"
          grep -Fq 'GamaRepeatTool.handle(raw)' "$SRC/ZevronLocalRouter.kt"
          grep -Fq 'answerWithPublicKnowledgeAsync' "$SRC/GamaService.kt"
          grep -Fq '!AiSetup.isInstalled(this)' "$SRC/GamaService.kt"
          grep -Fq 'GamaKnowledgePolicy.canUsePublicFallback(prompt)' "$SRC/GamaService.kt"
          grep -Fq 'ActiveTaskContext' "$SRC/ConversationSession.kt"
          grep -Fq 'GamaTurnCoordinator' "$SRC/GamaOrchestrator.kt"
          grep -Fq 'GamaSelfSpeechGuard' "$SRC/GamaService.kt"
          grep -Fq 'GamaReliableAppLauncher' "$SRC/GamaService.kt"
          grep -Fq 'isDebuggable = false' app/build.gradle.kts

          echo "PASS: upgrade conversacional e rota de conhecimento presentes."
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set Gama 10.0.0 version
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          version_code = 25_000_000 + int(os.environ["GITHUB_RUN_NUMBER"])

          text, code_count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {version_code}',
              text,
              count=1,
          )

          text, name_count = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              'versionName = "Gama 10.0.0 JARVIS Context Core"',
              text,
              count=1,
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Falha ao configurar versão Gama 10.0.0.")

          path.write_text(text, encoding="utf-8")
          print(f"versionCode={version_code}")
          PY
      - name: Prepare Gradle wrapper
        working-directory: _gama_build
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew
          ./gradlew --version
      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew clean --no-daemon --stacktrace
      - name: Compile Release Kotlin
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew \
            :app:compileReleaseKotlin \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-compile.log"
      - name: Upload compile diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10-compile-debug-${{ github.run_number }}
          path: |
            gama-compile.log
            _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
            _gama_build/app/src/main/java/com/gama/assistant/GamaKnowledgePolicy.kt
            _gama_build/app/src/main/java/com/gama/assistant/GamaSpokenNumbers.kt
            _gama_build/app/src/main/java/com/gama/assistant/GamaRepeatTool.kt
            _gama_build/app/src/main/java/com/gama/assistant/ZevronMathTool.kt
            _gama_build/app/src/main/java/com/gama/assistant/ContextSanityCheck.kt
          if-no-files-found: warn
      - name: Unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew \
            test \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"
      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew \
            lint \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-lint.log"
      - name: Prepare offline models
        working-directory: _gama_build
        run: |
          set -euo pipefail

          if [ -x tools/download_models.sh ]; then
            bash tools/download_models.sh
          fi
      - name: Assemble Release
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-release.log"
      - name: Sign Release APK
        working-directory: _gama_build
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail

          mkdir -p dist

          input_apk="$(
            find \
              app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              | head -n 1
          )"

          if [ -z "$input_apk" ] || [ ! -s "$input_apk" ]; then
            echo "::error::APK Release não encontrado."
            exit 1
          fi

          aligned="dist/Gama-aligned.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f \
            4 \
            "$input_apk" \
            "$aligned"

          if [ "$GAMA_SIGNING_MODE" = "stable" ]; then
            mkdir -p .gama-signing
            chmod 700 .gama-signing

            printf '%s' "$GAMA_SIGNING_SEED" \
              | grep -Eq '^[0-9A-Fa-f]{64}$'

            python3 - \
              "$GAMA_SIGNING_SEED" \
              .gama-signing/key.der <<'PY'
          import sys

          raw = bytes.fromhex(sys.argv[1])

          order = int(
              "FFFFFFFF00000000"
              "FFFFFFFFFFFFFFFF"
              "BCE6FAADA7179E84"
              "F3B9CAC2FC632551",
              16,
          )

          d = (int.from_bytes(raw, "big") % (order - 1)) + 1
          key = d.to_bytes(32, "big")

          der = (
              bytes.fromhex("30310201010420")
              + key
              + bytes.fromhex("A00A06082A8648CE3D030107")
          )

          with open(sys.argv[2], "wb") as handle:
              handle.write(der)
          PY

            openssl ec \
              -inform DER \
              -in .gama-signing/key.der \
              -out .gama-signing/key.pem \
              >/dev/null 2>&1

            printf '%s' \
              '' \
              | base64 --decode \
              > .gama-signing/cert.pem

            keyhash="$(
              openssl pkey \
                -in .gama-signing/key.pem \
                -pubout \
                -outform DER \
                | sha256sum \
                | cut -d' ' -f1
            )"

            certhash="$(
              openssl x509 \
                -in .gama-signing/cert.pem \
                -pubkey \
                -noout \
                | openssl pkey \
                    -pubin \
                    -outform DER \
                | sha256sum \
                | cut -d' ' -f1
            )"

            if [ "$keyhash" != "$certhash" ]; then
              echo "::error::GAMA_SIGNING_SEED não corresponde ao certificado estável."
              exit 1
            fi

            openssl pkcs12 \
              -export \
              -inkey .gama-signing/key.pem \
              -in .gama-signing/cert.pem \
              -out .gama-signing/gama.p12 \
              -name gama \
              -passout pass:GamaStable2026

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              sign \
              --ks .gama-signing/gama.p12 \
              --ks-type PKCS12 \
              --ks-key-alias gama \
              --ks-pass pass:GamaStable2026 \
              --key-pass pass:GamaStable2026 \
              --out dist/Gama.apk \
              "$aligned"

            echo "stable-update-capable" > dist/install-mode.txt
            rm -rf .gama-signing
          else
            rm -f /tmp/gama-fresh.jks

            keytool \
              -genkeypair \
              -keystore /tmp/gama-fresh.jks \
              -storepass GamaFresh2026 \
              -keypass GamaFresh2026 \
              -alias gama \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Gama Fresh Test,O=Gama,C=BR"

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              sign \
              --ks /tmp/gama-fresh.jks \
              --ks-key-alias gama \
              --ks-pass pass:GamaFresh2026 \
              --key-pass pass:GamaFresh2026 \
              --out dist/Gama.apk \
              "$aligned"

            echo "fresh-install-only" > dist/install-mode.txt
          fi

          rm -f "$aligned"
      - name: Verify final Release APK
        working-directory: _gama_build
        env:
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail

          test -s dist/Gama.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            dist/Gama.apk \
            | tee dist/signature-info.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            dist/Gama.apk \
            > dist/apk-info.txt

          grep -q "name='com.gama.assistant'" dist/apk-info.txt
          grep -q "versionName='Gama 10.0.0 JARVIS Context Core'" dist/apk-info.txt

          EXPECTED_VERSION_CODE="$((25000000 + GITHUB_RUN_NUMBER))"
          grep -q "versionCode='$EXPECTED_VERSION_CODE'" dist/apk-info.txt

          if grep -q 'application-debuggable' dist/apk-info.txt; then
            echo "::error::APK Release ainda está debuggable."
            exit 1
          fi

          if [ "$GAMA_SIGNING_MODE" = "stable" ]; then
            actual_cert="$(
              awk -F': ' \
                '/certificate SHA-256 digest/ { print $2; exit }' \
                dist/signature-info.txt \
                | tr -d ':' \
                | tr '[:lower:]' '[:upper:]'
            )"

            if [ "$actual_cert" != "$GAMA_EXPECTED_CERT_SHA256" ]; then
              echo "::error::Certificado final diferente da assinatura estável."
              echo "expected=$GAMA_EXPECTED_CERT_SHA256"
              echo "actual=$actual_cert"
              exit 1
            fi
          fi

          (
            cd dist
            sha256sum Gama.apk > Gama.apk.sha256
            sha256sum -c Gama.apk.sha256
          )

          echo "PASS: APK Release assinado e verificado."
      - name: Generate Gama 10 report
        working-directory: _gama_build
        run: |
          set -euo pipefail
          mkdir -p reports
          cat > reports/GAMA-10.0.0-JARVIS-CONTEXT.md <<'REPORT'
          # GAMA 10.0.0 JARVIS Context Core

          Base de build: source exato do run #155, o primeiro FIX154 totalmente verde.
          A cadeia antiga 9.3 -> 9.4 -> 9.5 não é reconstruída neste workflow.

          ## Upgrade funcional
          - números falados em português passam a alimentar a matemática local;
          - `quanto é dois mais dois` e `quinze vezes oito` não dependem do Gemma;
          - `repita ...` virou ferramenta local determinística;
          - perguntas públicas de conhecimento podem usar pesquisa pública quando o Gemma offline ainda não estiver instalado;
          - falha do cérebro local em pergunta pública tenta uma rota de conhecimento antes de pedir repetição;
          - dados privados, WhatsApp, contatos, notificações, tela, arquivos e localização não entram nesse fallback público;
          - filtro de transcrição ficou menos agressivo para fala legível de baixa confiança, mantendo rejeição de fragmentos sem vogais;
          - ActiveTaskContext, Orchestrator, memória, políticas, eventos, barge-in, self-speech guard e verificação de ações do 9.5 foram preservados.

          ## Build
          Mantidos os parâmetros do FIX154: Java 17, Android SDK 35, Gradle 8.9, compileReleaseKotlin, testes, lint, assembleRelease, zipalign e apksigner.

          Teste físico continua necessário para medir reconhecimento em TV/ruído, conversa longa, WhatsApp e consumo de bateria.
          REPORT
      - name: Final architecture audit
        working-directory: _gama_build
        run: |
          set -euo pipefail
          SRC="app/src/main/java/com/gama/assistant"

          test -s dist/Gama.apk
          test -s reports/GAMA-10.0.0-JARVIS-CONTEXT.md

          for symbol in \
            GamaPersonalAICore \
            GamaPolicyMemory \
            GamaRuleEngine \
            GamaEventEngine \
            GamaPriorityEngine \
            GamaLearningEngine \
            GamaSelfOptimizer \
            GamaCapabilityRegistry \
            GamaPermissionManager \
            GamaAuditTrail \
            GamaIntentRouterV2 \
            GamaKnowledgePolicy \
            GamaSpokenNumbers \
            GamaRepeatTool; do
            grep -R -Fq "$symbol" "$SRC"
          done

          grep -Fq 'mouthLift' "$SRC/GamaEnergyView.kt"
          grep -Fq 'GamaReliableAppLauncher' "$SRC/GamaService.kt"
          grep -Fq 'GamaSelfSpeechGuard' "$SRC/GamaService.kt"
          grep -Fq 'answerWithPublicKnowledgeAsync' "$SRC/GamaService.kt"

          echo "PASS: Gama 10 architecture audit complete."
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.0.0-JARVIS-CONTEXT-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error
      - name: Upload engineering reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.0.0-engineering-reports
          path: |
            _gama_build/reports/**
            gama-compile.log
            gama-tests.log
            gama-lint.log
            gama-release.log
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: warn
      - name: Publish Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="gama-v10.0.0-jarvis-context-${{ github.run_number }}"

          gh release create \
            "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            "_gama_build/dist/install-mode.txt#install-mode.txt" \
            "_gama_build/reports/GAMA-10.0.0-JARVIS-CONTEXT.md#GAMA-10.0.0-JARVIS-CONTEXT.md" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 10.0.0 JARVIS Context Core" \
            --notes "Upgrade baseado diretamente no FIX154 verde: fala livre mais tolerante, matemática com números falados, repetição local, fallback seguro de conhecimento público e preservação do Personal Intelligence Core. Testes físicos continuam obrigatórios." \
            --latest
