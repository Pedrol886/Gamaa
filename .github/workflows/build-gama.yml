      - name: Align Kotlin compiler and compilerOptions with LiteRT-LM
        run: |
          set -euo pipefail
          python3 - <<'PY_KOTLIN'
          from pathlib import Path
          import re

          root = Path("_gama_build")
          root_gradle = root / "build.gradle.kts"
          app_gradle = root / "app/build.gradle.kts"

          root_text = root_gradle.read_text(encoding="utf-8")
          old = 'id("org.jetbrains.kotlin.android") version "2.0.21" apply false'
          new = 'id("org.jetbrains.kotlin.android") version "2.4.0" apply false'
          if old in root_text:
              root_text = root_text.replace(old, new, 1)
          elif new not in root_text:
              raise SystemExit("Versão do Kotlin inesperada em build.gradle.kts")
          root_gradle.write_text(root_text, encoding="utf-8")

          app_text = app_gradle.read_text(encoding="utf-8")
          legacy_pattern = re.compile(
              r'\n\s*kotlinOptions\s*\{\s*jvmTarget\s*=\s*"17"\s*\}\s*',
              re.S,
          )
          app_text, removed = legacy_pattern.subn("\n", app_text, count=1)
          if "kotlinOptions" in app_text:
              raise SystemExit("Bloco kotlinOptions legado ainda presente em app/build.gradle.kts")

          compiler_block = (
              "\nkotlin {\n"
              "    compilerOptions {\n"
              "        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(\"17\")\n"
              "    }\n"
              "}\n\n"
          )
          if "compilerOptions" not in app_text:
              marker = "\ndependencies {"
              if marker not in app_text:
                  raise SystemExit("Bloco dependencies não encontrado em app/build.gradle.kts")
              app_text = app_text.replace(marker, compiler_block + "dependencies {", 1)

          app_gradle.write_text(app_text, encoding="utf-8")

          llm_path = root / "app/src/main/java/com/gama/assistant/GamaLocalLlm.kt"
          llm_text = llm_path.read_text(encoding="utf-8")
          llm_text = llm_text.replace(
              "conv.sendMessage(prompt).text",
              "conv.sendMessage(prompt).toString()",
          )
          if "conv.sendMessage(prompt).toString()" not in llm_text:
              raise SystemExit("API LiteRT-LM sendMessage não alinhada")
          if "conv.sendMessage(prompt).text" in llm_text:
              raise SystemExit("Uso inválido de Message.text ainda presente")
          llm_path.write_text(llm_text, encoding="utf-8")

          if removed:
              print("Migrated android.kotlinOptions to kotlin.compilerOptions")
          else:
              print("compilerOptions already configured")
          print("Kotlin Android plugin aligned to 2.4.0")
          PY_KOTLIN
          grep -F 'id("org.jetbrains.kotlin.android") version "2.4.0" apply false' _gama_build/build.gradle.kts
          grep -F 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("17")' _gama_build/app/build.gradle.kts
          if grep -Fq 'kotlinOptions' _gama_build/app/build.gradle.kts; then
            echo "::error::kotlinOptions legado ainda presente"
            exit 1
          fi

      - name: Bundle local conversational model
        run: |
          set -euo pipefail
          MODEL_DIR="$GITHUB_WORKSPACE/_gama_build/app/src/main/assets/llm"
          MODEL="$MODEL_DIR/Qwen3-0.6B-int4.litertlm"
          mkdir -p "$MODEL_DIR"
          rm -f "$MODEL"
          curl -L \
            --fail \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            --output "$MODEL" \
            "$GAMA_MODEL_URL"
          test -s "$MODEL"
          ACTUAL_SIZE="$(stat -c%s "$MODEL")"
          if [ "$ACTUAL_SIZE" != "$GAMA_MODEL_SIZE" ]; then
            echo "::error::Modelo local com tamanho inesperado: $ACTUAL_SIZE; esperado: $GAMA_MODEL_SIZE"
            exit 1
          fi
          echo "$GAMA_MODEL_SHA256  $MODEL" | sha256sum -c -
          ls -lh "$MODEL"

      - name: Set version and audit FIX186 architecture
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import os
          import re

          root = Path("_gama_build")
          src = root / "app/src/main/java/com/gama/assistant"
          gradle = root / "app/build.gradle.kts"
          root_gradle = root / "build.gradle.kts"
          manifest_path = root / "app/src/main/AndroidManifest.xml"
          model = root / "app/src/main/assets/llm/Qwen3-0.6B-int4.litertlm"

          text = gradle.read_text(encoding="utf-8")
          root_gradle_text = root_gradle.read_text(encoding="utf-8")
          if 'id("org.jetbrains.kotlin.android") version "2.4.0" apply false' not in root_gradle_text:
              raise SystemExit("Kotlin 2.4.0 não aplicado; LiteRT-LM exige metadata Kotlin 2.4")
          if "kotlinOptions" in text:
              raise SystemExit("DSL Kotlin legado detectado: kotlinOptions")
          if 'jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("17")' not in text:
              raise SystemExit("compilerOptions JVM 17 não configurado")
          version_code = 28_000_000 + int(os.environ["GITHUB_RUN_NUMBER"])
          text, c1 = re.subn(r"versionCode\s*=\s*\d+", f"versionCode = {version_code}", text, count=1)
          text, c2 = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "Gama 12.1 Local Voice Core FIX186"', text, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit("Falha ao configurar versão FIX186")
          gradle.write_text(text, encoding="utf-8")

          manifest = manifest_path.read_text(encoding="utf-8")
          service = (src / "GamaService.kt").read_text(encoding="utf-8")
          brain = (src / "LocalBrain.kt").read_text(encoding="utf-8")
          llm = (src / "GamaLocalLlm.kt").read_text(encoding="utf-8")
          registry = (src / "GamaAppRegistry.kt").read_text(encoding="utf-8")
          catalog = (src / "GamaInstalledAppCatalog.kt").read_text(encoding="utf-8")
          launcher = (src / "GamaReliableAppLauncher.kt").read_text(encoding="utf-8")
          accessibility = (src / "GamaScreenContextService.kt").read_text(encoding="utf-8")
          conversation = (src / "ConversationSession.kt").read_text(encoding="utf-8")
          brain_service = (src / "GamaBrainProcessService.kt").read_text(encoding="utf-8")

          files_to_scan = list(src.glob("*.kt")) + [manifest_path, gradle]
          all_source = "\n".join(p.read_text(encoding="utf-8", errors="ignore") for p in files_to_scan)

          forbidden = [
              "GamaGeminiClient", "GamaGeminiControl", "GamaGeminiPolicy",
              "GamaGeminiSecureStore", "GamaGeminiSettingsActivity",
              "gemini-3.", "generativelanguage.googleapis.com",
              "tasks-genai", "gemma.task", "AIza",
          ]
          bad = [token for token in forbidden if token in all_source]
          if bad:
              raise SystemExit("Dependência externa proibida presente: " + ", ".join(bad))

          checks = {
              "LiteRT-LM local": 'com.google.ai.edge.litertlm:litertlm-android:0.17.1' in text,
              "modelo Qwen local": model.is_file() and model.stat().st_size == int(os.environ["GAMA_MODEL_SIZE"]),
              "conversa gerativa": "class GamaLocalLlm" in llm and "sendMessage(prompt).toString()" in llm,
              "memoria de conversa": "ConversationConfig" in llm and "conversationHistory" in brain,
              "preaquecimento": "localLlm.warmUp()" in brain and "warmIntent(this)" in service,
              "sessao continua": "Long.MAX_VALUE" in service and "ConversationSession" in conversation,
              "sem maxOutputToken invalido": "maxOutputToken" not in llm,
              "todos os apps visiveis": "QUERY_ALL_PACKAGES" in manifest and "getInstalledApplications" in catalog,
              "resolucao dinamica": "GamaInstalledAppCatalog.resolve(context, raw)" in registry,
              "launcher por acessibilidade": "ACCESSIBILITY_SERVICE" in launcher and "launchPackage(packageName)" in launcher,
              "ponte de acessibilidade": "fun launchPackage(packageName: String)" in accessibility,
              "fallback de launcher": "PACKAGE_LAUNCH_INTENT" in launcher and "LAUNCHER_APPS" in launcher,
              "brain isolado": "30L * 60L * 1000L" in brain_service,
              "Vosk": (root / "app/src/main/assets/model/final.mdl").is_file(),
          }
          missing = [name for name, ok in checks.items() if not ok]
          if missing:
              raise SystemExit("FIX186 incompleto: " + ", ".join(missing))

          kt_files = list(src.glob("*.kt"))
          kt_lines = sum(len(p.read_text(encoding="utf-8", errors="ignore").splitlines()) for p in kt_files)
          if len(kt_files) < 125 or kt_lines < 28500:
              raise SystemExit(f"Regressão de fonte: {len(kt_files)} arquivos / {kt_lines} linhas Kotlin")

          print(f"PASS FIX186: {len(kt_files)} Kotlin files / {kt_lines} lines / versionCode={version_code}")
          for name in checks:
              print("PASS", name)
          PY_AUDIT

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean --stacktrace

      - name: Compile Release Kotlin
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:compileReleaseKotlin --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama186-compile.log"

      - name: Unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testReleaseUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama186-tests.log"

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:lintRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama186-lint.log"

      - name: Assemble Release
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama186-release.log"

      - name: Zipalign sign and verify APK
        env:
          GAMA_KEYSTORE_B64: ${{ secrets.GAMA_KEYSTORE_B64 }}
          GAMA_KEYSTORE_PASSWORD: ${{ secrets.GAMA_KEYSTORE_PASSWORD }}
          GAMA_KEY_ALIAS: ${{ secrets.GAMA_KEY_ALIAS }}
          GAMA_KEY_PASSWORD: ${{ secrets.GAMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          input_apk="$(find _gama_build/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | head -n 1 || true)"
          if [ -z "$input_apk" ] || [ ! -s "$input_apk" ]; then
            echo "::error::assembleRelease terminou sem APK."
            exit 1
          fi

          mkdir -p _gama_build/dist
          "$BT/zipalign" -f -p 4 "$input_apk" _gama_build/dist/Gama-aligned.apk

          if [ -n "${GAMA_KEYSTORE_B64:-}" ] && [ -n "${GAMA_KEYSTORE_PASSWORD:-}" ] && [ -n "${GAMA_KEY_ALIAS:-}" ] && [ -n "${GAMA_KEY_PASSWORD:-}" ]; then
            echo "$GAMA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gama-release.jks"
            KS="$RUNNER_TEMP/gama-release.jks"
            SP="$GAMA_KEYSTORE_PASSWORD"
            KA="$GAMA_KEY_ALIAS"
            KP="$GAMA_KEY_PASSWORD"
            echo "stable-update-capable" > _gama_build/dist/install-mode.txt
          else
            KS="$RUNNER_TEMP/gama-test.jks"
            SP="gama-test-pass"
            KA="gama-test"
            KP="gama-test-pass"
            keytool -genkeypair \
              -keystore "$KS" \
              -storepass "$SP" \
              -keypass "$KP" \
              -alias "$KA" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Gama Test,O=Gama,C=BR" \
              -noprompt
            echo "fresh-install-only" > _gama_build/dist/install-mode.txt
          fi

          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-pass "pass:$SP" \
            --ks-key-alias "$KA" \
            --key-pass "pass:$KP" \
            --out _gama_build/dist/Gama.apk \
            _gama_build/dist/Gama-aligned.apk

          "$BT/apksigner" verify --verbose --print-certs _gama_build/dist/Gama.apk | tee _gama_build/dist/signature-info.txt
          test -s _gama_build/dist/Gama.apk
          APK_SIZE="$(stat -c%s _gama_build/dist/Gama.apk)"
          if [ "$APK_SIZE" -lt 350000000 ]; then
            echo "::error::APK não contém o cérebro local completo: $APK_SIZE bytes"
            exit 1
          fi
          unzip -l _gama_build/dist/Gama.apk | grep -Fq 'assets/model/final.mdl'
          unzip -l _gama_build/dist/Gama.apk | grep -Fq 'assets/model/Gr.fst'
          unzip -l _gama_build/dist/Gama.apk | grep -Fq 'assets/llm/Qwen3-0.6B-int4.litertlm'
          unzip -l _gama_build/dist/Gama.apk | grep -Fq 'classes.dex'
          "$BT/aapt" dump badging _gama_build/dist/Gama.apk > _gama_build/dist/apk-info.txt
          grep -Fq "name='com.gama.assistant'" _gama_build/dist/apk-info.txt
          grep -Fq "versionName='Gama 12.1 Local Voice Core FIX186'" _gama_build/dist/apk-info.txt
          (cd _gama_build/dist && sha256sum Gama.apk > Gama.apk.sha256 && sha256sum -c Gama.apk.sha256)
          rm -f _gama_build/dist/Gama-aligned.apk
          ls -lh _gama_build/dist/Gama.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-12.1-LOCAL-VOICE-FIX186-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-12.1-LOCAL-VOICE-FIX186-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/app/build/**
            !_gama_build/dist/**
            !_gama_build/app/src/main/assets/llm/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-12.1-FIX186-diagnostics
          path: |
            gama186-compile.log
            gama186-tests.log
            gama186-lint.log
            gama186-release.log
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
