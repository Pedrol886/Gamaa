              package com.gama.assistant

              import java.text.Normalizer
              import java.util.Locale

              object GamaReplyGuard {

                  fun sanitize(raw: String): String {
                      val text =
                          raw
                              .trim()
                              .replace(
                                  Regex("\\s+"),
                                  " "
                              )

                      if (text.isBlank()) {
                          return "Pode repetir essa parte?"
                      }

                      val n = normalize(text)

                      val internalFailure =
                          listOf(
                              "brain ipc",
                              "isolated process",
                              "processo isolado",
                              "stack trace",
                              "native crash",
                              "llminference",
                              "mediapipe",
                              "jni",
                              "engine indisponivel",
                              "modelo local reinici",
                              "reiniciei o modelo",
                              "nao consegui concluir essa resposta",
                          ).any {
                              it in n
                          }

                      return if (internalFailure) {
                          "Pode repetir essa parte?"
                      } else {
                          text.replace(
                              Regex("(?i)\\bGama\\b"),
                              "Gama"
                          )
                      }
                  }

                  private fun normalize(
                      value: String
                  ): String =
                      Normalizer.normalize(
                          value.lowercase(
                              Locale.ROOT
                          ),
                          Normalizer.Form.NFD,
                      )
                          .replace(
                              Regex("\\p{M}+"),
                              ""
                          )
                          .replace(
                              Regex("\\s+"),
                              " "
                          )
                          .trim()
              }
              '''
