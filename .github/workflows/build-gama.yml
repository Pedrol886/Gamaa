          1LqTRBAc3mIrfITl062C86hFm3uXjsXeA2WNrEWUE3JnVtAv+dFwqG8hx2ynxX3P0c4UODInZIw4h0IhnuFw00fNKtXyW+YZjFIrdjfeDo26m7yfSTPppErR
          C3rBo7ZuMKPyAIPmERiPez4kKRWWpuw5ZoiH5XcmbyAAAAAA6OEdgMBB8tUAAabvAZiHCSVONuCxxGf7AgAAAAAEWVo=
          PATCH_B64
          python3 - <<'PY_PATCH'
          from pathlib import Path
          import base64, hashlib, lzma

          source = Path("/tmp/zevron-max.patch.xz.b64").read_text(encoding="ascii")
          compact = "".join(source.split())
          compressed = base64.b64decode(compact, validate=True)

          compressed_sha = hashlib.sha256(compressed).hexdigest()
          expected_compressed = "92f3a44dd513dfb33fc1dc1e3a88269d1968b1178a28e243b7414b0699c2067e"
          if compressed_sha != expected_compressed:
              raise SystemExit(f"compressed patch hash mismatch: {compressed_sha}")

          patch = lzma.decompress(compressed)
          patch_sha = hashlib.sha256(patch).hexdigest()
          expected_patch = "10af79f356a6065c8a9a186827c6e039c9661e5e1c09126b10bb2c285c63903e"
          if patch_sha != expected_patch:
              raise SystemExit(f"decoded patch hash mismatch: {patch_sha}")

          Path("/tmp/zevron-max.patch.xz").write_bytes(compressed)
          Path("/tmp/zevron-max.patch").write_bytes(patch)
          print(f"Patch transport OK: {len(compressed)} compressed bytes, {len(patch)} patch bytes")
          PY_PATCH

          cd _gama_build
          patch -p1 --batch --forward < /tmp/zevron-max.patch

      - name: Audit Zevron MAX JARVIS architecture before compiling
        working-directory: _gama_build
        run: |
          set -euo pipefail
          PKG="app/src/main/java/com/gama/assistant"
          TESTS="app/src/test/java/com/gama/assistant"
          SERVICE="$PKG/GamaService.kt"

          test -s "$PKG/ZevronPlanner.kt"
          test -s "$PKG/ZevronMemoryStore.kt"
          test -s "$PKG/ZevronJarvisCore.kt"
          test -s "$PKG/ZevronPerceptionPolicy.kt"
          test -s "$PKG/ZevronContextResolver.kt"
          test -s "$PKG/ZevronSystemControl.kt"

          grep -Fq 'android:label="Zevron"' app/src/main/AndroidManifest.xml
          grep -Fq 'private val wake = Regex("\\b(?:zevron|sevron|zevrom|zevrun)\\b")' "$PKG/VoicePolicy.kt"
          ! grep -Eq 'private val wake.*gama|private val wake.*gamma' "$PKG/VoicePolicy.kt"

          grep -Fq 'ZEVRON105_JARVIS_PLANNER' "$SERVICE"
          grep -Fq 'ZEVRON105_JARVIS_BRAIN_PROMPT' "$SERVICE"
          grep -Fq 'ZEVRON105_CONTEXTUAL_PERCEPTION' "$SERVICE"
          grep -Fq 'interruptSpeechForBargeIn()' "$SERVICE"
          grep -Fq 'handleBargeInAudio(rec, buffer, read, now)' "$SERVICE"
          grep -Fq 'ZevronJarvisCore.enrichBrainContext' "$SERVICE"
          grep -Fq 'ZevronPlanner.plan(command)' "$SERVICE"
          grep -Fq 'ZevronMemoryStore.handle(context, raw)' "$PKG/ZevronLocalRouter.kt"
          grep -Fq 'ZevronSystemControl.handle(context, raw)' "$PKG/ZevronLocalRouter.kt"
          grep -Fq 'android:canPerformGestures="true"' app/src/main/res/xml/gama_accessibility_service.xml
          grep -Fq 'GLOBAL_ACTION_QUICK_SETTINGS' "$PKG/ZevronSystemControl.kt"
          grep -Fq 'clickByLabel' "$PKG/ZevronSystemControl.kt"
          grep -Fq 'replaceFocusedText' "$PKG/ZevronSystemControl.kt"

          test -s "$TESTS/ZevronPlannerTest.kt"
          test -s "$TESTS/ZevronPerceptionPolicyTest.kt"
          test -s "$TESTS/ZevronJarvisCorePolicyTest.kt"
          test -s "$TESTS/ZevronSystemControlTest.kt"
          grep -Fq 'editsRecentWhatsappDraftByContext' "$TESTS/ZevronContextResolverTest.kt"

          ! grep -Rqs --include='*.kt' -E 'Diga Gama|diga Gama|Voz do Gama|notificação do Gama|Gama Contexto da Tela' app/src/main/java/com/gama/assistant
          ! find app/src -name '*.bak' -o -name '*.tmp' | grep -q .

          echo "Zevron MAX JARVIS architecture audit passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve Zevron signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail
          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Zevron-MAX-JARVIS-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"
            echo "::warning::GAMA_SIGNING_SEED não configurado. APK somente para instalação limpa."
          elif printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Zevron-MAX-JARVIS-APK" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GAMA_SIGNING_SEED precisa ter exatamente 64 caracteres hexadecimais."
            exit 1
          fi

      - name: Set Zevron JARVIS version
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import os, re
          path = Path("app/build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          code = 21100000 + int(os.environ["GITHUB_RUN_NUMBER"])
          source, a = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {code}', source, count=1)
          source, b = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "Zevron MAX JARVIS FIX96"', source, count=1)
          if a != 1 or b != 1:
              raise SystemExit(f"version metadata patch failed: code={a}, name={b}")
          path.write_text(source, encoding="utf-8")
          print("versionCode", code)
          PY_VERSION
          echo "ZEVRON_TAG=zevron-max-jarvis-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Download and verify offline models
        working-directory: _gama_build
        run: |
          set -euo pipefail
          bash tools/download_models.sh

      - name: Compile Zevron MAX JARVIS APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/zevron-build.log"

      - name: Run Zevron MAX critical regression tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests "com.gama.assistant.ZevronPlannerTest" \
            --tests "com.gama.assistant.ZevronContextResolverTest" \
            --tests "com.gama.assistant.ZevronPerceptionPolicyTest" \
            --tests "com.gama.assistant.ZevronJarvisCorePolicyTest" \
            --tests "com.gama.assistant.ZevronSystemControlTest" \
            --tests "com.gama.assistant.ZevronConversationEngineTest" \
            --tests "com.gama.assistant.ZevronMathToolTest" \
            --tests "com.gama.assistant.ConversationSessionTest" \
            --tests "com.gama.assistant.GamaTimePolicyTest" \
            2>&1 | tee "$GITHUB_WORKSPACE/zevron-critical-tests.log"

      - name: Run complete Zevron unit-test suite
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --rerun-tasks 2>&1 | tee "$GITHUB_WORKSPACE/zevron-tests.log"

      - name: Verify complete test suite
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_TESTS'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("app/build/test-results/testDebugUnitTest")
          files = list(root.glob("TEST-*.xml"))
          if not files:
              raise SystemExit("No unit-test XML files were produced")
          tests = failures = errors = skipped = 0
          failed = []
          for path in files:
              suite = ET.parse(path).getroot()
              tests += int(suite.attrib.get("tests", 0))
              failures += int(suite.attrib.get("failures", 0))
              errors += int(suite.attrib.get("errors", 0))
              skipped += int(suite.attrib.get("skipped", 0))
              for case in suite.findall(".//testcase"):
                  node = case.find("failure")
                  if node is None:
                      node = case.find("error")
                  if node is not None:
                      failed.append(f"{case.attrib.get('classname')} > {case.attrib.get('name')}: {node.attrib.get('message','')}")
          print(f"tests={tests} failures={failures} errors={errors} skipped={skipped}")
          for item in failed:
              print("FAILED", item)
          if tests < 130:
              raise SystemExit(f"Unexpectedly low test count: {tests}")
          if failures or errors:
              raise SystemExit(f"Suite failed: failures={failures}, errors={errors}")
          PY_TESTS
          echo "Complete Zevron test suite passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare stable signing runner
        run: |
          set -euo pipefail
          git show "${FIX93_COMMIT}:.github/workflows/build-gama.yml" > /tmp/fix93.yml
          test -s /tmp/fix93.yml
          cat > /tmp/run_workflow_step.py <<'PY_RUNNER'
          from pathlib import Path
          import os, re, subprocess, sys
          workflow_path = Path(sys.argv[1])
          step_name = sys.argv[2]
          workflow = workflow_path.read_text(encoding="utf-8")
          pattern = re.compile(r"^      - name: " + re.escape(step_name) + r"\n(?P<body>.*?)(?=^      - name: |\Z)", re.MULTILINE | re.DOTALL)
          match = pattern.search(workflow)
          if match is None:
              raise SystemExit(f"Step not found: {step_name}")
          body = match.group("body")
          wd = re.search(r"^        working-directory:\s*(.+?)\s*$", body, re.MULTILINE)
          cwd = Path.cwd() / wd.group(1).strip() if wd else Path.cwd()
          lines = body.splitlines()
          start = next((i + 1 for i, line in enumerate(lines) if line.strip() == "run: |"), None)
          if start is None:
              raise SystemExit("run block not found")
          script_lines = []
          for line in lines[start:]:
              if line.strip() == "":
                  script_lines.append("")
                  continue
              if not line.startswith("          "):
                  break
              script_lines.append(line[10:])
          subprocess.run(["bash", "-euo", "pipefail", "-c", "\n".join(script_lines) + "\n"], cwd=str(cwd), env=os.environ.copy(), check=True)
          PY_RUNNER
          python3 -m py_compile /tmp/run_workflow_step.py

      - name: Sign Zevron APK
        env:
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail
          python3 /tmp/run_workflow_step.py /tmp/fix93.yml "Sign and verify Gama.apk"
          test -s _gama_build/dist/Gama.apk
          cp _gama_build/dist/Gama.apk _gama_build/dist/Zevron.apk
          (cd _gama_build/dist && sha256sum Zevron.apk > Zevron.apk.sha256)

      - name: Verify final Zevron APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          test -s dist/Zevron.apk
          test -s dist/Zevron.apk.sha256
          (cd dist && sha256sum -c Zevron.apk.sha256)
          bytes="$(wc -c < dist/Zevron.apk)"
          test "$bytes" -gt 1000000
          grep -q "name='com.gama.assistant'" dist/apk-info.txt
          echo "## Zevron JARVIS COMPLETO" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK bytes: $bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package preserved for update compatibility: com.gama.assistant" >> "$GITHUB_STEP_SUMMARY"
          echo "- Voice barge-in: enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Multi-step planner: enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Explicit local long-term memory: enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contextual screen perception: enabled when user-enabled and unlocked" >> "$GITHUB_STEP_SUMMARY"
          echo "- Local brain context + verified-tool policy: enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- User-authorized UI control: back/home/recents/notifications/quick settings" >> "$GITHUB_STEP_SUMMARY"
          echo "- Voice UI navigation: click by label, type into focused fields, scroll" >> "$GITHUB_STEP_SUMMARY"

      - name: Print exact diagnostics
        if: failure()
        run: |
          set +e
          echo "## Zevron MAX diagnostics" >> "$GITHUB_STEP_SUMMARY"
          for log in zevron-build.log zevron-critical-tests.log zevron-tests.log; do
            [ -s "$log" ] || continue
            echo "### $log" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^e: |error:|FAILED|FAILURE:|AssertionError|ComparisonFailure|Caused by:|expected|but was)' "$log" | head -260 >> "$GITHUB_STEP_SUMMARY" || tail -200 "$log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zevron-JARVIS-COMPLETO-diagnostics
          path: |
            zevron-build.log
            zevron-critical-tests.log
            zevron-tests.log
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn

      - name: Upload Zevron APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Zevron.apk
            _gama_build/dist/Zevron.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/install-mode.txt
            _gama_build/dist/signing-cert-sha256.txt
            _gama_build/dist/signature-info.txt
          if-no-files-found: error

      - name: Upload complete Zevron MAX source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zevron-MAX-JARVIS-source
          path: |
            _gama_build/app/src
            _gama_build/app/build.gradle.kts
            _gama_build/settings.gradle.kts
            _gama_build/build.gradle.kts
            _gama_build/gradle.properties
            _gama_build/tools
          if-no-files-found: warn

      - name: Publish Zevron MAX JARVIS release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$ZEVRON_TAG"
          gh release delete "$TAG" --yes >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "_gama_build/dist/Zevron.apk#Zevron.apk" \
            "_gama_build/dist/Zevron.apk.sha256#Zevron.apk.sha256" \
            --title "Zevron MAX JARVIS FIX96" \
            --notes "Zevron MAX JARVIS built from the last Android source that compiled. Includes Zevron-only wake behavior, continuous voice conversation, barge-in, contextual memory, multi-step planning, screen perception, notification/message tools, calendar/math/app/WhatsApp tools, local-first knowledge with Internet routing for fresh information, and a user-authorized system-control layer through Android Accessibility: back, home, recents, notifications, quick settings, screen reading, click-by-label, text entry and scrolling. It does not bypass Android PIN, password, biometrics or other platform security boundaries."

# ZEVRON_MAX_JARVIS_COMPLETE_END
