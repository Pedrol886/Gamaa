name: Build Gama 8.2.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-8-2-0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GAMA_BASE_RUN_ID: "37030299438"
      GAMA_BASE_ARTIFACT: "Gama-JARVIS-FILM-CORE-FIX110-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last source that really compiled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build
          gh run download "$GAMA_BASE_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "$GAMA_BASE_ARTIFACT"             --dir _gama_build
          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt

      - name: Apply consolidated Gama 8.2.0 core
        run: |
          set -euo pipefail
          cat > /tmp/gama820.patch.xz.b64 <<'GAMA820_B64'
          
          GAMA820_B64
          base64 -d /tmp/gama820.patch.xz.b64 | xz -d > /tmp/gama820.patch
          echo "b881d616559405af3f8c317d297dd7372170e3ba281f28777deb70c88d773035  /tmp/gama820.patch" | sha256sum -c -
          cd _gama_build
          patch -p1 --batch --forward < /tmp/gama820.patch
          grep -Fq 'object GamaRecognitionPolicy' app/src/main/java/com/gama/assistant/GamaRecognitionPolicy.kt
          grep -Fq 'open the conversation NOW' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'GamaRecognitionPolicy.shouldFeedDecoder' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'shouldForceEndpoint' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'requestNoiseConfirmation' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'sleepRecognizer = try' app/src/main/java/com/gama/assistant/GamaService.kt

      - name: Inject GAMA JARVIS 2000 Autonomy Core
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "_gama_build/app" ]; then
            APP="_gama_build/app"
          else
            APP="app"
          fi

          SRC="$APP/src/main/java/com/gama/assistant"
          GRADLE="$APP/build.gradle.kts"
          SERVICE="$SRC/GamaService.kt"
          ACCESS="$SRC/GamaScreenContextService.kt"
          ACCESS_XML="$APP/src/main/res/xml/gama_accessibility_service.xml"
          SUPER="$SRC/GamaSuperAssistantCore.kt"
          CORE="$SRC/ZevronJarvisCore.kt"

          test -s "$GRADLE"
          test -s "$SERVICE"
          test -s "$ACCESS"
          test -s "$ACCESS_XML"
          test -s "$SRC/LocalBrain.kt"
          test -s "$SRC/GamaAutomationEngine.kt"
          test -s "$SRC/GamaMissionStore.kt"

          # ======================================================
          # OCR LOCAL, mantendo o MediaPipe que já compila no #118.
          # ======================================================

          if ! grep -Fq 'implementation("com.google.mlkit:text-recognition:16.0.1")' "$GRADLE"; then
            sed -i '/^[[:space:]]*dependencies[[:space:]]*{/a\    implementation("com.google.mlkit:text-recognition:16.0.1")' "$GRADLE"
          fi

          grep -Fq 'implementation("com.google.mediapipe:tasks-genai:0.10.27")' "$GRADLE"

          if grep -Fq 'android:canTakeScreenshot=' "$ACCESS_XML"; then
            sed -i 's/android:canTakeScreenshot="false"/android:canTakeScreenshot="true"/g' "$ACCESS_XML"
          else
            sed -i '/android:canPerformGestures="true"/a\    android:canTakeScreenshot="true"' "$ACCESS_XML"
          fi

          # ======================================================
          # Screenshot local via AccessibilityService já existente.
          # ======================================================

          python3 - "$ACCESS" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          if "import android.graphics.Bitmap" not in s:
              imports = """import android.graphics.Bitmap
          import android.os.Build
          import android.view.Display
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicReference
          """
              s = s.replace("import android.content.Intent\n", "import android.content.Intent\n" + imports, 1)

          if "fun captureCurrentBitmap(): Bitmap?" not in s:
              anchor = """        fun scroll(down: Boolean): Boolean =
                      runCatching { active?.get()?.scrollInternal(down) == true }.getOrDefault(false)
          """
              addition = anchor + """
                  fun captureCurrentBitmap(): Bitmap? =
                      runCatching { active?.get()?.captureCurrentBitmapInternal() }.getOrNull()
          """
              if anchor not in s:
                  raise SystemExit("GamaScreenContextService companion anchor not found")
              s = s.replace(anchor, addition, 1)

          if "private fun captureCurrentBitmapInternal(): Bitmap?" not in s:
              anchor = "    private fun captureSnapshot(): GamaScreenSnapshot? {\n"
              method = """    private fun captureCurrentBitmapInternal(): Bitmap? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return null

                  val result = AtomicReference<Bitmap?>(null)
                  val latch = CountDownLatch(1)

                  return try {
                      takeScreenshot(
                          Display.DEFAULT_DISPLAY,
                          mainExecutor,
                          object : AccessibilityService.TakeScreenshotCallback {
                              override fun onSuccess(
                                  screenshot: AccessibilityService.ScreenshotResult
                              ) {
                                  try {
                                      val buffer = screenshot.hardwareBuffer
                                      try {
                                          result.set(
                                              Bitmap.wrapHardwareBuffer(
                                                  buffer,
                                                  screenshot.colorSpace
                                              )?.copy(Bitmap.Config.ARGB_8888, false)
                                          )
                                      } finally {
                                          runCatching { buffer.close() }
                                      }
                                  } finally {
                                      latch.countDown()
                                  }
                              }

                              override fun onFailure(errorCode: Int) {
                                  latch.countDown()
                              }
                          }
                      )

                      latch.await(2200L, TimeUnit.MILLISECONDS)
                      result.get()
                  } catch (_: Throwable) {
                      null
                  }
              }

          """
              if anchor not in s:
                  raise SystemExit("captureSnapshot anchor not found")
              s = s.replace(anchor, method + anchor, 1)

          p.write_text(s, encoding="utf-8")
          PY

          # ======================================================
          # Visão local: texto nativo + OCR em screenshot.
          # ======================================================

          cat > "$SRC/GamaVisionCore.kt" <<'EOF'
          package com.gama.assistant

          import android.content.Context
          import android.graphics.Bitmap
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import java.text.Normalizer
          import java.util.LinkedHashSet
          import java.util.Locale
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicReference
          import kotlin.concurrent.thread

          object GamaVisionCore {
              private const val OCR_TIMEOUT_SECONDS = 7L
              private const val MAX_TEXT = 9000

              fun recognizes(raw: String): Boolean {
                  val c = normalize(raw)
                  val mentionsScreen = listOf(
                      "tela", "display", "visor", "imagem", "pdf", "documento"
                  ).any { it in c } || c == "o que estou vendo" || c == "o que eu estou vendo"

                  if (!mentionsScreen) return false

                  return listOf(
                      "leia", "ler", "resuma", "resumir", "analise", "analisar",
                      "explique", "explicar", "interprete", "interpretar",
                      "o que tem", "o que esta", "o que aparece",
                      "o que estou vendo", "o que eu estou vendo"
                  ).any { it in c }
              }

              fun requiresReasoning(raw: String): Boolean {
                  val c = normalize(raw)
                  return listOf(
                      "analise", "analisar", "explique", "explicar",
                      "interprete", "interpretar", "o que significa",
                      "resuma", "resumir", "compare", "resolva"
                  ).any { it in c }
              }

              fun captureTextAsync(context: Context, callback: (String) -> Unit) {
                  val app = context.applicationContext
                  thread(name = "gama-local-vision") {
                      callback(runCatching { captureCombinedText(app) }.getOrDefault(""))
                  }
              }

              fun captureCombinedText(context: Context): String {
                  val nativeText = GamaScreenContextService.snapshotNow()
                      ?.plainText(5000)
                      .orEmpty()
                      .trim()

                  val bitmap = GamaScreenContextService.captureCurrentBitmap()
                  val ocr = if (bitmap == null) {
                      ""
                  } else {
                      try {
                          extractText(bitmap)
                      } finally {
                          runCatching { if (!bitmap.isRecycled) bitmap.recycle() }
                      }
                  }

                  return merge(nativeText, ocr)
              }

              fun extractText(bitmap: Bitmap): String {
                  if (bitmap.isRecycled || bitmap.width <= 0 || bitmap.height <= 0) return ""

                  val recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)
                  val result = AtomicReference("")
                  val latch = CountDownLatch(1)

                  try {
                      recognizer.process(InputImage.fromBitmap(bitmap, 0))
                          .addOnSuccessListener { text ->
                              val lines = LinkedHashSet<String>()
                              text.textBlocks.forEach { block ->
                                  block.lines.forEach { line ->
                                      val clean = line.text.replace(Regex("\\s+"), " ").trim()
                                      if (clean.isNotBlank()) lines.add(clean)
                                  }
                              }
                              result.set(lines.joinToString("\n").take(MAX_TEXT))
                              latch.countDown()
                          }
                          .addOnFailureListener { latch.countDown() }

                      if (!latch.await(OCR_TIMEOUT_SECONDS, TimeUnit.SECONDS)) return ""
                      return result.get().trim()
                  } finally {
                      runCatching { recognizer.close() }
                  }
              }

              fun spokenReadReply(text: String): String =
                  if (text.isBlank()) "Não encontrei texto legível nesta tela."
                  else "Na tela está escrito: ${text.take(3000)}"

              private fun merge(nativeText: String, ocrText: String): String {
                  val lines = LinkedHashSet<String>()
                  sequenceOf(nativeText, ocrText)
                      .filter { it.isNotBlank() }
                      .forEach { part ->
                          part.lines()
                              .map { it.replace(Regex("\\s+"), " ").trim() }
                              .filter { it.isNotBlank() }
                              .forEach(lines::add)
                      }
                  return lines.joinToString("\n").take(MAX_TEXT)
              }

              private fun normalize(value: String): String =
                  Normalizer.normalize(value.lowercase(Locale("pt", "BR")), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}+"), "")
                      .replace(Regex("[^a-z0-9 ]+"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
          }
          EOF

          # ======================================================
          # Memória adaptativa local, limitada e sem segredos.
          # ======================================================

          cat > "$SRC/GamaAdaptiveMemory.kt" <<'EOF'
          package com.gama.assistant

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.Normalizer
          import java.util.Locale

          object GamaAdaptiveMemory {
              private const val PREFS = "gama_adaptive_memory_v1"
              private const val KEY = "entries"
              private const val MAX_ENTRIES = 60

              enum class Kind { PREFERENCE, PERSON, DECISION, STYLE }

              data class Entry(
                  val kind: Kind,
                  val value: String,
                  val normalized: String,
                  val createdAt: Long,
              )

              fun observe(context: Context, raw: String) {
                  val clean = ZevronConversationEngine.stripWakeWord(raw)
                      .replace(Regex("\\s+"), " ")
                      .trim()
                      .take(420)

                  if (clean.length < 5 || looksSensitive(clean)) return

                  val candidates = mutableListOf<Pair<Kind, String>>()

                  Regex("(?i)^(?:eu )?(prefiro|gosto de|nao gosto de|não gosto de)\\s+(.+)$")
                      .find(clean)
                      ?.groupValues
                      ?.getOrNull(2)
                      ?.trim()
                      ?.takeIf { it.length >= 2 }
                      ?.let { candidates += Kind.PREFERENCE to clean }

                  Regex("(?i)^(?:de agora em diante|daqui pra frente|decidi que|eu decidi que)\\s+(.+)$")
                      .find(clean)
                      ?.groupValues
                      ?.getOrNull(1)
                      ?.trim()
                      ?.takeIf { it.length >= 3 }
                      ?.let { candidates += Kind.DECISION to clean }

                  Regex("(?i)^(?:quero que voce|quero que você)\\s+(sempre|nunca)\\s+(.+)$")
                      .find(clean)
                      ?.takeIf { it.groupValues.getOrNull(2)?.trim()?.length ?: 0 >= 3 }
                      ?.let { candidates += Kind.STYLE to clean }

                  Regex("(?i)^(.{2,80})\\s+(?:e|é)\\s+(?:meu|minha)\\s+(amigo|amiga|irmao|irmão|irma|irmã|mae|mãe|pai|primo|prima|colega|professor|professora)\\b.*$")
                      .find(clean)
                      ?.let { candidates += Kind.PERSON to clean }

                  candidates.forEach { (kind, value) -> add(context, kind, value) }
              }

              fun replyForQuery(context: Context, raw: String): String? {
                  val n = normalize(raw)
                  val asks = n in setOf(
                      "o que voce sabe sobre mim",
                      "o que voce aprendeu sobre mim",
                      "quais sao minhas preferencias",
                      "quais minhas preferencias",
                      "o que voce lembra das minhas preferencias"
                  )
                  if (!asks) return null

                  val entries = load(context)
                  if (entries.isEmpty()) return "Ainda não tenho preferências pessoais suficientes guardadas localmente."

                  return buildString {
                      append("Localmente eu lembro que: ")
                      entries.takeLast(8).forEachIndexed { index, entry ->
                          if (index > 0) append("; ")
                          append(entry.value)
                      }
                      append('.')
                  }.take(1200)
              }

              fun contextSummary(context: Context): String? {
                  val entries = load(context).takeLast(12)
                  if (entries.isEmpty()) return null
                  return buildString {
                      append("Preferências e decisões locais do usuário: ")
                      append(entries.joinToString(" | ") { it.value.take(180) })
                  }.take(1900)
              }

              @Synchronized
              private fun add(context: Context, kind: Kind, value: String) {
                  val clean = value.replace(Regex("\\s+"), " ").trim().take(360)
                  if (clean.isBlank()) return
                  val n = normalize(clean)
                  val current = load(context)
                      .filterNot { it.normalized == n }
                      .toMutableList()
                  current += Entry(kind, clean, n, System.currentTimeMillis())
                  save(context, current.takeLast(MAX_ENTRIES))
              }

              fun load(context: Context): List<Entry> {
                  val raw = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getString(KEY, "[]") ?: "[]"
                  return runCatching {
                      val arr = JSONArray(raw)
                      buildList {
                          for (i in 0 until arr.length()) {
                              val o = arr.optJSONObject(i) ?: continue
                              val value = o.optString("value").trim()
                              if (value.isBlank()) continue
                              val kind = runCatching {
                                  Kind.valueOf(o.optString("kind"))
                              }.getOrDefault(Kind.PREFERENCE)
                              add(
                                  Entry(
                                      kind = kind,
                                      value = value,
                                      normalized = o.optString("normalized").ifBlank { normalize(value) },
                                      createdAt = o.optLong("createdAt", 0L),
                                  )
                              )
                          }
                      }.takeLast(MAX_ENTRIES)
                  }.getOrDefault(emptyList())
              }

              private fun save(context: Context, entries: List<Entry>) {
                  val arr = JSONArray()
                  entries.forEach { e ->
                      arr.put(JSONObject()
                          .put("kind", e.kind.name)
                          .put("value", e.value)
                          .put("normalized", e.normalized)
                          .put("createdAt", e.createdAt))
                  }
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit()
                      .putString(KEY, arr.toString())
                      .apply()
              }

              private fun looksSensitive(raw: String): Boolean {
                  val n = normalize(raw)
                  return listOf(
                      "senha", "password", "pin", "token", "cvv", "cartao",
                      "cpf", "rg", "chave privada", "codigo de seguranca",
                      "endereco completo", "diagnostico", "doenca", "religiao",
                      "partido politico", "orientacao sexual"
                  ).any { it in n }
              }

              private fun normalize(value: String): String =
                  Normalizer.normalize(value.lowercase(Locale.ROOT), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}+"), "")
                      .replace(Regex("[^a-z0-9 ]+"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
          }
          EOF

          # ======================================================
          # Planner determinístico mais forte, até 8 etapas.
          # ======================================================

          cat > "$SRC/ZevronPlanner.kt" <<'EOF'
          package com.gama.assistant

          import java.text.Normalizer
          import java.util.Locale

          object ZevronPlanner {
              data class Plan(val steps: List<String>) {
                  val size: Int get() = steps.size
              }

              private val separators = Regex(
                  "(?i)\\s*(?:,|;)?\\s+(?:e\\s+depois|depois\\s+disso|depois|em\\s+seguida|" +
                      "logo\\s+depois|na\\s+sequencia|na\\s+sequência|e\\s+entao|e\\s+então|" +
                      "e\\s+ai|e\\s+aí|ai|aí|entao|então)\\s+"
              )

              private val punctuation = Regex("\\s*[,;]\\s*")

              private val actionVerbs = setOf(
                  "abra", "abre", "abrir", "inicie", "inicia", "iniciar",
                  "mande", "manda", "envie", "envia", "enviar",
                  "marque", "marca", "agende", "agenda", "adicione", "adiciona",
                  "ligue", "liga", "desligue", "desliga", "acenda", "apague",
                  "aumente", "aumenta", "diminua", "diminui",
                  "pause", "pausa", "continue", "continua", "retome", "retoma",
                  "leia", "le", "resuma", "resumo", "analise", "analisa",
                  "volte", "volta", "role", "rola", "toque", "reproduza",
                  "bloqueie", "bloqueia", "trave", "trava"
              )

              fun plan(raw: String): Plan? {
                  var command = ZevronConversationEngine.stripWakeWord(raw).trim()
                  command = command.replace(Regex("(?i)^primeiro\\s+"), "")
                  if (command.length < 8 || command.length > 1400) return null

                  val explicit = separators.containsMatchIn(command)
                  val punctuated = command.contains(',') || command.contains(';')
                  if (!explicit && !punctuated) return null

                  val firstPass = separators.split(command)
                      .map(::cleanStep)
                      .filter(String::isNotBlank)

                  val parts = if (firstPass.size >= 2) {
                      firstPass
                  } else {
                      punctuation.split(command)
                          .map(::cleanStep)
                          .filter(String::isNotBlank)
                  }

                  if (parts.size !in 2..8) return null
                  if (parts.any { it.length > 260 }) return null
                  if (!parts.all(::looksLikeAction)) return null

                  return Plan(parts)
              }

              internal fun looksLikeAction(raw: String): Boolean {
                  val c = normalize(raw)
                  if (c.isBlank()) return false
                  val first = c.substringBefore(' ')
                  if (first in actionVerbs) return true
                  if (WhatsAppCommandParser.looksLikeSendCommand(c)) return true
                  if (CommandRouter.looksLikeOpenRequest(c)) return true
                  if (CalendarCommandRouter.looksLikeCreateRequest(c)) return true
                  if (DeviceExtras.known(c)) return true
                  if (ZevronSystemControl.recognizes(c)) return true
                  if (SmartFeatures.isLocal(c) || SmartFeatures.isCalendar(c)) return true
                  if (GamaVisionCore.recognizes(c)) return true
                  return false
              }

              private fun cleanStep(value: String): String =
                  value.trim()
                      .trim(',', ';', '.', ' ')
                      .replace(Regex("(?i)^primeiro\\s+"), "")
                      .replace(Regex("(?i)^por\\s+fim\\s+"), "")
                      .replace(Regex("\\s+"), " ")
                      .trim()

              private fun normalize(value: String): String =
                  Normalizer.normalize(value.lowercase(Locale.ROOT), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}+"), "")
                      .replace(Regex("[^a-z0-9 ]+"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
          }
          EOF

          # ======================================================
          # Recuperação automática com proteção contra crash-loop.
          # ======================================================

          cat > "$SRC/GamaRecoveryCoordinator.kt" <<'EOF'
          package com.gama.assistant

          import java.util.concurrent.ConcurrentHashMap

          object GamaRecoveryCoordinator {
              private data class State(var failures: Int, var lastAt: Long)
              private val states = ConcurrentHashMap<String, State>()

              @Synchronized
              fun nextDelayMs(component: String, now: Long = System.currentTimeMillis()): Long {
                  val previous = states[component]
                  val state = if (previous == null || now - previous.lastAt > 120_000L) {
                      State(1, now)
                  } else {
                      previous.apply {
                          failures = (failures + 1).coerceAtMost(7)
                          lastAt = now
                      }
                  }
                  states[component] = state
                  return when (state.failures) {
                      1 -> 500L
                      2 -> 1_000L
                      3 -> 2_000L
                      4 -> 4_000L
                      5 -> 8_000L
                      else -> 15_000L
                  }
              }

              fun markHealthy(component: String) {
                  states.remove(component)
              }
          }
          EOF

          cat > "$SRC/RuntimeRecoveryBus.kt" <<'EOF'
          package com.gama.assistant

          object RuntimeRecoveryBus {
              @Volatile
              var listener: ((String, String) -> Unit)? = null

              fun isRecoverableWorker(threadName: String): Boolean {
                  return threadName == "gama-listener" ||
                      threadName == "gama-live-info" ||
                      threadName == "gama-research" ||
                      threadName == "gama-periodic-check" ||
                      threadName == "gama-calendar-awareness" ||
                      threadName == "gama-ambient-awareness" ||
                      threadName == "gama-local-vision" ||
                      threadName == "gama-super-tool" ||
                      threadName == "gama-intro-capabilities" ||
                      threadName.startsWith("gama-retry-")
              }
          }
          EOF

          # ======================================================
          # Proatividade local: bateria + armazenamento + térmico.
          # ======================================================

          cat > "$SRC/GamaSystemAwareness.kt" <<'EOF'
          package com.gama.assistant

          import android.content.Context
          import android.os.BatteryManager
          import android.os.Build
          import android.os.PowerManager
          import android.os.StatFs

          object GamaSystemAwareness {
              private const val PREFS = "gama_system_awareness"
              private const val KEY_LOW_BATTERY_AT = "low_battery_at"
              private const val KEY_STORAGE_AT = "storage_at"
              private const val KEY_THERMAL_AT = "thermal_at"
              private const val LOW_BATTERY_COOLDOWN_MS = 90L * 60L * 1000L
              private const val STORAGE_COOLDOWN_MS = 6L * 60L * 60L * 1000L
              private const val THERMAL_COOLDOWN_MS = 30L * 60L * 1000L

              fun poll(context: Context, now: Long = System.currentTimeMillis()): GamaEventHub.Event? {
                  thermalEvent(context, now)?.let { return it }
                  batteryEvent(context, now)?.let { return it }
                  storageEvent(context, now)?.let { return it }
                  return null
              }

              private fun thermalEvent(context: Context, now: Long): GamaEventHub.Event? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) return null
                  val pm = context.getSystemService(PowerManager::class.java) ?: return null
                  val status = runCatching { pm.currentThermalStatus }.getOrDefault(PowerManager.THERMAL_STATUS_NONE)
                  if (status < PowerManager.THERMAL_STATUS_SEVERE) return null
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val last = prefs.getLong(KEY_THERMAL_AT, 0L)
                  if (last > 0L && now - last < THERMAL_COOLDOWN_MS) return null
                  prefs.edit().putLong(KEY_THERMAL_AT, now).apply()
                  return GamaEventHub.Event(
                      kind = GamaEventHub.Kind.SYSTEM,
                      source = "Temperatura",
                      summary = "O aparelho está muito quente. Vale reduzir a carga e deixar o celular esfriar.",
                      priority = GamaEventHub.Priority.HIGH,
                      occurredAt = now,
                  )
              }

              private fun batteryEvent(context: Context, now: Long): GamaEventHub.Event? {
                  val bm = context.getSystemService(BatteryManager::class.java) ?: return null
                  val level = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  if (level !in 0..15 || bm.isCharging) return null
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val last = prefs.getLong(KEY_LOW_BATTERY_AT, 0L)
                  if (last > 0L && now - last < LOW_BATTERY_COOLDOWN_MS) return null
                  prefs.edit().putLong(KEY_LOW_BATTERY_AT, now).apply()
                  return GamaEventHub.Event(
                      kind = GamaEventHub.Kind.SYSTEM,
                      source = "Bateria",
                      summary = if (level <= 5) {
                          "A bateria está em $level%. Conecte o carregador assim que puder."
                      } else {
                          "A bateria está em $level%."
                      },
                      priority = GamaEventHub.Priority.HIGH,
                      occurredAt = now,
                  )
              }

              private fun storageEvent(context: Context, now: Long): GamaEventHub.Event? {
                  val fs = runCatching { StatFs(context.filesDir.absolutePath) }.getOrNull() ?: return null
                  val available = fs.availableBytes
                  val total = fs.totalBytes.coerceAtLeast(1L)
                  val low = available < 1_500_000_000L || available.toDouble() / total.toDouble() < 0.05
                  if (!low) return null
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val last = prefs.getLong(KEY_STORAGE_AT, 0L)
                  if (last > 0L && now - last < STORAGE_COOLDOWN_MS) return null
                  prefs.edit().putLong(KEY_STORAGE_AT, now).apply()
                  val mb = available / (1024L * 1024L)
                  return GamaEventHub.Event(
                      kind = GamaEventHub.Kind.SYSTEM,
                      source = "Armazenamento",
                      summary = "O armazenamento está quase cheio. Restam aproximadamente $mb MB livres.",
                      priority = GamaEventHub.Priority.HIGH,
                      occurredAt = now,
                  )
              }
          }
          EOF

          # ======================================================
          # Memória entra no contexto do LLM local.
          # ======================================================

          python3 - "$CORE" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          needle = "            ZevronMemoryStore.brainContext(context),\n"
          addition = needle + "            GamaAdaptiveMemory.contextSummary(context),\n"
          if "GamaAdaptiveMemory.contextSummary(context)" not in s:
              if needle not in s:
                  raise SystemExit("ZevronJarvisCore memory anchor not found")
              s = s.replace(needle, addition, 1)
          p.write_text(s, encoding="utf-8")
          PY

          # ======================================================
          # Memória observada sem interromper comandos normais.
          # Consultas de memória são respondidas localmente.
          # ======================================================

          python3 - "$SUPER" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          anchor = "        GamaTaskMemory.touch(context)\n"
          block = anchor + "\n        GamaAdaptiveMemory.observe(context, raw)\n        GamaAdaptiveMemory.replyForQuery(context, raw)?.let { reply ->\n            callback(reply)\n            return true\n        }\n"
          if "GamaAdaptiveMemory.observe(context, raw)" not in s:
              if anchor not in s:
                  raise SystemExit("GamaSuperAssistantCore memory anchor not found")
              s = s.replace(anchor, block, 1)
          p.write_text(s, encoding="utf-8")
          PY

          # ======================================================
          # Integração no GamaService:
          # visão -> cérebro local, ACTION_UI_PULSE e recovery.
          # ======================================================

          python3 - "$SERVICE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          if "// GAMA2000_LOCAL_VISION_ROUTER" not in s:
              anchor = """        // GAMA92_TIME_AND_SCREEN_FAST_LANES
                  GamaScreenFastLane.handle(this, command)?.let {
          """
              block = """        // GAMA2000_LOCAL_VISION_ROUTER
                  if (!isDeviceLocked() && GamaVisionCore.recognizes(command)) {
                      val visionSequence = userCommandSequence
                      setConversationVisual(GamaEnergyView.Mode.THINKING)
                      updateNotification("Analisando a tela localmente...")

                      GamaVisionCore.captureTextAsync(applicationContext) { visibleText ->
                          uiHandler.post {
                              if (!running || visionSequence != userCommandSequence) return@post

                              if (visibleText.isBlank()) {
                                  speak("Não consegui obter texto visível dessa tela agora.", true)
                                  return@post
                              }

                              if (GamaVisionCore.requiresReasoning(command)) {
                                  answerWithBrainAsync(
                                      ZevronJarvisCore.brainInstruction(
                                          command.trim() +
                                              "\\nContexto visual extraído localmente por Accessibility e OCR: " +
                                              visibleText.take(6000)
                                      )
                                  )
                              } else {
                                  speak(GamaVisionCore.spokenReadReply(visibleText))
                              }
                          }
                      }
                      return
                  }

          """
              if anchor not in s:
                  raise SystemExit("GamaService screen fast-lane anchor not found")
              s = s.replace(anchor, block + anchor, 1)

          if "ACTION_UI_PULSE" not in s:
              anchor = """    try { sendBroadcast(Intent(LockScreenActivity.ACTION_SPEAKING).setPackage(packageName)) }
              catch (e: Exception) { Log.w(TAG, "Falha no broadcast de fala", e) }
          """
              block = anchor + """    try {
                  if (isDeviceLocked()) {
                      sendBroadcast(
                          Intent("com.gama.assistant.ACTION_UI_PULSE").setPackage(packageName)
                      )
                  }
              } catch (e: Exception) {
                  Log.w(TAG, "Falha no pulso visual da lockscreen", e)
              }
          """
              if anchor not in s:
                  raise SystemExit("GamaService speech broadcast anchor not found")
              s = s.replace(anchor, block, 1)

          old = """    private fun handleRecoverableWorkerFailure(threadName: String, errorClass: String) {
                  CrashRecorder.recordSoft(this, if (threadName == "gama-listener") "microphone" else "worker", errorClass)
                  if (threadName == "gama-listener") {
                      recoverMicrophoneOnly("worker")
                  }
                  // Other named workers are one-shot tasks. Their failure stays isolated and the
                  // foreground voice service continues normally.
              }
          """

          new = """    private fun handleRecoverableWorkerFailure(threadName: String, errorClass: String) {
                  CrashRecorder.recordSoft(
                      this,
                      if (threadName == "gama-listener") "microphone" else "worker",
                      errorClass
                  )

                  val delay = GamaRecoveryCoordinator.nextDelayMs(threadName)

                  when (threadName) {
                      "gama-listener" -> {
                          uiHandler.postDelayed({
                              if (BackgroundMode.enabled(this) && listenerThread?.isAlive != true) {
                                  recoverMicrophoneOnly("worker")
                              }
                          }, delay)
                      }

                      "gama-periodic-check",
                      "gama-calendar-awareness",
                      "gama-ambient-awareness" -> {
                          uiHandler.postDelayed({
                              if (running) scheduleAutomationTick()
                          }, delay)
                      }

                      "gama-live-info",
                      "gama-research",
                      "gama-local-vision",
                      "gama-super-tool",
                      "gama-intro-capabilities" -> {
                          uiHandler.postDelayed({
                              if (running) {
                                  updateNotification("Gama recuperado • pronto")
                                  setConversationVisual(GamaEnergyView.Mode.LISTENING)
                              }
                          }, delay)
                      }
                  }
              }
          """

          if "GamaRecoveryCoordinator.nextDelayMs(threadName)" not in s:
              if old not in s:
                  raise SystemExit("handleRecoverableWorkerFailure anchor not found")
              s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          PY

          # ======================================================
          # Missões sobrevivem por um dia, sem execução autônoma
          # após reinício. O usuário ainda precisa dizer continuar.
          # ======================================================

          sed -i 's/private const val MAX_AGE_MS = 6L \* 60L \* 60L \* 1000L/private const val MAX_AGE_MS = 24L * 60L * 60L * 1000L/' "$SRC/GamaMissionStore.kt"

          # ======================================================
          # Auditoria: nenhuma função anterior é removida.
          # ======================================================

          test -s "$SRC/GamaAdaptiveMemory.kt"
          test -s "$SRC/GamaRecoveryCoordinator.kt"
          test -s "$SRC/GamaVisionCore.kt"

          grep -Fq 'GamaAdaptiveMemory.contextSummary(context)' "$CORE"
          grep -Fq 'GamaAdaptiveMemory.observe(context, raw)' "$SUPER"
          grep -Fq 'GAMA2000_LOCAL_VISION_ROUTER' "$SERVICE"
          grep -Fq 'ACTION_UI_PULSE' "$SERVICE"
          grep -Fq 'GamaRecoveryCoordinator.nextDelayMs(threadName)' "$SERVICE"
          grep -Fq 'captureCurrentBitmap' "$ACCESS"
          grep -Fq 'android:canTakeScreenshot="true"' "$ACCESS_XML"
          grep -Fq 'implementation("com.google.mlkit:text-recognition:16.0.1")' "$GRADLE"
          grep -Fq 'implementation("com.google.mediapipe:tasks-genai:0.10.27")' "$GRADLE"

          # Capacidades do #118 que precisam continuar presentes.
          grep -Fq 'interruptSpeechForBargeIn' "$SERVICE"
          grep -Fq 'GamaMissionStore' "$SERVICE"
          grep -Fq 'GamaProactiveBridge' "$SERVICE"
          grep -Fq 'GamaAutomationEngine' "$SERVICE"
          grep -Fq 'class LocalBrain' "$SRC/LocalBrain.kt"
          grep -Fq 'LlmInference' "$SRC/LocalBrain.kt"

          if grep -R -E 'api\.groq\.com|api\.openai\.com|api\.elevenlabs\.io|retrofit2\.|okhttp3\.' \
              "$SRC/GamaAdaptiveMemory.kt" "$SRC/GamaVisionCore.kt" "$SRC/GamaRecoveryCoordinator.kt"; then
            echo "Cloud dependency detected in GAMA 2000 local core." >&2
            exit 1
          fi

          echo "GAMA JARVIS 2000 Autonomy Core injected successfully."

      - name: Audit consolidated capabilities
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 tools/audit_gama.py

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Gama 8.2.0 build version
        working-directory: _gama_build
        run: |
          set -euo pipefail
          VC=$((22400000 + GITHUB_RUN_NUMBER))
          sed -Ei "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $VC/" app/build.gradle.kts
          sed -Ei 's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "Gama 8.2.0"/' app/build.gradle.kts
          grep -F 'versionName = "Gama 8.2.0"' app/build.gradle.kts

      - name: Run voice and conversation regression tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace             --tests 'com.gama.assistant.GamaRecognitionPolicyTest'             --tests 'com.gama.assistant.GamaAudioFrontEndTest'             --tests 'com.gama.assistant.ConversationSessionTest'             --tests 'com.gama.assistant.VoicePolicyTest'             --tests 'com.gama.assistant.ActionFollowUpTest'             --tests 'com.gama.assistant.GamaSpeechNoisePolicyTest'             2>&1 | tee "$GITHUB_WORKSPACE/gama-voice-tests.log"

      - name: Build and verify Gama 8.2.0 APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          if [ -x tools/download_models.sh ]; then bash tools/download_models.sh; fi
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" dist/Gama.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Gama.apk
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)

      - name: Upload Gama 8.2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.2.0-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Upload Gama 8.2.0 source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.2.0-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Publish Gama 8.2.0 release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="gama-v8.2.0-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG"             "_gama_build/dist/Gama.apk#Gama.apk"             "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256"             --repo "$GITHUB_REPOSITORY"             --title "Gama 8.2.0"             --notes "Reconhecimento de voz refeito para reduzir repetições: transição imediata do hotword para o comando, decoder contínuo na conversa, recuperação de parcial Vosk, endpoint protegido, foco de microfone, anti-vento/ruído e confirmação simples para ações sensíveis."             --latest

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.2.0-diagnostics
          path: |
            gama-build.log
            gama-voice-tests.log
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn
