name: Build Gama APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create fixed Gama project
        shell: bash
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/gama/assistant app/src/main/res/drawable

          cat > 'settings.gradle.kts' <<'EOF_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Gama"
          include(":app")
          EOF_SETTINGS

          cat > 'build.gradle.kts' <<'EOF_BUILD'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF_BUILD

          cat > 'gradle.properties' <<'EOF_PROPERTIES'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          kotlin.code.style=official
          EOF_PROPERTIES

          cat > 'app/build.gradle.kts' <<'EOF_APP_BUILD'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.gama.assistant"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.gama.assistant"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("com.alphacephei:vosk-android:0.3.47@aar")
              implementation("net.java.dev.jna:jna:5.13.0@aar")
          }
          EOF_APP_BUILD

          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>

              <application
                  android:label="Gama"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".GamaService"
                      android:exported="false"
                      android:foregroundServiceType="microphone"/>

              </application>
          </manifest>
          EOF_MANIFEST

          cat > 'app/src/main/java/com/gama/assistant/MainActivity.kt' <<'EOF_MAIN'
          package com.gama.assistant

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private var waitOverlay = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(40, 70, 40, 40)
                      setBackgroundColor(Color.rgb(7, 10, 16))
                  }

                  fun label(
                      value: String,
                      size: Float,
                      color: Int
                  ) = TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(color)
                      setPadding(0, 12, 0, 12)
                  }

                  box.addView(
                      label(
                          "GAMA",
                          34f,
                          Color.WHITE
                      )
                  )

                  box.addView(
                      label(
                          "Assistente de voz local",
                          16f,
                          Color.LTGRAY
                      )
                  )

                  status = label(
                      "Status: parado",
                      18f,
                      Color.rgb(255, 145, 45)
                  )

                  box.addView(status)

                  box.addView(
                      Button(this).apply {
                          text = "Ativar Gama"

                          setOnClickListener {
                              startGama()
                          }
                      }
                  )

                  box.addView(
                      Button(this).apply {
                          text = "Parar Gama"

                          setOnClickListener {
                              stopService(
                                  Intent(
                                      this@MainActivity,
                                      GamaService::class.java
                                  )
                              )

                              status.text = "Status: parado"
                          }
                      }
                  )

                  box.addView(
                      Button(this).apply {
                          text = "Permitir bolinha flutuante"

                          setOnClickListener {
                              askOverlay()
                          }
                      }
                  )

                  box.addView(
                      label(
                          "Diga “Gama”. Ele responde “Sim?”. " +
                                  "Depois fale o comando, por exemplo: " +
                                  "“abra o WhatsApp”.\n\n" +
                                  "Também funciona dizendo tudo junto: " +
                                  "“Gama, abra o Instagram”.",
                          14f,
                          Color.LTGRAY
                      )
                  )

                  setContentView(box)
              }

              override fun onResume() {
                  super.onResume()

                  if (
                      waitOverlay &&
                      Settings.canDrawOverlays(this)
                  ) {
                      waitOverlay = false
                      startGama()
                  }
              }

              private fun askOverlay() {

                  if (
                      Settings.canDrawOverlays(this)
                  ) {
                      status.text =
                          "Bolinha flutuante permitida"

                      return
                  }

                  waitOverlay = true

                  startActivity(
                      Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse(
                              "package:$packageName"
                          )
                      )
                  )
              }

              private fun startGama() {

                  val needed =
                      mutableListOf<String>()

                  if (
                      checkSelfPermission(
                          Manifest.permission.RECORD_AUDIO
                      ) !=
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      needed +=
                          Manifest.permission.RECORD_AUDIO
                  }

                  if (
                      checkSelfPermission(
                          Manifest.permission.CAMERA
                      ) !=
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      needed +=
                          Manifest.permission.CAMERA
                  }

                  if (
                      Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(
                          Manifest.permission.POST_NOTIFICATIONS
                      ) !=
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      needed +=
                          Manifest.permission.POST_NOTIFICATIONS
                  }

                  if (
                      needed.isNotEmpty()
                  ) {
                      requestPermissions(
                          needed.toTypedArray(),
                          10
                      )

                      return
                  }

                  if (
                      !Settings.canDrawOverlays(this)
                  ) {
                      askOverlay()
                      return
                  }

                  val intent =
                      Intent(
                          this,
                          GamaService::class.java
                      )

                  if (
                      Build.VERSION.SDK_INT >= 26
                  ) {
                      startForegroundService(
                          intent
                      )
                  } else {
                      startService(
                          intent
                      )
                  }

                  status.text =
                      "Status: ativo. Diga “Gama”."
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  )

                  if (
                      requestCode == 10 &&
                      grantResults.isNotEmpty() &&
                      grantResults.all {
                          it ==
                          PackageManager.PERMISSION_GRANTED
                      }
                  ) {
                      startGama()
                  } else if (
                      requestCode == 10
                  ) {
                      status.text =
                          "Permita microfone e câmera."
                  }
              }
          }
          EOF_MAIN

          cat > 'app/src/main/java/com/gama/assistant/GamaService.kt' <<'EOF_SERVICE'
          package com.gama.assistant

          import android.animation.AnimatorSet
          import android.animation.ObjectAnimator
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.PixelFormat
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.*
          import android.os.*
          import android.provider.MediaStore
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.view.*
          import android.widget.ImageView
          import org.json.JSONObject
          import org.vosk.Model
          import org.vosk.Recognizer
          import java.io.File
          import java.io.FileOutputStream
          import java.text.Normalizer
          import java.util.Locale
          import kotlin.concurrent.thread

          class GamaService :
              Service(),
              TextToSpeech.OnInitListener {

              companion object {
                  const val CH =
                      "gama_voice"

                  const val ID =
                      42

                  const val SR =
                      16000

                  const val WINDOW =
                      9000L
              }

              @Volatile
              private var running =
                  false

              @Volatile
              private var speaking =
                  false

              private var awakeUntil =
                  0L

              private var ttsReady =
                  false

              private var pending:
                  String? = null

              private var audio:
                  AudioRecord? = null

              private var recognizer:
                  Recognizer? = null

              private var model:
                  Model? = null

              private var tts:
                  TextToSpeech? = null

              private var windowManager:
                  WindowManager? = null

              private var orb:
                  ImageView? = null

              private var orbParams:
                  WindowManager.LayoutParams? =
                  null

              private var spin:
                  ObjectAnimator? = null

              override fun onCreate() {
                  super.onCreate()

                  createChannel()

                  startForeground(
                      ID,
                      notification(
                          "Preparando reconhecimento..."
                      )
                  )

                  tts =
                      TextToSpeech(
                          this,
                          this
                      )

                  showOrb()

                  running = true

                  thread(
                      name = "gama-listener"
                  ) {
                      listen()
                  }
              }

              override fun onStartCommand(
                  intent: Intent?,
                  flags: Int,
                  startId: Int
              ): Int {
                  return START_STICKY
              }

              override fun onBind(
                  intent: Intent?
              ): IBinder? {
                  return null
              }

              override fun onDestroy() {

                  running = false

                  try {
                      audio?.stop()
                  } catch (_: Exception) {
                  }

                  audio?.release()
                  recognizer?.close()
                  model?.close()

                  tts?.stop()
                  tts?.shutdown()

                  removeOrb()

                  super.onDestroy()
              }

              override fun onInit(
                  status: Int
              ) {

                  if (
                      status !=
                      TextToSpeech.SUCCESS
                  ) {
                      updateNotification(
                          "TTS indisponível."
                      )

                      return
                  }

                  ttsReady = true

                  tts?.language =
                      Locale(
                          "pt",
                          "BR"
                      )

                  tts?.setPitch(
                      0.82f
                  )

                  tts?.setSpeechRate(
                      0.94f
                  )

                  tts?.setOnUtteranceProgressListener(
                      object :
                          UtteranceProgressListener() {

                          override fun onStart(
                              utteranceId: String?
                          ) {
                              speaking = true

                              pulse(
                                  1.15f,
                                  900
                              )
                          }

                          override fun onDone(
                              utteranceId: String?
                          ) {
                              speaking = false

                              try {
                                  recognizer?.reset()
                              } catch (_: Exception) {
                              }
                          }

                          @Deprecated(
                              "Deprecated in Java"
                          )
                          override fun onError(
                              utteranceId: String?
                          ) {
                              speaking = false
                          }
                      }
                  )

                  pending?.let {

                      pending = null

                      speak(it)
                  }
              }

              private fun listen() {

                  try {

                      val modelDirectory =
                          ensureModel()

                      model =
                          Model(
                              modelDirectory.absolutePath
                          )

                      recognizer =
                          Recognizer(
                              model,
                              SR.toFloat()
                          )

                      val minimumBuffer =
                          AudioRecord.getMinBufferSize(
                              SR,
                              AudioFormat.CHANNEL_IN_MONO,
                              AudioFormat.ENCODING_PCM_16BIT
                          ).coerceAtLeast(
                              4096
                          )

                      audio =
                          AudioRecord(
                              MediaRecorder.AudioSource.MIC,
                              SR,
                              AudioFormat.CHANNEL_IN_MONO,
                              AudioFormat.ENCODING_PCM_16BIT,
                              minimumBuffer * 2
                          )

                      if (
                          audio?.state !=
                          AudioRecord.STATE_INITIALIZED
                      ) {
                          error(
                              "microfone não inicializou"
                          )
                      }

                      val buffer =
                          ByteArray(
                              minimumBuffer
                          )

                      audio?.startRecording()

                      updateNotification(
                          "Gama ouvindo. Diga “Gama”."
                      )

                      while (
                          running
                      ) {

                          val amount =
                              audio?.read(
                                  buffer,
                                  0,
                                  buffer.size
                              ) ?: 0

                          if (
                              amount <= 0 ||
                              speaking
                          ) {
                              continue
                          }

                          val r =
                              recognizer
                                  ?: continue

                          if (
                              r.acceptWaveForm(
                                  buffer,
                                  amount
                              )
                          ) {

                              val text =
                                  JSONObject(
                                      r.result
                                  ).optString(
                                      "text"
                                  )

                              handle(
                                  text
                              )

                          } else {

                              val partial =
                                  normalize(
                                      JSONObject(
                                          r.partialResult
                                      ).optString(
                                          "partial"
                                      )
                                  )

                              if (
                                  partial.contains(
                                      "gama"
                                  )
                              ) {

                                  awakeUntil =
                                      SystemClock
                                          .elapsedRealtime() +
                                      WINDOW

                                  pulse(
                                      1.22f,
                                      450
                                  )

                                  updateNotification(
                                      "Ouvi você. Pode falar."
                                  )
                              }
                          }
                      }

                  } catch (
                      exception: Exception
                  ) {

                      updateNotification(
                          "Erro de voz: " +
                                  (
                                          exception.message
                                              ?: "falha"
                                          )
                      )

                      speak(
                          "Tive um problema ao iniciar o microfone."
                      )
                  }
              }

              private fun handle(
                  raw: String
              ) {

                  val text =
                      normalize(
                          raw
                      )

                  if (
                      text.isBlank()
                  ) {
                      return
                  }

                  val wakeIndex =
                      text.indexOf(
                          "gama"
                      )

                  if (
                      wakeIndex >= 0
                  ) {

                      awakeUntil =
                          SystemClock
                              .elapsedRealtime() +
                          WINDOW

                      pulse(
                          1.22f,
                          450
                      )

                      val command =
                          text.substring(
                              wakeIndex + 4
                          ).trim()

                      if (
                          command.isBlank()
                      ) {

                          speak(
                              "Sim?"
                          )

                          updateNotification(
                              "Gama ativo. Fale o comando."
                          )

                      } else {

                          reply(
                              command
                          )
                      }

                      return
                  }

                  if (
                      SystemClock
                          .elapsedRealtime() <=
                      awakeUntil
                  ) {
                      reply(
                          text
                      )
                  }
              }

              private fun reply(
                  command: String
              ) {

                  awakeUntil = 0L

                  val response =
                      execute(
                          command
                      )

                  updateNotification(
                      response
                  )

                  speak(
                      response
                  )
              }

              private fun execute(
                  command: String
              ): String {

                  return when {

                      command.contains(
                          "whatsapp"
                      ) ->
                          openPackage(
                              "com.whatsapp",
                              "WhatsApp"
                          )

                      command.contains(
                          "instagram"
                      ) ||
                      command.contains(
                          "insta"
                      ) ->
                          openPackage(
                              "com.instagram.android",
                              "Instagram"
                          )

                      command.contains(
                          "youtube"
                      ) ->
                          openPackage(
                              "com.google.android.youtube",
                              "YouTube"
                          )

                      command.contains(
                          "camera"
                      ) ->
                          launch(
                              Intent(
                                  MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA
                              ),
                              "Abrindo a câmera.",
                              "Não consegui abrir a câmera."
                          )

                      command.contains(
                          "configur"
                      ) ||
                      command.contains(
                          "ajustes"
                      ) ->
                          launch(
                              Intent(
                                  Settings.ACTION_SETTINGS
                              ),
                              "Abrindo as configurações.",
                              "Não consegui abrir as configurações."
                          )

                      command.contains(
                          "tela inicial"
                      ) ||
                      command == "inicio" ->
                          launch(
                              Intent(
                                  Intent.ACTION_MAIN
                              ).addCategory(
                                  Intent.CATEGORY_HOME
                              ),
                              "Voltando para a tela inicial.",
                              "Não consegui voltar."
                          )

                      command.contains(
                          "aument"
                      ) &&
                      command.contains(
                          "volume"
                      ) -> {

                          audioManager()
                              .adjustStreamVolume(
                                  AudioManager.STREAM_MUSIC,
                                  AudioManager.ADJUST_RAISE,
                                  AudioManager.FLAG_SHOW_UI
                              )

                          "Aumentei o volume."
                      }

                      (
                              command.contains(
                                  "diminu"
                              ) ||
                              command.contains(
                                  "abaix"
                              )
                              ) &&
                      command.contains(
                          "volume"
                      ) -> {

                          audioManager()
                              .adjustStreamVolume(
                                  AudioManager.STREAM_MUSIC,
                                  AudioManager.ADJUST_LOWER,
                                  AudioManager.FLAG_SHOW_UI
                              )

                          "Diminuí o volume."
                      }

                      command.contains(
                          "silenci"
                      ) &&
                      command.contains(
                          "volume"
                      ) -> {

                          audioManager()
                              .adjustStreamVolume(
                                  AudioManager.STREAM_MUSIC,
                                  AudioManager.ADJUST_MUTE,
                                  AudioManager.FLAG_SHOW_UI
                              )

                          "Volume silenciado."
                      }

                      command.contains(
                          "pause"
                      ) ||
                      command.contains(
                          "pausar"
                      ) -> {

                          mediaKey(
                              KeyEvent.KEYCODE_MEDIA_PAUSE
                          )

                          "Música pausada."
                      }

                      command.contains(
                          "continue"
                      ) ||
                      command.contains(
                          "retome"
                      ) ||
                      command.contains(
                          "reprodu"
                      ) -> {

                          mediaKey(
                              KeyEvent.KEYCODE_MEDIA_PLAY
                          )

                          "Continuando."
                      }

                      command.contains(
                          "proxima"
                      ) &&
                      command.contains(
                          "musica"
                      ) -> {

                          mediaKey(
                              KeyEvent.KEYCODE_MEDIA_NEXT
                          )

                          "Próxima música."
                      }

                      command.contains(
                          "anterior"
                      ) &&
                      (
                              command.contains(
                                  "musica"
                              ) ||
                              command.contains(
                                  "faixa"
                              )
                              ) -> {

                          mediaKey(
                              KeyEvent.KEYCODE_MEDIA_PREVIOUS
                          )

                          "Música anterior."
                      }

                      command.contains(
                          "lanterna"
                      ) &&
                      command.contains(
                          "lig"
                      ) -> {

                          if (
                              torch(
                                  true
                              )
                          ) {
                              "Lanterna ligada."
                          } else {
                              "Não encontrei a lanterna."
                          }
                      }

                      command.contains(
                          "lanterna"
                      ) &&
                      (
                              command.contains(
                                  "deslig"
                              ) ||
                              command.contains(
                                  "apague"
                              )
                              ) -> {

                          if (
                              torch(
                                  false
                              )
                          ) {
                              "Lanterna desligada."
                          } else {
                              "Não encontrei a lanterna."
                          }
                      }

                      command.startsWith(
                          "abra "
                      ) ||
                      command.startsWith(
                          "abrir "
                      ) -> {

                          openByName(
                              command
                                  .removePrefix(
                                      "abra "
                                  )
                                  .removePrefix(
                                      "abrir "
                                  )
                                  .trim()
                          )
                      }

                      else ->
                          "Ainda não reconheço esse comando."
                  }
              }

              private fun launch(
                  intent: Intent,
                  success: String,
                  failure: String
              ): String {

                  return try {

                      intent.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK
                      )

                      startActivity(
                          intent
                      )

                      success

                  } catch (
                      _: Exception
                  ) {
                      failure
                  }
              }

              private fun openPackage(
                  packageName: String,
                  appName: String
              ): String {

                  return try {

                      val intent =
                          packageManager
                              .getLaunchIntentForPackage(
                                  packageName
                              )
                              ?: return
                              "Não encontrei o $appName neste celular."

                      intent.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK
                      )

                      startActivity(
                          intent
                      )

                      "Abrindo $appName."

                  } catch (
                      _: Exception
                  ) {

                      "Não consegui abrir o $appName."
                  }
              }

              private fun openByName(
                  query: String
              ): String {

                  return try {

                      val normalizedQuery =
                          normalize(
                              query
                          )

                      val launcher =
                          Intent(
                              Intent.ACTION_MAIN
                          ).addCategory(
                              Intent.CATEGORY_LAUNCHER
                          )

                      val activity =
                          packageManager
                              .queryIntentActivities(
                                  launcher,
                                  PackageManager.MATCH_ALL
                              )
                              .firstOrNull {

                                  val label =
                                      normalize(
                                          it
                                              .loadLabel(
                                                  packageManager
                                              )
                                              .toString()
                                      )

                                  label ==
                                  normalizedQuery ||
                                  label.contains(
                                      normalizedQuery
                                  ) ||
                                  normalizedQuery.contains(
                                      label
                                  )
                              }
                              ?: return
                              "Não encontrei o aplicativo $query."

                      val intent =
                          packageManager
                              .getLaunchIntentForPackage(
                                  activity
                                      .activityInfo
                                      .packageName
                              )
                              ?: return
                              "Esse aplicativo não pode ser aberto diretamente."

                      intent.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK
                      )

                      startActivity(
                          intent
                      )

                      "Abrindo ${
                          activity.loadLabel(
                              packageManager
                          )
                      }."

                  } catch (
                      _: Exception
                  ) {

                      "Não consegui abrir o aplicativo $query."
                  }
              }

              private fun audioManager():
                  AudioManager {

                  return getSystemService(
                      Context.AUDIO_SERVICE
                  ) as AudioManager
              }

              private fun mediaKey(
                  key: Int
              ) {

                  audioManager()
                      .dispatchMediaKeyEvent(
                          KeyEvent(
                              KeyEvent.ACTION_DOWN,
                              key
                          )
                      )

                  audioManager()
                      .dispatchMediaKeyEvent(
                          KeyEvent(
                              KeyEvent.ACTION_UP,
                              key
                          )
                      )
              }

              private fun torch(
                  enabled: Boolean
              ): Boolean {

                  return try {

                      val cameraManager =
                          getSystemService(
                              Context.CAMERA_SERVICE
                          ) as CameraManager

                      val id =
                          cameraManager
                              .cameraIdList
                              .firstOrNull {

                                  cameraManager
                                      .getCameraCharacteristics(
                                          it
                                      )
                                      .get(
                                          CameraCharacteristics
                                              .FLASH_INFO_AVAILABLE
                                      ) == true
                              }
                              ?: return false

                      cameraManager
                          .setTorchMode(
                              id,
                              enabled
                          )

                      true

                  } catch (
                      _: Exception
                  ) {
                      false
                  }
              }

              private fun speak(
                  text: String
              ) {

                  if (
                      !ttsReady
                  ) {
                      pending = text
                      return
                  }

                  tts?.speak(
                      text,
                      TextToSpeech.QUEUE_FLUSH,
                      null,
                      "gama_${
                          SystemClock.elapsedRealtime()
                      }"
                  )
              }

              private fun normalize(
                  text: String
              ): String {

                  return Normalizer
                      .normalize(
                          text.lowercase(
                              Locale(
                                  "pt",
                                  "BR"
                              )
                          ),
                          Normalizer.Form.NFD
                      )
                      .replace(
                          "\\p{Mn}+".toRegex(),
                          ""
                      )
                      .replace(
                          "[^a-z0-9 ]".toRegex(),
                          " "
                      )
                      .replace(
                          "\\s+".toRegex(),
                          " "
                      )
                      .trim()
              }

              private fun ensureModel():
                  File {

                  val directory =
                      File(
                          filesDir,
                          "vosk-pt"
                      )

                  val marker =
                      File(
                          directory,
                          ".ok"
                      )

                  if (
                      marker.exists()
                  ) {
                      return directory
                  }

                  if (
                      directory.exists()
                  ) {
                      directory.deleteRecursively()
                  }

                  directory.mkdirs()

                  copyTree(
                      "model",
                      directory
                  )

                  marker.writeText(
                      "ok"
                  )

                  return directory
              }

              private fun copyTree(
                  path: String,
                  output: File
              ) {

                  val list =
                      assets.list(
                          path
                      )
                          ?: emptyArray()

                  if (
                      list.isEmpty()
                  ) {

                      output
                          .parentFile
                          ?.mkdirs()

                      assets.open(
                          path
                      ).use { input ->

                          FileOutputStream(
                              output
                          ).use { file ->

                              input.copyTo(
                                  file
                              )
                          }
                      }

                  } else {

                      output.mkdirs()

                      list.forEach {

                          copyTree(
                              "$path/$it",
                              File(
                                  output,
                                  it
                              )
                          )
                      }
                  }
              }

              private fun showOrb() {

                  if (
                      !Settings.canDrawOverlays(
                          this
                      )
                  ) {
                      return
                  }

                  windowManager =
                      getSystemService(
                          Context.WINDOW_SERVICE
                      ) as WindowManager

                  orb =
                      ImageView(
                          this
                      ).apply {

                          setImageResource(
                              R.drawable.gama_orb
                          )

                          scaleType =
                              ImageView
                                  .ScaleType
                                  .FIT_CENTER

                          alpha =
                              0.96f
                      }

                  val windowType =
                      if (
                          Build.VERSION.SDK_INT >=
                          26
                      ) {
                          WindowManager
                              .LayoutParams
                              .TYPE_APPLICATION_OVERLAY
                      } else {
                          WindowManager
                              .LayoutParams
                              .TYPE_PHONE
                      }

                  orbParams =
                      WindowManager
                          .LayoutParams(
                              dp(92),
                              dp(92),
                              windowType,
                              WindowManager
                                  .LayoutParams
                                  .FLAG_NOT_FOCUSABLE or
                                      WindowManager
                                          .LayoutParams
                                          .FLAG_NOT_TOUCH_MODAL,
                              PixelFormat.TRANSLUCENT
                          )
                          .apply {

                              gravity =
                                  Gravity.BOTTOM or
                                      Gravity.END

                              x =
                                  dp(14)

                              y =
                                  dp(42)
                          }

                  orb?.setOnTouchListener(
                      object :
                          View.OnTouchListener {

                          var startX =
                              0

                          var startY =
                              0

                          var touchX =
                              0f

                          var touchY =
                              0f

                          override fun onTouch(
                              view: View?,
                              event: MotionEvent
                          ): Boolean {

                              val p =
                                  orbParams
                                      ?: return false

                              when (
                                  event.action
                              ) {

                                  MotionEvent.ACTION_DOWN -> {

                                      startX =
                                          p.x

                                      startY =
                                          p.y

                                      touchX =
                                          event.rawX

                                      touchY =
                                          event.rawY

                                      return true
                                  }

                                  MotionEvent.ACTION_MOVE -> {

                                      p.x =
                                          (
                                                  startX -
                                                  (
                                                          event.rawX -
                                                          touchX
                                                          )
                                                  )
                                              .toInt()

                                      p.y =
                                          (
                                                  startY -
                                                  (
                                                          event.rawY -
                                                          touchY
                                                          )
                                                  )
                                              .toInt()

                                      try {
                                          windowManager
                                              ?.updateViewLayout(
                                                  orb,
                                                  p
                                              )
                                      } catch (
                                          _: Exception
                                      ) {
                                      }

                                      return true
                                  }
                              }

                              return false
                          }
                      }
                  )

                  windowManager
                      ?.addView(
                          orb,
                          orbParams
                      )

                  spin =
                      ObjectAnimator
                          .ofFloat(
                              orb,
                              "rotation",
                              0f,
                              360f
                          )
                          .apply {

                              duration =
                                  14000

                              repeatCount =
                                  ObjectAnimator
                                      .INFINITE

                              start()
                          }
              }

              private fun pulse(
                  scale: Float,
                  durationMs: Long
              ) {

                  orb?.post {

                      AnimatorSet()
                          .apply {

                              playTogether(
                                  ObjectAnimator.ofFloat(
                                      orb,
                                      "scaleX",
                                      1f,
                                      scale,
                                      1f
                                  ),
                                  ObjectAnimator.ofFloat(
                                      orb,
                                      "scaleY",
                                      1f,
                                      scale,
                                      1f
                                  ),
                                  ObjectAnimator.ofFloat(
                                      orb,
                                      "alpha",
                                      0.78f,
                                      1f,
                                      0.94f
                                  )
                              )

                              duration =
                                  durationMs

                              start()
                          }
                  }
              }

              private fun removeOrb() {

                  spin?.cancel()

                  orb?.let {

                      try {
                          windowManager
                              ?.removeView(
                                  it
                              )
                      } catch (
                          _: Exception
                      ) {
                      }
                  }

                  orb = null
              }

              private fun dp(
                  value: Int
              ): Int {

                  return (
                          value *
                          resources
                              .displayMetrics
                              .density
                          )
                      .toInt()
              }

