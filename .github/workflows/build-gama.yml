name: Build Gama 9.5.0 Personal Intelligence Core FIX144

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-9-5-personal-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      GAMA_BASE_RUN_ID: "37158343882"
      GAMA_BASE_ARTIFACT: "Gama-9.3.0-JARVIS-source"
      GAMA_94_TEMPLATE_COMMIT: "b81455bdc29c25f85fa6b34612cee526e1c45508"
      GAMA_95_TEMPLATE_COMMIT: "efc8b1345f990b8f8b9e9b282cbf30ee0e779ce5"
      GAMA_EXPECTED_CERT_SHA256: "6933EDA890C29567A8F4B6CEAD7A39A442DF109D43B813A19F3F6FA7F39B078C"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-9.5.0-PERSONAL-INTELLIGENCE-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"

            echo "::warning::GAMA_SIGNING_SEED não está configurado."
            echo "::warning::O APK será Release, mas será FRESH-INSTALL-ONLY."
          elif printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-9.5.0-PERSONAL-INTELLIGENCE-APK" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GAMA_SIGNING_SEED deve possuir exatamente 64 caracteres hexadecimais."
            exit 1
          fi

      - name: Restore exact successful Gama 9.3.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download \
            "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaNotificationListener.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaEnergyView.kt

          grep -Fq \
            'Gama 9.3.0 JARVIS Reliability' \
            _gama_build/app/build.gradle.kts

          echo "PASS: fonte exata do #136 restaurada."

      - name: Verify exact audited source
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual

            test -s "$file"

            actual="$(git hash-object "$file")"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Fonte diferente da versão auditada: $file"
              echo "expected=$expected"
              echo "actual=$actual"
              exit 1
            fi

            echo "PASS $file"
          }

          ROOT="_gama_build"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaService.kt" \
            "da73a2f7aeec16fa5d6202812924164b776804d9"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/ConversationSession.kt" \
            "ccac0acb53313b63f0bccc06f20291da7b820920"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaSupervisor.kt" \
            "dea7bae963dc9bc18169238ef621ff386fb7672b"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaRecognitionPolicy.kt" \
            "cb0448b364902b7f47d8f1bbb1b4e8f8310a3e50"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/VoicePolicy.kt" \
            "21bec82e4144a232f6673711c7d4c7911971df68"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaAppRegistry.kt" \
            "f4d8b5e3c1ce3b7b011c73311c56aedec80c140d"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaReliableAppLauncher.kt" \
            "852ef57c39503cd02b7fd08a1e109693387876c0"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaLaunchFallback.kt" \
            "70427dd230eca9c81338d4652a12a4ff5c17543c"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/LocalBrain.kt" \
            "9f9b02c0768cb1ff1d36943e491cfb2c1efefbc7"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaBrainProcessService.kt" \
            "6ef1b60c8a7dc991b2d5f38bc59062544d512770"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/BrainProcessProtocol.kt" \
            "629b434dd22fbfad19dda0ef0784c4312bb1f009"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaReplyGuard.kt" \
            "01cf76301cb8915bf8ef58043c02424175c7e628"

          check_blob \
            "$ROOT/app/build.gradle.kts" \
            "e8005e575476b8152c33a9db0dc82556d0de657c"

          check_blob \
            "$ROOT/app/src/main/AndroidManifest.xml" \
            "e898888312d7c1355cf751b9dc391ca1aa3a48ea"

      # ==============================================================
      # GAMA 9.4 CONTINUOUS CORE
      #
      # FIX144:
      # O #144 falhou nesta etapa porque os regex recuperados do #139
      # escapavam espaços literalmente.
      #
      # Agora:
      # - as 9 quebras sintáticas antigas são corrigidas;
      # - padrões regex multilinha são dedentados;
      # - "\ " dos regex antigos vira "\s+";
      # - replace_once possui fallback tolerante a whitespace;
      # - Python é validado antes de modificar o source.
      # ==============================================================

      - name: Recover corrected Gama 9.4 Continuous Core
        run: |
          set -euo pipefail

          git show \
            "$GAMA_94_TEMPLATE_COMMIT:.github/workflows/build-gama.yml" \
            > /tmp/gama139.yml

          python3 - \
            /tmp/gama139.yml \
            /tmp/gama94-transform.py <<'PY'
          from pathlib import Path
          import ast
          import re
          import sys
          import textwrap

          workflow_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])

          workflow = workflow_path.read_text(
              encoding="utf-8"
          ).splitlines()

          step = next(
              (
                  i
                  for i, line in enumerate(workflow)
                  if "name: Apply Gama 9.4.0 Continuous Core" in line
              ),
              None,
          )

          if step is None:
              raise SystemExit(
                  "Etapa Continuous Core não encontrada no commit do #139."
              )

          start = next(
              (
                  i
                  for i in range(step + 1, len(workflow))
                  if workflow[i].strip() == "python3 - <<'PY'"
              ),
              None,
          )

          if start is None:
              raise SystemExit(
                  "Transformação Python Continuous Core não encontrada."
              )

          indent = (
              len(workflow[start])
              - len(workflow[start].lstrip(" "))
          )

          end = None

          for i in range(start + 1, len(workflow)):
              current_indent = (
                  len(workflow[i])
                  - len(workflow[i].lstrip(" "))
              )

              if (
                  workflow[i].strip() == "PY"
                  and current_indent == indent
              ):
                  end = i
                  break

          if end is None:
              raise SystemExit(
                  "Final da transformação Continuous Core não encontrado."
              )

          prefix = " " * indent
          body = []

          for line in workflow[start + 1:end]:
              body.append(
                  line[indent:]
                  if line.startswith(prefix)
                  else line
              )

          script = "\n".join(body) + "\n"

          # ----------------------------------------------------------
          # FIXES DE SINTAXE HERDADOS DOS RUNS #139-#142
          # ----------------------------------------------------------

          repairs = [
              (
                  re.compile(
                      r'(?m)^registry\s*=\s*\n'
                      r'\s*src\s*/\s*"GamaAppRegistry\.kt"\s*$'
                  ),
                  'registry = src / "GamaAppRegistry.kt"',
              ),
              (
                  re.compile(
                      r'(?m)^service\s*=\s*\n'
                      r'\s*src\s*/\s*"GamaService\.kt"\s*$'
                  ),
                  'service = src / "GamaService.kt"',
              ),
              (
                  re.compile(
                      r'(?m)^value\s*=\s*\n'
                      r'\s*service\.read_text$'
                  ),
                  'value = service.read_text(',
              ),
              (
                  re.compile(
                      r'(?m)^gradle\s*=\s*\n'
                      r'\s*root\s*/\s*"app/build\.gradle\.kts"\s*$'
                  ),
                  'gradle = root / "app/build.gradle.kts"',
              ),
              (
                  re.compile(
                      r'(?m)^recognition_test\s*=\s*\n'
                      r'\s*tests\s*/\s*\n'
                      r'\s*"GamaRecognitionPolicyTest\.kt"\s*$'
                  ),
                  'recognition_test = tests / "GamaRecognitionPolicyTest.kt"',
              ),
              (
                  re.compile(
                      r'(?m)^reports\s*=\s*\n'
                      r'\s*root\s*/\s*"reports"\s*$'
                  ),
                  'reports = root / "reports"',
              ),
              (
                  re.compile(
                      r'(?m)^    value\s*=\s*\n'
                      r'        value\.replace\($'
                  ),
                  '    value = value.replace(',
              ),
              (
                  re.compile(
                      r'(?m)^    value\s*=\s*\n'
                      r'        recognition_test\.read_text\($'
                  ),
                  '    value = recognition_test.read_text(',
              ),
              (
                  re.compile(
                      r'(?m)^    pos\s*=\s*\n'
                      r'        value\.rfind\(marker$'
                  ),
                  '    pos = value.rfind(marker)',
              ),
          ]

          for index, (pattern, replacement) in enumerate(
              repairs,
              1,
          ):
              script, count = pattern.subn(
                  replacement,
                  script,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      f"Reparo Continuous Core {index} "
                      f"não encontrou exatamente uma ocorrência. "
                      f"count={count}"
                  )

          # ----------------------------------------------------------
          # FIX144
          #
          # O erro real do #144 ocorreu porque padrões do #139 tinham
          # construções como:
          #
          # private\ const\ val
          #
          # Um espaço escapado dessa forma era rígido demais.
          #
          # Agora sub_once cria uma terceira versão do regex:
          #
          # private\s+const\s+val
          #
          # permitindo espaços e indentação reais do Kotlin.
          # ----------------------------------------------------------

          robust_helpers = r'''def replace_once(path: Path, old: str, new: str):
              value = path.read_text(encoding="utf-8")

              exact_count = value.count(old)

              if exact_count == 1:
                  path.write_text(
                      value.replace(
                          old,
                          new,
                          1,
                      ),
                      encoding="utf-8",
                  )
                  return

              if exact_count > 1:
                  raise SystemExit(
                      f"{path}: literal possui múltiplas ocorrências: "
                      f"{old[:120]!r}"
                  )

              tokens = [
                  token
                  for token in re.split(
                      r"\s+",
                      old.strip(),
                  )
                  if token
              ]

              if not tokens:
                  raise SystemExit(
                      f"{path}: literal vazio recebido em replace_once."
                  )

              flexible_pattern = r"\s+".join(
                  re.escape(token)
                  for token in tokens
              )

              match = re.search(
                  flexible_pattern,
                  value,
                  flags=re.S,
              )

              if match is None:
                  raise SystemExit(
                      f"{path}: literal não encontrado nem com "
                      f"normalização de whitespace: {old[:120]!r}"
                  )

              second_match = re
