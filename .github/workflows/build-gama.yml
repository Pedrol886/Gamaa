                      ) {
                          return false
                      }

                      val app =
                          conversation
                              .activeContextSnapshot()
                              .currentApp

                      if (app.isBlank()) {
                          return false
                      }

                      val success =
                          GamaScreenContextService
                              .performGlobal(
                                  android.accessibilityservice.AccessibilityService
                                      .GLOBAL_ACTION_HOME
                              )

                      if (success) {
                          orchestrator
                              .rememberAction(
                                  "sair de $app",
                                  "tela inicial",
                                  app,
                              )

                          speak(
                              "Certo.",
                              false,
                          )
                      } else {
                          speak(
                              "Não consegui sair desse aplicativo agora.",
                              false,
                          )
                      }

                      return true
                  }

