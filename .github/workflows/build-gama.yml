name: Build Gama 7.0.6 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BASE_RUN: "37030299438"
      BASE_ARTIFACT: "Gama-JARVIS-FILM-CORE-FIX110-source"

    steps:
      - name: Restore last source that really compiled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf src
          mkdir src
          gh run download "$BASE_RUN" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT" --dir src
          test -s src/app/build.gradle.kts
          test -s src/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s src/tools/download_models.sh

      - name: Apply Gama 7.0.6 voice recovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/src/main/java/com/gama/assistant/GamaService.kt')
          s=p.read_text(encoding='utf-8')
          a='                if (!shouldDecodeAudio(buffer, read)) {\n'
          b='                val idleWakeMode = !conversation.active && transcription == null && !waitingForCommandStart && !commandSpeechStarted\n                if (!idleWakeMode && !shouldDecodeAudio(buffer, read)) {\n'
          if s.count(a)!=1: raise SystemExit(f'audio gate anchor={s.count(a)}')
          s=s.replace(a,b,1)
          a='            if (!textMode && BackgroundMode.enabled(this@GamaService)) {\n'
          b='            if (BackgroundMode.enabled(this@GamaService)) {\n                if (textMode || !running) {\n                    if (!listenerRestartPending) enableVoice()\n                    uiHandler.postDelayed(this, 3_000L)\n                    return\n                }\n'
          if s.count(a)!=1: raise SystemExit(f'watchdog anchor={s.count(a)}')
          s=s.replace(a,b,1)
          s=s.replace('            uiHandler.postDelayed(this, 4_000L)\n','            uiHandler.postDelayed(this, 3_000L)\n',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Set Gama 7.0.6 version
        working-directory: src
        run: |
          set -euo pipefail
          VC=$((21800000 + GITHUB_RUN_NUMBER))
          sed -Ei "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $VC/" app/build.gradle.kts
          sed -Ei 's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "Gama 7.0.6"/' app/build.gradle.kts
          grep -F 'versionName = "Gama 7.0.6"' app/build.gradle.kts

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and verify APK
        working-directory: src
        run: |
          set -euo pipefail
          bash tools/download_models.sh
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" dist/Gama.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Gama.apk
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)

      - name: Upload Gama 7.0.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-7.0.6-APK
          path: |
            src/dist/Gama.apk
            src/dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Publish Gama 7.0.6 release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="gama-v7.0.6-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "src/dist/Gama.apk#Gama.apk" \
            "src/dist/Gama.apk.sha256#Gama.apk.sha256" \
            --title "Gama 7.0.6" \
            --notes "Correção do hotword, recuperação automática do microfone e build confiável." \
            --latest
