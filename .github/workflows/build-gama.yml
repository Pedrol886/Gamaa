name: Build Gama 10.3.0 Personal Android Core FIX159

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-gama.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-personal-android-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      GAMA_BASE_RUN_ID: "37226292316"
      GAMA_BASE_ARTIFACT: "Gama-10.0.0-JARVIS-CONTEXT-source"

      GAMA_MODULE_RUN_ID: "37244129475"
      GAMA_MODULE_ARTIFACT: "Gama-10.3.0-compile-debug-159"

      GAMA_EXPECTED_CERT_SHA256: "6933EDA890C29567A8F4B6CEAD7A39A442DF109D43B813A19F3F6FA7F39B078C"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-10.3.0-PERSONAL-ANDROID-CORE-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"

            echo "::warning::GAMA_SIGNING_SEED não está configurado."
            echo "::warning::O APK será Release, mas será FRESH-INSTALL-ONLY."
          elif printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-10.3.0-PERSONAL-ANDROID-CORE-APK" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GAMA_SIGNING_SEED deve possuir exatamente 64 caracteres hexadecimais."
            exit 1
          fi

      - name: Restore exact green Gama 10 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download \
            "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaNotificationListener.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaScreenContextService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaCalendarManager.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaSuperAssistantCore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaMissionStore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaPersonalCore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaUnreadMessageStore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/VoicePolicy.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/ZevronPlanner.kt

          grep -Fq \
            'versionName = "Gama 10.0.0 JARVIS Context Core"' \
            _gama_build/app/build.gradle.kts

          grep -Fq \
            'isDebuggable = false' \
            _gama_build/app/build.gradle.kts

          echo "PASS: source verde do run #156 restaurado."

      - name: Recover Gama 10.3 modules from run 159
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_patch
          mkdir -p _gama_patch

          gh run download \
            "$GAMA_MODULE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_MODULE_ARTIFACT" \
            --dir _gama_patch

          SRC="_gama_build/app/src/main/java/com/gama/assistant"

          modules=(
            "GamaTaskStateStore.kt"
            "GamaContextPolicy.kt"
            "GamaDeviceTools.kt"
            "GamaDialogueCore.kt"
            "GamaNextRouter.kt"
          )

          for module in "${modules[@]}"; do
            source_file="$(
              find \
                _gama_patch \
                -type f \
                -name "$module" \
                -print \
                | head -n 1
            )"

            if [ -z "$source_file" ] || [ ! -s "$source_file" ]; then
              echo "::error::Módulo $module não encontrado no artifact do #159."
              exit 1
            fi

            cp \
              "$source_file" \
              "$SRC/$module"

            test -s "$SRC/$module"

            echo "Recuperado: $module"
          done

          echo "PASS: módulos novos recuperados do próprio #159."

      - name: Integrate Personal Android Core robustly
        working-directory: _gama_build
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/gama-integrate.py" <<'PY'
          from pathlib import Path
          import os
          import re


          ROOT = Path(".")
          SRC = ROOT / "app/src/main/java/com/gama/assistant"


          service_path = SRC / "GamaService.kt"
          notification_path = SRC / "GamaNotificationListener.kt"
          context_policy_path = SRC / "GamaContextPolicy.kt"
          voice_path = SRC / "VoicePolicy.kt"
          super_core_path = SRC / "GamaSuperAssistantCore.kt"
          planner_path = SRC / "ZevronPlanner.kt"
          manifest_path = ROOT / "app/src/main/AndroidManifest.xml"
          gradle_path = ROOT / "app/build.gradle.kts"


          required_files = [
              service_path,
              notification_path,
              context_policy_path,
              voice_path,
              super_core_path,
              planner_path,
              manifest_path,
              gradle_path,
              SRC / "GamaTaskStateStore.kt",
              SRC / "GamaDeviceTools.kt",
              SRC / "GamaDialogueCore.kt",
              SRC / "GamaNextRouter.kt",
          ]


          for file_path in required_files:
              if not file_path.is_file():
                  raise SystemExit(
                      f"Arquivo obrigatório ausente: {file_path}"
                  )


          service = service_path.read_text(
              encoding="utf-8"
          )

          notification = notification_path.read_text(
              encoding="utf-8"
          )

          context_policy = context_policy_path.read_text(
              encoding="utf-8"
          )

          voice = voice_path.read_text(
              encoding="utf-8"
          )

          super_core = super_core_path.read_text(
              encoding="utf-8"
          )

          planner = planner_path.read_text(
              encoding="utf-8"
          )

          manifest = manifest_path.read_text(
              encoding="utf-8"
          )

          gradle = gradle_path.read_text(
              encoding="utf-8"
          )


          def require(
              condition: bool,
              message: str,
          ) -> None:
              if not condition:
                  raise SystemExit(message)


          # ==========================================================
          # FIX159-A
          #
          # O módulo gerado no #159 referenciava OwnerIdentity,
          # classe que não existe nessa base.
          #
          # Removemos apenas essa dependência inexistente.
          # A classificação semântica continua funcionando por
          # conteúdo, origem, repetição e termos importantes.
          # ==========================================================

          context_lines = context_policy.splitlines()

          fixed_context_lines = []

          owner_reference_found = False

          for line in context_lines:
              if "OwnerIdentity.name(context)" in line:
                  owner_reference_found = True
                  continue

              if (
                  owner_reference_found
                  and "val directlyMentionsOwner =" in line
                  and "owner" in line
              ):
                  indentation = (
                      line[: len(line) - len(line.lstrip())]
                  )

                  fixed_context_lines.append(
                      indentation
                      + "val directlyMentionsOwner = false"
                  )

                  owner_reference_found = False
                  continue

              fixed_context_lines.append(line)


          context_policy = "\n".join(
              fixed_context_lines
          ) + "\n"


          require(
              "OwnerIdentity.name(context)"
              not in context_policy,
              "FIX159-A: referência OwnerIdentity ainda presente.",
          )


          # ==========================================================
          # ROTEADOR NOVO
          #
          # Entra antes da IA lenta.
          # Timer, WhatsApp multi-turno, sites, prova,
          # notificações e Accessibility não precisam aguardar LLM.
          # ==========================================================

          if (
              "GamaNextRouter.handleAsync"
              not in service
          ):
              marker = (
                  "        // GAMA109_LOCKSCREEN_PUBLIC_FAST_LANE"
              )

              index = service.find(marker)

              require(
                  index >= 0,
                  "Router: marcador GAMA109 não encontrado.",
              )

              router_code = r'''        if (
                      GamaNextRouter.handleAsync(
                          this,
                          command,
                      ) { gamaNextReply ->
                          uiHandler.post {
                              if (
                                  running &&
                                  gamaCommandSequence ==
                                      userCommandSequence &&
                                  gamaNextReply.isNotBlank()
                              ) {
                                  GamaTaskMemory.rememberResult(
                                      this,
                                      gamaNextReply,
                                  )

                                  speak(
                                      gamaNextReply,
                                      closeAfter = false,
                                  )
                              }
                          }
                      }
                  ) {
                      return
                  }

          '''

              service = (
                  service[:index]
                  + router_code
                  + service[index:]
              )


          # ==========================================================
          # FIX159-B
          #
          # Prioridade semântica de notificações.
          #
          # O #159 procurava uma linha literalmente idêntica.
          # Agora usamos regex estrutural tolerante a espaços e
          # quebras de linha.
          # ==========================================================

          new_priority_expression = (
              "val priority = "
              "GamaNotificationIntelligence.eventPriority("
              "this, source, body, recent)"
          )

          if (
              "GamaNotificationIntelligence.eventPriority"
              not in notification
          ):
              notification_pattern = re.compile(
                  r"""
                  val\s+priority\s*=\s*
                  GamaProactivePolicy
                  \.
                  messagePriority
                  
                      \s*body\s*,
                      \s*recent\s*
                 
                  """,
                  re.VERBOSE,
              )

              notification, count = (
                  notification_pattern.subn(
                      new_priority_expression,
                      notification,
                      count=1,
                  )
              )

              require(
                  count == 1,
                  "FIX159-B: chamada antiga de "
                  "messagePriority não localizada.",
              )


          require(
              "GamaNotificationIntelligence.eventPriority"
              in notification,
              "FIX159-B: prioridade semântica não aplicada.",
          )


          # ==========================================================
          # PERÍODO SILENCIOSO NO FLUXO PROATIVO
          # ==========================================================

          if (
              "semanticPriority = "
              "GamaNotificationIntelligence.classify"
              not in service
          ):
              function_start = service.find(
                  "    private fun handleProactiveEvent("
                  "event: GamaEventHub.Event) {"
              )

              function_end = service.find(
                  "\n    private fun scheduleProactiveDrain",
                  function_start,
              )

              require(
                  function_start >= 0
                  and function_end > function_start,
                  "handleProactiveEvent não encontrado.",
              )

              region = service[
                  function_start:function_end
              ]

              first_guard = (
                  "        if (!running || "
                  "event.priority != "
                  "GamaEventHub.Priority.HIGH) return\n"
              )

              require(
                  first_guard in region,
                  "Guard principal de handleProactiveEvent "
                  "não encontrado.",
              )

              semantic_gate = r'''
              if (
                  event.kind ==
                      GamaEventHub.Kind.MESSAGE
              ) {
                  val semanticPriority =
                      GamaNotificationIntelligence
                          .classify(
                              this,
                              event.source,
                              event.summary,
                          )

                  if (
                      semanticPriority ==
                      GamaNotificationIntelligence
                          .Level.LOW
                  ) {
                      return
                  }

                  if (
                      GamaSilentContext
                          .isSilentNow(this) &&
                      semanticPriority !=
                          GamaNotificationIntelligence
                              .Level.URGENT
                  ) {
                      updateNotification(
                          "Mensagem guardada para depois do período silencioso."
                      )

                      return
                  }
              }

          '''

              region = region.replace(
                  first_guard,
                  first_guard
                  + semantic_gate,
                  1,
              )

              service = (
                  service[:function_start]
                  + region
                  + service[function_end:]
              )


          # ==========================================================
          # CONTINUIDADE DE LOCK / UNLOCK
          # ==========================================================

          if (
              "lastScreenOffAt"
              not in service
          ):
              unlock_field_pattern = re.compile(
                  r"""
                  (?m)^
                  (
                      \s*
                      @Volatile
                      \s+
                      private
                      \s+
                      var
                      \s+
                      unlockPending
                      \s*=\s*
                      false
                      \s*
                  )
                  $
                  """,
                  re.VERBOSE,
              )

              match = unlock_field_pattern.search(
                  service
              )

              require(
                  match is not None,
                  "Campo unlockPending não encontrado.",
              )

              original = match.group(1)

              replacement = (
                  original
                  + "\n"
                  + "    @Volatile private var "
                  + "lastScreenOffAt = 0L"
              )

              service = (
                  service[:match.start()]
                  + replacement
                  + service[match.end():]
              )


          if (
              "lastScreenOffAt = "
              "SystemClock.elapsedRealtime()"
              not in service
          ):
              screen_off_pattern = re.compile(
                  r"""
                  (
                      else\s+if
                      \s*
                      
                          intent\?\.action
                          \s*==\s*
                          Intent\.ACTION_SCREEN_OFF
                     
                      \s*
                      \{
                      \s*\n
                  )
                  """,
                  re.VERBOSE,
              )

              service, count = (
                  screen_off_pattern.subn(
                      r"\1"
                      "                    "
                      "lastScreenOffAt = "
                      "SystemClock.elapsedRealtime()\n",
                      service,
                      count=1,
                  )
              )

              require(
                  count == 1,
                  "ACTION_SCREEN_OFF não encontrado.",
              )


          lock_start = service.find(
              "    private fun lockScreenReply(): String {"
          )

          lock_end = service.find(
              "\n    private fun performDeviceLockNow()",
              lock_start,
          )

          require(
              lock_start >= 0
              and lock_end > lock_start,
              "lockScreenReply não encontrado.",
          )

          lock_region = service[
              lock_start:lock_end
          ]

          lock_region = re.sub(
              r"(?m)^\s*conversation\.close\s*$",
              "",
              lock_region,
          )

          lock_region = re.sub(
              r"(?m)^\s*conversation\.suspend\s*$",
              "",
              lock_region,
          )

          lock_region = re.sub(
              r"""
              (?m)^
              \s*
              GamaSupervisor
              \.
              onConversationClosed
              
              \s*
              $
              """,
              "",
              lock_region,
              flags=re.VERBOSE,
          )

          lock_region = re.sub(
              r"""
              conversationLastActivityAt
              \s*=\s*
              0L
              """,
              (
                  "conversationLastActivityAt = "
                  "SystemClock.elapsedRealtime()"
              ),
              lock_region,
          )

          service = (
              service[:lock_start]
              + lock_region
              + service[lock_end:]
          )


          # ==========================================================
          # WATCHDOG PÓS-DESBLOQUEIO
          #
          # Substituímos a função inteira por uma implementação
          # conhecida. Não fazemos remendos de uma linha.
          # ==========================================================

          unlock_start = service.find(
              "    private fun "
              "ensureVoicePipelineAfterUnlock() {"
          )

          unlock_end = service.find(
              "\n    fun cancelRequest()",
              unlock_start,
          )

          require(
              unlock_start >= 0
              and unlock_end > unlock_start,
              "ensureVoicePipelineAfterUnlock "
              "não encontrado.",
          )

          unlock_function = r'''    private fun ensureVoicePipelineAfterUnlock() {
              val now =
                  SystemClock.elapsedRealtime()

              val stale =
                  listenerThread?.isAlive != true ||
                      !voiceReady ||
                      !running ||
                      textMode ||
                      (
                          lastScreenOffAt > 0L &&
                              lastAudioReadAt <=
                              lastScreenOffAt
                          ) ||
                      (
                          lastAudioReadAt > 0L &&
                              now - lastAudioReadAt >
                              3_000L
                          )

              if (stale) {
                  recoverMicrophoneOnly(
                      "unlock"
                  )
              } else {
                  postAudio {
                      recognizer?.reset()

                      runCatching {
                          wakeRecognizer?.reset()
                      }

                      runCatching {
                          sleepRecognizer?.reset()
                      }

                      decoderActive =
                          false

                      voicedBlocks =
                          0

                      preRoll =
                          ByteArray(0)

                      wakePreRoll =
                          ByteArray(0)

                      bargePreRoll =
                          ByteArray(0)

                      speechHoldUntil =
                          0L

                      ignoreAudioUntil =
                          SystemClock.elapsedRealtime() +
                              350L
                  }
              }

              val checkpoints =
                  listOf(
                      1_800L,
                      6_000L,
                  )

              checkpoints.forEachIndexed {
                      index,
                      delayMs ->

                  uiHandler.postDelayed(
                      {
                          if (
                              !running ||
                              isDeviceLocked() ||
                              !BackgroundMode.enabled(
                                  this
                              )
                          ) {
                              return@postDelayed
                          }

                          val checkNow =
                              SystemClock.elapsedRealtime()

                          val freshAudio =
                              lastAudioReadAt > 0L &&
                                  (
                                      lastScreenOffAt <= 0L ||
                                          lastAudioReadAt >
                                          lastScreenOffAt
                                      ) &&
                                  checkNow -
                                      lastAudioReadAt <
                                      4_500L

                          if (
                              !freshAudio ||
                              listenerThread?.isAlive !=
                                  true ||
                              !voiceReady
                          ) {
                              recoverMicrophoneOnly(
                                  if (index == 0) {
                                      "unlock-watchdog"
                                  } else {
                                      "unlock-hard-watchdog"
                                  }
                              )
                          }
                      },
                      delayMs,
                  )
              }
          }
          '''

          service = (
              service[:unlock_start]
              + unlock_function
              + service[unlock_end:]
          )


          # ==========================================================
          # BARGE-IN INTELIGENTE
          #
          # "uhum", "sim", "certo" etc. não interrompem.
          # "não", "espera", "para" e correções interrompem.
          # ==========================================================

          barge_start = voice.find(
              "    fun shouldBargeIn("
              "partial: String, "
              "spoken: String?, "
              "headphones: Boolean"
              "): Boolean {"
          )

          barge_end = voice.find(
              "\n    fun looksLikePostActionNoise",
              barge_start,
          )

          require(
              barge_start >= 0
              and barge_end > barge_start,
              "VoicePolicy.shouldBargeIn não encontrado.",
          )

          barge_function = r'''    fun shouldBargeIn(
              partial: String,
              spoken: String?,
              headphones: Boolean,
          ): Boolean {
              val p =
                  normalize(partial)

              if (p.isBlank()) {
                  return false
              }

              if (hasWake(p)) {
                  return true
              }

              if (
                  looksLikeTtsEcho(
                      p,
                      spoken,
                  )
              ) {
                  return false
              }

              val backchannels =
                  setOf(
                      "sim",
                      "uhum",
                      "aham",
                      "certo",
                      "entendi",
                      "beleza",
                      "ok",
                      "okay",
                      "ta",
                      "tá",
                  )

              if (p in backchannels) {
                  return false
              }

              val explicitInterrupt =
                  p == "nao" ||
                      p == "não" ||
                      p == "espera" ||
                      p == "pare" ||
                      p == "para" ||
                      p.startsWith(
                          "nao e isso"
                      ) ||
                      p.startsWith(
                          "não é isso"
                      ) ||
                      p.startsWith(
                          "nao foi isso"
                      ) ||
                      p.startsWith(
                          "voce entendeu errado"
                      ) ||
                      p.startsWith(
                          "você entendeu errado"
                      ) ||
                      p.startsWith(
                          "espera ai"
                      ) ||
                      p.startsWith(
                          "na verdade"
                      )

              if (explicitInterrupt) {
                  return true
              }

              val words =
                  p.split(' ')
                      .filter {
                          it.isNotBlank()
                      }

              if (headphones) {
                  return p.length >= 3
              }

              return (
                  words.size >= 2 ||
                      p.length >= 8
                  )
          }
          '''

          voice = (
              voice[:barge_start]
              + barge_function
              + voice[barge_end:]
          )


          # ==========================================================
          # MEMÓRIA SENSÍVEL
          #
          # A observação adaptativa só recebe conteúdo que
          # GamaMemoryConsentPolicy considera adequado.
          # ==========================================================

          if (
              "GamaMemoryConsentPolicy."
              "allowAdaptiveLearning(raw)"
              not in super_core
          ):
              adaptive_pattern = re.compile(
                  r"""
                  (?m)^
                  (?P<indent>\s*)
                  GamaAdaptiveMemory
                  \.
                  observe
                  
                      context
                      \s*,
                      \s*
                      raw
                 
                  \s*
                  $
                  """,
                  re.VERBOSE,
              )

              adaptive_match = adaptive_pattern.search(
                  super_core
              )

              require(
                  adaptive_match is not None,
                  "GamaAdaptiveMemory.observe "
                  "não encontrado.",
              )

              indentation = (
                  adaptive_match.group(
                      "indent"
                  )
              )

              adaptive_replacement = (
                  indentation
                  + "if ("
                  + "GamaMemoryConsentPolicy."
                  + "allowAdaptiveLearning(raw)"
                  + ") {\n"
                  + indentation
                  + "    "
                  + "GamaAdaptiveMemory."
                  + "observe(context, raw)\n"
                  + indentation
                  + "}"
              )

              super_core = (
                  super_core[
                      :adaptive_match.start()
                  ]
                  + adaptive_replacement
                  + super_core[
                      adaptive_match.end():
                  ]
              )


          # ==========================================================
          # PLANNER
          #
          # Permite que tarefas compostas incluam as novas
          # ferramentas determinísticas.
          # ==========================================================

          if (
              "GamaTimerRouter.recognizes(raw)"
              not in planner
          ):
              planner_marker = (
                  "        if "
                  "(MessageCommandRouter."
                  "isReadRequest(c)) "
                  "return true\n"
              )

              require(
                  planner_marker in planner,
                  "Marcador do ZevronPlanner "
                  "não encontrado.",
              )

              planner_insert = (
                  planner_marker
                  + "        if "
                  + "(GamaTimerRouter."
                  + "recognizes(raw)) "
                  + "return true\n"
                  + "        if "
                  + "(GamaWebsiteRouter."
                  + "recognizes(raw)) "
                  + "return true\n"
                  + "        if "
                  + "(GamaSystemActionRouter."
                  + "recognizes(raw)) "
                  + "return true\n"
              )

              planner = planner.replace(
                  planner_marker,
                  planner_insert,
                  1,
              )


          # ==========================================================
          # PERMISSÃO OFICIAL DO TIMER
          # ==========================================================

          alarm_permission = (
              '<uses-permission '
              'android:name='
              '"com.android.alarm.permission.SET_ALARM" />'
          )

          if alarm_permission not in manifest:
              application_index = (
                  manifest.find(
                      "<application"
                  )
              )

              require(
                  application_index >= 0,
                  "Tag <application> "
                  "não encontrada.",
              )

              manifest = (
                  manifest[:application_index]
                  + alarm_permission
                  + "\n\n    "
                  + manifest[
                      application_index:
                  ]
              )


          # ==========================================================
          # VERSÃO
          # ==========================================================

          version_code = (
              25_300_000
              + int(
                  os.environ[
                      "GITHUB_RUN_NUMBER"
                  ]
              )
          )

          gradle, code_count = re.subn(
              r"versionCode\s*=\s*\d+",
              (
                  "versionCode = "
                  + str(version_code)
              ),
              gradle,
              count=1,
          )

          gradle, name_count = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              (
                  'versionName = '
                  '"Gama 10.3.0 '
                  'Personal Android Core"'
              ),
              gradle,
              count=1,
          )

          require(
              code_count == 1,
              "versionCode não localizado.",
          )

          require(
              name_count == 1,
              "versionName não localizado.",
          )


          # ==========================================================
          # ESCRITA ATÔMICA DOS SOURCES
          #
          # Só chegamos aqui depois de todos os transforms.
          # ==========================================================

          context_policy_path.write_text(
              context_policy,
              encoding="utf-8",
          )

          notification_path.write_text(
              notification,
              encoding="utf-8",
          )

          service_path.write_text(
              service,
              encoding="utf-8",
          )

          voice_path.write_text(
              voice,
              encoding="utf-8",
          )

          super_core_path.write_text(
              super_core,
              encoding="utf-8",
          )

          planner_path.write_text(
              planner,
              encoding="utf-8",
          )

          manifest_path.write_text(
              manifest,
              encoding="utf-8",
          )

          gradle_path.write_text(
              gradle,
              encoding="utf-8",
          )


          # ==========================================================
          # INVARIANTES
          # ==========================================================

          invariants = {
              service_path: [
                  "GamaNextRouter.handleAsync",
                  "GamaSilentContext.isSilentNow",
                  "unlock-hard-watchdog",
                  "lastScreenOffAt",
              ],
              notification_path: [
                  "GamaNotificationIntelligence.eventPriority",
              ],
              context_policy_path: [
                  "GamaNotificationIntelligence",
                  "GamaSilentContext",
              ],
              voice_path: [
                  "explicitInterrupt",
                  '"uhum"',
              ],
              super_core_path: [
                  "GamaMemoryConsentPolicy.allowAdaptiveLearning",
              ],
              planner_path: [
                  "GamaTimerRouter.recognizes(raw)",
                  "GamaWebsiteRouter.recognizes(raw)",
                  "GamaSystemActionRouter.recognizes(raw)",
              ],
              gradle_path: [
                  'versionName = "Gama 10.3.0 Personal Android Core"',
                  "isDebuggable = false",
              ],
          }


          for file_path, tokens in invariants.items():
              value = file_path.read_text(
                  encoding="utf-8"
              )

              for token in tokens:
                  require(
                      token in value,
                      (
                          f"Invariante ausente em "
                          f"{file_path}: {token}"
                      ),
                  )


          require(
              "OwnerIdentity.name(context)"
              not in context_policy_path.read_text(
                  encoding="utf-8"
              ),
              "OwnerIdentity voltou ao source.",
          )


          print(
              "PASS: GAMA 10.3 Personal Android Core integrado."
          )

          print(
              f"versionCode={version_code}"
          )
          PY

          python3 \
            -m py_compile \
            "$GITHUB_WORKSPACE/gama-integrate.py"

          python3 \
            "$GITHUB_WORKSPACE/gama-integrate.py"

          echo "PASS: integrador executado sem SyntaxError."

