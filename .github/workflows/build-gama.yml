name: Build Gama 3.5 APK (complete source and diagnostics)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write

concurrency:
  group: gama-${{ github.ref }}
  cancel-in-progress: false

