          # WARM ISOLATED BRAIN
          # ============================================================

          write(
              src / "GamaBrainProcessService.kt",
              r'''
              package com.gama.assistant

              import android.app.Service
              import android.content.Intent
              import android.os.Binder
              import android.os.Handler
              import android.os.IBinder
              import android.os.Looper
              import android.util.Log
              import java.util.concurrent.Executors
              import java.util.concurrent.atomic.AtomicLong

              class GamaBrainProcessService : Service() {

                  companion object {
                      private const val TAG =
                          "GamaBrainProcess"

                      private const val IDLE_RELEASE_MS =
                          10L * 60L * 1000L
                  }

                  private val worker =
                      Executors
                          .newSingleThreadExecutor { runnable ->
                              Thread(
                                  runnable,
                                  "gama-isolated-brain-worker",
                              ).apply {
                                  isDaemon = true
                              }
                          }

                  private val mainHandler =
                      Handler(
                          Looper.getMainLooper()
                      )

                  private val idleGeneration =
                      AtomicLong(0L)

                  @Volatile
                  private var brain: LocalBrain? = null

                  private val livenessBinder =
                      Binder()

                  override fun onBind(
                      intent: Intent?
                  ): IBinder =
                      livenessBinder

                  override fun onStartCommand(
                      intent: Intent?,
                      flags: Int,
                      startId: Int,
                  ): Int {
                      when (intent?.action) {
                          BrainProcessProtocol.ACTION_WARM -> {
                              val token =
                                  idleGeneration
                                      .incrementAndGet()

                              worker.execute {
                                  try {
                                      val engine =
                                          brain
                                              ?: LocalBrain(
                                                  applicationContext
                                              ).also {
                                                  brain = it
                                              }

                                      engine.warmUp()
                                  } catch (t: Throwable) {
                                      if (
                                          t is VirtualMachineError ||
                                          t is ThreadDeath
                                      ) {
                                          throw t
                                      }

                                      Log.w(
                                          TAG,
                                          "Warm-up unavailable",
                                          t,
                                      )
                                  } finally {
                                      scheduleIdleRelease(
                                          token
                                      )
                                  }
                              }

                              return START_NOT_STICKY
                          }

                          BrainProcessProtocol.ACTION_ASK -> {
                              return handleAsk(
                                  intent,
                                  startId,
                              )
                          }

                          else -> {
                              stopSelfResult(startId)
                              return START_NOT_STICKY
                          }
                      }
                  }

                  private fun handleAsk(
                      intent: Intent,
                      startId: Int,
                  ): Int {
                      val requestId =
                          intent.getLongExtra(
                              BrainProcessProtocol
                                  .EXTRA_REQUEST_ID,
                              0L,
                          )

                      val sessionId =
                          intent.getLongExtra(
                              BrainProcessProtocol
                                  .EXTRA_SESSION_ID,
                              0L,
                          )

                      val turnId =
                          intent.getLongExtra(
                              BrainProcessProtocol
                                  .EXTRA_TURN_ID,
                              0L,
                          )

                      val generationId =
                          intent.getLongExtra(
                              BrainProcessProtocol
                                  .EXTRA_GENERATION_ID,
                              0L,
                          )

                      val question =
                          intent.getStringExtra(
                              BrainProcessProtocol
                                  .EXTRA_QUESTION
                          )
                              .orEmpty()
                              .trim()
                              .take(
                                  BrainProcessProtocol
                                      .MAX_QUESTION_CHARS
                              )

                      val history =
                          intent.getStringExtra(
                              BrainProcessProtocol
                                  .EXTRA_HISTORY
                          )
                              .orEmpty()
                              .takeLast(
                                  BrainProcessProtocol
                                      .MAX_HISTORY_CHARS
                              )

                      if (
                          requestId <= 0L ||
                          question.isBlank()
                      ) {
                          stopSelfResult(startId)
                          return START_NOT_STICKY
                      }

                      try {
                          sendBroadcast(
                              BrainProcessProtocol
                                  .startedIntent(
                                      this,
                                      requestId,
                                      sessionId,
                                      turnId,
                                      generationId,
                                  )
                          )
                      } catch (e: Exception) {
                          Log.w(
                              TAG,
                              "Could not publish start",
                              e,
                          )
                      }

                      val token =
                          idleGeneration
                              .incrementAndGet()

                      worker.execute {
                          var result = ""
                          var success = false

                          try {
                              val engine =
                                  brain
                                      ?: LocalBrain(
                                          applicationContext
                                      ).also {
                                          brain = it
                                      }

                              result =
                                  engine.answer(
                                      question,
                                      history.takeIf {
                                          it.isNotBlank()
                                      },
                                  )

                              success =
                                  result.isNotBlank()
                          } catch (t: Throwable) {
                              if (
                                  t is VirtualMachineError ||
                                  t is ThreadDeath
                              ) {
                                  throw t
                              }

                              Log.e(
                                  TAG,
                                  "Local brain request failed",
                                  t,
                              )

                              result = ""
                              success = false
                          }

                          try {
                              sendBroadcast(
                                  BrainProcessProtocol
                                      .resultIntent(
                                          this,
                                          requestId,
                                          result,
                                          success,
                                          sessionId,
                                          turnId,
                                          generationId,
                                      )
                              )
                          } catch (e: Exception) {
                              Log.w(
                                  TAG,
                                  "Could not return result",
                                  e,
                              )
                          }

                          scheduleIdleRelease(
                              token
                          )
                      }

                      return START_NOT_STICKY
                  }

                  private fun scheduleIdleRelease(
                      token: Long
                  ) {
                      mainHandler.postDelayed(
                          {
                              if (
                                  token !=
                                  idleGeneration.get()
                              ) {
                                  return@postDelayed
                              }

                              worker.execute {
                                  if (
                                      token !=
                                      idleGeneration.get()
                                  ) {
                                      return@execute
                                  }

                                  val old = brain
                                  brain = null

                                  try {
                                      old?.close()
                                  } catch (_: Exception) {
                                  }

                                  stopSelf()
                              }
                          },
                          IDLE_RELEASE_MS,
                      )
                  }

                  override fun onLowMemory() {
                      super.onLowMemory()

                      idleGeneration
                          .incrementAndGet()

                      worker.execute {
                          val old = brain
                          brain = null

                          try {
                              old?.close()
                          } catch (_: Exception) {
                          }
                      }
                  }

                  override fun onDestroy() {
                      idleGeneration
                          .incrementAndGet()

                      val old = brain
                      brain = null

                      try {
                          old?.close()
                      } catch (_: Exception) {
                      }

                      worker.shutdownNow()

                      mainHandler
                          .removeCallbacksAndMessages(
                              null
                          )

                      super.onDestroy()
                  }
              }
              '''
          )

          # ============================================================
          # UNIFIED APP LAUNCHER
          # ============================================================

          write(
              src / "GamaReliableAppLauncher.kt",
              r'''
              package com.gama.assistant

              import android.content.Context
              import android.content.Intent
              import android.content.pm.LauncherApps
              import android.content.pm.PackageManager
              import android.net.Uri
              import android.os.Build
              import android.os.Process

              object GamaReliableAppLauncher {

                  enum class Route {
                      INTENT_SENDER,
                      PACKAGE_LAUNCH_INTENT,
                      EXPLICIT_LAUNCHER_ACTIVITY,
                      CATEGORY_LAUNCHER,
                      LAUNCHER_APPS,
                      APP_DEEP_LINK,
                  }

                  data class Result(
                      val started: Boolean,
                      val route: Route? = null,
                      val packageName: String? = null,
                  )

                  private val routes =
                      Route.entries

                  fun maxAttemptIndex(): Int =
                      routes.lastIndex

                  fun launch(
                      context: Context,
                      app: GamaAppRegistry.AppSpec,
                      attempt: Int = 0,
                  ): Result {
                      if (
                          attempt !in
                          routes.indices
                      ) {
                          return Result(false)
                      }

                      val route =
                          routes[attempt]

                      for (
                          packageName in
                          app.packages
                      ) {
                          val opened =
                              when (route) {
                                  Route.INTENT_SENDER ->
                                      openWithIntentSender(
                                          context,
                                          packageName,
                                      )

                                  Route.PACKAGE_LAUNCH_INTENT ->
                                      openWithPackageLaunchIntent(
                                          context,
                                          packageName,
                                      )

                                  Route.EXPLICIT_LAUNCHER_ACTIVITY ->
                                      openWithExplicitLauncher(
                                          context,
                                          packageName,
                                      )

                                  Route.CATEGORY_LAUNCHER ->
                                      openWithCategoryLauncher(
                                          context,
                                          packageName,
                                      )

                                  Route.LAUNCHER_APPS ->
                                      openWithLauncherApps(
                                          context,
                                          packageName,
                                      )

                                  Route.APP_DEEP_LINK ->
                                      openWithDeepLink(
                                          context,
                                          app.id,
                                          packageName,
                                      )
                              }

                          if (opened) {
                              return Result(
                                  started = true,
                                  route = route,
                                  packageName =
                                      packageName,
                              )
                          }
                      }

                      return Result(
                          false,
                          route,
                          null,
                      )
                  }

                  fun compatibilityLaunchPackage(
                      context: Context,
                      packageName: String,
                  ): Boolean =
                      openWithPackageLaunchIntent(
                          context,
                          packageName,
                      ) ||
                          openWithExplicitLauncher(
                              context,
                              packageName,
                          ) ||
                          openWithCategoryLauncher(
                              context,
                              packageName,
                          ) ||
                          openWithLauncherApps(
                              context,
                              packageName,
                          )

                  private fun openWithIntentSender(
                      context: Context,
                      packageName: String,
                  ): Boolean {
                      if (
                          Build.VERSION.SDK_INT <
                          33
                      ) {
                          return false
                      }

                      return runCatching {
                          context.packageManager
                              .getLaunchIntentSenderForPackage(
                                  packageName
                              )
                              .sendIntent(
                                  context,
                                  0,
                                  null,
                                  null,
                                  null,
                              )

                          true
                      }.getOrDefault(false)
                  }

                  private fun openWithPackageLaunchIntent(
                      context: Context,
                      packageName: String,
                  ): Boolean {
                      val intent =
                          runCatching {
                              context.packageManager
                                  .getLaunchIntentForPackage(
                                      packageName
                                  )
                          }.getOrNull()
                              ?: return false

                      intent.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK or
                              Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED
                      )

                      return start(
                          context,
                          intent,
                      )
                  }

                  private fun openWithExplicitLauncher(
                      context: Context,
                      packageName: String,
                  ): Boolean {
                      val query =
                          Intent(
                              Intent.ACTION_MAIN
                          )
                              .addCategory(
                                  Intent.CATEGORY_LAUNCHER
                              )
                              .setPackage(
                                  packageName
                              )

                      @Suppress("DEPRECATION")
                      val activities =
                          runCatching {
                              context.packageManager
                                  .queryIntentActivities(
                                      query,
                                      PackageManager
                                          .MATCH_DEFAULT_ONLY,
                                  )
                          }.getOrDefault(
                              emptyList()
                          )

                      for (
                          match in
                          activities
                      ) {
                          val info =
                              match.activityInfo
                                  ?: continue

                          val explicit =
                              Intent(
                                  Intent.ACTION_MAIN
                              )
                                  .addCategory(
                                      Intent.CATEGORY_LAUNCHER
                                  )
                                  .setClassName(
                                      info.packageName,
                                      info.name,
                                  )
                                  .addFlags(
                                      Intent.FLAG_ACTIVITY_NEW_TASK or
                                          Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED
                                  )

                          if (
                              start(
                                  context,
                                  explicit,
                              )
                          ) {
                              return true
                          }
                      }

                      return false
                  }

                  private fun openWithCategoryLauncher(
                      context: Context,
                      packageName: String,
                  ): Boolean {
                      val intent =
                          Intent(
                              Intent.ACTION_MAIN
                          )
                              .addCategory(
                                  Intent.CATEGORY_LAUNCHER
                              )
                              .setPackage(
                                  packageName
                              )
                              .addFlags(
                                  Intent.FLAG_ACTIVITY_NEW_TASK or
                                      Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED
                              )

                      val resolved =
                          runCatching {
                              context.packageManager
                                  .resolveActivity(
                                      intent,
                                      0,
                                  )
                          }.getOrNull()
                              ?: return false

                      return start(
                          context,
                          intent,
                      )
                  }

                  private fun openWithLauncherApps(
                      context: Context,
                      packageName: String,
                  ): Boolean =
                      runCatching {
                          val launcherApps =
                              context.getSystemService(
                                  LauncherApps::class.java
                              )
                                  ?: return@runCatching false

                          val activities =
                              launcherApps
                                  .getActivityList(
                                      packageName,
                                      Process.myUserHandle(),
                                  )

                          val activity =
                              activities.firstOrNull()
                                  ?: return@runCatching false

                          launcherApps
                              .startMainActivity(
                                  activity.componentName,
                                  Process.myUserHandle(),
                                  null,
                                  null,
                              )

                          true
                      }.getOrDefault(false)

                  private fun openWithDeepLink(
                      context: Context,
