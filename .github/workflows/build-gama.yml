name: Build Gama 6.0 FIX88 APK (WhatsApp colon parser fix, unread-only messages and natural conversation)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write

concurrency:
  group: gama-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # Source of truth requested by the project owner: GitHub Actions run #67.
      GAMA_67_COMMIT: 87d85998667f9e51e39860991398a2e31cd5f3c7
      # Run #67 itself restores this known base before applying its two approved patches.
      GAMA_43_COMMIT: ae7f8993cad81d749ffdf04dfc84d828705b1a1a

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify complete FIX87 packed workflow was uploaded
        run: |
          set -euo pipefail
          WF=".github/workflows/build-gama.yml"
          bytes="$(wc -c < "$WF" | tr -d ' ')"
          echo "FIX88 packed workflow bytes: $bytes" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -lt 60000 ]; then
            echo "::error::build-gama.yml parece incompleto: apenas $bytes bytes."
            exit 1
          fi
          for step in \
            'Add centralized Internet hub and online intent router' \
            'Add Gama super-assistant conversational core and screen context' \
            'Add secure face gate, lock-screen identity and official unlock flow' \
            'Fix natural conversation, full messages, WhatsApp send and voice prosody' \
            'Read only unseen message notifications' \
            'Java 17' 'Compile Gama APK' 'Run all Gama unit tests' \
            'Sign and verify Gama.apk' 'Upload APK' 'Publish Gama release'; do
            grep -Fq -- "- name: $step" "$WF" || { echo "::error::Etapa ausente: $step"; exit 1; }
          done
          grep -Fq '# GAMA_FIX88_COMPLETE_END' "$WF" || {
            echo '::error::Marcador final ausente. O arquivo foi truncado.'
            exit 1
          }
          echo 'FIX88 packed workflow integrity passed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify exact run 67 source of truth
        run: |
          set -euo pipefail
          git cat-file -e "${GAMA_67_COMMIT}^{commit}"
          test "$(git show -s --format=%H "$GAMA_67_COMMIT")" = "$GAMA_67_COMMIT"
          git show "$GAMA_67_COMMIT:.github/workflows/build-gama.yml" > /tmp/gama-67-workflow.yml
          grep -Fq 'name: Build Gama 6.0 FIX66 APK (isolated brain, self-automation and polished assistant)' /tmp/gama-67-workflow.yml
          grep -Fq 'Apply Gama 6.0 FIX66 voice-hint boundary fix' /tmp/gama-67-workflow.yml
          echo "Base verified: run #67 commit $GAMA_67_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail
          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-6.0-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"
            echo "Stable signing: unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GAMA_SIGNING_SEED não está configurado. O APK será apenas para instalação limpa."
          elif printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-6.0-APK" >> "$GITHUB_OUTPUT"
            echo "Stable signing: enabled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::GAMA_SIGNING_SEED precisa ter exatamente 64 caracteres hexadecimais."
            exit 1
          fi

      - name: Restore exact Gama 4.3 base used by run 67
        run: |
          set -euo pipefail
          git cat-file -e "${GAMA_43_COMMIT}^{commit}"
          git show "${GAMA_43_COMMIT}:.github/workflows/build-gama.yml" > /tmp/gama-4.3-workflow.yml
          rm -rf _gama_build
          mkdir -p _gama_build
          python3 - <<'PY_RESTORE'
          from pathlib import Path
          import base64, hashlib, io, re, tarfile

          workflow = Path('/tmp/gama-4.3-workflow.yml').read_text(encoding='utf-8')
          match = re.search(
              r"cat\s*>\s*/tmp/gama-complete-source\.tar\.gz\.b64\s*<<'GAMA_SOURCE'\s*\n(.*?)\n\s*GAMA_SOURCE\s*$",
              workflow,
              re.S | re.M,
          )
          if match is None:
              raise SystemExit('Não encontrei o código-fonte incorporado do Gama 4.3.')
          encoded = ''.join(match.group(1).split())
          archive = base64.b64decode(encoded, validate=True)
          print('Base Gama 4.3 SHA-256:', hashlib.sha256(archive).hexdigest())
          root = Path('_gama_build').resolve()
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as package:
              for item in package.getmembers():
                  candidate = (root / item.name).resolve()
                  if not candidate.is_relative_to(root) or item.issym() or item.islnk():
                      raise SystemExit('Caminho inseguro no pacote de origem: ' + item.name)
              package.extractall(root, filter='data')

          required = [
              'app/build.gradle.kts',
              'app/src/main/AndroidManifest.xml',
              'app/src/main/java/com/gama/assistant/GamaService.kt',
              'app/src/main/java/com/gama/assistant/ConversationSession.kt',
              'tools/download_models.sh',
          ]
          for name in required:
              if not (root / name).is_file():
                  raise SystemExit('Arquivo obrigatório ausente: ' + name)
          PY_RESTORE

      - name: Replay exact Gama 6.0 patches from run 67
        working-directory: _gama_build
        run: |
          set -euo pipefail
          cat > /tmp/g85_07d7124fa701.sh.xz.b64 <<'G85_REPLAY_EXACT_GAMA_6_0_PATCHES_FROM_RUN_67'
          
          
          
          G85_REPLAY_EXACT_GAMA_6_0_PATCHES_FROM_RUN_67
          tr -d ' \n\r\t' < /tmp/g85_07d7124fa701.sh.xz.b64 | base64 --decode | xz -dc > /tmp/g85_07d7124fa701.sh
          test "$(sha256sum /tmp/g85_07d7124fa701.sh | cut -d' ' -f1)" = "b75790d5589bd8fc2a86e59e1e9e8c2acde173a496a848cdd56280151c2bd580"
          bash /tmp/g85_07d7124fa701.sh
