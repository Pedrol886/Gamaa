name: Build Gama 9.4.0 Continuous Core Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-9-4-continuous-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    defaults:
      run:
        shell: bash

    env:
      GAMA_BASE_RUN_ID: "37158343882"
      GAMA_BASE_ARTIFACT: "Gama-9.3.0-JARVIS-source"
      GAMA_EXPECTED_CERT_SHA256: "6933EDA890C29567A8F4B6CEAD7A39A442DF109D43B813A19F3F6FA7F39B078C"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-9.4.0-CONTINUOUS-CORE-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"
            echo "::warning::GAMA_SIGNING_SEED não está configurado. O APK continuará sendo release, mas não posso garantir atualização sobre APKs anteriores."
          elif printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-9.4.0-CONTINUOUS-CORE-APK" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GAMA_SIGNING_SEED deve conter exatamente 64 caracteres hexadecimais."
            exit 1
          fi

      - name: Restore exact successful Gama 9.3.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt

          grep -Fq \
            'Gama 9.3.0 JARVIS Reliability' \
            _gama_build/app/build.gradle.kts

          echo "Exact Gama 9.3.0 source restored."

      - name: Verify exact audited source hashes
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual

            test -s "$file"

            actual="$(git hash-object "$file")"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Source mismatch: $file"
              echo "expected=$expected"
              echo "actual=$actual"
              exit 1
            fi

            echo "PASS $file"
          }

          ROOT="_gama_build"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaService.kt" \
            "da73a2f7aeec16fa5d6202812924164b776804d9"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/ConversationSession.kt" \
            "ccac0acb53313b63f0bccc06f20291da7b820920"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaSupervisor.kt" \
            "dea7bae963dc9bc18169238ef621ff386fb7672b"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaRecognitionPolicy.kt" \
            "cb0448b364902b7f47d8f1bbb1b4e8f8310a3e50"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/VoicePolicy.kt" \
            "21bec82e4144a232f6673711c7d4c7911971df68"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaAppRegistry.kt" \
            "f4d8b5e3c1ce3b7b011c73311c56aedec80c140d"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaReliableAppLauncher.kt" \
            "852ef57c39503cd02b7fd08a1e109693387876c0"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaLaunchFallback.kt" \
            "70427dd230eca9c81338d4652a12a4ff5c17543c"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/LocalBrain.kt" \
            "9f9b02c0768cb1ff1d36943e491cfb2c1efefbc7"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaBrainProcessService.kt" \
            "6ef1b60c8a7dc991b2d5f38bc59062544d512770"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/BrainProcessProtocol.kt" \
            "629b434dd22fbfad19dda0ef0784c4312bb1f009"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaReplyGuard.kt" \
            "01cf76301cb8915bf8ef58043c02424175c7e628"

          check_blob \
            "$ROOT/app/build.gradle.kts" \
            "e8005e575476b8152c33a9db0dc82556d0de657c"

          check_blob \
            "$ROOT/app/src/main/AndroidManifest.xml" \
            "e898888312d7c1355cf751b9dc391ca1aa3a48ea"

      - name: Apply Gama 9.4.0 Continuous Core
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          root = Path("_gama_build")
          src = root / "app/src/main/java/com/gama/assistant"
          tests = root / "app/src/test/java/com/gama/assistant"

          def write(path: Path, content: str):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  textwrap.dedent(content).strip() + "\n",
                  encoding="utf-8"
              )

          def replace_once(path: Path, old: str, new: str):
              value = path.read_text(encoding="utf-8")
              count = value.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one literal match, found {count}"
                  )
              path.write_text(
                  value.replace(old, new, 1),
                  encoding="utf-8"
              )

          def sub_once(path: Path, pattern: str, replacement: str):
              value = path.read_text(encoding="utf-8")
              result, count = re.subn(
                  pattern,
                  replacement,
                  value,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one regex match for {pattern!r}, found {count}"
                  )
              path.write_text(result, encoding="utf-8")

          # ============================================================
          # ACTIVE TASK CONTEXT
          # ============================================================

          write(
              src / "ActiveTaskContext.kt",
              r'''
              package com.gama.assistant

              import java.text.Normalizer
              import java.util.Locale

              class ActiveTaskContext {

                  data class Snapshot(
                      val sessionId: Long = 0L,
                      val currentTopic: String = "",
                      val currentTask: String = "",
                      val currentObject: String = "",
                      val currentApp: String = "",
                      val previousApp: String = "",
                      val currentContact: String = "",
                      val currentProject: String = "",
                      val lastUserIntent: String = "",
                      val lastAction: String = "",
                      val lastActionResult: String = "",
                      val pendingAction: String = "",
                      val importantEntities: List<String> = emptyList(),
                      val shortTermFacts: List<String> = emptyList(),
                  )

                  private var state = Snapshot()

                  @Synchronized
                  fun beginSession(sessionId: Long) {
                      state = Snapshot(sessionId = sessionId)
                  }

                  @Synchronized
                  fun reset() {
                      state = Snapshot()
                  }

                  @Synchronized
                  fun snapshot(): Snapshot = state

                  @Synchronized
                  fun observeUser(raw: String) {
                      val clean = clean(raw, 700)
                      if (clean.isBlank()) return

                      val detectedApp = detectApp(clean)
                      val detectedContact = detectContact(clean)
                      val detectedProject = detectProject(clean)

                      val previousApp =
                          if (
                              detectedApp != null &&
                              state.currentApp.isNotBlank() &&
                              detectedApp != state.currentApp
                          ) {
                              state.currentApp
                          } else {
                              state.previousApp
                          }

                      val app = detectedApp ?: state.currentApp
                      val contact = detectedContact ?: state.currentContact
                      val project = detectedProject ?: state.currentProject

                      val currentObject = when {
                          detectedProject != null -> detectedProject
                          detectedContact != null -> detectedContact
                          detectedApp != null -> detectedApp
                          else -> state.currentObject
                      }

                      val entities = (
                          state.importantEntities +
                              listOfNotNull(
                                  detectedApp,
                                  detectedContact,
                                  detectedProject,
                              )
                          )
                          .filter { it.isNotBlank() }
                          .distinct()
                          .takeLast(16)

                      val facts = (
                          state.shortTermFacts +
                              clean.take(280)
                          )
                          .distinct()
                          .takeLast(12)

                      state = state.copy(
                          currentTopic = inferTopic(
                              clean,
                              app,
                              contact,
                              project,
                          ),
                          currentTask = clean,
                          currentObject = currentObject,
                          currentApp = app,
                          previousApp = previousApp,
                          currentContact = contact,
                          currentProject = project,
                          lastUserIntent = clean,
                          pendingAction = clean,
                          importantEntities = entities,
                          shortTermFacts = facts,
                      )
                  }

                  @Synchronized
                  fun observeAction(
                      action: String,
                      result: String,
                      app: String? = null,
                  ) {
                      val cleanAction = clean(action, 400)
                      val cleanResult = clean(result, 500)
                      val cleanApp = app?.trim().orEmpty()

                      val previousApp =
                          if (
                              cleanApp.isNotBlank() &&
                              state.currentApp.isNotBlank() &&
                              cleanApp != state.currentApp
                          ) {
                              state.currentApp
                          } else {
                              state.previousApp
                          }

                      state = state.copy(
                          currentTask = cleanAction.ifBlank {
                              state.currentTask
                          },
                          currentObject = cleanApp.ifBlank {
                              state.currentObject
                          },
                          currentApp = cleanApp.ifBlank {
                              state.currentApp
                          },
                          previousApp = previousApp,
                          lastAction = cleanAction,
                          lastActionResult = cleanResult,
                          pendingAction = "",
                          shortTermFacts = (
                              state.shortTermFacts +
                                  listOf(
                                      cleanAction,
                                      cleanResult,
                                  )
                              )
                              .filter { it.isNotBlank() }
                              .distinct()
                              .takeLast(12),
                      )
                  }

                  @Synchronized
                  fun observeAssistant(raw: String) {
                      val clean = clean(raw, 500)
                      if (clean.isBlank()) return

                      state = state.copy(
                          lastActionResult =
                              if (state.lastAction.isNotBlank()) {
                                  clean
                              } else {
                                  state.lastActionResult
                              },
                          shortTermFacts = (
                              state.shortTermFacts +
                                  clean
                              )
                              .distinct()
                              .takeLast(12),
                      )
                  }

                  @Synchronized
                  fun resolve(raw: String): String {
                      val clean = clean(raw, 700)
                      if (clean.isBlank()) return clean

                      val n = normalize(clean)
                      val current = state

                      if (
                          current.currentApp.isNotBlank() &&
                          n in setOf(
                              "abre de novo",
                              "abra de novo",
                              "abre ele de novo",
                              "abra ele de novo",
                              "abre ele",
                              "abra ele",
                              "abre isso",
                              "abra isso",
                          )
                      ) {
                          return "abra ${current.currentApp}"
                      }

                      if (
                          current.previousApp.isNotBlank() &&
                          n in setOf(
                              "volta no anterior",
                              "volte no anterior",
                              "volta pro anterior",
                              "volte para o anterior",
                              "abre o anterior",
                              "abra o anterior",
                          )
                      ) {
                          return "abra ${current.previousApp}"
                      }

                      if (
                          current.currentApp.isNotBlank() &&
                          n in setOf(
                              "fecha ele",
                              "feche ele",
                              "fecha isso",
                              "feche isso",
                              "fecha o app",
                              "feche o app",
                              "sai dele",
                              "saia dele",
                          )
                      ) {
                          return "feche ${current.currentApp}"
                      }

                      if (current.currentContact.isNotBlank()) {
                          val pronoun = Regex(
                              "(?i)\\b(?:pra|para|pro|ao)\\s+(?:ele|ela)\\b"
                          )
                          if (pronoun.containsMatchIn(clean)) {
                              return clean.replaceFirst(
                                  pronoun,
                                  "para ${current.currentContact}"
                              )
                          }
                      }

                      if (
                          current.lastAction.isNotBlank() &&
                          n in setOf(
                              "faz igual",
                              "faca igual",
                              "faça igual",
                              "tenta de novo",
                              "tente de novo",
                          )
                      ) {
                          return current.lastAction
                      }

                      return clean
                  }

                  @Synchronized
                  fun summary(): String? {
                      val s = state
                      if (s == Snapshot()) return null

                      return buildString {
                          append("Contexto ativo da tarefa. ")

                          if (s.currentTopic.isNotBlank()) {
                              append("Assunto: ${s.currentTopic}. ")
                          }

                          if (s.currentTask.isNotBlank()) {
                              append("Tarefa: ${s.currentTask}. ")
                          }

                          if (s.currentObject.isNotBlank()) {
                              append("Objeto atual: ${s.currentObject}. ")
                          }

                          if (s.currentApp.isNotBlank()) {
                              append("Aplicativo atual: ${s.currentApp}. ")
                          }

                          if (s.previousApp.isNotBlank()) {
                              append("Aplicativo anterior: ${s.previousApp}. ")
                          }

                          if (s.currentContact.isNotBlank()) {
                              append("Contato atual: ${s.currentContact}. ")
                          }

                          if (s.currentProject.isNotBlank()) {
                              append("Projeto atual: ${s.currentProject}. ")
                          }

                          if (s.lastAction.isNotBlank()) {
                              append("Última ação: ${s.lastAction}. ")
                          }

                          if (s.lastActionResult.isNotBlank()) {
                              append(
                                  "Resultado da última ação: " +
                                      "${s.lastActionResult}. "
                              )
                          }

                          if (s.pendingAction.isNotBlank()) {
                              append(
                                  "Ação pendente: " +
                                      "${s.pendingAction}. "
                              )
                          }
                      }
                          .replace(Regex("\\s+"), " ")
                          .trim()
                          .take(2200)
                          .takeIf { it.isNotBlank() }
                  }

                  private fun detectApp(raw: String): String? {
                      val n = normalize(raw)

                      return when {
                          Regex(
                              "\\b(?:whatsapp|whats|watsap|uatsap|zap|zapzap)\\b"
                          ).containsMatchIn(n) -> "WhatsApp"

                          Regex("\\bspotify\\b")
                              .containsMatchIn(n) -> "Spotify"

                          Regex("\\b(?:youtube|yutube|iutube)\\b")
                              .containsMatchIn(n) -> "YouTube"

                          Regex("\\b(?:instagram|insta)\\b")
                              .containsMatchIn(n) -> "Instagram"

                          Regex("\\b(?:tiktok|tik tok)\\b")
                              .containsMatchIn(n) -> "TikTok"

                          else -> null
                      }
                  }

                  private fun detectContact(raw: String): String? {
                      val match = Regex(
                          "(?i)(?:whatsapp\\s+)?(?:para|pra)\\s+" +
                              "(.+?)(?:\\s+dizendo|\\s+falando|\\s+que\\s+|$)"
                      ).find(raw) ?: return null

                      val candidate = match.groupValues[1]
                          .trim()
                          .trim(',', '.', ':', ';')
                          .take(100)

                      return candidate.takeIf {
                          it.length >= 2 &&
                              normalize(it) !in setOf(
                                  "ele",
                                  "ela",
                                  "isso",
                              )
                      }
                  }

                  private fun detectProject(raw: String): String? {
                      val match = Regex(
                          "(?i)\\bprojeto\\s+([\\p{L}0-9 _-]{2,80})"
                      ).find(raw) ?: return null

                      return match.groupValues[1]
                          .trim()
                          .trim(',', '.', ':', ';')
                          .take(80)
                          .takeIf { it.isNotBlank() }
                  }

                  private fun inferTopic(
                      raw: String,
                      app: String,
                      contact: String,
                      project: String,
                  ): String = when {
                      project.isNotBlank() -> project
                      contact.isNotBlank() -> "conversa com $contact"
                      app.isNotBlank() -> app
                      else -> raw.take(140)
                  }

                  private fun clean(
                      value: String,
                      limit: Int,
                  ): String =
                      value
                          .replace(Regex("\\s+"), " ")
                          .trim()
                          .take(limit)

                  private fun normalize(value: String): String =
                      Normalizer.normalize(
                          value.lowercase(Locale.ROOT),
                          Normalizer.Form.NFD,
                      )
                          .replace(Regex("\\p{M}+"), "")
                          .replace(Regex("[^a-z0-9 ]+"), " ")
                          .replace(Regex("\\s+"), " ")
                          .trim()
              }
              '''
          )

          # ============================================================
          # TURN COORDINATOR
          # ============================================================

          write(
              src / "GamaTurnCoordinator.kt",
              r'''
              package com.gama.assistant

              class GamaTurnCoordinator {

                  data class Stamp(
                      val sessionId: Long,
                      val turnId: Long,
                      val generationId: Long,
                  )

                  private var sessionId = 0L
                  private var turnId = 0L
                  private var generationId = 0L
                  private var sessionSerial = 0L

                  @Synchronized
                  fun openSession(
                      externalSessionId: Long = 0L
                  ): Stamp {
                      sessionId =
                          if (externalSessionId > 0L) {
                              externalSessionId
                          } else {
                              ++sessionSerial
                          }

                      turnId = 0L
                      generationId++

                      return currentLocked()
                  }

                  @Synchronized
                  fun beginTurn(): Stamp {
                      if (sessionId <= 0L) {
                          sessionId = ++sessionSerial
                      }

                      turnId++
                      generationId++

                      return currentLocked()
                  }

                  @Synchronized
                  fun invalidateGeneration(): Stamp {
                      generationId++
                      return currentLocked()
                  }

                  @Synchronized
                  fun current(): Stamp? =
                      if (sessionId <= 0L) {
                          null
                      } else {
                          currentLocked()
                      }

                  @Synchronized
                  fun isCurrent(stamp: Stamp?): Boolean =
                      stamp != null &&
                          stamp.sessionId == sessionId &&
                          stamp.turnId == turnId &&
                          stamp.generationId == generationId

                  @Synchronized
                  fun closeSession() {
                      generationId++
                      sessionId = 0L
                      turnId = 0L
                  }

                  private fun currentLocked(): Stamp =
                      Stamp(
                          sessionId = sessionId,
                          turnId = turnId,
                          generationId = generationId,
                      )
              }
              '''
          )

          # ============================================================
          # ORCHESTRATOR
          # ============================================================

          write(
              src / "GamaOrchestrator.kt",
              r'''
              package com.gama.assistant

              class GamaOrchestrator(
                  private val conversation: ConversationSession,
              ) {
                  val turns = GamaTurnCoordinator()

                  @Synchronized
                  fun openSession() {
                      if (!conversation.active) {
                          conversation.open()
                      }

                      turns.openSession(
                          conversation.sessionId
                      )
                  }

                  @Synchronized
                  fun resumeSession() {
                      conversation.resume()

                      if (turns.current() == null) {
                          turns.openSession(
                              conversation.sessionId
                          )
                      }
                  }

                  @Synchronized
                  fun closeSession() {
                      conversation.close()
                      turns.closeSession()
                  }

                  @Synchronized
                  fun beginTurn(raw: String): GamaTurnCoordinator.Stamp {
                      conversation.observeContext(raw)
                      return turns.beginTurn()
                  }

                  fun currentStamp(): GamaTurnCoordinator.Stamp? =
                      turns.current()

                  fun isCurrent(
                      stamp: GamaTurnCoordinator.Stamp?
                  ): Boolean =
                      turns.isCurrent(stamp)

                  fun invalidateCurrentTurn() {
                      turns.invalidateGeneration()
                  }

                  fun resolve(raw: String): String =
                      conversation.resolveReference(raw)

                  fun rememberAction(
                      action: String,
                      result: String,
                      app: String? = null,
                  ) {
                      conversation.rememberAction(
                          action,
                          result,
                          app,
                      )
                  }
              }
              '''
          )

          # ============================================================
          # CONVERSATION SESSION
          # ============================================================

          write(
              src / "ConversationSession.kt",
              r'''
              package com.gama.assistant

              import java.text.Normalizer
              import java.util.Locale
              import java.util.concurrent.atomic.AtomicLong

              class ConversationSession {

                  @Volatile
                  var active: Boolean = false
                      private set

                  @Volatile
                  var sessionId: Long = 0L
                      private set

                  private val turns = ArrayDeque<String>()
                  private val activeContext = ActiveTaskContext()

                  @Synchronized
                  fun open() {
                      turns.clear()
                      sessionId = SESSION_SERIAL.incrementAndGet()
                      activeContext.beginSession(sessionId)
                      active = true
                  }

                  @Synchronized
                  fun suspend() {
                      active = false
                  }

                  @Synchronized
                  fun resume() {
                      if (sessionId <= 0L) {
                          open()
                      } else {
                          active = true
                      }
                  }

                  @Synchronized
                  fun close() {
                      active = false
                      sessionId = 0L
                      turns.clear()
                      activeContext.reset()
                  }

                  @Synchronized
                  fun observeContext(text: String) {
                      if (active) {
                          activeContext.observeUser(text)
                      }
                  }

                  @Synchronized
                  fun userSaid(text: String) {
                      if (!active) return
                      activeContext.observeUser(text)
                      record("Usuário", text)
                  }

                  @Synchronized
                  fun gamaSaid(text: String) {
                      if (!active) return
                      activeContext.observeAssistant(text)
                      record("Gama", text)
                  }

                  @Synchronized
                  fun rememberAction(
                      action: String,
                      result: String,
                      app: String? = null,
                  ) {
                      if (active) {
                          activeContext.observeAction(
                              action,
                              result,
                              app,
                          )
                      }
                  }

                  @Synchronized
                  fun resolveReference(raw: String): String =
                      if (active) {
                          activeContext.resolve(raw)
                      } else {
                          raw.trim()
                      }

                  @Synchronized
                  fun activeContextSummary(): String? =
                      activeContext.summary()

                  @Synchronized
                  fun activeContextSnapshot(): ActiveTaskContext.Snapshot =
                      activeContext.snapshot()

                  @Synchronized
                  fun historyBeforeCurrent(
                      maxChars: Int = 2800
                  ): String {
                      val previous = turns.dropLast(1)

                      if (previous.isEmpty()) return ""

                      val selected = mutableListOf<String>()
                      var used = 0

                      for (line in previous.asReversed()) {
                          val cost = line.length + 1

                          if (
                              selected.isNotEmpty() &&
                              used + cost > maxChars
                          ) {
                              break
                          }

                          selected.add(0, line)
                          used += cost
                      }

                      return selected.joinToString("\n")
                  }

                  private fun record(
                      speaker: String,
                      utterance: String,
                  ) {
                      turns.add(
                          "$speaker: ${
                              utterance
                                  .replace('\n', ' ')
                                  .take(420)
                          }"
                      )

                      while (turns.size > 24) {
                          turns.removeFirst()
                      }
                  }

                  companion object {
                      private val SESSION_SERIAL =
                          AtomicLong(
                              System.currentTimeMillis()
                          )

                      fun needsHistory(command: String): Boolean {
                          val c = normalize(command)

                          if (c.isBlank()) return false

                          if (
                              c.startsWith("e ") ||
                              c.startsWith("entao ") ||
