      - name: Apply Gama 5.8.1 install identity
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_58'
          from pathlib import Path
          import re
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(r'versionName\s*=\s*"Gama 5\.7"', 'versionName = "Gama 5.8.1"', s, count=1)
          if n != 1:
              raise SystemExit('versionName 5.7 não encontrado.')
          p.write_text(s, encoding='utf-8')
          PY_58
          grep -Fq 'versionName = "Gama 5.8.1"' app/build.gradle.kts

      - name: Preflight source and install invariants
        working-directory: _gama_build
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/gama/assistant/GamaService.kt
          test -f app/src/main/java/com/gama/assistant/GamaNotificationListener.kt
          test -f app/src/main/java/com/gama/assistant/GamaEnergyView.kt
          test -f app/src/test/java/com/gama/assistant/CommandRouterTest.kt
          grep -Fq 'applicationId = "com.gama.assistant"' app/build.gradle.kts
          grep -Fq 'versionName = "Gama 5.8.1"' app/build.gradle.kts
          grep -Fq 'snapshotReady' app/src/main/java/com/gama/assistant/GamaNotificationListener.kt
          grep -Fq 'safeTtsSpeak' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'crashDiagnosticReply' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'installedAppsCache' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'ownerAuthResumeConversation' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'CommandRouter.appToOpen(command)' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'WhatsAppCommandParser.parse(command)' app/src/main/java/com/gama/assistant/GamaService.kt
          if grep -q 'vosk-model-spk' tools/download_models.sh; then
            echo "::error::Modelo de locutor antigo reapareceu."
            exit 1
          fi
          echo "Gama 5.8.1 preflight passed."

