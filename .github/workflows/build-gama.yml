          raw = Path('/tmp/gama-potente.patch.xz.b64').read_text(encoding='utf-8')
          compact = re.sub(r'\s+', '', raw)
          compressed = base64.b64decode(compact, validate=True)
          if hashlib.sha256(compressed).hexdigest() != 'f47d95920207c45ce440dab27d55e7937c789a1523ce2fee53e24465d8750d88':
              raise SystemExit('Gama Potente compressed patch hash mismatch')
          patch = lzma.decompress(compressed)
