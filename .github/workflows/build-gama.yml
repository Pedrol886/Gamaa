      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set increasing versionCode
        working-directory: _gama_build
        run: |
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import os
          import re

          file = Path('app/build.gradle.kts')
          source = file.read_text(encoding='utf-8')
          run = int(os.environ['GITHUB_RUN_NUMBER'])
          source, count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {max(20261150, 20261100 + run)}',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('versionCode não encontrado.')
          file.write_text(source, encoding='utf-8')
          PY_VERSION

      - name: Download and verify offline voice models
        working-directory: _gama_build
        run: bash tools/download_models.sh

      - name: Compile Gama APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"

      - name: Run Gama unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Show first failure in summary
        if: failure()
        run: |
          python3 - <<'PY_DIAG'
          from pathlib import Path
          import os
          import re

          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as out:
              out.write('## Gama 4.7: diagnóstico\n\n')
              for name in ('gama-build.log', 'gama-tests.log'):
                  log = Path(name)
                  if not log.is_file():
                      continue
                  lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
                  problems = [
                      line for line in lines
                      if re.search(
                          r'(^e: |\berror:|^FAILURE:|^> Task .* FAILED|^\* What went wrong:|^Caused by:)',
                          line,
                      )
                  ]
                  excerpt = problems[:60] if problems else lines[-60:]
                  out.write('### ' + name + '\n\n```text\n')
                  out.write('\n'.join(excerpt))
                  out.write('\n```\n\n')
          PY_DIAG

      - name: Upload build diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-build-logs
          path: |
            gama-build.log
            gama-tests.log
          if-no-files-found: warn

      - name: Sign and verify Gama.apk
        working-directory: _gama_build
        env:
          GAMA_SIGNING_KEY_B64: ${{ secrets.GAMA_SIGNING_KEY_B64 }}
          GAMA_STORE_PASSWORD: ${{ secrets.GAMA_STORE_PASSWORD }}
          GAMA_KEY_ALIAS: ${{ secrets.GAMA_KEY_ALIAS }}
          GAMA_KEY_PASSWORD: ${{ secrets.GAMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Gama.apk

          if [ -n "$GAMA_SIGNING_KEY_B64" ]; then
            test -n "$GAMA_STORE_PASSWORD"
            test -n "$GAMA_KEY_ALIAS"
            test -n "$GAMA_KEY_PASSWORD"
            umask 077
            keyfile="$(mktemp)"
            trap 'rm -f "$keyfile"' EXIT
            printf '%s' "$GAMA_SIGNING_KEY_B64" | base64 --decode > "$keyfile"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$keyfile" \
              --ks-key-alias "$GAMA_KEY_ALIAS" \
              --ks-pass env:GAMA_STORE_PASSWORD \
              --key-pass env:GAMA_KEY_PASSWORD \
              dist/Gama.apk
          else
            echo "::warning::Sem a chave anterior, o APK usa a assinatura de teste da compilação e pode não atualizar a instalação existente."
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/Gama.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Gama.apk > dist/apk-info.txt
          grep -m1 '^package:' dist/apk-info.txt
          grep -m1 'application-label:' dist/apk-info.txt | grep -q Gama
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-4.9-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-tests
          path: _gama_build/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Publish Gama release
        env:
          GH_TOKEN: ${{ github.token }}
          GAMA_TAG: gama-${{ github.run_number }}
          GAMA_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > /tmp/gama-release.md <<'NOTES'
          Gama 4.7 mantém a base estável, usa identidade configurável por nome e tratamento, sessão autenticada pelo Android e não armazena voz. A bolinha e o visual bloqueado ficam laranja, e pesquisas gerais continuam livres de autenticação. Ao dizer “Gama” com o aparelho bloqueado, o visual mostra um anel azul com estados Ouvindo, Pensando e Falando. A conversa continua por voz sem repetir o hotword após cada resposta e permanece aberta por até uma hora de inatividade, ou até o usuário dizer “pode descansar”. O visual não desbloqueia o aparelho nem exibe conteúdo privado. As correções de voz, bolinha, abertura de WhatsApp/Zap e bloqueio de ruídos numéricos da 4.3 são preservadas.

          Para aparecer automaticamente sobre a tela bloqueada em segundo plano, o Android/Samsung precisa permitir a sobreposição do Gama ou o Gama precisa estar configurado como assistente padrão. Isso é uma limitação do Android, não um desbloqueio da tela.
          NOTES

          if gh release view "$GAMA_TAG" > /dev/null 2>&1; then
            gh release upload "$GAMA_TAG" \
              _gama_build/dist/Gama.apk \
              _gama_build/dist/Gama.apk.sha256 \
              --clobber
          else
            gh release create "$GAMA_TAG" \
              _gama_build/dist/Gama.apk \
              _gama_build/dist/Gama.apk.sha256 \
              --target "$GAMA_COMMIT" \
              --title "Gama 4.9 (${GAMA_TAG})" \
              --notes-file /tmp/gama-release.md
          fi
