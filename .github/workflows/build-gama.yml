name: Build Gama 9.5.0 Personal Intelligence Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-9-5-personal-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      GAMA_BASE_RUN_ID: "37158343882"
      GAMA_BASE_ARTIFACT: "Gama-9.3.0-JARVIS-source"
      GAMA_94_TEMPLATE_COMMIT: "b81455bdc29c25f85fa6b34612cee526e1c45508"
      GAMA_EXPECTED_CERT_SHA256: "6933EDA890C29567A8F4B6CEAD7A39A442DF109D43B813A19F3F6FA7F39B078C"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-9.5.0-PERSONAL-INTELLIGENCE-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"

            echo "::warning::GAMA_SIGNING_SEED não está configurado."
            echo "::warning::O APK será Release, mas será FRESH-INSTALL-ONLY."
          elif printf '%s' "$GAMA_SIGNING_SEED" |
            grep -Eq '^[0-9A-Fa-f]{64}$'; then

            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-9.5.0-PERSONAL-INTELLIGENCE-APK" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GAMA_SIGNING_SEED deve possuir exatamente 64 caracteres hexadecimais."
            exit 1
          fi

      - name: Restore exact successful Gama 9.3.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download \
            "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaNotificationListener.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaEnergyView.kt

          grep -Fq \
            'Gama 9.3.0 JARVIS Reliability' \
            _gama_build/app/build.gradle.kts

          echo "PASS: fonte exata do #136 restaurada."

      - name: Verify exact audited source
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual

            test -s "$file"

            actual="$(git hash-object "$file")"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Fonte diferente da versão auditada: $file"
              echo "expected=$expected"
              echo "actual=$actual"
              exit 1
            fi

            echo "PASS $file"
          }

          ROOT="_gama_build"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaService.kt" \
            "da73a2f7aeec16fa5d6202812924164b776804d9"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/ConversationSession.kt" \
            "ccac0acb53313b63f0bccc06f20291da7b820920"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaSupervisor.kt" \
            "dea7bae963dc9bc18169238ef621ff386fb7672b"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaRecognitionPolicy.kt" \
            "cb0448b364902b7f47d8f1bbb1b4e8f8310a3e50"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/VoicePolicy.kt" \
            "21bec82e4144a232f6673711c7d4c7911971df68"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaAppRegistry.kt" \
            "f4d8b5e3c1ce3b7b011c73311c56aedec80c140d"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaReliableAppLauncher.kt" \
            "852ef57c39503cd02b7fd08a1e109693387876c0"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaLaunchFallback.kt" \
            "70427dd230eca9c81338d4652a12a4ff5c17543c"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/LocalBrain.kt" \
            "9f9b02c0768cb1ff1d36943e491cfb2c1efefbc7"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaBrainProcessService.kt" \
            "6ef1b60c8a7dc991b2d5f38bc59062544d512770"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/BrainProcessProtocol.kt" \
            "629b434dd22fbfad19dda0ef0784c4312bb1f009"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaReplyGuard.kt" \
            "01cf76301cb8915bf8ef58043c02424175c7e628"

          check_blob \
            "$ROOT/app/build.gradle.kts" \
            "e8005e575476b8152c33a9db0dc82556d0de657c"

          check_blob \
            "$ROOT/app/src/main/AndroidManifest.xml" \
            "e898888312d7c1355cf751b9dc391ca1aa3a48ea"

      # ==============================================================
      # RECOVER THE CONTINUOUS CORE FROM THE REAL #139 TRANSFORMATION
      # ==============================================================

      - name: Recover corrected Gama 9.4 Continuous Core
        run: |
          set -euo pipefail

          git show \
            "$GAMA_94_TEMPLATE_COMMIT:.github/workflows/build-gama.yml" \
            > /tmp/gama139.yml

          python3 - \
            /tmp/gama139.yml \
            /tmp/gama94-transform.py <<'PY'
          from pathlib import Path
          import ast
          import re
          import sys

          workflow = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          output = Path(sys.argv[2])

          step = next(
              (
                  i
                  for i, line in enumerate(workflow)
                  if "name: Apply Gama 9.4.0 Continuous Core" in line
              ),
              None,
          )

          if step is None:
              raise SystemExit(
                  "Etapa Continuous Core não encontrada no commit do #139."
              )

          start = next(
              (
                  i
                  for i in range(step, len(workflow))
                  if "python3 - <<'PY'" in workflow[i]
              ),
              None,
          )

          if start is None:
              raise SystemExit(
                  "Transformação Python Continuous Core não encontrada."
              )

          indent = len(workflow[start]) - len(workflow[start].lstrip(" "))
          end = None

          for i in range(start + 1, len(workflow)):
              if workflow[i].strip() == "PY":
                  end = i
                  break

          if end is None:
              raise SystemExit(
                  "Final da transformação Continuous Core não encontrado."
              )

          prefix = " " * indent
          body = []

          for line in workflow[start + 1:end]:
              body.append(
                  line[indent:]
                  if line.startswith(prefix)
                  else line
              )

          script = "\n".join(body) + "\n"

          repairs = [
              (
                  re.compile(
                      r'(?m)^registry\s*=\s*\n'
                      r'\s*src\s*/\s*"GamaAppRegistry\.kt"\s*$'
                  ),
                  'registry = src / "GamaAppRegistry.kt"',
              ),
              (
                  re.compile(
                      r'(?m)^service\s*=\s*\n'
                      r'\s*src\s*/\s*"GamaService\.kt"\s*$'
                  ),
                  'service = src / "GamaService.kt"',
              ),
              (
                  re.compile(
                      r'(?m)^value\s*=\s*\n'
                      r'\s*service\.read_text\($'
                  ),
                  'value = service.read_text(',
              ),
              (
                  re.compile(
                      r'(?m)^gradle\s*=\s*\n'
                      r'\s*root\s*/\s*"app/build\.gradle\.kts"\s*$'
                  ),
                  'gradle = root / "app/build.gradle.kts"',
              ),
              (
                  re.compile(
                      r'(?m)^recognition_test\s*=\s*\n'
                      r'\s*tests\s*/\s*\n'
                      r'\s*"GamaRecognitionPolicyTest\.kt"\s*$'
                  ),
                  'recognition_test = tests / "GamaRecognitionPolicyTest.kt"',
              ),
              (
                  re.compile(
                      r'(?m)^reports\s*=\s*\n'
                      r'\s*root\s*/\s*"reports"\s*$'
                  ),
                  'reports = root / "reports"',
              ),
          ]

          for index, (pattern, replacement) in enumerate(repairs, 1):
              script, count = pattern.subn(
                  replacement,
                  script,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      f"Reparo Continuous Core {index} não encontrou "
                      f"exatamente uma ocorrência. count={count}"
                  )

          # #141 falhava porque procurava strings como "value =\n"
          # inclusive dentro de Kotlin embutido em triple-quotes.
          #
          # Agora a autoridade é o parser real do Python.
          ast.parse(
              script,
              filename="gama94-transform.py",
          )

          output.write_text(
              script,
              encoding="utf-8",
          )

          print("PASS: transformação Continuous Core reparada e analisada.")
          PY

          python3 -m py_compile \
            /tmp/gama94-transform.py

          python3 \
            /tmp/gama94-transform.py

          echo "PASS: Gama 9.4 Continuous Core aplicado."

      # ==============================================================
      # PERSONAL INTELLIGENCE CORE
      # ==============================================================

      - name: Add Gama Personal Intelligence Core
        run: |
          set -euo pipefail

          SRC="_gama_build/app/src/main/java/com/gama/assistant"
          TEST="_gama_build/app/src/test/java/com/gama/assistant"

          mkdir -p "$SRC" "$TEST"

          cat > "$SRC/GamaPersonalCore.kt" <<'KOTLIN'
          package com.gama.assistant

          import android.Manifest
          import android.content.ContentValues
          import android.content.Context
          import android.database.Cursor
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import android.os.Environment
          import android.provider.Settings
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.text.Normalizer
          import java.util.Locale
          import java.util.UUID
          import kotlin.math.roundToLong

          enum class GamaPriorityLevel(val weight: Int) {
              LOW(0),
              NORMAL(1),
              IMPORTANT(2),
              CRITICAL(3);

              companion object {
                  fun fromName(
                      value: String,
                      fallback: GamaPriorityLevel = NORMAL,
                  ): GamaPriorityLevel =
                      entries.firstOrNull {
                          it.name == value
                      } ?: fallback
              }
          }

          enum class GamaPolicyKind {
              NOTIFICATION_SENDER_PRIORITY,
              RESPONSE_STYLE,
              QUIET_MODE,
              ENDPOINT_PREFERENCE,
          }

          enum class GamaPermissionState {
              GRANTED,
              DENIED,
              NOT_REQUESTED,
              RESTRICTED_BY_ANDROID,
          }

          enum class GamaCapability {
              OPEN_APP,
              SEND_WHATSAPP,
              READ_NOTIFICATION,
              CREATE_CALENDAR,
              MEDIA_CONTROL,
              SYSTEM_VOLUME,
              WEB_SEARCH,
              LOCAL_REASONING,
              SCREEN_CONTROL,
          }

          enum class GamaIntentKind {
              CONVERSATION,
              QUESTION,
              OPEN_APP,
              CLOSE_APP,
              WHATSAPP,
              CALL,
              CALENDAR,
              REMINDER,
              NOTIFICATION,
              MEDIA,
              SYSTEM_CONTROL,
              MEMORY_WRITE,
              MEMORY_QUERY,
              POLICY_CREATE,
              POLICY_UPDATE,
              POLICY_DELETE,
              AUTOMATION_CREATE,
              AUTOMATION_UPDATE,
              AUTOMATION_DELETE,
              WEB_QUERY,
              CURRENT_INFORMATION,
              SLEEP,
              UNKNOWN,
          }

          data class GamaPolicyRecord(
              val id: String,
              val kind: GamaPolicyKind,
              val subjectNormalized: String,
              val subjectDisplay: String,
              val priority: GamaPriorityLevel,
              val action: String,
              val conditionsJson: String,
              val period: String,
              val origin: String,
              val createdAt: Long,
              val updatedAt: Long,
              val enabled: Boolean,
          )

          data class GamaAuditRecord(
              val kind: String,
              val subject: String,
              val reason: String,
              val result: String,
              val ruleId: String?,
              val occurredAt: Long,
          )

          data class GamaPersonalEvent(
              val eventId: String,
              val type: String,
              val origin: String,
              val depth: Int,
              val source: String,
              val summary: String,
              val priority: GamaPriorityLevel,
              val occurredAt: Long,
          )

          data class GamaNotificationDecision(
              val priority: GamaPriorityLevel,
              val shouldAlert: Boolean,
              val reason: String,
              val policyId: String?,
              val explicit: Boolean,
          )

          data class GamaOptimizerRecord(
              val key: String,
              val currentValue: Double,
              val previousValue: Double,
              val meanValue: Double,
              val samples: Int,
              val windowCount: Int,
              val windowFailures: Int,
              val changedAt: Long,
          )

          class GamaPersonalDatabase private constructor(
              context: Context
          ) : SQLiteOpenHelper(
              context.applicationContext,
              DB_NAME,
              null,
              DB_VERSION,
          ) {
              companion object {
                  private const val DB_NAME =
                      "gama_personal_intelligence.db"

                  private const val DB_VERSION =
                      1

                  @Volatile
                  private var instance:
                      GamaPersonalDatabase? = null

                  fun get(
                      context: Context
                  ): GamaPersonalDatabase =
                      instance
                          ?: synchronized(this) {
                              instance
                                  ?: GamaPersonalDatabase(
                                      context
                                  ).also {
                                      instance = it
                                  }
                          }
              }

              override fun onCreate(
                  db: SQLiteDatabase
              ) {
                  db.execSQL(
                      """
                      CREATE TABLE IF NOT EXISTS memory (
                          id TEXT PRIMARY KEY,
                          type TEXT NOT NULL,
                          value_text TEXT NOT NULL,
                          normalized TEXT NOT NULL,
                          source TEXT NOT NULL,
                          created_at INTEGER NOT NULL,
                          updated_at INTEGER NOT NULL,
                          confidence REAL NOT NULL,
                          importance INTEGER NOT NULL,
                          scope TEXT NOT NULL,
                          enabled INTEGER NOT NULL
                      )
                      """.trimIndent()
                  )

                  db.execSQL(
                      """
                      CREATE UNIQUE INDEX IF NOT EXISTS
                      idx_gama_memory_unique
                      ON memory(type, normalized)
                      """.trimIndent()
                  )

                  db.execSQL(
                      """
                      CREATE TABLE IF NOT EXISTS policy (
                          id TEXT PRIMARY KEY,
                          kind TEXT NOT NULL,
                          subject_normalized TEXT NOT NULL,
                          subject_display TEXT NOT NULL,
                          priority TEXT NOT NULL,
                          action TEXT NOT NULL,
                          conditions_json TEXT NOT NULL,
                          period TEXT NOT NULL,
                          origin TEXT NOT NULL,
                          created_at INTEGER NOT NULL,
                          updated_at INTEGER NOT NULL,
                          enabled INTEGER NOT NULL
                      )
                      """.trimIndent()
                  )

                  db.execSQL(
                      """
                      CREATE INDEX IF NOT EXISTS
                      idx_gama_policy_lookup
                      ON policy(
                          kind,
                          subject_normalized,
                          enabled,
                          updated_at
                      )
                      """.trimIndent()
                  )

                  db.execSQL(
                      """
                      CREATE TABLE IF NOT EXISTS alias (
                          alias_normalized TEXT PRIMARY KEY,
                          alias_display TEXT NOT NULL,
                          target TEXT NOT NULL,
                          updated_at INTEGER NOT NULL,
                          enabled INTEGER NOT NULL
                      )
                      """.trimIndent()
                  )

                  db.execSQL(
                      """
                      CREATE TABLE IF NOT EXISTS mode (
                          name TEXT PRIMARY KEY,
                          enabled INTEGER NOT NULL,
                          updated_at INTEGER NOT NULL
                      )
                      """.trimIndent()
                  )

                  db.execSQL(
                      """
                      CREATE TABLE IF NOT EXISTS audit (
                          id INTEGER PRIMARY KEY AUTOINCREMENT,
                          kind TEXT NOT NULL,
                          subject TEXT NOT NULL,
                          reason TEXT NOT NULL,
                          result TEXT NOT NULL,
                          rule_id TEXT,
                          occurred_at INTEGER NOT NULL
                      )
                      """.trimIndent()
                  )

                  db.execSQL(
                      """
                      CREATE TABLE IF NOT EXISTS event_log (
                          event_id TEXT PRIMARY KEY,
                          type TEXT NOT NULL,
                          origin TEXT NOT NULL,
                          depth INTEGER NOT NULL,
                          source TEXT NOT NULL,
                          summary TEXT NOT NULL,
                          priority TEXT NOT NULL,
                          occurred_at INTEGER NOT NULL,
                          deferred INTEGER NOT NULL,
                          consumed INTEGER NOT NULL
                      )
                      """.trimIndent()
                  )

                  db.execSQL(
                      """
                      CREATE TABLE IF NOT EXISTS optimizer (
                          key TEXT PRIMARY KEY,
                          current_value REAL NOT NULL,
                          previous_value REAL NOT NULL,
                          mean_value REAL NOT NULL,
                          samples INTEGER NOT NULL,
                          window_count INTEGER NOT NULL,
                          window_failures INTEGER NOT NULL,
                          changed_at INTEGER NOT NULL
                      )
                      """.trimIndent()
                  )

                  db.execSQL(
                      """
                      CREATE TABLE IF NOT EXISTS meta (
                          key TEXT PRIMARY KEY,
                          value_text TEXT NOT NULL
                      )
                      """.trimIndent()
                  )
              }

              override fun onUpgrade(
                  db: SQLiteDatabase,
                  oldVersion: Int,
                  newVersion: Int,
              ) {
                  if (oldVersion > newVersion) {
                      throw IllegalStateException(
                          "Downgrade do banco GAMA não é permitido."
                      )
                  }

                  // Banco inicia na versão 1.
                  // Migrações futuras devem ser incrementais,
                  // nunca DROP TABLE destrutivo.
              }

              fun putMeta(
                  key: String,
                  value: String,
              ) {
                  val values =
                      ContentValues().apply {
                          put("key", key)
                          put("value_text", value)
                      }

                  writableDatabase
                      .insertWithOnConflict(
                          "meta",
                          null,
                          values,
                          SQLiteDatabase
                              .CONFLICT_REPLACE,
                      )
              }

              fun meta(
                  key: String
              ): String? =
                  readableDatabase
                      .query(
                          "meta",
                          arrayOf(
                              "value_text"
                          ),
                          "key=?",
                          arrayOf(key),
                          null,
                          null,
                          null,
                          "1",
                      )
                      .use {
                          if (it.moveToFirst()) {
                              it.getString(0)
                          } else {
                              null
                          }
                      }

              fun putMemory(
                  type: String,
                  value: String,
                  source: String,
                  confidence: Double,
                  importance: Int,
                  scope: String,
              ) {
                  val clean =
                      value
                          .replace(
                              Regex("\\s+"),
                              " "
                          )
                          .trim()
                          .take(600)

                  if (clean.isBlank()) {
                      return
                  }

                  val normalized =
                      VoicePolicy
                          .normalize(clean)

                  if (normalized.isBlank()) {
                      return
                  }

                  val now =
                      System.currentTimeMillis()

                  val existingId =
                      readableDatabase
                          .query(
                              "memory",
                              arrayOf("id"),
                              "type=? AND normalized=?",
                              arrayOf(
                                  type,
                                  normalized,
                              ),
                              null,
                              null,
                              null,
                              "1",
                          )
                          .use {
                              if (it.moveToFirst()) {
                                  it.getString(0)
                              } else {
                                  null
                              }
                          }

                  val values =
                      ContentValues().apply {
                          put(
                              "id",
                              existingId
                                  ?: UUID.randomUUID()
                                      .toString()
                          )

                          put(
                              "type",
                              type
                          )

                          put(
                              "value_text",
                              clean
                          )

                          put(
                              "normalized",
                              normalized
                          )

                          put(
                              "source",
                              source
                          )

                          put(
                              "created_at",
                              if (
                                  existingId == null
                              ) {
                                  now
                              } else {
                                  memoryCreatedAt(
                                      existingId
                                  )
                              }
                          )

                          put(
                              "updated_at",
                              now
                          )

                          put(
                              "confidence",
                              confidence
                                  .coerceIn(
                                      0.0,
                                      1.0,
                                  )
                          )

                          put(
                              "importance",
                              importance
                                  .coerceIn(
                                      0,
                                      100,
                                  )
                          )

                          put(
                              "scope",
                              scope
                          )

                          put(
                              "enabled",
                              1
                          )
                      }

                  writableDatabase
                      .insertWithOnConflict(
                          "memory",
                          null,
                          values,
                          SQLiteDatabase
                              .CONFLICT_REPLACE,
                      )
              }

              private fun memoryCreatedAt(
                  id: String
              ): Long =
                  readableDatabase
                      .query(
                          "memory",
                          arrayOf(
                              "created_at"
                          ),
                          "id=?",
                          arrayOf(id),
                          null,
                          null,
                          null,
                          "1",
                      )
                      .use {
                          if (it.moveToFirst()) {
                              it.getLong(0)
                          } else {
                              System.currentTimeMillis()
                          }
                      }

              fun removeMemory(
                  query: String
              ): Int {
                  val normalized =
                      VoicePolicy
                          .normalize(query)

                  if (normalized.isBlank()) {
                      return 0
                  }

                  val ids =
                      mutableListOf<String>()

                  readableDatabase
                      .query(
                          "memory",
                          arrayOf(
                              "id",
                              "normalized",
                          ),
                          "enabled=1",
                          null,
                          null,
                          null,
                          null,
                      )
                      .use { cursor ->
                          while (
                              cursor.moveToNext()
                          ) {
                              val id =
                                  cursor.getString(0)

                              val item =
                                  cursor.getString(1)

                              if (
                                  item.contains(
                                      normalized
                                  ) ||
                                  normalized.contains(
                                      item
                                  )
                              ) {
                                  ids += id
                              }
                          }
                      }

                  var removed = 0

                  for (id in ids) {
                      removed +=
                          writableDatabase.delete(
                              "memory",
                              "id=?",
                              arrayOf(id),
                          )
                  }

                  return removed
              }

              fun memorySummary(
                  limit: Int = 12
              ): String? {
                  val items =
                      mutableListOf<String>()

                  readableDatabase
                      .query(
                          "memory",
                          arrayOf(
                              "value_text"
                          ),
                          "enabled=1",
                          null,
                          null,
                          null,
                          "importance DESC, updated_at DESC",
                          limit
                              .coerceIn(
                                  1,
                                  30,
                              )
                              .toString(),
                      )
                      .use {
                          while (
                              it.moveToNext()
                          ) {
                              val value =
                                  it.getString(0)
                                      .trim()

                              if (
                                  value.isNotBlank()
                              ) {
                                  items += value
                              }
                          }
                      }

                  return if (
                      items.isEmpty()
                  ) {
                      null
                  } else {
                      items.joinToString(
                          " | "
                      )
                  }
              }

              fun savePolicy(
                  record: GamaPolicyRecord
              ) {
                  val values =
                      ContentValues().apply {
                          put(
                              "id",
                              record.id
                          )

                          put(
                              "kind",
                              record.kind.name
                          )

                          put(
                              "subject_normalized",
                              record.subjectNormalized
                          )

                          put(
                              "subject_display",
                              record.subjectDisplay
