          python3 - <<'PY'
          from pathlib import Path
          p=Path('_gama_build/app/src/main/java/com/gama/assistant/GamaService.kt')
          s=p.read_text(encoding='utf-8')
          a='                if (!shouldDecodeAudio(buffer, read)) {\n'
          b='                val idleWakeMode = !conversation.active && transcription == null && !waitingForCommandStart && !commandSpeechStarted\n                if (!idleWakeMode && !shouldDecodeAudio(buffer, read)) {\n'
          if s.count(a)!=1: raise SystemExit(f'audio anchor={s.count(a)}')
          s=s.replace(a,b,1)
          a='            if (!textMode && BackgroundMode.enabled(this@GamaService)) {\n'
          b='            if (BackgroundMode.enabled(this@GamaService)) {\n                if (textMode || !running) {\n                    if (!listenerRestartPending) enableVoice()\n                    uiHandler.postDelayed(this, 3_000L)\n                    return\n                }\n'
          if s.count(a)!=1: raise SystemExit(f'watchdog anchor={s.count(a)}')
          s=s.replace(a,b,1).replace('            uiHandler.postDelayed(this, 4_000L)\n','            uiHandler.postDelayed(this, 3_000L)\n',1)
          p.write_text(s,encoding='utf-8')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('app/build.gradle.kts'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s*=\s*\d+',f"versionCode = {21700000+int(os.environ['GITHUB_RUN_NUMBER'])}",s,count=1)
          s=re.sub(r'versionName\s*=\s*"[^"]*"','versionName = "Gama 7.0.5"',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
          bash tools/download_models.sh
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -s "$APK"
          cp "$APK" dist/Gama.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Gama.apk
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-7.0.5-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "gama-v7.0.5-${GITHUB_RUN_NUMBER}" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            --title "Gama 7.0.5" --notes "Correção de escuta e geração do APK." --latest
