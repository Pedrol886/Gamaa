                          val requestId =
                              intent?.getLongExtra(
                                  BrainProcessProtocol.EXTRA_REQUEST_ID,
                                  0L
                              ) ?: return
          
                          if (
                              requestId <= 0L ||
                              requestId != activeBrainRequestId
                          ) {
                              return
                          }
          
                          val sessionId =
                              intent.getLongExtra(
                                  BrainProcessProtocol.EXTRA_SESSION_ID,
                                  0L
