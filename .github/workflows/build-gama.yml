name: Build Gama MAX JARVIS FIX103 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: gama-max-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      BASE_RUN_ID: "37000254395"
      BASE_ARTIFACT: "Linx-MAX-JARVIS-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore source from successful build 100
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build
          gh run download "$BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT" \
            --dir _gama_build
          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/VoicePolicy.kt
          echo "Source restored from successful run #100." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply Gama identity wake voice and red theme
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_GAMA'
          from pathlib import Path
          import re

          root = Path('.')
          app = root / 'app'
          pkg = app / 'src/main/java/com/gama/assistant'

          # Replace only source/resource text. File names, package name and class names stay intact.
          text_files = list(app.rglob('*.kt')) + list(app.rglob('*.xml')) + [app / 'build.gradle.kts']
          for path in text_files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('Linx', 'Gama').replace('LINX', 'GAMA').replace('linx', 'gama')
              path.write_text(text, encoding='utf-8')

          def edit(name, transform):
              path = pkg / name
              source = path.read_text(encoding='utf-8')
              path.write_text(transform(source), encoding='utf-8')

          # Remove the final user-visible Zevron labels left in the successful #100 source.
          edit('MainActivity.kt', lambda s: s
              .replace('text = "ZEVRON"', 'text = "GAMA"')
              .replace('Color.rgb(113, 224, 239)', 'Color.rgb(239, 68, 68)'))

          edit('GamaLockConversationActivity.kt', lambda s: s
              .replace('text = "ZEVRON"', 'text = "GAMA"')
              .replace('Color.rgb(255, 153, 51)', 'Color.rgb(239, 68, 68)'))

          # Gama is the single hotword. "gamma" is only tolerated as an ASR spelling.
          def voice_policy(source):
              return re.sub(
                  r'private val wake = Regex\(".*?"\)',
                  lambda _: 'private val wake = Regex("\\\\b(?:gama|gamma)\\\\b")',
                  source,
                  count=1,
              )
          edit('VoicePolicy.kt', voice_policy)

          edit('GamaService.kt', lambda s: s
              .replace('private fun currentWakePhrase(): String = "gama"', 'private fun currentWakePhrase(): String = "gama"')
              .replace('setOf("gama", "gama", "gama", "gama")', 'setOf("gama", "gamma")')
              .replace('preRoll = (preRoll + buffer.copyOf(read)).takeLast(16000).toByteArray()',
                       'preRoll = (preRoll + buffer.copyOf(read)).takeLast(24000).toByteArray()')
              .replace('val gate = maxOf(38.0, noiseFloor * 1.45).coerceAtMost(650.0)',
                       'val gate = maxOf(24.0, noiseFloor * 1.25).coerceAtMost(520.0)'))

          edit('ZevronConversationEngine.kt', lambda s: s
              .replace('setOf("gama", "atla", "atlis", "atlus")', 'setOf("gama", "gamma")')
              .replace('(?:gama|links|lincs)', '(?:gama|gamma)'))

          edit('GamaPersona.kt', lambda s: s.replace('(?:gama|links|lincs)', '(?:gama|gamma)'))

          # Remove obsolete Atlas aliases from old normalization code.
          for name in ('ConversationSession.kt', 'GamaTimePolicy.kt'):
              def clean_aliases(source):
                  for line in (
                      '            .removePrefix("atla ")\n',
                      '            .removePrefix("atlis ")\n',
                      '            .removePrefix("atlus ")\n',
                      '            .removeSuffix(" atla")\n',
                      '            .removeSuffix(" atlis")\n',
                      '            .removeSuffix(" atlus")\n',
                      '        .removePrefix("atla ")\n',
                      '        .removePrefix("atlis ")\n',
                      '        .removePrefix("atlus ")\n',
                      '        .removeSuffix(" atla")\n',
                      '        .removeSuffix(" atlis")\n',
                      '        .removeSuffix(" atlus")\n',
                  ):
                      source = source.replace(line, '')
                  return source
              edit(name, clean_aliases)

          # Red visual theme, replacing the old orange/cyan energy colors.
          edit('GamaEnergyView.kt', lambda s: s
              .replace('Color.rgb(255,132,36)', 'Color.rgb(239,68,68)')
              .replace('Color.argb((24 + 28 * pulse).toInt(),255,132,36)', 'Color.argb((24 + 28 * pulse).toInt(),239,68,68)')
              .replace('Color.argb((92 + activity * 105 - ringIndex * 8).toInt().coerceIn(40,220),255,144,45)',
                       'Color.argb((92 + activity * 105 - ringIndex * 8).toInt().coerceIn(40,220),239,68,68)')
              .replace('Color.rgb(255,188,94)', 'Color.rgb(248,113,113)'))

          edit('GamaFaceRingView.kt', lambda s: s
              .replace('/** Orange Gama energy/logo ring', '/** Red Gama energy/logo ring')
              .replace('Color.rgb(255, 145, 46)', 'Color.rgb(239, 68, 68)')
              .replace('Color.argb(105, 255, 153, 69)', 'Color.argb(105, 239, 68, 68)')
              .replace('Color.rgb(255, 170, 82)', 'Color.rgb(248, 113, 113)'))

          # Update wake tests to match the product name again.
          voice_test = app / 'src/test/java/com/gama/assistant/VoicePolicyTest.kt'
          test_source = voice_test.read_text(encoding='utf-8')
          test_source = test_source.replace(
              'listOf("Gama", "Atla", "Atlis", "Atlus").forEach { assertTrue(VoicePolicy.hasWake(it)) }',
              'listOf("Gama", "Gamma").forEach { assertTrue(VoicePolicy.hasWake(it)) }'
          )
          test_source = test_source.replace(
              'listOf("zevron", "sevron", "gama", "gamma", "kavus", "nada").forEach { assertFalse(VoicePolicy.hasWake(it)) }',
              'listOf("zevron", "sevron", "kavus", "linx", "atlas", "nada").forEach { assertFalse(VoicePolicy.hasWake(it)) }'
          )
          voice_test.write_text(test_source, encoding='utf-8')

          # Gama is the product name again, so this old assertion must not reject it.
          guard_test = app / 'src/test/java/com/gama/assistant/GamaReplyGuardTest.kt'
          guard = guard_test.read_text(encoding='utf-8')
          guard = guard.replace('        assertFalse(answer.contains("Gama"))\n', '')
          guard_test.write_text(guard, encoding='utf-8')

          print('Gama identity/wake/red-theme transform complete.')
          PY_GAMA

      - name: Audit Gama before compiling
        working-directory: _gama_build
        run: |
          set -euo pipefail
          PKG="app/src/main/java/com/gama/assistant"
          grep -Fq 'android:label="Gama"' app/src/main/AndroidManifest.xml
          grep -Fq '<string name="app_name">Gama</string>' app/src/main/res/values/strings.xml
          grep -Fq 'private val wake = Regex("\\b(?:gama|gamma)\\b")' "$PKG/VoicePolicy.kt"
          grep -Fq 'private fun currentWakePhrase(): String = "gama"' "$PKG/GamaService.kt"
          grep -Fq 'setOf("gama", "gamma")' "$PKG/GamaService.kt"
          grep -Fq 'text = "GAMA"' "$PKG/MainActivity.kt"
          grep -Fq 'text = "GAMA"' "$PKG/GamaLockConversationActivity.kt"
          grep -Fq 'Color.rgb(239, 68, 68)' "$PKG/MainActivity.kt"
          grep -Fq 'Color.rgb(239,68,68)' "$PKG/GamaEnergyView.kt"
          grep -Fq '"ptd"' "$PKG/GamaVoice.kt"
          grep -Fq '"afs"' "$PKG/GamaVoice.kt"
          ! grep -Rq --include='*.kt' --include='*.xml' -E '"[^"[:cntrl:]]*(Linx|Atlas|ZEVRON)[^"[:cntrl:]]*"' app/src/main || {
            echo "Old visible assistant name still found" >&2
            exit 1
          }
          echo "Gama identity, hotword, male voice policy and red theme audit passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set Gama version
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import os, re
          path = Path('app/build.gradle.kts')
          source = path.read_text(encoding='utf-8')
          code = 21200000 + int(os.environ['GITHUB_RUN_NUMBER'])
          source, a = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {code}', source, count=1)
          source, b = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "Gama MAX JARVIS FIX103"', source, count=1)
          if a != 1 or b != 1:
              raise SystemExit(f'version metadata patch failed: code={a}, name={b}')
          path.write_text(source, encoding='utf-8')
          print('versionCode', code)
          PY_VERSION

      - name: Download and verify offline models
        working-directory: _gama_build
        run: |
          set -euo pipefail
          bash tools/download_models.sh

      - name: Compile Gama APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"

      - name: Finalize Gama APK immediately
        working-directory: _gama_build
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" dist/Gama.apk
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)
          (cd dist && sha256sum -c Gama.apk.sha256)
          python3 - <<'PY_APK'
          from pathlib import Path
          apk = Path('dist/Gama.apk')
          data = apk.read_bytes()
          if len(data) <= 1_000_000:
              raise SystemExit(f'APK unexpectedly small: {len(data)} bytes')
          if b'APK Sig Block 42' not in data:
              raise SystemExit('Android APK signing block not found')
          print(f'Gama.apk ready: {len(data)} bytes')
          PY_APK

      - name: Upload Gama APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-MAX-JARVIS-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Run critical tests
        continue-on-error: true
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests "com.gama.assistant.VoicePolicyTest" \
            --tests "com.gama.assistant.ZevronConversationEngineTest" \
            --tests "com.gama.assistant.GamaReplyGuardTest" \
            --tests "com.gama.assistant.ZevronPlannerTest" \
            --tests "com.gama.assistant.ZevronSystemControlTest" \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-critical-tests.log"

      - name: Run full unit-test suite
        continue-on-error: true
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --rerun-tasks \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-MAX-JARVIS-diagnostics
          path: |
            gama-build.log
            gama-critical-tests.log
            gama-tests.log
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn
