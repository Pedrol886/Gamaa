      - name: Audit Linx MAX JARVIS architecture before compiling
        working-directory: _gama_build
        run: |
          set -euo pipefail
          PKG="app/src/main/java/com/gama/assistant"
          TESTS="app/src/test/java/com/gama/assistant"
          SERVICE="$PKG/GamaService.kt"

          test -s "$PKG/ZevronPlanner.kt"
          test -s "$PKG/ZevronMemoryStore.kt"
          test -s "$PKG/ZevronJarvisCore.kt"
          test -s "$PKG/ZevronPerceptionPolicy.kt"
          test -s "$PKG/ZevronContextResolver.kt"
          test -s "$PKG/ZevronSystemControl.kt"

          grep -Fq 'android:label="Linx"' app/src/main/AndroidManifest.xml
          grep -Fq 'private val wake = Regex("\\b(?:linx|links|lincs)\\b")' "$PKG/VoicePolicy.kt"
          ! grep -Eq 'private val wake.*(zevron|sevron|zevrom|zevrun|atlas|atla|atlis|atlus|gama|gamma)' "$PKG/VoicePolicy.kt"

          grep -Fq 'ZEVRON105_JARVIS_PLANNER' "$SERVICE"
          grep -Fq 'ZEVRON105_JARVIS_BRAIN_PROMPT' "$SERVICE"
          grep -Fq 'ZEVRON105_CONTEXTUAL_PERCEPTION' "$SERVICE"
          grep -Fq 'interruptSpeechForBargeIn()' "$SERVICE"
          grep -Fq 'handleBargeInAudio(rec, buffer, read, now)' "$SERVICE"
          grep -Fq 'ZevronJarvisCore.enrichBrainContext' "$SERVICE"
          grep -Fq 'ZevronPlanner.plan(command)' "$SERVICE"
          grep -Fq 'ZevronMemoryStore.handle(context, raw)' "$PKG/ZevronLocalRouter.kt"
          grep -Fq 'ZevronSystemControl.handle(context, raw)' "$PKG/ZevronLocalRouter.kt"
          grep -Fq 'android:canPerformGestures="true"' app/src/main/res/xml/gama_accessibility_service.xml
          grep -Fq 'GLOBAL_ACTION_QUICK_SETTINGS' "$PKG/ZevronSystemControl.kt"
          grep -Fq 'clickByLabel' "$PKG/ZevronSystemControl.kt"
          grep -Fq 'replaceFocusedText' "$PKG/ZevronSystemControl.kt"
          grep -Fq '"ptd"' "$PKG/GamaVoice.kt"
          grep -Fq '"afs"' "$PKG/GamaVoice.kt"
          grep -Fq '"ptd"' "$PKG/GamaVoiceCatalog.kt"
          grep -Fq '"afs"' "$PKG/GamaVoiceCatalog.kt"
          grep -Fq '"Natural" -> 0.82f to 0.96f' "$PKG/GamaVoice.kt"
          grep -Fq 'Você é Linx' "$PKG/GamaPersona.kt"
          grep -Fq '<string name="app_name">Linx</string>' app/src/main/res/values/strings.xml

          test -s "$TESTS/ZevronPlannerTest.kt"
          test -s "$TESTS/ZevronPerceptionPolicyTest.kt"
          test -s "$TESTS/ZevronJarvisCorePolicyTest.kt"
          test -s "$TESTS/ZevronSystemControlTest.kt"
          grep -Fq 'editsRecentWhatsappDraftByContext' "$TESTS/ZevronContextResolverTest.kt"

          ! grep -Rqs --include='*.kt' -E 'Diga Gama|diga Gama|Voz do Gama|notificação do Gama|Gama Contexto da Tela' app/src/main/java/com/gama/assistant
          ! find app/src -name '*.bak' -o -name '*.tmp' | grep -q .

          echo "Linx MAX JARVIS architecture audit passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Fix regression test expectations
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_TEST_FIXES'
          from pathlib import Path

          context_test = Path("app/src/test/java/com/gama/assistant/ZevronContextResolverTest.kt")
          source = context_test.read_text(encoding="utf-8")
          old = '.contains("joao", ignoreCase = true)'
          count = source.count(old)
          if count != 2:
              raise SystemExit(f"Expected 2 stale joao assertions, found {count}")
          source = source.replace(old, '.contains("João", ignoreCase = true)')
          context_test.write_text(source, encoding="utf-8")

          guard_test = Path("app/src/test/java/com/gama/assistant/GamaReplyGuardTest.kt")
          guard = guard_test.read_text(encoding="utf-8")
          stale = '        assertTrue(answer.contains("Gama continua ativo"))'
          if stale not in guard:
              raise SystemExit("Stale GamaReplyGuard assertion not found")
          guard = guard.replace(
              stale,
              '        assertTrue(answer.contains("Não consegui concluir isso agora"))\n'
              '        assertFalse(answer.contains("Gama"))'
          )
          guard_test.write_text(guard, encoding="utf-8")
          print("Regression expectations updated without changing runtime behavior.")
          PY_TEST_FIXES

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set Zevron JARVIS version
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import os, re
          path = Path("app/build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          code = 21100000 + int(os.environ["GITHUB_RUN_NUMBER"])
          source, a = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {code}', source, count=1)
          source, b = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "Linx MAX JARVIS"', source, count=1)
          if a != 1 or b != 1:
              raise SystemExit(f"version metadata patch failed: code={a}, name={b}")
          path.write_text(source, encoding="utf-8")
          print("versionCode", code)
          PY_VERSION
          echo "LINX_TAG=linx-max-jarvis-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Download and verify offline models
        working-directory: _gama_build
        run: |
          set -euo pipefail
          bash tools/download_models.sh

      - name: Compile Linx MAX JARVIS APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/zevron-build.log"

      - name: Finalize Linx APK immediately
        working-directory: _gama_build
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" dist/Linx.apk
          (cd dist && sha256sum Linx.apk > Linx.apk.sha256)
          (cd dist && sha256sum -c Linx.apk.sha256)
          python3 - <<'PY_APK'
          from pathlib import Path
          apk = Path("dist/Linx.apk")
          data = apk.read_bytes()
          if len(data) <= 1_000_000:
              raise SystemExit(f"APK unexpectedly small: {len(data)} bytes")
          if b"APK Sig Block 42" not in data:
              raise SystemExit("Android APK signing block not found")
          print(f"Linx.apk ready: {len(data)} bytes, Android signing block present")
          PY_APK
          echo "Final installable Linx.apk preserved immediately after compilation." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Linx APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: Linx-MAX-JARVIS-APK
          path: |
            _gama_build/dist/Linx.apk
            _gama_build/dist/Linx.apk.sha256
          if-no-files-found: error

      - name: Run Linx MAX critical regression tests
        continue-on-error: true
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests "com.gama.assistant.ZevronPlannerTest" \
            --tests "com.gama.assistant.ZevronContextResolverTest" \
            --tests "com.gama.assistant.ZevronPerceptionPolicyTest" \
            --tests "com.gama.assistant.ZevronJarvisCorePolicyTest" \
            --tests "com.gama.assistant.ZevronSystemControlTest" \
            --tests "com.gama.assistant.ZevronConversationEngineTest" \
            --tests "com.gama.assistant.ZevronMathToolTest" \
            --tests "com.gama.assistant.ConversationSessionTest" \
            --tests "com.gama.assistant.GamaTimePolicyTest" \
            2>&1 | tee "$GITHUB_WORKSPACE/zevron-critical-tests.log"

      - name: Run complete Linx unit-test suite
        continue-on-error: true
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --rerun-tasks 2>&1 | tee "$GITHUB_WORKSPACE/zevron-tests.log"

      - name: Verify complete test suite
        continue-on-error: true
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_TESTS'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("app/build/test-results/testDebugUnitTest")
          files = list(root.glob("TEST-*.xml"))
          if not files:
              raise SystemExit("No unit-test XML files were produced")
          tests = failures = errors = skipped = 0
          failed = []
          for path in files:
              suite = ET.parse(path).getroot()
              tests += int(suite.attrib.get("tests", 0))
              failures += int(suite.attrib.get("failures", 0))
              errors += int(suite.attrib.get("errors", 0))
              skipped += int(suite.attrib.get("skipped", 0))
              for case in suite.findall(".//testcase"):
                  node = case.find("failure")
                  if node is None:
                      node = case.find("error")
                  if node is not None:
                      failed.append(f"{case.attrib.get('classname')} > {case.attrib.get('name')}: {node.attrib.get('message','')}")
          print(f"tests={tests} failures={failures} errors={errors} skipped={skipped}")
          for item in failed:
              print("FAILED", item)
          if tests < 130:
              raise SystemExit(f"Unexpectedly low test count: {tests}")
          if failures or errors:
              raise SystemExit(f"Suite failed: failures={failures}, errors={errors}")
          PY_TESTS
          echo "Complete Linx test suite passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Print exact diagnostics
        if: always()
        run: |
          set +e
          echo "## Linx MAX diagnostics" >> "$GITHUB_STEP_SUMMARY"
          for log in zevron-build.log zevron-critical-tests.log zevron-tests.log; do
            [ -s "$log" ] || continue
            echo "### $log" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^e: |error:|FAILED|FAILURE:|AssertionError|ComparisonFailure|Caused by:|expected|but was)' "$log" | head -260 >> "$GITHUB_STEP_SUMMARY" || tail -200 "$log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linx-MAX-JARVIS-diagnostics
          path: |
            zevron-build.log
            zevron-critical-tests.log
            zevron-tests.log
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn

      - name: Upload complete Linx MAX source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linx-MAX-JARVIS-source
          path: |
            _gama_build/app/src
            _gama_build/app/build.gradle.kts
            _gama_build/settings.gradle.kts
            _gama_build/build.gradle.kts
            _gama_build/gradle.properties
            _gama_build/tools
          if-no-files-found: warn

      - name: Publish Linx MAX JARVIS release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$LINX_TAG"
          gh release delete "$TAG" --yes >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "_gama_build/dist/Linx.apk#Linx.apk" \
            "_gama_build/dist/Linx.apk.sha256#Linx.apk.sha256" \
            --title "Linx MAX JARVIS" \
            --notes "Linx MAX JARVIS compiled successfully from the validated Android source. The final APK is preserved immediately after assembleDebug, before regression tests, and uses the Android debug signing produced by the Gradle Android plugin. Includes Linx wake behavior, continuous voice conversation, barge-in, memory, planning, screen/context perception, WhatsApp, calendar, apps, notifications, Internet routing and user-authorized Accessibility system control."

