
      - name: Apply Gama 7.0.2 voice recovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_gama_build/app/src/main/java/com/gama/assistant/GamaService.kt')
          s=p.read_text()
          a='''                if (!shouldDecodeAudio(buffer, read)) {\n'''
          b='''                val idleWakeMode = !conversation.active && transcription == null && !waitingForCommandStart && !commandSpeechStarted\n                if (!idleWakeMode && !shouldDecodeAudio(buffer, read)) {\n'''
          if a not in s: raise SystemExit('audio gate anchor not found')
          s=s.replace(a,b,1)
          a='''            if (!textMode && BackgroundMode.enabled(this@GamaService)) {\n                val now = SystemClock.elapsedRealtime()\n                val alive = listenerThread?.isAlive == true\n                val staleAudio = lastAudioReadAt > 0L && now - lastAudioReadAt > 5_000L\n                if (alive && voiceReady && !staleAudio) {\n                    listenerRestartDelayMs = 750L\n                } else {\n                    recoverMicrophoneOnly(if (staleAudio) "watchdog-stale-audio" else "watchdog")\n                }\n            }\n            uiHandler.postDelayed(this, 4_000L)\n'''
          b='''            if (BackgroundMode.enabled(this@GamaService)) {\n                val now = SystemClock.elapsedRealtime()\n                val alive = listenerThread?.isAlive == true\n                val staleAudio = lastAudioReadAt > 0L && now - lastAudioReadAt > 5_000L\n                when {\n                    textMode || !running -> if (!listenerRestartPending) enableVoice()\n                    alive && voiceReady && !staleAudio -> listenerRestartDelayMs = 750L\n                    else -> recoverMicrophoneOnly(if (staleAudio) "watchdog-stale-audio" else "watchdog")\n                }\n            }\n            uiHandler.postDelayed(this, 3_000L)\n'''
          if a not in s: raise SystemExit('watchdog anchor not found')
          s=s.replace(a,b,1)
          p.write_text(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set version
        working-directory: _gama_build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('app/build.gradle.kts'); s=p.read_text()
          s=re.sub(r'versionCode\s*=\s*\d+',f"versionCode = {21600000+int(os.environ['GITHUB_RUN_NUMBER'])}",s,count=1)
          s=re.sub(r'versionName\s*=\s*"[^"]*"','versionName = "Gama 7.0.2"',s,count=1)
          p.write_text(s)
          PY

      - name: Build APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          bash tools/download_models.sh
          gradle :app:assembleDebug --no-daemon --stacktrace | tee "$GITHUB_WORKSPACE/gama-build.log"
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          cp "$APK" dist/Gama.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Gama.apk
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)

      - name: Upload Gama 7.0.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-7.0.2-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Publish Gama 7.0.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="gama-v7.0.2-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" _gama_build/dist/Gama.apk#Gama.apk _gama_build/dist/Gama.apk.sha256#Gama.apk.sha256 --title "Gama 7.0.2" --notes "Hotword mais confiável e recuperação automática do microfone." --latest

# GAMA_WORKFLOW_COMPLETE
