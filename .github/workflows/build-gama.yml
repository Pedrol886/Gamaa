name: Build Gama 10.6.0 GEMINIFIRST FIX APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: gama-10-6-geminifirst-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GAMA_BASE_RUN_ID: "37317067822"
      GAMA_BASE_ARTIFACT: "Gama-10.4.2-NATURAL171-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore proven NATURAL171 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build
          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/assets/model/final.mdl
          test -s _gama_build/app/src/main/assets/model/Gr.fst
          test -s _gama_build/app/src/main/assets/spk-model/final.ext.raw
          test -f _gama_build/gradlew
          chmod +x _gama_build/gradlew

      - name: Initialize Gemini First overlay
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/gama106-overlay.tar.gz.b64"

