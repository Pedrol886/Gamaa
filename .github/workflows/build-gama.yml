          tar -xzf /tmp/gama-project.tar.gz -C _gama_build

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install configured Android platform
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download and verify offline speech model
        working-directory: _gama_build
        run: bash tools/download_models.sh

      - name: Test and build APK
        working-directory: _gama_build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare and verify Gama.apk
        working-directory: _gama_build
        env:
          GAMA_SIGNING_KEY_B64: ${{ secrets.GAMA_SIGNING_KEY_B64 }}
          GAMA_STORE_PASSWORD: ${{ secrets.GAMA_STORE_PASSWORD }}
          GAMA_KEY_ALIAS: ${{ secrets.GAMA_KEY_ALIAS }}
          GAMA_KEY_PASSWORD: ${{ secrets.GAMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Gama.apk
          if [ -n "$GAMA_SIGNING_KEY_B64" ]; then
            test -n "$GAMA_STORE_PASSWORD"
            test -n "$GAMA_KEY_ALIAS"
            test -n "$GAMA_KEY_PASSWORD"
            umask 077
            gama_signing_file="$(mktemp)"
            trap 'rm -f "$gama_signing_file"' EXIT
            printf '%s' "$GAMA_SIGNING_KEY_B64" | base64 --decode > "$gama_signing_file"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$gama_signing_file" --ks-key-alias "$GAMA_KEY_ALIAS" --ks-pass env:GAMA_STORE_PASSWORD --key-pass env:GAMA_KEY_PASSWORD dist/Gama.apk
          else
            echo "::warning::APK de teste: atualizações exigem a mesma chave de assinatura. Configure os secrets GAMA de assinatura para manter a identidade entre builds."
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/Gama.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Gama.apk > dist/apk-info.txt
          sed -n '1p' dist/apk-info.txt
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-tests
          path: _gama_build/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GAMA_TAG: gama-${{ github.run_number }}
          GAMA_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > /tmp/gama-release.md <<'NOTES'
          Gama 2.1: escuta em segundo plano, botão para ativar e sair, abertura de apps por voz com autorização do Android e ajustes pela notificação. TTS e comandos locais preservados. Lousa removida.

          Diga Gama e espere “Sim senhor, estou ouvindo”. IA de conversa disponível após download opcional do modelo nos ajustes. PIN/biometria continuam sendo confirmados no Android. Testes automatizados não substituem validação no aparelho. A atualização sobre outro APK exige a mesma chave de assinatura.
          NOTES
          if gh release view "$GAMA_TAG" > /dev/null 2>&1; then
            gh release upload "$GAMA_TAG" _gama_build/dist/Gama.apk _gama_build/dist/Gama.apk.sha256 --clobber
          else
            gh release create "$GAMA_TAG" _gama_build/dist/Gama.apk _gama_build/dist/Gama.apk.sha256 --target "$GAMA_COMMIT" --title "Gama $GAMA_TAG" --notes-file /tmp/gama-release.md
          fi

