name: Build Gama 8.0.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write

concurrency:
  group: gama-8-0-0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout complete Gama project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit consolidated Gama source
        run: |
          set -euo pipefail
          python3 tools/audit_gama.py
          test -s app/build.gradle.kts
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/gama/assistant/GamaService.kt
          test -s app/src/main/assets/model/final.mdl

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set build version
        run: |
          set -euo pipefail
          VC=$((22000000 + GITHUB_RUN_NUMBER))
          sed -Ei "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $VC/" app/build.gradle.kts
          sed -Ei 's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "Gama 8.0.0"/' app/build.gradle.kts
          grep -F 'versionName = "Gama 8.0.0"' app/build.gradle.kts

      - name: Run critical unit tests
        continue-on-error: true
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests 'com.gama.assistant.VoicePolicyTest' \
            --tests 'com.gama.assistant.ConversationSessionTest' \
            --tests 'com.gama.assistant.ZevronPlannerTest' \
            --tests 'com.gama.assistant.ZevronContextResolverTest' \
            --tests 'com.gama.assistant.GamaCalendarCommandParserTest' \
            --tests 'com.gama.assistant.WhatsAppMessagingTest' \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-critical-tests.log"

      - name: Build Gama 8.0.0 APK
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" dist/Gama.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Gama.apk
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)

      - name: Upload Gama 8.0.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.0.0-APK
          path: |
            dist/Gama.apk
            dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Publish Gama 8.0.0 release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="gama-v8.0.0-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "dist/Gama.apk#Gama.apk" \
            "dist/Gama.apk.sha256#Gama.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 8.0.0" \
            --notes "Base consolidada do Gama: código Android completo no repositório, hotword dedicado, recuperação automática da escuta, missões/contexto, proatividade, agenda, WhatsApp, bloqueio, apps, perfil facial local do dono e ferramentas Android verificadas." \
            --latest

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.0.0-diagnostics
          path: |
            gama-build.log
            gama-critical-tests.log
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: warn
