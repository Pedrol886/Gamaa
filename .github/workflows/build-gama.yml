name: Build Gama 4.4 APK (plain source, lock-screen conversation)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write

concurrency:
  group: gama-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete Gama 4.4 Android source
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build
          cd _gama_build
          cat > 'README.md' <<'GAMA_FILE_001_END'
          # Gama 3.3: assistente Android com estilo J.A.R.V.I.S.
          
          Identificador `com.gama.assistant`; palavra de ativação **Gama**. O assistente mantém comandos locais, TTS, escuta em segundo plano, reconhecimento de fala e autenticação oficial do Android.
          
          **Novidades:** respostas em português com tratamento Senhor/Senhora/Chefe, configurável em Ajustes ou por "me chame de chefe"; IA offline com tom formal, sucinto, sugestões relevantes e protocolo de urgência sem humor; modo foco do próprio Gama, com Não perturbe do Android apenas se houver acesso autorizado e confirmação da mudança; memória local explícita com "lembre que ...", consultável por "o que você lembra de mim" e apagável pelos ajustes. Notas ficam no armazenamento local do aplicativo; a verificação de identidade por voz foi desativada na versão 3.5. O modelo Gemma opcional é necessário para conversas abertas.
          
          Novidades 3.2: agenda local com permissão, criação de compromisso via formulário do calendário, previsão via Open-Meteo para cidade escolhida e resumo do dia; cadências de voz configuráveis (dependem do TTS do Android); avisos proativos opcionais de compromissos e bateria, em verificações aproximadamente a cada 30 minutos. A IA offline, isoladamente, não tem acesso à agenda ou à internet. Os avisos opcionais são verificações periódicas, não vigilância contínua nem garantia de alerta em horário exato. Não há controle irrestrito do sistema. Nenhum status de ação é anunciado antes da ação real. O Gama não contorna PIN ou biometria do Android. A escuta constante gasta energia; a opção de bateria fica nos ajustes. A instalação como atualização requer a **mesma chave de assinatura** da instalação anterior e `versionCode` maior.
          
          O workflow `.github/workflows/build-gama.yml` contém o projeto compactado, compila e publica `Gama.apk`. APK não compilado nesta sessão: validar resultado da execução de GitHub Actions e testar no aparelho.
          
          
          ## Gama 3.3: conversa contínua
          Chame **Gama** uma vez: depois de "Sim senhor, estou ouvindo", a sessão permanece aberta entre as respostas e o Gama escuta as próximas perguntas sem exigir a palavra-chave novamente. O histórico curto das últimas falas desta sessão é passado à IA offline para perguntas de acompanhamento. Diga "encerrar conversa", "pode descansar" ou "tchau" para voltar a exigir a palavra-chave. Não há gravação persistente de áudio ou do histórico desta sessão; a memória explícita de preferências permanece separada.
          
          A bolinha flutuante pode ser tocada para interromper a resposta de voz e voltar a ouvir; quando o áudio é reproduzido em fones, a detecção de fala também tenta interromper a resposta. **Em alto-falante do telefone não há interrupção automática da resposta por voz**, pois o microfone poderia confundir a própria síntese do Gama com o usuário. A precisão da interrupção nos fones depende do microfone e do TTS. A escuta por voz precisa permanecer ligada e visível pela notificação de serviço; pode gastar bateria. Comandos privados exigem autenticação oficial do Android, inclusive durante uma sessão. O Google/Android pode interromper o serviço em segundo plano.
          
          ## Gama 3.4: criador público e proprietário de cada instalação
          
          - O criador público do aplicativo é definido em `GamaCreator.PUBLIC_NAME` (`GamaIdentity.kt`). **Confira se o nome público está autorizado antes de publicar**. O nome não define quem é dono de cada telefone e não concede privilégios.
          - Na primeira abertura, o aplicativo oferece um cadastro local de nome. Criar, editar ou excluir esse perfil exige PIN, senha, padrão ou autenticação autorizada pelo Android. O nome do perfil é armazenado no aparelho e não é enviado a serviços remotos.
          - Comandos como «quem criou você?» recebem a identidade pública do criador. «Quem é seu dono?» e «qual é meu nome?» consultam exclusivamente o perfil local, após confirmação do Android. O Gama não deduz a identidade da pessoa pela palavra que ela disse.
          - Na versão 3.5, o cadastro vocal da versão anterior é desativado e os dados de reconhecimento da voz do dono são apagados na primeira abertura. **Não é identificação biométrica infalível**, não comprova que quem fala é o proprietário e não desbloqueia o Android.
          - Leitura de agenda, mensagens, notas, memória pessoal e respostas sobre o proprietário exigem autenticação do Android, por voz ou texto. Uma consulta privada encerra a sessão atual para não contaminar o contexto de uma conversa pública; o usuário pode iniciar outra conversa com «Gama».
          - Informações pessoais explícitas não são incluídas automaticamente nas conversas abertas da IA offline. A verificação local de identidade por voz não substitui a autenticação oficial do Android.
          - Gama é um app comum, não tem poderes de administrador irrestrito. Não se deve ocultar a gravação do microfone nem publicar o cadastro de voz de outras pessoas.
          
          
          ## Gama 3.5: configuração inicial e interface mínima
          O cadastro de voz foi removido da experiência. Na primeira abertura, o proprietário informa um nome e confirma a credencial do Android. O app pede permissão de microfone e notificação; agenda e bolinha sobre outros apps são opcionais e explicadas separadamente. No dia a dia, não há painel de chat e atalhos. O ícone fecha após informar o status, mas o acesso aos ajustes e à opção de pausar permanece na notificação do serviço e nas Configurações do Android. Pedidos pessoais exigem confirmação do Android, não voz. A identidade de quem está falando não é determinada pelo nome do perfil. O Android pode impedir início de escuta em segundo plano, revogar permissões e encerrar serviços. O app não concede permissões a si mesmo, nem fica impossível de desativar.
          
          ### Alterações adicionais do 3.5
          O serviço não carrega o modelo de identificação vocal e o workflow não baixa amostras de identificação do falante. Qualquer perfil vocal antigo é limpo no próximo início do serviço. O ícone comum informa o estado e fecha automaticamente, mas permanece disponível para recuperações e interrupção da escuta. O indicador de microfone e a notificação seguem visíveis conforme o Android.
          
          ## Gama 3.6: instalar e testar conversa
          O APK inclui o app, os comandos e a interface. A IA de conversa requer um modelo Gemma 3 1B adicional, cerca de 555 MB; o APK não o contém. Após instalar/atualizar, abra Gama, toque Instalar IA offline e aguarde a conferência SHA-256. Depois diga “Gama” e faça uma pergunta; a primeira resposta por voz valida o modelo. A importação manual de um arquivo .task compatível fica apenas nas opções avançadas. A execução não é garantida em aparelhos de pouca memória; se falhar, a tela deve informar a falha sem fingir que respondeu. O ícone, a notificação de microfone e os botões de permissões/pausa permanecem acessíveis. O download usa a rede uma vez; as perguntas ao modelo são processadas localmente.
          
          ## Gama 3.7: tela principal e validação da IA
          O arquivo `.task` é o modelo de linguagem; não é um aplicativo nem precisa ser buscado manualmente. O botão Instalar ou reparar IA faz o download com confirmação da pessoa. O app distingue arquivo presente de IA funcionando; somente uma resposta gerada com sucesso marca o modelo como testado. A importação manual fica em Avançado. A tela inteira mantém o mesmo fundo escuro, mesmo em celulares altos. O assistente não promete desbloquear o Android sem credencial, não oculta o microfone e não garante que Gemma 3 1B rode com a memória do aparelho.
          
          
          ## Gama 3.9.3: conversa somente por voz
          - A conversa livre não tem botão nem caixa de texto.
          - Diga “Gama”, fale o pedido e a resposta é reproduzida por voz.
          - Depois de responder, o Gama continua ouvindo a conversa até o usuário encerrar.
          - A tela principal mantém apenas controles de escuta, instalação/reparo da IA e permissões.
          - Importação manual do modelo foi movida para opções avançadas.
          
          
          ## Conversa contínua estilo assistente
          - A palavra **Gama** é necessária somente para abrir a sessão.
          - Depois da primeira resposta, o microfone volta automaticamente ao modo de escuta e o usuário pode continuar falando sem repetir o nome.
          - A sessão pode continuar por horas enquanto houver interação; só volta ao modo de hotword depois de 20 minutos inteiros sem fala ou quando o usuário disser uma despedida como **pode descansar**.
          - O contexto é rolante: dezenas de turnos ficam na memória temporária da sessão e um recorte recente de até 4.200 caracteres é enviado ao modelo offline.
          - O modelo permanece carregado por mais tempo durante uma conversa ativa para reduzir a demora entre respostas.
          - O áudio bruto não é salvo. A conversa temporária é apagada ao encerrar a sessão.
          
          
          ## Gama 3.9.3.2: alias Zap
          Na voz, `zap`, `zap zap`, `zapzap` e `zape` são normalizados para `whatsapp` antes do parser de comandos.
          
          
          ## Correção 3.9.3
          - Comandos rápidos como abrir WhatsApp/Zap cancelam qualquer watchdog antigo e não dizem “Só um instante”.
          - Após abrir app externo, falsos reconhecimentos numéricos como “7667” são descartados por uma janela curta e nunca chegam à IA.
          - O filtro numérico só atua logo após ação externa; números falados normalmente continuam válidos fora dessa janela.
          
          
          ## Gama 3.9.5: voz, agenda e abertura de apps
          - Perguntas naturais como “tenho algum evento nos próximos dias?” passam a consultar o calendário autorizado, com janela de 7 dias.
          - “Próximo evento/compromisso” procura adiante por até duas semanas e responde o primeiro encontrado.
          - Com o aparelho desbloqueado, consultas pessoais por voz usam o estado de desbloqueio do Android; bloqueado, o Gama continua exigindo desbloqueio.
          - Aplicativos conhecidos, incluindo WhatsApp/Zap, são confirmados por voz antes da troca de app. Isso evita sumiço do TTS e falsos reconhecimentos causados pelo som da interface.
          - O launcher do WhatsApp ganhou fallback pelo pacote/Activity principal.
          - Dizer apenas “Gama” ganha um fallback de hotword por parcial estável, sem atrapalhar frases completas como “Gama, abra o zap”.
          
          
          Gama 4.3: reliability pass for hotword, floating orb, app launch and update self-healing.
          GAMA_FILE_001_END
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'GAMA_FILE_002_END'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "com.gama.assistant"
              compileSdk = 35
          
              defaultConfig {
                  applicationId = "com.gama.assistant"
                  minSdk = 26
                  targetSdk = 35
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
                  versionCode = 20261043
                  versionName = "Gama 4.4"
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          
              androidResources { noCompress += listOf("task") }
          
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          
          dependencies {
              implementation("androidx.activity:activity-ktx:1.9.3")
              testImplementation("junit:junit:4.13.2")
              implementation("com.alphacephei:vosk-android:0.3.47@aar")
              implementation("net.java.dev.jna:jna:5.13.0@aar")
              implementation("com.google.mediapipe:tasks-genai:0.10.27")
          }
          GAMA_FILE_002_END
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'GAMA_FILE_003_END'
          <?xml version="1.0" encoding="utf-8"?>
