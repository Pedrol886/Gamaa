      - name: Version and source audit
        working-directory: _gama_build
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/gama-natural-audit.py" <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(".")
          src = root / "app/src/main/java/com/gama/assistant"
          gradle_path = root / "app/build.gradle.kts"
          manifest_path = root / "app/src/main/AndroidManifest.xml"

          required_files = [
              src / "GamaService.kt",
              src / "VoicePolicy.kt",
              src / "GamaRecognitionPolicy.kt",
              src / "GamaSelfSpeechGuard.kt",
              src / "GamaEnergyView.kt",
              src / "GamaPresenceContext.kt",
              src / "GamaBatteryProactive.kt",
              src / "GamaPersonalTools.kt",
              src / "GamaSuperAssistantCore.kt",
          ]

          for file in required_files:
              if not file.is_file() or file.stat().st_size == 0:
                  raise SystemExit(f"required file missing: {file}")

          service = (src / "GamaService.kt").read_text(encoding="utf-8")
          voice = (src / "VoicePolicy.kt").read_text(encoding="utf-8")
          energy = (src / "GamaEnergyView.kt").read_text(encoding="utf-8")
          presence = (src / "GamaPresenceContext.kt").read_text(encoding="utf-8")
          battery = (src / "GamaBatteryProactive.kt").read_text(encoding="utf-8")
          super_core = (src / "GamaSuperAssistantCore.kt").read_text(encoding="utf-8")
          recognition = (src / "GamaRecognitionPolicy.kt").read_text(encoding="utf-8")
          personal_core = (src / "GamaPersonalCore.kt").read_text(encoding="utf-8")
          manifest = manifest_path.read_text(encoding="utf-8")
          gradle = gradle_path.read_text(encoding="utf-8")

          invariants = [
              ("wake latency", "wakePartialHits >= 3" in service),
              ("post TTS reopen", "ignoreAudioUntil = now + 220L" in service),
              ("arrival briefing", "GamaPresenceContext.onUserPresent" in service),
              ("battery proactive", "GamaBatteryProactive.poll" in service),
              ("backchannel", "fun isBackchannel" in voice),
              ("hard interrupt", "fun isHardInterrupt" in voice),
              ("red orb", "canvas.drawCircle" in energy and "gama_red_core" not in energy),
              ("presence core", "consumeArrivalSummary" in presence),
              ("battery core", "level <= 12" in battery),
              ("direct explicit WhatsApp", "explicitEnough" in super_core),
              ("all apps visibility", "android.permission.QUERY_ALL_PACKAGES" in manifest),
              ("duolingo query", "com.duolingo" in manifest),
              ("partial freshness guard", "0..2600L" in recognition),
              ("noise final guard", "meaningful" not in recognition),
              ("human pause floor", "Long = 3_200L" in personal_core),
              ("adaptive pause clamp", "3_000L" in personal_core and "3_800L" in personal_core),
          ]

          failed = [name for name, ok in invariants if not ok]
          if failed:
              raise SystemExit("Natural Core invariant missing: " + ", ".join(failed))

          version_code = 25_410_000 + int(os.environ["GITHUB_RUN_NUMBER"])
          gradle, code_count = re.subn(
              r"versionCode\s*=\s*\d+",
              f"versionCode = {version_code}",
              gradle,
              count=1,
          )
          gradle, name_count = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              'versionName = "Gama 10.4.1 Natural Voice Core"',
              gradle,
              count=1,
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("version update failed")

          if "isDebuggable = false" not in gradle:
              raise SystemExit("release debuggable guard missing")

          gradle_path.write_text(gradle, encoding="utf-8")
          print(f"PASS: Natural Core audit; versionCode={version_code}")
          PY

          python3 -m py_compile \
            "$GITHUB_WORKSPACE/gama-natural-audit.py"

          python3 \
            "$GITHUB_WORKSPACE/gama-natural-audit.py"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Gradle wrapper
        working-directory: _gama_build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew clean --no-daemon --stacktrace

      - name: Compile Release Kotlin
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew \
            :app:compileReleaseKotlin \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-compile.log"

      - name: Unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew \
            test \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew \
            lint \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-lint.log"

      - name: Prepare offline models
        working-directory: _gama_build
        run: |
          set -euo pipefail
          if [ -x tools/download_models.sh ]; then
            bash tools/download_models.sh
          fi

      - name: Assemble Release
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-release.log"

      - name: Sign Release APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          mkdir -p dist

          input_apk="$(
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print | head -n 1
          )"

          if [ -z "$input_apk" ] || [ ! -s "$input_apk" ]; then
            echo "::error::APK Release não encontrado após assembleRelease."
            exit 1
          fi

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          "$ZIPALIGN" -f 4 \
            "$input_apk" \
            dist/Gama-aligned.apk

          rm -f /tmp/gama-natural170.jks

          keytool \
            -genkeypair \
            -keystore /tmp/gama-natural170.jks \
            -storepass GamaNatural2026 \
            -keypass GamaNatural2026 \
            -alias gama \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Gama Natural Test,O=Gama,C=BR"

          "$APKSIGNER" sign \
            --ks /tmp/gama-natural170.jks \
            --ks-key-alias gama \
            --ks-pass pass:GamaNatural2026 \
            --key-pass pass:GamaNatural2026 \
            --out dist/Gama.apk \
            dist/Gama-aligned.apk

          rm -f dist/Gama-aligned.apk /tmp/gama-natural170.jks
          echo "fresh-install-only" > dist/install-mode.txt

      - name: Verify final APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          test -s dist/Gama.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            dist/Gama.apk \
            | tee dist/signature-info.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            dist/Gama.apk \
            > dist/apk-info.txt

          grep -q "name='com.gama.assistant'" dist/apk-info.txt
          grep -q "versionName='Gama 10.4.1 Natural Voice Core'" dist/apk-info.txt

          EXPECTED_VERSION_CODE="$((25410000 + GITHUB_RUN_NUMBER))"
          grep -q "versionCode='$EXPECTED_VERSION_CODE'" dist/apk-info.txt

          if grep -q 'application-debuggable' dist/apk-info.txt; then
            echo "::error::APK final está debuggable."
            exit 1
          fi

          (
            cd dist
            sha256sum Gama.apk > Gama.apk.sha256
            sha256sum -c Gama.apk.sha256
          )

          echo "PASS: _gama_build/dist/Gama.apk criado, assinado e verificado."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.4.1-NATURAL170-FRESH-INSTALL-ONLY
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.4.1-NATURAL170-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.4.1-NATURAL170-diagnostics-${{ github.run_number }}
          path: |
            gama-natural-audit.py
            gama-natural.patch
            gama-compile.log
            gama-tests.log
            gama-lint.log
            gama-release.log
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: warn

      - name: Publish APK in Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="gama-v10.4.1-natural-${{ github.run_number }}"

          gh release create \
            "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            "_gama_build/dist/install-mode.txt#install-mode.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 10.4.1 Natural Voice Core" \
            --notes "Build baseado diretamente no SAFE168 verde. Inclui Natural Voice Core e corrige os 3 testes do #169: janela de partial de 2,6 s, bloqueio de ruído sem evidência de voz e pausa semântica de 3,2 s para frases incompletas. Mantém orbe vermelho, apps instalados, WhatsApp, modo ausência/retorno, resumo ao desbloquear e alerta de bateria baixa." \
            --latest
