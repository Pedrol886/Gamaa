          2n/69NNA/CnwJ7Kx5x7tSpzP3zz5/wuHpnjeOQwAAA==
          GAMA581SIGN_STEP
            base64 --decode /tmp/gama581sign.sh.gz.b64 | gzip -dc > /tmp/gama581sign.sh
            bash /tmp/gama581sign.sh
            printf '%s\n' 'stable' > dist/install-mode.txt
            echo "install_mode=stable" >> "$GITHUB_OUTPUT"
          else
            input_apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
            test -s "$input_apk"
            cp "$input_apk" dist/Gama.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Gama.apk | tee dist/signature-info.txt
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Gama.apk > dist/apk-info.txt
            grep -m1 '^package:' dist/apk-info.txt
            grep -q "versionCode='2028" dist/apk-info.txt
            grep -q "versionName='Gama 5.9'" dist/apk-info.txt
            printf '%s\n' 'FRESH INSTALL ONLY - configure GAMA_SIGNING_SEED for reliable future updates.' > dist/install-mode.txt
            printf '%s\n' 'debug-runner-signature' > dist/signing-cert-sha256.txt
            (cd dist && sha256sum Gama.apk > Gama.apk.sha256)
            echo "install_mode=fresh" >> "$GITHUB_OUTPUT"
            echo "::warning::APK gerado em modo instalação limpa. Desinstale a instalação anterior antes de instalar este APK."
          fi

      - name: Verify final APK metadata
        working-directory: _gama_build
        run: |
          set -euo pipefail
          test -s dist/Gama.apk
          test -s dist/Gama.apk.sha256
          test -s dist/apk-info.txt
          test -s dist/install-mode.txt
          grep -q "name='com.gama.assistant'" dist/apk-info.txt
          grep -q "versionCode='2028" dist/apk-info.txt
          grep -q "versionName='Gama 5.9'" dist/apk-info.txt
          (cd dist && sha256sum -c Gama.apk.sha256)
          echo "Install mode: $(cat dist/install-mode.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify distribution bundle consistency
        working-directory: _gama_build
        run: |
          set -euo pipefail
          test -d dist
          test -s dist/Gama.apk
          test -s dist/Gama.apk.sha256
          test -s dist/apk-info.txt
          test -s dist/install-mode.txt
          test -s dist/signing-cert-sha256.txt
          apk_bytes="$(wc -c < dist/Gama.apk)"
          test "$apk_bytes" -gt 1000000
          expected_hash="$(awk '{print $1}' dist/Gama.apk.sha256)"
          actual_hash="$(sha256sum dist/Gama.apk | awk '{print $1}')"
          test -n "$expected_hash"
          test "$expected_hash" = "$actual_hash"
          install_mode="$(cat dist/install-mode.txt)"
          test -n "$install_mode"
          echo "APK bytes: $apk_bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "APK SHA-256: $actual_hash" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundle mode: $install_mode" >> "$GITHUB_STEP_SUMMARY"
          echo "Distribuição final validada antes do upload."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing_mode.outputs.artifact }}
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/signing-cert-sha256.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-tests
          path: _gama_build/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Publish Gama release
        env:
          GH_TOKEN: ${{ github.token }}
          GAMA_TAG: gama-${{ github.run_number }}
          GAMA_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > /tmp/gama-release.md <<'NOTES'
          Gama 5.9 preserva todas as correções anteriores. O APK informa se foi assinado em modo stable ou fresh-install-only.
          NOTES

          if gh release view "$GAMA_TAG" > /dev/null 2>&1; then
            gh release upload "$GAMA_TAG" \
              _gama_build/dist/Gama.apk \
              _gama_build/dist/Gama.apk.sha256 \
              _gama_build/dist/install-mode.txt \
              --clobber
          else
            gh release create "$GAMA_TAG" \
              _gama_build/dist/Gama.apk \
              _gama_build/dist/Gama.apk.sha256 \
              _gama_build/dist/install-mode.txt \
              --target "$GAMA_COMMIT" \
              --title "Gama 5.9 (${GAMA_TAG})" \
              --notes-file /tmp/gama-release.md
          fi
























































































































































































































































































































































































































































































































































































































































