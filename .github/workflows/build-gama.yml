      - name: Sign and verify APK
        env:
          GAMA_KEYSTORE_B64: ${{ secrets.GAMA_KEYSTORE_B64 }}
          GAMA_KEYSTORE_PASSWORD: ${{ secrets.GAMA_KEYSTORE_PASSWORD }}
          GAMA_KEY_ALIAS: ${{ secrets.GAMA_KEY_ALIAS }}
          GAMA_KEY_PASSWORD: ${{ secrets.GAMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          INPUT_APK="$(find _gama_build/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$INPUT_APK" ] || [ ! -s "$INPUT_APK" ]; then echo '::error::Release APK missing'; exit 1; fi
          mkdir -p _gama_build/dist
          "$BT/zipalign" -f -p 4 "$INPUT_APK" _gama_build/dist/Gama-aligned.apk
          if [ -n "${GAMA_KEYSTORE_B64:-}" ] && [ -n "${GAMA_KEYSTORE_PASSWORD:-}" ] && [ -n "${GAMA_KEY_ALIAS:-}" ] && [ -n "${GAMA_KEY_PASSWORD:-}" ]; then
            echo "$GAMA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gama.jks"
            KS="$RUNNER_TEMP/gama.jks"; SP="$GAMA_KEYSTORE_PASSWORD"; KA="$GAMA_KEY_ALIAS"; KP="$GAMA_KEY_PASSWORD"
            echo stable-update-capable > _gama_build/dist/install-mode.txt
          else
            KS="$RUNNER_TEMP/gama-test.jks"; SP=gama-test-pass; KA=gama-test; KP=gama-test-pass
            keytool -genkeypair -keystore "$KS" -storepass "$SP" -keypass "$KP" -alias "$KA" -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=Gama Test,O=Gama,C=BR' -noprompt
            echo fresh-install-only > _gama_build/dist/install-mode.txt
          fi
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$SP" --ks-key-alias "$KA" --key-pass "pass:$KP" --out _gama_build/dist/Gama.apk _gama_build/dist/Gama-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs _gama_build/dist/Gama.apk | tee _gama_build/dist/signature-info.txt
          test -s _gama_build/dist/Gama.apk
          test "$(stat -c%s _gama_build/dist/Gama.apk)" -ge 350000000
          unzip -l _gama_build/dist/Gama.apk > _gama_build/dist/apk-files.txt
          grep -Fq 'assets/llm/Qwen3-0.6B-int4.litertlm' _gama_build/dist/apk-files.txt
          grep -Fq 'classes.dex' _gama_build/dist/apk-files.txt
          "$BT/aapt" dump badging _gama_build/dist/Gama.apk > _gama_build/dist/apk-info.txt
          grep -Fq "name='com.gama.assistant'" _gama_build/dist/apk-info.txt
          grep -Fq "versionName='Gama 13.7 RED CORE FIX204'" _gama_build/dist/apk-info.txt
          (cd _gama_build/dist && sha256sum Gama.apk > Gama.apk.sha256 && sha256sum -c Gama.apk.sha256)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-13.6-FIX203-RED-CORE-LEARNING-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-FIX203-diagnostics
          path: |
            gama201-tests.log
            gama201-release.log
            _gama_build/app/build/reports/
            _gama_build/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
