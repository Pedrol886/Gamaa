      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.3.0-PERSONAL-ANDROID-CORE-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Upload engineering reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.3.0-engineering-reports
          path: |
            _gama_build/reports/**
            gama-compile.log
            gama-tests.log
            gama-lint.log
            gama-release.log
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: warn

      - name: Publish Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test -s _gama_build/dist/Gama.apk

          TAG="gama-v10.3.0-personal-android-core-${{ github.run_number }}"

          gh release create \
            "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            "_gama_build/dist/install-mode.txt#install-mode.txt" \
            "_gama_build/reports/GAMA-10.3.0-PERSONAL-ANDROID-CORE.md#GAMA-10.3.0-PERSONAL-ANDROID-CORE.md" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 10.3.0 Personal Android Core" \
            --notes "Nova geração própria do GAMA, construída sobre a base verde do run #156. Foco em conversa contínua, tarefas persistentes, WhatsApp em múltiplos turnos, ações Android determinísticas, contexto temporal, notificações semânticas, timer, sites, Accessibility e recuperação pós-bloqueio." \
            --latest
