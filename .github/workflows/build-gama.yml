                                  MainActivity::class.java
                              ),
                              PendingIntent
                                  .FLAG_IMMUTABLE or
                                  PendingIntent
                                      .FLAG_UPDATE_CURRENT
                          )

                  val builder =
                      if (
                          Build.VERSION.SDK_INT >=
                          26
                      ) {
                          Notification.Builder(
                              this,
                              CH
                          )
                      } else {
                          Notification.Builder(
                              this
                          )
                      }

                  return builder
                      .setSmallIcon(
                          android.R.drawable
                              .ic_btn_speak_now
                      )
                      .setContentTitle(
                          "Gama"
                      )
                      .setContentText(
                          text
                      )
                      .setContentIntent(
                          pendingIntent
                      )
                      .setOngoing(
                          true
                      )
                      .build()
              }

