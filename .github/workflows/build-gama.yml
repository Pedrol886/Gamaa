      - name: Audit Gama 9 architecture
        working-directory: _gama_build
        run: |
          set -euo pipefail
          SRC="app/src/main/java/com/gama/assistant"
          TEST="app/src/test/java/com/gama/assistant"

          test -s "$SRC/GamaSupervisor.kt"
          test -s "$SRC/GamaAppRegistry.kt"
          test -s "$TEST/GamaSupervisorTest.kt"
          test -s "$TEST/GamaAppRegistryTest.kt"

          grep -Fq 'GAMA900_SUPERVISOR_SLEEP' "$SRC/GamaService.kt"
          grep -Fq 'GamaSupervisor.acceptWake' "$SRC/GamaService.kt"
          grep -Fq 'GamaSupervisor.acceptGoodbye' "$SRC/GamaService.kt"
          grep -Fq 'openKnownAppFastLane' "$SRC/GamaService.kt"
          grep -Fq 'Opening WhatsApp never enters the WhatsApp messaging parser' "$SRC/GamaService.kt"
          grep -Fq 'gama_proactive_dedupe' "$SRC/GamaNotificationListener.kt"
          grep -Fq 'currentPackageName' "$SRC/GamaScreenContextService.kt"
          grep -Fq 'preciso descansar amanhã' "$TEST/ConversationSessionTest.kt"
          grep -Fq 'whatsappAliasesResolveToOneCanonicalApp' "$TEST/GamaAppRegistryTest.kt"

          if grep -Fq 'c in setOf("descansa", "descansar", "descanca", "descance")' "$SRC/ConversationSession.kt"; then
            echo "::error::Unsafe fuzzy rest shortcut survived the patch."
            exit 1
          fi

          python3 tools/audit_gama.py | tee "$GITHUB_WORKSPACE/gama-audit.log"
          echo "Gama 9 architecture audit passed."

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Gama 9.0.0 version
        working-directory: _gama_build
        run: |
          set -euo pipefail
          VC=$((24000000 + GITHUB_RUN_NUMBER))
          sed -Ei "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $VC/" app/build.gradle.kts
          sed -Ei 's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "Gama 9.0.0"/' app/build.gradle.kts
          grep -F 'versionName = "Gama 9.0.0"' app/build.gradle.kts

      - name: Compile Gama before tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-compile.log"

      - name: Run all Gama unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Build and verify Gama 9 APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"

          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" dist/Gama.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Gama.apk
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)
          test -s dist/Gama.apk.sha256

          echo "Gama 9 APK built and verified."

      - name: Upload Gama 9 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-9.0.0-JARVIS-SUPERVISOR-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Upload Gama 9 source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-9.0.0-JARVIS-SUPERVISOR-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Publish Gama 9 release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="gama-v9.0.0-supervisor-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 9.0.0 JARVIS Supervisor" \
            --notes "Baseado no source aprovado do build #127. Corrige o erro do #128, cria Supervisor central, bloqueia falso hotword e falso descanso, mantém silêncio em espera, evita falar notificações velhas ou repetidas e abre WhatsApp/Spotify/Instagram/YouTube/TikTok/Play Store por registro determinístico antes da IA. Mantém Gemma local, conversa contínua, planejamento multi-etapas, memória, tela/OCR, agenda, pesquisa atual, automações e barge-in." \
            --latest

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-9.0.0-JARVIS-SUPERVISOR-diagnostics
          path: |
            gama-audit.log
            gama-compile.log
            gama-tests.log
            gama-build.log
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn
