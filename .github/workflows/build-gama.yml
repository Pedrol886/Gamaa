name: Audit Exact Gama 9.3.0 Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-source-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GAMA_BASE_RUN_ID: "37158343882"
      GAMA_BASE_ARTIFACT: "Gama-9.3.0-JARVIS-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact successful Gama 9.3.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_audit audit-source
          mkdir -p _gama_audit audit-source

          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_audit

          test -s _gama_audit/app/build.gradle.kts
          test -s _gama_audit/app/src/main/AndroidManifest.xml
          test -s _gama_audit/app/src/main/java/com/gama/assistant/GamaService.kt

          grep -Fq \
            'Gama 9.3.0 JARVIS Reliability' \
            _gama_audit/app/build.gradle.kts

          echo "Exact build #136 source restored."

      - name: Audit architecture and extract textual source
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil

          root = Path("_gama_audit")
          out = Path("audit-source")
          out.mkdir(parents=True, exist_ok=True)

          allowed = {
              ".kt",
              ".kts",
              ".xml",
              ".gradle",
              ".properties",
              ".py",
              ".sh",
              ".md",
              ".txt",
          }

          copied = []

          for p in root.rglob("*"):
              if not p.is_file():
                  continue

              if p.suffix.lower() not in allowed:
                  continue

              if any(
                  part in {".gradle", ".git", "build"}
                  for part in p.parts
              ):
                  continue

              rel = p.relative_to(root)
              dest = out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(p, dest)
              copied.append(str(rel))

          kotlin = list(root.rglob("*.kt"))

          contents = {}

          for p in kotlin:
              try:
                  contents[p] = p.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )
              except Exception:
                  contents[p] = ""

          corpus = "\n".join(contents.values())

          def files_with(pattern):
              regex = re.compile(pattern)
              return sorted(
                  str(p.relative_to(root))
                  for p, text in contents.items()
                  if regex.search(text)
              )

          metrics = {
              "kotlin_files": len(kotlin),

              "recognition_listener_mentions":
                  corpus.count("RecognitionListener"),

              "on_partial_result":
                  corpus.count("onPartialResult"),

              "on_result":
                  corpus.count("onResult"),

              "on_final_result":
                  corpus.count("onFinalResult"),

              "speech_service_mentions":
                  corpus.count("SpeechService"),

              "audio_record_mentions":
                  corpus.count("AudioRecord"),

              "tts_speak_mentions":
                  corpus.count(".speak("),

              "coroutine_scope_mentions":
                  corpus.count("CoroutineScope"),

              "job_mentions":
                  len(re.findall(r"\bJob\b", corpus)),

              "handler_mentions":
                  len(re.findall(r"\bHandler\b", corpus)),

              "delay_calls":
                  len(re.findall(r"\bdelay\s*\(", corpus)),

              "thread_sleep_calls":
                  len(re.findall(r"Thread\.sleep\s*\(", corpus)),

              "with_timeout_calls":
                  len(re.findall(r"withTimeout", corpus)),

              "aec_mentions":
                  corpus.count("AcousticEchoCanceler"),

              "audio_effect_ns_mentions":
                  corpus.count("NoiseSuppressor"),

              "gama_supervisor":
                  "GamaSupervisor" in corpus,

              "intent_engine":
                  "GamaIntentEngine" in corpus,

              "tool_registry":
                  "GamaToolRegistry" in corpus,

              "action_verifier":
                  "GamaActionVerifier" in corpus,

              "conversation_session":
                  "ConversationSession" in corpus,

              "continuity_memory":
                  "GamaContinuityMemory" in corpus,

              "reference_memory":
                  "GamaReferenceMemory" in corpus,

              "screen_memory":
                  "GamaScreenMemory" in corpus,

              "reliable_launcher":
                  "GamaReliableAppLauncher" in corpus,

              "launch_fallback":
                  "GamaLaunchFallback" in corpus,

              "local_brain_mentions":
                  corpus.count("LocalBrain"),

              "request_id_mentions":
                  len(re.findall(
                      r"\brequestId\b",
                      corpus,
                  )),

              "tts_files":
                  files_with(
                      r"TextToSpeech|\.speak\("
                  ),

              "recognition_files":
                  files_with(
                      r"RecognitionListener|"
                      r"onPartialResult|"
                      r"SpeechService"
                  ),

              "audio_files":
                  files_with(
                      r"AudioRecord|"
                      r"AcousticEchoCanceler|"
                      r"NoiseSuppressor"
                  ),

              "brain_files":
                  files_with(
                      r"Gemma|"
                      r"LocalBrain|"
                      r"generateResponse|"
                      r"generateAsync"
                  ),

              "launcher_files":
                  files_with(
                      r"LaunchIntent|"
                      r"LauncherApps|"
                      r"com\.whatsapp"
                  ),

              "state_files":
                  files_with(
                      r"GamaSupervisor|"
                      r"State|"
                      r"SLEEPING|"
                      r"LISTENING|"
                      r"THINKING"
                  ),
          }

          manifest_path = (
              root /
              "app/src/main/AndroidManifest.xml"
          )

          manifest = manifest_path.read_text(
              encoding="utf-8",
              errors="replace",
          )

          build_path = root / "app/build.gradle.kts"

          build = build_path.read_text(
              encoding="utf-8",
              errors="replace",
          )

          checks = {
              "debuggable_true":
                  'android:debuggable="true"' in manifest,

              "whatsapp_query":
                  "com.whatsapp" in manifest,

              "whatsapp_business_query":
                  "com.whatsapp.w4b" in manifest,

              "debug_build_type":
                  "debug {" in build,

              "release_build_type":
                  "release {" in build,

              "minify_enabled":
                  "isMinifyEnabled = true" in build,
          }

          report = [
              "# GAMA 9.3.0 EXACT SOURCE AUDIT",
              "",
              "Source:",
              "GitHub Actions run #136",
              "Gama-9.3.0-JARVIS-source",
              "",
              "No application source was modified by this audit.",
              "",
              "## Metrics",
              "",
          ]

          for key, value in metrics.items():
              report.append(
                  f"- {key}: {value}"
              )

          report += [
              "",
              "## Build / Manifest",
              "",
          ]

          for key, value in checks.items():
              report.append(
                  f"- {key}: {value}"
              )

          report += [
              "",
              "## Copied source files",
              "",
          ]

          for name in sorted(copied):
              report.append(f"- {name}")

          (out / "ARCHITECTURE_AUDIT.md").write_text(
              "\n".join(report) + "\n",
              encoding="utf-8",
          )

          (out / "architecture-metrics.json").write_text(
              json.dumps(
                  {
                      "metrics": metrics,
                      "checks": checks,
                  },
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          print(
              "Audit complete:",
              len(copied),
              "text source files copied.",
          )
          PY

      - name: Publish exact textual source to audit branch
        run: |
          set -euo pipefail

          git config \
            user.name \
            "Gama Architecture Audit"

          git config \
            user.email \
            "gama-audit@users.noreply.github.com"

          git checkout \
            --orphan \
            gama-source-audit-work

          git rm -rf . \
            >/dev/null 2>&1 || :

          cp -a audit-source/. .

          rm -rf \
            audit-source \
            _gama_audit

          git add -A

          git commit \
            -m \
            "Gama 9.3.0 exact source architecture audit"

          git push \
            --force \
            origin \
            HEAD:refs/heads/gama-source-audit

      - name: Done
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GAMA 9.3.0 SOURCE AUDIT COMPLETE"
          echo "========================================"
          echo
          echo "Branch:"
          echo "gama-source-audit"
          echo
          echo "No GAMA application code was modified."
