      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Gama FIX111 version
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import os, re
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          code = 21500000 + int(os.environ['GITHUB_RUN_NUMBER'])
          s, n1 = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {code}', s, count=1)
          s, n2 = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "Gama JARVIS HOTWORD FIX111"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'version metadata patch failed: code={n1} name={n2}')
          p.write_text(s, encoding='utf-8')
          print(f'versionCode={code}')
          PY_VERSION

      - name: Download and verify offline models
        working-directory: _gama_build
        run: |
          set -euo pipefail
          bash tools/download_models.sh

      - name: Compile Gama FIX111 APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"

      - name: Finalize Gama APK immediately
        working-directory: _gama_build
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" dist/Gama.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Gama.apk
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)
          bytes="$(wc -c < dist/Gama.apk)"
          test "$bytes" -gt 1000000
          echo "## Gama JARVIS HOTWORD FIX111" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK bytes: $bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dedicated always-on hotword recognizer: enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Continuous raw-audio wake detection: enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- Voice watchdog can recover from text-mode/deaf state: enabled" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gama FIX111 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-JARVIS-HOTWORD-FIX111-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Publish Gama FIX111 release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="gama-hotword-fix111-$GITHUB_RUN_NUMBER"
          gh release create "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            --title "Gama JARVIS HOTWORD FIX111" \
            --notes "Gama FIX111: dedicated always-on Vosk hotword recognizer for Gama, continuous raw-audio wake detection while idle, full-decoder fallback when constrained grammar is unavailable, and a self-healing microphone watchdog that restarts voice even if the service falls back into text mode. Preserves FIX110 JARVIS continuity, lockscreen recovery, universal app opening, messaging, calendar, owner face profile and proactive context."

      - name: Upload FIX111 source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-JARVIS-HOTWORD-FIX111-source
          path: |
            _gama_build/app/src
            _gama_build/app/build.gradle.kts
            _gama_build/settings.gradle.kts
            _gama_build/build.gradle.kts
            _gama_build/gradle.properties
            _gama_build/tools
          if-no-files-found: warn

      - name: Run voice regression tests
        continue-on-error: true
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests "com.gama.assistant.VoicePolicyTest" \
            --tests "com.gama.assistant.ZevronConversationEngineTest" \
            --tests "com.gama.assistant.ConversationSessionTest" \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-critical-tests.log"

      - name: Run full unit-test suite
        continue-on-error: true
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --rerun-tasks \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-JARVIS-HOTWORD-FIX111-diagnostics
          path: |
            gama-build.log
            gama-critical-tests.log
            gama-tests.log
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
