name: Build Gama 13.0 FIX197 COMPLETE APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: gama-13-0-fix197-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    env:
      GAMA_BASE_RUN_ID: "37609751648"
      GAMA_BASE_ARTIFACT: "Gama-12.1-LOCAL-VOICE-FIX187-source"

      # Run #189 contém o patch funcional completo do FIX193.
      GAMA_FIX193_COMMIT: "5602684eca7dd692f32be3c3d6a9e28e3d5d4b33"

      GAMA_MODEL_URL: "https://huggingface.co/litert-community/Qwen3-0.6B-int4/resolve/main/qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm?download=true"
      GAMA_MODEL_SHA256: "2df6821ec12702dafd33915e7a1a1adc7c4b053f3672fd9555dfaf3a114c4139"
      GAMA_MODEL_SIZE: "347251840"

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # RESTAURAR BASE QUE JÁ COMPILOU
      # ============================================================

      - name: Restore proven FIX187 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -f _gama_build/gradlew
          chmod +x _gama_build/gradlew

          test -s _gama_build/settings.gradle.kts
          test -s _gama_build/build.gradle.kts
          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml

          test -s \
            _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt

          test -s \
            _gama_build/app/src/main/java/com/gama/assistant/GamaLocalLlm.kt

          test -s \
            _gama_build/app/src/main/java/com/gama/assistant/GamaOnlineRouter.kt

          test -s \
            _gama_build/app/src/main/assets/model/final.mdl

          test -s \
            _gama_build/app/src/main/assets/model/Gr.fst

          test -s \
            _gama_build/app/src/main/assets/spk-model/final.ext.raw

          echo "Base FIX187 restaurada."

      # ============================================================
      # RECUPERAR FIX193 COMPLETO
      # ============================================================

      - name: Recover complete FIX193 workflow
        run: |
          set -euo pipefail

          git cat-file -e \
            "$GAMA_FIX193_COMMIT^{commit}"

          git show \
            "$GAMA_FIX193_COMMIT:.github/workflows/build-gama.yml" \
            > "$RUNNER_TEMP/fix193-complete.yml"

          test -s \
            "$RUNNER_TEMP/fix193-complete.yml"

          FIX193_LINES="$(
            wc -l \
              < "$RUNNER_TEMP/fix193-complete.yml"
          )"

          echo "FIX193 histórico: $FIX193_LINES linhas"

          if [ "$FIX193_LINES" -lt 1100 ]; then
            echo "::error::Workflow histórico FIX193 está incompleto."
            exit 1
          fi

          grep -Fq \
            'GAMA193_PATCH' \
            "$RUNNER_TEMP/fix193-complete.yml"

      - name: Extract complete FIX193 patch
        run: |
          set -euo pipefail

          python3 - <<'PY_FIX193'
          from pathlib import Path
          import os
          import textwrap

          source = (
              Path(os.environ["RUNNER_TEMP"])
              / "fix193-complete.yml"
          )

          text = source.read_text(
              encoding="utf-8"
          )

          lines = text.splitlines()

          start = None
          end = None

          for index, line in enumerate(lines):
              if (
                  'cat > "$RUNNER_TEMP/gama193.patch"'
                  in line
                  and
                  "GAMA193_PATCH"
                  in line
              ):
                  start = index + 1
                  break

          if start is None:
              raise SystemExit(
                  "Início do patch FIX193 não encontrado."
              )

          for index in range(start, len(lines)):
              if lines[index].strip() == "GAMA193_PATCH":
                  end = index
                  break

          if end is None:
              raise SystemExit(
                  "Final do patch FIX193 não encontrado."
              )

          patch = textwrap.dedent(
              "\n".join(lines[start:end])
          ).rstrip() + "\n"

          required = [
              "GamaService.kt",
              "LocalBrain.kt",
              "GamaLocalLlm.kt",
              "SemanticEndpointer.kt",
              "GamaInstalledAppCatalog.kt",
              "GamaReliableAppLauncher.kt",
              "GamaOnlineRouter.kt",
              "GamaInternetHub.kt",
              "GamaKnowledgePolicy.kt",
              "tryHandleRawBatteryBeforeContext",
              "tryHandleRawAppBeforeContext",
              "tryHandleRawOnlineBeforeContext",
              "Intent.makeMainActivity",
              "MATCH_ALL",
              "com.netflix.mediaclient",
              "com.duolingo",
              "www.bing.com/search?format=rss",
          ]

          missing = [
              item
              for item in required
              if item not in patch
          ]

          if missing:
              raise SystemExit(
                  "Patch FIX193 incompleto: "
                  + ", ".join(missing)
              )

          output = Path("/tmp/gama193.patch")

          output.write_text(
              patch,
              encoding="utf-8",
          )

          print(
              "Patch FIX193:",
              len(patch.splitlines()),
              "linhas",
          )
          PY_FIX193

          test -s /tmp/gama193.patch

      # ============================================================
      # APLICAR CORREÇÕES DE VOZ, APPS, BATERIA E PESQUISA
      # ============================================================

      - name: Apply complete FIX193
        working-directory: _gama_build
        run: |
          set -euo pipefail

          patch \
            -p1 \
            --forward \
            --batch \
            < /tmp/gama193.patch

          SERVICE="app/src/main/java/com/gama/assistant/GamaService.kt"
          LAUNCHER="app/src/main/java/com/gama/assistant/GamaReliableAppLauncher.kt"
          CATALOG="app/src/main/java/com/gama/assistant/GamaInstalledAppCatalog.kt"
          ONLINE="app/src/main/java/com/gama/assistant/GamaOnlineRouter.kt"
          INTERNET="app/src/main/java/com/gama/assistant/GamaInternetHub.kt"
          BRAIN="app/src/main/java/com/gama/assistant/LocalBrain.kt"
          LLM="app/src/main/java/com/gama/assistant/GamaLocalLlm.kt"
          ENDPOINTER="app/src/main/java/com/gama/assistant/SemanticEndpointer.kt"

          test -s "$SERVICE"
          test -s "$LAUNCHER"
          test -s "$CATALOG"
          test -s "$ONLINE"
          test -s "$INTERNET"
          test -s "$BRAIN"
          test -s "$LLM"
          test -s "$ENDPOINTER"

          grep -Fq \
            'tryHandleRawBatteryBeforeContext(command)' \
            "$SERVICE"

          grep -Fq \
            'tryHandleRawAppBeforeContext(command)' \
            "$SERVICE"

          grep -Fq \
            'tryHandleRawOnlineBeforeContext(command)' \
            "$SERVICE"

          grep -Fq \
            'ACTION_BATTERY_CHANGED' \
            "$SERVICE"

          grep -Fq \
            'Intent.makeMainActivity' \
            "$LAUNCHER"

          grep -Fq \
            'MATCH_ALL' \
            "$LAUNCHER"

          if grep -Fq \
            'MATCH_DEFAULT_ONLY' \
            "$LAUNCHER"; then
            echo "::error::Launcher antigo MATCH_DEFAULT_ONLY encontrado."
            exit 1
          fi

          grep -Fq \
            'resolveBareName' \
            "$CATALOG"

          grep -Fq \
            'com.netflix.mediaclient' \
            "$CATALOG"

          grep -Fq \
            'com.duolingo' \
            "$CATALOG"

          grep -Fq \
            'pesquise' \
            "$ONLINE"

          grep -Fq \
            'procure' \
            "$ONLINE"

          grep -Fq \
            'busque' \
            "$ONLINE"

          grep -Fq \
            'www.bing.com/search?format=rss' \
            "$INTERNET"

          grep -Fq \
            'answerFresh(question: String)' \
            "$LLM"

          grep -Fq \
            '1_000L' \
            "$ENDPOINTER"

          grep -Fq \
            '2_200L' \
            "$ENDPOINTER"

          echo "FIX193 aplicado."

      # ============================================================
      # FIX197
      #
      # O teste do #192 falhou porque classify() recebia:
      # "gama pesquise na internet..."
      #
      # Mas o roteador verificava startsWith("pesquise").
      #
      # Agora a wake word é removida ANTES da classificação.
      # ============================================================

      - name: Apply FIX197 wake word research repair
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY_FIX197'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/gama/assistant/GamaOnlineRouter.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          function_marker = (
              "fun classify(raw: String): Mode {"
          )

          start = text.find(function_marker)

          if start < 0:
              raise SystemExit(
                  "GamaOnlineRouter.classify não encontrado."
              )

          old = "val c = normalize(raw)"

          position = text.find(
              old,
              start,
          )

          if (
              position < 0
              or
              position > start + 500
          ):
              raise SystemExit(
                  "Linha de normalização do classify não encontrada."
              )

          replacement = (
              'val c = normalize(raw)'
              '.removePrefix("gama ")'
              '.trim()'
          )

          text = (
              text[:position]
              + replacement
              + text[position + len(old):]
          )

          path.write_text(
              text,
              encoding="utf-8",
          )

          print(
              "FIX197 aplicado ao GamaOnlineRouter."
          )
          PY_FIX197

          ONLINE="app/src/main/java/com/gama/assistant/GamaOnlineRouter.kt"

          grep -Fq \
            'normalize(raw).removePrefix("gama ").trim()' \
            "$ONLINE"

          # O teste que falhou no #192 deve continuar existindo.
          TESTFILE="app/src/test/java/com/gama/assistant/GamaOnlineRouterTest.kt"

          test -s "$TESTFILE"

          grep -Fq \
            'researchGoesOnline' \
            "$TESTFILE"

          grep -Fq \
            'Gama, pesquise na internet sobre computação quântica' \
            "$TESTFILE"

          echo "FIX197 verificado."

      # ============================================================
      # VERSÃO
      # ============================================================

      - name: Configure FIX197 version
        run: |
          set -euo pipefail

          python3 - <<'PY_VERSION'
          from pathlib import Path
          import os
          import re

          path = Path(
              "_gama_build/app/build.gradle.kts"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          version_code = (
              37_000_000
              + int(
                  os.environ[
                      "GITHUB_RUN_NUMBER"
                  ]
              )
          )

          text, code_count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {version_code}',
              text,
              count=1,
          )

          text, name_count = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              'versionName = "Gama 13.0 Core FIX197"',
              text,
              count=1,
          )

          if (
              code_count != 1
              or
              name_count != 1
          ):
              raise SystemExit(
                  "Falha ao configurar versão FIX197."
              )

          path.write_text(
              text,
              encoding="utf-8",
          )

          print(
              "versionCode:",
              version_code,
          )
          PY_VERSION

          grep -Fq \
            'versionName = "Gama 13.0 Core FIX197"' \
            _gama_build/app/build.gradle.kts

      # ============================================================
      # MODELO LOCAL
      # ============================================================

      - name: Bundle local Qwen model
        run: |
          set -euo pipefail

          MODEL_DIR="$GITHUB_WORKSPACE/_gama_build/app/src/main/assets/llm"
          MODEL="$MODEL_DIR/Qwen3-0.6B-int4.litertlm"

          mkdir -p "$MODEL_DIR"
          rm -f "$MODEL"

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            --output "$MODEL" \
            "$GAMA_MODEL_URL"

          test -s "$MODEL"

          ACTUAL_SIZE="$(
            stat -c%s "$MODEL"
          )"

          echo "Qwen: $ACTUAL_SIZE bytes"

          if [ "$ACTUAL_SIZE" != "$GAMA_MODEL_SIZE" ]; then
            echo "::error::Modelo Qwen incompleto."
            echo "Esperado: $GAMA_MODEL_SIZE"
            echo "Recebido: $ACTUAL_SIZE"
            exit 1
          fi

          echo \
            "$GAMA_MODEL_SHA256  $MODEL" \
            | sha256sum -c -

      # ============================================================
      # AUDITORIA
      # ============================================================

      - name: Architecture audit
        run: |
          set -euo pipefail

          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import os

          root = Path("_gama_build")

          src = (
              root
              / "app/src/main/java/com/gama/assistant"
          )

          service = (
              src / "GamaService.kt"
          ).read_text(
              encoding="utf-8"
          )

          launcher = (
              src / "GamaReliableAppLauncher.kt"
          ).read_text(
              encoding="utf-8"
          )

          catalog = (
              src / "GamaInstalledAppCatalog.kt"
          ).read_text(
              encoding="utf-8"
          )

          online = (
              src / "GamaOnlineRouter.kt"
          ).read_text(
              encoding="utf-8"
          )

          internet = (
              src / "GamaInternetHub.kt"
          ).read_text(
              encoding="utf-8"
          )

          brain = (
              src / "LocalBrain.kt"
          ).read_text(
              encoding="utf-8"
          )

          llm = (
              src / "GamaLocalLlm.kt"
          ).read_text(
              encoding="utf-8"
          )

          manifest = (
              root
              / "app/src/main/AndroidManifest.xml"
          ).read_text(
              encoding="utf-8"
          )

          gradle = (
              root
              / "app/build.gradle.kts"
          ).read_text(
              encoding="utf-8"
          )

          model = (
              root
              / "app/src/main/assets/llm/Qwen3-0.6B-int4.litertlm"
          )

          checks = {
              "versão FIX197":
                  "Gama 13.0 Core FIX197"
                  in gradle,

              "Qwen local":
                  model.is_file()
                  and
                  model.stat().st_size
                  ==
                  int(
                      os.environ[
                          "GAMA_MODEL_SIZE"
                      ]
                  ),

              "bateria":
                  "tryHandleRawBatteryBeforeContext(command)"
                  in service
                  and
                  "ACTION_BATTERY_CHANGED"
                  in service,

              "apps":
                  "tryHandleRawAppBeforeContext(command)"
                  in service
                  and
                  "resolveBareName"
                  in catalog,

              "launcher Android":
                  "Intent.makeMainActivity"
                  in launcher
                  and
                  "MATCH_ALL"
                  in launcher
                  and
                  "MATCH_DEFAULT_ONLY"
                  not in launcher,

              "pesquisa antes da IA":
                  "tryHandleRawOnlineBeforeContext(command)"
                  in service,

              "wake word pesquisa":
                  'normalize(raw).removePrefix("gama ").trim()'
                  in online,

              "verbos pesquisa":
                  all(
                      word in online
                      for word in (
                          "pesquise",
                          "procure",
                          "busque",
                      )
                  ),

              "DuckDuckGo":
                  "html.duckduckgo.com"
                  in internet,

              "Bing RSS":
                  "www.bing.com/search?format=rss"
                  in internet,

              "conversa":
                  "answerFresh(question: String)"
                  in llm
                  and
                  "usableModelAnswer"
                  in brain,

              "visibilidade apps":
                  "<queries>"
                  in manifest
                  and
                  "android.intent.category.LAUNCHER"
                  in manifest,
          }

          failed = [
              name
              for name, ok
              in checks.items()
              if not ok
          ]

          if failed:
              raise SystemExit(
                  "Auditoria falhou: "
                  + ", ".join(failed)
              )

          kotlin_files = list(
              src.glob("*.kt")
          )

          kotlin_lines = sum(
              len(
                  path.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  ).splitlines()
              )
              for path in kotlin_files
          )

          print(
              "Kotlin files:",
              len(kotlin_files),
          )

          print(
              "Kotlin lines:",
              kotlin_lines,
          )

          if len(kotlin_files) < 125:
              raise SystemExit(
                  "Arquivos Kotlin abaixo do esperado."
              )

          if kotlin_lines < 28500:
              raise SystemExit(
                  "Código Kotlin incompleto."
              )

          print(
              "Architecture audit PASS."
          )
          PY_AUDIT

      # ============================================================
      # JAVA
      # ============================================================

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK não encontrado em $SDK_ROOT"
            exit 1
          fi

          echo \
            "ANDROID_SDK_ROOT=$SDK_ROOT" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_HOME=$SDK_ROOT" \
            >> "$GITHUB_ENV"

          SDKMANAGER="$(
            command -v sdkmanager || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find \
                "$SDK_ROOT/cmdline-tools" \
                -type f \
                -path '*/bin/sdkmanager' \
                2>/dev/null \
                | sort -V \
                | tail -n 1
            )"
          fi

          if [ -z "$SDKMANAGER" ] || \
             [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado."
            exit 1
          fi

          echo \
            "SDKMANAGER=$SDKMANAGER" \
            >> "$GITHUB_ENV"

          echo \
            "$(dirname "$SDKMANAGER")" \
            >> "$GITHUB_PATH"

          echo "Android SDK: $SDK_ROOT"
          echo "sdkmanager: $SDKMANAGER"

          "$SDKMANAGER" --version

      - name: Install Android SDK 35
        run: |
          set -euo pipefail

          if [ -z "${SDKMANAGER:-}" ]; then
            echo "::error::SDKMANAGER vazio."
            exit 1
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::SDKMANAGER inválido."
            exit 1
          fi

          yes \
            | "$SDKMANAGER" \
              --licenses \
              >/dev/null \
            || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

          test -d \
            "$ANDROID_SDK_ROOT/platforms/android-35"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          test -x \
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"

          echo "Android SDK 35 pronto."

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            clean \
            --stacktrace

      # ============================================================
      # COMPILAÇÃO KOTLIN
      # ============================================================

      - name: Compile Release Kotlin
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            :app:compileReleaseKotlin \
            --stacktrace \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/gama197-compile.log"

      # ============================================================
      # TESTE ESPECÍFICO QUE QUEBROU O #192
      # ============================================================

      - name: Research router regression test
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            :app:testReleaseUnitTest \
            --tests \
            'com.gama.assistant.GamaOnlineRouterTest.researchGoesOnline' \
            --stacktrace \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/gama197-router-test.log"

      # ============================================================
      # TODOS OS TESTES
      # ============================================================

      - name: Unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            :app:testReleaseUnitTest \
            --stacktrace \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/gama197-tests.log"

      # ============================================================
      # LINT
      # ============================================================

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            :app:lintRelease \
            --stacktrace \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/gama197-lint.log"

      # ============================================================
      # GERAR APK
      # ============================================================

      - name: Assemble Release
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            :app:assembleRelease \
            --stacktrace \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/gama197-release.log"

      - name: Locate generated APK
        run: |
          set -euo pipefail

          INPUT_APK="$(
            find \
              _gama_build/app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              | head -n 1 \
              || true
          )"

          if [ -z "$INPUT_APK" ]; then
            echo "::error::Nenhum APK foi gerado."
            exit 1
          fi

          if [ ! -s "$INPUT_APK" ]; then
            echo "::error::APK gerado está vazio."
            exit 1
          fi

          echo \
            "INPUT_APK=$INPUT_APK" \
            >> "$GITHUB_ENV"

          ls -lh "$INPUT_APK"

      # ============================================================
      # ZIPALIGN
      # ============================================================

      - name: Zipalign APK
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          test -x "$BT/zipalign"

          mkdir -p \
            _gama_build/dist

          "$BT/zipalign" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            _gama_build/dist/Gama-aligned.apk

          test -s \
            _gama_build/dist/Gama-aligned.apk

      # ============================================================
      # ASSINATURA
      # ============================================================

      - name: Sign APK
        env:
          GAMA_KEYSTORE_B64: ${{ secrets.GAMA_KEYSTORE_B64 }}
          GAMA_KEYSTORE_PASSWORD: ${{ secrets.GAMA_KEYSTORE_PASSWORD }}
          GAMA_KEY_ALIAS: ${{ secrets.GAMA_KEY_ALIAS }}
          GAMA_KEY_PASSWORD: ${{ secrets.GAMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          test -x "$BT/apksigner"

          if [ -n "${GAMA_KEYSTORE_B64:-}" ] && \
             [ -n "${GAMA_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${GAMA_KEY_ALIAS:-}" ] && \
             [ -n "${GAMA_KEY_PASSWORD:-}" ]; then

            echo \
              "$GAMA_KEYSTORE_B64" \
              | base64 --decode \
              > "$RUNNER_TEMP/gama-release.jks"

            KEYSTORE="$RUNNER_TEMP/gama-release.jks"
            STORE_PASS="$GAMA_KEYSTORE_PASSWORD"
            KEY_ALIAS="$GAMA_KEY_ALIAS"
            KEY_PASS="$GAMA_KEY_PASSWORD"

            echo \
              "stable-update-capable" \
              > _gama_build/dist/install-mode.txt

          else

            KEYSTORE="$RUNNER_TEMP/gama-test.jks"
            STORE_PASS="gama-test-pass"
            KEY_ALIAS="gama-test"
            KEY_PASS="gama-test-pass"

            keytool \
              -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Gama Test,O=Gama,C=BR" \
              -noprompt

            echo \
              "fresh-install-only" \
              > _gama_build/dist/install-mode.txt
          fi

          "$BT/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$STORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out \
              _gama_build/dist/Gama.apk \
            _gama_build/dist/Gama-aligned.apk

          test -s \
            _gama_build/dist/Gama.apk

      # ============================================================
      # VERIFICAR ASSINATURA
      # ============================================================

      - name: Verify APK signature
        run: |
          set -euo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          "$BT/apksigner" \
            verify \
            --verbose \
            --print-certs \
            _gama_build/dist/Gama.apk \
            | tee \
              _gama_build/dist/signature-info.txt

          test -s \
            _gama_build/dist/signature-info.txt

      # ============================================================
      # VERIFICAR APK
      # ============================================================

      - name: Verify APK contents
        run: |
          set -euo pipefail

          APK="_gama_build/dist/Gama.apk"
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          test -s "$APK"

          APK_SIZE="$(
            stat -c%s "$APK"
          )"

          echo "APK final: $APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 350000000 ]; then
            echo "::error::APK pequeno demais."
            echo "::error::O Qwen local provavelmente não foi incluído."
            exit 1
          fi

          unzip -l \
            "$APK" \
            > _gama_build/dist/apk-files.txt

          grep -Fq \
            'assets/model/final.mdl' \
            _gama_build/dist/apk-files.txt

          grep -Fq \
            'assets/model/Gr.fst' \
            _gama_build/dist/apk-files.txt

          grep -Fq \
            'assets/spk-model/final.ext.raw' \
            _gama_build/dist/apk-files.txt

          grep -Fq \
            'assets/llm/Qwen3-0.6B-int4.litertlm' \
            _gama_build/dist/apk-files.txt

          grep -Fq \
            'classes.dex' \
            _gama_build/dist/apk-files.txt

          "$BT/aapt" \
            dump badging \
            "$APK" \
            > _gama_build/dist/apk-info.txt

          grep -Fq \
            "name='com.gama.assistant'" \
            _gama_build/dist/apk-info.txt

          grep -Fq \
            "versionName='Gama 13.0 Core FIX197'" \
            _gama_build/dist/apk-info.txt

          (
            cd _gama_build/dist

            sha256sum \
              Gama.apk \
              > Gama.apk.sha256

            sha256sum \
              -c \
              Gama.apk.sha256
          )

          rm -f \
            _gama_build/dist/Gama-aligned.apk

          echo "================================"
          echo "GAMA FIX197 APK VERIFICADO"
          echo "================================"

          ls -lh \
            _gama_build/dist/Gama.apk

      # ============================================================
      # GATE FINAL
      #
      # NÃO permite workflow verde sem Gama.apk.
      # ============================================================

      - name: Final APK gate
        run: |
          set -euo pipefail

          test -s \
            _gama_build/dist/Gama.apk

          test -s \
            _gama_build/dist/Gama.apk.sha256

          test -s \
            _gama_build/dist/apk-info.txt

          test -s \
            _gama_build/dist/signature-info.txt

          echo "Gama.apk existe e passou por todas as verificações."

      # ============================================================
      # PUBLICAR APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-13.0-FIX197-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # ============================================================
      # LOGS SE FALHAR
      # ============================================================

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-FIX197-diagnostics
          path: |
            gama197-compile.log
            gama197-router-test.log
            gama197-tests.log
            gama197-lint.log
            gama197-release.log
            _gama_build/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
