name: Build Gama 9.0.0 JARVIS Supervisor APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-9-0-0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GAMA_BASE_RUN_ID: "37128415732"
      GAMA_BASE_ARTIFACT: "Gama-8.3.3-JARVIS-TOOLS-source"
      GAMA_PATCH_SHA256: "8b791bd630e92e424d35bf114626ebbf1eb189129044812e428b531082d0740f"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified Gama source from build 127
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          SRC="_gama_build/app/src/main/java/com/gama/assistant"
          TEST="_gama_build/app/src/test/java/com/gama/assistant"

          test -s _gama_build/settings.gradle.kts
          test -s _gama_build/build.gradle.kts
          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s "$SRC/GamaService.kt"
          test -s "$SRC/ConversationSession.kt"
          test -s "$SRC/GamaRecognitionPolicy.kt"
          test -s "$SRC/GamaProactivePolicy.kt"
          test -s "$SRC/GamaNotificationListener.kt"
          test -s "$SRC/GamaScreenContextService.kt"
          test -s "$SRC/ZevronAppTool.kt"
          test -s "$SRC/LocalBrain.kt"
          test -s "$TEST/ZevronPlannerTest.kt"

          grep -Fq 'GAMA2000_LOCAL_VISION_ROUTER' "$SRC/GamaService.kt"
          grep -Fq 'continuePlanAfterToolAction' "$SRC/GamaService.kt"
          grep -Fq 'GamaAdaptiveMemory' "$SRC/GamaSuperAssistantCore.kt"
          grep -Fq 'GamaAutomationEngine' "$SRC/GamaService.kt"
          grep -Fq 'interruptSpeechForBargeIn' "$SRC/GamaService.kt"
          grep -Fq 'fun liveSearch(query: String)' "$SRC/GamaInternetHub.kt"
          grep -Fq 'dispatchGesture' "$SRC/GamaScreenContextService.kt"

          echo "Gama source from successful build #127 verified."

      - name: Verify bundled offline models
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('app/src/main/assets')
          strict = {
              'model/Gr.fst': 'd81023936f5557c06930802b1db4880f56d6ac51b16ed4e5060ceba06895442c',
              'model/HCLr.fst': '8b45be1fa72913d61e37ac0b411177803848f4cda7728f74139b39acd1c0cf36',
              'model/final.mdl': '3e10e43ec01cf8d968bcc24c626a2eae2bfa77863bee82f36a554854afa1f147',
          }

          for name, expected in strict.items():
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'Missing offline model: {name}')
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Offline model checksum mismatch: {name}')

          speaker = [p for p in (root / 'spk-model').rglob('*') if p.is_file() and p.stat().st_size > 0]
          if len(speaker) < 3:
              raise SystemExit('Speaker model is incomplete')

          print(f'Offline ASR and speaker models verified: {len(speaker)} speaker files.')
          PY

      - name: Apply verified Gama 9 Supervisor patch
        working-directory: _gama_build
        run: |
          set -euo pipefail

          cat > /tmp/gama9.patch.gz.b64 <<'PATCH64'
