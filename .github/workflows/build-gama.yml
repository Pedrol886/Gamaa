          grep -Fq 'observeSafeHabit' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'masculineHintScore' app/src/main/java/com/gama/assistant/GamaVoice.kt
          grep -Fq 'repeat(336)' app/src/main/java/com/gama/assistant/GamaIntroActivity.kt
          grep -Fq 'todo dia às 7 abra o Spotify' app/src/test/java/com/gama/assistant/AutomationCommandRouterTest.kt
          grep -Fq 'blocksUnattendedMessaging' app/src/test/java/com/gama/assistant/AutomationCommandRouterTest.kt
