name: Build Zevron 1.0 FIX98 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write

concurrency:
  group: zevron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    env:
      # Última versão Gama confirmada como estável no run #87.
      FIX93_COMMIT: 9921e17c918a2ea358ade085c05b06af85d0b7fb

      # FIX97 enviado no run #88.
      # Vamos reutilizar SOMENTE o núcleo Zevron dele.
      FIX97_COMMIT: 1e349c21c1fd344f357f8c84cf656f9ba0565a45

      # Bases históricas necessárias pelos patches estáveis.
      GAMA_67_COMMIT: 87d85998667f9e51e39860991398a2e31cd5f3c7
      GAMA_43_COMMIT: ae7f8993cad81d749ffdf04dfc84d828705b1a1a

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PREPARA AS FONTES HISTÓRICAS
      # ============================================================

      - name: Prepare stable workflow sources
        run: |
          set -euo pipefail

          echo "Verificando commits..."

          git cat-file -e "${FIX93_COMMIT}^{commit}"
          git cat-file -e "${FIX97_COMMIT}^{commit}"
          git cat-file -e "${GAMA_67_COMMIT}^{commit}"
          git cat-file -e "${GAMA_43_COMMIT}^{commit}"

          # ========================================================
          # CORREÇÃO DO RUN #88
          #
          # Os módulos do FIX93 esperam este arquivo.
          # No #88 ele não existia e o build morreu em 05.sh.
          # ========================================================

          git show \
            "${GAMA_67_COMMIT}:.github/workflows/build-gama.yml" \
            > /tmp/gama-67-workflow.yml

          test -s /tmp/gama-67-workflow.yml

          grep -Fq \
            'name: Build Gama 6.0 FIX66 APK (isolated brain, self-automation and polished assistant)' \
            /tmp/gama-67-workflow.yml

          echo "Run #67 carregado."

          # Workflow estável do run #87.
          git show \
            "${FIX93_COMMIT}:.github/workflows/build-gama.yml" \
            > /tmp/fix93.yml

          test -s /tmp/fix93.yml

          grep -Fq \
            'Build Gama 6.0 FIX93 APK' \
            /tmp/fix93.yml

          echo "FIX93 carregado."

          # Workflow Zevron que usamos no run #88.
          git show \
            "${FIX97_COMMIT}:.github/workflows/build-gama.yml" \
            > /tmp/fix97.yml

          test -s /tmp/fix97.yml

          grep -Fq \
            'Build Zevron 1.0 FIX97 APK' \
            /tmp/fix97.yml

          grep -Fq \
            'Install Zevron FIX97 core' \
            /tmp/fix97.yml

          echo "FIX97 carregado."

      # ============================================================
      # HELPER PARA EXECUTAR UMA ETAPA ANTIGA EXATAMENTE COMO ESTAVA
      # ============================================================

      - name: Create workflow step runner
        run: |
          set -euo pipefail

          cat > /tmp/run_workflow_step.py <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys

          if len(sys.argv) != 3:
              raise SystemExit(
                  "Uso: run_workflow_step.py WORKFLOW STEP_NAME"
              )

          workflow_path = Path(sys.argv[1])
          step_name = sys.argv[2]

          if not workflow_path.is_file():
              raise SystemExit(
                  f"Workflow não encontrado: {workflow_path}"
              )

          workflow = workflow_path.read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              r"^      - name: "
              + re.escape(step_name)
              + r"\n(?P<body>.*?)(?=^      - name: |\Z)",
              re.MULTILINE | re.DOTALL,
          )

          match = pattern.search(workflow)

          if match is None:
              raise SystemExit(
                  f"Etapa não encontrada: {step_name}"
              )

          body = match.group("body")

          working_directory = None

          wd_match = re.search(
              r"^        working-directory:\s*(.+?)\s*$",
              body,
              re.MULTILINE,
          )

          if wd_match:
              working_directory = (
                  wd_match
                  .group(1)
                  .strip()
              )

          lines = body.splitlines()

          run_start = None

          for index, line in enumerate(lines):
              if line.strip() == "run: |":
                  run_start = index + 1
                  break

          if run_start is None:
              raise SystemExit(
                  f"Bloco run não encontrado: {step_name}"
              )

          script_lines = []

          for line in lines[run_start:]:

              if line.strip() == "":
                  script_lines.append("")
                  continue

              if not line.startswith("          "):
                  break

              script_lines.append(
                  line[10:]
              )

          script = (
              "\n".join(script_lines)
              + "\n"
          )

          if not script.strip():
              raise SystemExit(
                  f"Script vazio: {step_name}"
              )

          root = Path.cwd()

          cwd = root

          if working_directory:
              cwd = root / working_directory

          if not cwd.exists():
              raise SystemExit(
                  f"Diretório da etapa não existe: {cwd}"
              )

          print()
          print("=" * 72)
          print("Executando:", step_name)
          print("Diretório:", cwd)
          print("=" * 72)

          subprocess.run(
              [
                  "bash",
                  "-euo",
                  "pipefail",
                  "-c",
                  script,
              ],
              cwd=str(cwd),
              env=os.environ.copy(),
              check=True,
          )
          PY

          python3 -m py_compile \
            /tmp/run_workflow_step.py

      # ============================================================
      # RECONSTRÓI A MESMA BASE QUE PASSOU NO #87
      # ============================================================

      - name: Restore exact stable Gama base
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_workflow_step.py \
            /tmp/fix93.yml \
            "Restore exact Gama 4.3 base used by run 67"

          test -s \
            _gama_build/app/build.gradle.kts

          test -s \
            _gama_build/app/src/main/AndroidManifest.xml

          test -s \
            _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt

          test -s \
            _gama_build/app/src/main/java/com/gama/assistant/ConversationSession.kt

          test -s \
            _gama_build/tools/download_models.sh

      # ============================================================
      # FIX90 + FIX91
      # ============================================================

      - name: Apply stable runtime and anti-noise
        run: |
          set -euo pipefail

          # Este arquivo agora existe.
          test -s \
            /tmp/gama-67-workflow.yml

          python3 \
            /tmp/run_workflow_step.py \
            /tmp/fix93.yml \
            "Apply FIX90 runtime plus FIX91 priority anti-noise bundle"

          test -s \
            _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt

      # ============================================================
      # FIX93
      # ============================================================

      - name: Apply stable FIX93
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_workflow_step.py \
            /tmp/fix93.yml \
            "Add FIX93 strict screen routing, time-aware greetings and sleep window"

          SERVICE="_gama_build/app/src/main/java/com/gama/assistant/GamaService.kt"

          test -s "$SERVICE"

          grep -Fq \
            'GAMA92_TIME_AND_SCREEN_FAST_LANES' \
            "$SERVICE"

          grep -Fq \
            'GamaScreenFastLane' \
            "$SERVICE"

          echo \
            "Base estável do run #87 reconstruída." \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # INSTALA O NÚCLEO ZEVRON DO #88
      #
      # O #88 NUNCA CHEGOU NESTA ETAPA.
      # Portanto não precisamos reescrever 2.000+ linhas aqui.
      # ============================================================

      - name: Install Zevron FIX97 core
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_workflow_step.py \
            /tmp/fix97.yml \
            "Install Zevron FIX97 core"

          PKG="_gama_build/app/src/main/java/com/gama/assistant"

          test -s \
            "$PKG/ZevronConversationEngine.kt"

          test -s \
            "$PKG/ZevronAppTool.kt"

          test -s \
            "$PKG/ZevronMathTool.kt"

          test -s \
            "$PKG/ZevronCalendarFlow.kt"

          test -s \
            "$PKG/ZevronLocalRouter.kt"

          grep -Fq \
            'ZEVRON_FIX97_UNIFIED_ROUTER' \
            "$PKG/GamaService.kt"

          grep -Fq \
            'ZevronLocalRouter.handle' \
            "$PKG/GamaService.kt"

          grep -Fq \
            'com.whatsapp' \
            _gama_build/app/src/main/AndroidManifest.xml

          grep -Fq \
            'versionName = "Zevron 1.0"' \
            _gama_build/app/build.gradle.kts

          echo \
            "Núcleo Zevron instalado sobre o FIX93." \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # GARANTE QUE ZEVRON, ACORDADO? NÃO VIROU REGRA ESPECIAL
      # ============================================================

      - name: Verify natural Zevron conversation rules
        run: |
          set -euo pipefail

          FILE="_gama_build/app/src/main/java/com/gama/assistant/ZevronConversationEngine.kt"

          test -s "$FILE"

          grep -Fq \
            'normalized == "zevron"' \
            "$FILE"

          grep -Fq \
            '"pode descansar"' \
            "$FILE"

          # "acordado" pode aparecer em teste/exemplo,
          # mas não pode fazer parte da lista WAKE_ONLY.
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "_gama_build/app/src/main/java/com/gama/assistant/ZevronConversationEngine.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          wake_start = text.find(
              'normalized == "zevron"'
          )

          sleep_start = text.find(
              'val withoutWake'
          )

          if wake_start < 0 or sleep_start < 0:
              raise SystemExit(
                  "Não consegui validar a regra de hotword."
              )

          wake_block = text[
              wake_start:sleep_start
          ].lower()

          if "acordado" in wake_block:
              raise SystemExit(
                  '"acordado" virou regra especial de wake.'
              )

          print(
              'Regra correta: somente "Zevron" sozinho é WAKE_ONLY.'
          )
          PY

      # ============================================================
      # JAVA
      # ============================================================

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID
      # ============================================================

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 \
            || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ============================================================
      # ASSINATURA
      # ============================================================

      - name: Resolve Zevron signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then

            echo \
              "mode=fresh" \
              >> "$GITHUB_OUTPUT"

            echo \
              "artifact=Zevron-1.0-FRESH-INSTALL-ONLY" \
              >> "$GITHUB_OUTPUT"

            echo \
              "Stable signing: unavailable" \
              >> "$GITHUB_STEP_SUMMARY"

            echo \
              "::warning::GAMA_SIGNING_SEED não está configurado. O APK será apenas para instalação limpa."

          elif printf '%s' \
            "$GAMA_SIGNING_SEED" \
            | grep -Eq \
            '^[0-9A-Fa-f]{64}$'; then

            echo \
              "mode=stable" \
              >> "$GITHUB_OUTPUT"

            echo \
              "artifact=Zevron-1.0-APK" \
              >> "$GITHUB_OUTPUT"

            echo \
              "Stable signing: enabled" \
              >> "$GITHUB_STEP_SUMMARY"

          else

            echo \
              "::error::GAMA_SIGNING_SEED precisa ter exatamente 64 caracteres hexadecimais."

            exit 1
          fi

      # ============================================================
      # VERSION CODE
      # ============================================================

      - name: Set Zevron version metadata
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path(
              "app/build.gradle.kts"
          )

          source = path.read_text(
              encoding="utf-8"
          )

          # Mantém versionCode sempre acima das builds anteriores.
          code = (
              20500000
              + int(
                  os.environ[
                      "GITHUB_RUN_NUMBER"
                  ]
              )
          )

          source, count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {code}',
              source,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "versionCode não encontrado."
              )

          source, count = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "Zevron 1.0 FIX98"',
              source,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "versionName não encontrado."
              )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "versionCode:",
              code
          )
          PY

          echo \
            "ZEVRON_TAG=zevron-1.0-${GITHUB_RUN_NUMBER}" \
            >> "$GITHUB_ENV"

      # ============================================================
      # MODELOS OFFLINE
      # ============================================================

      - name: Download and verify offline voice models
        working-directory: _gama_build
        run: |
          set -euo pipefail

          test -s \
            tools/download_models.sh

          bash \
            tools/download_models.sh

      # ============================================================
      # COMPILAÇÃO
      # ============================================================

      - name: Compile Zevron APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/zevron-build.log"

      # ============================================================
      # TESTES
      # ============================================================

      - name: Run Zevron unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail

          gradle \
            :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/zevron-tests.log"

      - name: Verify Zevron test results
        working-directory: _gama_build
        run: |
          set -euo pipefail

          RESULTS="app/build/test-results/testDebugUnitTest"

          test -d "$RESULTS"

          grep -Rqs \
            'ZevronConversationEngineTest' \
            "$RESULTS"

          grep -Rqs \
            'ZevronAppToolTest' \
            "$RESULTS"

          grep -Rqs \
            'ZevronMathToolTest' \
            "$RESULTS"

          grep -Rqs \
            'ZevronCalendarFlowTest' \
            "$RESULTS"

          if grep -RqsE \
            'failures="[1-9][0-9]*"|errors="[1-9][0-9]*"' \
            "$RESULTS"; then

            echo \
              "::error::Há testes do Zevron falhando."

            exit 1
          fi

          echo \
            "Testes Zevron passaram." \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # DIAGNÓSTICO
      # ============================================================

      - name: Show first failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          summary = Path(
              os.environ[
                  "GITHUB_STEP_SUMMARY"
              ]
          )

          with summary.open(
              "a",
              encoding="utf-8"
          ) as out:

              out.write(
                  "## Zevron FIX98 diagnóstico\n\n"
              )

              for name in (
                  "zevron-build.log",
                  "zevron-tests.log"
              ):

                  path = Path(name)

                  if not path.is_file():
                      continue

                  lines = path.read_text(
                      encoding="utf-8",
                      errors="replace"
                  ).splitlines()

                  problems = [
                      line
                      for line in lines
                      if re.search(
                          r'(^e: |\berror:|^FAILURE:|^> Task .* FAILED|^\* What went wrong:|^Caused by:)',
                          line
                      )
                  ]

                  excerpt = (
                      problems[:160]
                      if problems
                      else lines[-160:]
                  )

                  out.write(
                      f"### {name}\n\n"
                  )

                  out.write(
                      "```text\n"
                  )

                  out.write(
                      "\n".join(
                          excerpt
                      )
                  )

                  out.write(
                      "\n```\n\n"
                  )
          PY

      - name: Upload Zevron diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zevron-1.0-FIX98-build-logs
          path: |
            zevron-build.log
            zevron-tests.log
          if-no-files-found: warn

      # ============================================================
      # ASSINATURA
      # ============================================================

      - name: Sign Zevron APK
        env:
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          # Usa exatamente o método de assinatura do FIX93.
          python3 \
            /tmp/run_workflow_step.py \
            /tmp/fix93.yml \
            "Sign and verify Gama.apk"

          test -s \
            _gama_build/dist/Gama.apk

          cp \
            _gama_build/dist/Gama.apk \
            _gama_build/dist/Zevron.apk

          (
            cd _gama_build/dist

            sha256sum \
              Zevron.apk \
              > Zevron.apk.sha256
          )

      # ============================================================
      # VERIFICAÇÃO FINAL
      # ============================================================

      - name: Verify Zevron APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          test -s \
            dist/Zevron.apk

          test -s \
            dist/Zevron.apk.sha256

          (
            cd dist

            sha256sum -c \
              Zevron.apk.sha256
          )

          APK_BYTES="$(
            wc -c \
              < dist/Zevron.apk
          )"

          if [ \
            "$APK_BYTES" \
            -le 1000000 \
          ]; then

            echo \
              "::error::APK pequeno demais: ${APK_BYTES} bytes"

            exit 1
          fi

          echo \
            "## Zevron FIX98" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- APK bytes: $APK_BYTES" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- Package: com.gama.assistant" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- Nome visível: Zevron" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- Hotword: Zevron" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- Base: FIX93 estável / run #87" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- Núcleo Zevron: FIX97" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- Correção principal: dependência do run #67 restaurada" \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # APK
      # ============================================================

      - name: Upload Zevron APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Zevron.apk
            _gama_build/dist/Zevron.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/install-mode.txt
            _gama_build/dist/signing-cert-sha256.txt
            _gama_build/dist/signature-info.txt
          if-no-files-found: error

      # ============================================================
      # TEST REPORT
      # ============================================================

      - name: Upload Zevron test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zevron-1.0-FIX98-tests
          path: |
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn

      # ============================================================
      # CÓDIGO-FONTE REAL
      # ============================================================

      - name: Upload Zevron source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zevron-1.0-FIX98-source
          path: |
            _gama_build/app/src
            _gama_build/app/build.gradle.kts
            _gama_build/settings.gradle.kts
            _gama_build/build.gradle.kts
            _gama_build/gradle.properties
            _gama_build/tools
          if-no-files-found: warn

      # ============================================================
      # RELEASE
      # ============================================================

      - name: Publish Zevron release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${ZEVRON_TAG}"

          gh release delete \
            "$TAG" \
            --yes \
            >/dev/null 2>&1 \
            || true

          gh release create \
            "$TAG" \
            "_gama_build/dist/Zevron.apk#Zevron.apk" \
            "_gama_build/dist/Zevron.apk.sha256#Zevron.apk.sha256" \
            --title \
            "Zevron 1.0 FIX98" \
            --notes \
            "Zevron 1.0 FIX98

          Correção do run #88:
          - restaura /tmp/gama-67-workflow.yml antes dos módulos FIX90/FIX91
          - reconstrói a mesma base estável do run #87
          - reaproveita integralmente o núcleo Zevron FIX97 do run #88

          Zevron:
          - nome e hotword Zevron
          - package com.gama.assistant preservado para atualização
          - conversa contínua
          - Zevron + comando responde diretamente
          - Zevron sozinho ativa o assistente
          - 'Zevron, acordado?' continua sendo apenas conversa normal
          - 'pode descansar' encerra a sessão
          - abertura local de aplicativos
          - WhatsApp e aliases
          - calendário multi-turno
          - matemática local
          - contexto matemático
          - memória curta de sessão

          Recursos preservados do FIX93:
          - anti-ruído
          - leitura de tela estrita
          - mensagens
          - briefings
          - Internet
          - cérebro isolado
          - face gate
          - biometria oficial do Android
          - recuperação de falhas"

# ZEVRON_FIX98_COMPLETE_END
