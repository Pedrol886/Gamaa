      - name: Audit JARVIS film-core behavior
        working-directory: _gama_build
        run: |
          set -euo pipefail
          PKG="app/src/main/java/com/gama/assistant"
          TESTS="app/src/test/java/com/gama/assistant"
          test -s "$PKG/GamaMissionStore.kt"
          test -s "$PKG/GamaConversationRepair.kt"
          test -s "$PKG/GamaSystemAwareness.kt"
          grep -Fq 'rememberExternalRecipient' "$PKG/ZevronContextResolver.kt"
          grep -Fq 'GamaMissionStore.resumable' "$PKG/GamaService.kt"
          grep -Fq 'GamaMissionStore.advance' "$PKG/GamaService.kt"
          grep -Fq 'GamaConversationRepair.latestClause' "$PKG/WhatsAppCommandParser.kt"
          grep -Fq 'JARVIS-style handoff' "$PKG/GamaService.kt"
          grep -Fq 'GAMA109_LOCKSCREEN_PUBLIC_FAST_LANE' "$PKG/GamaService.kt"
          grep -Fq 'watchdog-stale-audio' "$PKG/GamaService.kt"
          grep -Fq 'return null' "$PKG/ZevronAppTool.kt"
          grep -Fq 'GamaMissionStore.contextSummary' "$PKG/GamaContextFusion.kt"
          grep -Fq 'CATEGORY_CALL' "$PKG/GamaNotificationListener.kt"
          test -s "$TESTS/GamaConversationRepairTest.kt"
          echo "Film-core audit passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set Gama version
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import os, re
          path = Path('app/build.gradle.kts')
          source = path.read_text(encoding='utf-8')
          code = 21400000 + int(os.environ['GITHUB_RUN_NUMBER'])
          source, a = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {code}', source, count=1)
          source, b = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "Gama JARVIS FILM CORE FIX110"', source, count=1)
          if a != 1 or b != 1:
              raise SystemExit(f'version metadata patch failed: code={a}, name={b}')
          path.write_text(source, encoding='utf-8')
          print('versionCode', code)
          PY_VERSION

      - name: Download and verify offline models
        working-directory: _gama_build
        run: |
          set -euo pipefail
          bash tools/download_models.sh

      - name: Compile Gama APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"

      - name: Finalize Gama APK immediately
        working-directory: _gama_build
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" dist/Gama.apk
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)
          (cd dist && sha256sum -c Gama.apk.sha256)
          python3 - <<'PY_APK'
          from pathlib import Path
          apk = Path('dist/Gama.apk')
          data = apk.read_bytes()
          if len(data) <= 1_000_000:
              raise SystemExit(f'APK unexpectedly small: {len(data)} bytes')
          if b'APK Sig Block 42' not in data:
              raise SystemExit('Android APK signing block not found')
          print(f'Gama.apk ready: {len(data)} bytes')
          PY_APK

      - name: Upload Gama APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-JARVIS-FILM-CORE-FIX110-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Publish Gama release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="gama-jarvis-film-core-${GITHUB_RUN_NUMBER}"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "Gama JARVIS FILM CORE" \
            --notes "Build ${GITHUB_RUN_NUMBER}. Núcleo de continuidade inspirado no comportamento dos vídeos: alertas proativos com resposta sem repetir hotword, memória de missão, retomada de tarefas, correções naturais, abertura universal de apps, lockscreen público e recuperação automática do microfone." \
            --latest

      - name: Upload complete source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-JARVIS-FILM-CORE-FIX110-source
          path: |
            _gama_build/app/src
            _gama_build/app/build.gradle.kts
            _gama_build/settings.gradle.kts
            _gama_build/build.gradle.kts
            _gama_build/gradle.properties
            _gama_build/tools
          if-no-files-found: warn

      - name: Run JARVIS continuity regression tests
        continue-on-error: true
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace \
            --tests "com.gama.assistant.GamaConversationRepairTest" \
            --tests "com.gama.assistant.ZevronPlannerTest" \
            --tests "com.gama.assistant.ZevronContextResolverTest" \
            --tests "com.gama.assistant.GamaCalendarCommandParserTest" \
            --tests "com.gama.assistant.WhatsAppMessagingTest" \
            --tests "com.gama.assistant.ZevronConversationEngineTest" \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-critical-tests.log"

      - name: Run full unit-test suite
        continue-on-error: true
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --rerun-tasks \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-JARVIS-FILM-CORE-FIX110-diagnostics
          path: |
            gama-build.log
            gama-critical-tests.log
            gama-tests.log
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn
