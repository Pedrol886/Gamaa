name: Build Gama 10.3.1 Personal Android Core STABLE160

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-gama.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-10-3-1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      GAMA_BASE_RUN_ID: "37226292316"
      GAMA_BASE_ARTIFACT: "Gama-10.0.0-JARVIS-CONTEXT-source"
      GAMA_EXPECTED_CERT_SHA256: "6933EDA890C29567A8F4B6CEAD7A39A442DF109D43B813A19F3F6FA7F39B078C"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-10.3.1-PERSONAL-ANDROID-CORE-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"

            echo "::warning::GAMA_SIGNING_SEED não está configurado."
            echo "::warning::O APK será Release, mas será FRESH-INSTALL-ONLY."
          elif printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-10.3.1-PERSONAL-ANDROID-CORE-APK" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GAMA_SIGNING_SEED deve possuir exatamente 64 caracteres hexadecimais."
            exit 1
          fi

      - name: Restore exact successful Gama 10 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download \
            "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaNotificationListener.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaScreenContextService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaCalendarManager.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaSuperAssistantCore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaPersonalCore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaUnreadMessageStore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/VoicePolicy.kt

          grep -Fq \
            'versionName = "Gama 10.0.0 JARVIS Context Core"' \
            _gama_build/app/build.gradle.kts

          grep -Fq \
            'isDebuggable = false' \
            _gama_build/app/build.gradle.kts

          echo "PASS: base verde exata do #156 restaurada."

      - name: Apply stable Personal Android upgrade
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"

          cat > "$SRC/GamaPersonalTools.kt" <<'KOTLIN'
          package com.gama.assistant

          import android.accessibilityservice.AccessibilityService
          import android.app.KeyguardManager
          import android.content.Context
          import android.content.Intent
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.os.BatteryManager
          import android.provider.AlarmClock
          import java.text.Normalizer
          import java.util.Calendar
          import java.util.Locale

          object GamaPersonalTools {

              fun handle(
                  service: GamaService,
                  raw: String,
              ): String? {
                  GamaSilentContext.handle(
                      service,
                      raw,
                  )?.let {
                      return it
                  }

                  systemStatus(
                      service,
                      raw,
                  )?.let {
                      return it
                  }

                  notificationDigest(
                      service,
                      raw,
                  )?.let {
                      return it
                  }

                  timer(
                      service,
                      raw,
                  )?.let {
                      return it
                  }

                  website(
                      service,
                      raw,
                  )?.let {
                      return it
                  }

                  systemAction(
                      service,
                      raw,
                  )?.let {
                      return it
                  }

                  return null
              }

              private fun systemStatus(
                  context: Context,
                  raw: String,
              ): String? {
                  val text =
                      normalize(raw)

                  if (
                      text !in setOf(
                          "como estamos",
                          "gama como estamos",
                          "como esta o sistema",
                          "como esta o celular",
                          "status do sistema",
                          "status do celular",
                      )
                  ) {
                      return null
                  }

                  val batteryManager =
                      context.getSystemService(
                          BatteryManager::class.java
                      )

                  val battery =
                      batteryManager
                          ?.getIntProperty(
                              BatteryManager.BATTERY_PROPERTY_CAPACITY
                          )
                          ?.takeIf {
                              it in 0..100
                          }

                  val charging =
                      batteryManager?.isCharging ==
                          true

                  val connectivity =
                      context.getSystemService(
                          ConnectivityManager::class.java
                      )

                  val capabilities =
                      connectivity
                          ?.getNetworkCapabilities(
                              connectivity.activeNetwork
                          )

                  val network =
                      when {
                          capabilities?.hasTransport(
                              NetworkCapabilities.TRANSPORT_WIFI
                          ) == true ->
                              "Wi-Fi"

                          capabilities?.hasTransport(
                              NetworkCapabilities.TRANSPORT_CELLULAR
                          ) == true ->
                              "dados móveis"

                          capabilities?.hasCapability(
                              NetworkCapabilities.NET_CAPABILITY_INTERNET
                          ) == true ->
                              "Internet"

                          else ->
                              "sem conexão"
                      }

                  val unread =
                      GamaUnreadMessageStore
                          .peekUnread(context)
                          .size

                  return buildString {
                      append(
                          "Estamos operacionais."
                      )

                      battery?.let {
                          append(
                              " A bateria está em $it por cento"
                          )

                          if (charging) {
                              append(
                                  " e carregando"
                              )
                          }

                          append(".")
                      }

                      append(
                          " A conexão atual é $network."
                      )

                      append(
                          " Há $unread "
                      )

                      append(
                          if (unread == 1) {
                              "mensagem não lida registrada."
                          } else {
                              "mensagens não lidas registradas."
                          }
                      )

                      GamaSilentContext
                          .description(context)
                          ?.let {
                              append(
                                  " $it"
                              )
                          }
                  }
              }

              private fun notificationDigest(
                  context: Context,
                  raw: String,
              ): String? {
                  val text =
                      normalize(raw)

                  val requested =
                      listOf(
                          "o que chegou enquanto eu estava ocupado",
                          "o que chegou enquanto estava ocupado",
                          "o que eu perdi enquanto estava ocupado",
                          "o que chegou enquanto eu estava em aula",
                          "o que chegou enquanto eu estava na prova",
                          "resuma minhas notificacoes",
                          "resumo das notificacoes",
                      ).any {
                          it in text
                      }

                  if (!requested) {
                      return null
                  }

                  val unread =
                      GamaUnreadMessageStore
                          .peekUnread(context)

                  if (unread.isEmpty()) {
                      return "Não há mensagens não lidas registradas."
                  }

                  val importantTerms =
                      listOf(
                          "urgente",
                          "prova",
                          "trabalho",
                          "atividade",
                          "prazo",
                          "entrega",
                          "professor",
                          "escola",
                          "familia",
                          "mae",
                          "pai",
                          "preciso falar",
                          "me liga",
                      )

                  val ranked =
                      unread.sortedByDescending {
                          item ->
                          val body =
                              normalize(
                                  "${item.title} ${item.text}"
                              )

                          if (
                              importantTerms.any {
                                  term ->
                                  term in body
                              }
                          ) {
                              1
                          } else {
                              0
                          }
                      }

                  val details =
                      ranked
                          .take(6)
                          .map {
                              item ->
                              val sender =
                                  item.title
                                      .ifBlank {
                                          "um contato"
                                      }
                                      .take(80)

                              val preview =
                                  item.text
                                      .replace(
                                          Regex("\\s+"),
                                          " ",
                                      )
                                      .trim()
                                      .take(180)

                              if (
                                  preview.isBlank()
                              ) {
                                  sender
                              } else {
                                  "$sender: $preview"
                              }
                          }

                  return buildString {
                      append(
                          "Enquanto você estava ocupado, ficaram registradas ${unread.size} mensagens."
                      )

                      if (
                          details.isNotEmpty()
                      ) {
                          append(
                              " As principais são: "
                          )

                          append(
                              details.joinToString(
                                  "; "
                              )
                          )

                          append(".")
                      }
                  }
              }

              private fun timer(
                  service: GamaService,
                  raw: String,
              ): String? {
                  val text =
                      normalize(raw)

                  val request =
                      text.contains(
                          "timer"
                      ) ||
                          text.contains(
                              "me avisa daqui"
                          ) ||
                          text.contains(
                              "me avise daqui"
                          ) ||
                          text.contains(
                              "daqui a"
                          ) ||
                          (
                              (
                                  text.startsWith(
                                      "deixa "
                                  ) ||
                                      text.startsWith(
                                          "deixe "
                                      )
                                  ) &&
                                  (
                                      text.contains(
                                          " minuto"
                                      ) ||
                                      text.contains(
                                          " hora"
                                      )
                                  )
                              )

                  if (!request) {
                      return null
                  }

                  val seconds =
                      parseDurationSeconds(
                          text
                      )
                          ?: return "Entendi o timer, mas não consegui identificar a duração."

                  if (
                      seconds !in
                      1..86_400
                  ) {
                      return "Esse tempo ficou fora do limite que vou enviar ao relógio do Android."
                  }

                  val intent =
                      Intent(
                          AlarmClock.ACTION_SET_TIMER
                      )
                          .putExtra(
                              AlarmClock.EXTRA_LENGTH,
                              seconds,
                          )
                          .putExtra(
                              AlarmClock.EXTRA_MESSAGE,
                              "GAMA",
                          )
                          .putExtra(
                              AlarmClock.EXTRA_SKIP_UI,
                              true,
                          )
                          .addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                          )

                  val reply =
                      service.launchSafely(
                          intent
                      )

                  return if (
                      reply.startsWith(
                          "Abrindo",
                          ignoreCase = true,
                      )
                  ) {
                      "Timer enviado ao relógio do Android."
                  } else {
                      reply
                  }
              }

              private fun website(
                  service: GamaService,
                  raw: String,
              ): String? {
                  val text =
                      normalize(raw)

                  val knownSites =
                      mapOf(
                          "github" to
                              "https://github.com",
                          "google" to
                              "https://www.google.com",
                          "wikipedia" to
                              "https://pt.wikipedia.org",
                          "youtube" to
                              "https://www.youtube.com",
                      )

                  val explicitUrl =
                      Regex(
                          """https?://[^\s]+""",
                          RegexOption.IGNORE_CASE,
                      )
                          .find(raw)
                          ?.value

                  val known =
                      knownSites.entries
                          .firstOrNull {
                              entry ->
                              entry.key in text
                          }

                  val asksBrowser =
                      " no chrome" in text ||
                          " pelo chrome" in text ||
                          text.startsWith(
                              "abra o site "
                          ) ||
                          text.startsWith(
                              "abre o site "
                          ) ||
                          text.startsWith(
                              "acesse o site "
                          ) ||
                          explicitUrl != null

                  if (
                      !asksBrowser
                  ) {
                      return null
                  }

                  val url =
                      explicitUrl
                          ?: known?.value
                          ?: return "Qual site você quer abrir?"

                  var intent =
                      Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse(url),
                      )
                          .addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                          )

                  if (
                      "chrome" in text
                  ) {
                      val chromeAvailable =
                          runCatching {
                              service
                                  .packageManager
                                  .getLaunchIntentForPackage(
                                      "com.android.chrome"
                                  ) != null
                          }
                              .getOrDefault(
                                  false
                              )

                      if (chromeAvailable) {
                          intent =
                              intent.setPackage(
                                  "com.android.chrome"
                              )
                      }
                  }

                  val reply =
                      service.launchSafely(
                          intent
                      )

                  return if (
                      reply.startsWith(
                          "Abrindo",
                          ignoreCase = true,
                      )
                  ) {
                      if (
                          "chrome" in text
                      ) {
                          "Abrindo o site no Chrome."
                      } else {
                          "Abrindo o site."
                      }
                  } else {
                      reply
                  }
              }

              private fun systemAction(
                  context: Context,
                  raw: String,
              ): String? {
                  val text =
                      normalize(raw)

                  val recognized =
                      listOf(
                          "abra as notificacoes",
                          "abrir notificacoes",
                          "painel de notificacoes",
                          "configuracoes rapidas",
                          "quick settings",
                          "voltar",
                          "volte",
                          "tela inicial",
                          "ir para inicio",
                          "recentes",
                          "aplicativos recentes",
                          "role para baixo",
                          "rola para baixo",
                          "role para cima",
                          "rola para cima",
                          "clique em ",
                          "toque em ",
                          "aperte ",
                      ).any {
                          it in text
                      }

                  if (!recognized) {
                      return null
                  }

                  if (
                      !GamaScreenContextService
                          .isConnected()
                  ) {
                      GamaScreenContextService
                          .openSettings(context)

                      return "Para controlar essa parte da interface, ative Gama Contexto da Tela na acessibilidade. Abri a configuração."
                  }

                  val keyguard =
                      context.getSystemService(
                          KeyguardManager::class.java
                      )

                  val locked =
                      keyguard
                          ?.isDeviceLocked ==
                          true

                  val privateUiAction =
                      text.contains(
                          "clique"
                      ) ||
                          text.contains(
                              "toque"
                          ) ||
                          text.contains(
                              "aperte"
                          ) ||
                          text.contains(
                              "role"
                          ) ||
                          text.contains(
                              "rola"
                          ) ||
                          text.contains(
                              "recentes"
                          )

                  if (
                      locked &&
                      privateUiAction
                  ) {
                      return "Para concluir essa ação na interface, desbloqueie o celular."
                  }

                  when {
                      text.contains(
                          "notificacoes"
                      ) -> {
                          return if (
                              GamaScreenContextService
                                  .performGlobal(
                                      AccessibilityService
                                          .GLOBAL_ACTION_NOTIFICATIONS
                                  )
                          ) {
                              "Abri o painel de notificações."
                          } else {
                              "O Android não permitiu abrir o painel de notificações agora."
                          }
                      }

                      text.contains(
                          "configuracoes rapidas"
                      ) ||
                          text.contains(
                              "quick settings"
                          ) -> {
                          return if (
                              GamaScreenContextService
                                  .performGlobal(
                                      AccessibilityService
                                          .GLOBAL_ACTION_QUICK_SETTINGS
                                  )
                          ) {
                              "Abri as configurações rápidas."
                          } else {
                              "O Android não permitiu abrir as configurações rápidas agora."
                          }
                      }

                      text == "voltar" ||
                          text == "volte" -> {
                          return if (
                              GamaScreenContextService
                                  .performGlobal(
                                      AccessibilityService
                                          .GLOBAL_ACTION_BACK
                                  )
                          ) {
                              "Voltei."
                          } else {
                              "O Android não confirmou a ação de voltar."
                          }
                      }

                      text.contains(
                          "tela inicial"
                      ) ||
                          text.contains(
                              "ir para inicio"
                          ) -> {
                          return if (
                              GamaScreenContextService
                                  .performGlobal(
                                      AccessibilityService
                                          .GLOBAL_ACTION_HOME
                                  )
                          ) {
                              "Voltei para a tela inicial."
                          } else {
                              "O Android não confirmou a tela inicial."
                          }
                      }

                      text.contains(
                          "recentes"
                      ) -> {
                          return if (
                              GamaScreenContextService
                                  .performGlobal(
                                      AccessibilityService
                                          .GLOBAL_ACTION_RECENTS
                                  )
                          ) {
                              "Abri os aplicativos recentes."
                          } else {
                              "O Android não permitiu abrir os aplicativos recentes agora."
                          }
                      }

                      text.contains(
                          "role para baixo"
                      ) ||
                          text.contains(
                              "rola para baixo"
                          ) -> {
                          return if (
                              GamaScreenContextService
                                  .scroll(
                                      true
                                  )
                          ) {
                              "Rolei a tela para baixo."
                          } else {
                              "Não encontrei uma área acessível que pudesse rolar."
                          }
                      }

                      text.contains(
                          "role para cima"
                      ) ||
                          text.contains(
                              "rola para cima"
                          ) -> {
                          return if (
                              GamaScreenContextService
                                  .scroll(
                                      false
                                  )
                          ) {
                              "Rolei a tela para cima."
                          } else {
                              "Não encontrei uma área acessível que pudesse rolar."
                          }
                      }
                  }

                  val label =
                      Regex(
                          """(?:clique|toque|aperte)\s+(?:em|no|na)?\s*(.+)$"""
                      )
                          .find(text)
                          ?.groupValues
                          ?.getOrNull(1)
                          ?.trim()
                          .orEmpty()

                  if (
                      label.isNotBlank()
                  ) {
                      return if (
                          GamaScreenContextService
                              .clickByLabel(
                                  label
                              )
                      ) {
                          "Pronto."
                      } else {
                          "Não encontrei um elemento acessível chamado $label na tela atual."
                      }
                  }

                  return null
              }

              private fun parseDurationSeconds(
                  text: String,
              ): Int? {
                  if (
                      "meia hora" in text
                  ) {
                      return 30 * 60
                  }

                  val digit =
                      Regex(
                          """\b(\d{1,4})\s*(segundo|segundos|minuto|minutos|hora|horas)\b"""
                      )
                          .find(text)

                  if (
                      digit != null
                  ) {
                      val amount =
                          digit
                              .groupValues[1]
                              .toIntOrNull()
                              ?: return null

                      return when (
                          digit.groupValues[2]
                      ) {
                          "segundo",
                          "segundos" ->
                              amount

                          "minuto",
                          "minutos" ->
                              amount * 60

                          "hora",
                          "horas" ->
                              amount * 3600

                          else ->
                              null
                      }
                  }

                  val numbers =
                      mapOf(
                          "um" to 1,
                          "uma" to 1,
                          "dois" to 2,
                          "duas" to 2,
                          "tres" to 3,
                          "quatro" to 4,
                          "cinco" to 5,
                          "seis" to 6,
                          "sete" to 7,
                          "oito" to 8,
                          "nove" to 9,
                          "dez" to 10,
                          "onze" to 11,
                          "doze" to 12,
                          "treze" to 13,
                          "catorze" to 14,
                          "quatorze" to 14,
                          "quinze" to 15,
                          "vinte" to 20,
                          "trinta" to 30,
                          "quarenta" to 40,
                          "cinquenta" to 50,
                          "sessenta" to 60,
                      )

                  val tokens =
                      text.split(' ')

                  for (
                      index in
                      tokens.indices
                  ) {
                      val amount =
                          numbers[
                              tokens[index]
                          ]
                              ?: continue

                      val next =
                          tokens.getOrNull(
                              index + 1
                          )
                              ?: continue

                      when {
                          next.startsWith(
                              "segundo"
                          ) ->
                              return amount

                          next.startsWith(
                              "minuto"
                          ) ->
                              return amount * 60

                          next.startsWith(
                              "hora"
                          ) ->
                              return amount * 3600
                      }
                  }

                  return null
              }

              private fun normalize(
                  value: String,
              ): String =
                  Normalizer
                      .normalize(
                          value.lowercase(
                              Locale("pt", "BR")
                          ),
                          Normalizer.Form.NFD,
                      )
                      .replace(
                          Regex("\\p{M}+"),
                          "",
                      )
                      .replace(
                          Regex("[^a-z0-9:/. ]+"),
                          " ",
                      )
                      .replace(
                          Regex("\\s+"),
                          " ",
                      )
                      .trim()
          }


          object GamaSilentContext {
              private const val PREFS =
                  "gama_silent_context"

              private const val KEY_START =
                  "start"

              private const val KEY_END =
                  "end"

              private const val KEY_BREAK_START =
                  "break_start"

              private const val KEY_BREAK_END =
                  "break_end"

              private const val KEY_LABEL =
                  "label"

              private val rangeRegex =
                  Regex(
                      """(?:das|de)\s*(\d{1,2})(?::(\d{2}))?\s*(?:as|a)\s*(\d{1,2})(?::(\d{2}))?"""
                  )

              fun handle(
                  context: Context,
                  raw: String,
              ): String? {
                  val text =
                      normalize(raw)

                  val requested =
                      listOf(
                          "nao fale comigo",
                          "nao me interrompa",
                          "nao interrompa",
                          "modo silencioso",
                          "fique em silencio",
                          "fica em silencio",
                          "sem me interromper",
                      ).any {
                          it in text
                      }

                  if (!requested) {
                      return null
                  }

                  val ranges =
                      rangeRegex
                          .findAll(text)
                          .toList()

                  if (
                      ranges.isEmpty()
                  ) {
                      return "Entendi que você quer silêncio, mas preciso saber o horário de início e fim."
                  }

                  val dayOffset =
                      if (
                          "amanha" in text
                      ) {
                          1
                      } else {
                          0
                      }

                  val main =
                      toWindow(
                          ranges.first(),
                          dayOffset,
                      )
                          ?: return "Não consegui interpretar esse horário."

                  var breakStart =
                      0L

                  var breakEnd =
                      0L

                  if (
                      "intervalo" in text &&
                      ranges.size >= 2
                  ) {
                      val pause =
                          toWindow(
                              ranges[1],
                              dayOffset,
                          )

                      if (
                          pause != null
                      ) {
                          breakStart =
                              pause.first

                          breakEnd =
                              pause.second
                      }
                  }

                  val label =
                      when {
                          "prova" in text ->
                              "prova"

                          "aula" in text ->
                              "aula"

                          else ->
                              "período ocupado"
                      }

                  context
                      .getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE,
                      )
                      .edit()
                      .putLong(
                          KEY_START,
                          main.first,
                      )
                      .putLong(
                          KEY_END,
                          main.second,
                      )
                      .putLong(
                          KEY_BREAK_START,
                          breakStart,
                      )
                      .putLong(
                          KEY_BREAK_END,
                          breakEnd,
                      )
                      .putString(
                          KEY_LABEL,
                          label,
                      )
                      .apply()

                  return if (
                      breakStart > 0L &&
                      breakEnd > breakStart
                  ) {
                      "Certo. Vou evitar interrupções durante sua $label, liberar o intervalo informado e voltar ao normal automaticamente depois."
                  } else {
                      "Certo. Vou evitar interrupções não urgentes durante sua $label e voltar ao normal automaticamente depois."
                  }
              }

              fun isSilentNow(
                  context: Context,
                  now: Long =
                      System.currentTimeMillis(),
              ): Boolean {
                  val prefs =
                      context
                          .getSharedPreferences(
                              PREFS,
                              Context.MODE_PRIVATE,
                          )

                  val start =
                      prefs.getLong(
                          KEY_START,
                          0L,
                      )

                  val end =
                      prefs.getLong(
                          KEY_END,
                          0L,
                      )

                  if (
                      start <= 0L ||
                      end <= start ||
                      now !in start until end
                  ) {
                      return false
                  }

                  val breakStart =
                      prefs.getLong(
                          KEY_BREAK_START,
                          0L,
                      )

                  val breakEnd =
                      prefs.getLong(
                          KEY_BREAK_END,
                          0L,
                      )

                  return !(
                      breakStart > 0L &&
                          breakEnd >
                          breakStart &&
                          now in
                          breakStart until
                          breakEnd
                      )
              }

              fun description(
                  context: Context,
              ): String? {
                  if (
                      !isSilentNow(
                          context
                      )
                  ) {
                      return null
                  }

                  val label =
                      context
                          .getSharedPreferences(
                              PREFS,
                              Context.MODE_PRIVATE,
                          )
                          .getString(
                              KEY_LABEL,
                              "período ocupado",
                          )

                  return "Você está no período silencioso configurado para $label."
              }

              private fun toWindow(
                  match: MatchResult,
                  dayOffset: Int,
              ): Pair<Long, Long>? {
                  val startHour =
                      match
                          .groupValues[1]
                          .toIntOrNull()
                          ?: return null

                  val startMinute =
                      match
                          .groupValues[2]
                          .toIntOrNull()
                          ?: 0

                  val endHour =
                      match
                          .groupValues[3]
                          .toIntOrNull()
                          ?: return null

                  val endMinute =
                      match
                          .groupValues[4]
                          .toIntOrNull()
                          ?: 0

                  if (
                      startHour !in 0..23 ||
                      endHour !in 0..23 ||
                      startMinute !in 0..59 ||
                      endMinute !in 0..59
                  ) {
                      return null
                  }

                  val start =
                      Calendar
                          .getInstance()
                          .apply {
                              add(
                                  Calendar.DAY_OF_MONTH,
                                  dayOffset,
                              )

                              set(
                                  Calendar.HOUR_OF_DAY,
                                  startHour,
                              )

                              set(
                                  Calendar.MINUTE,
                                  startMinute,
                              )

                              set(
                                  Calendar.SECOND,
                                  0,
                              )

                              set(
                                  Calendar.MILLISECOND,
                                  0,
                              )
                          }

                  val end =
                      Calendar
                          .getInstance()
                          .apply {
                              timeInMillis =
                                  start.timeInMillis

                              set(
                                  Calendar.HOUR_OF_DAY,
                                  endHour,
                              )

                              set(
                                  Calendar.MINUTE,
                                  endMinute,
                              )

                              set(
                                  Calendar.SECOND,
                                  0,
                              )

                              set(
                                  Calendar.MILLISECOND,
                                  0,
                              )

                              if (
                                  timeInMillis <=
                                  start.timeInMillis
                              ) {
                                  add(
                                      Calendar.DAY_OF_MONTH,
                                      1,
                                  )
                              }
                          }

                  return (
                      start.timeInMillis
                      to
                      end.timeInMillis
                      )
              }

              private fun normalize(
                  value: String,
              ): String =
                  Normalizer
                      .normalize(
                          value.lowercase(
                              Locale("pt", "BR")
                          ),
                          Normalizer.Form.NFD,
                      )
                      .replace(
                          Regex("\\p{M}+"),
                          "",
                      )
                      .replace(
                          Regex("[^a-z0-9: ]+"),
                          " ",
                      )
                      .replace(
                          Regex("\\s+"),
                          " ",
                      )
                      .trim()
          }
          KOTLIN

          cat > "$GITHUB_WORKSPACE/gama-stable-upgrade.py" <<'PY'
          from pathlib import Path
          import os
          import re

          service_path = Path(
              "app/src/main/java/com/gama/assistant/GamaService.kt"
          )

          manifest_path = Path(
              "app/src/main/AndroidManifest.xml"
          )

          gradle_path = Path(
              "app/build.gradle.kts"
          )

          service = service_path.read_text(
              encoding="utf-8"
          )

          manifest = manifest_path.read_text(
              encoding="utf-8"
          )

          gradle = gradle_path.read_text(
              encoding="utf-8"
          )


          def require(
              condition,
              message,
          ):
              if not condition:
                  raise SystemExit(
                      message
                  )


          def replace_once(
              value,
              old,
              new,
              label,
          ):
              count = value.count(
                  old
              )

              if count != 1:
                  raise SystemExit(
                      f"{label}: expected 1 occurrence, found {count}"
                  )

              return value.replace(
                  old,
                  new,
                  1,
              )


          route_marker = """        val gamaCommandSequence = userCommandSequence
                  val gamaDirectCommand = norm(command)

                  // GAMA109_LOCKSCREEN_PUBLIC_FAST_LANE
          """

          route_replacement = """        val gamaCommandSequence = userCommandSequence
                  val gamaDirectCommand = norm(command)

                  GamaPersonalTools
                      .handle(
                          this,
                          command,
                      )
                      ?.let { personalReply ->
                          markResponseStarted()

                          speak(
                              personalReply,
                              false,
                          )

                          return
                      }

                  // GAMA109_LOCKSCREEN_PUBLIC_FAST_LANE
          """

          if (
              "GamaPersonalTools"
              not in service
          ):
              service = replace_once(
                  service,
                  route_marker,
                  route_replacement,
                  "Personal tools routing",
              )


          unlock_field = (
              "    @Volatile private var unlockPending = false\n"
          )

          if (
              "lastScreenOffAt"
              not in service
          ):
              service = replace_once(
                  service,
                  unlock_field,
                  unlock_field
                  + "    @Volatile private var lastScreenOffAt = 0L\n",
                  "screen off field",
              )


          old_screen_off = """                } else if (intent?.action == Intent.ACTION_SCREEN_OFF) {
                      recentOwnerSession = 0L
                      recentAndroidAuth = 0L
                      hideWakeUi()
                  }
          """

          new_screen_off = """                } else if (intent?.action == Intent.ACTION_SCREEN_OFF) {
                      lastScreenOffAt = SystemClock.elapsedRealtime()
                      recentOwnerSession = 0L
                      recentAndroidAuth = 0L
                      hideWakeUi()
                  }
          """

          if (
              "lastScreenOffAt = "
              "SystemClock.elapsedRealtime()"
              not in service
          ):
              service = replace_once(
                  service,
                  old_screen_off,
                  new_screen_off,
                  "screen off timestamp",
              )


          lock_start = service.find(
              "    private fun lockScreenReply(): String {"
          )

          lock_end = service.find(
              "\n    private fun performDeviceLockNow()",
              lock_start,
          )

          require(
              lock_start >= 0
              and lock_end > lock_start,
              "lockScreenReply region not found",
          )

          lock_region = service[
              lock_start:lock_end
          ]

          lock_region = re.sub(
              r"(?m)^\s*conversation\.close\(\)\s*$",
              "",
              lock_region,
          )

          lock_region = re.sub(
              r"(?m)^\s*conversation\.suspend\(\)\s*$",
              "",
              lock_region,
          )

          lock_region = re.sub(
              r"(?m)^\s*GamaSupervisor\.onConversationClosed\(\)\s*$",
              "",
              lock_region,
          )

          lock_region = lock_region.replace(
              "conversationLastActivityAt = 0L",
              (
                  "conversationLastActivityAt = "
                  "SystemClock.elapsedRealtime()"
              ),
          )

          service = (
              service[:lock_start]
              + lock_region
              + service[lock_end:]
          )


          unlock_start = service.find(
              "    private fun ensureVoicePipelineAfterUnlock() {"
          )

          unlock_end = service.find(
              "\n    fun cancelRequest()",
              unlock_start,
          )

          require(
              unlock_start >= 0
              and unlock_end > unlock_start,
              "ensureVoicePipelineAfterUnlock region not found",
          )

          unlock_function = r'''    private fun ensureVoicePipelineAfterUnlock() {
              val now =
                  SystemClock.elapsedRealtime()

              val stale =
                  listenerThread?.isAlive != true ||
                      !voiceReady ||
                      !running ||
                      textMode ||
                      (
                          lastScreenOffAt > 0L &&
                              lastAudioReadAt <=
                              lastScreenOffAt
                          ) ||
                      (
                          lastAudioReadAt > 0L &&
                              now -
                              lastAudioReadAt >
                              3_000L
                          )

              if (stale) {
                  recoverMicrophoneOnly(
                      "unlock"
                  )
              } else {
                  postAudio {
                      recognizer?.reset()

                      runCatching {
                          wakeRecognizer?.reset()
                      }

                      runCatching {
                          sleepRecognizer?.reset()
                      }

                      decoderActive =
                          false

                      voicedBlocks =
                          0

                      preRoll =
                          ByteArray(0)

                      wakePreRoll =
                          ByteArray(0)

                      bargePreRoll =
                          ByteArray(0)

                      speechHoldUntil =
                          0L

                      ignoreAudioUntil =
                          SystemClock.elapsedRealtime() +
                              350L
                  }
              }

              listOf(
                  1_800L,
                  6_000L,
              ).forEachIndexed {
                      index,
                      delayMs ->

                  uiHandler.postDelayed(
                      {
                          if (
                              !running ||
                              isDeviceLocked() ||
                              !BackgroundMode.enabled(
                                  this
                              )
                          ) {
                              return@postDelayed
                          }

                          val checkNow =
                              SystemClock.elapsedRealtime()

                          val freshAudio =
                              lastAudioReadAt > 0L &&
                                  (
                                      lastScreenOffAt <= 0L ||
                                          lastAudioReadAt >
                                          lastScreenOffAt
                                      ) &&
                                  checkNow -
                                      lastAudioReadAt <
                                      4_500L

                          if (
                              !freshAudio ||
                              listenerThread?.isAlive != true ||
                              !voiceReady
                          ) {
                              recoverMicrophoneOnly(
                                  if (index == 0) {
                                      "unlock-watchdog"
                                  } else {
                                      "unlock-hard-watchdog"
                                  }
                              )
                          }
                      },
                      delayMs,
                  )
              }
          }
          '''

          service = (
              service[:unlock_start]
              + unlock_function
              + service[unlock_end:]
          )


          alarm_permission = (
              '<uses-permission '
              'android:name='
              '"com.android.alarm.permission.SET_ALARM" />'
          )

          if (
              alarm_permission
              not in manifest
          ):
              application_index = manifest.find(
                  "<application"
              )

              require(
                  application_index >= 0,
                  "AndroidManifest application tag not found",
              )

              manifest = (
                  manifest[:application_index]
                  + alarm_permission
                  + "\n\n    "
                  + manifest[
                      application_index:
                  ]
              )


          version_code = (
              25_310_000
              + int(
                  os.environ[
                      "GITHUB_RUN_NUMBER"
                  ]
              )
          )

          gradle, code_count = re.subn(
              r"versionCode\s*=\s*\d+",
              (
                  "versionCode = "
                  + str(
                      version_code
                  )
              ),
              gradle,
              count=1,
          )

          gradle, name_count = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              (
                  'versionName = '
                  '"Gama 10.3.1 Personal Android Core"'
              ),
              gradle,
              count=1,
          )

          require(
              code_count == 1,
              "versionCode not found",
          )

          require(
              name_count == 1,
              "versionName not found",
          )


          service_path.write_text(
              service,
              encoding="utf-8",
          )

          manifest_path.write_text(
              manifest,
              encoding="utf-8",
          )

          gradle_path.write_text(
              gradle,
              encoding="utf-8",
          )


          final_service = service_path.read_text(
              encoding="utf-8"
          )

          for token in [
              "GamaPersonalTools",
              "lastScreenOffAt",
              "unlock-hard-watchdog",
              "GamaReliableAppLauncher",
              "GamaSelfSpeechGuard",
          ]:
              require(
                  token in final_service,
                  (
                      "upgrade invariant missing: "
                      + token
                  ),
              )

          print(
              "PASS: Gama 10.3.1 stable upgrade applied."
          )

          print(
              f"versionCode={version_code}"
          )
          PY

          python3 \
            -m py_compile \
            "$GITHUB_WORKSPACE/gama-stable-upgrade.py"

          python3 \
            "$GITHUB_WORKSPACE/gama-stable-upgrade.py"

      - name: Audit upgrade before build
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"

          test -s "$SRC/GamaPersonalTools.kt"
          test -s "$SRC/GamaService.kt"
