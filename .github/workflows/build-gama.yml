      - name: Set version and audit architecture
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path('_gama_build'); src=root/'app/src/main/java/com/gama/assistant'
          g=root/'app/build.gradle.kts'; s=g.read_text(); code=26000000+int(os.environ['GITHUB_RUN_NUMBER'])
          s,a=re.subn(r'versionCode\s*=\s*\d+',f'versionCode = {code}',s,count=1)
          s,b=re.subn(r'versionName\s*=\s*"[^"]*"','versionName = "Gama 11.0 Local Autonomous Core"',s,count=1)
          if a!=1 or b!=1: raise SystemExit('version patch failed')
          g.write_text(s)
          service=(src/'GamaService.kt').read_text(errors='ignore'); registry=(src/'GamaAppRegistry.kt').read_text(errors='ignore')
          brain=(src/'LocalBrain.kt').read_text(errors='ignore'); main=(src/'MainActivity.kt').read_text(errors='ignore')
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text(errors='ignore'); allkt='\n'.join(p.read_text(errors='ignore') for p in src.glob('*.kt'))
          forbidden=['GamaGeminiClient','GamaGeminiControl','GamaGeminiPolicy','GamaGeminiSecureStore','GamaGeminiSettingsActivity','gemini-3.','Configurar Gemini']
          bad=[x for x in forbidden if x in allkt or x in manifest]
          if bad: raise SystemExit('Cloud AI remains: '+', '.join(bad))
          checks={
            'local LLM':'com.google.mediapipe:tasks-genai:0.10.27' in s,
            'model setup':'AiSetup.download(this)' in main,
            'fallback':'fallbackWithoutModel' in brain,
            'all installed apps':'GamaInstalledAppCatalog.resolve(context, raw)' in registry,
            'speech repair':'CommandRouter.appToOpen(raw)' in registry,
            'app launch':'Accessibility is optional' in service,
            'brightness':'ACTION_MANAGE_WRITE_SETTINGS' in service,
            'wifi':'Settings.Panel.ACTION_WIFI' in service,
            'bluetooth':'ACTION_BLUETOOTH_SETTINGS' in service,
            'flashlight':'setTorchMode' in service,
            'camera':'MediaStore.ACTION_IMAGE_CAPTURE' in service,
            'research':'GamaInternetHub' in service,
            'local brain process':'BrainProcessProtocol.requestIntent' in service,
            'screen control':'GamaScreenContextService' in service,
          }
          miss=[k for k,v in checks.items() if not v]
          if miss: raise SystemExit('Missing: '+', '.join(miss))
          files=list(src.glob('*.kt'))
          if len(files)<130: raise SystemExit(f'Kotlin regression: {len(files)}')
          for p in [root/'app/src/main/assets/model/final.mdl',root/'app/src/main/assets/model/Gr.fst',root/'app/src/main/assets/spk-model/final.ext.raw']:
              if not p.is_file() or not p.stat().st_size: raise SystemExit(f'voice asset missing: {p}')
          print(f'PASS Gama 11 architecture: {len(files)} Kotlin files, no Gemini')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"; if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"; yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, test, lint and assemble
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean
          ./gradlew --no-daemon :app:compileReleaseKotlin --stacktrace
          ./gradlew --no-daemon :app:testReleaseUnitTest --stacktrace
          ./gradlew --no-daemon :app:lintRelease --stacktrace
          ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Sign and verify APK
        env:
          GAMA_KEYSTORE_B64: ${{ secrets.GAMA_KEYSTORE_B64 }}
          GAMA_KEYSTORE_PASSWORD: ${{ secrets.GAMA_KEYSTORE_PASSWORD }}
          GAMA_KEY_ALIAS: ${{ secrets.GAMA_KEY_ALIAS }}
          GAMA_KEY_PASSWORD: ${{ secrets.GAMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"; APK="$(find _gama_build/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n1 || true)"
          test -s "$APK"; mkdir -p _gama_build/dist; "$BT/zipalign" -f -p 4 "$APK" _gama_build/dist/aligned.apk
          if [ -n "${GAMA_KEYSTORE_B64:-}" ] && [ -n "${GAMA_KEYSTORE_PASSWORD:-}" ] && [ -n "${GAMA_KEY_ALIAS:-}" ] && [ -n "${GAMA_KEY_PASSWORD:-}" ]; then
            echo "$GAMA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gama.jks"; KS="$RUNNER_TEMP/gama.jks"; SP="$GAMA_KEYSTORE_PASSWORD"; KA="$GAMA_KEY_ALIAS"; KP="$GAMA_KEY_PASSWORD"
          else
            KS="$RUNNER_TEMP/gama-test.jks"; SP=gama-test-pass; KA=gama-test; KP=gama-test-pass
            keytool -genkeypair -keystore "$KS" -storepass "$SP" -keypass "$KP" -alias "$KA" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Gama Test,O=Gama,C=BR" -noprompt
          fi
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$SP" --ks-key-alias "$KA" --key-pass "pass:$KP" --out _gama_build/dist/Gama.apk _gama_build/dist/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs _gama_build/dist/Gama.apk
          test -s _gama_build/dist/Gama.apk
          test "$(stat -c%s _gama_build/dist/Gama.apk)" -gt 10000000
          unzip -l _gama_build/dist/Gama.apk | grep -Fq 'assets/model/final.mdl'
          unzip -l _gama_build/dist/Gama.apk | grep -Fq 'classes.dex'

      - uses: actions/upload-artifact@v4
        with:
          name: Gama-11.0-LOCAL-AUTONOMOUS-APK
          path: _gama_build/dist/Gama.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Gama-11.0-build-reports
          path: |
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
