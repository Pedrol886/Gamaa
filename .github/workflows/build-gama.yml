              package com.gama.assistant

              object PriorityNotificationManager {

                  enum class Priority {
                      CRITICAL,
                      IMPORTANT,
                      NORMAL,
                      LOW,
                  }

                  fun classify(
                      raw: String
                  ): Priority {
                      val n =
                          GamaProactivePolicy
                              .normalize(raw)

                      val critical =
                          listOf(
                              "emergencia",
                              "acidente",
                              "hospital",
                              "socorro",
                          ).any {
                              it in n
                          }

                      if (critical) {
