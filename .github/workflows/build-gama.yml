      # ==============================================================
      # ARTIFACTS
      # ==============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-9.5.0-PERSONAL-INTELLIGENCE-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Upload engineering reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-9.5.0-engineering-reports
          path: |
            _gama_build/reports/**
            gama-compile.log
            gama-tests.log
            gama-lint.log
            gama-release.log
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: warn

      - name: Publish Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="gama-v9.5.0-personal-intelligence-${{ github.run_number }}"

          gh release create \
            "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            "_gama_build/dist/install-mode.txt#install-mode.txt" \
            "_gama_build/reports/GAMA-9.5.0-SUPER-AI.md#GAMA-9.5.0-SUPER-AI.md" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 9.5.0 Personal Intelligence Core" \
            --notes "Evolução incremental sobre o source real do Gama 9.3.0 e Continuous Core 9.4. Inclui conversa/contexto contínuos, memória pessoal estruturada, policies persistentes, Event Rule Priority pipeline, Study Mode, AuditTrail, aliases, CapabilityRegistry, PermissionManager, SelfOptimizer seguro com rollback e Release verificado. Testes físicos continuam obrigatórios antes da aceitação final." \
            --latest
