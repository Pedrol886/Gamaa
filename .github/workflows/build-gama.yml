          object GamaIntentRouterV2 {
              fun classify(
                  raw: String
              ): GamaIntentKind {
                  val n =
                      GamaPolicyParser
                          .normalize(raw)

                  if (
                      ConversationSession
                          .isGoodbye(n)
                  ) {
                      return GamaIntentKind
                          .SLEEP
                  }

                  if (
                      n.contains(
                          "regra"
                      ) ||
                      n.contains(
                          "prioridade"
                      ) ||
                      n.contains(
                          "sempre me avise"
                      )
                  ) {
                      return if (
                          n.contains(
                              "nao precisa mais"
                          ) ||
                          n.contains(
                              "remova"
                          )
                      ) {
                          GamaIntentKind
                              .POLICY_DELETE
                      } else {
                          GamaIntentKind
                              .POLICY_CREATE
                      }
                  }

                  if (
                      n.startsWith(
                          "lembre"
                      ) ||
                      n.startsWith(
                          "memorize"
                      ) ||
                      n.startsWith(
                          "guarde"
                      )
                  ) {
                      return GamaIntentKind
                          .MEMORY_WRITE
                  }

                  if (
                      n.contains(
                          "o que voce lembra"
                      ) ||
                      n.contains(
                          "sua memoria"
                      )
                  ) {
                      return GamaIntentKind
                          .MEMORY_QUERY
                  }

                  if (
                      WhatsAppCommandParser
                          .looksLikeSendCommand(
                              n
                          )
                  ) {
                      return GamaIntentKind
                          .WHATSAPP
                  }

                  if (
                      AutomationCommandRouter
                          .looksLikeAutomationCommand(
                              n
                          )
                  ) {
                      return GamaIntentKind
                          .AUTOMATION_CREATE
                  }

                  if (
                      CalendarCommandRouter
                          .looksLikeCreateRequest(
                              n
                          )
                  ) {
                      return GamaIntentKind
                          .CALENDAR
                  }

                  if (
                      listOf(
                          "abra ",
                          "abre ",
                          "abrir ",
                          "entre no ",
                          "entra no ",
                      ).any {
                          n.startsWith(it)
                      }
                  ) {
                      return GamaIntentKind
                          .OPEN_APP
                  }

                  if (
                      listOf(
                          "fecha ",
                          "feche ",
                          "sai ",
                          "saia ",
                      ).any {
                          n.startsWith(it)
                      }
                  ) {
                      return GamaIntentKind
                          .CLOSE_APP
                  }

                  if (
                      FreshnessPolicy
                          .requiresFreshSource(
                              n
                          )
                  ) {
                      return GamaIntentKind
                          .CURRENT_INFORMATION
                  }

                  if (
                      n.endsWith(
                          "?"
                      ) ||
                      n.startsWith(
                          "quem "
                      ) ||
                      n.startsWith(
                          "o que "
                      ) ||
                      n.startsWith(
                          "como "
                      ) ||
                      n.startsWith(
                          "por que "
                      )
                  ) {
                      return GamaIntentKind
                          .QUESTION
                  }

                  return GamaIntentKind
                      .CONVERSATION
              }
          }

          object GamaLearningEngine {
              fun migrateExistingMemory(
                  context: Context
              ) {
                  val db =
                      GamaPersonalDatabase
                          .get(context)

                  if (
                      db.meta(
                          "legacy_memory_migrated"
                      ) == "1"
                  ) {
                      return
                  }

                  runCatching {
                      GamaAdaptiveMemory
                          .load(context)
                          .forEach {
                              db.putMemory(
                                  type =
                                      "ADAPTIVE_${it.kind.name}",
                                  value =
                                      it.value,
                                  source =
                                      "LEGACY_ADAPTIVE_MEMORY",
                                  confidence =
                                      0.85,
                                  importance =
                                      55,
                                  scope =
                                      "LONG_TERM",
                              )
                          }
                  }

                  runCatching {
                      ZevronMemoryStore
                          .load(context)
                          .forEach {
                              db.putMemory(
                                  type =
                                      "EXPLICIT_FACT",
                                  value =
                                      it.text,
                                  source =
                                      "LEGACY_EXPLICIT_MEMORY",
                                  confidence =
                                      1.0,
                                  importance =
                                      75,
                                  scope =
                                      "LONG_TERM",
                              )
                          }
                  }

                  db.putMeta(
                      "legacy_memory_migrated",
                      "1",
                  )
              }
          }

          object GamaPersonalAICore {
              fun initialize(
                  context: Context
              ) {
                  val db =
                      GamaPersonalDatabase
                          .get(context)

                  db.writableDatabase

                  GamaLearningEngine
                      .migrateExistingMemory(
                          context
                      )

                  GamaSelfOptimizer
                      .initialize(
                          context
                      )
              }

              fun handleVoiceCommand(
                  context: Context,
                  raw: String,
              ): String? {
                  val directive =
                      GamaPolicyParser
                          .parse(
                              raw,
                              GamaPolicyMemory
                                  .isStudyMode(
                                      context
                                  ),
                          )
                          ?: return null

                  return when (
                      directive
                  ) {
                      is GamaPolicyDirective
                          .SetSenderPriority -> {
                          val policy =
                              GamaPolicyMemory
                                  .setSenderPriority(
                                      context,
                                      directive.sender,
                                      directive.priority,
                                  )

                          val access =
                              GamaPermissionManager
                                  .notificationAccess(
                                      context
                                  )

                          buildString {
                              append(
                                  "Certo. Vou tratar as mensagens de "
                              )

                              append(
                                  policy.subjectDisplay
                              )

                              append(
                                  if (
                                      policy.priority ==
                                      GamaPriorityLevel
                                          .CRITICAL
                                  ) {
                                      " como prioridade máxima."
                                  } else {
                                      " como importantes."
                                  }
                              )

                              if (
                                  access !=
                                  GamaPermissionState
                                      .GRANTED
                              ) {
                                  append(
                                      " A regra ficou salva, mas o acesso especial às notificações precisa estar ativo para eu detectar as mensagens."
                                  )
                              }
                          }
                      }

                      is GamaPolicyDirective
                          .RemoveSenderPriority -> {
                          val removed =
                              GamaPolicyMemory
                                  .removeSenderPriority(
                                      context,
                                      directive.sender,
                                  )

                          if (
                              removed > 0
                          ) {
                              "Certo. Não vou mais tratar ${directive.sender} como prioridade."
                          } else {
                              "Não encontrei uma regra ativa para ${directive.sender}."
                          }
                      }

                      GamaPolicyDirective
                          .ListPolicies ->
                          GamaPolicyMemory
                              .describe(
                                  context
                              )

                      GamaPolicyDirective
                          .ExplainLastDecision -> {
                          val last =
                              GamaAuditTrail
                                  .latest(
                                      context
                                  )

                          if (
                              last == null
                          ) {
                              "Ainda não tenho uma decisão recente para explicar."
                          } else {
                              last.reason
                          }
                      }

                      is GamaPolicyDirective
                          .StudyMode -> {
                          if (
                              directive.enabled
                          ) {
                              GamaPolicyMemory
                                  .setStudyMode(
                                      context,
                                      true,
                                  )

                              "Certo. Modo de estudo ativado. Vou guardar eventos normais e só interromper quando for importante."
                          } else {
                              GamaPolicyMemory
                                  .setStudyMode(
                                      context,
                                      false,
                                  )

                              GamaEventEngine
                                  .finishStudyMode(
                                      context
                                  )
                          }
                      }

                      is GamaPolicyDirective
                          .Alias -> {
                          GamaPersonalDatabase
                              .get(context)
                              .saveAlias(
                                  directive.alias,
                                  directive.target,
                              )

                          GamaAuditTrail.record(
                              context,
                              kind =
                                  "ALIAS_CREATE",
                              subject =
                                  directive.alias,
                              reason =
                                  "Ordem explícita do usuário.",
                              result =
                                  directive.target,
                              ruleId =
                                  null,
                          )

                          "Certo. Quando você disser ${directive.alias}, vou entender como ${directive.target}."
                      }

                      is GamaPolicyDirective
                          .ResponseStyle -> {
                          GamaPersonalDatabase
                              .get(context)
                              .putMemory(
                                  type =
                                      "RESPONSE_STYLE",
                                  value =
                                      "Prefere respostas curtas.",
                                  source =
                                      "USER_EXPLICIT",
                                  confidence =
                                      1.0,
                                  importance =
                                      90,
                                  scope =
                                      "LONG_TERM",
                              )

                          "Certo. Vou priorizar respostas mais curtas."
                      }

                      GamaPolicyDirective
                          .WaitLonger -> {
                          GamaSelfOptimizer
                              .explicitWaitLonger(
                                  context
                              )

                          "Certo. Vou esperar um pouco mais quando você fizer pausas para pensar."
                      }

                      is GamaPolicyDirective
                          .Remember -> {
                          if (
                              looksSensitive(
                                  directive.value
                              )
                          ) {
                              "Não vou guardar senhas, PINs, tokens ou dados de pagamento na memória."
                          } else {
                              GamaPersonalDatabase
                                  .get(context)
                                  .putMemory(
                                      type =
                                          "EXPLICIT_FACT",
                                      value =
                                          directive.value,
                                      source =
                                          "USER_EXPLICIT",
                                      confidence =
                                          1.0,
                                      importance =
                                          80,
                                      scope =
                                          "LONG_TERM",
                                  )

                              "Certo. Vou lembrar disso."
                          }
                      }

                      is GamaPolicyDirective
                          .Forget -> {
                          val count =
                              GamaPersonalDatabase
                                  .get(context)
                                  .removeMemory(
                                      directive.query
                                  )

                          if (
                              count > 0
                          ) {
                              "Certo. Removi isso da memória."
                          } else {
                              "Não encontrei essa informação na memória."
                          }
                      }

                      GamaPolicyDirective
                          .ListMemory -> {
                          val summary =
                              GamaPersonalDatabase
                                  .get(context)
                                  .memorySummary(
                                      10
                                  )

                          if (
                              summary == null
                          ) {
                              "Você ainda não me pediu para guardar informações permanentes."
                          } else {
                              "Eu lembro que: $summary."
                          }
                      }

                      GamaPolicyDirective
                          .ExportConfiguration ->
                          exportConfiguration(
                              context
                          )
                  }
              }

              fun rewriteAliases(
                  context: Context,
                  raw: String,
              ): String {
                  val normalized =
                      GamaPolicyParser
                          .normalize(raw)

                  for (
                      entry in
                      GamaPersonalDatabase
                          .get(context)
                          .aliases()
                  ) {
                      val alias =
                          entry.first

                      val target =
                          entry.second

                      if (
                          normalized ==
                          alias ||
                          normalized ==
                          "abre $alias" ||
                          normalized ==
                          "abra $alias" ||
                          normalized ==
                          "abrir $alias" ||
                          normalized ==
                          "abre o $alias" ||
                          normalized ==
                          "abra o $alias" ||
                          normalized ==
                          "abre a $alias" ||
                          normalized ==
                          "abra a $alias"
                      ) {
                          return "abra $target"
                      }
                  }

                  return raw
              }

              fun brainContext(
                  context: Context
              ): String? {
                  val pieces =
                      listOfNotNull(
                          GamaPersonalDatabase
                              .get(context)
                              .memorySummary(
                                  10
                              )
                              ?.let {
                                  "Memória pessoal persistente: $it"
                              },

                          GamaPolicyMemory
                              .brainContext(
                                  context
                              ),
                      )

                  return pieces
                      .filter {
                          it.isNotBlank()
                      }
                      .joinToString(
                          "\n"
                      )
                      .takeIf {
                          it.isNotBlank()
                      }
                      ?.take(2800)
              }

              fun onNotificationEvent(
                  context: Context,
                  sender: String,
                  body: String,
                  occurredAt: Long,
              ): GamaNotificationDecision =
                  GamaEventEngine
                      .notification(
                          context,
                          sender,
                          body,
                          occurredAt,
                      )

              fun explicitAlertAllowed(
                  context: Context,
                  source: String,
              ): Boolean {
                  val policy =
                      GamaPolicyMemory
                          .senderPolicy(
                              context,
                              source,
                          )
                          ?: return false

                  return policy.priority
                      .weight >=
                      GamaPriorityLevel
                          .IMPORTANT
                          .weight
              }

              fun recordVerifiedAction(
                  context: Context,
                  action: String,
                  result: String,
              ) {
                  GamaAuditTrail.record(
                      context,
                      kind =
                          "VERIFIED_ACTION",
                      subject =
                          action,
                      reason =
                          "Ação solicitada pelo usuário e verificada pelo GAMA.",
                      result =
                          result,
                      ruleId =
                          null,
                  )
              }

              private fun exportConfiguration(
                  context: Context
              ): String {
                  return runCatching {
                      val root =
                          context
                              .getExternalFilesDir(
                                  Environment
                                      .DIRECTORY_DOCUMENTS
                              )
                              ?: context.filesDir

                      val folder =
                          File(
                              root,
                              "Gama"
                          )

                      if (
                          !folder.exists()
                      ) {
                          folder.mkdirs()
                      }

                      val file =
                          File(
                              folder,
                              "gama-config.json"
                          )

                      file.writeText(
                          GamaPersonalDatabase
                              .get(context)
                              .exportConfiguration()
                              .toString(2),
                          Charsets.UTF_8,
                      )

                      "Certo. Exportei a configuração local do Gama."
                  }
                      .getOrElse {
                          "Não consegui exportar a configuração agora."
                      }
              }

              private fun looksSensitive(
                  raw: String
              ): Boolean {
                  val n =
                      GamaPolicyParser
                          .normalize(raw)

                  return listOf(
                      "senha",
                      "password",
                      "pin",
                      "token",
                      "cvv",
                      "numero do cartao",
                      "cartao de credito",
                      "chave privada",
                      "codigo de seguranca",
                  ).any {
                      it in n
                  }
              }
          }
          KOTLIN

          # ============================================================
          # ENDPOINTING V2
          # ============================================================

          cat > "$SRC/SemanticEndpointer.kt" <<'KOTLIN'
          package com.gama.assistant

          import java.text.Normalizer
          import java.util.Locale

          object SemanticEndpointer {
              private val unfinishedEndings =
                  setOf(
                      "e",
                      "mas",
                      "porque",
                      "pois",
                      "entao",
                      "tipo",
                      "quando",
                      "onde",
                      "para",
                      "pra",
                      "com",
                      "sem",
                      "se",
                      "que",
                      "o",
                      "a",
                      "um",
                      "uma",
                      "meu",
                      "minha",
                      "de",
                      "do",
                      "da",
                  )

              private val unfinishedPrefixes =
                  listOf(
                      "eu queria",
                      "eu quero que",
                      "eu estava pensando",
                      "eu tava pensando",
                      "eu acho que",
                      "eu pensei em",
                      "mas",
                      "porque",
                      "e ai",
                      "abre o",
                      "abra o",
                      "abre a",
                      "abra a",
                      "manda uma mensagem para",
                      "mande uma mensagem para",
                      "envia uma mensagem para",
                      "envie uma mensagem para",
                      "fala para",
                      "fale para",
                  )

              fun looksIncomplete(
                  raw: String
              ): Boolean {
                  val n =
                      normalize(raw)

                  if (
                      n.isBlank()
                  ) {
                      return true
                  }

                  val words =
                      n
                          .split(' ')
                          .filter {
                              it.isNotBlank()
                          }

                  val last =
                      words.lastOrNull()
                          ?: return true

                  if (
                      last in
                      unfinishedEndings
                  ) {
                      return true
                  }

                  if (
                      unfinishedPrefixes
                          .any {
                              n == it ||
                                  n.endsWith(it)
                          }
                  ) {
                      return true
                  }

                  if (
                      Regex(
                          "\\b(?:abre|abra|envie|manda|mande|" +
                              "fala|fale|avisa|avise)\\s+" +
                              "(?:o|a|um|uma|para|pra)$"
                      )
                          .containsMatchIn(
                              n
                          )
                  ) {
                      return true
                  }

                  if (
                      Regex(
                          "\\b(?:eu queria|eu estava pensando|" +
                              "eu tava pensando|eu acho que)\\b"
                      )
                          .containsMatchIn(
                              n
                          ) &&
                      words.size <=
                      8
                  ) {
                      return true
                  }

                  return false
              }

              fun requiredSilenceMs(
                  raw: String,
                  confidence: Double = 1.0,
              ): Long =
                  when {
                      looksIncomplete(raw) ->
                          GamaOptimizationRuntime
                              .incompleteSilenceMs

                      confidence.isFinite() &&
                          confidence >=
                          0.0 &&
                          confidence <
                          0.45 ->
                          maxOf(
                              2_700L,
                              GamaOptimizationRuntime
                                  .completeSilenceMs,
                          )

                      else ->
                          GamaOptimizationRuntime
                              .completeSilenceMs
                  }

              fun continuationWindowMs(
                  raw: String,
                  confidence: Double = 1.0,
              ): Long =
                  when {
                      looksIncomplete(raw) ->
                          GamaOptimizationRuntime
                              .incompleteContinuationMs

                      confidence.isFinite() &&
                          confidence >=
                          0.0 &&
                          confidence <
                          0.45 ->
                          maxOf(
                              1_200L,
                              GamaOptimizationRuntime
                                  .completeContinuationMs,
                          )

                      else ->
                          GamaOptimizationRuntime
                              .completeContinuationMs
                  }

              fun merge(
                  first: String,
                  second: String,
              ): String {
                  val a =
                      first
                          .trim()
                          .replace(
                              Regex("\\s+"),
                              " "
                          )

                  val b =
                      second
                          .trim()
                          .replace(
                              Regex("\\s+"),
                              " "
                          )

                  if (
                      a.isBlank()
                  ) {
                      return b
                  }

                  if (
                      b.isBlank()
                  ) {
                      return a
                  }

                  val an =
                      normalize(a)

                  val bn =
                      normalize(b)

                  if (
                      an == bn
                  ) {
                      return b
                  }

                  if (
                      bn.startsWith(
                          an
                      )
                  ) {
                      return b
                  }

                  if (
                      an.endsWith(
                          bn
                      )
                  ) {
                      return a
                  }

                  return "$a $b"
                      .replace(
                          Regex("\\s+"),
                          " "
                      )
                      .trim()
              }

              private fun normalize(
                  value: String
              ): String =
                  Normalizer.normalize(
                      value.lowercase(
                          Locale.ROOT
                      ),
                      Normalizer.Form.NFD,
                  )
                      .replace(
                          Regex("\\p{M}+"),
                          ""
                      )
                      .replace(
                          Regex("[^a-z0-9 ]+"),
                          " "
                      )
                      .replace(
                          Regex("\\s+"),
                          " "
                      )
                      .trim()
          }
