          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail
          cat > /tmp/g85_0b805ead4b0b.sh.xz.b64 <<'G85_SIGN_AND_VERIFY_GAMA_APK'
          
          
          
          
          
