          write(
              src / "GamaSelfSpeechGuard.kt",
              r'''
              package com.gama.assistant

              object GamaSelfSpeechGuard {

                  fun isLikelySelfSpeech(
                      heard: String,
                      spoken: String?,
                      ttsStartedAt: Long,
                      now: Long,
                  ): Boolean {
                      val h =
                          VoicePolicy.normalize(
                              heard
                          )

                      val s =
                          VoicePolicy.normalize(
                              spoken.orEmpty()
                          )

                      if (
                          h.isBlank() ||
                          s.isBlank()
                      ) {
                          return false
                      }

                      val hw =
                          h.split(' ')
                              .filter {
                                  it.isNotBlank()
                              }

                      val sw =
                          s.split(' ')
                              .filter {
                                  it.isNotBlank()
                              }

                      if (
                          hw.isEmpty() ||
                          sw.isEmpty()
                      ) {
                          return false
                      }

                      val phrase =
                          hw.joinToString(" ")

                      if (
                          hw.size >= 2 &&
                          s.contains(phrase)
                      ) {
                          return true
                      }

                      val set = sw.toSet()

                      val overlap =
                          hw.count {
                              it in set
                          }.toDouble() /
                              hw.size

                      val ttsRecent =
                          ttsStartedAt > 0L &&
                              now >= ttsStartedAt &&
                              now - ttsStartedAt <=
                                  30_000L

                      return ttsRecent &&
                          hw.size >= 2 &&
                          overlap >= 0.72
                  }

                  fun shouldInterrupt(
                      partial: String,
                      spoken: String?,
                      metrics: GamaAudioMetrics,
                      voicedDurationMs: Long,
                      ttsStartedAt: Long,
                      now: Long,
                      headphones: Boolean,
                  ): Boolean {
                      val p =
                          VoicePolicy.normalize(
                              partial
                          )

                      if (p.isBlank()) {
                          return false
                      }

                      if (
                          !GamaRecognitionPolicy
                              .hasVoiceEvidence(metrics)
                      ) {
                          return false
                      }

                      val minimum =
                          if (headphones) {
                              120L
                          } else {
                              220L
                          }

                      if (
                          voicedDurationMs <
                          minimum
                      ) {
                          return false
                      }

                      if (
                          isLikelySelfSpeech(
                              p,
                              spoken,
                              ttsStartedAt,
                              now,
                          )
                      ) {
                          return false
                      }

                      val words =
                          p.split(' ')
                              .filter {
                                  it.isNotBlank()
                              }

                      return if (headphones) {
                          words.any {
                              it.length >= 3
                          }
                      } else {
                          words.size >= 2 ||
                              p.length >= 8
                      }
                  }
              }
              '''
