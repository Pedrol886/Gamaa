name: Build Gama 10.6.1 WAKEFIX176 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: gama-10-6-1-wakefix176-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GAMA_BASE_RUN_ID: "37377352221"
      GAMA_BASE_ARTIFACT: "Gama-10.6.0-GEMINIFIRST-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore proven Gama 10.6.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build
          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/assets/model/final.mdl
          test -s _gama_build/app/src/main/assets/model/Gr.fst
          test -f _gama_build/gradlew
          chmod +x _gama_build/gradlew

      - name: Patch hotword and TTS recovery
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/patch_wakefix176.py" <<'PY'
          from pathlib import Path
          import re

          root = Path("_gama_build")
          service_path = root / "app/src/main/java/com/gama/assistant/GamaService.kt"
          gradle_path = root / "app/build.gradle.kts"

          service = service_path.read_text(encoding="utf-8")

          wake_pattern = re.compile(
              r"(?m)^(\s*)val wakeConfirmed = endpoint \|\| partialWakeStable\n"
              r"\1if \(wakeConfirmed && GamaSupervisor\.acceptWake\(\n"
              r"\s*text = wakeText,\n"
              r"\s*sessionActive = conversation\.active,\n"
              r"\s*voiceEvidence = wakeVoiceEvidence,\n"
              r"\s*\)\) \{"
          )
          wake_match = wake_pattern.search(service)
          if not wake_match:
              raise SystemExit("WAKEFIX176: dedicated wake block not found")
          indent = wake_match.group(1)
          replacement_wake = (
              f"{indent}val wakeConfirmed = endpoint || partialWakeStable\n"
              f"{indent}// WAKEFIX176: the dedicated recognizer is constrained to the wake vocabulary.\n"
              f"{indent}// Trust a stable/final hotword decode even when OEM DSP RMS is low.\n"
              f"{indent}val dedicatedWakeAccepted =\n"
              f"{indent}    wakeConfirmed &&\n"
              f"{indent}    !conversation.active &&\n"
              f"{indent}    VoicePolicy.hasWake(wakeText)\n"
              f"{indent}if (dedicatedWakeAccepted) {{"
          )
          service = wake_pattern.sub(lambda _: replacement_wake, service, count=1)

          old_hits = '''                        wakePartialHits >= 3'''
          new_hits = '''                        // Two stable constrained partials are enough. This keeps the
                        // response fast while still requiring repeated hotword evidence.
                        wakePartialHits >= 2'''
          if old_hits not in service:
              raise SystemExit("WAKEFIX176: partial hit threshold not found")
          service = service.replace(old_hits, new_hits, 1)

          old_tts = "\n".join([
              "    if (!ttsReady) {",
              "        if (ttsFailed) {",
              "            val id = \"failed-${SystemClock.elapsedRealtimeNanos()}\"",
              "            activeUtterance = id",
              "            finishTts(id)",
              "        } else {",
              "            pendingSpeech = displayText",
              "            pendingCloseAfterSpeech = closeAfter",
              "        }",
              "        return",
              "    }",
          ])

          new_tts = "\n".join([
              "    if (!ttsReady) {",
              "        // WAKEFIX176: never silently discard a reply because Android TTS failed",
              "        // during an earlier initialization. Keep the reply and attempt a fresh",
              "        // engine start. A later user call can retry again if the device has no",
              "        // working TTS engine configured.",
              "        pendingSpeech = displayText",
              "        pendingCloseAfterSpeech = closeAfter",
              "        if (ttsFailed) {",
              "            updateNotification(\"Recuperando a voz do Gama...\")",
              "            restartTtsAfterFailure()",
              "        }",
              "        return",
              "    }",
          ])

          if old_tts not in service:
              raise SystemExit("WAKEFIX176: TTS fallback block not found")
          service = service.replace(old_tts, new_tts, 1)

          service_path.write_text(service, encoding="utf-8")

          gradle = gradle_path.read_text(encoding="utf-8")
          version_code_match = re.search(r"versionCode\s*=\s*(\d+)", gradle)
          if not version_code_match:
              raise SystemExit("WAKEFIX176: versionCode not found")
          new_code = max(int(version_code_match.group(1)) + 1, 25600176)
          gradle, c1 = re.subn(r"versionCode\s*=\s*\d+", f"versionCode = {new_code}", gradle, count=1)
          gradle, c2 = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "Gama 10.6.1 WakeFix176"', gradle, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit("WAKEFIX176: version update failed")
          gradle_path.write_text(gradle, encoding="utf-8")

          # Assertions: prove the exact runtime path was patched.
          updated = service_path.read_text(encoding="utf-8")
          checks = [
              "val dedicatedWakeAccepted" in updated,
              "wakePartialHits >= 2" in updated,
              'updateNotification("Recuperando a voz do Gama...")' in updated,
              "restartTtsAfterFailure()" in updated,
              "tryGeminiUnifiedBrain(" in updated,
          ]
          if not all(checks):
              raise SystemExit("WAKEFIX176: post-patch assertions failed")

          print(f"WAKEFIX176 applied, versionCode={new_code}")
          PY

          python3 -m py_compile "$GITHUB_WORKSPACE/patch_wakefix176.py"
          python3 "$GITHUB_WORKSPACE/patch_wakefix176.py"

      - name: Source integrity audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("_gama_build")
          src = root / "app/src/main/java/com/gama/assistant"
          files = list(src.glob("*.kt"))
          lines = sum(len(p.read_text(encoding="utf-8", errors="ignore").splitlines()) for p in files)
          if len(files) < 140:
              raise SystemExit(f"Kotlin regression: {len(files)} files")
          if lines < 29900:
              raise SystemExit(f"Kotlin regression: {lines} lines")

          service = (src / "GamaService.kt").read_text(encoding="utf-8", errors="ignore")
          gradle = (root / "app/build.gradle.kts").read_text(encoding="utf-8", errors="ignore")
          manifest = (root / "app/src/main/AndroidManifest.xml").read_text(encoding="utf-8", errors="ignore")

          required = {
              "microphone permission": "android.permission.RECORD_AUDIO" in manifest,
              "foreground mic service": 'android:foregroundServiceType="microphone"' in manifest,
              "Vosk wake assets": (root / "app/src/main/assets/model/final.mdl").is_file(),
              "Gemini routed": "tryGeminiUnifiedBrain(" in service,
              "dedicated wake bypasses RMS gate": "val dedicatedWakeAccepted" in service,
              "TTS recovery": 'updateNotification("Recuperando a voz do Gama...")' in service,
              "no MediaPipe GenAI": "tasks-genai" not in gradle,
          }
          bad = [k for k, v in required.items() if not v]
          if bad:
              raise SystemExit("Integrity failure: " + ", ".join(bad))

          secret_patterns = [re.compile(r"AIza[A-Za-z0-9_-]{20,}")]
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in {".kt", ".kts", ".xml", ".json", ".txt", ".md", ".sh"}:
                  continue
              text = p.read_text(encoding="utf-8", errors="ignore")
              if any(rx.search(text) for rx in secret_patterns):
                  raise SystemExit(f"Possible embedded API key: {p}")

          print(f"PASS: {len(files)} Kotlin files, {lines} Kotlin lines")
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean

      - name: Compile Release Kotlin
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:compileReleaseKotlin --stacktrace

      - name: Unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testReleaseUnitTest --stacktrace

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:lintRelease --stacktrace

      - name: Assemble Release
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Zipalign and sign APK
        env:
          GAMA_KEYSTORE_B64: ${{ secrets.GAMA_KEYSTORE_B64 }}
          GAMA_KEYSTORE_PASSWORD: ${{ secrets.GAMA_KEYSTORE_PASSWORD }}
          GAMA_KEY_ALIAS: ${{ secrets.GAMA_KEY_ALIAS }}
          GAMA_KEY_PASSWORD: ${{ secrets.GAMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          input_apk="$(find "$GITHUB_WORKSPACE/_gama_build/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | head -n 1 || true)"
          if [ -z "$input_apk" ] || [ ! -s "$input_apk" ]; then
            echo "::error::assembleRelease finished without APK"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/_gama_build/dist"
          aligned="$GITHUB_WORKSPACE/_gama_build/dist/Gama-aligned.apk"
          final_apk="$GITHUB_WORKSPACE/_gama_build/dist/Gama.apk"
          "$ZIPALIGN" -f -p 4 "$input_apk" "$aligned"

          if [ -n "${GAMA_KEYSTORE_B64:-}" ] && [ -n "${GAMA_KEYSTORE_PASSWORD:-}" ] && [ -n "${GAMA_KEY_ALIAS:-}" ] && [ -n "${GAMA_KEY_PASSWORD:-}" ]; then
            echo "$GAMA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gama-release.jks"
            KEYSTORE="$RUNNER_TEMP/gama-release.jks"
            STORE_PASS="$GAMA_KEYSTORE_PASSWORD"
            KEY_ALIAS="$GAMA_KEY_ALIAS"
            KEY_PASS="$GAMA_KEY_PASSWORD"
          else
            KEYSTORE="$RUNNER_TEMP/gama-test.jks"
            STORE_PASS="gama-test-pass"
            KEY_ALIAS="gama-test"
            KEY_PASS="gama-test-pass"
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Gama Test, OU=Gama, O=Gama, L=Aracaju, ST=Sergipe, C=BR" \
              -noprompt
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$STORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$final_apk" \
            "$aligned"
          "$APKSIGNER" verify --verbose --print-certs "$final_apk"

      - name: Verify final APK
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/_gama_build/dist/Gama.apk"
          test -s "$APK"
          APK_SIZE="$(stat -c%s "$APK")"
          if [ "$APK_SIZE" -lt 10000000 ]; then
            echo "::error::APK suspiciously small: $APK_SIZE bytes"
            exit 1
          fi
          unzip -l "$APK" | grep -Fq 'assets/model/final.mdl'
          echo "PASS: Gama.apk exists and contains Vosk model"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.6.1-WAKEFIX176-APK
          path: _gama_build/dist/Gama.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.6.1-WAKEFIX176-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/app/build/**
            !_gama_build/dist/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.6.1-WAKEFIX176-diagnostics
          path: |
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
