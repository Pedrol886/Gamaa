              fun insertEvent(
                  event: GamaPersonalEvent,
                  deferred: Boolean,
              ): Boolean {
                  if (
                      event.depth !in
                      0..MAX_EVENT_DEPTH
                  ) {
                      return false
                  }

                  val values =
                      ContentValues().apply {
                          put(
                              "event_id",
                              event.eventId
                          )

                          put(
                              "type",
                              event.type
                          )

                          put(
                              "origin",
                              event.origin
                          )

                          put(
                              "depth",
                              event.depth
                          )

                          put(
                              "source",
                              event.source
                          )

                          put(
                              "summary",
                              event.summary
                          )

                          put(
                              "priority",
                              event.priority.name
                          )

                          put(
                              "occurred_at",
                              event.occurredAt
                          )

                          put(
                              "deferred",
                              if (
                                  deferred
                              ) {
                                  1
                              } else {
                                  0
                              }
                          )

                          put(
                              "consumed",
                              0
                          )
                      }

                  val inserted =
                      writableDatabase
                          .insertWithOnConflict(
                              "event_log",
                              null,
                              values,
                              SQLiteDatabase
                                  .CONFLICT_IGNORE,
                          )

                  return inserted != -1L
              }

              fun consumeDeferredEvents():
                  List<GamaPersonalEvent> {
                  val items =
                      mutableListOf<
                          GamaPersonalEvent
                      >()

                  val ids =
                      mutableListOf<String>()

                  readableDatabase
                      .query(
                          "event_log",
                          null,
                          "deferred=1 AND consumed=0",
                          null,
                          null,
                          null,
                          "occurred_at ASC",
                          "50",
                      )
                      .use { cursor ->
                          while (
                              cursor.moveToNext()
                          ) {
                              val eventId =
                                  cursor.getString(
                                      cursor.getColumnIndexOrThrow(
                                          "event_id"
                                      )
                                  )

                              ids += eventId

                              items +=
                                  GamaPersonalEvent(
                                      eventId =
                                          eventId,

                                      type =
                                          cursor.getString(
                                              cursor.getColumnIndexOrThrow(
                                                  "type"
                                              )
                                          ),

                                      origin =
                                          cursor.getString(
                                              cursor.getColumnIndexOrThrow(
                                                  "origin"
                                              )
                                          ),

                                      depth =
                                          cursor.getInt(
                                              cursor.getColumnIndexOrThrow(
                                                  "depth"
                                              )
                                          ),

                                      source =
                                          cursor.getString(
                                              cursor.getColumnIndexOrThrow(
                                                  "source"
                                              )
                                          ),

                                      summary =
                                          cursor.getString(
                                              cursor.getColumnIndexOrThrow(
                                                  "summary"
                                              )
                                          ),

                                      priority =
                                          GamaPriorityLevel
                                              .fromName(
                                                  cursor.getString(
                                                      cursor.getColumnIndexOrThrow(
                                                          "priority"
                                                      )
                                                  )
                                              ),

                                      occurredAt =
                                          cursor.getLong(
                                              cursor.getColumnIndexOrThrow(
                                                  "occurred_at"
                                              )
                                          ),
                                  )
                          }
                      }

                  if (
                      ids.isNotEmpty()
                  ) {
                      writableDatabase
                          .beginTransaction()

                      try {
                          val values =
                              ContentValues().apply {
                                  put(
                                      "consumed",
                                      1
                                  )
                              }

                          for (id in ids) {
                              writableDatabase.update(
                                  "event_log",
                                  values,
                                  "event_id=?",
                                  arrayOf(id),
                              )
                          }

                          writableDatabase
                              .setTransactionSuccessful()
                      } finally {
                          writableDatabase
                              .endTransaction()
                      }
                  }

                  return items
              }

