      - name: Verify Red Core patch with explicit diagnostics
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_GUARD'
          from pathlib import Path

          root = Path('.')
          checks = [
              ("file", "app/src/main/java/com/gama/assistant/GamaContinuityMemory.kt", None),
              ("file", "app/src/main/java/com/gama/assistant/GamaReferenceMemory.kt", None),
              ("file", "app/src/main/java/com/gama/assistant/GamaScreenMemory.kt", None),
              ("file", "app/src/main/java/com/gama/assistant/GamaActionVerifier.kt", None),
              ("file", "app/src/main/java/com/gama/assistant/GamaReliableAppLauncher.kt", None),
              ("file", "app/src/main/res/drawable/gama_red_core.webp", None),
              ("file", "app/src/main/res/values/styles.xml", None),
              ("contains", "app/src/main/java/com/gama/assistant/GamaService.kt", "GamaContinuityMemory.recordUser"),
              ("contains", "app/src/main/java/com/gama/assistant/GamaService.kt", "resetIsolatedBrainForSilentRetry"),
              ("contains", "app/src/main/java/com/gama/assistant/ZevronPlanner.kt", "parts.size !in 2..12"),
              ("contains", "app/src/main/java/com/gama/assistant/GamaReliableAppLauncher.kt", "getLaunchIntentSenderForPackage"),
              ("contains", "app/src/main/java/com/gama/assistant/GamaService.kt", "verifyKnownAppLaunch"),
              ("contains", "app/src/main/java/com/gama/assistant/GamaService.kt", "aberto e confirmado na tela"),
              ("contains", "app/src/main/java/com/gama/assistant/GamaService.kt", "REQUEST_NOTIFICATION_ACCESS"),
              ("contains", "app/src/main/java/com/gama/assistant/GamaService.kt", "resumePendingNotificationRead"),
              ("contains", "app/src/main/java/com/gama/assistant/MainActivity.kt", "Ativar controle de tela e rolagem"),
              ("contains", "app/src/main/java/com/gama/assistant/MainActivity.kt", "Autorizar acesso às notificações"),
              ("contains", "app/src/main/AndroidManifest.xml", "@drawable/gama_red_core"),
              ("contains", "app/src/main/AndroidManifest.xml", "GamaRedTheme"),
              ("contains", "app/src/main/java/com/gama/assistant/ZevronSystemControl.kt", "Rolei a tela para baixo e confirmei a mudança."),
          ]

          failures = []
          for kind, rel, needle in checks:
              path = root / rel
              ok = path.is_file() and path.stat().st_size > 0
              if ok and kind == "contains":
                  ok = needle in path.read_text(encoding="utf-8", errors="replace")
              print(("PASS" if ok else "FAIL") + "  " + rel + (f" :: {needle}" if needle else ""))
              if not ok:
                  failures.append((rel, needle))

          service = (root / "app/src/main/java/com/gama/assistant/GamaService.kt").read_text(encoding="utf-8", errors="replace")
          old_retry = 'failIsolatedBrain(requestId, "Só um instante.")'
          if old_retry in service:
              print("FAIL  old noisy brain-retry path still present")
              failures.append(("GamaService.kt", old_retry))
          else:
              print("PASS  silent brain recovery guard")

          if failures:
              raise SystemExit(f"Red Core guard failed with {len(failures)} explicit failure(s).")
          print(f"Red Core explicit guard passed: {len(checks) + 1} checks.")
          PY_GUARD
          python3 tools/audit_gama.py

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/zipalign"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Gama Red Core before tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:compileDebugKotlin --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-compile.log"

      - name: Set Gama 9.2.1 Red Core version
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import os, re
          p = Path('app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          version_code = 24_310_000 + int(os.environ['GITHUB_RUN_NUMBER'])
          s, n1 = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {version_code}', s, count=1)
          s, n2 = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "Gama 9.2.1 Red Core"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('Não consegui atualizar versionCode/versionName de forma segura.')
          p.write_text(s, encoding='utf-8')
          PY_VERSION
          grep -Fq 'versionName = "Gama 9.2.1 Red Core"' app/build.gradle.kts
          grep -Eq 'versionCode = 24310[0-9]+' app/build.gradle.kts

      - name: Run full Gama regression suite
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Build Gama 9.2.1 Red Core APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          if [ -x tools/download_models.sh ]; then
            bash tools/download_models.sh
          fi
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"

      - name: Sign and verify final APK
        id: sign_apk
        working-directory: _gama_build
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
          GAMA_SIGNING_MODE: ${{ steps.signing_mode.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p dist
          input_apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$input_apk"

          if [ "$GAMA_SIGNING_MODE" = "stable" ]; then
            mkdir -p .gama-signing
            chmod 700 .gama-signing
            printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'

            python3 - "$GAMA_SIGNING_SEED" .gama-signing/key.der <<'PY_KEY'
          import sys
          raw = bytes.fromhex(sys.argv[1])
          order = int('FFFFFFFF00000000FFFFFFFFFFFFFFFFBCE6FAADA7179E84F3B9CAC2FC632551', 16)
          d = (int.from_bytes(raw, 'big') % (order - 1)) + 1
          key = d.to_bytes(32, 'big')
          der = bytes.fromhex('30310201010420') + key + bytes.fromhex('A00A06082A8648CE3D030107')
          open(sys.argv[2], 'wb').write(der)
          PY_KEY

            openssl ec -inform DER -in .gama-signing/key.der -out .gama-signing/key.pem >/dev/null 2>&1
            printf '%s' '' | base64 --decode > .gama-signing/cert.pem

            keyhash="$(openssl pkey -in .gama-signing/key.pem -pubout -outform DER | sha256sum | cut -d' ' -f1)"
            certhash="$(openssl x509 -in .gama-signing/cert.pem -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
            if [ "$keyhash" != "$certhash" ]; then
              echo "::error::GAMA_SIGNING_SEED não corresponde à identidade estável do Gama."
              exit 1
            fi

            fingerprint="$(openssl x509 -in .gama-signing/cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            test "$fingerprint" = '6933EDA890C29567A8F4B6CEAD7A39A442DF109D43B813A19F3F6FA7F39B078C'

            openssl pkcs12 -export \
              -inkey .gama-signing/key.pem \
              -in .gama-signing/cert.pem \
              -out .gama-signing/gama.p12 \
              -name gama \
              -passout pass:GamaStable2026

            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$input_apk" dist/Gama-aligned.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks .gama-signing/gama.p12 \
              --ks-type PKCS12 \
              --ks-key-alias gama \
              --ks-pass pass:GamaStable2026 \
              --key-pass pass:GamaStable2026 \
              --out dist/Gama.apk \
              dist/Gama-aligned.apk
            rm -f dist/Gama-aligned.apk
            printf '%s\n' 'stable-update-capable' > dist/install-mode.txt
            printf '%s\n' "$fingerprint" > dist/signing-cert-sha256.txt
            rm -rf .gama-signing
          else
            cp "$input_apk" dist/Gama.apk
            printf '%s\n' 'fresh-install-only' > dist/install-mode.txt
            printf '%s\n' 'debug-runner-signature' > dist/signing-cert-sha256.txt
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs dist/Gama.apk | tee dist/signature-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Gama.apk > dist/apk-info.txt
          grep -m1 '^package:' dist/apk-info.txt
          grep -q "name='com.gama.assistant'" dist/apk-info.txt
          grep -q "versionCode='24300" dist/apk-info.txt
          grep -q "versionName='Gama 9.2.1 Red Core'" dist/apk-info.txt
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)
          (cd dist && sha256sum -c Gama.apk.sha256)


      - name: Upload Gama 9.2.1 Red Core APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing_mode.outputs.artifact }}
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/signing-cert-sha256.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error

      - name: Upload Gama 9.2.1 Red Core source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-9.2.1-RED-CORE-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Write failure summary
        if: failure()
        run: |
          python3 - <<'PY_DIAG'
          from pathlib import Path
          import os, re
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as out:
              out.write('## Gama 9.2.1 Red Core: diagnóstico automático\n\n')
              for name in ('gama-compile.log', 'gama-tests.log', 'gama-build.log'):
                  p = Path(name)
                  if not p.is_file():
                      continue
                  lines = p.read_text(encoding='utf-8', errors='replace').splitlines()
                  hits = [line for line in lines if re.search(r'(^e: |\berror:|^FAILURE:|^> Task .* FAILED|^Caused by:)', line)]
                  excerpt = hits[:80] if hits else lines[-80:]
                  out.write(f'### {name}\n\n```text\n' + '\n'.join(excerpt) + '\n```\n\n')
          PY_DIAG

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-9.2.1-RED-CORE-diagnostics
          path: |
            gama-compile.log
            gama-build.log
            gama-tests.log
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn

      - name: Publish Gama 9.2.1 Red Core release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="gama-v9.2.1-red-core-${{ github.run_number }}"
          gh release create "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            "_gama_build/dist/install-mode.txt#install-mode.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 9.2.1 Red Core Reliability" \
            --notes "Base exata do build #131 aprovado. Corrige o gate silencioso que derrubou o #132 antes da compilação, adicionando diagnóstico explícito e compileDebugKotlin antes dos testes.  Corrige todos os problemas observados no vídeo: leitura de notificações com retomada após permissão, botão explícito de controle/rolagem, verificação real de troca de tela, retentativas de abertura de apps e WhatsApp com IntentSender no Android 13+, continuidade entre sessões, recuperação silenciosa e planos verificados. Nova identidade Red Core: logo enviada pelo usuário como ícone/overlay/lockscreen, interface vermelha e mandíbula animada durante a fala. Workflow compactado para evitar truncamento no editor móvel do GitHub." \
            --latest
