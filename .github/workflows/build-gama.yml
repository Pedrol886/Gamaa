      - name: Repair reconstructed run 67 compiler compatibility
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_FIX72_COMPILER'
          from pathlib import Path
          import re

          pkg = Path('app/src/main/java/com/gama/assistant')
          assistant = pkg / 'AssistantRuntime.kt'
          generated_app = pkg / 'GamaApplication.kt'
          voice = pkg / 'GamaVoice.kt'

          if not assistant.is_file():
              raise SystemExit('AssistantRuntime.kt from run #67 is missing')
          if not voice.is_file():
              raise SystemExit('GamaVoice.kt from run #67 is missing')

          def matching_brace(text: str, open_index: int) -> int:
              depth = 1
              i = open_index + 1
              in_string = False
              in_char = False
              escape = False
              line_comment = False
              block_comment = False
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if line_comment:
                      if ch == '\n':
                          line_comment = False
                  elif block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 1
                  elif in_string:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == '"':
                          in_string = False
                  elif in_char:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == "'":
                          in_char = False
                  else:
                      if ch == '/' and nxt == '/':
                          line_comment = True
                          i += 1
                      elif ch == '/' and nxt == '*':
                          block_comment = True
                          i += 1
                      elif ch == '"':
                          in_string = True
                      elif ch == "'":
                          in_char = True
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return i
                  i += 1
              raise SystemExit('Unbalanced Kotlin braces while repairing run #67 source')

          def replace_call_expressions(source: str, markers: tuple[str, ...], replacement: str = 'Unit'):
              total = 0
              while True:
                  hits = [(source.find(marker), marker) for marker in markers]
                  hits = [(pos, marker) for pos, marker in hits if pos >= 0]
                  if not hits:
                      return source, total
                  start, marker = min(hits, key=lambda item: item[0])
                  open_paren = start + len(marker) - 1
                  close_paren = matching_brace_for_paren(source, open_paren)
                  source = source[:start] + replacement + source[close_paren + 1:]
                  total += 1

          def matching_brace_for_paren(text: str, open_index: int) -> int:
              depth = 1
              i = open_index + 1
              in_string = False
              in_char = False
              escape = False
              while i < len(text):
                  ch = text[i]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == '"':
                          in_string = False
                  elif in_char:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == "'":
                          in_char = False
                  else:
                      if ch == '"':
                          in_string = True
                      elif ch == "'":
                          in_char = True
                      elif ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0:
                              return i
                  i += 1
              raise SystemExit('Unbalanced Kotlin parentheses while repairing run #67 source')

          # The successful #67 already has GamaApplication inside AssistantRuntime.kt.
          # FIX68-71 accidentally created a second class in GamaApplication.kt. Remove only
          # that generated duplicate and preserve the original application/lifecycle logic.
          app_source = assistant.read_text(encoding='utf-8')
          class_match = re.search(r'\bclass\s+GamaApplication\b[^\{]*\{', app_source)
          if class_match is None:
              raise SystemExit('Original GamaApplication class was not found in AssistantRuntime.kt')
          class_open = app_source.find('{', class_match.start())
          class_close = matching_brace(app_source, class_open)

          # Remove explicit process termination from the original global crash handler.
          before_class = app_source[:class_open + 1]
          class_body = app_source[class_open + 1:class_close]
          after_class = app_source[class_close:]
          class_body, kill_count = replace_call_expressions(
              class_body,
              ('android.os.Process.killProcess(', 'Process.killProcess('),
              'Unit'
          )
          class_body, system_exit_count = replace_call_expressions(
              class_body,
              ('java.lang.System.exit(', 'System.exit(', 'kotlin.system.exitProcess(', 'exitProcess('),
              'Unit'
          )
          app_source = before_class + class_body + after_class

          # Re-locate class/function after edits and install CrashRecorder LAST in onCreate,
          # so it wraps the existing handler instead of being overwritten by it.
          class_match = re.search(r'\bclass\s+GamaApplication\b[^\{]*\{', app_source)
          class_open = app_source.find('{', class_match.start())
          class_close = matching_brace(app_source, class_open)
          class_segment = app_source[class_open + 1:class_close]
          if 'CrashRecorder.install(this)' not in class_segment:
              oncreate = re.search(r'\boverride\s+fun\s+onCreate\s*\([^)]*\)\s*\{', class_segment)
              if oncreate is None:
                  raise SystemExit('GamaApplication.onCreate was not found in AssistantRuntime.kt')
              func_open_rel = class_segment.find('{', oncreate.start())
              func_open_abs = class_open + 1 + func_open_rel
              func_close_abs = matching_brace(app_source, func_open_abs)
              insertion = '\n        // FIX72: outer privacy-safe fail-soft crash supervisor\n        CrashRecorder.install(this)\n'
              app_source = app_source[:func_close_abs] + insertion + app_source[func_close_abs:]

          assistant.write_text(app_source, encoding='utf-8')
          if generated_app.exists():
              generated_app.unlink()

          # FIX68 assumed the TextToSpeech parameter was named `tts`. The #67 implementation
          # uses a different identifier. Resolve both parameter names from the real signature.
          voice_source = voice.read_text(encoding='utf-8')
          apply_match = re.search(
              r'\bfun\s+apply\s*\((.*?)\)\s*(?::\s*[^\{=\n]+)?\s*\{',
              voice_source,
              re.S,
          )
          if apply_match is None:
              raise SystemExit('GamaVoice.apply signature was not found')
          params = apply_match.group(1)
          tts_match = re.search(r'\b([A-Za-z_][A-Za-z0-9_]*)\s*:\s*(?:android\.speech\.tts\.)?TextToSpeech\b', params)
          context_match = re.search(r'\b([A-Za-z_][A-Za-z0-9_]*)\s*:\s*(?:android\.content\.)?Context\b', params)
          if tts_match is None:
              raise SystemExit('TextToSpeech parameter was not found in GamaVoice.apply')
          if context_match is None:
              raise SystemExit('Context parameter was not found in GamaVoice.apply')
          tts_name = tts_match.group(1)
          context_name = context_match.group(1)

          gate_pattern = re.compile(
              r'GamaVoiceCatalog\.applyPreferred\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\s*,\s*[A-Za-z_][A-Za-z0-9_]*\s*\)'
          )
          # The #67 GamaVoice.apply TextToSpeech parameter is nullable. Preserve the
          # boolean gate while safely handling the not-yet-initialized engine.
          safe_gate = f'{tts_name}?.let {{ GamaVoiceCatalog.applyPreferred({context_name}, it) }} == true'
          voice_source, gate_count = gate_pattern.subn(
              safe_gate,
              voice_source,
              count=1,
          )
          if gate_count != 1:
              raise SystemExit('Preferred-voice gate was not found exactly once')
          voice.write_text(voice_source, encoding='utf-8')

          # Compiler-oriented invariants. These fail here, before Gradle, with a useful cause.
          app_defs = 0
          app_files = []
          for kotlin in pkg.glob('*.kt'):
              text = kotlin.read_text(encoding='utf-8')
              count = len(re.findall(r'\bclass\s+GamaApplication\b', text))
              if count:
                  app_defs += count
                  app_files.append(kotlin.name)
          if app_defs != 1:
              raise SystemExit(f'Expected exactly one GamaApplication, found {app_defs} in {app_files}')

          app_check = assistant.read_text(encoding='utf-8')
          app_class = re.search(r'\bclass\s+GamaApplication\b[^\{]*\{', app_check)
          app_open = app_check.find('{', app_class.start())
          app_close = matching_brace(app_check, app_open)
          app_class_text = app_check[app_open:app_close + 1]
          forbidden = re.search(
              r'(?:android\.os\.)?Process\.killProcess\s*\(|(?:java\.lang\.)?System\.exit\s*\(|(?:kotlin\.system\.)?exitProcess\s*\(',
              app_class_text,
          )
          if forbidden:
              raise SystemExit('Explicit main-process termination remained in GamaApplication')
          if 'CrashRecorder.install(this)' not in app_class_text:
              raise SystemExit('CrashRecorder was not installed in the original GamaApplication')

          voice_check = voice.read_text(encoding='utf-8')
          expected_gate = f'{tts_name}?.let {{ GamaVoiceCatalog.applyPreferred({context_name}, it) }} == true'
          if expected_gate not in voice_check:
              raise SystemExit('GamaVoice preferred voice gate is not nullable-safe')
          if re.search(
              rf'GamaVoiceCatalog\.applyPreferred\s*\(\s*{re.escape(context_name)}\s*,\s*{re.escape(tts_name)}\s*\)',
              voice_check,
          ):
              raise SystemExit('Unsafe nullable TextToSpeech call remained in GamaVoice')

          print('FIX73 compiler compatibility repair passed.')
          print('Original GamaApplication retained in:', assistant)
          print('Removed explicit application termination calls:', kill_count + system_exit_count)
          print('GamaVoice.apply parameters:', context_name, tts_name, '(nullable-safe)')
          PY_FIX72_COMPILER

      - name: Add visual on-device crash diagnostics
        working-directory: _gama_build
        run: |
          set -euo pipefail
          cat > app/src/main/java/com/gama/assistant/GamaDiagnosticActivity.kt <<'KOTLIN_DIAGNOSTIC'
          package com.gama.assistant

          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.text.DateFormat
          import java.util.Date

          /**
           * Private, human-readable view of the privacy-safe CrashRecorder entry.
           * No audio, commands, message bodies, contacts, notification contents,
           * calendar text or conversation content are stored here.
           */
          class GamaDiagnosticActivity : Activity() {
              private lateinit var detailsView: TextView
              private lateinit var statusView: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(8, 8, 10)
                  window.navigationBarColor = Color.rgb(8, 8, 10)

                  val page = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(22), dp(24), dp(22), dp(28))
                      setBackgroundColor(Color.rgb(8, 8, 10))
                  }

                  page.addView(TextView(this).apply {
                      text = "Diagnóstico do Gama"
                      setTextColor(Color.WHITE)
                      textSize = 25f
                      setTypeface(typeface, Typeface.BOLD)
                  })

                  page.addView(TextView(this).apply {
                      text = "Último erro registrado no aparelho. O relatório abaixo não inclui áudio, comandos, mensagens, contatos, notificações privadas, agenda nem conversa."
                      setTextColor(Color.rgb(180, 180, 188))
                      textSize = 14f
                      setPadding(0, dp(8), 0, dp(18))
                  })

                  statusView = TextView(this).apply {
                      setTextColor(Color.rgb(255, 176, 66))
                      textSize = 14f
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, 0, 0, dp(10))
                  }
                  page.addView(statusView)

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                      setBackgroundColor(Color.rgb(24, 24, 29))
                  }

                  detailsView = TextView(this).apply {
                      setTextColor(Color.rgb(238, 238, 242))
                      textSize = 13f
                      typeface = Typeface.MONOSPACE
                      setTextIsSelectable(true)
                  }
                  card.addView(detailsView)
                  page.addView(
                      card,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                      ),
                  )

                  page.addView(actionButton("Copiar diagnóstico") {
                      val text = detailsView.text?.toString().orEmpty()
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      clipboard.setPrimaryClip(ClipData.newPlainText("Diagnóstico do Gama", text))
                      Toast.makeText(this, "Diagnóstico copiado.", Toast.LENGTH_SHORT).show()
                  })

                  page.addView(actionButton("Limpar registro") {
                      getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().clear().apply()
                      reload()
                      Toast.makeText(this, "Registro limpo.", Toast.LENGTH_SHORT).show()
                  })

                  page.addView(actionButton("Fechar") { finish() })

                  val scroll = ScrollView(this).apply {
                      isFillViewport = true
                      addView(page)
                  }
                  setContentView(scroll)
                  reload()
              }

              override fun onResume() {
                  super.onResume()
                  reload()
              }

              private fun reload() {
                  val prefs = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val last = prefs.getString(KEY_LAST, null).orEmpty().trim()
                  val at = prefs.getLong(KEY_AT, 0L)
                  val component = prefs.getString(KEY_COMPONENT, "desconhecido").orEmpty()
                  val process = prefs.getString(KEY_PROCESS, packageName).orEmpty()
                  val thread = prefs.getString(KEY_THREAD, "desconhecida").orEmpty()

                  if (last.isBlank()) {
                      statusView.text = "Nenhum erro registrado"
                      detailsView.text = "O Gama ainda não tem um crash salvo neste registro."
                      return
                  }

                  statusView.text = "Último erro registrado"
                  val whenText = if (at > 0L) {
                      DateFormat.getDateTimeInstance(DateFormat.MEDIUM, DateFormat.MEDIUM).format(Date(at))
                  } else {
                      "horário indisponível"
                  }

                  detailsView.text = buildString {
                      append("Data: ").append(whenText).append('\n')
                      append("Componente: ").append(component).append('\n')
                      append("Processo: ").append(process).append('\n')
                      append("Thread: ").append(thread).append("\n\n")
                      append("Detalhes técnicos:\n").append(last)
                  }
              }

              private fun actionButton(label: String, action: (View) -> Unit): Button {
                  return Button(this).apply {
                      text = label
                      isAllCaps = false
                      textSize = 15f
                      gravity = Gravity.CENTER
                      setOnClickListener(action)
                      val params = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          dp(50),
                      )
                      params.topMargin = dp(12)
                      layoutParams = params
                  }
              }

              private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()

              companion object {
                  private const val PREFS = "gama_crash_log"
                  private const val KEY_LAST = "last"
                  private const val KEY_AT = "at"
                  private const val KEY_COMPONENT = "component"
                  private const val KEY_PROCESS = "process"
                  private const val KEY_THREAD = "thread"
              }
          }
          KOTLIN_DIAGNOSTIC

          python3 - <<'PY_FIX75_DIAGNOSTIC_UI'
          from pathlib import Path
          import re

          service = Path('app/src/main/java/com/gama/assistant/GamaService.kt')
          manifest = Path('app/src/main/AndroidManifest.xml')
          activity = Path('app/src/main/java/com/gama/assistant/GamaDiagnosticActivity.kt')

          if not service.is_file() or not manifest.is_file() or not activity.is_file():
              raise SystemExit('FIX75 diagnostic inputs are missing')

          manifest_source = manifest.read_text(encoding='utf-8')
          if 'android:name=".GamaDiagnosticActivity"' not in manifest_source:
              tag = '''
                  <activity
                      android:name=".GamaDiagnosticActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:launchMode="singleTop" />
              '''
              if '</application>' not in manifest_source:
                  raise SystemExit('AndroidManifest application closing tag not found')
              manifest_source = manifest_source.replace('</application>', tag + '\n    </application>', 1)
              manifest.write_text(manifest_source, encoding='utf-8')

          service_source = service.read_text(encoding='utf-8')
          signature = re.search(
              r'(^[ \t]*(?:private\s+|protected\s+|public\s+|internal\s+)?fun\s+crashDiagnosticReply\s*\([^)]*\)\s*(?::\s*[^\{=\n]+)?\s*\{)',
              service_source,
              re.M,
          )
          if signature is None:
              raise SystemExit('crashDiagnosticReply() was not found in GamaService')

          open_brace = service_source.find('{', signature.start())
          depth = 1
          i = open_brace + 1
          in_string = False
          in_char = False
          escape = False
          line_comment = False
          block_comment = False
          while i < len(service_source):
              ch = service_source[i]
              nxt = service_source[i + 1] if i + 1 < len(service_source) else ''
              if line_comment:
                  if ch == '\n':
                      line_comment = False
              elif block_comment:
                  if ch == '*' and nxt == '/':
                      block_comment = False
                      i += 1
              elif in_string:
                  if escape:
                      escape = False
                  elif ch == '\\':
                      escape = True
                  elif ch == '"':
                      in_string = False
              elif in_char:
                  if escape:
                      escape = False
                  elif ch == '\\':
                      escape = True
                  elif ch == "'":
                      in_char = False
              else:
                  if ch == '/' and nxt == '/':
                      line_comment = True
                      i += 1
                  elif ch == '/' and nxt == '*':
                      block_comment = True
                      i += 1
                  elif ch == '"':
                      in_string = True
                  elif ch == "'":
                      in_char = True
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          close_brace = i
                          break
              i += 1
          else:
              raise SystemExit('crashDiagnosticReply() has unbalanced braces')

          new_body = r'''
              val diagnosticIntent = android.content.Intent(this, GamaDiagnosticActivity::class.java)
                  .addFlags(
                      android.content.Intent.FLAG_ACTIVITY_NEW_TASK or
                          android.content.Intent.FLAG_ACTIVITY_CLEAR_TOP or
                          android.content.Intent.FLAG_ACTIVITY_SINGLE_TOP
                  )
              return if (runCatching { startActivity(diagnosticIntent) }.isSuccess) {
                  "Abri o último diagnóstico na tela."
              } else {
                  "Não consegui abrir o diagnóstico agora."
              }
          '''
          service_source = service_source[:open_brace + 1] + new_body + service_source[close_brace:]
          service.write_text(service_source, encoding='utf-8')

          activity_check = activity.read_text(encoding='utf-8')
          service_check = service.read_text(encoding='utf-8')
          manifest_check = manifest.read_text(encoding='utf-8')
          for required in (
              'class GamaDiagnosticActivity : Activity()',
              'Copiar diagnóstico',
              'Limpar registro',
              'setTextIsSelectable(true)',
              'gama_crash_log',
          ):
              if required not in activity_check:
                  raise SystemExit('Diagnostic activity invariant missing: ' + required)
          if 'GamaDiagnosticActivity::class.java' not in service_check:
              raise SystemExit('GamaService does not open the diagnostic activity')
          if 'Último erro registrado: ' in service_check:
              raise SystemExit('Old long spoken crash diagnostic is still present in GamaService')
          if 'android:name=".GamaDiagnosticActivity"' not in manifest_check:
              raise SystemExit('GamaDiagnosticActivity manifest entry is missing')

          print('FIX75 visual crash diagnostics installed.')
          PY_FIX75_DIAGNOSTIC_UI


