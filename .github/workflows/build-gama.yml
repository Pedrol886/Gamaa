name: Build Gama 8.3.2 JARVIS Tools APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-8-3-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GAMA_BASE_RUN_ID: "37119165969"
      GAMA_BASE_ARTIFACT: "Gama-8.2.2-JARVIS-2000-source"
      GAMA_PATCH_COMMIT: "3578948ddae7c94a76602bac5ab08d0dd4478f4f"

    steps:

      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified Gama source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/LocalBrain.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/AiSetup.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaVisionCore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaScreenContextService.kt

          echo "Verified Gama source restored."

      - name: Recover and apply Gama 8.3 patch
        run: |
          set -euo pipefail

          git cat-file -e "${GAMA_PATCH_COMMIT}^{commit}"

          git show \
            "${GAMA_PATCH_COMMIT}:.github/workflows/build-gama.yml" \
            > /tmp/gama-build-124.yml

          test -s /tmp/gama-build-124.yml

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          workflow = Path(
              "/tmp/gama-build-124.yml"
          ).read_text(
              encoding="utf-8"
          )

          begin = (
              "cat > /tmp/gama-8.3.0.patch.gz.b64 "
              "<<'PATCH64'"
          )

          inside = False
          chunks = []

          for raw in workflow.splitlines():

              line = raw.strip()

              if not inside:
                  if begin in raw:
                      inside = True
                  continue

              if line == "PATCH64":
                  break

              if line:
                  chunks.append(line)

          if not inside:
              raise SystemExit(
                  "Gama 8.3 patch was not found in build #124."
              )

          encoded = "".join(chunks)

          if len(encoded) < 1000:
              raise SystemExit(
                  "Recovered patch data is incomplete."
              )

          try:

              compressed = base64.b64decode(
                  encoded,
                  validate=True
              )

              patch = gzip.decompress(
                  compressed
              )

          except Exception as exc:

              raise SystemExit(
                  f"Could not decode Gama patch: {exc}"
              )

          required = [
              b"GamaCriticalCommandPolicy.kt",
              b"GamaInternetHub.kt",
              b"GamaScreenContextService.kt",
              b"ZevronCalendarFlow.kt",
              b"ZevronPlanner.kt",
          ]

          for marker in required:

              if marker not in patch:

                  raise SystemExit(
                      f"Expected patch marker missing: "
                      f"{marker!r}"
                  )

          Path(
              "/tmp/gama-8.3.0.patch"
          ).write_bytes(
              patch
          )

          print(
              f"Recovered patch: {len(patch)} bytes"
          )
          PY

          cd _gama_build

          echo "Testing patch before modifying Gama..."

          patch \
            --batch \
            --forward \
            --dry-run \
            -p1 \
            < /tmp/gama-8.3.0.patch

          echo "Applying Gama patch..."

          patch \
            --batch \
            --forward \
            -p1 \
            < /tmp/gama-8.3.0.patch

          SRC="app/src/main/java/com/gama/assistant"
          TEST="app/src/test/java/com/gama/assistant"

          test -s "$SRC/GamaCriticalCommandPolicy.kt"
          test -s "$TEST/GamaCriticalCommandPolicyTest.kt"

          grep -Fq \
            'continuePlanAfterToolAction(360L)' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaCriticalCommandPolicy.isLockScreen' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'dispatchGesture' \
            "$SRC/GamaScreenContextService.kt"

          grep -Fq \
            'Mode.LIVE_SEARCH' \
            "$SRC/GamaOnlineRouter.kt"

          grep -Fq \
            'fun liveSearch(query: String)' \
            "$SRC/GamaInternetHub.kt"

          grep -Fq \
            '15 horas' \
            "$TEST/ZevronCalendarFlowTest.kt"

          grep -Fq \
            'lockThenRestBecomesPlan' \
            "$TEST/ZevronPlannerTest.kt"

          echo "Running Gama capability auditor..."

          python3 tools/audit_gama.py

          echo "Gama patch applied and verified."

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "Android SDK root: $SDK_ROOT"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner was not installed."
            exit 1
          fi

          echo "Android SDK configured successfully."

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Gama 8.3.2 build version
        working-directory: _gama_build
        run: |
          set -euo pipefail

          VC=$((22900000 + GITHUB_RUN_NUMBER))

          sed -Ei \
            "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $VC/" \
            app/build.gradle.kts

          sed -Ei \
            's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "Gama 8.3.2"/' \
            app/build.gradle.kts

          grep -F \
            'versionName = "Gama 8.3.2"' \
            app/build.gradle.kts

          echo "Gama version configured."

      - name: Run Gama regression tests
        working-directory: _gama_build
        run: |
          set -euo pipefail

          gradle :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            --tests 'com.gama.assistant.GamaRecognitionPolicyTest' \
            --tests 'com.gama.assistant.GamaAudioFrontEndTest' \
            --tests 'com.gama.assistant.ConversationSessionTest' \
            --tests 'com.gama.assistant.VoicePolicyTest' \
            --tests 'com.gama.assistant.ActionFollowUpTest' \
            --tests 'com.gama.assistant.GamaSpeechNoisePolicyTest' \
            --tests 'com.gama.assistant.GamaModelInstallPolicyTest' \
            --tests 'com.gama.assistant.GamaCriticalCommandPolicyTest' \
            --tests 'com.gama.assistant.ZevronPlannerTest' \
            --tests 'com.gama.assistant.ZevronCalendarFlowTest' \
            --tests 'com.gama.assistant.ZevronSystemControlTest' \
            --tests 'com.gama.assistant.GamaOnlineRouterTest' \
            --tests 'com.gama.assistant.FreshnessPolicyTest' \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Build and verify Gama 8.3.2 APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          if [ -x tools/download_models.sh ]; then
            bash tools/download_models.sh
          fi

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gama-build.log"

          mkdir -p dist

          APK="$(
            find \
              app/build/outputs/apk/debug \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::Gradle finished but no APK was found."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::Generated APK is empty."
            exit 1
          fi

          cp \
            "$APK" \
            dist/Gama.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            dist/Gama.apk

          (
            cd dist
            sha256sum Gama.apk > Gama.apk.sha256
          )

          echo "Gama APK built successfully."

      - name: Upload Gama 8.3.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.3.2-JARVIS-TOOLS-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Upload Gama 8.3.2 source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.3.2-JARVIS-TOOLS-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Publish Gama 8.3.2 release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="gama-v8.3.2-jarvis-tools-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 8.3.2 JARVIS Tools" \
            --notes "Correção do build #125. Mantém o patch do Gama validado durante o #125 e corrige a configuração do Android SDK que falhou por bad substitution. Inclui melhorias de reconhecimento de voz, bloqueio e comandos encadeados, leitura e rolagem de tela, agenda e consultas atuais pela Internet." \
            --latest

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.3.2-JARVIS-TOOLS-diagnostics
          path: |
            gama-build.log
            gama-tests.log
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn
