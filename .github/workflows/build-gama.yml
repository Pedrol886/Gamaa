name: Build Gama 5.4 APK (smart intent router and reliable app opening)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write

concurrency:
  group: gama-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      
      
      GAMA_43_COMMIT: ae7f8993cad81d749ffdf04dfc84d828705b1a1a

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact Gama 4.3 Android source
        run: |
          set -euo pipefail
          git cat-file -e "${GAMA_43_COMMIT}^{commit}"
          git show "${GAMA_43_COMMIT}:.github/workflows/build-gama.yml" > /tmp/gama-4.3-workflow.yml
          rm -rf _gama_build
          mkdir -p _gama_build

          python3 - <<'PY_RESTORE'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import re
          import tarfile

          workflow = Path('/tmp/gama-4.3-workflow.yml').read_text(encoding='utf-8')
          match = re.search(
              r"cat\s*>\s*/tmp/gama-complete-source\.tar\.gz\.b64\s*<<'GAMA_SOURCE'\s*\n(.*?)\n\s*GAMA_SOURCE\s*$",
              workflow,
              re.S | re.M,
          )
          if match is None:
              raise SystemExit('Não encontrei o código-fonte incorporado do Gama 4.3.')

          encoded = ''.join(match.group(1).split())
          archive = base64.b64decode(encoded, validate=True)
          print('Gama 4.3 archive SHA-256:', hashlib.sha256(archive).hexdigest())

          root = Path('_gama_build').resolve()
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as package:
              for item in package.getmembers():
                  candidate = (root / item.name).resolve()
                  if not candidate.is_relative_to(root) or item.issym() or item.islnk():
                      raise SystemExit('Caminho inseguro no pacote de origem: ' + item.name)
              package.extractall(root, filter='data')

          required = [
              'app/build.gradle.kts',
              'app/src/main/AndroidManifest.xml',
              'app/src/main/java/com/gama/assistant/GamaService.kt',
              'app/src/main/java/com/gama/assistant/ConversationSession.kt',
              'tools/download_models.sh',
          ]
          for name in required:
              if not (root / name).is_file():
                  raise SystemExit('Arquivo obrigatório ausente: ' + name)
          PY_RESTORE

      - name: Add lock-screen conversation visual and continuous mode
        working-directory: _gama_build
        run: |
          set -euo pipefail

          cat > app/src/main/java/com/gama/assistant/GamaLockConversationActivity.kt <<'KOT'
          package com.gama.assistant

          import android.animation.ValueAnimator
          import android.app.Activity
          import android.app.KeyguardManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.animation.LinearInterpolator
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.sin

          /**
           * Visual de conversa que aparece somente sobre a tela de bloqueio.
           * Ele não desbloqueia o Android e não mostra conteúdo privado.
           */
          class GamaLockConversationActivity : Activity() {
              companion object {
                  const val ACTION_LISTENING = "com.gama.assistant.LOCK_LISTENING"
                  const val ACTION_THINKING = "com.gama.assistant.LOCK_THINKING"
                  const val ACTION_SPEAKING = "com.gama.assistant.LOCK_SPEAKING"
                  const val ACTION_CLOSE = "com.gama.assistant.LOCK_CLOSE"
              }

              private lateinit var ring: VoiceRingView
              private lateinit var status: TextView

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          ACTION_LISTENING -> setState(VoiceRingView.Mode.LISTENING, "Estou ouvindo")
                          ACTION_THINKING -> setState(VoiceRingView.Mode.THINKING, "Pensando")
                          ACTION_SPEAKING -> setState(VoiceRingView.Mode.SPEAKING, "Falando")
                          ACTION_CLOSE, Intent.ACTION_USER_PRESENT -> finishAndRemoveTask()
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (!isLocked()) {
                      finish()
                      return
                  }

                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true)
                      setTurnScreenOn(true)
                  } else {
                      @Suppress("DEPRECATION")
                      window.addFlags(
                          WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or
                              WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON
                      )
                  }

                  window.addFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or
                          WindowManager.LayoutParams.FLAG_SECURE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                  )
                  window.statusBarColor = Color.TRANSPARENT
                  window.navigationBarColor = Color.TRANSPARENT

                  val root = FrameLayout(this).apply {
                      setBackgroundColor(Color.rgb(4, 12, 24))
                  }

                  val center = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                  }

                  val name = TextView(this).apply {
                      text = "GAMA"
                      textSize = 16f
                      letterSpacing = 0.22f
                      setTextColor(Color.rgb(116, 230, 247))
                      gravity = Gravity.CENTER
                  }
                  center.addView(name, LinearLayout.LayoutParams(-1, dp(42)))

                  ring = VoiceRingView(this)
                  center.addView(ring, LinearLayout.LayoutParams(dp(280), dp(280)))

                  status = TextView(this).apply {
                      text = "Estou ouvindo"
                      textSize = 19f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(dp(12), dp(12), dp(12), 0)
                  }
                  center.addView(status, LinearLayout.LayoutParams(-1, dp(58)))

                  val hint = TextView(this).apply {
                      text = "Conversa contínua • diga ‘pode descansar’ para encerrar"
                      textSize = 12f
                      setTextColor(Color.rgb(135, 161, 183))
                      gravity = Gravity.CENTER
                      setPadding(dp(28), 0, dp(28), 0)
                  }
                  center.addView(hint, LinearLayout.LayoutParams(-1, dp(48)))

                  root.addView(
                      center,
                      FrameLayout.LayoutParams(-1, -2, Gravity.CENTER)
                  )
                  setContentView(root)

                  val filter = IntentFilter().apply {
                      addAction(ACTION_LISTENING)
                      addAction(ACTION_THINKING)
                      addAction(ACTION_SPEAKING)
                      addAction(ACTION_CLOSE)
                      addAction(Intent.ACTION_USER_PRESENT)
                  }
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      @Suppress("DEPRECATION")
                      registerReceiver(receiver, filter)
                  }

                  setState(VoiceRingView.Mode.LISTENING, "Estou ouvindo")
              }

              override fun onResume() {
                  super.onResume()
                  if (!isLocked()) finishAndRemoveTask()
              }

              override fun onDestroy() {
                  try { unregisterReceiver(receiver) } catch (_: Exception) {}
                  if (::ring.isInitialized) ring.release()
                  super.onDestroy()
              }

              private fun setState(mode: VoiceRingView.Mode, label: String) {
                  if (!::ring.isInitialized) return
                  ring.mode = mode
                  if (::status.isInitialized) status.text = label
              }

              private fun isLocked(): Boolean =
                  getSystemService(KeyguardManager::class.java).isDeviceLocked

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()
          }

          /**
           * Anel de energia desenhado em tempo real.
           * Escuta: pulsação suave. Pensando: pontos em órbita. Falando: ondas fortes.
           */
          private class VoiceRingView(context: Context) : View(context) {
              enum class Mode { LISTENING, THINKING, SPEAKING }

              var mode: Mode = Mode.LISTENING
                  set(value) {
                      field = value
                      invalidate()
                  }

              private var phase = 0f
              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
                  setShadowLayer(16f, 0f, 0f, Color.rgb(60, 220, 255))
              }
              private val corePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
              }
              private val dotPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.FILL
              }
              private val animator = ValueAnimator.ofFloat(0f, 1f).apply {
                  duration = 1450L
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener {
                      phase = it.animatedValue as Float
                      invalidate()
                  }
                  start()
              }

              init {
                  setLayerType(LAYER_TYPE_SOFTWARE, null)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)

                  val cx = width / 2f
                  val cy = height / 2f
                  val minSide = minOf(width, height).toFloat()
                  val t = phase * (PI * 2.0)

                  val activity = when (mode) {
                      Mode.LISTENING -> 0.55f
                      Mode.THINKING -> 0.72f
                      Mode.SPEAKING -> 1.0f
                  }
                  val pulse =
                      (0.5 + 0.5 * sin(t * if (mode == Mode.SPEAKING) 3.0 else 1.4)).toFloat()

                  corePaint.color =
                      Color.argb((24 + 28 * pulse).toInt(), 75, 221, 255)
                  canvas.drawCircle(
                      cx,
                      cy,
                      minSide * (0.19f + 0.02f * pulse),
                      corePaint
                  )

                  for (ringIndex in 0 until 5) {
                      val base = minSide * (0.29f + ringIndex * 0.035f)
                      val ampBase = when (mode) {
                          Mode.LISTENING -> 4.5f
                          Mode.THINKING -> 7.0f
                          Mode.SPEAKING -> 12.0f
                      } * resources.displayMetrics.density
                      val amp =
                          ampBase *
                              (0.66f + pulse * 0.55f) *
                              (1f - ringIndex * 0.07f)

                      val wave = Path()
                      val points = 132
                      for (i in 0..points) {
                          val a =
                              (i.toDouble() / points.toDouble()) *
                                  PI *
                                  2.0
                          val wobble =
                              sin(
                                  a * (3.0 + ringIndex) +
                                      t * (1.0 + ringIndex * 0.18)
                              ) * amp +
                                  sin(
                                      a * 7.0 -
                                          t * 1.8 +
                                          ringIndex
                                  ) * amp * 0.34
                          val r = base + wobble.toFloat()
                          val x = cx + cos(a).toFloat() * r
                          val y = cy + sin(a).toFloat() * r

                          if (i == 0) wave.moveTo(x, y) else wave.lineTo(x, y)
                      }
                      wave.close()

                      linePaint.strokeWidth =
                          resources.displayMetrics.density *
                              (1.2f + (4 - ringIndex) * 0.12f)
                      linePaint.color =
                          Color.argb(
                              (92 + activity * 105 - ringIndex * 8)
                                  .toInt()
                                  .coerceIn(40, 220),
                              78,
                              222,
                              255
                          )
                      canvas.drawPath(wave, linePaint)
                  }

                  if (mode == Mode.THINKING) {
                      dotPaint.color = Color.rgb(131, 238, 255)
                      val orbit = minSide * 0.40f
                      for (i in 0 until 4) {
                          val a = t * 1.55 + i * PI / 2.0
                          canvas.drawCircle(
                              cx + cos(a).toFloat() * orbit,
                              cy + sin(a).toFloat() * orbit,
                              resources.displayMetrics.density * 3.1f,
                              dotPaint
                          )
                      }
                  }
              }

              fun release() {
                  animator.cancel()
              }
          }
          KOT

          python3 - <<'PY_PATCH'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit('Ponto do patch não encontrado: ' + label)
              return text.replace(old, new, 1)

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          if '.GamaLockConversationActivity' not in m:
              marker = '        <activity\n            android:name=".LockScreenActivity"'
              block = (
                  '        <activity\n'
                  '            android:name=".GamaLockConversationActivity"\n'
                  '            android:exported="false"\n'
                  '            android:excludeFromRecents="true"\n'
                  '            android:launchMode="singleTop"\n'
                  '            android:showWhenLocked="true"\n'
                  '            android:turnScreenOn="true"\n'
                  '            android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen"/>\n\n'
              )
              if marker not in m:
                  raise SystemExit('Marcador LockScreenActivity não encontrado no Manifest.')
              m = m.replace(marker, block + marker, 1)
              manifest.write_text(m, encoding='utf-8')

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          g, count = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "Gama 4.4"',
              g,
              count=1,
          )
          if count != 1:
              raise SystemExit('versionName não encontrado.')
          gradle.write_text(g, encoding='utf-8')

          main = Path('app/src/main/java/com/gama/assistant/MainActivity.kt')
          if main.is_file():
              ms = main.read_text(encoding='utf-8')
              ms = re.sub(r'Gama 4\.[0-9.]+', 'Gama 4.4', ms)
              main.write_text(ms, encoding='utf-8')

          service = Path('app/src/main/java/com/gama/assistant/GamaService.kt')
          s = service.read_text(encoding='utf-8')

          
          s, count = re.subn(
              r'private const val CONVERSATION_IDLE_TIMEOUT_MS\s*=\s*[^\n]+',
              'private const val CONVERSATION_IDLE_TIMEOUT_MS = 60L * 60L * 1000L',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit('CONVERSATION_IDLE_TIMEOUT_MS não encontrado.')

          show_marker = '    private fun showWakeUi() {\n'
          if 'private fun showLockConversationUi()' not in s:
              helper = '''    private fun sendLockConversationUi(action: String) {
              try {
                  sendBroadcast(Intent(action).setPackage(packageName))
              } catch (_: Exception) {}
          }

          private fun showLockConversationUi() {
              if (!isDeviceLocked()) return

              val intent =
                  Intent(this, GamaLockConversationActivity::class.java).apply {
                      addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK or
                              Intent.FLAG_ACTIVITY_SINGLE_TOP or
                              Intent.FLAG_ACTIVITY_CLEAR_TOP
                      )
                  }

              uiHandler.post {
                  if (!running || !isDeviceLocked()) return@post

                  try {
                      when (
                          BackgroundLaunchPolicy.route(
                              GamaApplication.foreground,
                              Settings.canDrawOverlays(this),
                              SystemAssistant.current != null
                          )
                      ) {
                          BackgroundLaunchPolicy.Route.ACTIVITY ->
                              super.startActivity(intent)

                          BackgroundLaunchPolicy.Route.ASSISTANT ->
                              SystemAssistant.current?.present(intent)

                          BackgroundLaunchPolicy.Route.NOTIFICATION -> {
                              pendingActivity = intent
                              updateNotification(
                                  "Gama está ouvindo • toque em Continuar pedido se o visual não abrir"
                              )
                          }
                      }
                  } catch (e: Exception) {
                      Log.w(
                          TAG,
                          "Não foi possível abrir o visual da tela bloqueada",
                          e
                      )
                      pendingActivity = intent
                      updateNotification(
                          "Gama está ouvindo • toque em Continuar pedido se o visual não abrir"
                      )
                  }

                  uiHandler.postDelayed({
                      if (
                          running &&
                          isDeviceLocked() &&
                          conversation.active
                      ) {
                          sendLockConversationUi(
                              GamaLockConversationActivity.ACTION_LISTENING
                          )
                      }
                  }, 220L)
              }
          }

          '''
              if show_marker not in s:
                  raise SystemExit('showWakeUi não encontrado.')
              s = s.replace(show_marker, helper + show_marker, 1)

          locked_branch = '''        if (isDeviceLocked()) {
              showLockConversationUi()
              return
          }
          '''
          if locked_branch not in s:
              s = must_replace(
                  s,
                  show_marker,
                  show_marker + locked_branch,
                  'showWakeUi/tela bloqueada',
              )

          hide_marker = '    private fun hideWakeUi() {\n'
          close_line = '''        sendLockConversationUi(
              GamaLockConversationActivity.ACTION_CLOSE
          )
          '''
          if close_line not in s:
              s = must_replace(
                  s,
                  hide_marker,
                  hide_marker + close_line,
                  'hideWakeUi',
              )

          begin_marker = '    private fun beginCommandWindow() {\n'
          listen_line = '''        if (conversation.active && isDeviceLocked()) {
              sendLockConversationUi(
                  GamaLockConversationActivity.ACTION_LISTENING
              )
          }
          '''
          if listen_line not in s:
              s = must_replace(
                  s,
                  begin_marker,
                  begin_marker + listen_line,
                  'beginCommandWindow',
              )

          thinking = '''        if (conversation.active && isDeviceLocked()) {
              sendLockConversationUi(
                  GamaLockConversationActivity.ACTION_THINKING
              )
          }
          '''
          assistant_add = '        AssistantRuntime.add(true, command)\n'
          if thinking not in s:
              s = must_replace(
                  s,
                  assistant_add,
                  thinking + assistant_add,
                  'executeAndReply/pensando',
              )

          speak_marker = '        if (!ttsReady) {\n'
          speaking = '''        if (isDeviceLocked()) {
              sendLockConversationUi(
                  GamaLockConversationActivity.ACTION_SPEAKING
              )
          }
          '''
          if speaking not in s:
              s = must_replace(
                  s,
                  speak_marker,
                  speaking + speak_marker,
                  'speak/falando',
              )

          service.write_text(s, encoding='utf-8')

          print('Gama 4.4 patch aplicado:')
          print('  visual animado exclusivo da tela bloqueada')
          print('  estados ouvindo / pensando / falando')
          print('  sessão de conversa contínua por voz por até 60 minutos de silêncio')
          PY_PATCH

          test -f app/src/main/java/com/gama/assistant/GamaLockConversationActivity.kt
          grep -q 'Gama 4.4' app/build.gradle.kts
          grep -q 'showLockConversationUi' app/src/main/java/com/gama/assistant/GamaService.kt


      - name: Verify restored and patched source integrity
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_INTEGRITY'
          from pathlib import Path
          required = [
              'README.md',
              'app/build.gradle.kts',
              'app/src/main/AndroidManifest.xml',
              'app/src/main/java/com/gama/assistant/ConversationSession.kt',
              'app/src/main/java/com/gama/assistant/GamaLockConversationActivity.kt',
              'app/src/main/java/com/gama/assistant/GamaPulse.kt',
              'app/src/main/java/com/gama/assistant/SmartFeatures.kt',
              'app/src/main/java/com/gama/assistant/GamaService.kt',
              'app/src/test/java/com/gama/assistant/ConversationSessionTest.kt',
              'tools/download_models.sh',
          ]
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit('Arquivos obrigatórios ausentes: ' + ', '.join(missing))
          if len(list(Path('app/src/main/java/com/gama/assistant').glob('*.kt'))) < 15:
              raise SystemExit('Fonte Kotlin incompleto após restauração.')
          service = Path('app/src/main/java/com/gama/assistant/GamaService.kt').read_text(encoding='utf-8')
          manifest = Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          lock = Path('app/src/main/java/com/gama/assistant/GamaLockConversationActivity.kt').read_text(encoding='utf-8')
          checks = [
              ('CONVERSATION_IDLE_TIMEOUT_MS = 60L * 60L * 1000L', service),
              ('showLockConversationUi', service),
              ('sendLockConversationUi', service),
              ('GamaLockConversationActivity', manifest),
              ('Estou ouvindo', lock),
              ('Pensando', lock),
              ('Falando', lock),
          ]
          for marker, body in checks:
              if marker not in body:
                  raise SystemExit('Marcador obrigatório ausente: ' + marker)
          print('Integridade estrutural OK:', len(required), 'arquivos principais validados.')
          PY_INTEGRITY

      - name: Apply Gama 4.7 identity, orange UI and private session
        working-directory: _gama_build
        run: |
          set -euo pipefail
          cat > /tmp/gama47.run.gz.b64 <<'GAMA47_RUN'
