          write(
              src / "SemanticEndpointer.kt",
              r'''
              package com.gama.assistant

              import java.text.Normalizer
              import java.util.Locale

              object SemanticEndpointer {

                  private val unfinishedEndings = setOf(
                      "e",
                      "mas",
                      "porque",
                      "pois",
                      "entao",
                      "tipo",
                      "quando",
                      "onde",
                      "para",
                      "pra",
                      "com",
                      "sem",
                      "se",
                      "que",
                      "o",
                      "a",
                      "um",
                      "uma",
                      "meu",
                      "minha",
                      "de",
                      "do",
                      "da",
                  )

                  private val unfinishedPrefixes = listOf(
                      "eu queria",
                      "eu quero que",
                      "eu estava pensando",
                      "eu tava pensando",
                      "eu acho que",
                      "eu pensei em",
                      "mas",
                      "porque",
                      "e ai",
                      "e aí",
                      "abre o",
                      "abra o",
                      "abre a",
                      "abra a",
                      "manda uma mensagem para",
                      "mande uma mensagem para",
                      "envia uma mensagem para",
                      "envie uma mensagem para",
                      "fala para",
                      "fale para",
                  )

                  fun looksIncomplete(raw: String): Boolean {
                      val n = normalize(raw)

                      if (n.isBlank()) return true

                      val words =
                          n.split(' ')
                              .filter {
                                  it.isNotBlank()
                              }

                      val last =
                          words.lastOrNull()
                              ?: return true

                      if (last in unfinishedEndings) {
                          return true
                      }

                      if (
                          unfinishedPrefixes.any {
                              n == it ||
                                  n.endsWith(it)
                          }
                      ) {
                          return true
                      }

                      if (
                          Regex(
                              "\\b(?:abre|abra|envie|manda|mande|" +
                                  "fala|fale|avisa|avise)\\s+" +
                                  "(?:o|a|um|uma|para|pra)$"
                          ).containsMatchIn(n)
                      ) {
                          return true
                      }

                      if (
                          Regex(
                              "\\b(?:eu queria|eu estava pensando|" +
                                  "eu tava pensando|eu acho que)\\b"
                          ).containsMatchIn(n) &&
                          words.size <= 8
                      ) {
                          return true
                      }

                      return false
                  }

                  fun requiredSilenceMs(
                      raw: String,
                      confidence: Double = 1.0,
                  ): Long = when {
                      looksIncomplete(raw) -> 3_600L

                      confidence.isFinite() &&
                          confidence >= 0.0 &&
                          confidence < 0.45 -> 2_700L

                      else -> 1_650L
                  }

                  fun continuationWindowMs(
                      raw: String,
                      confidence: Double = 1.0,
                  ): Long =
                      when {
                          looksIncomplete(raw) -> 3_600L

                          confidence.isFinite() &&
                              confidence >= 0.0 &&
                              confidence < 0.45 -> 2_500L

                          else -> 700L
                      }

                  fun merge(
                      first: String,
                      second: String,
                  ): String {
                      val a =
                          first
                              .trim()
                              .replace(
                                  Regex("\\s+"),
                                  " "
                              )

                      val b =
                          second
                              .trim()
                              .replace(
                                  Regex("\\s+"),
                                  " "
                              )

                      if (a.isBlank()) return b
                      if (b.isBlank()) return a

                      val an = normalize(a)
                      val bn = normalize(b)

                      if (an == bn) return b

                      if (bn.startsWith(an)) {
                          return b
                      }

                      if (an.endsWith(bn)) {
                          return a
                      }

                      return "$a $b"
                          .replace(
                              Regex("\\s+"),
                              " "
                          )
                          .trim()
                  }

                  private fun normalize(
                      value: String
                  ): String =
                      Normalizer.normalize(
                          value.lowercase(
                              Locale.ROOT
                          ),
                          Normalizer.Form.NFD,
                      )
                          .replace(
                              Regex("\\p{M}+"),
                              ""
                          )
                          .replace(
                              Regex("[^a-z0-9 ]+"),
                              " "
                          )
                          .replace(
                              Regex("\\s+"),
                              " "
                          )
                          .trim()
              }
              '''
          )

