          package com.gama.assistant

          import android.util.Log
          import java.text.Normalizer
          import java.util.Locale

          object GamaNextRouter {
              private const val TAG = "GamaNextRouter"

              fun handleAsync(service: GamaService, raw: String, callback: (String) -> Unit): Boolean {
                  try {
                      GamaSilentContext.handle(service, raw)?.let {
                          callback(it)
                          return true
                      }

                      if (GamaWhatsAppDialogue.handleAsync(service, raw, callback)) return true

                      GamaExamRouter.handle(service, raw)?.let {
                          callback(it)
                          return true
                      }

                      GamaSystemStatus.handle(service, raw)?.let {
                          callback(it)
                          return true
                      }

                      if (isNotificationDigestRequest(raw)) {
                          callback(GamaNotificationIntelligence.digest(service))
                          return true
                      }

                      GamaTimerRouter.handle(service, raw)?.let {
                          callback(it)
                          return true
                      }

                      GamaWebsiteRouter.handle(service, raw)?.let {
                          callback(it)
                          return true
                      }

                      GamaSystemActionRouter.handle(service, raw)?.let {
                          callback(it)
                          return true
                      }

                      return false
                  } catch (error: Throwable) {
                      Log.e(TAG, "Ferramenta isolada falhou", error)
                      callback("Não consegui concluir essa parte, mas continuo ouvindo. Podemos tentar de outro jeito.")
                      return true
                  }
              }

              private fun isNotificationDigestRequest(raw: String): Boolean {
                  val text = normalize(raw)

                  return listOf(
                      "o que chegou enquanto eu estava ocupado",
                      "o que chegou enquanto estava ocupado",
                      "o que eu perdi enquanto estava ocupado",
                      "o que chegou enquanto eu estava em aula",
                      "o que chegou enquanto eu estava na prova",
                      "resuma minhas notificacoes",
                      "resumo das notificacoes",
                  ).any { it in text }
              }

              private fun normalize(value: String): String =
                  Normalizer.normalize(value.lowercase(Locale("pt", "BR")), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}+"), "")
                      .replace(Regex("[^a-z0-9 ]+"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
          }
