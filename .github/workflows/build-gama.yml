            "$SRC/GamaPersonalCore.kt"
            "$SRC/GamaSuperAssistantCore.kt"
            "$SRC/VoicePolicy.kt"
            "$SRC/ZevronPlanner.kt"
          )

          for file in "${required[@]}"; do
            test -s "$file"
          done

          if grep -R \
            -Fq \
            'OwnerIdentity.name(context)' \
            "$SRC"
          then
            echo "::error::Referência inexistente OwnerIdentity ainda presente."
            exit 1
          fi

          grep -Fq \
            'GamaNextRouter.handleAsync' \
            "$SRC/GamaService.kt"

          grep -Fq \
