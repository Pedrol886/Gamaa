name: Build Gama 10.1.0 JARVIS Continuity Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-10-1-jarvis-continuity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      # PRIMEIRA REGRA DESTA BUILD:
      # partir diretamente do GAMA 10 verde do run #156.
      GAMA_BASE_RUN_ID: "37226292316"
      GAMA_BASE_ARTIFACT: "Gama-10.0.0-JARVIS-CONTEXT-source"

      GAMA_EXPECTED_CERT_SHA256: "6933EDA890C29567A8F4B6CEAD7A39A442DF109D43B813A19F3F6FA7F39B078C"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-10.1.0-JARVIS-CONTINUITY-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"

            echo "::warning::GAMA_SIGNING_SEED não está configurado."
            echo "::warning::O APK será Release, mas será FRESH-INSTALL-ONLY."

          elif printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-10.1.0-JARVIS-CONTINUITY-APK" >> "$GITHUB_OUTPUT"

          else
            echo "::error::GAMA_SIGNING_SEED deve possuir exatamente 64 caracteres hexadecimais."
            exit 1
          fi

      - name: Restore exact successful Gama 10 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download \
            "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaEnergyView.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaFaceGateActivity.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaFaceSessionCoordinator.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaPersonalCore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaKnowledgePolicy.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaSpokenNumbers.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaRepeatTool.kt

          grep -Fq \
            'versionName = "Gama 10.0.0 JARVIS Context Core"' \
            _gama_build/app/build.gradle.kts

          grep -Fq \
            'isDebuggable = false' \
            _gama_build/app/build.gradle.kts

          echo "PASS: source verde do GAMA 10 / run #156 restaurado."

      - name: Apply Gama 10.1 JARVIS Continuity upgrade
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"

          # ==========================================================
          # 1. VISUAL CONFIÁVEL
          #
          # A logo recortada em mandíbula era visualmente frágil.
          # Voltamos ao núcleo/esfera vermelha mantendo:
          # LISTENING / THINKING / SPEAKING.
          # ==========================================================

          cat > "$SRC/GamaEnergyView.kt" <<'KOTLIN'
          package com.gama.assistant

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.util.AttributeSet
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.sin

          /**
           * GAMA Red Orb.
           *
           * Visual simples e resistente:
           *
           * LISTENING -> pulso calmo
           * THINKING  -> rotação/pulso rápido
           * SPEAKING  -> oscilações curtas que acompanham o estado de fala
           *
           * Não usa microfone para animar.
           * Isso evita que o visual interfira no pipeline de voz.
           */
          class GamaEnergyView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null,
          ) : View(context, attrs) {

              enum class Mode {
                  LISTENING,
                  THINKING,
                  SPEAKING,
              }

              var mode: Mode = Mode.LISTENING
                  set(value) {
                      field = value
                      invalidate()
                  }

              private val corePaint =
                  Paint(Paint.ANTI_ALIAS_FLAG)

              private val glowPaint =
                  Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.FILL
                  }

              private val ringPaint =
                  Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeCap = Paint.Cap.ROUND
                  }

              private val innerRingPaint =
                  Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeCap = Paint.Cap.ROUND
                  }

              private var phase = 0f
              private var released = false

              private val animator =
                  ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 1200L
                      repeatCount = ValueAnimator.INFINITE
                      interpolator = LinearInterpolator()

                      addUpdateListener {
                          phase = it.animatedValue as Float
                          invalidate()
                      }
                  }

              init {
                  setLayerType(
                      LAYER_TYPE_SOFTWARE,
                      null,
                  )

                  animator.start()
              }

              override fun onDraw(
                  canvas: Canvas,
              ) {
                  super.onDraw(canvas)

                  if (
                      width <= 0 ||
                      height <= 0
                  ) {
                      return
                  }

                  val size =
                      minOf(
                          width,
                          height,
                      ).toFloat()

                  val cx =
                      width / 2f

                  val cy =
                      height / 2f

                  val time =
                      phase *
                          (PI * 2.0)

                  val listeningWave =
                      (
                          0.5 +
                              0.5 *
                              sin(
                                  time * 1.25
                              )
                          ).toFloat()

                  val thinkingWave =
                      (
                          0.5 +
                              0.5 *
                              sin(
                                  time * 3.1
                              )
                          ).toFloat()

                  val speakingWave =
                      (
                          abs(
                              sin(
                                  time * 3.7
                              )
                          ) * 0.50 +
                              abs(
                                  sin(
                                      time * 6.3 +
                                          0.8
                                  )
                              ) * 0.30 +
                              abs(
                                  sin(
                                      time * 9.1 +
                                          1.4
                                  )
                              ) * 0.20
                          )
                          .toFloat()
                          .coerceIn(
                              0f,
                              1f,
                          )

                  val wave =
                      when (mode) {
                          Mode.LISTENING ->
                              listeningWave

                          Mode.THINKING ->
                              thinkingWave

                          Mode.SPEAKING ->
                              speakingWave
                      }

                  val coreRadius =
                      size *
                          (
                              0.205f +
                                  wave *
                                  when (mode) {
                                      Mode.LISTENING ->
                                          0.006f

                                      Mode.THINKING ->
                                          0.012f

                                      Mode.SPEAKING ->
                                          0.025f
                                  }
                              )

                  // Aura externa.
                  val glowRadius =
                      size *
                          (
                              0.33f +
                                  wave * 0.018f
                              )

                  glowPaint.color =
                      Color.argb(
                          when (mode) {
                              Mode.LISTENING ->
                                  35

                              Mode.THINKING ->
                                  55

                              Mode.SPEAKING ->
                                  75
                          },
                          255,
                          24,
                          35,
                      )

                  glowPaint.setShadowLayer(
                      size * 0.17f,
                      0f,
                      0f,
                      Color.rgb(
                          190,
                          0,
                          18,
                      ),
                  )

                  canvas.drawCircle(
                      cx,
                      cy,
                      glowRadius,
                      glowPaint,
                  )

                  glowPaint.clearShadowLayer()

                  // Núcleo luminoso.
                  corePaint.shader =
                      RadialGradient(
                          cx - coreRadius * 0.20f,
                          cy - coreRadius * 0.22f,
                          coreRadius * 1.22f,
                          intArrayOf(
                              Color.rgb(
                                  255,
                                  225,
                                  225,
                              ),
                              Color.rgb(
                                  255,
                                  78,
                                  86,
                              ),
                              Color.rgb(
                                  212,
                                  6,
                                  27,
                              ),
                              Color.rgb(
                                  80,
                                  0,
                                  10,
                              ),
                          ),
                          floatArrayOf(
                              0f,
                              0.20f,
                              0.62f,
                              1f,
                          ),
                          Shader.TileMode.CLAMP,
                      )

                  corePaint.setShadowLayer(
                      size * 0.09f,
                      0f,
                      0f,
                      Color.rgb(
                          255,
                          20,
                          35,
                      ),
                  )

                  canvas.drawCircle(
                      cx,
                      cy,
                      coreRadius,
                      corePaint,
                  )

                  corePaint.clearShadowLayer()
                  corePaint.shader = null

                  // Anel principal.
                  ringPaint.strokeWidth =
                      (
                          size *
                              0.012f
                          )
                          .coerceAtLeast(
                              2f
                          )

                  ringPaint.color =
                      Color.argb(
                          when (mode) {
                              Mode.LISTENING ->
                                  120

                              Mode.THINKING ->
                                  185

                              Mode.SPEAKING ->
                                  225
                          },
                          255,
                          45,
                          55,
                      )

                  ringPaint.setShadowLayer(
                      size * 0.04f,
                      0f,
                      0f,
                      Color.rgb(
                          255,
                          22,
                          35,
                      ),
                  )

                  canvas.drawCircle(
                      cx,
                      cy,
                      size *
                          (
                              0.285f +
                                  wave *
                                  0.012f
                              ),
                      ringPaint,
                  )

                  ringPaint.clearShadowLayer()

                  // Segundo anel dá leitura visual de atividade.
                  innerRingPaint.strokeWidth =
                      (
                          size *
                              0.005f
                          )
                          .coerceAtLeast(
                              1.5f
                          )

                  innerRingPaint.color =
                      Color.argb(
                          when (mode) {
                              Mode.LISTENING ->
                                  75

                              Mode.THINKING ->
                                  120

                              Mode.SPEAKING ->
                                  160
                          },
                          255,
                          110,
                          115,
                      )

                  canvas.drawCircle(
                      cx,
                      cy,
                      size *
                          (
                              0.245f +
                                  wave *
                                  0.007f
                              ),
                      innerRingPaint,
                  )
              }

              fun release() {
                  if (!released) {
                      released = true
                      animator.cancel()
                  }
              }

              override fun onDetachedFromWindow() {
                  release()
                  super.onDetachedFromWindow()
              }
          }
          KOTLIN

          # ==========================================================
          # 2. CONTINUIDADE DE LOCK/UNLOCK
          # 3. FACE GATE REAL
          # 4. WATCHDOG DO MICROFONE
          # ==========================================================

          python3 - <<'PY'
          from pathlib import Path
          import re

          service_path = Path(
              "app/src/main/java/com/gama/assistant/GamaService.kt"
          )

          manifest_path = Path(
              "app/src/main/AndroidManifest.xml"
          )

          service = service_path.read_text(
              encoding="utf-8"
          )

          manifest = manifest_path.read_text(
              encoding="utf-8"
          )

          def replace_once(
              value: str,
              old: str,
              new: str,
              label: str,
          ) -> str:
              count = value.count(old)

              if count != 1:
                  raise SystemExit(
                      f"{label}: expected 1 occurrence, found {count}"
                  )

              return value.replace(
                  old,
                  new,
                  1,
              )

          def replace_region(
              value: str,
              start_marker: str,
              end_marker: str,
              replacement: str,
              label: str,
          ) -> str:
              start = value.find(
                  start_marker
              )

              if start < 0:
                  raise SystemExit(
                      f"{label}: start marker not found"
                  )

              end = value.find(
                  end_marker,
                  start,
              )

              if end < 0:
                  raise SystemExit(
                      f"{label}: end marker not found"
                  )

              return (
                  value[:start] +
                  replacement.rstrip() +
                  value[end:]
              )

          # ----------------------------------------------------------
          # Estado de continuidade.
          # ----------------------------------------------------------

         
