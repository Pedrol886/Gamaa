name: Build Gama 8.2.2 JARVIS 2000 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-8-2-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GAMA_BASE_RUN_ID: "37091773618"
      GAMA_BASE_ARTIFACT: "Gama-8.2.0-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete compiled Gama source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaAdaptiveMemory.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaRecoveryCoordinator.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaVisionCore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/LocalBrain.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/AiSetup.kt

      - name: Verify JARVIS 2000 core
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"

          grep -Fq \
            'GAMA2000_LOCAL_VISION_ROUTER' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'ACTION_UI_PULSE' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaAdaptiveMemory' \
            "$SRC/GamaSuperAssistantCore.kt"

          grep -Fq \
            'GamaRecoveryCoordinator.nextDelayMs(' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaMissionStore' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaProactiveBridge' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaAutomationEngine' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'interruptSpeechForBargeIn' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'LlmInference' \
            "$SRC/LocalBrain.kt"

          grep -Fq \
            'implementation("com.google.mediapipe:tasks-genai:0.10.27")' \
            app/build.gradle.kts

          grep -Fq \
            'implementation("com.google.mlkit:text-recognition:16.0.1")' \
            app/build.gradle.kts

          echo "JARVIS 2000 source verified."

      - name: Harden AI installer
        run: |
          set -euo pipefail

          SRC="_gama_build/app/src/main/java/com/gama/assistant"
          MAIN="$SRC/MainActivity.kt"
          AI="$SRC/AiSetup.kt"

          test -s "$MAIN"
          test -s "$AI"

          cat > "$SRC/GamaModelInstallPolicy.kt" <<'EOF'
          package com.gama.assistant

          object GamaModelInstallPolicy {

              const val MIN_MODEL_BYTES =
                  100_000_000L

              const val EXPECTED_DOWNLOAD_BYTES =
                  500_000_000L

              const val MAX_IMPORT_BYTES =
                  2_000_000_000L

              const val STALL_TIMEOUT_MS =
                  240_000L

              fun percent(
                  downloaded: Long,
                  total: Long
              ): Int? {

                  if (
                      downloaded < 0L ||
                      total <= 0L
                  ) {
                      return null
                  }

                  return (
                      downloaded
                          .coerceAtMost(total) *
                          100L /
                          total
                  )
                      .toInt()
                      .coerceIn(
                          0,
                          100
                      )
              }

              fun stalled(
                  now: Long,
                  lastProgress: Long,
                  downloaded: Long,
                  previous: Long
              ): Boolean {

                  if (
                      lastProgress <= 0L ||
                      now < lastProgress
                  ) {
                      return false
                  }

                  if (
                      downloaded >
                      previous
                  ) {
                      return false
                  }

                  return (
                      now -
                      lastProgress
                  ) >=
                      STALL_TIMEOUT_MS
              }
          }
          EOF

          python3 - "$MAIN" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          old = '        control("Instalar ou reparar IA offline") { AiSetup.download(this) }\n'

          new = '''        control("Instalar ou reparar IA offline") {
              AiSetup.download(this) { selectModelFile() }
          }
          control("Importar IA do celular") { selectModelFile() }
          '''

          if old in s:
              s = s.replace(
                  old,
                  new,
                  1
              )

          s = s.replace(
              'AiSetup.download(this)',
              'AiSetup.download(this) { selectModelFile() }'
          )

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

          python3 - "$AI" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          s = s.replace(
              '"IA: baixando 0 MB..."',
              '"IA: conectando ao servidor do modelo..."'
          )

          s = s.replace(
              '"IA: baixando ${downloaded / 1_000_000} MB..."',
              '''
              if (downloaded <= 0L) {
                  "IA: conexão iniciada; aguardando os primeiros dados..."
              } else {
                  "IA: baixando ${downloaded / 1_000_000} MB..."
              }
              '''.strip()
          )

          p.write_text(
              s,
              encoding="utf-8"
          )
          PY

          mkdir -p \
            _gama_build/app/src/test/java/com/gama/assistant

          cat > _gama_build/app/src/test/java/com/gama/assistant/GamaModelInstallPolicyTest.kt <<'EOF'
          package com.gama.assistant

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertNull
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class GamaModelInstallPolicyTest {

              @Test
              fun progressWorks() {

                  assertNull(
                      GamaModelInstallPolicy.percent(
                          0L,
                          -1L
                      )
                  )

                  assertEquals(
                      50,
                      GamaModelInstallPolicy.percent(
                          250L,
                          500L
                      )
                  )

                  assertEquals(
                      100,
                      GamaModelInstallPolicy.percent(
                          900L,
                          500L
                      )
                  )
              }

              @Test
              fun stalledDownloadDetectionWorks() {

                  val now =
                      1_000_000L

                  assertFalse(
                      GamaModelInstallPolicy.stalled(
                          now,
                          now - 30_000L,
                          0L,
                          0L
                      )
                  )

                  assertTrue(
                      GamaModelInstallPolicy.stalled(
                          now,
                          now -
                              GamaModelInstallPolicy
                                  .STALL_TIMEOUT_MS,
                          0L,
                          0L
                      )
                  )

                  assertFalse(
                      GamaModelInstallPolicy.stalled(
                          now,
                          now -
                              GamaModelInstallPolicy
                                  .STALL_TIMEOUT_MS,
                          100L,
                          0L
                      )
                  )
              }
          }
          EOF

          grep -Fq \
            'control("Importar IA do celular")' \
            "$MAIN"

          test -s \
            "$SRC/GamaModelInstallPolicy.kt"

          echo "AI installer patch applied."

      - name: Audit Gama capabilities
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 tools/audit_gama.py

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          test -d "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" \
            >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" \
            >> "$GITHUB_ENV"

          SDKMANAGER="$(
            command -v sdkmanager ||
            true
          )"

          if [
            -z "$SDKMANAGER"
          ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

          yes |
            "$SDKMANAGER" \
              --licenses \
              >/dev/null ||
            true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -x \
            "$SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Gama 8.2.2 version
        working-directory: _gama_build
        run: |
          set -euo pipefail

          VC=$((22600000 + GITHUB_RUN_NUMBER))

          sed -Ei \
            "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $VC/" \
            app/build.gradle.kts

          sed -Ei \
            's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "Gama 8.2.2"/' \
            app/build.gradle.kts

          grep -F \
            'versionName = "Gama 8.2.2"' \
            app/build.gradle.kts

      - name: Run regression tests
        working-directory: _gama_build
        run: |
          set -euo pipefail

          gradle \
            :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            --tests 'com.gama.assistant.GamaRecognitionPolicyTest' \
            --tests 'com.gama.assistant.GamaAudioFrontEndTest' \
            --tests 'com.gama.assistant.ConversationSessionTest' \
            --tests 'com.gama.assistant.VoicePolicyTest' \
            --tests 'com.gama.assistant.ActionFollowUpTest' \
            --tests 'com.gama.assistant.GamaSpeechNoisePolicyTest' \
            --tests 'com.gama.assistant.GamaModelInstallPolicyTest' \
            2>&1 |
            tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Build Gama APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          if [
            -x tools/download_models.sh
          ]; then
            bash tools/download_models.sh
          fi

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 |
            tee "$GITHUB_WORKSPACE/gama-build.log"

          mkdir -p dist

          APK="$(
            find app/build/outputs/apk/debug \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          test -n "$APK"
          test -s "$APK"

          cp "$APK" \
            dist/Gama.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            dist/Gama.apk

          (
            cd dist
            sha256sum \
              Gama.apk \
              > Gama.apk.sha256
          )

      - name: Upload Gama APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.2.2-JARVIS-2000-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Upload complete source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.2.2-JARVIS-2000-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="gama-v8.2.2-jarvis-2000-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 8.2.2 JARVIS 2000" \
            --notes "JARVIS 2000 core, local AI, voice conversation, Vosk, anti-noise, barge-in, adaptive memory, planner, automation, proactivity, OCR, screen vision, Accessibility and automatic recovery." \
            --latest

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.2.2-JARVIS-2000-diagnostics
          path: |
            gama-build.log
            gama-tests.log
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn
