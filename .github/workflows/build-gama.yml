name: Build Gama 8.4.0 JARVIS Anti-Phantom APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-8-4-0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GAMA_BASE_RUN_ID: "37128415732"
      GAMA_BASE_ARTIFACT: "Gama-8.3.3-JARVIS-TOOLS-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore successful Gama 8.3.3 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml

          SRC="_gama_build/app/src/main/java/com/gama/assistant"

          test -s "$SRC/GamaService.kt"
          test -s "$SRC/ConversationSession.kt"
          test -s "$SRC/GamaRecognitionPolicy.kt"
          test -s "$SRC/GamaProactivePolicy.kt"
          test -s "$SRC/GamaNotificationListener.kt"
          test -s "$SRC/GamaVisionCore.kt"
          test -s "$SRC/GamaScreenContextService.kt"
          test -s "$SRC/GamaInternetHub.kt"
          test -s "$SRC/LocalBrain.kt"

          echo "Gama 8.3.3 source restored from successful build #127."

      - name: Apply Gama 8.4.0 anti-phantom hotfix
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          src = root / "app/src/main/java/com/gama/assistant"
          tests = root / "app/src/test/java/com/gama/assistant"

          # =========================================================
          # 1. GOODBYE POLICY
          # =========================================================

          path = src / "ConversationSession.kt"
          text = path.read_text(encoding="utf-8")

          start_marker = (
              "        /** Only a deliberate goodbye closes "
              "the continuous session. */"
          )

          end_marker = "        private fun stripAssistant"

          if start_marker not in text:
              raise SystemExit(
                  "ConversationSession goodbye block not found."
              )

          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = '''        /** Only an explicit, deliberate goodbye closes the continuous session. */
          fun isGoodbye(command: String): Boolean {
              val c = stripAssistant(normalize(command))
              return c in setOf(
                  "tchau",
                  "ate mais",
                  "pode descansar",
                  "pode descansa",
                  "voce pode descansar",
                  "pode ir descansar",
                  "vai descansar",
                  "va descansar",
                  "pare de ouvir",
                  "pode parar de ouvir",
                  "encerrar conversa",
                  "encerre a conversa",
                  "encerra a conversa",
                  "pode parar por agora",
                  "pode encerrar por agora"
              )
          }

          '''

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")

          # =========================================================
          # 2. SPEECH RECOGNITION POLICY
          # =========================================================

          path = src / "GamaRecognitionPolicy.kt"
          text = path.read_text(encoding="utf-8")

          old = '''            "sim", "nao", "pode", "confirmo", "pare", "cancele", "cancelar",
                      "continue", "continua", "tchau", "descansa", "descanse",
                      "pode descansar", "pode descansa"
          '''

          new = '''            "sim", "nao", "pode", "confirmo", "pare", "cancele", "cancelar",
                      "continue", "continua", "tchau"
          '''

          if old not in text:
              raise SystemExit(
                  "Recognition short-control block not found."
              )

          text = text.replace(old, new, 1)

          old = '''        if (text.isBlank()) return false
                  if (GamaCriticalCommandPolicy.isLockScreen(text)) return true
                  return commandSpeechStarted || recentVoiceEvidence || isShortControl(text)
          '''

          new = '''        if (text.isBlank()) return false
                  if (GamaCriticalCommandPolicy.isLockScreen(text)) return true

                  if (ConversationSession.isGoodbye(text)) {
                      return commandSpeechStarted && recentVoiceEvidence
                  }

                  return commandSpeechStarted || recentVoiceEvidence || isShortControl(text)
          '''

          if old not in text:
              raise SystemExit(
                  "Recognition acceptance block not found."
              )

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          # =========================================================
          # 3. PROACTIVE POLICY
          #
          # Repeated normal messages do not magically become urgent.
          # =========================================================

          path = src / "GamaProactivePolicy.kt"
          text = path.read_text(encoding="utf-8")

          old = '''        if (urgentTerms.any { normalize(it) in n }) return GamaEventHub.Priority.HIGH
                  if (recentSameSender >= 1) return GamaEventHub.Priority.HIGH
                  return GamaEventHub.Priority.NORMAL
          '''

          new = '''        if (urgentTerms.any { normalize(it) in n }) {
                      return GamaEventHub.Priority.HIGH
                  }

                  return GamaEventHub.Priority.NORMAL
          '''

          if old not in text:
              raise SystemExit(
                  "Proactive priority block not found."
              )

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          # =========================================================
          # 4. GAMA SERVICE
          # =========================================================

          path = src / "GamaService.kt"
          text = path.read_text(encoding="utf-8")

          # ---------------------------------------------------------
          # Strict sleep grammar
          # ---------------------------------------------------------

          old = '''                    "[\\"pode descansar\\", \\"descanse\\", \\"descansa\\", \\"pode ir descansar\\", \\"vai descansar\\", \\"va descansar\\", \\"pare de ouvir\\", \\"pode parar de ouvir\\", \\"pode parar por agora\\", \\"encerrar conversa\\", \\"tchau\\", \\"ate mais\\", \\"[unk]\\"]"
          '''

          new = '''                    "[\\"pode descansar\\", \\"pode descansa\\", \\"voce pode descansar\\", \\"pode ir descansar\\", \\"vai descansar\\", \\"va descansar\\", \\"pare de ouvir\\", \\"pode parar de ouvir\\", \\"pode parar por agora\\", \\"encerrar conversa\\", \\"encerre a conversa\\", \\"tchau\\", \\"ate mais\\", \\"[unk]\\"]"
          '''

          if old not in text:
              raise SystemExit(
                  "Sleep recognizer grammar not found."
              )

          text = text.replace(old, new, 1)

          # ---------------------------------------------------------
          # Dedicated sleep recognizer
          #
          # Never closes on partial recognition anymore.
          # ---------------------------------------------------------

          old = '''                // Highest-priority conversation exit path. It runs before the
                  // normal decoder/confidence gates, so "pode descansar" cannot
                  // become a generic retry even in wind or crowd noise.
                  val dedicatedSleep = sleepRecognizer
                  if (conversation.active && transcription == null &&
                      !ownerEnrollmentMode && !ownerRetryPending && dedicatedSleep != null) {
                      val sleepEndpoint = dedicatedSleep.acceptWaveForm(buffer, read)
                      var sleepText = ""
                      if (sleepEndpoint) {
                          sleepText = try { JSONObject(dedicatedSleep.result).optString("text") } catch (_: Exception) { "" }
                      } else if (now - lastDedicatedSleepPartialAt >= 100L) {
                          lastDedicatedSleepPartialAt = now
                          sleepText = try { JSONObject(dedicatedSleep.partialResult).optString("partial") } catch (_: Exception) { "" }
                      }
                      val normalizedSleep = norm(sleepText)
                      val restStem = normalizedSleep.split(" ").any {
                          it.startsWith("descans") || it.startsWith("descanc") || it.startsWith("descenc")
                      }
                      val strongRestPhrase = restStem ||
                          normalizedSleep.contains("pare de ouvir") ||
                          normalizedSleep.contains("encerrar conversa")
                      val acousticOk = !audioMetrics.windLikely &&
                          (audioMetrics.speechLikely || audioMetrics.snrDb >= 2.0)
                      if (ConversationSession.isGoodbye(sleepText) && (strongRestPhrase || acousticOk)) {
                          dedicatedSleep.reset()
                          wakeRecognizer?.reset()
                          rec.reset()
                          decoderActive = false
                          lastPartial = ""
                          preRoll = ByteArray(0)
                          wakePreRoll = ByteArray(0)
                          closeConversationForGoodbye()
                          continue
                      }
                      if (sleepEndpoint) dedicatedSleep.reset()
                  } else {
                      dedicatedSleep?.reset()
                  }
          '''

          new = '''                // Sleep is deliberately conservative.
                  // A partial/background match can NEVER close the conversation.
                  val dedicatedSleep = sleepRecognizer

                  if (
                      conversation.active &&
                      transcription == null &&
                      !ownerEnrollmentMode &&
                      !ownerRetryPending &&
                      dedicatedSleep != null
                  ) {
                      val sleepEndpoint =
                          dedicatedSleep.acceptWaveForm(buffer, read)

                      if (sleepEndpoint) {

                          val sleepText = try {
                              JSONObject(
                                  dedicatedSleep.result
                              ).optString("text")
                          } catch (_: Exception) {
                              ""
                          }

                          val acousticOk =
                              GamaRecognitionPolicy.hasVoiceEvidence(
                                  audioMetrics
                              ) || audioMetrics.speechLikely

                          if (
                              acousticOk &&
                              ConversationSession.isGoodbye(
                                  sleepText
                              )
                          ) {
                              dedicatedSleep.reset()
                              wakeRecognizer?.reset()
                              rec.reset()

                              decoderActive = false
                              lastPartial = ""

                              preRoll = ByteArray(0)
                              wakePreRoll = ByteArray(0)

                              closeConversationForGoodbye()
                              continue
                          }

                          dedicatedSleep.reset()
                      }
                  } else {
                      dedicatedSleep?.reset()
                  }
          '''

          if old not in text:
              raise SystemExit(
                  "Dedicated sleep block not found."
              )

          text = text.replace(old, new, 1)

          # ---------------------------------------------------------
          # Idle assistant is SILENT.
          #
          # Important events can be remembered, but they do not
          # suddenly become speech when nobody called Gama.
          # ---------------------------------------------------------

          old = '''    private fun handleProactiveEvent(event: GamaEventHub.Event) {
                  if (!running || event.priority != GamaEventHub.Priority.HIGH) return
                  val now = SystemClock.elapsedRealtime()
          '''

          new = '''    private fun handleProactiveEvent(event: GamaEventHub.Event) {
                  if (
                      !running ||
                      event.priority != GamaEventHub.Priority.HIGH
                  ) return

                  if (!conversation.active) {
                      updateNotification(
                          "Atividade importante registrada • diga Gama para conversar"
                      )
                      return
                  }

                  val wallAge =
                      System.currentTimeMillis() - event.occurredAt

                  if (wallAge !in 0L..20_000L) {
                      return
                  }

                  val now = SystemClock.elapsedRealtime()
          '''

          if old not in text:
              raise SystemExit(
                  "Proactive event block not found."
              )

          text = text.replace(old, new, 1)

          # ---------------------------------------------------------
          # Never drain old proactive speech while idle.
          # ---------------------------------------------------------

          old = '''        if (proactiveEvents.isNotEmpty()) {
                      scheduleProactiveDrain(1_200L)
                  }
          '''

          new = '''        if (
                      conversation.active &&
                      proactiveEvents.isNotEmpty()
                  ) {
                      scheduleProactiveDrain(1_200L)
                  } else if (!conversation.active) {
                      proactiveEvents.clear()
                  }
          '''

          if old not in text:
              raise SystemExit(
                  "Proactive drain block not found."
              )

          text = text.replace(old, new, 1)

          # ---------------------------------------------------------
          # Wake word must have actual speech evidence.
          # ---------------------------------------------------------

          old = '''                    if (VoicePolicy.hasWake(wakeText)) {
                          dedicatedWake.reset()
          '''

          new = '''                    val wakeHasSpeech =
                          GamaRecognitionPolicy.hasVoiceEvidence(
                              audioMetrics
                          ) || audioMetrics.speechLikely

                      if (
                          VoicePolicy.hasWake(wakeText) &&
                          wakeHasSpeech
                      ) {
                          dedicatedWake.reset()
          '''

          if old not in text:
              raise SystemExit(
                  "Dedicated wake acceptance block not found."
              )

          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

          # =========================================================
          # 5. NOTIFICATION DEDUPLICATION
          # =========================================================

          path = src / "GamaNotificationListener.kt"
          text = path.read_text(encoding="utf-8")

          anchor = '''    private fun captureSituationEvent(sbn: StatusBarNotification?) {
          '''

          if anchor not in text:
              raise SystemExit(
                  "Notification situation anchor not found."
              )

          helper = r'''
              private fun shouldPublishSituationEvent(
                  sbn: StatusBarNotification,
                  source: String,
                  body: String
              ): Boolean {

                  val now = System.currentTimeMillis()

                  val postedAt =
                      sbn.postTime.takeIf { it > 0L } ?: now

                  // A notification older than this is context,
                  // not something that should create a new event.
                  if (now - postedAt > 90_000L) {
                      return false
                  }

                  val signature = listOf(
                      sbn.packageName,
                      sbn.key,
                      source.trim(),
                      body
                          .replace(Regex("\\s+"), " ")
                          .trim()
                          .take(220)
                  ).joinToString("|")

                  val prefs =
                      getSharedPreferences(
                          "gama_proactive_dedupe",
                          Context.MODE_PRIVATE
                      )

                  val previous =
                      prefs.getString(
                          "signature",
                          null
                      )

                  val previousAt =
                      prefs.getLong(
                          "at",
                          0L
                      )

                  if (
                      signature == previous &&
                      now - previousAt <
                      5L * 60L * 1000L
                  ) {
                      return false
                  }

                  prefs.edit()
                      .putString(
                          "signature",
                          signature
                      )
                      .putLong(
                          "at",
                          now
                      )
                      .apply()

                  return true
              }

          '''

          text = text.replace(
              anchor,
              helper + anchor,
              1
          )

          old = '''        if (title.isBlank() && body.isBlank()) return
                  val source = title.ifBlank { "Mensagem" }.take(100)
                  val recent = GamaEventHub.recentFromSource(this, source, 2L * 60L * 1000L)
          '''

          new = '''        if (title.isBlank() && body.isBlank()) return

                  val source =
                      title.ifBlank { "Mensagem" }
                          .take(100)

                  if (
                      !shouldPublishSituationEvent(
                          sbn,
                          source,
                          body
                      )
                  ) {
                      return
                  }

                  val recent =
                      GamaEventHub.recentFromSource(
                          this,
                          source,
                          2L * 60L * 1000L
                      )
          '''

          if old not in text:
              raise SystemExit(
                  "Notification event publication block not found."
              )

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          # =========================================================
          # 6. REGRESSION TESTS
          # =========================================================

          path = tests / "ConversationSessionTest.kt"
          text = path.read_text(encoding="utf-8")

          old = '''            "Tchau", "Gama, pode descansar", "pode descansar agora senhor",
                      "você pode descansar por enquanto", "encerrar conversa", "Pare de ouvir",
                      "pode descansa", "pode descanca", "descansa"
          '''

          new = '''            "Tchau",
                      "Gama, pode descansar",
                      "você pode descansar",
                      "encerrar conversa",
                      "Pare de ouvir",
                      "pode descansa"
          '''

          if old not in text:
              raise SystemExit(
                  "ConversationSession positive test block not found."
              )

          text = text.replace(old, new, 1)

          old = '''        listOf("e depois?", "posso parar para pensar?", "quais os benefícios de descansar?", "me fale mais", "parar a música", "como encerrar conversa?", "o que significa pare de ouvir?").forEach {
          '''

          new = '''        listOf(
                      "e depois?",
                      "posso parar para pensar?",
                      "quais os benefícios de descansar?",
                      "me fale mais",
                      "parar a música",
                      "como encerrar conversa?",
                      "o que significa pare de ouvir?",
                      "descansa",
                      "descansar",
                      "pode descansar agora senhor"
                  ).forEach {
          '''

          if old not in text:
              raise SystemExit(
                  "ConversationSession negative test block not found."
              )

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          path = tests / "GamaRecognitionPolicyTest.kt"
          text = path.read_text(encoding="utf-8")

          old = '''    @Test fun shortConversationControlsAreAcceptedWithoutVadEvidence() {
                  assertTrue(GamaRecognitionPolicy.shouldAcceptSessionFinal("sim", false, false))
                  assertTrue(GamaRecognitionPolicy.shouldAcceptSessionFinal("pode descansar", false, false))
                  assertFalse(GamaRecognitionPolicy.shouldAcceptSessionFinal("ruido qualquer", false, false))
              }
          '''

          new = '''    @Test fun shortConversationControlsAreAcceptedWithoutVadEvidence() {
                  assertTrue(
                      GamaRecognitionPolicy.shouldAcceptSessionFinal(
                          "sim",
                          false,
                          false
                      )
                  )

                  assertFalse(
                      GamaRecognitionPolicy.shouldAcceptSessionFinal(
                          "pode descansar",
                          false,
                          false
                      )
                  )

                  assertTrue(
                      GamaRecognitionPolicy.shouldAcceptSessionFinal(
                          "pode descansar",
                          true,
                          true
                      )
                  )

                  assertFalse(
                      GamaRecognitionPolicy.shouldAcceptSessionFinal(
                          "ruido qualquer",
                          false,
                          false
                      )
                  )
              }
          '''

          if old not in text:
              raise SystemExit(
                  "Recognition regression test not found."
              )

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          path = tests / "GamaProactivePolicyTest.kt"
          text = path.read_text(encoding="utf-8")

          old = '''    @Test fun repeatedContactAttemptBecomesHighPriority() {
                  assertEquals(GamaEventHub.Priority.HIGH, GamaProactivePolicy.messagePriority("Você está aí?", 1))
              }
          '''

          new = '''    @Test fun repeatedContactDoesNotBecomeUrgentByItself() {
                  assertEquals(
                      GamaEventHub.Priority.NORMAL,
                      GamaProactivePolicy.messagePriority(
                          "Você está aí?",
                          1
                      )
                  )
              }
          '''

          if old not in text:
              raise SystemExit(
                  "Proactive regression test not found."
              )

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          print("Gama 8.4.0 anti-phantom patch applied.")
          PY

      - name: Verify anti-phantom protections
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"
          TEST="app/src/test/java/com/gama/assistant"

          grep -Fq \
            'Only an explicit, deliberate goodbye' \
            "$SRC/ConversationSession.kt"

          grep -Fq \
            'return commandSpeechStarted && recentVoiceEvidence' \
            "$SRC/GamaRecognitionPolicy.kt"

          grep -Fq \
            'Atividade importante registrada' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'wallAge !in 0L..20_000L' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'wakeHasSpeech' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'shouldPublishSituationEvent' \
            "$SRC/GamaNotificationListener.kt"

          grep -Fq \
            'gama_proactive_dedupe' \
            "$SRC/GamaNotificationListener.kt"

          grep -Fq \
            'repeatedContactDoesNotBecomeUrgentByItself' \
            "$TEST/GamaProactivePolicyTest.kt"

          grep -Fq \
            '"descansar"' \
            "$TEST/ConversationSessionTest.kt"

          python3 tools/audit_gama.py

          echo "Anti-phantom protections verified."

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK 35
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          test -d "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -x \
            "$SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Gama 8.4.0 version
        working-directory: _gama_build
        run: |
          set -euo pipefail

          VC=$((23100000 + GITHUB_RUN_NUMBER))

          sed -Ei \
            "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $VC/" \
            app/build.gradle.kts

          sed -Ei \
            's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "Gama 8.4.0"/' \
            app/build.gradle.kts

          grep -F \
            'versionName = "Gama 8.4.0"' \
            app/build.gradle.kts

      - name: Run complete Gama regression tests
        working-directory: _gama_build
        run: |
          set -euo pipefail

          gradle :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            --tests 'com.gama.assistant.ConversationSessionTest' \
            --tests 'com.gama.assistant.GamaRecognitionPolicyTest' \
            --tests 'com.gama.assistant.GamaProactivePolicyTest' \
            --tests 'com.gama.assistant.GamaCriticalCommandPolicyTest' \
            --tests 'com.gama.assistant.GamaAudioFrontEndTest' \
            --tests 'com.gama.assistant.GamaSpeechNoisePolicyTest' \
            --tests 'com.gama.assistant.VoicePolicyTest' \
            --tests 'com.gama.assistant.ActionFollowUpTest' \
            --tests 'com.gama.assistant.GamaModelInstallPolicyTest' \
            --tests 'com.gama.assistant.ZevronPlannerTest' \
            --tests 'com.gama.assistant.ZevronCalendarFlowTest' \
            --tests 'com.gama.assistant.ZevronSystemControlTest' \
            --tests 'com.gama.assistant.GamaOnlineRouterTest' \
            --tests 'com.gama.assistant.FreshnessPolicyTest' \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Build Gama 8.4.0 APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          if [ -x tools/download_models.sh ]; then
            bash tools/download_models.sh
          fi

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gama-build.log"

          mkdir -p dist

          APK="$(
            find \
              app/build/outputs/apk/debug \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK" ]; then
            echo "::error::APK not found."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::Generated APK is empty."
            exit 1
          fi

          cp "$APK" dist/Gama.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            dist/Gama.apk

          (
            cd dist
            sha256sum Gama.apk > Gama.apk.sha256
          )

          echo "Gama 8.4.0 APK built and verified."

      - name: Upload Gama 8.4.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.4.0-JARVIS-ANTI-PHANTOM-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Upload Gama 8.4.0 source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.4.0-JARVIS-ANTI-PHANTOM-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Publish Gama 8.4.0 release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="gama-v8.4.0-anti-phantom-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 8.4.0 JARVIS Anti-Phantom" \
            --notes "Baseada diretamente no build #127 aprovado. Corrige fala espontânea sem hotword, elimina reprodução tardia de eventos antigos, deduplica notificações repostadas, endurece o detector de descanso para impedir encerramentos falsos e exige evidência real de fala no hotword dedicado. Mantém Gemma offline, conversa contínua, ações encadeadas, tela/OCR, agenda, pesquisa atual e ferramentas Android." \
            --latest

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.4.0-JARVIS-ANTI-PHANTOM-diagnostics
          path: |
            gama-build.log
            gama-tests.log
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn
