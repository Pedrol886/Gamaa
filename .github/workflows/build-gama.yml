          grep -Fq \
            'GamaSelfSpeechGuard' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaReliableAppLauncher' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaPersonalAICore' \
