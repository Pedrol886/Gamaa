              r'''private fun warmBrainSilently() {
                      runCatching {
                          startService(
                              BrainProcessProtocol
                                  .warmIntent(this)
                          )
                      }
                  }

                  private fun cancelObsoleteBrainRequest() {
                      val pid = activeBrainPid

                      brainHealthToken++
                      brainBusy = false
                      activeBrainRequestId = 0L
                      activeBrainPid = 0
                      activeBrainTurnStamp = null
                      activeBrainContext = ""

                      runCatching {
                          stopService(
                              Intent(
                                  this,
                                  GamaBrainProcessService::class.java
                              )
                          )
                      }

                      if (
                          pid > 0 &&
                          pid !=
                          android.os.Process.myPid()
                      ) {
                          runCatching {
                              GamaProcessSafety
                                  .detachFailedBrain(
                                      pid
                                  )
                          }
                      }
                  }

                  private fun speakForTurn(
                      text: String,
                      stamp: GamaTurnCoordinator.Stamp,
                      closeAfter: Boolean = false,
                  ) {
                      if (
                          !orchestrator
                              .isCurrent(stamp)
                      ) {
                          return
                      }

                      speak(
                          text,
                          closeAfter,
                      )
                  }

                  private fun answerWithBrainAsync(
                      question: String,
                      cleanContext: Boolean = false,
                  ) {
                      if (
                          brainRetryPrompt !=
                          question
                      ) {
                          brainRetryPrompt =
                              question

                          brainRetryAttempt = 0
                      }

                      brainRetrySequence =
                          userCommandSequence

                      if (brainBusy) {
                          cancelObsoleteBrainRequest()
                      }

                      val stamp =
                          orchestrator
                              .currentStamp()
                              ?: orchestrator
                                  .beginTurn(
                                      question
                                  )

                      val requestId =
                          ++brainRequestSerial

                      val generation =
                          requestGeneration

                      val transientContext =
                          if (
                              conversation.active &&
                              !cleanContext
                          ) {
                              listOfNotNull(
                                  conversation
                                      .historyBeforeCurrent(),
                                  conversation
                                      .activeContextSummary(),
                                  ZevronContextResolver
                                      .brainContext(),
                              )
                                  .filter {
                                      it.isNotBlank()
                                  }
                                  .joinToString("\n")
                                  .takeIf {
                                      it.isNotBlank()
                                  }
                          } else {
                              null
                          }

                      val dialogueContext =
                          if (cleanContext) {
                              null
                          } else {
                              ZevronJarvisCore
                                  .enrichBrainContext(
                                      this,
                                      transientContext,
                                  )
                          }

                      brainBusy = true
                      activeBrainRequestId =
                          requestId

                      activeBrainGeneration =
                          generation

                      activeBrainTurnStamp =
                          stamp

                      activeBrainContext =
                          dialogueContext.orEmpty()

                      activeBrainPid = 0
                      brainHealthToken++

                      GamaSupervisor.onThinking()

                      updateNotification(
                          "Pensando..."
                      )

                      setConversationVisual(
                          GamaEnergyView.Mode.THINKING
                      )

                      uiHandler.postDelayed(
                          {
                              runCatching {
                                  brainProcessSupervisor
                                      ?.bindStartedBrain()
                              }
                          },
                          120L,
                      )

                      try {
                          startService(
                              BrainProcessProtocol
                                  .requestIntent(
                                      this,
                                      requestId,
                                      question,
                                      dialogueContext,
                                      stamp.sessionId,
                                      stamp.turnId,
                                      stamp.generationId,
                                  )
                          )
                      } catch (e: Exception) {
                          Log.e(
                              TAG,
                              "Could not start local brain process",
                              e,
                          )

                          recoverBrainOrAskRepeat(
                              requestId,
                              "start",
                          )

                          return
                      }

                      val timeoutToken =
                          brainHealthToken

                      uiHandler.postDelayed(
                          {
                              if (
                                  !running ||
                                  timeoutToken !=
                                  brainHealthToken
                              ) {
                                  return@postDelayed
                              }

                              if (
                                  brainBusy &&
                                  activeBrainRequestId ==
                                  requestId
                              ) {
                                  recoverBrainOrAskRepeat(
                                      requestId,
                                      "hard-watchdog",
                                  )
                              }
                          },
                          BRAIN_HARD_WATCHDOG_MS,
                      )
                  }

                  private fun scheduleBrainProcessHealthCheck'''
