          test -f _gama_build/app/src/main/java/com/gama/assistant/ConversationSession.kt
          test -f _gama_build/app/src/test/java/com/gama/assistant/ConversationSessionTest.kt
          test -f _gama_build/app/src/main/java/com/gama/assistant/GamaIdentity.kt
