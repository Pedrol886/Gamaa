              "PHYSICAL-TESTS-REQUIRED.md",
              r'''
              # Physical tests still required

              These tests cannot be honestly marked PASS by CI alone.

              1. WhatsApp:
                 - Gama, abra o WhatsApp
                 - 5 separate attempts
                 - expected 5/5 verified package transitions
                 - abra o zap
                 - entra no WhatsApp
                 - abre meu zap

              2. Natural conversation:
                 - say Gama once
                 - wait four seconds
                 - begin speaking
                 - pause two seconds inside a sentence
                 - continue the sentence
                 - verify one combined turn

              3. Barge-in:
                 - Gama speaking
                 - owner interrupts with real speech
                 - TV/music/fan must not interrupt
                 - Gama's own TTS must not interrupt itself

              4. Stale-response test:
                 - ask a slow reasoning question
                 - immediately ask a different question
                 - old answer must never be spoken later

              5. Thirty-minute endurance:
                 - conversation
                 - pauses
                 - apps
                 - notifications
                 - WhatsApp
                 - background
                 - screen off/on
                 - music
                 - noise
                 - explicit sleep
                 - wake again

              Required:
              zero crashes,
              zero old responses,
              zero technical errors spoken,
              zero unrelated-topic hallucinations,
              no permanent loss of hotword recognition.

              Update installation:
              only the stable-signing artifact can satisfy the
              no-uninstall/update requirement.
              '''
          )

          print(
              "GAMA 9.4.0 Continuous Core source transformation complete."
          )
          PY

      - name: Continuous Core structural audit
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"
          TEST="app/src/test/java/com/gama/assistant"

          required=(
            "$SRC/ActiveTaskContext.kt"
            "$SRC/GamaTurnCoordinator.kt"
            "$SRC/GamaOrchestrator.kt"
            "$SRC/SemanticEndpointer.kt"
            "$SRC/AssistantStateController.kt"
            "$SRC/GamaSelfSpeechGuard.kt"
            "$SRC/ContextSanityCheck.kt"
            "$SRC/GamaRecoveryManager.kt"
            "$SRC/PriorityNotificationManager.kt"
            "$TEST/SemanticEndpointerTest.kt"
            "$TEST/ActiveTaskContextTest.kt"
            "$TEST/GamaTurnCoordinatorTest.kt"
            "$TEST/GamaSelfSpeechGuardTest.kt"
            "$TEST/ContextSanityCheckTest.kt"
            "$TEST/GamaContinuousCoreTest.kt"
          )

          for file in "${required[@]}"; do
            test -s "$file"
            echo "PASS $file"
          done

          grep -Fq \
            'COMMAND_START_TIMEOUT_MS = 12_000L' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'FOLLOW_UP_START_TIMEOUT_MS = 15_000L' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'handleSemanticEndpoint' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaSelfSpeechGuard' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'sessionId != stamp.sessionId' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'ContextSanityCheck' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'warmBrainSilently' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'maxAttemptIndex()' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'LAUNCHER_APPS' \
            "$SRC/GamaReliableAppLauncher.kt"

          grep -Fq \
            'CATEGORY_LAUNCHER' \
            "$SRC/GamaReliableAppLauncher.kt"

          grep -Fq \
            'getLaunchIntentSenderForPackage' \
            "$SRC/GamaReliableAppLauncher.kt"

          grep -Fq \
            'com.whatsapp' \
            app/src/main/AndroidManifest.xml

          grep -Fq \
            'com.whatsapp.w4b' \
            app/src/main/AndroidManifest.xml

          if grep -Fq \
            '"apesar"' \
            "$SRC/GamaAppRegistry.kt"; then
            echo "::error::Invalid WhatsApp false alias still present."
            exit 1
          fi

          for file in \
            "$SRC/GamaService.kt" \
            "$SRC/LocalBrain.kt" \
            "$SRC/GamaBrainProcessService.kt" \
            "$SRC/GamaReplyGuard.kt"
          do
            if grep -Fq \
              'Não consegui concluir essa resposta' \
              "$file"; then
              echo "::error::Forbidden user-facing brain failure remains in $file"
              exit 1
            fi
          done

          grep -Fq \
            'isDebuggable = false' \
            app/build.gradle.kts

          echo "Continuous Core structural audit passed."

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          test -d "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Gama 9.4.0 version
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          run = int(os.environ["GITHUB_RUN_NUMBER"])

          version_code = 24_500_000 + run

          s, n1 = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {version_code}',
              s,
              count=1,
          )

          s, n2 = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              'versionName = "Gama 9.4.0 Continuous Core"',
              s,
              count=1,
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit(
                  "Unable to set Gama 9.4.0 version."
              )

          p.write_text(
              s,
              encoding="utf-8",
          )
          PY

      - name: Prepare Gradle wrapper
        working-directory: _gama_build
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            gradle wrapper \
              --gradle-version 8.9
          fi

          chmod +x gradlew

          ./gradlew --version

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew clean --no-daemon --stacktrace

      - name: Compile and unit test
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew test \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew lint \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-lint.log"

      - name: Assemble release APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          if [ -x tools/download_models.sh ]; then
            bash tools/download_models.sh
          fi

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-release.log"

      - name: Sign release APK and verify
        working-directory: _gama_build
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail

          mkdir -p dist

          input_apk="$(
            find app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              | head -n 1
          )"

          test -s "$input_apk"

          aligned="dist/Gama-aligned.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f 4 \
            "$input_apk" \
            "$aligned"

          if [ "$GAMA_SIGNING_MODE" = "stable" ]; then

            mkdir -p .gama-signing
            chmod 700 .gama-signing

            printf '%s' "$GAMA_SIGNING_SEED" \
              | grep -Eq '^[0-9A-Fa-f]{64}$'

            python3 - \
              "$GAMA_SIGNING_SEED" \
              .gama-signing/key.der <<'PY'
          import sys

          raw = bytes.fromhex(sys.argv[1])

          order = int(
              "FFFFFFFF00000000FFFFFFFFFFFFFFFF"
              "BCE6FAADA7179E84F3B9CAC2FC632551",
              16
          )

          d = (
              int.from_bytes(raw, "big") %
              (order - 1)
          ) + 1

          key = d.to_bytes(32, "big")

          der = (
              bytes.fromhex("30310201010420") +
              key +
              bytes.fromhex(
                  "A00A06082A8648CE3D030107"
              )
          )

          open(
              sys.argv[2],
              "wb",
          ).write(der)
          PY

            openssl ec \
              -inform DER \
              -in .gama-signing/key.der \
              -out .gama-signing/key.pem \
              >/dev/null 2>&1

            printf '%s' \
              '' \
              | base64 --decode \
              > .gama-signing/cert.pem

            keyhash="$(
              openssl pkey \
                -in .gama-signing/key.pem \
                -pubout \
                -outform DER \
                | sha256sum \
                | cut -d' ' -f1
            )"

            certhash="$(
              openssl x509 \
                -in .gama-signing/cert.pem \
                -pubkey \
                -noout \
                | openssl pkey \
                    -pubin \
                    -outform DER \
                | sha256sum \
                | cut -d' ' -f1
            )"

            if [ "$keyhash" != "$certhash" ]; then
              echo "::error::GAMA_SIGNING_SEED does not match the stable certificate."
              exit 1
            fi

            openssl pkcs12 \
              -export \
              -inkey .gama-signing/key.pem \
              -in .gama-signing/cert.pem \
              -out .gama-signing/gama.p12 \
              -name gama \
              -passout pass:GamaStable2026

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              sign \
              --ks .gama-signing/gama.p12 \
              --ks-type PKCS12 \
              --ks-key-alias gama \
              --ks-pass pass:GamaStable2026 \
              --key-pass pass:GamaStable2026 \
              --out dist/Gama.apk \
              "$aligned"

            echo "stable-update-capable" \
              > dist/install-mode.txt

            rm -rf .gama-signing

          else

            keytool \
              -genkeypair \
              -keystore /tmp/gama-fresh.jks \
              -storepass GamaFresh2026 \
              -keypass GamaFresh2026 \
              -alias gama \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Gama Fresh Test,O=Gama,C=BR"

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              sign \
              --ks /tmp/gama-fresh.jks \
              --ks-key-alias gama \
              --ks-pass pass:GamaFresh2026 \
              --key-pass pass:GamaFresh2026 \
              --out dist/Gama.apk \
              "$aligned"

            echo "fresh-install-only" \
              > dist/install-mode.txt

          fi

          rm -f "$aligned"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            dist/Gama.apk \
            | tee dist/signature-info.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            dist/Gama.apk \
            > dist/apk-info.txt

          grep -q \
            "name='com.gama.assistant'" \
            dist/apk-info.txt

          grep -q \
            "versionName='Gama 9.4.0 Continuous Core'" \
            dist/apk-info.txt

          EXPECTED_VERSION_CODE="$((24500000 + GITHUB_RUN_NUMBER))"

          grep -q \
            "versionCode='$EXPECTED_VERSION_CODE'" \
            dist/apk-info.txt

          if grep -q \
            "application-debuggable" \
            dist/apk-info.txt; then
            echo "::error::Release APK is debuggable."
            exit 1
          fi

          if [ "$GAMA_SIGNING_MODE" = "stable" ]; then
            actual_cert="$(
              awk -F': ' \
                '/certificate SHA-256 digest/ {
                    print toupper($2);
                    exit
                }' \
                dist/signature-info.txt
            )"

            if [ "$actual_cert" != "$GAMA_EXPECTED_CERT_SHA256" ]; then
              echo "::error::Stable certificate SHA-256 mismatch."
              echo "expected=$GAMA_EXPECTED_CERT_SHA256"
              echo "actual=$actual_cert"
              exit 1
            fi
          fi

          (
            cd dist

            sha256sum Gama.apk \
              > Gama.apk.sha256

            sha256sum -c \
              Gama.apk.sha256
          )

      - name: Second architecture audit
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"

          grep -Fq \
            'ActiveTaskContext' \
            "$SRC/ConversationSession.kt"

          grep -Fq \
            'GamaTurnCoordinator' \
            "$SRC/GamaOrchestrator.kt"

          grep -Fq \
            'SemanticEndpointer' \
            "$SRC/GamaRecognitionPolicy.kt"

          grep -Fq \
            'GamaSelfSpeechGuard' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'ContextSanityCheck' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaRecoveryManager' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'FOLLOW_UP_LISTENING' \
            "$SRC/AssistantStateController.kt"

          grep -Fq \
            'ENDPOINT_PENDING' \
            "$SRC/AssistantStateController.kt"

          grep -Fq \
            'LAUNCHER_APPS' \
            "$SRC/GamaReliableAppLauncher.kt"

          grep -Fq \
            'getLaunchIntentSenderForPackage' \
            "$SRC/GamaReliableAppLauncher.kt"

          grep -Fq \
            'isDebuggable = false' \
            app/build.gradle.kts

          test -s dist/Gama.apk
          test -s reports/GAMA-9.4.0-CHANGES.md
          test -s reports/PHYSICAL-TESTS-REQUIRED.md

          echo "Second architecture audit passed."

      - name: Upload Gama 9.4.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-9.4.0-CONTINUOUS-CORE-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Upload engineering reports
        uses: actions/upload-artifact@v4
        with:
          name: Gama-9.4.0-engineering-reports
          path: |
            _gama_build/reports/**
            gama-tests.log
            gama-lint.log
            gama-release.log
            _gama_build/app/build/reports/tests/**
            _gama_build/app/build/reports/lint-results*
          if-no-files-found: error

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="gama-v9.4.0-continuous-core-${{ github.run_number }}"

          gh release create "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            "_gama_build/dist/install-mode.txt#install-mode.txt" \
            "_gama_build/reports/GAMA-9.4.0-CHANGES.md#GAMA-9.4.0-CHANGES.md" \
            "_gama_build/reports/PHYSICAL-TESTS-REQUIRED.md#PHYSICAL-TESTS-REQUIRED.md" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 9.4.0 Continuous Core" \
            --notes "Continuous conversation architecture built directly on the exact Gama 9.3.0 source from run #136. Release CI passed clean, tests, lint, assembleRelease, signing verification and second architecture audit. Physical endurance and real-device WhatsApp 5/5 remain separate acceptance tests." \
            --latest
