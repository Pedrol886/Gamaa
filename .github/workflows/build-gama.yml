          grep -Fq 'www.bing.com/search?format=rss' "$INTERNET"
          grep -Fq 'answerFresh(question: String)' "$LLM"
          grep -Fq '1_000L' "$ENDPOINTER"
          grep -Fq '2_200L' "$ENDPOINTER"

      - name: Set FIX193 version
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import os, re

          p = Path('_gama_build/app/build.gradle.kts')
          text = p.read_text(encoding='utf-8')
          version_code = 32_000_000 + int(os.environ['GITHUB_RUN_NUMBER'])
          text, c1 = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {version_code}', text, count=1)
          text, c2 = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "Gama 12.6 Single File Core FIX193"', text, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit('Não consegui configurar a versão FIX193')
          p.write_text(text, encoding='utf-8')
          print('versionCode', version_code)
          PY_VERSION

      - name: Bundle local Qwen model
        run: |
          set -euo pipefail
          MODEL_DIR="$GITHUB_WORKSPACE/_gama_build/app/src/main/assets/llm"
          MODEL="$MODEL_DIR/Qwen3-0.6B-int4.litertlm"
          mkdir -p "$MODEL_DIR"
          rm -f "$MODEL"
          curl -L \
            --fail \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            --output "$MODEL" \
            "$GAMA_MODEL_URL"
          test -s "$MODEL"
          ACTUAL_SIZE="$(stat -c%s "$MODEL")"
          if [ "$ACTUAL_SIZE" != "$GAMA_MODEL_SIZE" ]; then
            echo "::error::Modelo local incompleto: $ACTUAL_SIZE bytes; esperado $GAMA_MODEL_SIZE"
            exit 1
          fi
          echo "$GAMA_MODEL_SHA256  $MODEL" | sha256sum -c -

      - name: Architecture audit
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import os

          root = Path('_gama_build')
          src = root / 'app/src/main/java/com/gama/assistant'
          manifest = (root / 'app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          gradle = (root / 'app/build.gradle.kts').read_text(encoding='utf-8')
          service = (src / 'GamaService.kt').read_text(encoding='utf-8')
          launcher = (src / 'GamaReliableAppLauncher.kt').read_text(encoding='utf-8')
          catalog = (src / 'GamaInstalledAppCatalog.kt').read_text(encoding='utf-8')
          online = (src / 'GamaOnlineRouter.kt').read_text(encoding='utf-8')
          internet = (src / 'GamaInternetHub.kt').read_text(encoding='utf-8')
          brain = (src / 'LocalBrain.kt').read_text(encoding='utf-8')
          llm = (src / 'GamaLocalLlm.kt').read_text(encoding='utf-8')
          model = root / 'app/src/main/assets/llm/Qwen3-0.6B-int4.litertlm'

          checks = {
              'FIX193 version': 'Gama 12.6 Single File Core FIX193' in gradle,
              'Qwen local': model.is_file() and model.stat().st_size == int(os.environ['GAMA_MODEL_SIZE']),
              'battery fast lane': 'tryHandleRawBatteryBeforeContext(command)' in service and 'ACTION_BATTERY_CHANGED' in service,
              'app fast lane': 'tryHandleRawAppBeforeContext(command)' in service and 'resolveBareName' in catalog,
              'system launcher': 'Intent.makeMainActivity' in launcher and 'MATCH_DEFAULT_ONLY' not in launcher,
              'research fast lane': 'tryHandleRawOnlineBeforeContext(command)' in service,
              'research commands': 'pesquise' in online and 'procure' in online and 'busque' in online,
              'multi source research': 'html.duckduckgo.com' in internet and 'www.bing.com/search?format=rss' in internet,
              'conversation fix': 'answerFresh(question: String)' in llm and 'usableModelAnswer' in brain,
              'package visibility': '<queries>' in manifest and 'android.intent.category.LAUNCHER' in manifest,
          }
          missing = [name for name, ok in checks.items() if not ok]
          if missing:
              raise SystemExit('FIX193 incompleto: ' + ', '.join(missing))

          kt = list(src.glob('*.kt'))
          lines = sum(len(p.read_text(encoding='utf-8', errors='ignore').splitlines()) for p in kt)
          if len(kt) < 125 or lines < 28500:
              raise SystemExit(f'Regressão de fonte: {len(kt)} arquivos / {lines} linhas Kotlin')
          print(f'PASS FIX193: {len(kt)} Kotlin files / {lines} lines')
          PY_AUDIT

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean --stacktrace

      - name: Compile Release Kotlin
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:compileReleaseKotlin --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama193-compile.log"

      - name: Unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testReleaseUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama193-tests.log"

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:lintRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama193-lint.log"

      - name: Assemble Release
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama193-release.log"

      - name: Zipalign sign and verify APK
        env:
          GAMA_KEYSTORE_B64: ${{ secrets.GAMA_KEYSTORE_B64 }}
          GAMA_KEYSTORE_PASSWORD: ${{ secrets.GAMA_KEYSTORE_PASSWORD }}
          GAMA_KEY_ALIAS: ${{ secrets.GAMA_KEY_ALIAS }}
          GAMA_KEY_PASSWORD: ${{ secrets.GAMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          input_apk="$(find _gama_build/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | head -n 1 || true)"
          if [ -z "$input_apk" ] || [ ! -s "$input_apk" ]; then
            echo "::error::assembleRelease terminou sem APK."
            exit 1
          fi

          mkdir -p _gama_build/dist
          "$BT/zipalign" -f -p 4 "$input_apk" _gama_build/dist/Gama-aligned.apk

          if [ -n "${GAMA_KEYSTORE_B64:-}" ] && [ -n "${GAMA_KEYSTORE_PASSWORD:-}" ] && [ -n "${GAMA_KEY_ALIAS:-}" ] && [ -n "${GAMA_KEY_PASSWORD:-}" ]; then
            echo "$GAMA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gama-release.jks"
            KS="$RUNNER_TEMP/gama-release.jks"
            SP="$GAMA_KEYSTORE_PASSWORD"
            KA="$GAMA_KEY_ALIAS"
            KP="$GAMA_KEY_PASSWORD"
            echo "stable-update-capable" > _gama_build/dist/install-mode.txt
          else
            KS="$RUNNER_TEMP/gama-test.jks"
            SP="gama-test-pass"
            KA="gama-test"
            KP="gama-test-pass"
            keytool -genkeypair \
              -keystore "$KS" \
              -storepass "$SP" \
              -keypass "$KP" \
              -alias "$KA" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Gama Test,O=Gama,C=BR" \
              -noprompt
            echo "fresh-install-only" > _gama_build/dist/install-mode.txt
          fi

          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-pass "pass:$SP" \
            --ks-key-alias "$KA" \
            --key-pass "pass:$KP" \
            --out _gama_build/dist/Gama.apk \
            _gama_build/dist/Gama-aligned.apk

          "$BT/apksigner" verify --verbose --print-certs _gama_build/dist/Gama.apk | tee _gama_build/dist/signature-info.txt
          test -s _gama_build/dist/Gama.apk
          APK_SIZE="$(stat -c%s _gama_build/dist/Gama.apk)"
          if [ "$APK_SIZE" -lt 350000000 ]; then
            echo "::error::APK não contém o modelo local completo: $APK_SIZE bytes"
            exit 1
          fi
          unzip -l _gama_build/dist/Gama.apk | grep -Fq 'assets/model/final.mdl'
          unzip -l _gama_build/dist/Gama.apk | grep -Fq 'assets/model/Gr.fst'
          unzip -l _gama_build/dist/Gama.apk | grep -Fq 'assets/llm/Qwen3-0.6B-int4.litertlm'
          unzip -l _gama_build/dist/Gama.apk | grep -Fq 'classes.dex'
          "$BT/aapt" dump badging _gama_build/dist/Gama.apk > _gama_build/dist/apk-info.txt
          grep -Fq "name='com.gama.assistant'" _gama_build/dist/apk-info.txt
          grep -Fq "versionName='Gama 12.6 Single File Core FIX193'" _gama_build/dist/apk-info.txt
          (cd _gama_build/dist && sha256sum Gama.apk > Gama.apk.sha256 && sha256sum -c Gama.apk.sha256)
          rm -f _gama_build/dist/Gama-aligned.apk
          ls -lh _gama_build/dist/Gama.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-12.6-FIX193-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-FIX193-diagnostics
          path: |
            gama193-compile.log
            gama193-tests.log
            gama193-lint.log
            gama193-release.log
          if-no-files-found: ignore
          retention-days: 7
