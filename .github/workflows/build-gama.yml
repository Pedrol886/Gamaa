          sealed class GamaPolicyDirective {
              data class SetSenderPriority(
                  val sender: String,
                  val priority: GamaPriorityLevel,
              ) : GamaPolicyDirective()

              data class RemoveSenderPriority(
                  val sender: String
              ) : GamaPolicyDirective()

              data object ListPolicies :
                  GamaPolicyDirective()

              data object ExplainLastDecision :
                  GamaPolicyDirective()

              data class StudyMode(
                  val enabled: Boolean
              ) : GamaPolicyDirective()

              data class Alias(
                  val alias: String,
                  val target: String,
              ) : GamaPolicyDirective()

              data class ResponseStyle(
                  val value: String
              ) : GamaPolicyDirective()

              data object WaitLonger :
                  GamaPolicyDirective()

              data class Remember(
                  val value: String
              ) : GamaPolicyDirective()

              data class Forget(
                  val query: String
              ) : GamaPolicyDirective()

              data object ListMemory :
                  GamaPolicyDirective()

              data object ExportConfiguration :
                  GamaPolicyDirective()
          }

          object GamaPolicyParser {
              fun normalize(
                  value: String
              ): String =
                  Normalizer.normalize(
                      value.lowercase(
                          Locale("pt", "BR")
                      ),
                      Normalizer.Form.NFD,
                  )
                      .replace(
                          Regex("\\p{M}+"),
                          ""
                      )
                      .replace(
                          Regex("[^a-z0-9 ]+"),
                          " "
                      )
                      .replace(
                          Regex("\\s+"),
                          " "
                      )
                      .trim()

              fun parse(
                  raw: String,
                  studyModeActive: Boolean,
              ): GamaPolicyDirective? {
                  val clean =
                      ZevronConversationEngine
                          .stripWakeWord(raw)
                          .replace(
                              Regex("\\s+"),
                              " "
                          )
                          .trim()

                  val n =
                      normalize(clean)

                  if (n.isBlank()) {
                      return null
                  }

                  if (
                      n in setOf(
                          "quais regras eu criei",
                          "quais sao minhas regras",
                          "quais regras estao ativas",
                          "liste minhas regras",
                          "mostre minhas regras",
                          "minhas regras",
                      )
                  ) {
                      return GamaPolicyDirective
                          .ListPolicies
                  }

                  if (
                      n.startsWith(
                          "por que voce me avisou"
                      ) ||
                      n.startsWith(
                          "por que voce fez isso"
                      ) ||
                      n in setOf(
                          "por que fez isso",
                          "por que me avisou",
                          "por que voce fez isso",
                      )
                  ) {
                      return GamaPolicyDirective
                          .ExplainLastDecision
                  }

                  if (
                      n.contains(
                          "estou estudando"
                      ) ||
                      n.contains(
                          "vou estudar"
                      ) ||
                      n.contains(
                          "modo estudo"
                      )
                  ) {
                      return GamaPolicyDirective
                          .StudyMode(
                              true
                          )
                  }

                  if (
                      studyModeActive &&
                      n in setOf(
                          "terminei",
                          "terminei de estudar",
                          "parei de estudar",
                          "acabou o estudo",
                          "sair do modo estudo",
                          "desative o modo estudo",
                      )
                  ) {
                      return GamaPolicyDirective
                          .StudyMode(
                              false
                          )
                  }

                  Regex(
                      "(?i)^quando\\s+eu\\s+disser\\s+" +
                          "[\"']?(.+?)[\"']?,?\\s+" +
                          "(?:estou\\s+falando\\s+(?:do|da)|" +
                          "quero\\s+dizer|significa)\\s+(.+)$"
                  )
                      .find(clean)
                      ?.let {
                          val alias =
                              cleanEntity(
                                  it.groupValues[1]
                              )

                          val target =
                              cleanEntity(
                                  it.groupValues[2]
                              )

                          if (
                              alias.isNotBlank() &&
                              target.isNotBlank()
                          ) {
                              return GamaPolicyDirective
                                  .Alias(
                                      alias,
                                      target,
                                  )
                          }
                      }

                  if (
                      n in setOf(
                          "prefiro respostas curtas",
                          "prefiro que voce fale mais curto",
                          "responda mais curto",
                          "fale mais curto",
                          "seja mais curto nas respostas",
                      )
                  ) {
                      return GamaPolicyDirective
                          .ResponseStyle(
                              "SHORT"
                          )
                  }

                  if (
                      n.contains(
                          "espere mais quando eu estiver pensando"
                      ) ||
                      n.contains(
                          "espere mais quando eu pensar"
                      ) ||
                      n.contains(
                          "nao me corte enquanto eu penso"
                      ) ||
                      n.contains(
                          "nao me interrompa enquanto eu penso"
                      )
                  ) {
                      return GamaPolicyDirective
                          .WaitLonger
                  }

                  Regex(
                      "(?i)^(?:lembre|lembra|memorize|guarde)" +
                          "(?:\\s+disso|\\s+ai)?(?:\\s+que)?\\s+(.+)$"
                  )
                      .find(clean)
                      ?.groupValues
                      ?.getOrNull(1)
                      ?.trim()
                      ?.takeIf {
                          it.isNotBlank()
                      }
                      ?.let {
                          return GamaPolicyDirective
                              .Remember(it)
                      }

                  Regex(
                      "(?i)^(?:esqueca|esqueça|remova|apague)" +
                          "(?:\\s+da\\s+memoria|\\s+da\\s+memória)?" +
                          "(?:\\s+que)?\\s+(.+)$"
                  )
                      .find(clean)
                      ?.groupValues
                      ?.getOrNull(1)
                      ?.trim()
                      ?.takeIf {
                          it.isNotBlank()
                      }
                      ?.let {
                          return GamaPolicyDirective
                              .Forget(it)
                      }

                  if (
                      n in setOf(
                          "o que voce lembra",
                          "o que voce lembra de mim",
                          "o que esta na sua memoria",
                          "quais sao minhas preferencias",
                          "quais minhas preferencias",
                      )
                  ) {
                      return GamaPolicyDirective
                          .ListMemory
                  }

                  if (
                      n in setOf(
                          "exporte minhas configuracoes",
                          "exporte as configuracoes do gama",
                          "faca backup das minhas configuracoes",
                          "backup das configuracoes",
                      )
                  ) {
                      return GamaPolicyDirective
                          .ExportConfiguration
                  }

                  val removePatterns =
                      listOf(
                          Regex(
                              "(?i)(?:nao|não)\\s+precisa\\s+mais\\s+" +
                                  "me\\s+avisar\\s+(?:das?\\s+mensagens?\\s+)?" +
                                  "(?:do|da|de)\\s+(.+?)(?:[,.!?]|$)"
                          ),
                          Regex(
                              "(?i)(?:nao|não)\\s+precisa\\s+mais\\s+" +
                                  "tratar\\s+(.+?)\\s+como\\s+prioridade"
                          ),
                          Regex(
                              "(?i)pare\\s+de\\s+me\\s+avisar\\s+" +
                                  "(?:das?\\s+mensagens?\\s+)?" +
                                  "(?:do|da|de)\\s+(.+?)(?:[,.!?]|$)"
                          ),
                      )

                  for (
                      pattern in
                      removePatterns
                  ) {
                      val match =
                          pattern.find(clean)
                              ?: continue

                      val sender =
                          cleanEntity(
                              match.groupValues[1]
                          )

                      if (
                          sender.isNotBlank()
                      ) {
                          return GamaPolicyDirective
                              .RemoveSenderPriority(
                                  sender
                              )
                      }
                  }

                  val requestedPriority =
                      when {
                          n.contains(
                              "prioridade maxima"
                          ) ||
                              n.contains(
                                  "prioridade critica"
                              ) ||
                              n.contains(
                                  "prioridade critica"
                              ) -> GamaPriorityLevel
                                  .CRITICAL

                          n.contains(
                              "importante"
                          ) ||
                              n.contains(
                                  "sempre me avise"
                              ) -> GamaPriorityLevel
                                  .IMPORTANT

                          else -> null
                      }

                  if (
                      requestedPriority != null &&
                      n.contains(
                          "mensag"
                      )
                  ) {
                      Regex(
                          "(?i)mensagens?\\s+(?:do|da|de)\\s+" +
                              "(.+?)(?=\\s+(?:sao|são|e|é|devem|" +
                              "sempre|como)|[,.;!?]|$)"
                      )
                          .find(clean)
                          ?.let {
                              val sender =
                                  cleanEntity(
                                      it.groupValues[1]
                                  )

                              if (
                                  sender.isNotBlank()
                              ) {
                                  return GamaPolicyDirective
                                      .SetSenderPriority(
                                          sender,
                                          requestedPriority,
                                      )
                              }
                          }
                  }

                  return null
              }

              private fun cleanEntity(
                  value: String
              ): String =
                  value
                      .trim()
                      .trim(
                          ' ',
                          '.',
                          ',',
                          ';',
                          ':',
                          '!',
                          '?',
                          '"',
                          '\'',
                      )
                      .replace(
                          Regex("\\s+"),
                          " "
                      )
                      .take(100)
          }

          object GamaPolicyMemory {
              fun setSenderPriority(
                  context: Context,
                  sender: String,
                  priority: GamaPriorityLevel,
              ): GamaPolicyRecord {
                  val db =
                      GamaPersonalDatabase
                          .get(context)

                  val subject =
                      GamaPolicyParser
                          .normalize(sender)

                  val existing =
                      db.policies(
                          GamaPolicyKind
                              .NOTIFICATION_SENDER_PRIORITY
                      )
                          .firstOrNull {
                              it.subjectNormalized ==
                                  subject
                          }

                  val now =
                      System.currentTimeMillis()

                  val record =
                      GamaPolicyRecord(
                          id =
                              existing?.id
                                  ?: UUID.randomUUID()
                                      .toString(),

                          kind =
                              GamaPolicyKind
                                  .NOTIFICATION_SENDER_PRIORITY,

                          subjectNormalized =
                              subject,

                          subjectDisplay =
                              sender
                                  .trim()
                                  .take(100),

                          priority =
                              priority,

                          action =
                              "ALERT_OWNER",

                          conditionsJson =
                              "{}",

                          period =
                              "PERMANENT",

                          origin =
                              "USER",

                          createdAt =
                              existing?.createdAt
                                  ?: now,

                          updatedAt =
                              now,

                          enabled =
                              true,
                      )

                  db.savePolicy(
                      record
                  )

                  GamaAuditTrail.record(
                      context,
                      kind =
                          "POLICY_CREATE_OR_UPDATE",
                      subject =
                          sender,
                      reason =
                          "Ordem explícita do usuário.",
                      result =
                          "priority=${priority.name}",
                      ruleId =
                          record.id,
                  )

                  return record
              }

              fun removeSenderPriority(
                  context: Context,
                  sender: String,
              ): Int {
                  val subject =
                      GamaPolicyParser
                          .normalize(sender)

                  val count =
                      GamaPersonalDatabase
                          .get(context)
                          .disablePolicies(
                              GamaPolicyKind
                                  .NOTIFICATION_SENDER_PRIORITY,
                              subject,
                          )

                  if (
                      count > 0
                  ) {
                      GamaAuditTrail.record(
                          context,
                          kind =
                              "POLICY_DELETE",
                          subject =
                              sender,
                          reason =
                              "Ordem explícita do usuário.",
                          result =
                              "disabled=$count",
                          ruleId =
                              null,
                      )
                  }

                  return count
              }

              fun senderPolicy(
                  context: Context,
                  sender: String,
              ): GamaPolicyRecord? {
                  val normalized =
                      GamaPolicyParser
                          .normalize(sender)

                  return GamaPersonalDatabase
                      .get(context)
                      .policies(
                          GamaPolicyKind
                              .NOTIFICATION_SENDER_PRIORITY
                      )
                      .filter {
                          it.subjectNormalized ==
                              normalized ||
                              it.subjectNormalized ==
                              "*"
                      }
                      .sortedWith(
                          compareByDescending<
                              GamaPolicyRecord
                          > {
                              if (
                                  it.subjectNormalized ==
                                  normalized
                              ) {
                                  1
                              } else {
                                  0
                              }
                          }
                              .thenByDescending {
                                  if (
                                      it.origin ==
                                      "USER"
                                  ) {
                                      1
                                  } else {
                                      0
                                  }
                              }
                              .thenByDescending {
                                  it.updatedAt
                              }
                      )
                      .firstOrNull()
              }

              fun setStudyMode(
                  context: Context,
                  enabled: Boolean,
              ) {
                  GamaPersonalDatabase
                      .get(context)
                      .setMode(
                          "STUDY",
                          enabled,
                      )

                  GamaAuditTrail.record(
                      context,
                      kind =
                          "MODE_CHANGE",
                      subject =
                          "STUDY",
                      reason =
                          "Ordem explícita do usuário.",
                      result =
                          if (
                              enabled
                          ) {
                              "enabled"
                          } else {
                              "disabled"
                          },
                      ruleId =
                          null,
                  )
              }

              fun isStudyMode(
                  context: Context
              ): Boolean =
                  GamaPersonalDatabase
                      .get(context)
                      .modeEnabled(
                          "STUDY"
                      )

              fun describe(
                  context: Context
              ): String {
                  val policies =
                      GamaPersonalDatabase
                          .get(context)
                          .policies()

                  if (
                      policies.isEmpty()
                  ) {
                      return "Você ainda não criou regras permanentes."
                  }

                  return policies
                      .take(12)
                      .joinToString(
                          prefix =
                              "Suas regras ativas são: ",
                          separator =
                              "; ",
                          postfix =
                              ".",
                      ) {
                          when (
                              it.kind
                          ) {
                              GamaPolicyKind
                                  .NOTIFICATION_SENDER_PRIORITY ->
                                  "mensagens de ${it.subjectDisplay} " +
                                      "são ${priorityLabel(it.priority)}"

                              GamaPolicyKind
                                  .RESPONSE_STYLE ->
                                  "estilo de resposta ${it.action}"

                              GamaPolicyKind
                                  .QUIET_MODE ->
                                  "modo silencioso ${it.action}"

                              GamaPolicyKind
                                  .ENDPOINT_PREFERENCE ->
                                  "tempo de escuta personalizado"
                          }
                      }
              }

              fun brainContext(
                  context: Context
              ): String? {
                  val policies =
                      GamaPersonalDatabase
                          .get(context)
                          .policies()

                  val study =
                      isStudyMode(context)

                  if (
                      policies.isEmpty() &&
                      !study
                  ) {
                      return null
                  }

                  return buildString {
                      append(
                          "Políticas explícitas do usuário: "
                      )

                      policies
                          .take(10)
                          .forEach {
                              append(
                                  "[${it.kind.name} " +
                                      "${it.subjectDisplay} " +
                                      "${it.priority.name} " +
                                      "${it.action}] "
                              )
                          }

                      if (
                          study
                      ) {
                          append(
                              "[MODE STUDY ativo: " +
                                  "LOW/NORMAL não interrompem; " +
                                  "IMPORTANT/CRITICAL podem alertar.]"
                          )
                      }
                  }
                      .take(1800)
              }

              private fun priorityLabel(
                  priority: GamaPriorityLevel
              ): String =
                  when (
                      priority
                  ) {
                      GamaPriorityLevel.CRITICAL ->
                          "prioridade máxima"

                      GamaPriorityLevel.IMPORTANT ->
                          "importantes"

                      GamaPriorityLevel.NORMAL ->
                          "normais"

                      GamaPriorityLevel.LOW ->
                          "baixa prioridade"
                  }
          }

          object GamaPriorityEngine {
              fun inferFromText(
                  body: String
              ): GamaPriorityLevel {
                  val n =
                      GamaPolicyParser
                          .normalize(body)

                  val critical =
                      listOf(
                          "emergencia",
                          "socorro",
                          "hospital",
                          "acidente",
                      )

                  if (
                      critical.any {
                          it in n
                      }
                  ) {
                      return GamaPriorityLevel
                          .CRITICAL
                  }

                  val important =
                      listOf(
                          "urgente",
                          "importante",
                          "me liga",
                          "me ligue",
                          "preciso falar",
                          "responda",
                          "agora",
                      )

                  if (
                      important.any {
                          it in n
                      }
                  ) {
                      return GamaPriorityLevel
                          .IMPORTANT
                  }

                  return GamaPriorityLevel
                      .NORMAL
              }
          }

          object GamaRuleEngine {
              fun evaluateNotification(
                  context: Context,
                  sender: String,
                  body: String,
              ): GamaNotificationDecision {
                  val explicitPolicy =
                      GamaPolicyMemory
                          .senderPolicy(
                              context,
                              sender,
                          )

                  val priority =
                      explicitPolicy?.priority
                          ?: GamaPriorityEngine
                              .inferFromText(
                                  body
                              )

                  val study =
                      GamaPolicyMemory
                          .isStudyMode(
                              context
                          )

                  val shouldAlert =
                      when {
                          priority.weight >=
                              GamaPriorityLevel
                                  .IMPORTANT
                                  .weight ->
                              true

                          study ->
                              false

                          else ->
                              false
                      }

                  val reason =
                      when {
                          explicitPolicy != null ->
                              "Você pediu para eu tratar mensagens de " +
                                  "${explicitPolicy.subjectDisplay} " +
                                  "como ${explicitPolicy.priority.name.lowercase()}."

                          priority ==
                              GamaPriorityLevel
                                  .CRITICAL ->
                              "A mensagem contém termos de emergência."

                          priority ==
                              GamaPriorityLevel
                                  .IMPORTANT ->
                              "A mensagem contém sinais de urgência ou importância."

                          study ->
                              "Modo de estudo ativo; evento guardado sem interromper."

                          else ->
                              "Notificação normal."
                      }

                  return GamaNotificationDecision(
                      priority =
                          priority,
                      shouldAlert =
                          shouldAlert,
                      reason =
                          reason,
                      policyId =
                          explicitPolicy?.id,
                      explicit =
                          explicitPolicy != null,
                  )
              }
          }

          object GamaAuditTrail {
              fun record(
                  context: Context,
                  kind: String,
                  subject: String,
                  reason: String,
                  result: String,
                  ruleId: String?,
              ) {
                  GamaPersonalDatabase
                      .get(context)
                      .audit(
                          kind,
                          subject,
                          reason,
                          result,
                          ruleId,
                      )
              }

              fun latest(
                  context: Context
              ): GamaAuditRecord? =
                  GamaPersonalDatabase
                      .get(context)
                      .latestAudit()
          }

          object GamaEventEngine {
              private const val MAX_DEPTH =
                  4

              fun notification(
                  context: Context,
                  sender: String,
                  body: String,
                  occurredAt: Long,
              ): GamaNotificationDecision {
                  val decision =
                      GamaRuleEngine
                          .evaluateNotification(
                              context,
                              sender,
                              body,
                          )

                  val rawId =
                      "NOTIFICATION|" +
                          sender +
                          "|" +
                          body.take(180) +
                          "|" +
                          occurredAt

                  val event =
                      GamaPersonalEvent(
                          eventId =
                              UUID.nameUUIDFromBytes(
                                  rawId
                                      .toByteArray(
                                          Charsets.UTF_8
                                      )
                              )
                                  .toString(),

                          type =
                              "NOTIFICATION_RECEIVED",

                          origin =
                              "ANDROID_NOTIFICATION_LISTENER",

                          depth =
                              0,

                          source =
                              sender.take(120),

                          summary =
                              body
                                  .replace(
                                      Regex("\\s+"),
                                      " "
                                  )
                                  .trim()
                                  .take(360),

                          priority =
                              decision.priority,

                          occurredAt =
                              occurredAt,
                      )

                  if (
                      event.depth >
                      MAX_DEPTH
                  ) {
                      return decision
                  }

                  val study =
                      GamaPolicyMemory
                          .isStudyMode(
                              context
                          )

                  val deferred =
                      study &&
                          !decision.shouldAlert

                  val inserted =
                      GamaPersonalDatabase
                          .get(context)
                          .insertEvent(
                              event,
                              deferred,
                          )

                  if (
                      !inserted
                  ) {
                      return decision
                  }

                  if (
                      decision.shouldAlert
                  ) {
                      GamaEventHub.record(
                          context,
                          GamaEventHub.Event(
                              kind =
                                  GamaEventHub
                                      .Kind
                                      .MESSAGE,

                              source =
                                  sender.take(120),

                              summary =
                                  body
                                      .replace(
                                          Regex("\\s+"),
                                          " "
                                      )
                                      .trim()
                                      .take(360),

                              priority =
                                  GamaEventHub
                                      .Priority
                                      .HIGH,

                              occurredAt =
                                  occurredAt,
                          )
                      )

                      GamaAuditTrail.record(
                          context,
                          kind =
                              "PROACTIVE_ALERT",
                          subject =
                              sender,
                          reason =
                              decision.reason,
                          result =
                              "alerted",
                          ruleId =
                              decision.policyId,
                      )
                  }

                  return decision
              }

              fun finishStudyMode(
                  context: Context
              ): String {
                  val deferred =
                      GamaPersonalDatabase
                          .get(context)
                          .consumeDeferredEvents()

                  if (
                      deferred.isEmpty()
                  ) {
                      return "Certo. Saí do modo de estudo. Não ficou nada importante pendente."
                  }

                  val important =
                      deferred.count {
                          it.priority.weight >=
                              GamaPriorityLevel
                                  .IMPORTANT
                                  .weight
                      }

                  return buildString {
                      append(
                          "Certo. Saí do modo de estudo. "
                      )

                      append(
                          "Enquanto você estudava, guardei "
                      )

                      append(
                          deferred.size
                      )

                      append(
                          if (
                              deferred.size == 1
                          ) {
                              " evento"
                          } else {
                              " eventos"
                          }
                      )

                      append(
                          " para depois"
                      )

                      if (
                          important > 0
                      ) {
                          append(
                              ", incluindo $important importante"
                          )
                      }

                      append(
                          "."
                      )
                  }
              }
          }

          object GamaOptimizationRuntime {
              @Volatile
              var completeSilenceMs:
                  Long = 1_650L

              @Volatile
              var incompleteSilenceMs:
                  Long = 3_600L

              @Volatile
              var completeContinuationMs:
                  Long = 900L

              @Volatile
              var incompleteContinuationMs:
                  Long = 3_600L
          }

          object GamaOptimizationPolicy {
              fun nextIncompleteSilence(
                  current: Long,
                  meanGap: Double,
                  samples: Int,
              ): Long {
                  if (
                      samples < 12
                  ) {
                      return current
                  }

                  val target =
                      (
                          meanGap +
                              650.0
                          )
                          .roundToLong()
                          .coerceIn(
                              3_000L,
                              4_500L,
                          )

                  if (
                      target <=
                      current + 150L
                  ) {
                      return current
                  }

                  return (
                      current +
                          250L
                      )
                      .coerceAtMost(
                          target
                      )
                      .coerceAtMost(
                          4_500L
                      )
              }

              fun nextCompleteContinuation(
                  current: Long,
                  meanGap: Double,
                  samples: Int,
              ): Long {
                  if (
                      samples < 12
                  ) {
                      return current
                  }

                  val target =
                      (
                          meanGap *
                              0.45 +
                              250.0
                          )
                          .roundToLong()
                          .coerceIn(
                              800L,
                              1_500L,
                          )

                  return when {
                      target >
                          current + 100L ->
                          (
                              current +
                                  100L
                              )
                              .coerceAtMost(
                                  target
                              )

                      target <
                          current - 150L ->
                          (
                              current -
                                  100L
                              )
                              .coerceAtLeast(
                                  target
                              )

                      else ->
                          current
                  }
              }

              fun shouldRollback(
                  windowCount: Int,
                  windowFailures: Int,
              ): Boolean =
                  windowCount >= 12 &&
                      (
                          windowFailures
                              .toDouble() /
                              windowCount
                                  .coerceAtLeast(
                                      1
                                  )
                          ) > 0.35
          }

          object GamaSelfOptimizer {
              private const val KEY_INCOMPLETE =
                  "endpoint_incomplete_ms"

              private const val KEY_CONTINUATION =
                  "continuation_complete_ms"

              fun initialize(
                  context: Context
              ) {
                  val db =
                      GamaPersonalDatabase
                          .get(context)

                  val incomplete =
                      db.optimizer(
                          KEY_INCOMPLETE
                      )
                          ?: GamaOptimizerRecord(
                              key =
                                  KEY_INCOMPLETE,
                              currentValue =
                                  3_600.0,
                              previousValue =
                                  3_600.0,
                              meanValue =
                                  0.0,
                              samples =
                                  0,
                              windowCount =
                                  0,
                              windowFailures =
                                  0,
                              changedAt =
                                  0L,
                          )

                  val continuation =
                      db.optimizer(
                          KEY_CONTINUATION
                      )
                          ?: GamaOptimizerRecord(
                              key =
                                  KEY_CONTINUATION,
                              currentValue =
                                  900.0,
                              previousValue =
                                  900.0,
                              meanValue =
                                  0.0,
                              samples =
                                  0,
                              windowCount =
                                  0,
                              windowFailures =
                                  0,
                              changedAt =
                                  0L,
                          )

                  db.saveOptimizer(
                      incomplete
                  )

                  db.saveOptimizer(
                      continuation
                  )

                  applyRuntime(
                      incomplete,
                      continuation,
                  )
              }

              fun observeContinuation(
                  context: Context,
                  gapMs: Long,
              ) {
                  if (
                      gapMs !in
                      100L..6_000L
                  ) {
                      return
                  }

                  val db =
                      GamaPersonalDatabase
                          .get(context)

                  val oldIncomplete =
                      db.optimizer(
                          KEY_INCOMPLETE
                      )
                          ?: return

                  val samples =
                      oldIncomplete.samples +
                          1

                  val mean =
                      if (
                          oldIncomplete.samples <=
                          0
                      ) {
                          gapMs.toDouble()
                      } else {
                          (
                              oldIncomplete.meanValue *
                                  oldIncomplete.samples +
                                  gapMs
                              ) /
                              samples
                      }

                  val nextIncomplete =
                      GamaOptimizationPolicy
                          .nextIncompleteSilence(
                              oldIncomplete
                                  .currentValue
                                  .roundToLong(),
                              mean,
                              samples,
                          )

                  val changedIncomplete =
                      nextIncomplete.toDouble() !=
                          oldIncomplete
                              .currentValue

                  val updatedIncomplete =
                      oldIncomplete.copy(
                          currentValue =
                              nextIncomplete
                                  .toDouble(),

                          previousValue =
                              if (
                                  changedIncomplete
                              ) {
                                  oldIncomplete
                                      .currentValue
                              } else {
                                  oldIncomplete
                                      .previousValue
                              },

                          meanValue =
                              mean,

                          samples =
                              samples,

                          changedAt =
                              if (
                                  changedIncomplete
                              ) {
                                  System
                                      .currentTimeMillis()
                              } else {
                                  oldIncomplete
                                      .changedAt
                              },
                      )

                  db.saveOptimizer(
                      updatedIncomplete
                  )

                  val oldContinuation =
                      db.optimizer(
                          KEY_CONTINUATION
                      )
                          ?: return

                  val nextContinuation =
                      GamaOptimizationPolicy
                          .nextCompleteContinuation(
                              oldContinuation
                                  .currentValue
                                  .roundToLong(),
                              mean,
                              samples,
                          )

                  val changedContinuation =
                      nextContinuation.toDouble() !=
                          oldContinuation
                              .currentValue

                  val updatedContinuation =
                      oldContinuation.copy(
                          currentValue =
                              nextContinuation
                                  .toDouble(),

                          previousValue =
                              if (
                                  changedContinuation
                              ) {
                                  oldContinuation
                                      .currentValue
                              } else {
                                  oldContinuation
                                      .previousValue
                              },

                          meanValue =
                              mean,

                          samples =
                              samples,

                          changedAt =
                              if (
                                  changedContinuation
                              ) {
                                  System
                                      .currentTimeMillis()
                              } else {
                                  oldContinuation
                                      .changedAt
                              },
                      )

                  db.saveOptimizer(
                      updatedContinuation
                  )

                  if (
                      changedIncomplete ||
                      changedContinuation
                  ) {
                      GamaAuditTrail.record(
                          context,
                          kind =
                              "SELF_OPTIMIZATION",
                          subject =
                              "speech_endpoint",
                          reason =
                              "Ajuste seguro baseado em múltiplas continuações reais de fala.",
                          result =
                              "incomplete=$nextIncomplete continuation=$nextContinuation",
                          ruleId =
                              null,
                      )
                  }

                  applyRuntime(
                      updatedIncomplete,
                      updatedContinuation,
                  )
              }

              fun observeOutcome(
                  context: Context,
                  success: Boolean,
              ) {
                  val db =
                      GamaPersonalDatabase
                          .get(context)

                  for (
                      key in
                      listOf(
                          KEY_INCOMPLETE,
                          KEY_CONTINUATION,
                      )
                  ) {
                      val current =
                          db.optimizer(key)
                              ?: continue

                      var next =
                          current.copy(
                              windowCount =
                                  current.windowCount +
                                      1,

                              windowFailures =
                                  current.windowFailures +
                                      if (
                                          success
                                      ) {
                                          0
                                      } else {
                                          1
                                      },
                          )

                      if (
                          GamaOptimizationPolicy
                              .shouldRollback(
                                  next.windowCount,
                                  next.windowFailures,
                              ) &&
                          next.previousValue !=
                          next.currentValue
                      ) {
                          val badValue =
                              next.currentValue

                          next =
                              next.copy(
                                  currentValue =
                                      next.previousValue,

                                  previousValue =
                                      next.previousValue,

                                  windowCount =
                                      0,

                                  windowFailures =
                                      0,

                                  changedAt =
                                      System
                                          .currentTimeMillis(),
                              )

                          GamaAuditTrail.record(
                              context,
                              kind =
                                  "SELF_OPTIMIZATION_ROLLBACK",
                              subject =
                                  key,
                              reason =
                                  "A taxa de falhas piorou após o ajuste.",
                              result =
                                  "rollback $badValue -> ${next.currentValue}",
                              ruleId =
                                  null,
                          )
                      } else if (
                          next.windowCount >=
                          12
                      ) {
                          next =
                              next.copy(
                                  windowCount =
                                      0,
                                  windowFailures =
                                      0,
                              )
                      }

                      db.saveOptimizer(
                          next
                      )
                  }

                  initialize(
                      context
                  )
              }

              fun explicitWaitLonger(
                  context: Context
              ) {
                  val db =
                      GamaPersonalDatabase
                          .get(context)

                  val incomplete =
                      db.optimizer(
                          KEY_INCOMPLETE
                      )
                          ?: return

                  val continuation =
                      db.optimizer(
                          KEY_CONTINUATION
                      )
                          ?: return

                  val nextIncomplete =
                      (
                          incomplete.currentValue +
                              250.0
                          )
                          .coerceAtMost(
                              4_500.0
                          )

                  val nextContinuation =
                      (
                          continuation.currentValue +
                              100.0
                          )
                          .coerceAtMost(
                              1_500.0
                          )

                  db.saveOptimizer(
                      incomplete.copy(
                          previousValue =
                              incomplete
                                  .currentValue,
                          currentValue =
                              nextIncomplete,
                          changedAt =
                              System
                                  .currentTimeMillis(),
                      )
                  )

                  db.saveOptimizer(
                      continuation.copy(
                          previousValue =
                              continuation
                                  .currentValue,
                          currentValue =
                              nextContinuation,
                          changedAt =
                              System
                                  .currentTimeMillis(),
                      )
                  )

                  GamaAuditTrail.record(
                      context,
                      kind =
                          "USER_OPTIMIZATION",
                      subject =
                          "speech_endpoint",
                      reason =
                          "Ordem explícita do usuário para esperar mais durante pausas.",
                      result =
                          "incomplete=$nextIncomplete continuation=$nextContinuation",
                      ruleId =
                          null,
                  )

                  initialize(
                      context
                  )
              }

              private fun applyRuntime(
                  incomplete: GamaOptimizerRecord,
                  continuation: GamaOptimizerRecord,
              ) {
                  GamaOptimizationRuntime
                      .incompleteSilenceMs =
                      incomplete
                          .currentValue
                          .roundToLong()
                          .coerceIn(
                              3_000L,
                              4_500L,
                          )

                  GamaOptimizationRuntime
                      .incompleteContinuationMs =
                      GamaOptimizationRuntime
                          .incompleteSilenceMs

                  GamaOptimizationRuntime
                      .completeContinuationMs =
                      continuation
                          .currentValue
                          .roundToLong()
                          .coerceIn(
                              800L,
                              1_500L,
                          )
              }
          }

          object GamaPermissionManager {
              fun microphone(
                  context: Context
              ): GamaPermissionState =
                  permission(
                      context,
                      Manifest.permission
                          .RECORD_AUDIO,
                  )

              fun contacts(
                  context: Context
              ): GamaPermissionState =
                  permission(
                      context,
                      Manifest.permission
                          .READ_CONTACTS,
                  )

              fun calendar(
                  context: Context
              ): GamaPermissionState {
                  val read =
                      permission(
                          context,
                          Manifest.permission
                              .READ_CALENDAR,
                      )

                  val write =
                      permission(
                          context,
                          Manifest.permission
                              .WRITE_CALENDAR,
                      )

                  return if (
                      read ==
                      GamaPermissionState
                          .GRANTED &&
                      write ==
                      GamaPermissionState
                          .GRANTED
                  ) {
                      GamaPermissionState
                          .GRANTED
                  } else {
                      GamaPermissionState
                          .NOT_REQUESTED
                  }
              }

              fun notificationAccess(
                  context: Context
              ): GamaPermissionState =
                  if (
                      GamaNotificationCenter
                          .hasAccess(context)
                  ) {
                      GamaPermissionState
                          .GRANTED
                  } else {
                      GamaPermissionState
                          .NOT_REQUESTED
                  }

              fun accessibility():
                  GamaPermissionState =
                  if (
                      GamaScreenContextService
                          .isConnected()
                  ) {
                      GamaPermissionState
                          .GRANTED
                  } else {
                      GamaPermissionState
                          .NOT_REQUESTED
                  }

              fun overlay(
                  context: Context
              ): GamaPermissionState =
                  if (
                      Settings
                          .canDrawOverlays(
                              context
                          )
                  ) {
                      GamaPermissionState
                          .GRANTED
                  } else {
                      GamaPermissionState
                          .NOT_REQUESTED
                  }

              private fun permission(
                  context: Context,
                  permission: String,
              ): GamaPermissionState =
                  if (
                      context
                          .checkSelfPermission(
                              permission
                          ) ==
                      android.content.pm
                          .PackageManager
                          .PERMISSION_GRANTED
                  ) {
                      GamaPermissionState
                          .GRANTED
                  } else {
                      GamaPermissionState
                          .NOT_REQUESTED
                  }
          }

