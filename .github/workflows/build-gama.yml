                                          )
                                      )
                                  )
                          }
                              .getOrDefault(
                                  GamaPolicyKind
                                      .NOTIFICATION_SENDER_PRIORITY
                              ),

                      subjectNormalized =
                          getString(
                              getColumnIndexOrThrow(
                                  "subject_normalized"
