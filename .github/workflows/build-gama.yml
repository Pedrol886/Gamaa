              package com.gama.assistant

              import java.text.Normalizer
              import java.util.Locale

              object ContextSanityCheck {

                  private val stopWords =
                      setOf(
                          "a",
                          "o",
                          "as",
                          "os",
                          "um",
                          "uma",
                          "de",
                          "da",
                          "do",
                          "das",
                          "dos",
                          "e",
                          "ou",
                          "que",
                          "para",
                          "pra",
                          "por",
                          "com",
                          "sem",
                          "em",
                          "no",
                          "na",
                          "nos",
                          "nas",
                          "eu",
                          "voce",
                          "me",
                          "meu",
                          "minha",
                          "isso",
                          "aquilo",
                          "ele",
                          "ela",
                          "qual",
                          "como",
                          "porque",
                      )

                  fun transcriptUsable(
                      raw: String,
                      confidence: Double,
                  ): Boolean {
                      val n = normalize(raw)

                      if (n.length < 2) {
                          return false
                      }

                      val words =
                          n.split(' ')
                              .filter {
                                  it.isNotBlank()
                              }

                      if (words.isEmpty()) {
                          return false
                      }

                      if (
                          confidence.isFinite() &&
                          confidence >= 0.0 &&
                          confidence < 0.20 &&
                          words.size >= 2
                      ) {
                          return false
                      }

                      val gibberish =
                          words.count { word ->
                              word.length >= 6 &&
                                  word.none {
                                      it in "aeiou"
                                  }
                          }

                      if (
                          words.size >= 3 &&
                          gibberish >=
                              words.size - 1
                      ) {
                          return false
                      }

                      return true
                  }

                  fun answerRelated(
                      question: String,
                      context: String?,
                      answer: String,
                  ): Boolean {
                      val a = normalize(answer)

                      if (a.isBlank()) {
                          return false
                      }

                      val internal = listOf(
                          "llminference",
                          "mediapipe",
                          "brain ipc",
                          "isolated process",
                          "stack trace",
                          "native crash",
                          "modelo reiniciou",
                          "engine indisponivel",
                      )

                      if (
                          internal.any {
                              it in a
                          }
                      ) {
                          return false
                      }

                      val q = normalize(
                          question +
                              " " +
                              context.orEmpty()
                      )

                      val source =
                          contentTokens(q)

                      val result =
                          contentTokens(a)

                      if (
                          source.size < 2 ||
                          result.size < 4
                      ) {
                          return true
                      }

                      if (
                          source.intersect(result)
                              .isNotEmpty()
                      ) {
                          return true
                      }

                      val conversational =
                          normalize(question)
                              .startsWith(
                                  listOf(
                                      "oi",
                                      "ola",
                                      "obrigado",
                                      "obrigada",
                                      "valeu",
                                      "como voce esta",
                                  )
                              )

                      if (conversational) {
                          return true
                      }

                      return false
                  }

                  private fun String.startsWith(
                      values: List<String>
                  ): Boolean =
                      values.any {
                          this.startsWith(it)
                      }

                  private fun contentTokens(
                      raw: String
                  ): Set<String> =
                      raw
                          .split(' ')
                          .asSequence()
                          .map {
                              it.trim()
                          }
                          .filter {
                              it.length >= 3 &&
                                  it !in stopWords
                          }
                          .toSet()

                  private fun normalize(
                      value: String
                  ): String =
                      Normalizer.normalize(
                          value.lowercase(
                              Locale.ROOT
                          ),
                          Normalizer.Form.NFD,
                      )
                          .replace(
                              Regex("\\p{M}+"),
                              ""
                          )
                          .replace(
                              Regex("[^a-z0-9 ]+"),
                              " "
                          )
                          .replace(
                              Regex("\\s+"),
                              " "
                          )
                          .trim()
              }
              '''
