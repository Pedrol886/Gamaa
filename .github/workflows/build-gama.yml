      - name: Verify isolated brain architecture, automation safety and polished introduction
        working-directory: _gama_build
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/gama/assistant/BrainProcessProtocol.kt
          test -f app/src/main/java/com/gama/assistant/GamaBrainProcessService.kt
          test -f app/src/main/java/com/gama/assistant/CalendarCommandRouter.kt
          test -f app/src/main/java/com/gama/assistant/DeviceActionSafety.kt
          grep -Fq 'versionName = "Gama 6.0"' app/build.gradle.kts
          grep -Fq 'android:process=":gama_brain"' app/src/main/AndroidManifest.xml
          grep -Fq 'BrainProcessProtocol.requestIntent' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'scheduleBrainProcessHealthCheck' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'GamaBrainProcessService::class.java' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'DeviceActionSafety.looksLikeUnresolvedAction' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'handleCalendarVoiceAction' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'marque uma coisa na agenda' app/src/test/java/com/gama/assistant/CalendarCommandRouterTest.kt
          test -f app/src/main/java/com/gama/assistant/GamaIntroActivity.kt
          test -f app/src/main/java/com/gama/assistant/GamaIntroPolicy.kt
          test -f app/src/test/java/com/gama/assistant/GamaIntroPolicyTest.kt
          grep -Fq 'class GamaParticleFormationView' app/src/main/java/com/gama/assistant/GamaIntroActivity.kt
          grep -Fq 'Eu sou o Gama, seu assistente de inteligência artificial' app/src/main/java/com/gama/assistant/GamaIntroActivity.kt
          grep -Fq 'GamaIntroPolicy.shouldLaunch' app/src/main/java/com/gama/assistant/MainActivity.kt
          grep -Fq 'beginIntroPresentation' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'endIntroPresentation' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'android:name=".GamaIntroActivity"' app/src/main/AndroidManifest.xml
          grep -Fq '"Cinemática"' app/src/main/java/com/gama/assistant/GamaVoice.kt
          # A voz cinematográfica foi refinada no patch de automação.
          # Verifique a configuração ATUAL, não os valores antigos da primeira 6.0.
          grep -Fq 'else -> 0.79f to 0.90f' app/src/main/java/com/gama/assistant/GamaVoice.kt || {
            echo '::error::A configuração cinematográfica atual da voz do Gama não foi encontrada.'
            exit 1
          }
          grep -Fq 'class GamaAutomationEngine' app/src/main/java/com/gama/assistant/GamaAutomationEngine.kt
          grep -Fq 'DAILY_TIME' app/src/main/java/com/gama/assistant/AutomationCommandRouter.kt
          grep -Fq 'BATTERY_BELOW' app/src/main/java/com/gama/assistant/AutomationCommandRouter.kt
          grep -Fq 'HEADSET_CONNECTED' app/src/main/java/com/gama/assistant/AutomationCommandRouter.kt
          grep -Fq 'CHARGING_STARTED' app/src/main/java/com/gama/assistant/AutomationCommandRouter.kt
          grep -Fq 'never activates a rule by itself' app/src/main/java/com/gama/assistant/GamaAutomationEngine.kt
          if grep -Fq 'LocalBrain(this)' app/src/main/java/com/gama/assistant/GamaService.kt; then
            echo '::error::LocalBrain não pode ser criado no processo principal.'
            exit 1
          fi
          echo 'Arquitetura OK: modelo local isolado em :gama_brain; automações determinísticas com confirmação; introdução inicial validada.'
          echo 'Voz OK: perfil Cinemática validado com pitch e velocidade atuais.'





















































































































































































































































































































































































































































































































































































































































































































































































































































      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set increasing versionCode and release metadata
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import os, re
          path = Path('app/build.gradle.kts')
          source = path.read_text(encoding='utf-8')
          run = int(os.environ['GITHUB_RUN_NUMBER'])
          code = 20300000 + run
          source, count = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {code}', source, count=1)
          if count != 1:
              raise SystemExit('versionCode não encontrado.')
          path.write_text(source, encoding='utf-8')
          print('versionCode:', code)
          PY_VERSION
          echo "GAMA_TAG=gama-6.0-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "GAMA_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Download and verify offline voice models
        working-directory: _gama_build
        run: bash tools/download_models.sh

      - name: Compile Gama APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"

      - name: Run Gama unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Show first failure in summary
        if: failure()
        run: |
          python3 - <<'PY_DIAG'
          from pathlib import Path
          import os, re
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as out:
              out.write('## Gama 6.0: diagnóstico\n\n')
              for name in ('gama-build.log', 'gama-tests.log'):
                  log = Path(name)
                  if not log.is_file():
                      continue
                  lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
                  problems = [line for line in lines if re.search(
                      r'(^e: |\berror:|^FAILURE:|^> Task .* FAILED|^\* What went wrong:|^Caused by:)', line)]
                  excerpt = problems[:80] if problems else lines[-80:]
                  out.write('### ' + name + '\n\n```text\n')
                  out.write('\n'.join(excerpt))
                  out.write('\n```\n\n')
          PY_DIAG

      - name: Upload build diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-6.0-build-logs
          path: |
            gama-build.log
            gama-tests.log
          if-no-files-found: warn

      - name: Sign and verify Gama.apk
        id: package
        working-directory: _gama_build
        env:
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail
          mkdir -p dist
          input_apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -s "$input_apk"

          if [ "$GAMA_SIGNING_MODE" = "stable" ]; then
            mkdir -p .gama-signing
            chmod 700 .gama-signing
            printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'
            python3 - "$GAMA_SIGNING_SEED" .gama-signing/key.der <<'PY_KEY'
          import sys
          raw = bytes.fromhex(sys.argv[1])
          order = int('FFFFFFFF00000000FFFFFFFFFFFFFFFFBCE6FAADA7179E84F3B9CAC2FC632551', 16)
          d = (int.from_bytes(raw, 'big') % (order - 1)) + 1
          key = d.to_bytes(32, 'big')
          der = bytes.fromhex('30310201010420') + key + bytes.fromhex('A00A06082A8648CE3D030107')
          open(sys.argv[2], 'wb').write(der)
          PY_KEY
            openssl ec -inform DER -in .gama-signing/key.der -out .gama-signing/key.pem >/dev/null 2>&1
            printf '%s' '' | base64 --decode > .gama-signing/cert.pem
            keyhash="$(openssl pkey -in .gama-signing/key.pem -pubout -outform DER | sha256sum | cut -d' ' -f1)"
            certhash="$(openssl x509 -in .gama-signing/cert.pem -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
            test "$keyhash" = "$certhash"
            fingerprint="$(openssl x509 -in .gama-signing/cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            test "$fingerprint" = '6933EDA890C29567A8F4B6CEAD7A39A442DF109D43B813A19F3F6FA7F39B078C'
            openssl pkcs12 -export -inkey .gama-signing/key.pem -in .gama-signing/cert.pem -out .gama-signing/gama.p12 -name gama -passout pass:GamaStable2026
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$input_apk" dist/Gama-aligned.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks .gama-signing/gama.p12 --ks-type PKCS12 --ks-key-alias gama --ks-pass pass:GamaStable2026 --key-pass pass:GamaStable2026 --out dist/Gama.apk dist/Gama-aligned.apk
            rm -f dist/Gama-aligned.apk
            printf '%s\n' "$fingerprint" > dist/signing-cert-sha256.txt
            printf '%s\n' 'stable' > dist/install-mode.txt
            rm -rf .gama-signing
          else
            cp "$input_apk" dist/Gama.apk
            printf '%s\n' 'debug-runner-signature' > dist/signing-cert-sha256.txt
            printf '%s\n' 'FRESH INSTALL ONLY - configure GAMA_SIGNING_SEED for reliable future updates.' > dist/install-mode.txt
            echo "::warning::APK em modo instalação limpa. Pode ser necessário desinstalar a versão anterior."
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Gama.apk | tee dist/signature-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Gama.apk > dist/apk-info.txt
          grep -m1 '^package:' dist/apk-info.txt
          grep -q "name='com.gama.assistant'" dist/apk-info.txt
          grep -q "versionCode='2030" dist/apk-info.txt
          grep -q "versionName='Gama 6.0'" dist/apk-info.txt
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)

      - name: Verify final APK metadata
        working-directory: _gama_build
        run: |
          set -euo pipefail
          test -s dist/Gama.apk
          test -s dist/Gama.apk.sha256
          test -s dist/apk-info.txt
          test -s dist/install-mode.txt
          test -s dist/signing-cert-sha256.txt
          grep -q "name='com.gama.assistant'" dist/apk-info.txt
          grep -q "versionCode='2030" dist/apk-info.txt
          grep -q "versionName='Gama 6.0'" dist/apk-info.txt
          (cd dist && sha256sum -c Gama.apk.sha256)
          apk_bytes="$(wc -c < dist/Gama.apk)"
          test "$apk_bytes" -gt 1000000
          echo "APK bytes: $apk_bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "Install mode: $(cat dist/install-mode.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "Brain process: isolated :gama_brain" >> "$GITHUB_STEP_SUMMARY"
          echo "First-ready intro: particle convergence + GamaEnergyView" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/install-mode.txt
            _gama_build/dist/signing-cert-sha256.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-6.0-tests
          path: _gama_build/app/build/reports/tests
          if-no-files-found: warn

      - name: Publish Gama release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/gama-release.md <<'NOTES'
          Gama 6.0 mantém o modelo local em um processo Android separado (:gama_brain).
          Se MediaPipe/Gemma cair, o microfone, a bolinha e os comandos locais continuam no processo principal.
          Agenda e ações do aparelho continuam roteadas de forma determinística antes da IA.
          Quando a configuração completa fica pronta pela primeira vez, pequenas partículas convergem pela tela inteira e formam o mesmo GamaEnergyView usado durante a fala na tela bloqueada.
          A apresentação usa o tratamento e o nome configurados, explica as principais funções do Gama e roda uma única vez.
          A voz padrão passa a usar uma cadência cinematográfica mais grave e controlada, sem clonar a voz de uma pessoa específica.
          NOTES
          if gh release view "$GAMA_TAG" > /dev/null 2>&1; then
            gh release upload "$GAMA_TAG" _gama_build/dist/Gama.apk _gama_build/dist/Gama.apk.sha256 _gama_build/dist/install-mode.txt --clobber
          else
            gh release create "$GAMA_TAG" _gama_build/dist/Gama.apk _gama_build/dist/Gama.apk.sha256 _gama_build/dist/install-mode.txt --target "$GAMA_COMMIT" --title "Gama 6.0 ($GAMA_TAG)" --notes-file /tmp/gama-release.md
          fi
