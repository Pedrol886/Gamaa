          manifest_path = root / 'app/src/main/AndroidManifest.xml'

          required = [
              'GamaService.kt', 'VoicePolicy.kt', 'GamaRecognitionPolicy.kt',
              'GamaSelfSpeechGuard.kt', 'GamaEnergyView.kt', 'GamaPresenceContext.kt',
              'GamaBatteryProactive.kt', 'GamaPersonalTools.kt', 'GamaSuperAssistantCore.kt',
              'GamaInstalledAppCatalog.kt', 'GamaAppRegistry.kt', 'GamaGeminiClient.kt',
              'GamaGeminiPolicy.kt', 'GamaGeminiSecureStore.kt', 'GamaGeminiSettingsActivity.kt',
              'GamaGeminiControl.kt', 'GamaWakePhrasePolicy.kt', 'GamaScreenContextService.kt',
          ]
          for name in required:
              p = src / name
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f'required file missing: {p}')

          kt_files = list(src.glob('*.kt'))
          kt_lines = sum(len(p.read_text(encoding='utf-8').splitlines()) for p in kt_files)
          if len(kt_files) < 140:
              raise SystemExit(f'Kotlin file regression: {len(kt_files)} < 140')
          if kt_lines < 30400:
              raise SystemExit(f'Kotlin line regression: {kt_lines} < 30400')

          service = (src / 'GamaService.kt').read_text(encoding='utf-8')
          voice = (src / 'VoicePolicy.kt').read_text(encoding='utf-8')
          catalog = (src / 'GamaInstalledAppCatalog.kt').read_text(encoding='utf-8')
          gemini = (src / 'GamaGeminiClient.kt').read_text(encoding='utf-8')
          secure = (src / 'GamaGeminiSecureStore.kt').read_text(encoding='utf-8')
          energy = (src / 'GamaEnergyView.kt').read_text(encoding='utf-8')
          manifest = manifest_path.read_text(encoding='utf-8')
          gradle = gradle_path.read_text(encoding='utf-8')

          checks = [
              ('172 acknowledgement fix', 'acknowledgement = wakeAcknowledgement' in service),
              ('Unified Brain route', 'tryGeminiUnifiedBrain(' in service),
              ('dynamic app route', 'GamaInstalledAppCatalog.resolveName' in service),
              ('dynamic app catalog', 'queryIntentActivities' in catalog and 'LauncherApps' in catalog),
              ('Gemini endpoint', 'generativelanguage.googleapis.com' in gemini),
              ('Gemini header auth', 'x-goog-api-key' in gemini),
              ('Gemini fallback/control', 'GamaGemini' in service),
              ('Android Keystore', 'AndroidKeyStore' in secure),
              ('special wake phrase', 'acorda crianca papai chegou' in voice),
              ('red orb', 'canvas.drawCircle' in energy),
              ('Gemini settings activity', '.GamaGeminiSettingsActivity' in manifest),
              ('launcher visibility', '<queries>' in manifest and 'android.intent.category.LAUNCHER' in manifest),
              ('no QUERY_ALL_PACKAGES', 'android.permission.QUERY_ALL_PACKAGES' not in manifest),
              ('release not debuggable', 'isDebuggable = false' in gradle),
          ]
          failed = [name for name, ok in checks if not ok]
          if failed:
              raise SystemExit('Monolith invariant missing: ' + ', '.join(failed))

          scan_suffixes = {'.kt', '.xml', '.kts', '.md', '.py', '.sh'}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix not in scan_suffixes:
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              if re.search(r'AIza[A-Za-z0-9_-]{20,}', text) or re.search(r'AQ\.[A-Za-z0-9_-]{20,}', text):
                  raise SystemExit(f'Possible API credential embedded in {p}. Refusing build.')

          version_code = 25_520_000 + int(os.environ['GITHUB_RUN_NUMBER'])
          gradle, c1 = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {version_code}', gradle, count=1)
          gradle, c2 = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "Gama 10.5.2 Unified Brain Monolith"', gradle, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit('version update failed')
          gradle_path.write_text(gradle, encoding='utf-8')
          print(f'PASS: {len(kt_files)} Kotlin files, {kt_lines} Kotlin lines; versionCode={version_code}')
          PY_AUDIT

          python3 -m py_compile "$GITHUB_WORKSPACE/gama-monolith-audit.py"
          python3 "$GITHUB_WORKSPACE/gama-monolith-audit.py"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Gradle wrapper
        working-directory: _gama_build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew clean --no-daemon --stacktrace

      - name: Compile Release Kotlin
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-compile.log"

      - name: Unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew test --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew lint --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-lint.log"

      - name: Prepare offline models
        working-directory: _gama_build
        run: |
          set -euo pipefail
          if [ -x tools/download_models.sh ]; then
            bash tools/download_models.sh 2>&1 | tee "$GITHUB_WORKSPACE/gama-models.log"
          else
            : > "$GITHUB_WORKSPACE/gama-models.log"
          fi

      - name: Assemble Release
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-release.log"

      - name: Sign Release APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          mkdir -p dist
          input_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | head -n 1)"
          if [ -z "$input_apk" ] || [ ! -s "$input_apk" ]; then
            echo "::error::APK Release não encontrado após assembleRelease."
            exit 1
          fi

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          "$ZIPALIGN" -f 4 "$input_apk" dist/Gama-aligned.apk

          rm -f /tmp/gama-monolith174.jks
          keytool -genkeypair \
            -keystore /tmp/gama-monolith174.jks \
            -storepass GamaMonolith2026 \
            -keypass GamaMonolith2026 \
            -alias gama \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Gama Monolith Test,O=Gama,C=BR"

          "$APKSIGNER" sign \
            --ks /tmp/gama-monolith174.jks \
            --ks-key-alias gama \
            --ks-pass pass:GamaMonolith2026 \
            --key-pass pass:GamaMonolith2026 \
            --out dist/Gama.apk \
            dist/Gama-aligned.apk

          rm -f dist/Gama-aligned.apk /tmp/gama-monolith174.jks
          echo "fresh-install-only" > dist/install-mode.txt

      - name: Verify final APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          test -s dist/Gama.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Gama.apk | tee dist/signature-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Gama.apk > dist/apk-info.txt
          grep -q "name='com.gama.assistant'" dist/apk-info.txt
          grep -q "versionName='Gama 10.5.2 Unified Brain Monolith'" dist/apk-info.txt
          EXPECTED_VERSION_CODE="$((25520000 + GITHUB_RUN_NUMBER))"
