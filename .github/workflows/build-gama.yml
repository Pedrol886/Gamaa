- name: Inject GAMA Vision and LLM Core
  shell: bash
  run: |
    set -euo pipefail

    # ============================================================
    # GAMA VISION + LOCAL LLM HARDENED CORE
    #
    # Preserva:
    # - Vosk
    # - NLU offline
    # - AccessibilityService
    # - OCR
    # - análise de tela
    # - LLM local
    # - Executor Android
    # - NativeVoice
    # - Barge-in
    # - ACTION_UI_PULSE
    # - legacy fallback
    #
    # Compatível com o workflow atual baseado em Java 17.
    # ============================================================

    if [ -d "_gama_build/app" ]; then
      ROOT="_gama_build"
      APP="$ROOT/app"
    elif [ -d "app" ]; then
      ROOT="."
      APP="app"
    else
      echo "ERRO: projeto Android não encontrado." >&2
      exit 1
    fi

    SRC="$APP/src/main/java/com/gama/assistant"
    GRADLE="$APP/build.gradle.kts"
    MANIFEST="$APP/src/main/AndroidManifest.xml"
    SERVICE="$SRC/GamaService.kt"
    NLU="$SRC/GamaNluCore.kt"
    EXECUTOR="$SRC/GamaExecutor.kt"
    ACCESS="$SRC/JarvisAccessibilityService.kt"
    ACCESS_XML="$APP/src/main/res/xml/jarvis_service_config.xml"
    ASSETS="$APP/src/main/assets"
    MODELS="$ASSETS/models"

    test -s "$GRADLE"
    test -s "$MANIFEST"
    test -s "$SERVICE"
    test -s "$NLU"
    test -s "$EXECUTOR"

    mkdir -p "$SRC"
    mkdir -p "$MODELS"
    mkdir -p "$APP/src/main/res/xml"

    # ============================================================
    # DEPENDÊNCIAS
    #
    # ML Kit:
    # modelo OCR empacotado no APK, não depende de download runtime.
    #
    # MediaPipe:
    # 0.10.21 é deliberadamente usado aqui para permanecer
    # compatível com a toolchain Java 17 existente do GAMA.
    # ============================================================

    sed -i \
      -E 's#com\.google\.mediapipe:tasks-genai:[0-9.]+#com.google.mediapipe:tasks-genai:0.10.21#g' \
      "$GRADLE"

    add_dependency() {
      local DEP="$1"

      if ! grep -Fq "implementation(\"$DEP\")" "$GRADLE"; then
        grep -Eq \
          '^[[:space:]]*dependencies[[:space:]]*\{' \
          "$GRADLE" || {
            echo "ERRO: bloco dependencies não encontrado." >&2
            exit 1
          }

        sed -i \
          "/^[[:space:]]*dependencies[[:space:]]*{/a\\    implementation(\"$DEP\")" \
          "$GRADLE"
      fi
    }

    add_dependency \
      "com.google.mlkit:text-recognition:16.0.1"

    add_dependency \
      "com.google.mediapipe:tasks-genai:0.10.21"

    # Remove duplicatas de versões antigas do tasks-genai.
    python3 - "$GRADLE" <<'PY'
    import re
    import sys

    path = sys.argv[1]

    with open(path, "r", encoding="utf-8") as f:
        lines = f.readlines()

    output = []
    seen_genai = False
    seen_ocr = False

    for line in lines:
        if "com.google.mediapipe:tasks-genai:" in line:
            if seen_genai:
                continue
            line = re.sub(
                r'com\.google\.mediapipe:tasks-genai:[0-9.]+',
                'com.google.mediapipe:tasks-genai:0.10.21',
                line
            )
            seen_genai = True

        if "com.google.mlkit:text-recognition:" in line:
            if seen_ocr:
                continue
            line = re.sub(
                r'com\.google\.mlkit:text-recognition:[0-9.]+',
                'com.google.mlkit:text-recognition:16.0.1',
                line
            )
            seen_ocr = True

        output.append(line)

    with open(path, "w", encoding="utf-8") as f:
        f.writelines(output)
    PY

    # ============================================================
    # ACCESSIBILITY SCREENSHOT
    # ============================================================

    if [ -s "$ACCESS_XML" ]; then
      if grep -Fq \
        'android:canTakeScreenshot=' \
        "$ACCESS_XML"
      then
        sed -i \
          's/android:canTakeScreenshot="false"/android:canTakeScreenshot="true"/g' \
          "$ACCESS_XML"
      else
        sed -i \
          '/<accessibility-service/a\    android:canTakeScreenshot="true"' \
          "$ACCESS_XML"
      fi
    fi

    # ============================================================
    # GamaVisionCore.kt
    #
    # 100% local:
    # Accessibility screenshot -> Bitmap -> ML Kit bundled OCR.
    # ============================================================

    cat <<'EOF' > "$SRC/GamaVisionCore.kt"
    package com.gama.assistant

    import android.content.Context
    import android.graphics.Bitmap
    import com.google.mlkit.vision.common.InputImage
    import com.google.mlkit.vision.text.TextRecognition
    import com.google.mlkit.vision.text.latin.TextRecognizerOptions
    import java.util.LinkedHashSet
    import java.util.concurrent.CountDownLatch
    import java.util.concurrent.TimeUnit
    import java.util.concurrent.atomic.AtomicReference

    class GamaVisionCore(
        context: Context
    ) {

        private val appContext =
            context.applicationContext

        private val recognizer by lazy {
            TextRecognition.getClient(
                TextRecognizerOptions.DEFAULT_OPTIONS
            )
        }

        fun capturarTela(): Bitmap? {
            return try {
                JarvisAccessibilityService
                    .capturarTelaAtualBitmap()
            } catch (_: Throwable) {
                null
            }
        }

        fun extrairTextoDaImagem(
            bitmap: Bitmap
        ): String {

            if (
                bitmap.width <= 0 ||
                bitmap.height <= 0 ||
                bitmap.isRecycled
            ) {
                return ""
            }

            val result =
                AtomicReference("")

            val latch =
                CountDownLatch(1)

            try {
                val image =
                    InputImage.fromBitmap(
                        bitmap,
                        0
                    )

                recognizer
                    .process(image)
                    .addOnSuccessListener { recognized ->

                        val uniqueLines =
                            LinkedHashSet<String>()

                        for (
                            block in
                            recognized.textBlocks
                        ) {
                            for (
                                line in
                                block.lines
                            ) {
                                val clean =
                                    line.text
                                        .replace(
                                            Regex("\\s+"),
                                            " "
                                        )
                                        .trim()

                                if (
                                    clean.isNotBlank()
                                ) {
                                    uniqueLines.add(
                                        clean
                                    )
                                }
                            }
                        }

                        result.set(
                            uniqueLines
                                .joinToString("\n")
                                .take(
                                    MAX_OCR_CHARS
                                )
                        )

                        latch.countDown()
                    }
                    .addOnFailureListener {
                        latch.countDown()
                    }

                if (
                    !latch.await(
                        OCR_TIMEOUT_SECONDS,
                        TimeUnit.SECONDS
                    )
                ) {
                    return ""
                }

                return result
                    .get()
                    .trim()

            } catch (_: Throwable) {
                return ""
            }
        }

        fun capturarEExtrairTexto(): String {
            val bitmap =
                capturarTela()
                    ?: return ""

            return try {
                extrairTextoDaImagem(
                    bitmap
                )
            } finally {
                try {
                    if (
                        !bitmap.isRecycled
                    ) {
                        bitmap.recycle()
                    }
                } catch (_: Throwable) {
                }
            }
        }

        fun contextoVisualCompleto(): String {

            val accessibilityText =
                try {
                    JarvisAccessibilityService
                        .lerTelaAtual()
                        .trim()
                } catch (_: Throwable) {
                    ""
                }

            val ocr =
                try {
                    capturarEExtrairTexto()
                        .trim()
                } catch (_: Throwable) {
                    ""
                }

            if (
                accessibilityText.isBlank() &&
                ocr.isBlank()
            ) {
                return ""
            }

            return buildString {

                if (
                    accessibilityText.isNotBlank()
                ) {
                    append(
                        "[CONTEUDO_ACESSIBILIDADE]\n"
                    )

                    append(
                        accessibilityText.take(
                            MAX_ACCESSIBILITY_CHARS
                        )
                    )
                }

                if (
                    accessibilityText.isNotBlank() &&
                    ocr.isNotBlank()
                ) {
                    append("\n\n")
                }

                if (ocr.isNotBlank()) {
                    append(
                        "[CONTEUDO_OCR]\n"
                    )

                    append(
                        ocr.take(
                            MAX_OCR_CHARS
                        )
                    )
                }
            }.take(
                MAX_TOTAL_CHARS
            )
        }

        fun close() {
            try {
                recognizer.close()
            } catch (_: Throwable) {
            }
        }

        companion object {
            private const val OCR_TIMEOUT_SECONDS =
                8L

            private const val MAX_OCR_CHARS =
                14000

            private const val MAX_ACCESSIBILITY_CHARS =
                10000

            private const val MAX_TOTAL_CHARS =
                20000
        }
    }
    EOF

    # ============================================================
    # GamaLlmBrain.kt
    #
    # CORREÇÕES IMPORTANTES:
    # - sem Retrofit
    # - sem rede
    # - sem Java 21
    # - sem forçar backend CPU incompatível
    # - API MediaPipe reduzida ao caminho mais estável
    # - modelo inicializado uma vez
    # - aceita .task e .bin compatíveis
    # - fallback limpo para NLU legado se modelo não carregar
    # ============================================================

    cat <<'EOF' > "$SRC/GamaLlmBrain.kt"
    package com.gama.assistant

    import android.content.Context
    import android.os.Build
    import com.google.mediapipe.tasks.genai.llminference.LlmInference
    import java.io.File
    import java.io.FileOutputStream
    import java.util.Locale
    import java.util.concurrent.atomic.AtomicBoolean

    class GamaLlmBrain(
        context: Context
    ) {

        private val appContext =
            context.applicationContext

        private val lock =
            Any()

        private val disabled =
            AtomicBoolean(false)

        @Volatile
        private var engine:
            LlmInference? = null

        @Volatile
        private var attempted =
            false

        @Volatile
        private var modelPath:
            String = ""

        fun isAvailable(): Boolean {
            synchronized(lock) {
                ensureInitialized()

                return engine != null &&
                    !disabled.get()
            }
        }

        fun modeloCarregado(): String {
            return modelPath
        }

        fun raciocinar(
            pergunta: String,
            contextoTela: String = "",
            telemetry: GamaTelemetry? = null
        ): String {

            val question =
                sanitizeInput(
                    pergunta,
                    MAX_QUESTION_CHARS
                )

            if (question.isBlank()) {
                return ""
            }

            synchronized(lock) {

                ensureInitialized()

                val currentEngine =
                    engine
                        ?: return ""

                if (disabled.get()) {
                    return ""
                }

                val prompt =
                    buildPrompt(
                        question,
                        contextoTela,
                        telemetry
                    )

                return try {

                    val response =
                        currentEngine
                            .generateResponse(
                                prompt
                            )

                    sanitizeOutput(
                        response
                    )

                } catch (_: Throwable) {

                    /*
                     * Java/Kotlin exception:
                     * desativa somente o LLM desta sessão.
                     *
                     * O GAMA continua funcionando com NLU,
                     * Accessibility, executor e TTS.
                     */
                    disabled.set(
                        true
                    )

                    ""
                }
            }
        }

        fun analisarTela(
            comando: String,
            textoTela: String,
            telemetry: GamaTelemetry?
        ): String {

            val visual =
                sanitizeInput(
                    textoTela,
                    MAX_SCREEN_CHARS
                )

            if (visual.isBlank()) {
                return ""
            }

            val command =
                comando
                    .trim()
                    .ifBlank {
                        "Analise a tela atual."
                    }

            return raciocinar(
                pergunta =
                    buildString {
                        append(command)
                        append(
                            "\n\nAnalise exclusivamente " +
                            "o conteúdo visível fornecido. "
                        )
                        append(
                            "Se for um texto, resuma ou explique. "
                        )
                        append(
                            "Se for uma questão, interprete-a. "
                        )
                        append(
                            "Se houver um erro ou aviso, explique " +
                            "o significado de forma objetiva."
                        )
                    },

                contextoTela =
                    visual,

                telemetry =
                    telemetry
            )
        }

        private fun ensureInitialized() {

            if (
                engine != null ||
                disabled.get()
            ) {
                return
            }

            if (attempted) {
                return
            }

            attempted =
                true

            val model =
                try {
                    resolveModelFile()
                } catch (_: Throwable) {
                    null
                }

            if (model == null) {
                return
            }

            try {

                /*
                 * Não força CPU/GPU.
                 *
                 * O próprio MediaPipe seleciona o backend
                 * compatível com o modelo empacotado.
                 */
                val options =
                    LlmInference
                        .LlmInferenceOptions
                        .builder()
                        .setModelPath(
                            model.absolutePath
                        )
                        .setMaxTokens(
                            MAX_TOKENS
                        )
                        .build()

                val loaded =
                    LlmInference
                        .createFromOptions(
                            appContext,
                            options
                        )

                engine =
                    loaded

                modelPath =
                    model.absolutePath

            } catch (_: Throwable) {

                engine =
                    null

                modelPath =
                    ""

                disabled.set(
                    true
                )
            }
        }

        private fun resolveModelFile(): File? {

            val internalModels =
                File(
                    appContext.filesDir,
                    "gama_models"
                )

            if (!internalModels.exists()) {
                internalModels.mkdirs()
            }

            /*
             * 1. Primeiro procura modelo que já foi copiado
             *    anteriormente.
             */
            val internalModel =
                internalModels
                    .listFiles()
                    ?.asSequence()
                    ?.filter {
                        it.isFile &&
                            it.canRead() &&
                            isSupportedModel(
                                it.name
                            ) &&
                            it.length() >=
                            MIN_MODEL_BYTES
                    }
                    ?.sortedByDescending {
                        modelPriority(
                            it.name
                        )
                    }
                    ?.firstOrNull()

            if (internalModel != null) {
                return internalModel
            }

            /*
             * 2. Procura dentro de assets/models.
             */
            val assetFiles =
                try {
                    appContext
                        .assets
                        .list("models")
                        ?.toList()
                        .orEmpty()
                } catch (_: Throwable) {
                    emptyList()
                }

            val assetModel =
                assetFiles
                    .filter {
                        isSupportedModel(it)
                    }
                    .sortedByDescending {
                        modelPriority(it)
                    }
                    .firstOrNull()

            if (assetModel != null) {

                val destination =
                    File(
                        internalModels,
                        assetModel
                    )

                if (
                    !destination.exists() ||
                    destination.length() <
                    MIN_MODEL_BYTES
                ) {
                    val temporary =
                        File(
                            internalModels,
                            "$assetModel.tmp"
                        )

                    try {
                        appContext
                            .assets
                            .open(
                                "models/$assetModel"
                            )
                            .use { input ->

                                FileOutputStream(
                                    temporary
                                ).use { output ->

                                    val buffer =
                                        ByteArray(
                                            COPY_BUFFER_SIZE
                                        )

                                    while (true) {

                                        val count =
                                            input.read(
                                                buffer
                                            )

                                        if (count < 0) {
                                            break
                                        }

                                        if (count > 0) {
                                            output.write(
                                                buffer,
                                                0,
                                                count
                                            )
                                        }
                                    }

                                    output.flush()
                                }
                            }

                        if (
                            temporary.length() >=
                            MIN_MODEL_BYTES
                        ) {
                            if (
                                destination.exists()
                            ) {
                                destination.delete()
                            }

                            if (
                                !temporary.renameTo(
                                    destination
                                )
                            ) {
                                temporary.copyTo(
                                    destination,
                                    overwrite = true
                                )

                                temporary.delete()
                            }
                        } else {
                            temporary.delete()
                        }

                    } catch (_: Throwable) {
                        temporary.delete()
                    }
                }

                if (
                    destination.exists() &&
                    destination.canRead() &&
                    destination.length() >=
                    MIN_MODEL_BYTES
                ) {
                    return destination
                }
            }

            /*
             * 3. Compatibilidade com a estrutura histórica do GAMA.
             *
             * getExternalFilesDir não exige permissão de storage.
             */
            val localCandidates =
                mutableListOf<File>()

            appContext
                .getExternalFilesDir(null)
                ?.let { root ->

                    localCandidates +=
                        File(
                            root,
                            "models/gama.task"
                        )

                    localCandidates +=
                        File(
                            root,
                            "models/gemma.task"
                        )

                    localCandidates +=
                        File(
                            root,
                            "models/model.task"
                        )

                    localCandidates +=
                        File(
                            root,
                            "gama.task"
                        )

                    localCandidates +=
                        File(
                            root,
                            "gemma.task"
                        )
                }

            /*
             * Estes caminhos permanecem como compatibilidade
             * com versões antigas. Android moderno pode impedir
             * leitura direta dependendo do armazenamento concedido.
             */
            localCandidates +=
                File(
                    "/sdcard/Documents/Gama/gama.task"
                )

            localCandidates +=
                File(
                    "/sdcard/Documents/Gama/gemma.task"
                )

            localCandidates +=
                File(
                    "/sdcard/Documents/Gama/model.task"
                )

            localCandidates +=
                File(
                    "/sdcard/Documents/Gama/gemma.bin"
                )

            return localCandidates
                .asSequence()
                .filter {
                    try {
                        it.exists() &&
                            it.isFile &&
                            it.canRead() &&
                            isSupportedModel(
                                it.name
                            ) &&
                            it.length() >=
                            MIN_MODEL_BYTES
                    } catch (_: Throwable) {
                        false
                    }
                }
                .sortedByDescending {
                    modelPriority(
                        it.name
                    )
                }
                .firstOrNull()
        }

        private fun isSupportedModel(
            name: String
        ): Boolean {

            val lower =
                name.lowercase(
                    Locale.US
                )

            /*
             * MediaPipe LLM Inference usa bundles/modelos
             * compatíveis .task e formatos .bin antigos.
             *
             * Um .tflite genérico NÃO é tratado como LLM válido,
             * evitando tentar carregar arquivo incompatível.
             */
            return lower.endsWith(
                ".task"
            ) ||
                lower.endsWith(
                    ".bin"
                )
        }

        private fun modelPriority(
            name: String
        ): Int {

            val lower =
                name.lowercase(
                    Locale.US
                )

            return when {

                lower ==
                    "gama.task" ->
                    1000

                lower ==
                    "gemma.task" ->
                    950

                lower.contains(
                    "gemma-3"
                ) &&
                    lower.endsWith(
                        ".task"
                    ) ->
                    900

                lower.contains(
                    "gemma"
                ) &&
                    lower.endsWith(
                        ".task"
                    ) ->
                    850

                lower ==
                    "model.task" ->
                    800

                lower.endsWith(
                    ".task"
                ) ->
                    700

                lower.endsWith(
                    ".bin"
                ) ->
                    500

                else ->
                    0
            }
        }

        private fun buildPrompt(
            question: String,
            screenContext: String,
            telemetry: GamaTelemetry?
        ): String {

            val visual =
                sanitizeInput(
                    screenContext,
                    MAX_SCREEN_CHARS
                )

            return buildString {

                append(
                    "Você é GAMA, a inteligência artificial " +
                    "pessoal que opera localmente neste celular.\n\n"
                )

                append(
                    "COMPORTAMENTO:\n" +
                    "- Responda em português do Brasil.\n" +
                    "- Seja direto, inteligente e conciso.\n" +
                    "- Use raciocínio cuidadoso antes de responder.\n" +
                    "- Não use frases genéricas de assistente.\n" +
                    "- Não diga que é um modelo de linguagem.\n" +
                    "- Não invente dados ausentes.\n" +
                    "- Não gere números aleatórios ou texto sem sentido.\n" +
                    "- Não afirme ter executado algo que não executou.\n" +
                    "- A resposta será falada por voz nativa.\n"
                )

                if (telemetry != null) {
                    append(
                        "\nESTADO ATUAL DO CELULAR:\n"
                    )

                    append(
                        telemetry.compact()
                    )

                    append('\n')
                }

                if (visual.isNotBlank()) {
                    append(
                        "\nCONTEÚDO VISÍVEL DA TELA:\n"
                    )

                    append(visual)
                    append('\n')
                }

                append(
                    "\nSOLICITAÇÃO:\n"
                )

                append(question)

                append(
                    "\n\nRESPOSTA DO GAMA:\n"
                )
            }
        }

        private fun sanitizeInput(
            value: String,
            maxLength: Int
        ): String {

            return value
                .replace(
                    '\u0000',
                    ' '
                )
                .replace(
                    Regex(
                        "[\\t ]+"
                    ),
                    " "
                )
                .trim()
                .take(
                    maxLength
                )
        }

        private fun sanitizeOutput(
            value: String
        ): String {

            var clean =
                value
                    .replace(
                        '\u0000',
                        ' '
                    )
                    .replace(
                        Regex(
                            "```[A-Za-z0-9_-]*"
                        ),
                        ""
                    )
                    .replace(
                        "```",
                        ""
                    )
                    .replace(
                        Regex(
                            "\\s+"
                        ),
                        " "
                    )
                    .trim()
                    .take(
                        MAX_RESPONSE_CHARS
                    )

            val prefixes =
                listOf(
                    "GAMA:",
                    "Gama:",
                    "Assistente:",
                    "Assistant:",
                    "Resposta:"
                )

            for (prefix in prefixes) {
                if (
                    clean.startsWith(
                        prefix,
                        ignoreCase = true
                    )
                ) {
                    clean =
                        clean
                            .substring(
                                prefix.length
                            )
                            .trim()

                    break
                }
            }

            if (clean.isBlank()) {
                return ""
            }

            if (
                clean.equals(
                    "7667",
                    ignoreCase = true
                )
            ) {
                return ""
            }

            if (
                clean.length > 7 &&
                clean.none {
                    it.isLetter()
                }
            ) {
                return ""
            }

            val words =
                clean
                    .lowercase(
                        Locale(
                            "pt",
                            "BR"
                        )
                    )
                    .split(
                        Regex("\\s+")
                    )
                    .filter {
                        it.length >= 2
                    }

            if (words.size >= 10) {

                val frequencies =
                    words
                        .groupingBy {
                            it
                        }
                        .eachCount()

                val highest =
                    frequencies
                        .values
                        .maxOrNull()
                        ?: 0

                if (
                    highest.toDouble() /
                    words.size.toDouble() >
                    0.65
                ) {
                    return ""
                }
            }

            return clean
        }

        fun reset() {
            synchronized(lock) {

                try {
                    engine?.close()
                } catch (_: Throwable) {
                }

                engine =
                    null

                attempted =
                    false

                disabled.set(
                    false
                )

                modelPath =
                    ""
            }
        }

        fun close() {
            synchronized(lock) {

                try {
                    engine?.close()
                } catch (_: Throwable) {
                }

                engine =
                    null
            }
        }

        companion object {

            /*
             * 768 reduz RAM e tempo de inferência no Samsung
             * sem remover raciocínio local.
             */
            private const val MAX_TOKENS =
                768

            private const val MIN_MODEL_BYTES =
                1024L * 1024L

            private const val COPY_BUFFER_SIZE =
                1024 * 1024

            private const val MAX_SCREEN_CHARS =
                14000

            private const val MAX_QUESTION_CHARS =
                6000

            private const val MAX_RESPONSE_CHARS =
                3000
        }
    }
    EOF

    # ============================================================
    # GARANTE QUE O NLU CONTINUA COM AS DUAS ROTAS:
    #
    # analyze_screen = visão + OCR + LLM
    # local_llm      = pergunta aberta/complexa local
    # ============================================================

    if ! grep -Fq \
      '"analyze_screen"' \
      "$NLU"
    then

      UNKNOWN_LINE="$(
        grep -n -m1 \
          '^[[:space:]]*private fun unknown' \
          "$NLU" |
          cut -d: -f1
      )"

      if [ -z "${UNKNOWN_LINE:-}" ]; then
        echo "ERRO: função unknown() não encontrada no NLU." >&2
        exit 1
      fi

      UNKNOWN_END="$(
        awk -v start="$UNKNOWN_LINE" '
          NR < start {
            next
          }

          NR == start {
            depth = 0
            opened = 0
          }

          NR >= start {
            tmp = $0

            opens =
              gsub(/\{/, "{", tmp)

            closes =
              gsub(/\}/, "}", tmp)

            if (opens > 0) {
              opened = 1
            }

            depth +=
              opens - closes

            if (
              opened == 1 &&
              depth == 0
            ) {
              print NR
              exit
            }
          }
        ' "$NLU"
      )"

      test -n "$UNKNOWN_END"

      cat <<'EOF' > /tmp/gama_unknown_fixed.kt

        private fun unknown(
            rawInput: String
        ): GamaDecision {

            val normalized =
                normalize(
                    rawInput
                )

            val screenAnalysis =
                containsAny(
                    normalized,

                    "analise a tela",
                    "analisa a tela",
                    "analisar a tela",

                    "entenda a tela",
                    "entende a tela",

                    "explique a tela",
                    "explica a tela",

                    "resuma a tela",
                    "resuma essa tela",

                    "interprete a tela",
                    "interpreta a tela",

                    "analise isso",
                    "analisa isso",

                    "o que tem nessa tela",
                    "o que tem nesta tela",

                    "o que esta nessa tela",
                    "o que esta nesta tela",

                    "o que aparece na tela",
                    "me explique essa tela"
                )

            if (screenAnalysis) {
                return GamaDecision(
                    speech = "",
                    action =
                        "analyze_screen",
                    target =
                        rawInput.trim(),
                    confidence =
                        0.98
                )
            }

            val complexPrefixes =
                listOf(
                    "quem ",
                    "o que ",
                    "oque ",
                    "por que ",
                    "porque ",
                    "como ",
                    "qual ",
                    "quais ",
                    "quando ",
                    "onde ",
                    "explique ",
                    "explica ",
                    "me explique ",
                    "me diga ",
                    "resuma ",
                    "compare ",
                    "analise ",
                    "analisa ",
                    "calcule ",
                    "calcula ",
                    "resolva ",
                    "resolve ",
                    "pense ",
                    "raciocine ",
                    "imagine "
                )

            val complex =
                normalized.contains("?") ||
                    complexPrefixes.any {
                        normalized.startsWith(
                            it
                        )
                    } ||
                    normalized.length >= 48

            if (complex) {
                return GamaDecision(
                    speech = "",
                    action =
                        "local_llm",
                    target =
                        rawInput.trim(),
                    confidence =
                        0.75
                )
            }

            /*
             * Nunca perde as capacidades antigas.
             */
            return GamaDecision(
                speech = "",
                action =
                    "legacy_command",
                target =
                    rawInput.trim(),
                confidence =
                    0.0
            )
        }
    EOF

      awk \
        -v start="$UNKNOWN_LINE" \
        -v finish="$UNKNOWN_END" \
        -v snippet="/tmp/gama_unknown_fixed.kt" '
        NR == start {
          while (
            (getline line < snippet) > 0
          ) {
            print line
          }

          close(snippet)
        }

        NR >= start &&
        NR <= finish {
          next
        }

        {
          print
        }
      ' "$NLU" > "${NLU}.tmp"

      mv \
        "${NLU}.tmp" \
        "$NLU"
    fi

    # ============================================================
    # EXECUTOR
    # Garante que nenhuma capacidade foi retirada.
    # ============================================================

    if ! grep -Fq \
      'private val gamaVisionCore' \
      "$EXECUTOR"
    then

      CLASS_LINE="$(
        grep -n -m1 -E \
          '^[[:space:]]*class[[:space:]]+GamaExecutor' \
          "$EXECUTOR" |
          cut -d: -f1
      )"

      CLASS_BRACE="$(
        awk -v start="$CLASS_LINE" '
          NR < start {
            next
          }

          NR >= start &&
          NR <= start + 15 &&
          $0 ~ /\{/ {
            print NR
            exit
          }
        ' "$EXECUTOR"
      )"

      test -n "$CLASS_BRACE"

      cat <<'EOF' > /tmp/gama_ai_properties.kt

        private val gamaVisionCore:
            GamaVisionCore by lazy {
                GamaVisionCore(
                    appContext
                )
            }

        private val gamaLlmBrain:
            GamaLlmBrain by lazy {
                GamaLlmBrain(
                    appContext
                )
            }

    EOF

      awk \
        -v target="$CLASS_BRACE" \
        -v snippet="/tmp/gama_ai_properties.kt" '
        {
          print
        }

        NR == target {
          while (
            (getline line < snippet) > 0
          ) {
            print line
          }

          close(snippet)
        }
      ' "$EXECUTOR" > "${EXECUTOR}.tmp"

      mv \
        "${EXECUTOR}.tmp" \
        "$EXECUTOR"
    fi

    if ! grep -Fq \
      '"local_llm"' \
      "$EXECUTOR"
    then

      CASE_ANCHOR="$(
        grep -n -m1 \
          '"flashlight_on"[[:space:]]*->' \
          "$EXECUTOR" |
          cut -d: -f1
      )"

      test -n "$CASE_ANCHOR"

      cat <<'EOF' > /tmp/gama_ai_cases.kt

                    "local_llm" ->
                        executeLocalReasoning(
                            decision.target
                        )

                    "analyze_screen" ->
                        executeScreenAnalysis(
                            decision.target
                        )

    EOF

      awk \
        -v target="$CASE_ANCHOR" \
        -v snippet="/tmp/gama_ai_cases.kt" '
        NR == target {
          while (
            (getline line < snippet) > 0
          ) {
            print line
          }

          close(snippet)
        }

        {
          print
        }
      ' "$EXECUTOR" > "${EXECUTOR}.tmp"

      mv \
        "${EXECUTOR}.tmp" \
        "$EXECUTOR"
    fi

    if ! grep -Fq \
      'private fun executeLocalReasoning' \
      "$EXECUTOR"
    then

      METHOD_ANCHOR="$(
        grep -n -m1 \
          '^[[:space:]]*private fun readBattery' \
          "$EXECUTOR" |
          cut -d: -f1
      )"

      test -n "$METHOD_ANCHOR"

      cat <<'EOF' > /tmp/gama_ai_methods.kt

        private fun executeLocalReasoning(
            question: String
        ): GamaExecutionResult {

            val telemetry =
                try {
                    collectTelemetry()
                } catch (_: Throwable) {
                    null
                }

            if (
                !gamaLlmBrain
                    .isAvailable()
            ) {
                /*
                 * Mantém o cérebro/engine antigo.
                 */
                return GamaExecutionResult(
                    handled = false,
                    success = false,
                    detail =
                        question
                )
            }

            val answer =
                try {
                    gamaLlmBrain
                        .raciocinar(
                            pergunta =
                                question,

                            contextoTela =
                                "",

                            telemetry =
                                telemetry
                        )
                } catch (_: Throwable) {
                    ""
                }

            if (answer.isBlank()) {
                return GamaExecutionResult(
                    handled = false,
                    success = false,
                    detail =
                        question
                )
            }

            return GamaExecutionResult(
                handled = true,
                success = true,
                speechOverride =
                    answer
            )
        }

        private fun executeScreenAnalysis(
            command: String
        ): GamaExecutionResult {

            val visual =
                try {
                    gamaVisionCore
                        .contextoVisualCompleto()
                } catch (_: Throwable) {
                    ""
                }

            if (visual.isBlank()) {
                return GamaExecutionResult(
                    handled = true,
                    success = false,
                    speechOverride =
                        "Não encontrei conteúdo visível para analisar."
                )
            }

            val telemetry =
                try {
                    collectTelemetry()
                } catch (_: Throwable) {
                    null
                }

            /*
             * Se o LLM não estiver disponível,
             * OCR/Accessibility CONTINUAM FUNCIONANDO.
             */
            if (
                !gamaLlmBrain
                    .isAvailable()
            ) {
                val readable =
                    visual
                        .replace(
                            "[CONTEUDO_ACESSIBILIDADE]",
                            ""
                        )
                        .replace(
                            "[CONTEUDO_OCR]",
                            ""
                        )
                        .trim()

                return GamaExecutionResult(
                    handled = true,
                    success =
                        readable.isNotBlank(),
                    speechOverride =
                        readable.take(
                            2800
                        )
                )
            }

            val answer =
                try {
                    gamaLlmBrain
                        .analisarTela(
                            comando =
                                command,

                            textoTela =
                                visual,

                            telemetry =
                                telemetry
                        )
                } catch (_: Throwable) {
                    ""
                }

            if (answer.isBlank()) {

                val readable =
                    visual
                        .replace(
                            "[CONTEUDO_ACESSIBILIDADE]",
                            ""
                        )
                        .replace(
                            "[CONTEUDO_OCR]",
                            ""
                        )
                        .trim()

                return GamaExecutionResult(
                    handled = true,
                    success =
                        readable.isNotBlank(),
                    speechOverride =
                        readable.take(
                            2800
                        )
                )
            }

            return GamaExecutionResult(
                handled = true,
                success = true,
                speechOverride =
                    answer
            )
        }

        fun closeVisionAndLlm() {

            try {
                gamaVisionCore.close()
            } catch (_: Throwable) {
            }

            try {
                gamaLlmBrain.close()
            } catch (_: Throwable) {
            }
        }

    EOF

      awk \
        -v target="$METHOD_ANCHOR" \
        -v snippet="/tmp/gama_ai_methods.kt" '
        NR == target {
          while (
            (getline line < snippet) > 0
          ) {
            print line
          }

          close(snippet)
        }

        {
          print
        }
      ' "$EXECUTOR" > "${EXECUTOR}.tmp"

      mv \
        "${EXECUTOR}.tmp" \
        "$EXECUTOR"
    fi

    # ============================================================
    # SERVIÇO
    #
    # Não recria o pipeline.
    # Apenas confirma que o pipeline completo anterior continua.
    # ============================================================

    grep -Fq \
      'GAMA_OFFLINE_RECOGNITION_BRIDGE' \
      "$SERVICE" || {
        echo "ERRO: bridge Vosk -> NLU ausente." >&2
        exit 1
      }

    grep -Fq \
      'gamaOfflineBargeIn' \
      "$SERVICE" || {
        echo "ERRO: Barge-in ausente." >&2
        exit 1
      }

    grep -Fq \
      'gamaOfflineVoice' \
      "$SERVICE" || {
        echo "ERRO: NativeVoice ausente." >&2
        exit 1
      }

    grep -Fq \
      'gamaOfflineExecutor' \
      "$SERVICE" || {
        echo "ERRO: Executor offline ausente." >&2
        exit 1
      }

    grep -Fq \
      'ACTION_UI_PULSE' \
      "$SERVICE" || {
        echo "ERRO: animação ACTION_UI_PULSE ausente." >&2
        exit 1
      }

    # ============================================================
    # ACCESSIBILITY SCREENSHOT VALIDATION
    # ============================================================

    if [ -s "$ACCESS" ]; then
      grep -Fq \
        'capturarTelaAtualBitmap' \
        "$ACCESS" || {
          echo "ERRO: captura de tela da Accessibility ausente." >&2
          exit 1
        }
    fi

    # ============================================================
    # MODEL CHECK
    #
    # NÃO quebra as outras funções caso o modelo não esteja
    # empacotado. O GAMA continua com NLU/legacy/OCR.
    # ============================================================

    MODEL_COUNT="$(
      find "$MODELS" \
        -maxdepth 1 \
        -type f \
        \( \
          -iname '*.task' \
          -o \
          -iname '*.bin' \
        \) \
        2>/dev/null |
        wc -l |
        tr -d ' '
    )"

    if [ "$MODEL_COUNT" -gt 0 ]; then
      echo "Modelo LLM local encontrado em assets/models."
    else
      echo "Modelo LLM não empacotado."
      echo "Fallback NLU + legacy + OCR permanecerá funcional."
      echo "GamaLlmBrain também procurará modelo local no aparelho."
    fi

    # ============================================================
    # ZERO CLOUD AUDIT
    # ============================================================

    if grep -R -E \
      'api\.groq\.com|api\.openai\.com|api\.elevenlabs\.io|Retrofit|retrofit2\.|okhttp3\.|HttpsURLConnection|HttpURLConnection' \
      "$SRC/GamaVisionCore.kt" \
      "$SRC/GamaLlmBrain.kt"
    then
      echo "ERRO: referência de nuvem encontrada." >&2
      exit 1
    fi

    # ============================================================
    # STRUCTURAL AUDIT
    # ============================================================

    grep -Fq \
      'implementation("com.google.mediapipe:tasks-genai:0.10.21")' \
      "$GRADLE"

    grep -Fq \
      'implementation("com.google.mlkit:text-recognition:16.0.1")' \
      "$GRADLE"

    grep -Fq \
      'class GamaVisionCore' \
      "$SRC/GamaVisionCore.kt"

    grep -Fq \
      'fun extrairTextoDaImagem' \
      "$SRC/GamaVisionCore.kt"

    grep -Fq \
      'class GamaLlmBrain' \
      "$SRC/GamaLlmBrain.kt"

    grep -Fq \
      'generateResponse' \
      "$SRC/GamaLlmBrain.kt"

    grep -Fq \
      'resolveModelFile' \
      "$SRC/GamaLlmBrain.kt"

    grep -Fq \
      '"analyze_screen"' \
      "$NLU"

    grep -Fq \
      '"local_llm"' \
      "$NLU"

    grep -Fq \
      '"analyze_screen"' \
      "$EXECUTOR"

    grep -Fq \
      '"local_llm"' \
      "$EXECUTOR"

    grep -Fq \
      'GamaVisionCore' \
      "$EXECUTOR"

    grep -Fq \
      'GamaLlmBrain' \
      "$EXECUTOR"

    # ============================================================
    # KOTLIN/YAML SANITY
    # ============================================================

    test -s "$SRC/GamaVisionCore.kt"
    test -s "$SRC/GamaLlmBrain.kt"
    test -s "$NLU"
    test -s "$EXECUTOR"
    test -s "$SERVICE"

    rm -f \
      /tmp/gama_unknown_fixed.kt \
      /tmp/gama_ai_properties.kt \
      /tmp/gama_ai_cases.kt \
      /tmp/gama_ai_methods.kt

    echo "===================================================="
    echo "GAMA Vision + Local LLM Core corrigido."
    echo "OCR: OK"
    echo "LLM LOCAL: OK"
    echo "NLU: OK"
    echo "ACCESSIBILITY: PRESERVADA"
    echo "EXECUTOR: PRESERVADO"
    echo "NATIVE VOICE: PRESERVADA"
    echo "BARGE-IN: PRESERVADO"
    echo "ACTION_UI_PULSE: PRESERVADO"
    echo "LEGACY FALLBACK: PRESERVADO"
    echo "CLOUD APIs: ZERO"
    echo "JAVA 17 COMPATIBILITY PATH: ENABLED"
    echo "===================================================="
