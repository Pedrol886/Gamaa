name: Build Gama 10.7.0 VOICEBRAIN178 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: gama-10-7-0-voicebrain178-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GAMA_BASE_RUN_ID: "37445474860"
      GAMA_BASE_ARTIFACT: "Gama-10.6.2-LOCALFIRST177-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore proven LOCALFIRST177 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build
          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build
          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaGeminiClient.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaReliableAppLauncher.kt
          test -s _gama_build/app/src/main/assets/model/final.mdl
          test -s _gama_build/app/src/main/assets/model/Gr.fst
          test -s _gama_build/app/src/main/assets/spk-model/final.ext.raw
          test -f _gama_build/gradlew
          chmod +x _gama_build/gradlew

      - name: Initialize VOICEBRAIN178 overlay
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/gama178-overlay.b64"

      - name: Overlay chunk 01
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/gama178-overlay.b64" <<'GAMA178_01'
          
          GAMA178_01


      - name: Overlay chunk 02
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/gama178-overlay.b64" <<'GAMA178_02'
          
          GAMA178_02


      - name: Overlay chunk 03
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/gama178-overlay.b64" <<'GAMA178_03'
          
          GAMA178_03


      - name: Overlay chunk 04
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/gama178-overlay.b64" <<'GAMA178_04'
          
          GAMA178_04


      - name: Overlay chunk 05
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/gama178-overlay.b64" <<'GAMA178_05'
          
          GAMA178_05


      - name: Overlay chunk 06
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/gama178-overlay.b64" <<'GAMA178_06'
          
          GAMA178_06


      - name: Overlay chunk 07
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/gama178-overlay.b64" <<'GAMA178_07'
          
          GAMA178_07


      - name: Overlay chunk 08
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/gama178-overlay.b64" <<'GAMA178_08'
          
          GAMA178_08

      - name: Apply VOICEBRAIN178 overlay
        run: |
          set -euo pipefail
          base64 --decode "$RUNNER_TEMP/gama178-overlay.b64" > "$RUNNER_TEMP/gama178-overlay.tar.gz"
          echo "983f066b5531758a4c9148eb30058ce1753c49d9ca33e366d56c6966ed8d16f1  $RUNNER_TEMP/gama178-overlay.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gama178-overlay.tar.gz" -C _gama_build

      - name: Patch live conversation route
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/gama178_patch.py" <<'PY_PATCH'
          from pathlib import Path
          import os
          import re

          root = Path("_gama_build")
          service_path = root / "app/src/main/java/com/gama/assistant/GamaService.kt"
          gradle_path = root / "app/build.gradle.kts"

          service = service_path.read_text(encoding="utf-8")
          marker = "                val decision = result.getOrNull()\n"
          start = service.find(marker)
          if start < 0:
              raise SystemExit("Bloco Gemini da #177 não encontrado")
          end = service.find("                when (decision.action) {", start)
          if end < 0:
              raise SystemExit("Fim do bloco Gemini não encontrado")
          block = service[start:end]
          old_reply = '                    val reply = "A conversa online não respondeu agora. Os comandos do celular continuam funcionando normalmente; para conversar, confira a nova chave do Gemini nas configurações do Gama."\n'
          if old_reply not in block:
              raise SystemExit("Mensagem antiga do Gemini não encontrada")
          block = block.replace(
              old_reply,
              '                    val reply = GamaGeminiClient.friendlyFailure(result.exceptionOrNull())\n'
              '                    Log.w(TAG, "Gemini conversation failed: ${result.exceptionOrNull()?.javaClass?.simpleName}: ${result.exceptionOrNull()?.message}")\n',
              1,
          )
          block = block.replace(
              "                    speakCommandReply(reply, privateData)\n",
              "                    speakCommandReply(reply, privateData, closeAfter = false)\n",
              1,
          )
          service = service[:start] + block + service[end:]

          brain = service.find("// GAMA105_UNIFIED_GEMINI_BRAIN")
          if brain < 0:
              raise SystemExit("Marcador do cérebro Gemini não encontrado")
          fallback_pos = service.find("speakCommandReply(fallback, privateData)", brain)
          reply_pos = service.find("speakCommandReply(reply, privateData)", brain)
          if fallback_pos < 0 or reply_pos < 0:
              raise SystemExit("Respostas Gemini não encontradas")
          service = service[:fallback_pos] + "speakCommandReply(fallback, privateData, closeAfter = false)" + service[fallback_pos + len("speakCommandReply(fallback, privateData)"):]
          reply_pos = service.find("speakCommandReply(reply, privateData)", brain)
          service = service[:reply_pos] + "speakCommandReply(reply, privateData, closeAfter = false)" + service[reply_pos + len("speakCommandReply(reply, privateData)"):]
          service_path.write_text(service, encoding="utf-8")

          gradle = gradle_path.read_text(encoding="utf-8")
          version_code = 25_700_000 + int(os.environ["GITHUB_RUN_NUMBER"])
          gradle, c1 = re.subn(r"versionCode\s*=\s*\d+", f"versionCode = {version_code}", gradle, count=1)
          gradle, c2 = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "Gama 10.7.0 VoiceBrain178"', gradle, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit("Falha ao atualizar versão")
          gradle_path.write_text(gradle, encoding="utf-8")
          print(f"PATCH VOICEBRAIN178 OK, versionCode={version_code}")
          PY_PATCH

          python3 -m py_compile "$GITHUB_WORKSPACE/gama178_patch.py"
          python3 "$GITHUB_WORKSPACE/gama178_patch.py"

      - name: Source integrity audit
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/gama178_audit.py" <<'PY_AUDIT'
          from pathlib import Path
          import re

          root = Path("_gama_build")
          src = root / "app/src/main/java/com/gama/assistant"
          service = (src / "GamaService.kt").read_text(encoding="utf-8", errors="ignore")
          client = (src / "GamaGeminiClient.kt").read_text(encoding="utf-8", errors="ignore")
          launcher = (src / "GamaReliableAppLauncher.kt").read_text(encoding="utf-8", errors="ignore")
          catalog = (src / "GamaInstalledAppCatalog.kt").read_text(encoding="utf-8", errors="ignore")
          registry = (src / "GamaAppRegistry.kt").read_text(encoding="utf-8", errors="ignore")
          gradle = (root / "app/build.gradle.kts").read_text(encoding="utf-8", errors="ignore")

          kt_files = list(src.glob("*.kt"))
          kt_lines = sum(len(p.read_text(encoding="utf-8", errors="ignore").splitlines()) for p in kt_files)
          if len(kt_files) < 140:
              raise SystemExit(f"Regressão Kotlin: {len(kt_files)} arquivos")
          if kt_lines < 29900:
              raise SystemExit(f"Regressão Kotlin: {kt_lines} linhas")

          checks = {
              "Gemini 3.8": '"gemini-3.8-flash"' in client,
              "Gemini 3.6": '"gemini-3.6-flash"' in client,
              "thinking low": '"thinkingLevel", "low"' in client,
              "no temperature": 'put("temperature"' not in client,
              "4096 output budget": 'put("maxOutputTokens", 4096)' in client,
              "compatibility retry": "compatibilityMode" in client and "GeminiPayloadRejected" in client,
              "friendly failure": "friendlyFailure" in client and "GamaGeminiClient.friendlyFailure" in service,
              "Gemini conversation stays active": "speakCommandReply(reply, privateData, closeAfter = false)" in service,
              "WhatsApp implicit URI": 'Uri.parse("whatsapp://send")' in launcher,
              "WhatsApp hard alias": 'id = "whatsapp"' in catalog,
              "WhatsApp variant verify": 'contains("whatsapp")' in registry,
              "no offline LLM dependency": "tasks-genai" not in gradle,
          }
          bad = [name for name, ok in checks.items() if not ok]
          if bad:
              raise SystemExit("Falha de integridade: " + ", ".join(bad))

          for asset in [
              root / "app/src/main/assets/model/final.mdl",
              root / "app/src/main/assets/model/Gr.fst",
              root / "app/src/main/assets/spk-model/final.ext.raw",
          ]:
              if not asset.is_file() or asset.stat().st_size == 0:
                  raise SystemExit(f"Vosk ausente: {asset}")

          secret_patterns = [
              re.compile(r"AIza[A-Za-z0-9_-]{20,}"),
              re.compile(r"AQ\.[A-Za-z0-9_-]{20,}"),
          ]
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in {".kt", ".kts", ".xml", ".json", ".txt", ".md", ".sh"}:
                  continue
              text = p.read_text(encoding="utf-8", errors="ignore")
              if any(rx.search(text) for rx in secret_patterns):
                  raise SystemExit(f"Possível chave embutida em {p}")

          print(f"PASS: {len(kt_files)} Kotlin files, {kt_lines} Kotlin lines")
          PY_AUDIT

          python3 -m py_compile "$GITHUB_WORKSPACE/gama178_audit.py"
          python3 "$GITHUB_WORKSPACE/gama178_audit.py"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean

      - name: Compile Release Kotlin
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:compileReleaseKotlin --stacktrace

      - name: Unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testReleaseUnitTest --stacktrace

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:lintRelease --stacktrace

      - name: Assemble Release
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Zipalign and sign APK
        env:
          GAMA_KEYSTORE_B64: ${{ secrets.GAMA_KEYSTORE_B64 }}
          GAMA_KEYSTORE_PASSWORD: ${{ secrets.GAMA_KEYSTORE_PASSWORD }}
          GAMA_KEY_ALIAS: ${{ secrets.GAMA_KEY_ALIAS }}
          GAMA_KEY_PASSWORD: ${{ secrets.GAMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          input_apk="$(find "$GITHUB_WORKSPACE/_gama_build/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | head -n 1 || true)"
          if [ -z "$input_apk" ] || [ ! -s "$input_apk" ]; then
            echo "::error::assembleRelease terminou sem APK."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/_gama_build/dist"
          aligned="$GITHUB_WORKSPACE/_gama_build/dist/Gama-aligned.apk"
          final_apk="$GITHUB_WORKSPACE/_gama_build/dist/Gama.apk"
          "$ZIPALIGN" -f -p 4 "$input_apk" "$aligned"

          if [ -n "${GAMA_KEYSTORE_B64:-}" ] && [ -n "${GAMA_KEYSTORE_PASSWORD:-}" ] && [ -n "${GAMA_KEY_ALIAS:-}" ] && [ -n "${GAMA_KEY_PASSWORD:-}" ]; then
            echo "$GAMA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gama-release.jks"
            KEYSTORE="$RUNNER_TEMP/gama-release.jks"
            STORE_PASS="$GAMA_KEYSTORE_PASSWORD"
            KEY_ALIAS="$GAMA_KEY_ALIAS"
            KEY_PASS="$GAMA_KEY_PASSWORD"
          else
            KEYSTORE="$RUNNER_TEMP/gama-test.jks"
            STORE_PASS="gama-test-pass"
            KEY_ALIAS="gama-test"
            KEY_PASS="gama-test-pass"
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Gama Test, OU=Gama, O=Gama, L=Aracaju, ST=Sergipe, C=BR" \
              -noprompt
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$STORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$final_apk" \
            "$aligned"
          "$APKSIGNER" verify --verbose --print-certs "$final_apk"

      - name: Verify final APK
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/_gama_build/dist/Gama.apk"
          test -s "$APK"
          APK_SIZE="$(stat -c%s "$APK")"
          if [ "$APK_SIZE" -lt 10000000 ]; then
            echo "::error::APK suspeitamente pequeno: $APK_SIZE bytes."
            exit 1
          fi
          unzip -l "$APK" | grep -Fq 'assets/model/final.mdl'
          unzip -l "$APK" | grep -Fq 'classes.dex'
          echo "PASS: Gama.apk VOICEBRAIN178 verificado."
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.7.0-VOICEBRAIN178-APK
          path: _gama_build/dist/Gama.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.7.0-VOICEBRAIN178-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/app/build/**
            !_gama_build/dist/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.7.0-VOICEBRAIN178-diagnostics
          path: |
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
