name: Build Gama 9.4.2 Continuous Core Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-9-4-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    defaults:
      run:
        shell: bash

    env:
      GAMA_BASE_RUN_ID: "37158343882"
      GAMA_BASE_ARTIFACT: "Gama-9.3.0-JARVIS-source"

      # Contém a transformação completa Continuous Core criada no #139.
      # O workflow atual extrai essa transformação, corrige a sintaxe e
      # valida com py_compile antes de tocar no source.
      GAMA_94_TEMPLATE_COMMIT: "b81455bdc29c25f85fa6b34612cee526e1c45508"

      GAMA_EXPECTED_CERT_SHA256: "6933EDA890C29567A8F4B6CEAD7A39A442DF109D43B813A19F3F6FA7F39B078C"

    steps:

      # ==============================================================
      # CHECKOUT
      # ==============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==============================================================
      # SIGNING
      # ==============================================================

      - name: Resolve signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then

            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-9.4.2-CONTINUOUS-CORE-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"

            echo "::warning::GAMA_SIGNING_SEED ausente. O APK será Release, porém instalação limpa."

          elif printf '%s' "$GAMA_SIGNING_SEED" \
            | grep -Eq '^[0-9A-Fa-f]{64}$'; then

            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-9.4.2-CONTINUOUS-CORE-APK" >> "$GITHUB_OUTPUT"

          else

            echo "::error::GAMA_SIGNING_SEED deve conter exatamente 64 caracteres hexadecimais."
            exit 1

          fi

      # ==============================================================
      # RESTORE EXACT SUCCESSFUL SOURCE
      # ==============================================================

      - name: Restore exact successful Gama 9.3.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download \
            "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s \
            _gama_build/app/build.gradle.kts

          test -s \
            _gama_build/app/src/main/AndroidManifest.xml

          test -s \
            _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt

          test -s \
            _gama_build/app/src/main/java/com/gama/assistant/GamaEnergyView.kt

          test -s \
            _gama_build/app/src/main/java/com/gama/assistant/GamaReliableAppLauncher.kt

          grep -Fq \
            'Gama 9.3.0 JARVIS Reliability' \
            _gama_build/app/build.gradle.kts

          echo "PASS: fonte exata do #136 restaurada."

      # ==============================================================
      # VERIFY SOURCE
      # ==============================================================

      - name: Verify exact audited source
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual

            test -s "$file"

            actual="$(
              git hash-object "$file"
            )"

            if [ "$actual" != "$expected" ]; then

              echo "::error::Arquivo diferente da versão auditada: $file"
              echo "expected=$expected"
              echo "actual=$actual"

              exit 1
            fi

            echo "PASS $file"
          }

          ROOT="_gama_build"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaService.kt" \
            "da73a2f7aeec16fa5d6202812924164b776804d9"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/ConversationSession.kt" \
            "ccac0acb53313b63f0bccc06f20291da7b820920"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaSupervisor.kt" \
            "dea7bae963dc9bc18169238ef621ff386fb7672b"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaRecognitionPolicy.kt" \
            "cb0448b364902b7f47d8f1bbb1b4e8f8310a3e50"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/VoicePolicy.kt" \
            "21bec82e4144a232f6673711c7d4c7911971df68"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaAppRegistry.kt" \
            "f4d8b5e3c1ce3b7b011c73311c56aedec80c140d"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaReliableAppLauncher.kt" \
            "852ef57c39503cd02b7fd08a1e109693387876c0"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaLaunchFallback.kt" \
            "70427dd230eca9c81338d4652a12a4ff5c17543c"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/LocalBrain.kt" \
            "9f9b02c0768cb1ff1d36943e491cfb2c1efefbc7"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaBrainProcessService.kt" \
            "6ef1b60c8a7dc991b2d5f38bc59062544d512770"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/BrainProcessProtocol.kt" \
            "629b434dd22fbfad19dda0ef0784c4312bb1f009"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaReplyGuard.kt" \
            "01cf76301cb8915bf8ef58043c02424175c7e628"

          check_blob \
            "$ROOT/app/build.gradle.kts" \
            "e8005e575476b8152c33a9db0dc82556d0de657c"

          check_blob \
            "$ROOT/app/src/main/AndroidManifest.xml" \
            "e898888312d7c1355cf751b9dc391ca1aa3a48ea"

          echo "PASS: todos os arquivos correspondem ao source auditado."

      # ==============================================================
      # RECOVER COMPLETE 9.4 CONTINUOUS CORE TRANSFORMATION
      # ==============================================================

      - name: Recover and repair complete Gama 9.4 transformation
        run: |
          set -euo pipefail

          git show \
            "$GAMA_94_TEMPLATE_COMMIT:.github/workflows/build-gama.yml" \
            > /tmp/gama139-workflow.yml

          python3 - \
            /tmp/gama139-workflow.yml \
            /tmp/gama94-transform.py \
            <<'EXTRACT_PY'

          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])

          content = source.read_text(
              encoding="utf-8"
          )

          lines = content.splitlines()

          # Encontrar especificamente a transformação Continuous Core,
          # em vez de simplesmente pegar o primeiro Python do workflow.

          step_index = None

          for i, line in enumerate(lines):
              if (
                  "name: Apply Gama 9.4.0 Continuous Core"
                  in line
              ):
                  step_index = i
                  break

          if step_index is None:
              raise SystemExit(
                  "Etapa Apply Gama 9.4.0 Continuous Core "
                  "não encontrada no workflow #139."
              )

          start = None

          for i in range(
              step_index,
              len(lines)
          ):
              if "python3 - <<'PY'" in lines[i]:
                  start = i
                  break

          if start is None:
              raise SystemExit(
                  "Python da transformação 9.4 não encontrado."
              )

          marker_indent = (
              len(lines[start]) -
              len(lines[start].lstrip(" "))
          )

          end = None

          for i in range(
              start + 1,
              len(lines)
          ):
              if lines[i].strip() == "PY":
                  end = i
                  break

          if end is None:
              raise SystemExit(
                  "Final do Python da transformação 9.4 não encontrado."
              )

          prefix = " " * marker_indent

          body = []

          for line in lines[
              start + 1:end
          ]:
              if line.startswith(prefix):
                  body.append(
                      line[marker_indent:]
                  )
              else:
                  body.append(line)

          script = "\n".join(body) + "\n"

          # ==========================================================
          # CORRIGIR AS QUEBRAS DE SINTAXE QUE EXISTIAM NO #139
          # ==========================================================

          replacements = [
              (
                  re.compile(
                      r'(?m)^registry\s*=\s*\n'
                      r'\s*src\s*/\s*'
                      r'"GamaAppRegistry\.kt"\s*$'
                  ),
                  'registry = src / "GamaAppRegistry.kt"'
              ),
              (
                  re.compile(
                      r'(?m)^service\s*=\s*\n'
                      r'\s*src\s*/\s*'
                      r'"GamaService\.kt"\s*$'
                  ),
                  'service = src / "GamaService.kt"'
              ),
              (
                  re.compile(
                      r'(?m)^value\s*=\s*\n'
                      r'\s*service\.read_text\($'
                  ),
                  'value = service.read_text('
              ),
              (
                  re.compile(
                      r'(?m)^gradle\s*=\s*\n'
                      r'\s*root\s*/\s*'
                      r'"app/build\.gradle\.kts"\s*$'
                  ),
                  'gradle = root / "app/build.gradle.kts"'
              ),
              (
                  re.compile(
                      r'(?m)^recognition_test\s*=\s*\n'
                      r'\s*tests\s*/\s*\n'
                      r'\s*"GamaRecognitionPolicyTest\.kt"\s*$'
                  ),
                  'recognition_test = tests / "GamaRecognitionPolicyTest.kt"'
              ),
              (
                  re.compile(
                      r'(?m)^reports\s*=\s*\n'
                      r'\s*root\s*/\s*'
                      r'"reports"\s*$'
                  ),
                  'reports = root / "reports"'
              ),
          ]

          labels = [
              "registry",
              "service",
              "value",
              "gradle",
              "recognition_test",
              "reports",
          ]

          for label, (pattern, replacement) in zip(
              labels,
              replacements
          ):
              script, count = pattern.subn(
                  replacement,
                  script,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      "Não consegui reparar exatamente uma ocorrência "
                      f"de {label}. Ocorrências: {count}"
                  )

          # Guardas contra os bugs do #139 e #140.

          forbidden = [
              "registry =\n",
              "service =\n",
              "value =\n",
              "gradle =\n",
              "recognition_test =\n",
              "recognition_test = tests /\n",
              "reports =\n",
          ]

          for fragment in forbidden:
              if fragment in script:
                  raise SystemExit(
                      "Ainda existe Python quebrado: "
                      + repr(fragment)
                  )

          output.write_text(
              script,
              encoding="utf-8"
          )

          print(
              "PASS: transformação 9.4 extraída e reparada."
          )

          EXTRACT_PY

          # Importantíssimo:
          # validar sintaxe antes de alterar qualquer arquivo Android.

          python3 -m py_compile \
            /tmp/gama94-transform.py

          echo "PASS: Python da transformação é sintaticamente válido."

          # Só agora aplicar no source real.

          python3 \
            /tmp/gama94-transform.py

          echo "PASS: Continuous Core aplicado."

      # ==============================================================
      # NEW MOUTH ANIMATION
      # ==============================================================

      - name: Replace mouth animation with exact marked-mouth movement
        run: |
          set -euo pipefail

          cat > \
            _gama_build/app/src/main/java/com/gama/assistant/GamaEnergyView.kt \
            <<'KOTLIN'

          package com.gama.assistant

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.RectF
          import android.util.AttributeSet
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.sin

          /**
           * Visual principal do GAMA.
           *
           * IMPORTANTE:
           * a cabeça não é deformada.
           *
           * Durante SPEAKING somente a pequena peça vermelha
           * inferior central da logo se move.
           *
           * Essa é a região que o usuário marcou como boca.
           */
          class GamaEnergyView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null,
          ) : View(
              context,
              attrs,
          ) {

              enum class Mode {
                  LISTENING,
                  THINKING,
                  SPEAKING,
              }

              var mode: Mode = Mode.LISTENING
                  set(value) {
                      field = value
                      invalidate()
                  }

              private val logo: Bitmap =
                  BitmapFactory.decodeResource(
                      resources,
                      R.drawable.gama_red_core,
                  )

              private val bitmapPaint =
                  Paint(
                      Paint.ANTI_ALIAS_FLAG or
                          Paint.FILTER_BITMAP_FLAG
                  )

              private val glowPaint =
                  Paint(
                      Paint.ANTI_ALIAS_FLAG
                  )

              private val ringPaint =
                  Paint(
                      Paint.ANTI_ALIAS_FLAG
                  ).apply {
                      style =
                          Paint.Style.STROKE
                  }

              private var phase =
                  0f

              private var released =
                  false

              private val animator =
                  ValueAnimator.ofFloat(
                      0f,
                      1f,
                  ).apply {

                      duration =
                          1_000L

                      repeatCount =
                          ValueAnimator.INFINITE

                      interpolator =
                          LinearInterpolator()

                      addUpdateListener {
                          phase =
                              it.animatedValue
                                  as Float

                          invalidate()
                      }
                  }

              init {
                  setLayerType(
                      LAYER_TYPE_SOFTWARE,
                      null,
                  )

                  animator.start()
              }

              override fun onDraw(
                  canvas: Canvas
              ) {
                  super.onDraw(
                      canvas
                  )

                  if (
                      width <= 0 ||
                      height <= 0 ||
                      logo.width <= 0 ||
                      logo.height <= 0
                  ) {
                      return
                  }

                  val minSize =
                      minOf(
                          width,
                          height,
                      ).toFloat()

                  val radians =
                      phase *
                          (PI * 2.0)

                  val speechWave =
                      (
                          abs(
                              sin(
                                  radians * 3.0
                              )
                          ) * 0.48 +
                              abs(
                                  sin(
                                      radians * 5.4 +
                                          0.72
                                  )
                              ) * 0.34 +
                              abs(
                                  sin(
                                      radians * 7.7 +
                                          1.3
                                  )
                              ) * 0.18
                          )
                          .toFloat()
                          .coerceIn(
                              0f,
                              1f,
                          )

                  val statePulse =
                      when (mode) {

                          Mode.LISTENING ->
                              (
                                  0.5 +
                                      0.5 *
                                      sin(
                                          radians *
                                              1.2
                                      )
                                  )
                                  .toFloat()

                          Mode.THINKING ->
                              (
                                  0.5 +
                                      0.5 *
                                      sin(
                                          radians *
                                              1.9
                                      )
                                  )
                                  .toFloat()

                          Mode.SPEAKING ->
                              speechWave
                      }

                  val cx =
                      width / 2f

                  val cy =
                      height / 2f

                  # this comment is replaced below
              }

              private fun drawRegion(
                  canvas: Canvas,
                  src: Rect,
                  dst: RectF,
              ) {
                  if (
                      src.width() <= 0 ||
                      src.height() <= 0 ||
                      dst.width() <= 0f ||
                      dst.height() <= 0f
                  ) {
                      return
                  }

                  canvas.drawBitmap(
                      logo,
                      src,
                      dst,
                      bitmapPaint,
                  )
              }

              fun release() {
                  if (!released) {
                      released = true
                      animator.cancel()
                  }
              }

              override fun onDetachedFromWindow() {
                  release()
                  super.onDetachedFromWindow()
              }
          }

          KOTLIN

          # O bloco Kotlin acima foi escrito em duas etapas para evitar
          # edições enormes e frágeis no shell.
          #
          # Substituímos o marcador pela implementação real do desenho.

          python3 - <<'PY'

          from pathlib import Path

          path = Path(
              "_gama_build/app/src/main/java/com/gama/assistant/GamaEnergyView.kt"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          marker = (
              "                  # this comment is replaced below\n"
          )

          if marker not in text:
              raise SystemExit(
                  "Marcador da animação da boca não encontrado."
              )

          drawing = r'''
                  /*
                   * Aura vermelha do estado.
                   *
                   * Ela NÃO modifica a geometria da cabeça.
                   */
                  val auraRadius =
                      minSize *
                          (
                              0.40f +
                                  0.014f *
                                  statePulse
                              )

                  val auraAlpha =
                      when (mode) {
                          Mode.LISTENING -> 40
                          Mode.THINKING -> 65
                          Mode.SPEAKING -> 82
                      }

                  glowPaint.style =
                      Paint.Style.FILL

                  glowPaint.color =
                      Color.argb(
                          auraAlpha,
                          225,
                          20,
                          32,
                      )

                  glowPaint.setShadowLayer(
                      minSize * 0.12f,
                      0f,
                      0f,
                      Color.rgb(
                          180,
                          10,
                          20,
                      ),
                  )

                  canvas.drawCircle(
                      cx,
                      cy,
                      auraRadius,
                      glowPaint,
                  )

                  glowPaint.clearShadowLayer()

                  /*
                   * A logo fica parada.
                   */
                  val availableWidth =
                      width * 0.91f

                  val availableHeight =
                      height * 0.91f

                  val scale =
                      minOf(
                          availableWidth /
                              logo.width.toFloat(),
                          availableHeight /
                              logo.height.toFloat(),
                      )

                  val drawWidth =
                      logo.width *
                          scale

                  val drawHeight =
                      logo.height *
                          scale

                  val left =
                      cx -
                          drawWidth / 2f

                  val top =
                      cy -
                          drawHeight / 2f

                  /*
                   * Região da BOCA indicada pelo usuário.
                   *
                   * Ela corresponde somente à pequena peça vermelha
                   * central abaixo do focinho.
                   *
                   * Não inclui o focinho superior.
                   * Não inclui olhos.
                   * Não inclui bochechas.
                   * Não inclui cabeça.
                   */

                  val mouthLeftPx =
                      (
                          logo.width *
                              0.465f
                          )
                          .toInt()

                  val mouthRightPx =
                      (
                          logo.width *
                              0.575f
                          )
                          .toInt()

                  val mouthTopPx =
                      (
                          logo.height *
                              0.825f
                          )
                          .toInt()

                  val mouthBottomPx =
                      (
                          logo.height *
                              0.945f
                          )
                          .toInt()

                  /*
                   * Desenhar tudo EXCETO o pequeno retângulo da boca.
                   *
                   * Isso mantém toda a cabeça completamente imóvel.
                   */

                  drawRegion(
                      canvas,
                      Rect(
                          0,
                          0,
                          logo.width,
                          mouthTopPx,
                      ),
                      RectF(
                          left,
                          top,
                          left + drawWidth,
                          top +
                              mouthTopPx *
                              scale,
                      ),
                  )

                  drawRegion(
                      canvas,
                      Rect(
                          0,
                          mouthTopPx,
                          mouthLeftPx,
                          mouthBottomPx,
                      ),
                      RectF(
                          left,
                          top +
                              mouthTopPx *
                              scale,
                          left +
                              mouthLeftPx *
                              scale,
                          top +
                              mouthBottomPx *
                              scale,
                      ),
                  )

                  drawRegion(
                      canvas,
                      Rect(
                          mouthRightPx,
                          mouthTopPx,
                          logo.width,
                          mouthBottomPx,
                      ),
                      RectF(
                          left +
                              mouthRightPx *
                              scale,
                          top +
                              mouthTopPx *
                              scale,
                          left +
                              drawWidth,
                          top +
                              mouthBottomPx *
                              scale,
                      ),
                  )

                  drawRegion(
                      canvas,
                      Rect(
                          0,
                          mouthBottomPx,
                          logo.width,
                          logo.height,
                      ),
                      RectF(
                          left,
                          top +
                              mouthBottomPx *
                              scale,
                          left +
                              drawWidth,
                          top +
                              drawHeight,
                      ),
                  )

                  /*
                   * A BOCA não é esticada.
                   *
                   * Ela apenas se desloca verticalmente.
                   *
                   * Quando speechWave cresce:
                   * a peça sobe e se junta visualmente ao focinho.
                   *
                   * Quando speechWave cai:
                   * a peça volta para baixo.
                   */
                  val mouthLift =
                      if (
                          mode ==
                          Mode.SPEAKING
                      ) {
                          drawHeight *
                              0.050f *
                              speechWave
                      } else {
                          0f
                      }

                  val mouthDestination =
                      RectF(
                          left +
                              mouthLeftPx *
                              scale,

                          top +
                              mouthTopPx *
                              scale -
                              mouthLift,

                          left +
                              mouthRightPx *
                              scale,

                          top +
                              mouthBottomPx *
                              scale -
                              mouthLift,
                      )

                  drawRegion(
                      canvas,
                      Rect(
                          mouthLeftPx,
                          mouthTopPx,
                          mouthRightPx,
                          mouthBottomPx,
                      ),
                      mouthDestination,
                  )

                  /*
                   * Anel de estado.
                   */
                  ringPaint.strokeWidth =
                      (
                          minSize *
                              0.010f
                          )
                          .coerceAtLeast(
                              2f
                          )

                  ringPaint.color =
                      Color.argb(
                          when (mode) {
                              Mode.LISTENING -> 100
                              Mode.THINKING -> 145
                              Mode.SPEAKING -> 180
                          },
                          245,
                          35,
                          48,
                      )

                  ringPaint.setShadowLayer(
                      minSize *
                          0.040f,
                      0f,
                      0f,
                      Color.rgb(
                          235,
                          25,
                          40,
                      ),
                  )

                  canvas.drawCircle(
                      cx,
                      cy,
                      minSize *
                          (
                              0.445f +
                                  0.006f *
                                  statePulse
                              ),
                      ringPaint,
                  )

                  ringPaint.clearShadowLayer()
          '''

          text = text.replace(
              marker,
              drawing,
              1,
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          PY

      # ==============================================================
      # VERIFY MOUTH
      # ==============================================================

      - name: Verify exact mouth animation
        working-directory: _gama_build
        run: |
          set -euo pipefail

          VIEW="app/src/main/java/com/gama/assistant/GamaEnergyView.kt"

          test -s "$VIEW"

          grep -Fq \
            'mouthLeftPx' \
            "$VIEW"

          grep -Fq \
            'mouthRightPx' \
            "$VIEW"

          grep -Fq \
            'mouthTopPx' \
            "$VIEW"

          grep -Fq \
            'mouthBottomPx' \
            "$VIEW"

          grep -Fq \
            'mouthLift' \
            "$VIEW"

          grep -Fq \
            '0.050f' \
            "$VIEW"

          if grep -Fq \
            'jawTopPx' \
            "$VIEW"; then

            echo "::error::Animação antiga da mandíbula ainda existe."
            exit 1
          fi

          if grep -Fq \
            'baseJawHeight' \
            "$VIEW"; then

            echo "::error::Animação antiga deformando o rosto ainda existe."
            exit 1
          fi

          echo "PASS: apenas a boca pequena inferior é móvel."

      # ==============================================================
      # STRUCTURAL AUDIT
      # ==============================================================

      - name: Continuous Core structural audit
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"
          TEST="app/src/test/java/com/gama/assistant"

          required=(
            "$SRC/ActiveTaskContext.kt"
            "$SRC/GamaTurnCoordinator.kt"
            "$SRC/GamaOrchestrator.kt"
            "$SRC/SemanticEndpointer.kt"
            "$SRC/AssistantStateController.kt"
            "$SRC/GamaSelfSpeechGuard.kt"
            "$SRC/ContextSanityCheck.kt"
            "$SRC/GamaRecoveryManager.kt"
            "$SRC/PriorityNotificationManager.kt"
            "$TEST/SemanticEndpointerTest.kt"
            "$TEST/ActiveTaskContextTest.kt"
            "$TEST/GamaTurnCoordinatorTest.kt"
            "$TEST/GamaSelfSpeechGuardTest.kt"
            "$TEST/ContextSanityCheckTest.kt"
            "$TEST/GamaContinuousCoreTest.kt"
          )

          for file in "${required[@]}"; do

            if [ ! -s "$file" ]; then
              echo "::error::Arquivo obrigatório ausente: $file"
              exit 1
            fi

            echo "PASS $file"
          done

          grep -Fq \
            'COMMAND_START_TIMEOUT_MS = 12_000L' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'FOLLOW_UP_START_TIMEOUT_MS = 15_000L' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'handleSemanticEndpoint' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaSelfSpeechGuard' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'ContextSanityCheck' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaRecoveryManager' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'warmBrainSilently' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'maxAttemptIndex()' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'LAUNCHER_APPS' \
            "$SRC/GamaReliableAppLauncher.kt"

          grep -Fq \
            'CATEGORY_LAUNCHER' \
            "$SRC/GamaReliableAppLauncher.kt"

          grep -Fq \
            'getLaunchIntentSenderForPackage' \
            "$SRC/GamaReliableAppLauncher.kt"

          grep -Fq \
            'com.whatsapp' \
            app/src/main/AndroidManifest.xml

          grep -Fq \
            'com.whatsapp.w4b' \
            app/src/main/AndroidManifest.xml

          if grep -Fq \
            '"apesar"' \
            "$SRC/GamaAppRegistry.kt"; then

            echo "::error::Alias falso do WhatsApp ainda existe."
            exit 1
          fi

          for file in \
            "$SRC/GamaService.kt" \
            "$SRC/LocalBrain.kt" \
            "$SRC/GamaBrainProcessService.kt" \
            "$SRC/GamaReplyGuard.kt"
          do

            if grep -Fq \
              'Não consegui concluir essa resposta' \
              "$file"; then

              echo "::error::Mensagem técnica proibida encontrada em $file"
              exit 1
            fi

          done

          grep -Fq \
            'isDebuggable = false' \
            app/build.gradle.kts

          echo "PASS: Continuous Core estruturalmente íntegro."

      # ==============================================================
      # JAVA
      # ==============================================================

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==============================================================
      # ANDROID SDK
      # ==============================================================

      - name: Android SDK 35
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          test -d "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" \
            >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" \
            >> "$GITHUB_ENV"

          SDKMANAGER="$(
            command -v sdkmanager || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # ==============================================================
      # GRADLE
      # ==============================================================

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==============================================================
      # VERSION
      # ==============================================================

      - name: Set Gama 9.4.2 version
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY'

          from pathlib import Path
          import os
          import re

          path = Path(
              "app/build.gradle.kts"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          run_number = int(
              os.environ["GITHUB_RUN_NUMBER"]
          )

          version_code = (
              24_520_000 +
              run_number
          )

          text, version_code_changes = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {version_code}',
              text,
              count=1,
          )

          text, version_name_changes = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              'versionName = "Gama 9.4.2 Continuous Core"',
              text,
              count=1,
          )

          if (
              version_code_changes != 1 or
              version_name_changes != 1
          ):
              raise SystemExit(
                  "Não foi possível configurar a versão 9.4.2."
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              f"versionCode={version_code}"
          )

          PY

      # ==============================================================
      # WRAPPER
      # ==============================================================

      - name: Prepare Gradle wrapper
        working-directory: _gama_build
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then

            gradle wrapper \
              --gradle-version 8.9

          fi

          chmod +x gradlew

          ./gradlew --version

      # ==============================================================
      # CLEAN
      # ==============================================================

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace

      # ==============================================================
      # COMPILE KOTLIN EARLY
      # ==============================================================

      - name: Compile Kotlin
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew \
            :app:compileReleaseKotlin \
            --no-daemon \
            --stacktrace \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gama-compile.log"

      # ==============================================================
      # TESTS
      # ==============================================================

      - name: Run unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew \
            test \
            --no-daemon \
            --stacktrace \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gama-tests.log"

      # ==============================================================
      # LINT
      # ==============================================================

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew \
            lint \
            --no-daemon \
            --stacktrace \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gama-lint.log"

      # ==============================================================
      # MODELS
      # ==============================================================

      - name: Prepare offline models
        working-directory: _gama_build
        run: |
          set -euo pipefail

          if [ -x tools/download_models.sh ]; then
            bash tools/download_models.sh
          fi

      # ==============================================================
      # RELEASE APK
      # ==============================================================

      - name: Assemble release
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/gama-release.log"

      # ==============================================================
      # SIGN
      # ==============================================================

      - name: Sign release APK
        working-directory: _gama_build
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail

          mkdir -p dist

          input_apk="$(
            find \
              app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              | head -n 1
          )"

          if [ -z "$input_apk" ]; then
            echo "::error::APK Release não encontrado."
            exit 1
          fi

          test -s "$input_apk"

          aligned="dist/Gama-aligned.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f \
            4 \
            "$input_apk" \
            "$aligned"

          if [ "$GAMA_SIGNING_MODE" = "stable" ]; then

            mkdir -p \
              .gama-signing

            chmod 700 \
              .gama-signing

            printf '%s' \
              "$GAMA_SIGNING_SEED" \
              | grep -Eq \
                '^[0-9A-Fa-f]{64}$'

            python3 - \
              "$GAMA_SIGNING_SEED" \
              .gama-signing/key.der \
              <<'PY'

          import sys

          seed = bytes.fromhex(
              sys.argv[1]
          )

          order = int(
              "FFFFFFFF00000000"
              "FFFFFFFFFFFFFFFF"
              "BCE6FAADA7179E84"
              "F3B9CAC2FC632551",
              16,
          )

          scalar = (
              int.from_bytes(
                  seed,
                  "big"
              ) %
              (order - 1)
          ) + 1

          key = scalar.to_bytes(
              32,
              "big"
          )

          der = (
              bytes.fromhex(
                  "30310201010420"
              )
              +
              key
              +
              bytes.fromhex(
                  "A00A06082A8648CE3D030107"
              )
          )

          with open(
              sys.argv[2],
              "wb"
          ) as handle:
              handle.write(
                  der
              )

          PY

            openssl ec \
              -inform DER \
              -in .gama-signing/key.der \
              -out .gama-signing/key.pem \
              >/dev/null 2>&1

            printf '%s' \
              '' \
              | base64 --decode \
              > .gama-signing/cert.pem

            keyhash="$(
              openssl pkey \
                -in .gama-signing/key.pem \
                -pubout \
                -outform DER \
                | sha256sum \
                | cut -d' ' -f1
            )"

            certhash="$(
              openssl x509 \
                -in .gama-signing/cert.pem \
                -pubkey \
                -noout \
                | openssl pkey \
                    -pubin \
                    -outform DER \
                | sha256sum \
                | cut -d' ' -f1
            )"

            if [ "$keyhash" != "$certhash" ]; then

              echo "::error::GAMA_SIGNING_SEED não corresponde ao certificado estável."

              exit 1
            fi

            openssl pkcs12 \
              -export \
              -inkey .gama-signing/key.pem \
              -in .gama-signing/cert.pem \
              -out .gama-signing/gama.p12 \
              -name gama \
              -passout pass:GamaStable2026

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              sign \
              --ks .gama-signing/gama.p12 \
              --ks-type PKCS12 \
              --ks-key-alias gama \
              --ks-pass pass:GamaStable2026 \
              --key-pass pass:GamaStable2026 \
              --out dist/Gama.apk \
              "$aligned"

            echo \
              "stable-update-capable" \
              > dist/install-mode.txt

            rm -rf \
              .gama-signing

          else

            rm -f \
              /tmp/gama-fresh.jks

            keytool \
              -genkeypair \
              -keystore /tmp/gama-fresh.jks \
              -storepass GamaFresh2026 \
              -keypass GamaFresh2026 \
              -alias gama \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Gama Fresh Test,O=Gama,C=BR"

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              sign \
              --ks /tmp/gama-fresh.jks \
              --ks-key-alias gama \
              --ks-pass pass:GamaFresh2026 \
              --key-pass pass:GamaFresh2026 \
              --out dist/Gama.apk \
              "$aligned"

            echo \
              "fresh-install-only" \
              > dist/install-mode.txt

          fi

          rm -f \
            "$aligned"

      # ==============================================================
      # VERIFY APK
      # ==============================================================

      - name: Verify final APK
        working-directory: _gama_build
        env:
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail

          test -s \
            dist/Gama.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            dist/Gama.apk \
            | tee \
              dist/signature-info.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            dist/Gama.apk \
            > dist/apk-info.txt

          grep -q \
            "name='com.gama.assistant'" \
            dist/apk-info.txt

          grep -q \
            "versionName='Gama 9.4.2 Continuous Core'" \
            dist/apk-info.txt

          EXPECTED_VERSION_CODE="$((24520000 + GITHUB_RUN_NUMBER))"

          grep -q \
            "versionCode='$EXPECTED_VERSION_CODE'" \
            dist/apk-info.txt

          if grep -q \
            'application-debuggable' \
            dist/apk-info.txt; then

            echo "::error::APK Release ainda está debuggable."
            exit 1
          fi

          if [ "$GAMA_SIGNING_MODE" = "stable" ]; then

            actual_cert="$(
              awk -F': ' \
                '/certificate SHA-256 digest/ {
                  print $2
                  exit
                }' \
                dist/signature-info.txt \
                | tr -d ':' \
                | tr '[:lower:]' '[:upper:]'
            )"

            if [ "$actual_cert" != "$GAMA_EXPECTED_CERT_SHA256" ]; then

              echo "::error::Certificado final diferente da assinatura estável."

              echo "expected=$GAMA_EXPECTED_CERT_SHA256"
              echo "actual=$actual_cert"

              exit 1
            fi

          fi

          (
            cd dist

            sha256sum \
              Gama.apk \
              > Gama.apk.sha256

            sha256sum \
              -c \
              Gama.apk.sha256
          )

          echo "PASS: APK Release verificado."

      # ==============================================================
      # SECOND AUDIT
      # ==============================================================

      - name: Final architecture audit
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"

          test -s \
            dist/Gama.apk

          test -s \
            reports/GAMA-9.4.0-CHANGES.md

          test -s \
            reports/PHYSICAL-TESTS-REQUIRED.md

          grep -Fq \
            'ActiveTaskContext' \
            "$SRC/ConversationSession.kt"

          grep -Fq \
            'GamaTurnCoordinator' \
            "$SRC/GamaOrchestrator.kt"

          grep -Fq \
            'SemanticEndpointer' \
            "$SRC/GamaRecognitionPolicy.kt"

          grep -Fq \
            'GamaSelfSpeechGuard' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'ContextSanityCheck' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaRecoveryManager' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'FOLLOW_UP_LISTENING' \
            "$SRC/AssistantStateController.kt"

          grep -Fq \
            'ENDPOINT_PENDING' \
            "$SRC/AssistantStateController.kt"

          grep -Fq \
            'getLaunchIntentSenderForPackage' \
            "$SRC/GamaReliableAppLauncher.kt"

          grep -Fq \
            'LAUNCHER_APPS' \
            "$SRC/GamaReliableAppLauncher.kt"

          grep -Fq \
            'mouthLift' \
            "$SRC/GamaEnergyView.kt"

          if grep -Fq \
            'jawTopPx' \
            "$SRC/GamaEnergyView.kt"; then

            echo "::error::Animação antiga voltou."
            exit 1
          fi

          echo "PASS: auditoria final GAMA 9.4.2."

      # ==============================================================
      # UPLOAD APK
      # ==============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error

      # ==============================================================
      # UPLOAD SOURCE
      # ==============================================================

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-9.4.2-CONTINUOUS-CORE-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      # ==============================================================
      # REPORTS
      # ==============================================================

      - name: Upload engineering reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-9.4.2-engineering-reports
          path: |
            _gama_build/reports/**
            gama-compile.log
            gama-tests.log
            gama-lint.log
            gama-release.log
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: warn

      # ==============================================================
      # RELEASE
      # ==============================================================

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="gama-v9.4.2-continuous-core-${{ github.run_number }}"

          gh release create \
            "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            "_gama_build/dist/install-mode.txt#install-mode.txt" \
            "_gama_build/reports/GAMA-9.4.0-CHANGES.md#GAMA-9.4.2-CHANGES.md" \
            "_gama_build/reports/PHYSICAL-TESTS-REQUIRED.md#PHYSICAL-TESTS-REQUIRED.md" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 9.4.2 Continuous Core" \
            --notes "Continuous Core sobre o source real do Gama 9.3.0. Corrige os SyntaxErrors dos builds #139 e #140, preserva sessão contínua, contexto ativo, proteção contra respostas antigas, recuperação silenciosa, launcher verificado e substitui a antiga deformação da mandíbula pela animação apenas da pequena boca inferior indicada pelo usuário." \
            --latest
