      - name: Version and source audit
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/gama_audit.py" <<'PY_AUDIT'
          from pathlib import Path
          import os
          import re

          root = Path("_gama_build")
          src = root / "app/src/main/java/com/gama/assistant"
          gradle_path = root / "app/build.gradle.kts"
          manifest_path = root / "app/src/main/AndroidManifest.xml"

          required = [
              "GamaService.kt",
              "VoicePolicy.kt",
              "GamaGeminiClient.kt",
              "GamaGeminiPolicy.kt",
              "GamaGeminiSecureStore.kt",
              "GamaGeminiSettingsActivity.kt",
              "GamaGeminiControl.kt",
              "GamaInstalledAppCatalog.kt",
              "GamaWakePhrasePolicy.kt",
          ]
          for name in required:
              p = src / name
              if not p.is_file() or p.stat().st_size == 0:
                  raise SystemExit(f"Arquivo obrigatório ausente: {p}")

          kt_files = list(src.glob("*.kt"))
          kt_lines = sum(len(p.read_text(encoding="utf-8", errors="ignore").splitlines()) for p in kt_files)
          if len(kt_files) < 140:
              raise SystemExit(f"Regressão Kotlin: {len(kt_files)} arquivos")
          if kt_lines < 29900:
              raise SystemExit(f"Regressão Kotlin: {kt_lines} linhas")

          service = (src / "GamaService.kt").read_text(encoding="utf-8", errors="ignore")
          gemini = (src / "GamaGeminiClient.kt").read_text(encoding="utf-8", errors="ignore")
          secure = (src / "GamaGeminiSecureStore.kt").read_text(encoding="utf-8", errors="ignore")
          manifest = manifest_path.read_text(encoding="utf-8", errors="ignore")
          gradle = gradle_path.read_text(encoding="utf-8", errors="ignore")

          checks = {
              "Gemini routed through live service": "tryGeminiUnifiedBrain(" in service,
              "Gemini endpoint": "generativelanguage.googleapis.com" in gemini,
              "Gemini API header": "x-goog-api-key" in gemini,
              "Android Keystore": "AndroidKeyStore" in secure,
              "Internet permission": "android.permission.INTERNET" in manifest,
              "Gemini settings activity": ".GamaGeminiSettingsActivity" in manifest,
              "No MediaPipe GenAI dependency": "tasks-genai" not in gradle,
              "No mandatory gemma.task": "gemma.task" not in service.lower() and "gemma.task" not in gradle.lower(),
              "Release non-debuggable": "isDebuggable = false" in gradle,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Falha de integridade: " + ", ".join(failed))

          voice_assets = [
              root / "app/src/main/assets/model/final.mdl",
              root / "app/src/main/assets/model/Gr.fst",
              root / "app/src/main/assets/spk-model/final.ext.raw",
          ]
          for asset in voice_assets:
              if not asset.is_file() or asset.stat().st_size == 0:
                  raise SystemExit(f"Modelo de voz Vosk ausente: {asset}")

          secret_patterns = [
              re.compile(r"AIza[A-Za-z0-9_-]{20,}"),
              re.compile(r"AQ\.[A-Za-z0-9_-]{20,}"),
          ]
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in {".kt", ".kts", ".xml", ".json", ".txt", ".md", ".sh"}:
                  continue
              text = p.read_text(encoding="utf-8", errors="ignore")
              if any(rx.search(text) for rx in secret_patterns):
                  raise SystemExit(f"Possível chave de API embutida em {p}")

          version_code = 25_600_000 + int(os.environ["GITHUB_RUN_NUMBER"])
          gradle, c1 = re.subn(r"versionCode\s*=\s*\d+", f"versionCode = {version_code}", gradle, count=1)
          gradle, c2 = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "Gama 10.6.0 Gemini First"', gradle, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit("Falha ao atualizar versão")
          gradle_path.write_text(gradle, encoding="utf-8")
          print(f"PASS: {len(kt_files)} arquivos Kotlin, {kt_lines} linhas, versionCode={version_code}")
          PY_AUDIT

          python3 -m py_compile "$GITHUB_WORKSPACE/gama_audit.py"
          python3 "$GITHUB_WORKSPACE/gama_audit.py"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean

      - name: Compile Release Kotlin
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:compileReleaseKotlin --stacktrace

      - name: Unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testReleaseUnitTest --stacktrace

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:lintRelease --stacktrace

      - name: Assemble Release
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Zipalign and sign APK
        env:
          GAMA_KEYSTORE_B64: ${{ secrets.GAMA_KEYSTORE_B64 }}
          GAMA_KEYSTORE_PASSWORD: ${{ secrets.GAMA_KEYSTORE_PASSWORD }}
          GAMA_KEY_ALIAS: ${{ secrets.GAMA_KEY_ALIAS }}
          GAMA_KEY_PASSWORD: ${{ secrets.GAMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          input_apk="$(find "$GITHUB_WORKSPACE/_gama_build/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | head -n 1 || true)"
          if [ -z "$input_apk" ] || [ ! -s "$input_apk" ]; then
            echo "::error::assembleRelease terminou sem APK."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/_gama_build/dist"
          aligned="$GITHUB_WORKSPACE/_gama_build/dist/Gama-aligned.apk"
          final_apk="$GITHUB_WORKSPACE/_gama_build/dist/Gama.apk"
          "$ZIPALIGN" -f -p 4 "$input_apk" "$aligned"

          if [ -n "${GAMA_KEYSTORE_B64:-}" ] && [ -n "${GAMA_KEYSTORE_PASSWORD:-}" ] && [ -n "${GAMA_KEY_ALIAS:-}" ] && [ -n "${GAMA_KEY_PASSWORD:-}" ]; then
            echo "$GAMA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gama-release.jks"
            KEYSTORE="$RUNNER_TEMP/gama-release.jks"
            STORE_PASS="$GAMA_KEYSTORE_PASSWORD"
            KEY_ALIAS="$GAMA_KEY_ALIAS"
            KEY_PASS="$GAMA_KEY_PASSWORD"
            echo "Assinatura estável ativada."
          else
            KEYSTORE="$RUNNER_TEMP/gama-test.jks"
            STORE_PASS="gama-test-pass"
            KEY_ALIAS="gama-test"
            KEY_PASS="gama-test-pass"
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Gama Test, OU=Gama, O=Gama, L=Aracaju, ST=Sergipe, C=BR" \
              -noprompt
            echo "Assinatura de teste ativada. Instalação anterior pode precisar ser removida se usar outro certificado."
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$STORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$final_apk" \
            "$aligned"
          "$APKSIGNER" verify --verbose --print-certs "$final_apk"

      - name: Verify final APK
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/_gama_build/dist/Gama.apk"
          test -s "$APK"
          APK_SIZE="$(stat -c%s "$APK")"
          if [ "$APK_SIZE" -lt 10000000 ]; then
            echo "::error::APK suspeitamente pequeno: $APK_SIZE bytes."
            exit 1
          fi
          unzip -l "$APK" | grep -Fq 'assets/model/final.mdl'
          echo "PASS: APK final verificado com Vosk e Gemini First."
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.6.0-GEMINIFIRST-APK
          path: _gama_build/dist/Gama.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.6.0-GEMINIFIRST-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/app/build/**
            !_gama_build/dist/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.6.0-GEMINIFIRST-diagnostics
          path: |
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
