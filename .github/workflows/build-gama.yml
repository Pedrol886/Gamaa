      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download and validate offline models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets /tmp/gama-models
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 \
            "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip" -o /tmp/vosk.zip
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 \
            "https://alphacephei.com/vosk/models/vosk-model-spk-0.4.zip" -o /tmp/vosk-spk.zip
          unzip -tq /tmp/vosk.zip
          unzip -tq /tmp/vosk-spk.zip
          unzip -q /tmp/vosk.zip -d /tmp/gama-models
          unzip -q /tmp/vosk-spk.zip -d /tmp/gama-models
          mv /tmp/gama-models/vosk-model-small-pt-0.3 app/src/main/assets/model
          mv /tmp/gama-models/vosk-model-spk-0.4 app/src/main/assets/spk-model
          test -s app/src/main/assets/model/final.mdl
          test -s app/src/main/assets/model/mfcc.conf
          test -s app/src/main/assets/spk-model/final.ext.raw
          sha256sum /tmp/vosk.zip /tmp/vosk-spk.zip
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          expected = {'model/Gr.fst': 'd81023936f5557c06930802b1db4880f56d6ac51b16ed4e5060ceba06895442c', 'model/HCLr.fst': '8b45be1fa72913d61e37ac0b411177803848f4cda7728f74139b39acd1c0cf36', 'model/README': '85353085fa2096ef12cac654fa9534b186bef9b56a61f544da3ebfbd006b78bb', 'model/disambig_tid.int': 'ca8970bc50b8ae2452749f75f5a12049e511075f9fc3f63acc1526c280a33748', 'model/final.mdl': '3e10e43ec01cf8d968bcc24c626a2eae2bfa77863bee82f36a554854afa1f147', 'model/ivector/final.dubm': '28dcdc395b13a2085d20f7a2e850ef7e5216ba33ded76391b9690dd60f5143de', 'model/ivector/final.ie': '9345786636c358c9539591da71fb685ae82d8a96ce5de533fb8ac5fdafa965f0', 'model/ivector/final.mat': 'e310571390a3183718fce914bb022d297777c7ed860892a1812b576a698ec420', 'model/ivector/global_cmvn.stats': '8848c2dcf9919fbb3db574cbce59f980c3b11107c29adfa1fc42a4faed27e1a8', 'model/ivector/online_cmvn.conf': 'a2f3571754b64297cb7efb2e7ca3df61995c5a45fcbb97188f90613552bb2dfe', 'model/ivector/splice.conf': '9f0c5f7c82d18eaf25d8bce470efa9f7741f88411fe428774bc0a9bb69a24756', 'model/mfcc.conf': 'd3d4c517da7e6d02ed85803eebf77bca3f7f48c9ab6dc035013250b36187f274', 'model/phones.txt': 'dc207b906747b59e9e3da0af30e8f8d6712c9897ad7df06929d4b2cae7ee13f1', 'model/word_boundary.int': 'b8f981d84d8765fb15003ac54ec0f9599efa65a00d6d4d60086e5969ad45ff01', 'spk-model/README.txt': 'df0a2ab600c337475b65fd4d6f29a1b9b18e09fc0211b5a7a4820dce82d4e23a', 'spk-model/final.ext.raw': 'd30354474ac719b3cfce58186463302b988cf22ce3afee7237a2da862c4a91d1', 'spk-model/mean.vec': '3bc5dfa9479c3aaacf4f45c155e9bd4772785449112566fac23578c09e93bcd7', 'spk-model/mfcc.conf': '86f4df625b950b81b68864fdefabf26aa65079f84ea20f40e7f9e7ccbb9c456c', 'spk-model/transform.mat': 'fab14481fb27c41df0f1825afe18530e4f6d128dbb2c239ee86d8d7096e22c33'}
          root = Path('app/src/main/assets')
          for name, digest in expected.items():
              file = root / name
              if not file.is_file() or hashlib.sha256(file.read_bytes()).hexdigest() != digest:
                  raise SystemExit('Modelo ausente ou diferente do build estável: ' + name)
          data = (root / 'model/Gr.fst').read_bytes()
          i = data.index(bytes.fromhex('74fbb27e')) + 4
          size = struct.unpack_from('<i', data, i)[0]
          i += 4 + size
          _, count = struct.unpack_from('<qq', data, i)
          i += 16
          words = set()
          for _ in range(count):
              size = struct.unpack_from('<i', data, i)[0]
              i += 4
              words.add(data[i:i+size].decode('utf-8'))
              i += size + 8
          required = set('gama muffin lousa abrir desmontar carro montar aproximar afastar mostrar motor girar parar rotação turbina azul verde branco preto vermelho amarelo casa porta livro mesa janela barco rua sol um dois três quatro cinco seis sete oito nove'.split())
          if not required <= words:
              raise SystemExit('Vocabulário de ativação ou desafio indisponível')
          print('Modelos idênticos ao build 25; ativação e desafios presentes no vocabulário.')
          PY

      - name: Download hand model and validate 3D assets
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 --max-time 180 \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" \
            -o app/src/main/assets/hand_landmarker.task
          python3 tools/verify_assets.py

      - name: Test and build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk Gama.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Gama.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Gama.apk > /tmp/gama-badging.txt
          head -5 /tmp/gama-badging.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/test-results/
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-APK
          path: Gama.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="gama-${{ github.run_number }}"
          cat > /tmp/gama-release.md <<'NOTES'
          Gama: Lousa 3D nativa com dois modelos GLB originais (carro e turbina), peças selecionáveis, vista explodida reversível e controles de voz, toque e uma mão via CameraX/MediaPipe. A câmera funciona somente com a Lousa visível. Em segundo plano, use Abrir lousa na notificação.

          Chamada principal Gama; Muffin e Murffin também são aceitos pelo roteador de texto. A transcrição das variantes depende do modelo Vosk. TTS, applicationId e comandos existentes preservados. Sete referências vocais e desafios offline.

          Testes automatizados não substituem teste no Galaxy A07, medição de bateria, testes biométricos ou atualização instalada. A aparência holográfica é renderizada na tela, sem projeção física.

          APK de depuração, como a versão anterior. Atualizar sobre o APK anterior exige o mesmo certificado; sua chave privada não consta no repositório. Nenhum perfil vocal, áudio ou imagem de câmera é enviado ao GitHub.
          NOTES
          gh release create "$TAG" Gama.apk --target "$GITHUB_SHA" \
            --title "Gama $TAG" --notes-file /tmp/gama-release.md
