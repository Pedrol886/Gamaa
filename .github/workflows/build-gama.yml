            "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Gama 9.5.0 version
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          version_code = (
              24_600_000 +
              int(
                  os.environ[
                      "GITHUB_RUN_NUMBER"
                  ]
              )
          )

          text, code_count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {version_code}',
              text,
              count=1,
          )

          text, name_count = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              'versionName = "Gama 9.5.0 Personal Intelligence Core"',
              text,
              count=1,
          )

          if (
              code_count != 1 or
              name_count != 1
          ):
              raise SystemExit(
                  "Falha ao configurar versão 9.5.0."
              )

          path.write_text(
              text,
              encoding="utf-8",
          )

          print(
              f"versionCode={version_code}"
          )
          PY

