                      subjectDisplay =
                          getString(
                              getColumnIndexOrThrow(
                                  "subject_display"
                              )
                          ),

                      priority =
                          GamaPriorityLevel
                              .fromName(
                                  getString(
                                      getColumnIndexOrThrow(
                                          "priority"
                                      )
                                  )
                              ),

                      action =
                          getString(
                              getColumnIndexOrThrow(
                                  "action"
                              )
                          ),

                      conditionsJson =
                          getString(
                              getColumnIndexOrThrow(
                                  "conditions_json"
                              )
                          ),

                      period =
                          getString(
                              getColumnIndexOrThrow(
                                  "period"
                              )
                          ),

                      origin =
                          getString(
                              getColumnIndexOrThrow(
                                  "origin"
                              )
                          ),

                      createdAt =
                          getLong(
                              getColumnIndexOrThrow(
                                  "created_at"
                              )
                          ),

                      updatedAt =
                          getLong(
                              getColumnIndexOrThrow(
                                  "updated_at"
