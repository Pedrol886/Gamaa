name: Build Gama 9.4.1 Continuous Core Mouth Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-9-4-1-continuous-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    defaults:
      run:
        shell: bash

    env:
      GAMA_BASE_RUN_ID: "37158343882"
      GAMA_BASE_ARTIFACT: "Gama-9.3.0-JARVIS-source"

      # Workflow do #139. Usamos sua transformação completa como fonte,
      # mas consertamos o Python antes de executá-la.
      GAMA_94_TEMPLATE_COMMIT: "b81455bdc29c25f85fa6b34612cee526e1c45508"

      GAMA_EXPECTED_CERT_SHA256: "6933EDA890C29567A8F4B6CEAD7A39A442DF109D43B813A19F3F6FA7F39B078C"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-9.4.1-CONTINUOUS-CORE-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"

            echo "::warning::GAMA_SIGNING_SEED ausente. O APK será release, mas instalação limpa."
          elif printf '%s' "$GAMA_SIGNING_SEED" |
            grep -Eq '^[0-9A-Fa-f]{64}$'; then

            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-9.4.1-CONTINUOUS-CORE-APK" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GAMA_SIGNING_SEED inválido."
            exit 1
          fi

      - name: Restore exact Gama 9.3.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaEnergyView.kt

          grep -Fq \
            'Gama 9.3.0 JARVIS Reliability' \
            _gama_build/app/build.gradle.kts

          echo "PASS: fonte exata do #136 restaurada."

      - name: Verify audited source
        run: |
          set -euo pipefail

          check_blob() {
            local file="$1"
            local expected="$2"
            local actual

            test -s "$file"

            actual="$(git hash-object "$file")"

            if [ "$actual" != "$expected" ]; then
              echo "::error::Fonte diferente da versão auditada: $file"
              echo "expected=$expected"
              echo "actual=$actual"
              exit 1
            fi

            echo "PASS $file"
          }

          ROOT="_gama_build"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaService.kt" \
            "da73a2f7aeec16fa5d6202812924164b776804d9"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/ConversationSession.kt" \
            "ccac0acb53313b63f0bccc06f20291da7b820920"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaSupervisor.kt" \
            "dea7bae963dc9bc18169238ef621ff386fb7672b"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaRecognitionPolicy.kt" \
            "cb0448b364902b7f47d8f1bbb1b4e8f8310a3e50"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/VoicePolicy.kt" \
            "21bec82e4144a232f6673711c7d4c7911971df68"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaAppRegistry.kt" \
            "f4d8b5e3c1ce3b7b011c73311c56aedec80c140d"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaReliableAppLauncher.kt" \
            "852ef57c39503cd02b7fd08a1e109693387876c0"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaLaunchFallback.kt" \
            "70427dd230eca9c81338d4652a12a4ff5c17543c"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/LocalBrain.kt" \
            "9f9b02c0768cb1ff1d36943e491cfb2c1efefbc7"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaBrainProcessService.kt" \
            "6ef1b60c8a7dc991b2d5f38bc59062544d512770"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/BrainProcessProtocol.kt" \
            "629b434dd22fbfad19dda0ef0784c4312bb1f009"

          check_blob \
            "$ROOT/app/src/main/java/com/gama/assistant/GamaReplyGuard.kt" \
            "01cf76301cb8915bf8ef58043c02424175c7e628"

          check_blob \
            "$ROOT/app/build.gradle.kts" \
            "e8005e575476b8152c33a9db0dc82556d0de657c"

          check_blob \
            "$ROOT/app/src/main/AndroidManifest.xml" \
            "e898888312d7c1355cf751b9dc391ca1aa3a48ea"

      - name: Recover and repair complete Gama 9.4 transformation
        run: |
          set -euo pipefail

          git show \
            "$GAMA_94_TEMPLATE_COMMIT:.github/workflows/build-gama.yml" \
            > /tmp/gama139-workflow.yml

          python3 - \
            /tmp/gama139-workflow.yml \
            /tmp/gama94-transform.py <<'EXTRACT_PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])

          lines = source.read_text(
              encoding="utf-8"
          ).splitlines()

          start = None

          for i, line in enumerate(lines):
              if "python3 - <<'PY'" in line:
                  start = i
                  break

          if start is None:
              raise SystemExit(
                  "Transformação Python do #139 não encontrada."
              )

          marker_indent = (
              len(lines[start]) -
              len(lines[start].lstrip(" "))
          )

          end = None

          for i in range(
              start + 1,
              len(lines)
          ):
              if lines[i].strip() == "PY":
                  end = i
                  break

          if end is None:
              raise SystemExit(
                  "Fim da transformação do #139 não encontrado."
              )

          body = []

          prefix = " " * marker_indent

          for line in lines[
              start + 1:end
          ]:
              if line.startswith(prefix):
                  body.append(
                      line[marker_indent:]
                  )
              else:
                  body.append(line)

          script = "\n".join(body) + "\n"

          # O #139 possuía seis atribuições Python quebradas:
          #
          # registry =
          #     src / ...
          #
          # Python exige que a expressão esteja na mesma linha
          # ou dentro de parênteses.
          #
          # Corrigimos qualquer atribuição desse formato antes
          # de compilar/executar a transformação.
          pattern = re.compile(
              r"(?m)^([ \t]*)"
              r"([A-Za-z_][A-Za-z0-9_]*)"
              r"[ \t]*=[ \t]*\n"
              r"[ \t]+"
              r"([^#\n].*)$"
          )

          script = pattern.sub(
              lambda m:
                  f"{m.group(1)}"
                  f"{m.group(2)} = "
                  f"{m.group(3).lstrip()}",
              script,
          )

          required_assignments = [
              "registry",
              "service",
              "value",
              "gradle",
              "recognition_test",
              "reports",
          ]

          for name in required_assignments:
              if not re.search(
                  rf"(?m)^[ \t]*{name}[ \t]*=",
                  script,
              ):
                  raise SystemExit(
                      f"Atribuição reparada ausente: {name}"
                  )

          remaining = re.findall(
              r"(?m)^[ \t]*"
              r"([A-Za-z_][A-Za-z0-9_]*)"
              r"[ \t]*=[ \t]*$",
              script,
          )

          if remaining:
              raise SystemExit(
                  "Ainda existem atribuições Python quebradas: " +
                  ", ".join(remaining)
              )

          output.write_text(
              script,
              encoding="utf-8",
          )

          print(
              "Transformação do #139 recuperada e corrigida."
          )
          EXTRACT_PY

          # O erro do #139 agora é detectado ANTES de tocar no projeto.
          python3 -m py_compile \
            /tmp/gama94-transform.py

          echo "PASS: Python da transformação compilou."

          python3 \
            /tmp/gama94-transform.py

      - name: Replace mouth animation with exact marked-mouth movement
        run: |
          set -euo pipefail

          cat > \
            _gama_build/app/src/main/java/com/gama/assistant/GamaEnergyView.kt \
            <<'KOTLIN'
          package com.gama.assistant

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.RectF
          import android.util.AttributeSet
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.sin

          /**
           * GAMA RED CORE
           *
           * A cabeça NÃO é deformada.
           *
           * A única parte móvel durante SPEAKING é a pequena peça
           * vermelha inferior central da logo, marcada pelo usuário
           * como a boca.
           *
           * Ela se move PARA CIMA enquanto fecha a fala e volta para
           * a posição original ao abrir.
           */
          class GamaEnergyView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null,
          ) : View(context, attrs) {

              enum class Mode {
                  LISTENING,
                  THINKING,
                  SPEAKING,
              }

              var mode: Mode =
                  Mode.LISTENING
                  set(value) {
                      field = value
                      invalidate()
                  }

              private val logo: Bitmap =
                  BitmapFactory.decodeResource(
                      resources,
                      R.drawable.gama_red_core,
                  )

              private val bitmapPaint =
                  Paint(
                      Paint.ANTI_ALIAS_FLAG or
                          Paint.FILTER_BITMAP_FLAG
                  )

              private val glowPaint =
                  Paint(
                      Paint.ANTI_ALIAS_FLAG
                  ).apply {
                      style =
                          Paint.Style.FILL
                  }

              private val accentPaint =
                  Paint(
                      Paint.ANTI_ALIAS_FLAG
                  ).apply {
                      style =
                          Paint.Style.STROKE
                  }

              private var phase = 0f
              private var released = false

              private val animator =
                  ValueAnimator.ofFloat(
                      0f,
                      1f,
                  ).apply {
                      duration = 980L

                      repeatCount =
                          ValueAnimator.INFINITE

                      interpolator =
                          LinearInterpolator()

                      addUpdateListener {
                          phase =
                              it.animatedValue
                                  as Float

                          invalidate()
                      }
                  }

              init {
                  setLayerType(
                      LAYER_TYPE_SOFTWARE,
                      null,
                  )

                  animator.start()
              }

              override fun onDraw(
                  canvas: Canvas
              ) {
                  super.onDraw(canvas)

                  if (
                      width <= 0 ||
                      height <= 0 ||
                      logo.width <= 0 ||
                      logo.height <= 0
                  ) {
                      return
                  }

                  val minSize =
                      minOf(
                          width,
                          height,
                      ).toFloat()

                  val t =
                      phase *
                          (PI * 2.0)

                  /*
                   * Ritmo propositalmente irregular.
                   *
                   * Ele não faz a cabeça pulsar.
                   * Apenas decide o quanto a BOCA sobe.
                   */
                  val speechWave =
                      (
                          abs(
                              sin(
                                  t * 3.15
                              )
                          ) * 0.48 +
                              abs(
                                  sin(
                                      t * 5.70 +
                                          0.75
                                  )
                              ) * 0.32 +
                              abs(
                                  sin(
                                      t * 8.20 +
                                          1.55
                                  )
                              ) * 0.20
                          )
                          .toFloat()
                          .coerceIn(
                              0f,
                              1f,
                          )

                  val statePulse =
                      when (mode) {
                          Mode.LISTENING ->
                              (
                                  0.50 +
                                      0.50 *
                                      sin(
                                          t * 1.25
                                      )
                                  ).toFloat()

                          Mode.THINKING ->
                              (
                                  0.50 +
                                      0.50 *
                                      sin(
                                          t * 2.0
                                      )
                                  ).toFloat()

                          Mode.SPEAKING ->
                              speechWave
                      }

                  val cx =
                      width / 2f

                  val cy =
                      height / 2f

                  /*
                   * Aura vermelha.
                   *
                   * Independente do movimento da boca.
                   */
                  val auraRadius =
                      minSize *
                          (
                              0.40f +
                                  0.015f *
                                  statePulse
                              )

                  val auraAlpha =
                      when (mode) {
                          Mode.LISTENING -> 42
                          Mode.THINKING -> 68
                          Mode.SPEAKING -> 86
                      }

                  glowPaint.color =
                      Color.argb(
                          auraAlpha,
                          230,
                          20,
                          34,
                      )

                  glowPaint.setShadowLayer(
                      minSize * 0.13f,
                      0f,
                      0f,
                      Color.rgb(
                          175,
                          8,
                          20,
                      ),
                  )

                  canvas.drawCircle(
                      cx,
                      cy,
                      auraRadius,
                      glowPaint,
                  )

                  glowPaint.clearShadowLayer()

                  val availableW =
                      width * 0.91f

                  val availableH =
                      height * 0.91f

                  val scale =
                      minOf(
                          availableW /
                              logo.width,
                          availableH /
                              logo.height,
                      )

                  val drawW =
                      logo.width *
                          scale

                  val drawH =
                      logo.height *
                          scale

                  val left =
                      cx -
                          drawW / 2f

                  val top =
                      cy -
                          drawH / 2f

                  /*
                   * ==============================================
                   * BOCA REAL DA LOGO
                   * ==============================================
                   *
                   * Região inferior central marcada na imagem pelo
                   * usuário.
                   *
                   * NÃO inclui o focinho.
                   * NÃO inclui a cabeça.
                   * NÃO inclui as laterais.
                   *
                   * É somente a pequena peça vermelha inferior.
                   */
                  val mouthLeftPx =
                      (
                          logo.width *
                              0.455f
                          ).toInt()

                  val mouthRightPx =
                      (
                          logo.width *
                              0.595f
                          ).toInt()

                  val mouthTopPx =
                      (
                          logo.height *
                              0.835f
                          ).toInt()

                  val mouthBottomPx =
                      (
                          logo.height *
                              0.965f
                          ).toInt()

                  /*
                   * Primeiro desenhamos a logo inteira EXCETO
                   * o pequeno retângulo da boca.
                   *
                   * Assim a cabeça permanece 100% parada.
                   */

                  // Parte acima da boca.
                  drawRegion(
                      canvas,
                      Rect(
                          0,
                          0,
                          logo.width,
                          mouthTopPx,
                      ),
                      RectF(
                          left,
                          top,
                          left + drawW,
                          top +
                              mouthTopPx *
                              scale,
                      ),
                  )

                  // Lado esquerdo da área da boca.
                  drawRegion(
                      canvas,
                      Rect(
                          0,
                          mouthTopPx,
                          mouthLeftPx,
                          mouthBottomPx,
                      ),
                      RectF(
                          left,
                          top +
                              mouthTopPx *
                              scale,
                          left +
                              mouthLeftPx *
                              scale,
                          top +
                              mouthBottomPx *
                              scale,
                      ),
                  )

                  // Lado direito da área da boca.
                  drawRegion(
                      canvas,
                      Rect(
                          mouthRightPx,
                          mouthTopPx,
                          logo.width,
                          mouthBottomPx,
                      ),
                      RectF(
                          left +
                              mouthRightPx *
                              scale,
                          top +
                              mouthTopPx *
                              scale,
                          left +
                              drawW,
                          top +
                              mouthBottomPx *
                              scale,
                      ),
                  )

                  // Região abaixo da boca.
                  drawRegion(
                      canvas,
                      Rect(
                          0,
                          mouthBottomPx,
                          logo.width,
                          logo.height,
                      ),
                      RectF(
                          left,
                          top +
                              mouthBottomPx *
                              scale,
                          left +
                              drawW,
                          top +
                              drawH,
                      ),
                  )

                  /*
                   * Durante a fala a pequena peça sobe.
                   *
                   * No pico ela chega junto à parte superior,
                   * criando o movimento abrir/fechar indicado
                   * pela marcação branca do usuário.
                   *
                   * Não há stretch, scaleY ou deformação.
                   */
                  val mouthLift =
                      if (
                          mode ==
                          Mode.SPEAKING
                      ) {
                          drawH *
                              0.035f *
                              speechWave
                      } else {
                          0f
                      }

                  val mouthLeft =
                      left +
                          mouthLeftPx *
                          scale

                  val mouthRight =
                      left +
                          mouthRightPx *
                          scale

                  val mouthTop =
                      top +
                          mouthTopPx *
                          scale -
                          mouthLift

                  val mouthBottom =
                      top +
                          mouthBottomPx *
                          scale -
                          mouthLift

                  drawRegion(
                      canvas,
                      Rect(
                          mouthLeftPx,
                          mouthTopPx,
                          mouthRightPx,
                          mouthBottomPx,
                      ),
                      RectF(
                          mouthLeft,
                          mouthTop,
                          mouthRight,
                          mouthBottom,
                      ),
                  )

                  /*
                   * Anel de estado permanece discreto.
                   */
                  accentPaint.style =
                      Paint.Style.STROKE

                  accentPaint.strokeWidth =
                      (
                          minSize *
                              0.010f
                          )
                          .coerceAtLeast(
                              2f
                          )

                  accentPaint.color =
                      Color.argb(
                          when (mode) {
                              Mode.LISTENING ->
                                  100

                              Mode.THINKING ->
                                  145

                              Mode.SPEAKING ->
                                  175
                          },
                          248,
                          42,
                          52,
                      )

                  accentPaint.setShadowLayer(
                      minSize *
                          0.040f,
                      0f,
                      0f,
                      Color.rgb(
                          239,
                          30,
                          45,
                      ),
                  )

                  val ringRadius =
                      minSize *
                          (
                              0.445f +
                                  0.006f *
                                  statePulse
                              )

                  canvas.drawCircle(
                      cx,
                      cy,
                      ringRadius,
                      accentPaint,
                  )

                  accentPaint.clearShadowLayer()
              }

              private fun drawRegion(
                  canvas: Canvas,
                  src: Rect,
                  dst: RectF,
              ) {
                  if (
                      src.width() <= 0 ||
                      src.height() <= 0 ||
                      dst.width() <= 0f ||
                      dst.height() <= 0f
                  ) {
                      return
                  }

                  bitmapPaint.alpha = 255

                  canvas.drawBitmap(
                      logo,
                      src,
                      dst,
                      bitmapPaint,
                  )
              }

              fun release() {
                  if (!released) {
                      released = true
                      animator.cancel()
                  }
              }

              override fun onDetachedFromWindow() {
                  release()
                  super.onDetachedFromWindow()
              }
          }
          KOTLIN

      - name: Verify mouth animation regression
        working-directory: _gama_build
        run: |
          set -euo pipefail

          VIEW="app/src/main/java/com/gama/assistant/GamaEnergyView.kt"

          test -s "$VIEW"

          grep -Fq \
            '0.455f' \
            "$VIEW"

          grep -Fq \
            '0.595f' \
            "$VIEW"

          grep -Fq \
            '0.835f' \
            "$VIEW"

          grep -Fq \
            '0.965f' \
            "$VIEW"

          grep -Fq \
            'mouthLift' \
            "$VIEW"

          grep -Fq \
            'drawH *' \
            "$VIEW"

          # Esses eram os responsáveis pela animação horrível
          # de deformar a parte inferior inteira.
          if grep -Fq \
            'baseJawHeight' \
            "$VIEW"; then
            echo "::error::Animação antiga da mandíbula ainda existe."
            exit 1
          fi

          if grep -Fq \
            'jawTopPx' \
            "$VIEW"; then
            echo "::error::Região antiga gigante da mandíbula ainda existe."
            exit 1
          fi

          if grep -Fq \
            'stretch' \
            "$VIEW"; then
            echo "::error::A boca ainda está sendo deformada."
            exit 1
          fi

          echo "PASS: somente a pequena boca inferior é móvel."

      - name: Continuous Core structural audit
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"
          TEST="app/src/test/java/com/gama/assistant"

          required=(
            "$SRC/ActiveTaskContext.kt"
            "$SRC/GamaTurnCoordinator.kt"
            "$SRC/GamaOrchestrator.kt"
            "$SRC/SemanticEndpointer.kt"
            "$SRC/AssistantStateController.kt"
            "$SRC/GamaSelfSpeechGuard.kt"
            "$SRC/ContextSanityCheck.kt"
            "$SRC/GamaRecoveryManager.kt"
            "$SRC/PriorityNotificationManager.kt"
            "$TEST/SemanticEndpointerTest.kt"
            "$TEST/ActiveTaskContextTest.kt"
            "$TEST/GamaTurnCoordinatorTest.kt"
            "$TEST/GamaSelfSpeechGuardTest.kt"
            "$TEST/ContextSanityCheckTest.kt"
            "$TEST/GamaContinuousCoreTest.kt"
          )

          for file in "${required[@]}"; do
            test -s "$file"
            echo "PASS $file"
          done

          grep -Fq \
            'COMMAND_START_TIMEOUT_MS = 12_000L' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'FOLLOW_UP_START_TIMEOUT_MS = 15_000L' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'handleSemanticEndpoint' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaSelfSpeechGuard' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'ContextSanityCheck' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'warmBrainSilently' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'maxAttemptIndex()' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'LAUNCHER_APPS' \
            "$SRC/GamaReliableAppLauncher.kt"

          grep -Fq \
            'CATEGORY_LAUNCHER' \
            "$SRC/GamaReliableAppLauncher.kt"

          grep -Fq \
            'getLaunchIntentSenderForPackage' \
            "$SRC/GamaReliableAppLauncher.kt"

          grep -Fq \
            'com.whatsapp' \
            app/src/main/AndroidManifest.xml

          grep -Fq \
            'com.whatsapp.w4b' \
            app/src/main/AndroidManifest.xml

          if grep -Fq \
            '"apesar"' \
            "$SRC/GamaAppRegistry.kt"; then
            echo "::error::Alias falso do WhatsApp ainda presente."
            exit 1
          fi

          grep -Fq \
            'isDebuggable = false' \
            app/build.gradle.kts

          echo "PASS: Continuous Core."

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          test -d "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Gama 9.4.1 version
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path(
              "app/build.gradle.kts"
          )

          text = p.read_text(
              encoding="utf-8"
          )

          run =
              int(
                  os.environ[
                      "GITHUB_RUN_NUMBER"
                  ]
              )

          version_code =
              24_510_000 + run

          text, code_count =
              re.subn(
                  r"versionCode\s*=\s*\d+",
                  f"versionCode = {version_code}",
                  text,
                  count=1,
              )

          text, name_count =
              re.subn(
                  r'versionName\s*=\s*"[^"]*"',
                  'versionName = "Gama 9.4.1 Continuous Core"',
                  text,
                  count=1,
              )

          if (
              code_count != 1 or
              name_count != 1
          ):
              raise SystemExit(
                  "Falha ao configurar versão."
              )

          p.write_text(
              text,
              encoding="utf-8",
          )
          PY

      - name: Prepare Gradle wrapper
        working-directory: _gama_build
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            gradle wrapper \
              --gradle-version 8.9
          fi

          chmod +x gradlew

          ./gradlew --version

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace

      - name: Compile and test
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew \
            test \
            --no-daemon \
            --stacktrace \
            2>&1 |
            tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail

          ./gradlew \
            lint \
            --no-daemon \
            --stacktrace \
            2>&1 |
            tee "$GITHUB_WORKSPACE/gama-lint.log"

      - name: Assemble release
        working-directory: _gama_build
        run: |
          set -euo pipefail

          if [ -x tools/download_models.sh ]; then
            bash tools/download_models.sh
          fi

          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            2>&1 |
            tee "$GITHUB_WORKSPACE/gama-release.log"

      - name: Sign release APK
        working-directory: _gama_build
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail

          mkdir -p dist

          input_apk="$(
            find \
              app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print |
            head -n 1
          )"

          test -s "$input_apk"

          aligned="dist/Gama-aligned.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f \
            4 \
            "$input_apk" \
            "$aligned"

          if [ "$GAMA_SIGNING_MODE" = "stable" ]; then

            mkdir -p .gama-signing
            chmod 700 .gama-signing

            python3 - \
              "$GAMA_SIGNING_SEED" \
              .gama-signing/key.der <<'PY'
          import sys

          raw = bytes.fromhex(
              sys.argv[1]
          )

          order = int(
              "FFFFFFFF00000000"
              "FFFFFFFFFFFFFFFF"
              "BCE6FAADA7179E84"
              "F3B9CAC2FC632551",
              16,
          )

          d = (
              int.from_bytes(
                  raw,
                  "big",
              ) %
              (order - 1)
          ) + 1

          key =
              d.to_bytes(
                  32,
                  "big",
              )

          der = (
              bytes.fromhex(
                  "30310201010420"
              ) +
              key +
              bytes.fromhex(
                  "A00A06082A8648CE3D030107"
              )
          )

          open(
              sys.argv[2],
              "wb",
          ).write(der)
          PY

            openssl ec \
              -inform DER \
              -in .gama-signing/key.der \
              -out .gama-signing/key.pem \
              >/dev/null 2>&1

            printf '%s' \
              '' |
              base64 --decode \
              > .gama-signing/cert.pem

            keyhash="$(
              openssl pkey \
                -in .gama-signing/key.pem \
                -pubout \
                -outform DER |
              sha256sum |
              cut -d' ' -f1
            )"

            certhash="$(
              openssl x509 \
                -in .gama-signing/cert.pem \
                -pubkey \
                -noout |
              openssl pkey \
                -pubin \
                -outform DER |
              sha256sum |
              cut -d' ' -f1
            )"

            if [ "$keyhash" != "$certhash" ]; then
              echo "::error::Seed não corresponde à assinatura estável."
              exit 1
            fi

            openssl pkcs12 \
              -export \
              -inkey .gama-signing/key.pem \
              -in .gama-signing/cert.pem \
              -out .gama-signing/gama.p12 \
              -name gama \
              -passout pass:GamaStable2026

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              sign \
              --ks .gama-signing/gama.p12 \
              --ks-type PKCS12 \
              --ks-key-alias gama \
              --ks-pass pass:GamaStable2026 \
              --key-pass pass:GamaStable2026 \
              --out dist/Gama.apk \
              "$aligned"

            echo \
              "stable-update-capable" \
              > dist/install-mode.txt

            rm -rf .gama-signing

          else

            keytool \
              -genkeypair \
              -keystore /tmp/gama-fresh.jks \
              -storepass GamaFresh2026 \
              -keypass GamaFresh2026 \
              -alias gama \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Gama Fresh Test,O=Gama,C=BR"

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              sign \
              --ks /tmp/gama-fresh.jks \
              --ks-key-alias gama \
              --ks-pass pass:GamaFresh2026 \
              --key-pass pass:GamaFresh2026 \
              --out dist/Gama.apk \
              "$aligned"

            echo \
              "fresh-install-only" \
              > dist/install-mode.txt
          fi

          rm -f "$aligned"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            dist/Gama.apk |
            tee dist/signature-info.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            dist/Gama.apk \
            > dist/apk-info.txt

          grep -q \
            "name='com.gama.assistant'" \
            dist/apk-info.txt

          grep -q \
            "versionName='Gama 9.4.1 Continuous Core'" \
            dist/apk-info.txt

          EXPECTED_VERSION_CODE="$((24510000 + GITHUB_RUN_NUMBER))"

          grep -q \
            "versionCode='$EXPECTED_VERSION_CODE'" \
            dist/apk-info.txt

          if grep -q \
            'application-debuggable' \
            dist/apk-info.txt; then

            echo "::error::APK release está debuggable."
            exit 1
          fi

          (
            cd dist

            sha256sum \
              Gama.apk \
              > Gama.apk.sha256

            sha256sum \
              -c \
              Gama.apk.sha256
          )

      - name: Final architecture audit
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"

          test -s dist/Gama.apk

          grep -Fq \
            'ActiveTaskContext' \
            "$SRC/ConversationSession.kt"

          grep -Fq \
            'SemanticEndpointer' \
            "$SRC/GamaRecognitionPolicy.kt"

          grep -Fq \
            'GamaSelfSpeechGuard' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'ContextSanityCheck' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaRecoveryManager' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'getLaunchIntentSenderForPackage' \
            "$SRC/GamaReliableAppLauncher.kt"

          grep -Fq \
            'mouthLift' \
            "$SRC/GamaEnergyView.kt"

          if grep -Fq \
            'jawTopPx' \
            "$SRC/GamaEnergyView.kt"; then

            echo "::error::Animação antiga voltou."
            exit 1
          fi

          echo "PASS: auditoria final 9.4.1."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-9.4.1-CONTINUOUS-CORE-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-9.4.1-diagnostics
          path: |
            gama-tests.log
            gama-lint.log
            gama-release.log
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: warn

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="gama-v9.4.1-continuous-core-${{ github.run_number }}"

          gh release create "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            "_gama_build/dist/install-mode.txt#install-mode.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 9.4.1 Continuous Core" \
            --notes "Corrige o SyntaxError do #139, preserva o Continuous Core e substitui a antiga deformação da mandíbula pela animação apenas da pequena boca inferior indicada na logo." \
            --latest
