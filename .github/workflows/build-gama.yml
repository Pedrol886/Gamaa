      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Portuguese offline speech model
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip" \
            -o /tmp/vosk.zip
          rm -rf /tmp/vosk app/src/main/assets/model
          mkdir -p /tmp/vosk
          unzip -q /tmp/vosk.zip -d /tmp/vosk
          mv /tmp/vosk/vosk-model-small-pt-0.3 app/src/main/assets/model

      - name: Verify AndroidX config
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^android.useAndroidX=true$' gradle.properties
          grep -q '^android.enableJetifier=true$' gradle.properties

      - name: Build APK
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Gama-Orb.apk
          ls -lh Gama-Orb.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gama-Orb-APK
          path: Gama-Orb.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="gama-${{ github.run_number }}"
          gh release create "$TAG" Gama-Orb.apk \
            --title "Gama Orb $TAG" \
            --notes "Gama v20 estável: removido wake lock de tela depreciado e engine TTS forçado, mantido wake lock parcial para ouvir com tela apagada, tela bloqueada usa a logo Gama e setTurnScreenOn, listener de voz ganhou recuperação automática contra falhas, voz masculina quando disponível, pesquisa rápida e atalho do criador."
