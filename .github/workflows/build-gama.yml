name: Build Gama 10.3.0 Personal Android Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-gama.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-personal-android-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      GAMA_BASE_RUN_ID: "37226292316"
      GAMA_BASE_ARTIFACT: "Gama-10.0.0-JARVIS-CONTEXT-source"
      GAMA_EXPECTED_CERT_SHA256: "6933EDA890C29567A8F4B6CEAD7A39A442DF109D43B813A19F3F6FA7F39B078C"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-10.3.0-PERSONAL-ANDROID-CORE-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"
            echo "::warning::GAMA_SIGNING_SEED não está configurado."
            echo "::warning::O APK será Release, mas será FRESH-INSTALL-ONLY."
          elif printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-10.3.0-PERSONAL-ANDROID-CORE-APK" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GAMA_SIGNING_SEED deve possuir exatamente 64 caracteres hexadecimais."
            exit 1
          fi

      - name: Restore exact green Gama source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download \
            "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaNotificationListener.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaScreenContextService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaCalendarManager.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaSuperAssistantCore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaMissionStore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaPersonalCore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/VoicePolicy.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/ZevronPlanner.kt

          grep -Fq 'isDebuggable = false' _gama_build/app/build.gradle.kts

          echo "PASS: base verde do GAMA restaurada."

      - name: Install Gama Personal Android Core modules
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"

          cat > "$SRC/GamaTaskStateStore.kt" <<'KOTLIN'
          package com.gama.assistant

          import android.content.Context
          import org.json.JSONObject

          object GamaTaskStateStore {
              enum class State {
                  PENDING,
                  RUNNING,
                  WAITING_USER,
                  COMPLETED,
                  FAILED_RECOVERABLE,
              }

              data class Task(
                  val id: String,
                  val kind: String,
                  val goal: String,
                  val state: State,
                  val data: String = "{}",
                  val prompt: String = "",
                  val createdAt: Long = System.currentTimeMillis(),
                  val updatedAt: Long = System.currentTimeMillis(),
              )

              private const val PREFS = "gama_structured_task_state"
              private const val KEY_TASK = "current_task"
              private const val MAX_AGE_MS = 72L * 60L * 60L * 1000L

              fun start(context: Context, kind: String, goal: String, data: String = "{}", prompt: String = ""): Task {
                  val now = System.currentTimeMillis()
                  val task = Task(
                      id = "${kind.trim().lowercase()}-$now",
                      kind = kind.trim().take(80),
                      goal = goal.trim().replace(Regex("\\s+"), " ").take(900),
                      state = State.PENDING,
                      data = data.take(6000),
                      prompt = prompt.trim().take(1200),
                      createdAt = now,
                      updatedAt = now,
                  )
                  save(context, task)
                  return task
              }

              fun current(context: Context, now: Long = System.currentTimeMillis()): Task? {
                  val raw = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY_TASK, null) ?: return null
                  val task = runCatching {
                      val json = JSONObject(raw)
                      Task(
                          id = json.optString("id"),
                          kind = json.optString("kind"),
                          goal = json.optString("goal"),
                          state = runCatching { State.valueOf(json.optString("state")) }.getOrDefault(State.PENDING),
                          data = json.optString("data", "{}"),
                          prompt = json.optString("prompt"),
                          createdAt = json.optLong("createdAt"),
                          updatedAt = json.optLong("updatedAt"),
                      )
                  }.getOrNull() ?: run {
                      clear(context)
                      return null
                  }

                  if (task.id.isBlank() || task.kind.isBlank() || now - task.updatedAt > MAX_AGE_MS) {
                      clear(context)
                      return null
                  }

                  return task
              }

              fun update(context: Context, task: Task) {
                  save(context, task.copy(updatedAt = System.currentTimeMillis()))
              }

              fun transition(context: Context, state: State, data: String? = null, prompt: String? = null): Task? {
                  val current = current(context) ?: return null
                  val next = current.copy(
                      state = state,
                      data = data ?: current.data,
                      prompt = prompt ?: current.prompt,
                      updatedAt = System.currentTimeMillis(),
                  )
                  save(context, next)
                  return next
              }

              fun complete(context: Context, result: String = "") {
                  val current = current(context) ?: return
                  val json = runCatching { JSONObject(current.data) }.getOrElse { JSONObject() }
                  if (result.isNotBlank()) json.put("result", result.take(1500))
                  save(
                      context,
                      current.copy(
                          state = State.COMPLETED,
                          data = json.toString(),
                          updatedAt = System.currentTimeMillis(),
                      ),
                  )
              }

              fun failRecoverable(context: Context, message: String) {
                  val current = current(context) ?: return
                  val json = runCatching { JSONObject(current.data) }.getOrElse { JSONObject() }
                  json.put("lastError", message.take(1000))
                  save(
                      context,
                      current.copy(
                          state = State.FAILED_RECOVERABLE,
                          data = json.toString(),
                          updatedAt = System.currentTimeMillis(),
                      ),
                  )
              }

              fun clear(context: Context) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().remove(KEY_TASK).apply()
              }

              private fun save(context: Context, task: Task) {
                  val json = JSONObject()
                      .put("id", task.id)
                      .put("kind", task.kind)
                      .put("goal", task.goal)
                      .put("state", task.state.name)
                      .put("data", task.data)
                      .put("prompt", task.prompt)
                      .put("createdAt", task.createdAt)
                      .put("updatedAt", task.updatedAt)

                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY_TASK, json.toString()).apply()
              }
          }
          KOTLIN

          cat > "$SRC/GamaContextPolicy.kt" <<'KOTLIN'
          package com.gama.assistant

          import android.content.Context
          import java.text.Normalizer
          import java.util.Calendar
          import java.util.Locale

          object GamaSilentContext {
              private const val PREFS = "gama_silent_context"
              private const val KEY_START = "start"
              private const val KEY_END = "end"
              private const val KEY_BREAK_START = "break_start"
              private const val KEY_BREAK_END = "break_end"
              private const val KEY_LABEL = "label"

              private val rangeRegex = Regex("""(?:das|de)\s*(\d{1,2})(?::(\d{2}))?\s*(?:as|a)\s*(\d{1,2})(?::(\d{2}))?""")

              fun handle(context: Context, raw: String): String? {
                  val text = normalize(raw)

                  val explicitSilence = listOf(
                      "nao fale comigo",
                      "nao me interrompa",
                      "nao interrompa",
                      "modo silencioso",
                      "fique em silencio",
                      "fica em silencio",
                      "sem me interromper",
                  ).any { it in text }

                  if (!explicitSilence) return null

                  val ranges = rangeRegex.findAll(text).toList()
                  if (ranges.isEmpty()) return "Entendi que você quer silêncio, mas preciso saber o horário de início e fim."

                  val offset = if ("amanha" in text) 1 else 0
                  val main = toWindow(ranges.first(), offset) ?: return "Não consegui interpretar esse horário."

                  var breakStart = 0L
                  var breakEnd = 0L

                  if ("intervalo" in text && ranges.size >= 2) {
                      val pause = toWindow(ranges[1], offset)
                      if (pause != null) {
                          breakStart = pause.first
                          breakEnd = pause.second
                      }
                  }

                  val label = when {
                      "prova" in text -> "prova"
                      "aula" in text -> "aula"
                      "trabalho" in text -> "compromisso"
                      else -> "período ocupado"
                  }

                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit()
                      .putLong(KEY_START, main.first)
                      .putLong(KEY_END, main.second)
                      .putLong(KEY_BREAK_START, breakStart)
                      .putLong(KEY_BREAK_END, breakEnd)
                      .putString(KEY_LABEL, label)
                      .apply()

                  return if (breakStart > 0L && breakEnd > breakStart) {
                      "Certo. Vou evitar interrupções durante sua $label e volto ao comportamento normal no intervalo que você informou e depois do horário."
                  } else {
                      "Certo. Vou evitar interrupções não urgentes durante sua $label e volto ao normal automaticamente depois."
                  }
              }

              fun isSilentNow(context: Context, now: Long = System.currentTimeMillis()): Boolean {
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val start = prefs.getLong(KEY_START, 0L)
                  val end = prefs.getLong(KEY_END, 0L)

                  if (start <= 0L || end <= start || now !in start until end) return false

                  val breakStart = prefs.getLong(KEY_BREAK_START, 0L)
                  val breakEnd = prefs.getLong(KEY_BREAK_END, 0L)

                  if (breakStart > 0L && breakEnd > breakStart && now in breakStart until breakEnd) return false
                  return true
              }

              fun description(context: Context): String? {
                  if (!isSilentNow(context)) return null
                  val label = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY_LABEL, "período ocupado")
                  return "Você está no período silencioso configurado para $label."
              }

              private fun toWindow(match: MatchResult, dayOffset: Int): Pair<Long, Long>? {
                  val startHour = match.groupValues[1].toIntOrNull() ?: return null
                  val startMinute = match.groupValues[2].toIntOrNull() ?: 0
                  val endHour = match.groupValues[3].toIntOrNull() ?: return null
                  val endMinute = match.groupValues[4].toIntOrNull() ?: 0

                  if (startHour !in 0..23 || endHour !in 0..23 || startMinute !in 0..59 || endMinute !in 0..59) return null

                  val start = Calendar.getInstance().apply {
                      add(Calendar.DAY_OF_MONTH, dayOffset)
                      set(Calendar.HOUR_OF_DAY, startHour)
                      set(Calendar.MINUTE, startMinute)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                  }

                  val end = Calendar.getInstance().apply {
                      timeInMillis = start.timeInMillis
                      set(Calendar.HOUR_OF_DAY, endHour)
                      set(Calendar.MINUTE, endMinute)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                      if (timeInMillis <= start.timeInMillis) add(Calendar.DAY_OF_MONTH, 1)
                  }

                  return start.timeInMillis to end.timeInMillis
              }

              private fun normalize(value: String): String =
                  Normalizer.normalize(value.lowercase(Locale("pt", "BR")), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}+"), "")
                      .replace(Regex("[^a-z0-9: ]+"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
          }

          object GamaNotificationIntelligence {
              enum class Level {
                  LOW,
                  NORMAL,
                  IMPORTANT,
                  URGENT,
              }

              fun classify(context: Context, source: String, message: String, recentSameSender: Int = 0): Level {
                  val text = normalize("$source $message")
                  val owner = runCatching { normalize(OwnerIdentity.name(context)) }.getOrDefault("")
                  val directlyMentionsOwner = owner.length >= 3 && (text.contains(owner) || text.contains("@$owner"))

                  val urgentTerms = listOf(
                      "urgente",
                      "emergencia",
                      "hospital",
                      "acidente",
                      "socorro",
                      "me liga agora",
                      "me ligue agora",
                      "preciso falar agora",
                      "preciso de voce agora",
                  )

                  if (urgentTerms.any { it in text }) return Level.URGENT

                  val importantTerms = listOf(
                      "prova",
                      "atividade",
                      "trabalho",
                      "escola",
                      "professor",
                      "prazo",
                      "entrega",
                      "reuniao",
                      "consulta",
                      "familia",
                      "mae",
                      "pai",
                      "irmao",
                      "irma",
                      "voce ja fez",
                      "voce terminou",
                      "preciso falar",
                  )

                  if (importantTerms.any { it in text } || directlyMentionsOwner || recentSameSender >= 3) return Level.IMPORTANT

                  val lowTerms = listOf(
                      "vamos jogar",
                      "bora jogar",
                      "partida",
                      "game",
                      "promoção",
                      "promocao",
                      "desconto",
                      "oferta",
                      "cupom",
                      "propaganda",
                  )

                  if (lowTerms.any { it in text }) return Level.LOW
                  return Level.NORMAL
              }

              fun eventPriority(context: Context, source: String, message: String, recentSameSender: Int = 0): GamaEventHub.Priority {
                  return when (classify(context, source, message, recentSameSender)) {
                      Level.LOW -> GamaEventHub.Priority.LOW
                      Level.NORMAL -> GamaEventHub.Priority.NORMAL
                      Level.IMPORTANT, Level.URGENT -> GamaEventHub.Priority.HIGH
                  }
              }

              fun digest(context: Context): String {
                  val unread = GamaUnreadMessageStore.peekUnread(context)
                  if (unread.isEmpty()) return "Não há mensagens não lidas registradas."

                  val classified = unread.map { item ->
                      classify(context, item.title, item.text) to item
                  }

                  val urgent = classified.filter { it.first == Level.URGENT }
                  val important = classified.filter { it.first == Level.IMPORTANT }
                  val normal = classified.count { it.first == Level.NORMAL }
                  val low = classified.count { it.first == Level.LOW }

                  val details = (urgent + important).takeLast(6).map { pair ->
                      val item = pair.second
                      val sender = item.title.ifBlank { "um contato" }
                      val preview = item.text.replace(Regex("\\s+"), " ").trim().take(180)
                      if (preview.isBlank()) sender else "$sender: $preview"
                  }

                  return buildString {
                      append("Enquanto você estava ocupado, ficaram registradas ${unread.size} mensagens.")
                      if (urgent.isNotEmpty()) append(" ${urgent.size} são urgentes.")
                      if (important.isNotEmpty()) append(" ${important.size} são importantes.")
                      if (normal > 0) append(" $normal são normais.")
                      if (low > 0) append(" $low são de baixa prioridade.")
                      if (details.isNotEmpty()) append(" As principais são: ${details.joinToString("; ")}.")
                  }
              }

              private fun normalize(value: String): String =
                  Normalizer.normalize(value.lowercase(Locale("pt", "BR")), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}+"), "")
                      .replace(Regex("[^a-z0-9@ ]+"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
          }
          KOTLIN

          cat > "$SRC/GamaDeviceTools.kt" <<'KOTLIN'
          package com.gama.assistant

          import android.accessibilityservice.AccessibilityService
          import android.app.KeyguardManager
          import android.content.Context
          import android.content.Intent
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.os.BatteryManager
          import android.provider.AlarmClock
          import java.text.Normalizer
          import java.util.Locale

          object GamaTimerRouter {
              private val values = mapOf(
                  "zero" to 0,
                  "um" to 1,
                  "uma" to 1,
                  "dois" to 2,
                  "duas" to 2,
                  "tres" to 3,
                  "quatro" to 4,
                  "cinco" to 5,
                  "seis" to 6,
                  "sete" to 7,
                  "oito" to 8,
                  "nove" to 9,
                  "dez" to 10,
                  "onze" to 11,
                  "doze" to 12,
                  "treze" to 13,
                  "catorze" to 14,
                  "quatorze" to 14,
                  "quinze" to 15,
                  "dezesseis" to 16,
                  "dezessete" to 17,
                  "dezoito" to 18,
                  "dezenove" to 19,
                  "vinte" to 20,
                  "trinta" to 30,
                  "quarenta" to 40,
                  "cinquenta" to 50,
                  "sessenta" to 60,
              )

              fun recognizes(raw: String): Boolean {
                  val text = normalize(raw)
                  val hasUnit = listOf("segundo", "minuto", "hora").any { it in text }
                  if (!hasUnit) return false
                  return text.contains("timer") ||
                      text.contains("me avisa") ||
                      text.contains("me avise") ||
                      text.contains("avisa daqui") ||
                      text.contains("avise daqui") ||
                      text.contains("daqui a") ||
                      text.startsWith("deixa ") ||
                      text.startsWith("deixe ")
              }

              fun handle(service: GamaService, raw: String): String? {
                  if (!recognizes(raw)) return null
                  val seconds = parseSeconds(raw) ?: return "Entendi que você quer um timer, mas não consegui identificar a duração."
                  if (seconds !in 1..86_400) return "Esse tempo ficou fora do limite que vou enviar ao relógio do Android."

                  val intent = Intent(AlarmClock.ACTION_SET_TIMER)
                      .putExtra(AlarmClock.EXTRA_LENGTH, seconds)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, "GAMA")
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)

                  val dispatch = service.launchSafely(intent)
                  if (!dispatch.startsWith("Abrindo", ignoreCase = true)) return dispatch

                  return "Enviei ${formatDuration(seconds)} para o timer do Android."
              }

              private fun parseSeconds(raw: String): Int? {
                  val text = normalize(raw)
                  val tokens = text.split(" ").filter { it.isNotBlank() }
                  var seconds = 0

                  for (index in tokens.indices) {
                      val token = tokens[index]

                      if (token.startsWith("hora")) {
                          if (index > 0 && tokens[index - 1] == "meia") {
                              seconds += 30 * 60
                          } else {
                              quantityBefore(tokens, index)?.let { seconds += it * 3600 }
                          }
                      }

                      if (token.startsWith("minuto")) {
                          quantityBefore(tokens, index)?.let { seconds += it * 60 }
                      }

                      if (token.startsWith("segundo")) {
                          quantityBefore(tokens, index)?.let { seconds += it }
                      }
                  }

                  if ("hora e meia" in text && seconds >= 3600) seconds += 30 * 60
                  return seconds.takeIf { it > 0 }
              }

              private fun quantityBefore(tokens: List<String>, unitIndex: Int): Int? {
                  if (unitIndex <= 0) return null
                  val previous = tokens[unitIndex - 1]
                  previous.toIntOrNull()?.let { return it }

                  var result = 0
                  var found = false
                  var cursor = unitIndex - 1

                  while (cursor >= 0 && unitIndex - cursor <= 5) {
                      val token = tokens[cursor]
                      if (token == "e") {
                          cursor--
                          continue
                      }

                      val value = values[token] ?: break
                      result += value
                      found = true
                      cursor--
                  }

                  return result.takeIf { found && it > 0 }
              }

              private fun formatDuration(seconds: Int): String {
                  val hours = seconds / 3600
                  val minutes = (seconds % 3600) / 60
                  val remaining = seconds % 60

                  return buildString {
                      if (hours > 0) append("$hours hora${if (hours == 1) "" else "s"}")
                      if (minutes > 0) {
                          if (isNotEmpty()) append(" e ")
                          append("$minutes minuto${if (minutes == 1) "" else "s"}")
                      }
                      if (remaining > 0 && hours == 0) {
                          if (isNotEmpty()) append(" e ")
                          append("$remaining segundo${if (remaining == 1) "" else "s"}")
                      }
                  }
              }

              private fun normalize(value: String): String =
                  Normalizer.normalize(value.lowercase(Locale("pt", "BR")), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}+"), "")
                      .replace(Regex("[^a-z0-9 ]+"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
          }

          object GamaWebsiteRouter {
              private val knownSites = mapOf(
                  "github" to "https://github.com",
                  "google" to "https://www.google.com",
                  "wikipedia" to "https://pt.wikipedia.org",
                  "youtube" to "https://www.youtube.com",
              )

              fun recognizes(raw: String): Boolean {
                  val text = normalize(raw)
                  if (Regex("""https?://\S+""").containsMatchIn(raw)) return true
                  if (Regex("""\b[a-z0-9.-]+\.(?:com|org|net|io|dev|br)\b""").containsMatchIn(text)) return true
                  if (" no chrome" in text || " pelo chrome" in text) return knownSites.keys.any { it in text }
                  return text.startsWith("abra o site ") || text.startsWith("abre o site ") || text.startsWith("acesse o site ")
              }

              fun handle(service: GamaService, raw: String): String? {
                  if (!recognizes(raw)) return null

                  val text = normalize(raw)
                  val requestedChrome = "chrome" in text
                  val explicit = Regex("""https?://[^\s]+""").find(raw)?.value
                  val domain = Regex("""\b[a-z0-9.-]+\.(?:com|org|net|io|dev|br)(?:/[^\s]*)?""").find(text)?.value

                  val url = when {
                      !explicit.isNullOrBlank() -> explicit
                      !domain.isNullOrBlank() -> "https://$domain"
                      else -> knownSites.entries.firstOrNull { it.key in text }?.value
                  } ?: return "Qual site você quer abrir?"

                  var intent = Intent(Intent.ACTION_VIEW, Uri.parse(url)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)

                  if (requestedChrome) {
                      val chrome = "com.android.chrome"
                      val chromeAvailable = runCatching {
                          service.packageManager.getLaunchIntentForPackage(chrome) != null
                      }.getOrDefault(false)

                      if (chromeAvailable) intent = intent.setPackage(chrome)
                  }

                  val dispatch = service.launchSafely(intent)
                  if (!dispatch.startsWith("Abrindo", ignoreCase = true)) return dispatch

                  return if (requestedChrome) "Abrindo o site no Chrome." else "Abrindo o site."
              }

              private fun normalize(value: String): String =
                  Normalizer.normalize(value.lowercase(Locale("pt", "BR")), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}+"), "")
                      .replace(Regex("[^a-z0-9:/._ -]+"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
          }

          object GamaSystemActionRouter {
              fun recognizes(raw: String): Boolean {
                  val text = normalize(raw)

                  return listOf(
                      "abra as notificacoes",
                      "abrir notificacoes",
                      "painel de notificacoes",
                      "configuracoes rapidas",
                      "quick settings",
                      "voltar",
                      "volte",
                      "tela inicial",
                      "ir para inicio",
                      "recentes",
                      "aplicativos recentes",
                      "role para baixo",
                      "rola para baixo",
                      "role para cima",
                      "rola para cima",
                      "clique em ",
                      "toque em ",
                      "aperte ",
                  ).any { it in text }
              }

              fun handle(context: Context, raw: String): String? {
                  if (!recognizes(raw)) return null
                  val text = normalize(raw)

                  if (!GamaScreenContextService.isConnected()) {
                      GamaScreenContextService.openSettings(context)
                      return "Para controlar essa parte da interface, ative Gama Contexto da Tela na acessibilidade. Abri a configuração."
                  }

                  val keyguard = context.getSystemService(KeyguardManager::class.java)
                  val locked = keyguard?.isDeviceLocked == true

                  val privateUiAction = text.contains("clique") ||
                      text.contains("toque") ||
                      text.contains("aperte") ||
                      text.contains("role") ||
                      text.contains("rola") ||
                      text.contains("recentes")

                  if (locked && privateUiAction) return "Para concluir essa ação na interface, desbloqueie o celular."

                  when {
                      text.contains("notificacoes") -> {
                          return if (GamaScreenContextService.performGlobal(AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS)) {
                              "Abri o painel de notificações."
                          } else {
                              "Esta versão do Android não permitiu abrir o painel de notificações por esse caminho."
                          }
                      }

                      text.contains("configuracoes rapidas") || text.contains("quick settings") -> {
                          return if (GamaScreenContextService.performGlobal(AccessibilityService.GLOBAL_ACTION_QUICK_SETTINGS)) {
                              "Abri as configurações rápidas."
                          } else {
                              "O Android não permitiu abrir as configurações rápidas agora."
                          }
                      }

                      text == "voltar" || text == "volte" || text.contains("volte para tela anterior") -> {
                          return if (GamaScreenContextService.performGlobal(AccessibilityService.GLOBAL_ACTION_BACK)) {
                              "Voltei."
                          } else {
                              "O Android não confirmou a ação de voltar."
                          }
                      }

                      text.contains("tela inicial") || text.contains("ir para inicio") -> {
                          return if (GamaScreenContextService.performGlobal(AccessibilityService.GLOBAL_ACTION_HOME)) {
                              "Voltei para a tela inicial."
                          } else {
                              "O Android não confirmou a tela inicial."
                          }
                      }

                      text.contains("recentes") -> {
                          return if (GamaScreenContextService.performGlobal(AccessibilityService.GLOBAL_ACTION_RECENTS)) {
                              "Abri os aplicativos recentes."
                          } else {
                              "Este aparelho não permitiu abrir os aplicativos recentes agora."
                          }
                      }

                      text.contains("role para baixo") || text.contains("rola para baixo") -> {
                          return if (GamaScreenContextService.scroll(true)) {
                              "Rolei a tela para baixo."
                          } else {
                              "Não encontrei uma área acessível que pudesse rolar para baixo."
                          }
                      }

                      text.contains("role para cima") || text.contains("rola para cima") -> {
                          return if (GamaScreenContextService.scroll(false)) {
                              "Rolei a tela para cima."
                          } else {
                              "Não encontrei uma área acessível que pudesse rolar para cima."
                          }
                      }
                  }

                  val label = Regex("""(?:clique|toque|aperte)\s+(?:em|no|na)?\s*(.+)$""")
                      .find(text)
                      ?.groupValues
                      ?.getOrNull(1)
                      ?.trim()
                      .orEmpty()

                  if (label.isNotBlank()) {
                      return if (GamaScreenContextService.clickByLabel(label)) {
                          "Pronto."
                      } else {
                          "Não encontrei um elemento acessível chamado $label na tela atual."
                      }
                  }

                  return null
              }

              private fun normalize(value: String): String =
                  Normalizer.normalize(value.lowercase(Locale("pt", "BR")), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}+"), "")
                      .replace(Regex("[^a-z0-9 ]+"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
          }

          object GamaSystemStatus {
              fun handle(context: Context, raw: String): String? {
                  val text = normalize(raw)

                  if (text !in setOf(
                          "como estamos",
                          "gama como estamos",
                          "como esta o sistema",
                          "como esta o celular",
                          "status do sistema",
                          "status do celular",
                      )
                  ) return null

                  val batteryManager = context.getSystemService(BatteryManager::class.java)
                  val battery = batteryManager?.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)?.takeIf { it in 0..100 }
                  val charging = batteryManager?.isCharging == true

                  val connectivity = context.getSystemService(ConnectivityManager::class.java)
                  val capabilities = connectivity?.getNetworkCapabilities(connectivity.activeNetwork)

                  val network = when {
                      capabilities?.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) == true -> "Wi-Fi"
                      capabilities?.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) == true -> "dados móveis"
                      capabilities?.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET) == true -> "Internet"
                      else -> "sem conexão"
                  }

                  val unread = GamaUnreadMessageStore.peekUnread(context).size
                  val task = GamaTaskStateStore.current(context)

                  return buildString {
                      append("Estamos operacionais.")
                      battery?.let {
                          append(" A bateria está em $it por cento")
                          if (charging) append(" e carregando")
                          append(".")
                      }
                      append(" A conexão atual é $network.")
                      append(" Há $unread mensagem${if (unread == 1) "" else "s"} não lida${if (unread == 1) "" else "s"} registrada${if (unread == 1) "" else "s"}.")
                      GamaSilentContext.description(context)?.let { append(" $it") }
                      if (task != null && task.state !in setOf(GamaTaskStateStore.State.COMPLETED)) {
                          append(" Existe uma tarefa ativa: ${task.goal}.")
                      }
                  }
              }

              private fun normalize(value: String): String =
                  Normalizer.normalize(value.lowercase(Locale("pt", "BR")), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}+"), "")
                      .replace(Regex("[^a-z0-9 ]+"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()
          }
