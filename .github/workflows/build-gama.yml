          package com.gama.assistant
          
          import java.text.Normalizer
          import java.util.Locale
          
          /** Ephemeral, explicit voice session. Does not persist microphone audio or transcripts. */
          class ConversationSession {
              @Volatile var active: Boolean = false
                  private set
              private val turns = ArrayDeque<String>()
          
              @Synchronized fun open() {
                  turns.clear()
                  active = true
              }
          
              @Synchronized fun close() {
                  active = false
                  turns.clear()
              }
          
              @Synchronized fun userSaid(text: String) {
                  if (active) record("Usuário", text)
              }
          
              @Synchronized fun gamaSaid(text: String) {
                  if (active) record("Gama", text)
              }
          
              /**
               * Contexto rolante da conversa. A sessão pode durar muito tempo, mas enviamos ao
               * modelo somente o trecho recente que cabe confortavelmente no aparelho.
               */
              @Synchronized fun historyBeforeCurrent(maxChars: Int = 4200): String {
                  val previous = turns.dropLast(1)
                  if (previous.isEmpty()) return ""
                  val selected = mutableListOf<String>()
                  var used = 0
                  for (line in previous.asReversed()) {
                      val cost = line.length + 1
                      if (selected.isNotEmpty() && used + cost > maxChars) break
                      selected.add(0, line)
                      used += cost
                  }
                  return selected.joinToString("\n")
              }
          
              private fun record(speaker: String, utterance: String) {
                  turns.add("$speaker: ${utterance.replace('\n', ' ').take(320)}")
                  // Mantém uma janela grande de turnos no RAM. O recorte final para o modelo é
                  // feito por caracteres em historyBeforeCurrent(), evitando prompts gigantes.
                  while (turns.size > 48) turns.removeFirst()
              }
          
              companion object {
                  /** Only a deliberate goodbye closes the session; pauses and filler do not. */
                  fun isGoodbye(command: String): Boolean {
                      val c = Normalizer.normalize(command.lowercase(Locale.ROOT), Normalizer.Form.NFD)
                          .replace(Regex("\\p{Mn}+"), "")
                          .replace(Regex("[^a-z0-9 ]"), " ")
                          .replace(Regex("\\s+"), " ").trim()
                      return c in setOf("tchau", "ate mais", "descanse", "pode descansar",
                          "encerrar conversa", "encerre a conversa", "encerra a conversa",
                          "pare de ouvir", "pode parar de ouvir", "gama pode descansar",
                          "gama encerrar conversa", "gama pare de ouvir")
                  }
              }
          }
