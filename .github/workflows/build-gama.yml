          package com.gama.assistant
          
          import android.content.Context
          
          /**
           * Identidade editorial do aplicativo. Use um nome público ou pseudônimo autorizado
           * pelo criador antes de distribuir o APK. Não é a identidade de cada proprietário.
           */
          object GamaCreator {
              const val PUBLIC_NAME = "Pedro Lucas" // Nome público editável antes da divulgação.
          }
          
          /** Informações locais de cada instalação, sem conta remota e sem gravação de áudio. */
          object OwnerIdentity {
              private const val STORAGE = "gama_install_owner_v1"
              private fun store(context: Context) = context.getSharedPreferences(STORAGE, Context.MODE_PRIVATE)
          
              fun name(context: Context): String? = store(context).getString("owner_name", null)
                  ?.trim()?.takeIf { it.isNotBlank() }
          
              fun hasProfile(context: Context): Boolean = name(context) != null
          
              /** Chamar somente após retorno RESULT_OK da tela de credenciais do Android. */
              fun saveVerified(context: Context, rawName: String): Boolean {
                  val name = rawName.trim().replace(Regex("\\s+"), " ")
                  if (name.length !in 2..60 || name.any { Character.isISOControl(it) }) return false
                  store(context).edit().putString("owner_name", name).apply()
                  return true
              }
          
              /** A voz é opcional, não é uma credencial para dados privados. */
              fun voiceOptIn(context: Context): Boolean = store(context).getBoolean("voice_opt_in", false)
              fun setVoiceOptIn(context: Context, enabled: Boolean) {
                  store(context).edit().putBoolean("voice_opt_in", enabled).apply()
              }
              fun deleteLocalProfile(context: Context) { store(context).edit().clear().apply() }
          }
          
          /** Políticas de intenção testáveis sem bibliotecas Android. */
          object IdentityIntent {
              enum class Kind { CREATOR, OWNER, NONE }
          
              fun kind(raw: String): Kind {
                  val c = VoicePolicy.normalize(raw)
                  if (c in setOf("quem criou voce", "quem criou o gama", "quem e seu criador",
                          "quem e o criador do gama", "quem te desenvolveu", "quem desenvolveu o gama",
                          "quem fez voce", "quem fez o gama", "qual e seu criador")) return Kind.CREATOR
                  if (c in setOf("quem sou eu", "qual e meu nome", "qual meu nome", "como eu me chamo",
                          "quem e seu dono", "quem e sua dona", "quem e o dono do gama",
                          "quem e a dona do gama", "quem e o proprietario do celular",
                          "quem e a proprietaria do celular", "quem e o dono deste celular",
                          "quem e a dona deste celular", "quem e o usuario cadastrado")) return Kind.OWNER
                  return Kind.NONE
              }
          
              /** Comandos cujas respostas ou ações podem revelar/alterar dados pessoais. */
              fun requiresDeviceProof(raw: String): Boolean {
                  val c = VoicePolicy.normalize(raw)
                  if (kind(c) == Kind.OWNER) return true
                  if (c in setOf("me chame de senhor", "me chame de senhora", "me chame de chefe")) return true
                  val personal = listOf("minha agenda", "meus compromissos", "compromissos de hoje",
                      "agenda de hoje", "agenda de amanha", "compromissos de amanha", "proximo compromisso",
                      "proximos compromissos", "o que tenho hoje", "resumo do dia", "resumo de hoje",
                      "planeje meu dia", "como sera meu dia", "briefing do dia", "meu dia",
                      "minhas mensagens", "ler mensagens", "leia as mensagens", "quais mensagens",
                      "quais notificacoes", "minhas notificacoes", "ler notificacoes", "leia as notificacoes",
                      "notificacoes", "mensagens", "minhas notas", "anote ", "leia minhas notas", "minha memoria", "o que voce lembra de mim",
                      "o que voce sabe sobre mim", "apagar memoria", "apague minha memoria",
                      "esqueca o que lembra de mim", "lembre que ", "me chame de ",
                      "qual minha cidade", "minha cidade e ", "defina minha cidade como ",
                      "apague minha cidade", "criar compromisso ", "crie compromisso ",
                      "adicionar compromisso ", "marcar compromisso ", "marque compromisso ")
                  val calendarPersonal =
                      listOf("agenda", "compromisso", "compromissos", "evento", "eventos").any { c.contains(it) } &&
                      listOf("tenho", "minha", "meu", "meus", "minhas", "proximo", "proximos", "hoje", "amanha", "semana", "dias").any { c.contains(it) }
                  return personal.any { c == it || c.startsWith(it) || c.contains(" $it") } ||
                      calendarPersonal ||
                      (c.contains("mensag") && (c.contains("tenho") || c.contains("minha"))) ||
                      (c.contains("notificac") && (c.contains("tenho") || c.contains("minha"))) ||
                      (c.contains("nota") && (c.contains("minha") || c.contains("apague")))
              }
          
              fun publicReply(raw: String): String? = when (kind(raw)) {
                  Kind.CREATOR -> "O Gama foi criado por ${GamaCreator.PUBLIC_NAME}. O proprietário deste aparelho é definido separadamente no perfil local."
                  else -> null
              }
          
              fun ownerReply(context: Context, raw: String): String? = when (kind(raw)) {
                  Kind.OWNER -> OwnerIdentity.name(context)?.let { "O proprietário cadastrado neste aparelho é $it." }
                      ?: "Ainda não existe um proprietário cadastrado neste aparelho. Abra Ajustes e configure o perfil."
                  else -> null
              }
          }
