              )
              manifest.write_text(data, encoding="utf-8")

          for path in Path("app/src/main/res").glob("values*/strings*.xml"):
              data = path.read_text(encoding="utf-8")
              data = data.replace("Gama", "Kavus")
              path.write_text(data, encoding="utf-8")
