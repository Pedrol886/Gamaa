      - name: Apply Gama 4.7 identity, orange UI and private session
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_47'
          from pathlib import Path
          import re
          
          root = Path('.')
          
          def write(rel, text):
              p = root / rel
              p.write_text(text, encoding='utf-8')
          
          def sub_once(text, pattern, repl, label, flags=0):
              out, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'Patch 4.7 não encontrou: {label}')
              return out
          
          # Versão.
          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          g, count = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "Gama 4.7"', g, count=1)
          if count != 1:
              raise SystemExit('versionName não encontrado')
          gradle.write_text(g, encoding='utf-8')
          main_path = Path('app/src/main/java/com/gama/assistant/MainActivity.kt')
          main = main_path.read_text(encoding='utf-8')
          main = re.sub(r'Gama 4\.[0-9.]+', 'Gama 4.7', main)
          
          # Identidade local: nome + tratamento. Nenhuma voz, face, digital ou PIN é guardado pelo Gama.
          identity = r'''package com.gama.assistant
          
          import android.content.Context
          
          /** Identidade editorial pública do aplicativo. */
          object GamaCreator {
              const val PUBLIC_NAME = "Pedro Lucas"
          }
          
          /**
           * Perfil local desta instalação.
           * O Gama guarda somente nome e tratamento escolhidos pelo usuário.
           * A autenticação é sempre feita pelo Android; o Gama não recebe nem armazena PIN,
           * digital, rosto ou amostras de voz.
           */
          object OwnerIdentity {
              private const val STORAGE = "gama_install_owner_v2"
              private const val LEGACY_STORAGE = "gama_install_owner_v1"
              val treatments = setOf("Senhor", "Senhora")
          
              private fun store(context: Context) =
                  context.getSharedPreferences(STORAGE, Context.MODE_PRIVATE)
          
              private fun legacy(context: Context) =
                  context.getSharedPreferences(LEGACY_STORAGE, Context.MODE_PRIVATE)
          
              fun name(context: Context): String? =
                  (store(context).getString("owner_name", null)
                      ?: legacy(context).getString("owner_name", null))
                      ?.trim()?.takeIf { it.isNotBlank() }
          
              fun treatment(context: Context): String {
                  val value = store(context).getString("owner_treatment", null)
                  return value?.takeIf { it in treatments } ?: "Senhor"
              }
          
              fun hasConfiguredTreatment(context: Context): Boolean =
                  store(context).getString("owner_treatment", null)?.let { it in treatments } == true
          
              fun address(context: Context): String? =
                  name(context)?.let { "${treatment(context)} $it" }
          
              fun hasProfile(context: Context): Boolean = name(context) != null
          
              /** Chamar somente após RESULT_OK da confirmação oficial do Android. */
              fun saveVerified(context: Context, rawName: String): Boolean =
                  saveVerified(context, rawName, treatment(context))
          
              /** Chamar somente após RESULT_OK da confirmação oficial do Android. */
              fun saveVerified(context: Context, rawName: String, rawTreatment: String): Boolean {
                  val cleanName = rawName.trim().replace(Regex("\\s+"), " ")
                  val cleanTreatment = rawTreatment.trim().replaceFirstChar { it.uppercase() }
                  if (cleanName.length !in 2..60 || cleanName.any { Character.isISOControl(it) }) return false
                  if (cleanTreatment !in treatments) return false
                  store(context).edit()
                      .putString("owner_name", cleanName)
                      .putString("owner_treatment", cleanTreatment)
                      .apply()
                  return true
              }
          
              /** Compatibilidade: biometria vocal permanece permanentemente desativada. */
              fun voiceOptIn(context: Context): Boolean = false
              fun setVoiceOptIn(context: Context, enabled: Boolean) {
                  context.getSharedPreferences("muffin_owner_voice_v3", Context.MODE_PRIVATE)
                      .edit().clear().apply()
              }
          
              fun deleteLocalProfile(context: Context) {
                  store(context).edit().clear().apply()
                  legacy(context).edit().clear().apply()
                  context.getSharedPreferences("muffin_owner_voice_v3", Context.MODE_PRIVATE)
                      .edit().clear().apply()
              }
          }
          
          /** Políticas de intenção testáveis sem bibliotecas Android. */
          object IdentityIntent {
              enum class Kind { CREATOR, OWNER, NONE }
          
              fun kind(raw: String): Kind {
                  val c = VoicePolicy.normalize(raw)
                  if (c in setOf("quem criou voce", "quem criou o gama", "quem e seu criador",
                          "quem e o criador do gama", "quem te desenvolveu", "quem desenvolveu o gama",
                          "quem fez voce", "quem fez o gama", "qual e seu criador")) return Kind.CREATOR
                  if (c in setOf("quem sou eu", "qual e meu nome", "qual meu nome", "como eu me chamo",
                          "quem e seu dono", "quem e sua dona", "quem e o dono do gama",
                          "quem e a dona do gama", "quem e o proprietario do celular",
                          "quem e a proprietaria do celular", "quem e o dono deste celular",
                          "quem e a dona deste celular", "quem e o usuario cadastrado")) return Kind.OWNER
                  return Kind.NONE
              }
          
              /** Comandos cujas respostas ou ações podem revelar/alterar dados pessoais. */
              fun requiresDeviceProof(raw: String): Boolean {
                  val c = VoicePolicy.normalize(raw)
                  if (kind(c) == Kind.OWNER) return true
                  if (c.startsWith("me chame de ") || c.startsWith("mude meu nome") ||
                      c.startsWith("altere meu nome") || c.startsWith("mude meu tratamento")) return true
                  val personal = listOf(
                      "minha agenda", "meus compromissos", "compromissos de hoje",
                      "agenda de hoje", "agenda de amanha", "compromissos de amanha", "proximo compromisso",
                      "proximos compromissos", "o que tenho hoje", "resumo do dia", "resumo de hoje",
                      "planeje meu dia", "como sera meu dia", "briefing do dia", "meu dia",
                      "minhas mensagens", "ler mensagens", "leia as mensagens", "quais mensagens",
                      "quais notificacoes", "minhas notificacoes", "ler notificacoes", "leia as notificacoes",
                      "notificacoes", "mensagens", "minhas notas", "anote ", "leia minhas notas",
                      "minha memoria", "o que voce lembra de mim", "o que voce sabe sobre mim",
                      "apagar memoria", "apague minha memoria", "esqueca o que lembra de mim",
                      "lembre que ", "qual minha cidade", "minha cidade e ", "defina minha cidade como ",
                      "apague minha cidade", "criar compromisso ", "crie compromisso ",
                      "adicionar compromisso ", "marcar compromisso ", "marque compromisso "
                  )
                  val calendarPersonal =
                      listOf("agenda", "compromisso", "compromissos", "evento", "eventos").any { c.contains(it) } &&
                      listOf("tenho", "minha", "meu", "meus", "minhas", "proximo", "proximos", "hoje", "amanha", "semana", "dias").any { c.contains(it) }
                  return personal.any { c == it || c.startsWith(it) || c.contains(" $it") } ||
                      calendarPersonal ||
                      (c.contains("mensag") && (c.contains("tenho") || c.contains("minha"))) ||
                      (c.contains("notificac") && (c.contains("tenho") || c.contains("minha"))) ||
                      (c.contains("nota") && (c.contains("minha") || c.contains("apague")))
              }
          
              fun publicReply(raw: String): String? = when (kind(raw)) {
                  Kind.CREATOR -> "O Gama foi criado por ${GamaCreator.PUBLIC_NAME}. O proprietário deste aparelho é definido separadamente no perfil local."
                  else -> null
              }
          
              fun ownerReply(context: Context, raw: String): String? = when (kind(raw)) {
                  Kind.OWNER -> OwnerIdentity.address(context)?.let { "O perfil autenticado deste aparelho está configurado como $it." }
                      ?: "Ainda não existe uma identidade configurada neste aparelho. Abra Ajustes e configure o perfil."
                  else -> null
              }
          }
          '''
          write('app/src/main/java/com/gama/assistant/GamaIdentity.kt', identity)
          
          persona = r'''package com.gama.assistant
          
          /** Regras de resposta puras: não têm permissões nem simulam ações do Android. */
          object GamaPersona {
              val titles = setOf("Senhor", "Senhora")
          
              /** Mantido para testes e código legado. */
              fun address(reply: String, title: String): String {
                  val text = reply.trim()
                  if (text.isEmpty()) return text
                  val chosen = title.takeIf { it in titles } ?: "Senhor"
                  if (text.startsWith("$chosen,", ignoreCase = true) ||
                      text.startsWith("$chosen.", ignoreCase = true)) return text
                  return "$chosen, $text"
              }
          
              /** Toda fala normal do Gama começa pelo tratamento e pelo nome configurados. */
              fun address(reply: String, title: String, name: String?): String {
                  var text = reply.trim()
                  if (text.isEmpty()) return text
                  val chosen = title.takeIf { it in titles } ?: "Senhor"
                  val cleanName = name?.trim()?.replace(Regex("\\s+"), " ")?.takeIf { it.isNotBlank() }
                      ?: return address(text, chosen)
                  val full = "$chosen $cleanName"
                  if (text.startsWith("$full,", ignoreCase = true) ||
                      text.startsWith("$full.", ignoreCase = true)) return text
          
                  // Remove tratamentos antigos para nunca sair "Senhor Pedro, Sim senhor...".
                  text = text.replaceFirst(
                      Regex("(?i)^(?:sim\\s+)?(?:senhor|senhora|chefe)\\s*[,.:;-]?\\s*"),
                      ""
                  ).trim()
                  text = text.replace(
                      Regex("(?i),?\\s+(?:senhor|senhora|chefe)[.!?]?$"),
                      "."
                  ).trim()
                  return if (text.isBlank()) "$full." else "$full, $text"
              }
          
              fun batteryAdvice(level: Int): String = when (level) {
                  in 0..10 -> "Sugiro conectar o carregador e pausar a escuta contínua para economizar energia."
                  in 11..20 -> "Sugiro ativar a economia de energia nos ajustes se precisar preservar a bateria."
                  else -> ""
              }
          
              fun prompt(question: String, history: String, title: String, facts: List<String>, focus: Boolean): String {
                  val chosen = title.takeIf { it in titles } ?: "Senhor"
                  val profile = if (facts.isEmpty()) "Nenhuma preferência pessoal explicitamente memorizada." else
                      facts.takeLast(6).joinToString("\\n") { "- ${it.take(160).replace('\\n', ' ')}" }
                  val focusText = if (focus) "Modo foco local ativado: somente o essencial, sem humor nem perguntas dispensáveis." else
                      "Humor seco e discreto somente em situações leves; nunca seja rude, invasivo ou sarcástico em urgências."
                  return """
                      Você é Gama, o assistente pessoal Android em português do Brasil, com estilo de mordomo britânico objetivo e preciso.
                      Trate o usuário como $chosen. O aplicativo acrescentará automaticamente o nome configurado antes da fala.
                      Se perguntarem sua origem, seu criador público se chama ${GamaCreator.PUBLIC_NAME}.
                      NÃO presuma que a voz identifica o proprietário. O Gama não armazena perfil de voz.
                      Dados pessoais dependem de uma sessão autenticada pelo Android.
                      Comece com confirmação breve quando isso melhorar a resposta; dê a solução diretamente, em até três frases curtas.
                      $focusText
                      Antecipe riscos e ofereça no máximo uma sugestão contextual quando houver uma ação útil e fundamentada.
                      Em urgências, elimine humor e priorize instruções imediatas e até duas alternativas claras.
                      Não adivinhe clima, agenda, localização, bateria, compromissos ou informação em tempo real.
                      O Gama pode consultar calendário local autorizado e previsão via internet em comandos específicos, fora deste modelo.
                      O modelo sozinho não consulta contas, agenda, câmera, clima em tempo real nem executa ações.
                      Para dados atuais, oriente o usuário a pedir resumo do dia, minha agenda ou previsão do tempo com uma cidade.
