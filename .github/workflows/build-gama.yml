name: Build Gama APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Gama source
        shell: bash
        run: |
          cat > /tmp/gama.tar.gz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/gama.tar.gz.b64 > /tmp/gama.tar.gz
          tar -xzf /tmp/gama.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Portuguese offline speech model
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip -o /tmp/vosk.zip
          unzip -q /tmp/vosk.zip -d /tmp/vosk
          rm -rf app/src/main/assets/model
          mv /tmp/vosk/vosk-model-small-pt-0.3 app/src/main/assets/model

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Gama-Orb.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gama-Orb-APK
          path: Gama-Orb.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="gama-${{ github.run_number }}"
          gh release create "$TAG" Gama-Orb.apk --title "Gama Orb $TAG" --notes "APK de teste do Gama gerado automaticamente."
