      # ==============================================================
      # INTEGRATE THE NEW CORE INTO THE EXISTING CONTINUOUS CORE
      # ==============================================================

      - name: Integrate Personal Intelligence Core
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("_gama_build")
          src = root / "app/src/main/java/com/gama/assistant"

          service = src / "GamaService.kt"
          listener = src / "GamaNotificationListener.kt"

          def sub_once(path, pattern, replacement):
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.S,
              )

              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one match for {pattern!r}, got {count}"
                  )

              path.write_text(
                  updated,
                  encoding="utf-8",
              )

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)

              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one literal match, got {count}: {old[:100]!r}"
                  )

              path.write_text(
                  text.replace(
                      old,
                      new,
                      1,
                  ),
                  encoding="utf-8",
              )

          # ----------------------------------------------------------
          # Initialize persistent personal core.
          # ----------------------------------------------------------

          replace_once(
              service,
              "        AssistantRuntime.service = this\n",
              """        AssistantRuntime.service = this
                  GamaPersonalAICore.initialize(this)
              """,
          )

          # ----------------------------------------------------------
          # User-defined aliases participate before deterministic tools.
          # ----------------------------------------------------------

          sub_once(
              service,
              r'val command = sessionResolved\s+orchestrator\.beginTurn\(command\)',
              '''val command =
                          GamaPersonalAICore
                              .rewriteAliases(
                                  this,
                                  sessionResolved,
                              )

                      orchestrator.beginTurn(command)''',
          )

          # ----------------------------------------------------------
          # Policy/memory commands are deterministic, never sent to Gemma.
          # ----------------------------------------------------------

          replace_once(
              service,
              """        if (conversation.active) touchConversation()
                  IdentityIntent.publicReply(command)?.let { reply ->
              """,
              """        if (conversation.active) touchConversation()

                  GamaPersonalAICore
                      .handleVoiceCommand(
                          this,
                          command,
                      )
                      ?.let { reply ->
                          updateNotification(reply)
                          speak(
                              reply,
                              false,
                          )
                          return
                      }

                  IdentityIntent.publicReply(command)?.let { reply ->
              """,
          )

          # ----------------------------------------------------------
          # Personal memory/policies enter brain context selectively.
          # ----------------------------------------------------------

          sub_once(
              service,
              r'(ZevronContextResolver\s*\.brainContext\(\),)',
              r'''\1
                                      GamaPersonalAICore
                                          .brainContext(
                                              this
                                          ),''',
          )

          # ----------------------------------------------------------
          # Controlled proactivity.
          #
          # A sleeping GAMA remains silent unless an EXPLICIT policy
          # authorizes that sender to alert the owner.
          # ----------------------------------------------------------

          replace_once(
              service,
              """        if (!GamaSupervisor.maySpeakProactively(conversation.active, age)) {
              """,
              """        val explicitPolicyAlert =
                      GamaPersonalAICore
                          .explicitAlertAllowed(
                              this,
                              event.source,
                          )

                  if (
                      !GamaSupervisor
                          .maySpeakProactively(
                              conversation.active,
                              age,
                          ) &&
                      !explicitPolicyAlert
                  ) {
              """,
          )

          # ----------------------------------------------------------
          # Endpoint adaptive metric.
          # ----------------------------------------------------------

          replace_once(
              service,
              """    private var pendingSemanticUntil = 0L
              """,
              """    private var pendingSemanticUntil = 0L
                  private var pendingSemanticStartedAt = 0L
              """,
          )

          sub_once(
              service,
              r'(private fun clearSemanticEndpoint\(\) \{\s*'
              r'pendingSemanticText = ""\s*'
              r'pendingSemanticJson = null\s*'
              r'pendingSemanticUntil = 0L)',
              r'''\1
                      pendingSemanticStartedAt = 0L''',
          )

          sub_once(
              service,
              r'(\s+val merged =\s*SemanticEndpointer\s*\.merge\()',
              r'''
                      if (
                          pendingSemanticText.isNotBlank() &&
                          pendingSemanticStartedAt > 0L &&
                          candidate.isNotBlank()
                      ) {
                          GamaSelfOptimizer
                              .observeContinuation(
                                  this,
                                  now -
                                      pendingSemanticStartedAt,
                              )
                      }
              \1''',
          )

          sub_once(
              service,
              r'if \(\s*SemanticEndpointer\s*\.looksIncomplete\(merged\)\s*\) \{',
              '''val continuationMs =
                              SemanticEndpointer
                                  .continuationWindowMs(
                                      merged,
                                      confidence,
                                  )

                          if (continuationMs > 0L) {''',
          )

          sub_once(
              service,
              r'(pendingSemanticText\s*=\s*merged)',
              '''if (
                              pendingSemanticStartedAt <= 0L
                          ) {
                              pendingSemanticStartedAt =
                                  now
                          }

                          \\1''',
          )

          sub_once(
              service,
              r'pendingSemanticUntil\s*=\s*now\s*\+\s*'
              r'SemanticEndpointer\s*\.continuationWindowMs\('
              r'\s*merged,\s*confidence,\s*\)',
              '''pendingSemanticUntil =
                              now +
                                  continuationMs''',
          )

          # ----------------------------------------------------------
          # Record successful command flow as optimizer evidence.
          # ----------------------------------------------------------

          replace_once(
              service,
              """        // GAMA79_LOCAL_FIRST_ROUTING
                  userCommandSequence += 1L
              """,
              """        // GAMA79_LOCAL_FIRST_ROUTING
                  GamaSelfOptimizer
                      .observeOutcome(
                          this,
                          true,
                      )

                  userCommandSequence += 1L
              """,
          )

          # ----------------------------------------------------------
          # Notifications now go through Event -> Rule -> Priority.
          # ----------------------------------------------------------

          sub_once(
              listener,
              r'val recent = GamaEventHub\.recentFromSource\(this, source, 2L \* 60L \* 1000L\)\s*'
              r'val priority = GamaProactivePolicy\.messagePriority\(body, recent\)\s*'
              r'GamaEventHub\.record\(\s*this,\s*GamaEventHub\.Event\('
              r'.*?\)\s*\)',
              '''GamaPersonalAICore
                      .onNotificationEvent(
                          this,
                          source,
                          body,
                          sbn.postTime,
                      )''',
          )

          print("PASS: Personal Intelligence Core integrated.")
          PY

      # ==============================================================
