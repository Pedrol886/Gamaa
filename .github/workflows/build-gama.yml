                              c.startsWith("por que") ||
                              c.startsWith("porque") ||
                              c.startsWith("e depois") ||
                              c.startsWith("e antes") ||
                              c.startsWith("e quando") ||
                              c.startsWith("e onde")
                          ) {
                              return true
                          }

                          val refs = listOf(
                              "isso",
                              "isso ai",
                              "esse",
                              "essa",
                              "esses",
                              "essas",
                              "aquele",
                              "aquela",
