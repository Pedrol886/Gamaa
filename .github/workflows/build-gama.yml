                      }

                      val important =
                          listOf(
                              "urgente",
                              "importante",
                              "preciso falar",
                              "me liga",
                              "me ligue",
                          ).any {
                              it in n
                          }

                      return if (important) {
                          Priority.IMPORTANT
                      } else {
                          Priority.NORMAL
                      }
                  }
              }
