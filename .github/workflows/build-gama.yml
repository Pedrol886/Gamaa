          grep -Fq 'DeviceActionSafety.looksLikeUnresolvedAction' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'BrainCrashFence.markStart' app/src/main/java/com/gama/assistant/GamaService.kt
          grep -Fq 'marque uma coisa na agenda' app/src/test/java/com/gama/assistant/CalendarCommandRouterTest.kt
          echo 'Gama 5.9 validado: agenda determinística, ações locais fora da IA e proteção contra reinicialização durante inferência.'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set increasing versionCode
        working-directory: _gama_build
        run: |
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import os
          import re

          file = Path('app/build.gradle.kts')
          source = file.read_text(encoding='utf-8')
          run = int(os.environ['GITHUB_RUN_NUMBER'])
          source, count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {20280000 + run}',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('versionCode não encontrado.')
          file.write_text(source, encoding='utf-8')
          PY_VERSION
          grep -Eq 'versionCode = 2028[0-9]+' app/build.gradle.kts
          grep -Fq 'versionName = "Gama 5.9"' app/build.gradle.kts

      - name: Download and verify offline voice models
        working-directory: _gama_build
        run: bash tools/download_models.sh

      - name: Compile Gama APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"

      - name: Run Gama unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Show first failure in summary
        if: failure()
        run: |
          python3 - <<'PY_DIAG'
          from pathlib import Path
          import os
          import re

          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as out:
              out.write('## Gama 5.9: diagnóstico\n\n')
              for name in ('gama-build.log', 'gama-tests.log'):
                  log = Path(name)
                  if not log.is_file():
                      continue
                  lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
                  problems = [
                      line for line in lines
                      if re.search(
                          r'(^e: |\berror:|^FAILURE:|^> Task .* FAILED|^\* What went wrong:|^Caused by:)',
                          line,
                      )
                  ]
                  excerpt = problems[:60] if problems else lines[-60:]
                  out.write('### ' + name + '\n\n```text\n')
                  out.write('\n'.join(excerpt))
                  out.write('\n```\n\n')
          PY_DIAG

      - name: Upload build diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-build-logs
          path: |
            gama-build.log
            gama-tests.log
          if-no-files-found: warn

      - name: Sign and verify Gama.apk
        id: sign_apk
        working-directory: _gama_build
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
          GAMA_SIGNING_MODE: ${{ steps.signing_mode.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p dist

