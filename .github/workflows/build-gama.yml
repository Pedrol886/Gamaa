      - name: Sign Release APK
        working-directory: _gama_build
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail

          mkdir -p dist

          input_apk="$(
            find \
              app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print |
              head -n 1
          )"

          if [ -z "$input_apk" ] || [ ! -s "$input_apk" ]; then
            echo "::error::APK Release não encontrado."
            exit 1
          fi

          aligned="dist/Gama-aligned.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f \
            4 \
            "$input_apk" \
            "$aligned"

          if [ "$GAMA_SIGNING_MODE" = "stable" ]; then
            mkdir -p \
              .gama-signing

            chmod \
              700 \
              .gama-signing

            printf '%s' \
              "$GAMA_SIGNING_SEED" |
              grep -Eq \
                '^[0-9A-Fa-f]{64}$'

            python3 \
              - \
              "$GAMA_SIGNING_SEED" \
              .gama-signing/key.der <<'PY'
          import sys

          raw = bytes.fromhex(
              sys.argv[1]
          )

          order = int(
              "FFFFFFFF00000000"
              "FFFFFFFFFFFFFFFF"
              "BCE6FAADA7179E84"
              "F3B9CAC2FC632551",
              16,
          )

          d = (
              int.from_bytes(
                  raw,
                  "big",
              )
              % (
                  order - 1
              )
          ) + 1

          key = d.to_bytes(
              32,
              "big",
          )

          der = (
              bytes.fromhex(
                  "30310201010420"
              )
              + key
              + bytes.fromhex(
                  "A00A06082A8648CE3D030107"
              )
          )

          with open(
              sys.argv[2],
              "wb",
          ) as handle:
              handle.write(
                  der
              )
          PY

            openssl ec \
              -inform DER \
              -in .gama-signing/key.der \
              -out .gama-signing/key.pem \
              >/dev/null 2>&1

            printf '%s' \
              '' |
              base64 \
                --decode \
              > .gama-signing/cert.pem

            keyhash="$(
              openssl pkey \
                -in .gama-signing/key.pem \
                -pubout \
                -outform DER |
                sha256sum |
                cut -d' ' -f1
            )"

            certhash="$(
              openssl x509 \
                -in .gama-signing/cert.pem \
                -pubkey \
                -noout |
                openssl pkey \
                  -pubin \
                  -outform DER |
                sha256sum |
                cut -d' ' -f1
            )"

            if [ "$keyhash" != "$certhash" ]; then
              echo "::error::GAMA_SIGNING_SEED não corresponde ao certificado estável."
              exit 1
            fi

            openssl pkcs12 \
              -export \
              -inkey .gama-signing/key.pem \
              -in .gama-signing/cert.pem \
              -out .gama-signing/gama.p12 \
              -name gama \
              -passout pass:GamaStable2026

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              sign \
              --ks .gama-signing/gama.p12 \
              --ks-type PKCS12 \
              --ks-key-alias gama \
              --ks-pass pass:GamaStable2026 \
              --key-pass pass:GamaStable2026 \
              --out dist/Gama.apk \
              "$aligned"

            echo \
              "stable-update-capable" \
              > dist/install-mode.txt

            rm -rf \
              .gama-signing
          else
            rm -f \
              /tmp/gama-fresh.jks

            keytool \
              -genkeypair \
              -keystore /tmp/gama-fresh.jks \
              -storepass GamaFresh2026 \
              -keypass GamaFresh2026 \
              -alias gama \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Gama Fresh Test,O=Gama,C=BR"

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              sign \
              --ks /tmp/gama-fresh.jks \
              --ks-key-alias gama \
              --ks-pass pass:GamaFresh2026 \
              --key-pass pass:GamaFresh2026 \
              --out dist/Gama.apk \
              "$aligned"

            echo \
              "fresh-install-only" \
              > dist/install-mode.txt
          fi

          rm -f \
            "$aligned"

      - name: Verify final APK
        working-directory: _gama_build
        env:
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail

          test -s \
            dist/Gama.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            dist/Gama.apk |
            tee \
              dist/signature-info.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump \
            badging \
            dist/Gama.apk \
            > dist/apk-info.txt

          grep -q \
            "name='com.gama.assistant'" \
            dist/apk-info.txt

          grep -q \
            "versionName='Gama 10.3.2 Personal Android Core'" \
            dist/apk-info.txt

          if \
            grep -q \
              'application-debuggable' \
              dist/apk-info.txt
          then
            echo "::error::APK Release está debuggable."
            exit 1
          fi

          (
            cd dist

            sha256sum \
              Gama.apk \
              > Gama.apk.sha256

            sha256sum \
              -c \
              Gama.apk.sha256
          )

          echo "PASS: Gama.apk existe, está assinado e foi verificado."

