          test "$(wc -l < _gama_build/app/src/main/java/com/gama/assistant/LocalBrain.kt)" -gt 200
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaInternetHub.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/SmartFeatures.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/CommandRouter.kt
          test -s _gama_build/app/src/test/java/com/gama/assistant/Gama12AutonomousCoreTest.kt

      - name: Set release version and audit autonomous architecture
        run: |
          set -euo pipefail
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import os
          import re

          root = Path("_gama_build")
          src = root / "app/src/main/java/com/gama/assistant"
          gradle = root / "app/build.gradle.kts"
          text = gradle.read_text(encoding="utf-8")
          version_code = 27_000_000 + int(os.environ["GITHUB_RUN_NUMBER"])
          text, c1 = re.subn(r"versionCode\s*=\s*\d+", f"versionCode = {version_code}", text, count=1)
          text, c2 = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "Gama 12.0 Autonomous Unified Core FIX183"', text, count=1)
          if c1 != 1 or c2 != 1:
              raise SystemExit("Falha ao configurar versão Gama 12 FIX183")
          gradle.write_text(text, encoding="utf-8")

          files_to_scan = list(src.glob("*.kt")) + [root / "app/src/main/AndroidManifest.xml", gradle]
          all_source = "\n".join(p.read_text(encoding="utf-8", errors="ignore") for p in files_to_scan)

          forbidden = [
              "GamaGeminiClient", "GamaGeminiControl", "GamaGeminiPolicy",
              "GamaGeminiSecureStore", "GamaGeminiSettingsActivity",
              "gemini-3.", "generativelanguage.googleapis.com",
              "tasks-genai", "gemma.task", "Gemma 3", "AIza",
          ]
          bad = [token for token in forbidden if token in all_source]
          if bad:
              raise SystemExit("Dependência externa proibida ainda presente: " + ", ".join(bad))

          service = (src / "GamaService.kt").read_text(encoding="utf-8")
          main = (src / "MainActivity.kt").read_text(encoding="utf-8")
          brain = (src / "LocalBrain.kt").read_text(encoding="utf-8")
          router = (src / "CommandRouter.kt").read_text(encoding="utf-8")
          registry = (src / "GamaAppRegistry.kt").read_text(encoding="utf-8")
          catalog = (src / "GamaInstalledAppCatalog.kt").read_text(encoding="utf-8")
          web = (src / "GamaInternetHub.kt").read_text(encoding="utf-8")
          manifest = (root / "app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")

          checks = {
              "voz Vosk": (root / "app/src/main/assets/model/final.mdl").is_file(),
              "conversa local": "class LocalBrain" in brain and "conversationHistory" in brain,
              "pesquisa direta": "GamaInternetHub" in brain and "html.duckduckgo.com" in web,
              "qualquer app": "GamaInstalledAppCatalog.resolve(context, raw)" in registry and "LauncherApps" in catalog,
              "reparo WhatsApp": "apesar" in router and "whatsapp" in router,
              "WhatsApp": "com.whatsapp" in manifest and "WhatsAppCommandParser" in service,
              "brilho": "SCREEN_BRIGHTNESS" in service and "ACTION_MANAGE_WRITE_SETTINGS" in service,
              "volume": "adjustStreamVolume" in service,
              "lanterna": "setTorchMode" in service,
              "camera": "INTENT_ACTION_STILL_IMAGE_CAMERA" in service,
              "wifi": "ACTION_WIFI" in service and "ACCESS_WIFI_STATE" in manifest,
              "bluetooth": "ACTION_BLUETOOTH_SETTINGS" in service and "BLUETOOTH_CONNECT" in manifest,
              "internet": "NET_CAPABILITY_VALIDATED" in service,
              "armazenamento": "StatFs" in service,
              "RAM": "MemoryInfo" in service,
              "timer": "ACTION_SET_TIMER" in all_source,
              "alarme": "ACTION_SET_ALARM" in all_source,
              "calendario": "GamaCalendarManager" in service,
              "notificacoes": "GamaNotificationListener" in all_source,
              "tela": "GamaScreenContextService" in service and "GamaVisionCore" in service,
              "rolagem": "performGlobal" in service,
              "tarefas sequenciais": "ZevronPlanner.plan(command)" in service,
              "automacao local": "GamaAutomationEngine" in all_source,
              "sem tela de modelo": "Núcleo autônomo local" in main,
          }
          missing = [name for name, ok in checks.items() if not ok]
          if missing:
              raise SystemExit("Capacidades ausentes: " + ", ".join(missing))

          kt_files = list(src.glob("*.kt"))
          kt_lines = sum(len(p.read_text(encoding="utf-8", errors="ignore").splitlines()) for p in kt_files)
          if len(kt_files) < 125 or kt_lines < 28500:
              raise SystemExit(f"Regressão de fonte: {len(kt_files)} arquivos Kotlin / {kt_lines} linhas")

          print(f"PASS Gama 12 FIX183: {len(kt_files)} Kotlin files, {kt_lines} Kotlin lines, versionCode={version_code}")
          for name in checks:
              print("PASS", name)
          PY_AUDIT

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean --stacktrace

      - name: Compile Release Kotlin
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:compileReleaseKotlin --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama12-compile.log"

      - name: Unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testReleaseUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama12-tests.log"

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:lintRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama12-lint.log"

      - name: Assemble Release
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama12-release.log"

      - name: Zipalign sign and verify APK
        env:
          GAMA_KEYSTORE_B64: ${{ secrets.GAMA_KEYSTORE_B64 }}
          GAMA_KEYSTORE_PASSWORD: ${{ secrets.GAMA_KEYSTORE_PASSWORD }}
          GAMA_KEY_ALIAS: ${{ secrets.GAMA_KEY_ALIAS }}
          GAMA_KEY_PASSWORD: ${{ secrets.GAMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          input_apk="$(find _gama_build/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | head -n 1 || true)"
          if [ -z "$input_apk" ] || [ ! -s "$input_apk" ]; then
            echo "::error::assembleRelease terminou sem APK."
            exit 1
          fi

          mkdir -p _gama_build/dist
          "$BT/zipalign" -f -p 4 "$input_apk" _gama_build/dist/Gama-aligned.apk

          if [ -n "${GAMA_KEYSTORE_B64:-}" ] && [ -n "${GAMA_KEYSTORE_PASSWORD:-}" ] && [ -n "${GAMA_KEY_ALIAS:-}" ] && [ -n "${GAMA_KEY_PASSWORD:-}" ]; then
            echo "$GAMA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gama-release.jks"
            KS="$RUNNER_TEMP/gama-release.jks"
            SP="$GAMA_KEYSTORE_PASSWORD"
            KA="$GAMA_KEY_ALIAS"
            KP="$GAMA_KEY_PASSWORD"
            echo "stable-update-capable" > _gama_build/dist/install-mode.txt
          else
            KS="$RUNNER_TEMP/gama-test.jks"
            SP="gama-test-pass"
            KA="gama-test"
            KP="gama-test-pass"
            keytool -genkeypair \
              -keystore "$KS" \
              -storepass "$SP" \
              -keypass "$KP" \
              -alias "$KA" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Gama Test,O=Gama,C=BR" \
              -noprompt
            echo "fresh-install-only" > _gama_build/dist/install-mode.txt
          fi

          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-pass "pass:$SP" \
            --ks-key-alias "$KA" \
            --key-pass "pass:$KP" \
            --out _gama_build/dist/Gama.apk \
            _gama_build/dist/Gama-aligned.apk

          "$BT/apksigner" verify --verbose --print-certs _gama_build/dist/Gama.apk | tee _gama_build/dist/signature-info.txt
          test -s _gama_build/dist/Gama.apk
          APK_SIZE="$(stat -c%s _gama_build/dist/Gama.apk)"
          if [ "$APK_SIZE" -lt 10000000 ]; then
            echo "::error::APK suspeitamente pequeno: $APK_SIZE bytes"
            exit 1
          fi
          unzip -l _gama_build/dist/Gama.apk | grep -Fq 'assets/model/final.mdl'
          unzip -l _gama_build/dist/Gama.apk | grep -Fq 'assets/model/Gr.fst'
          unzip -l _gama_build/dist/Gama.apk | grep -Fq 'classes.dex'
          "$BT/aapt" dump badging _gama_build/dist/Gama.apk > _gama_build/dist/apk-info.txt
          grep -Fq "name='com.gama.assistant'" _gama_build/dist/apk-info.txt
          grep -Fq "versionName='Gama 12.0 Autonomous Unified Core FIX183'" _gama_build/dist/apk-info.txt
          (cd _gama_build/dist && sha256sum Gama.apk > Gama.apk.sha256 && sha256sum -c Gama.apk.sha256)
          rm -f _gama_build/dist/Gama-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-12.0-AUTONOMOUS-UNIFIED-FIX183-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-12.0-AUTONOMOUS-UNIFIED-FIX183-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/app/build/**
            !_gama_build/dist/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-12.0-FIX183-diagnostics
          path: |
            gama12-compile.log
            gama12-tests.log
            gama12-lint.log
            gama12-release.log
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
