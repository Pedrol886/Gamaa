name: Build Zevron 1.0 FIX100 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write

concurrency:
  group: zevron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    env:
      # Run #90 / FIX99.
      FIX99_COMMIT: f0b431456536578a079380430e28e084fdd31819

      # Run #89 / FIX98.
      FIX98_COMMIT: bf1b2d549ce2973a607dc09ce57931857b3dfb90

      # Base estável confirmada no run #87.
      FIX93_COMMIT: 9921e17c918a2ea358ade085c05b06af85d0b7fb

      # Primeiro núcleo Zevron.
      FIX97_COMMIT: 1e349c21c1fd344f357f8c84cf656f9ba0565a45

      # Bases históricas.
      GAMA_67_COMMIT: 87d85998667f9e51e39860991398a2e31cd5f3c7
      GAMA_43_COMMIT: ae7f8993cad81d749ffdf04dfc84d828705b1a1a

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # CARREGA O FIX99 QUE JÁ COMPILOU NO RUN #90
      # ============================================================

      - name: Load FIX99 workflow
        run: |
          set -euo pipefail

          git cat-file -e "${FIX99_COMMIT}^{commit}"
          git cat-file -e "${FIX98_COMMIT}^{commit}"
          git cat-file -e "${FIX93_COMMIT}^{commit}"
          git cat-file -e "${FIX97_COMMIT}^{commit}"
          git cat-file -e "${GAMA_67_COMMIT}^{commit}"
          git cat-file -e "${GAMA_43_COMMIT}^{commit}"

          git show \
            "${FIX99_COMMIT}:.github/workflows/build-gama.yml" \
            > /tmp/fix99.yml

          test -s /tmp/fix99.yml

          grep -Fq \
            'Build Zevron 1.0 FIX99 APK' \
            /tmp/fix99.yml

          grep -Fq \
            'Repair Zevron Kotlin returns' \
            /tmp/fix99.yml

          echo \
            "FIX99 do run #90 carregado." \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # EXECUTA ETAPAS DE UM WORKFLOW ANTIGO
      # ============================================================

      - name: Create FIX100 step runner
        run: |
          set -euo pipefail

          cat > /tmp/run_step.py <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys

          if len(sys.argv) != 3:
              raise SystemExit(
                  "Uso: run_step.py WORKFLOW STEP_NAME"
              )

          workflow_path = Path(
              sys.argv[1]
          )

          step_name = sys.argv[2]

          if not workflow_path.is_file():
              raise SystemExit(
                  f"Workflow não encontrado: {workflow_path}"
              )

          workflow = workflow_path.read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              r"^      - name: "
              + re.escape(step_name)
              + r"\n(?P<body>.*?)(?=^      - name: |\Z)",
              re.MULTILINE | re.DOTALL,
          )

          match = pattern.search(
              workflow
          )

          if match is None:
              raise SystemExit(
                  f"Etapa não encontrada: {step_name}"
              )

          body = match.group(
              "body"
          )

          working_directory = None

          wd = re.search(
              r"^        working-directory:\s*(.+?)\s*$",
              body,
              re.MULTILINE,
          )

          if wd:
              working_directory = (
                  wd.group(1)
                  .strip()
              )

          lines = body.splitlines()

          start = None

          for index, line in enumerate(
              lines
          ):
              if line.strip() == "run: |":
                  start = index + 1
                  break

          if start is None:
              raise SystemExit(
                  f"run não encontrado: {step_name}"
              )

          script_lines = []

          for line in lines[start:]:

              if line.strip() == "":
                  script_lines.append("")
                  continue

              if not line.startswith(
                  "          "
              ):
                  break

              script_lines.append(
                  line[10:]
              )

          script = (
              "\n".join(
                  script_lines
              )
              + "\n"
          )

          if not script.strip():
              raise SystemExit(
                  f"Script vazio: {step_name}"
              )

          root = Path.cwd()

          cwd = root

          if working_directory:
              cwd = (
                  root /
                  working_directory
              )

          if not cwd.exists():
              raise SystemExit(
                  f"Diretório não existe para {step_name}: {cwd}"
              )

          print()
          print("=" * 72)
          print("Executando:", step_name)
          print("Diretório:", cwd)
          print("=" * 72)

          subprocess.run(
              [
                  "bash",
                  "-euo",
                  "pipefail",
                  "-c",
                  script,
              ],
              cwd=str(cwd),
              env=os.environ.copy(),
              check=True,
          )
          PY

          python3 -m py_compile \
            /tmp/run_step.py

      # ============================================================
      # CARREGA A INFRAESTRUTURA DO FIX98
      # ============================================================

      - name: Load FIX98 workflow
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_step.py \
            /tmp/fix99.yml \
            "Load FIX98 workflow"

          test -s /tmp/fix98.yml

      - name: Create previous-step runner
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_step.py \
            /tmp/fix99.yml \
            "Create previous-step runner"

          test -s \
            /tmp/run_previous_step.py

      # ============================================================
      # PREPARA FIX93 / FIX97 / RUN #67
      # ============================================================

      - name: Prepare stable workflow sources
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_step.py \
            /tmp/fix99.yml \
            "Prepare stable workflow sources"

          test -s \
            /tmp/gama-67-workflow.yml

          test -s \
            /tmp/fix93.yml

          test -s \
            /tmp/fix97.yml

      - name: Create stable workflow runner
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_step.py \
            /tmp/fix99.yml \
            "Create workflow step runner"

          test -s \
            /tmp/run_workflow_step.py

      # ============================================================
      # RESTAURA EXATAMENTE A BASE DO RUN #87
      # ============================================================

      - name: Restore exact stable Gama base
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_step.py \
            /tmp/fix99.yml \
            "Restore exact stable Gama base"

          test -s \
            _gama_build/app/build.gradle.kts

          test -s \
            _gama_build/app/src/main/AndroidManifest.xml

          test -s \
            _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt

          test -s \
            _gama_build/app/src/main/java/com/gama/assistant/ConversationSession.kt

          test -s \
            _gama_build/tools/download_models.sh

      # ============================================================
      # FIX90 + FIX91
      # ============================================================

      - name: Apply stable runtime and anti-noise
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_step.py \
            /tmp/fix99.yml \
            "Apply stable runtime and anti-noise"

      # ============================================================
      # FIX93
      # ============================================================

      - name: Apply stable FIX93
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_step.py \
            /tmp/fix99.yml \
            "Apply stable FIX93"

          grep -Fq \
            'GAMA92_TIME_AND_SCREEN_FAST_LANES' \
            _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt

          grep -Fq \
            'GamaScreenFastLane' \
            _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt

      # ============================================================
      # INSTALA O NÚCLEO ZEVRON
      # ============================================================

      - name: Install Zevron FIX97 core
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_step.py \
            /tmp/fix99.yml \
            "Install Zevron FIX97 core"

          PKG="_gama_build/app/src/main/java/com/gama/assistant"

          test -s \
            "$PKG/ZevronConversationEngine.kt"

          test -s \
            "$PKG/ZevronAppTool.kt"

          test -s \
            "$PKG/ZevronMathTool.kt"

          test -s \
            "$PKG/ZevronCalendarFlow.kt"

          test -s \
            "$PKG/ZevronLocalRouter.kt"

      # ============================================================
      # PRESERVA AS CORREÇÕES KOTLIN DO RUN #90
      # ============================================================

      - name: Repair Zevron Kotlin returns
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_step.py \
            /tmp/fix99.yml \
            "Repair Zevron Kotlin returns"

          APP="_gama_build/app/src/main/java/com/gama/assistant/ZevronAppTool.kt"

          grep -Fq \
            'return@mapNotNull null' \
            "$APP"

          grep -Fq \
            'return "Abrindo $label."' \
            "$APP"

      # ============================================================
      # FIX100
      #
      # ERRO 1 DO RUN #90:
      # "Zevron, quanto é 18 vezes 37?"
      #
      # A vírgula virava ponto antes de remover o hotword.
      # Agora removemos Zevron ANTES de canonicalizar a matemática.
      # ============================================================

      - name: FIX100 repair Zevron math wake word
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/gama/assistant/ZevronMathTool.kt"
          )

          if not path.is_file():
              raise SystemExit(
                  "ZevronMathTool.kt não encontrado."
              )

          text = path.read_text(
              encoding="utf-8"
          )

          old = '''                  var expression =
                      canonical(raw)

                  expression =
                      expression
                          .removePrefix(
                              "zevron "
                          )
          '''

          new = '''                  var expression =
                      canonical(
                          ZevronConversationEngine
                              .stripWakeWord(
                                  raw
                              )
                      )

                  expression =
                      expression
          '''

          if old not in text:
              raise SystemExit(
                  "Trecho original de ZevronMathTool.solve não encontrado."
              )

          text = text.replace(
              old,
              new,
              1
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          updated = path.read_text(
              encoding="utf-8"
          )

          required = '''
                          ZevronConversationEngine
                              .stripWakeWord(
                                  raw
                              )
          '''.strip()

          if required not in updated:
              raise SystemExit(
                  "A nova remoção do hotword não foi aplicada."
              )

          print(
              "ZevronMathTool agora remove hotword antes da matemática."
          )
          PY

      # ============================================================
      # FIX100
      #
      # ERRO 2 DO RUN #90:
      #
      # O app foi renomeado de Gama para Zevron no código principal,
      # mas quatro testes antigos ainda usavam comandos com "Gama".
      #
      # NÃO removemos os testes.
      # Migramos somente as STRING LITERALS dos testes antigos.
      # Os nomes técnicos/classes continuam Gama... para manter
      # compatibilidade do package e da arquitetura antiga.
      # ============================================================

      - name: FIX100 migrate legacy tests to Zevron identity
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(
              "app/src/test/java/com/gama/assistant"
          )

          targets = [
              root / "ConversationSessionTest.kt",
              root / "GamaCalendarCommandParserTest.kt",
              root / "GamaSuperAssistantCoreTest.kt",
              root / "GamaTimePolicyTest.kt",
          ]

          for path in targets:
              if not path.is_file():
                  raise SystemExit(
                      f"Teste obrigatório não encontrado: {path}"
                  )

          # Só altera strings Kotlin.
          # Não renomeia classes, objetos nem arquivos.
          string_pattern = re.compile(
              r'"""[\s\S]*?"""|"(?:\\.|[^"\\])*"'
          )

          total = 0

          for path in targets:

              source = path.read_text(
                  encoding="utf-8"
              )

              changed_here = 0

              def migrate(match):
                  nonlocal changed_here

                  literal = match.group(0)

                  updated = (
                      literal
                      .replace(
                          "Gama",
                          "Zevron"
                      )
                      .replace(
                          "gama",
                          "zevron"
                      )
                  )

                  if updated != literal:
                      changed_here += 1

                  return updated

              source = string_pattern.sub(
                  migrate,
                  source
              )

              path.write_text(
                  source,
                  encoding="utf-8"
              )

              total += changed_here

              print(
                  path.name,
                  "strings migradas:",
                  changed_here
              )

          if total == 0:
              raise SystemExit(
                  "Nenhuma string antiga de teste foi migrada."
              )

          print(
              "Total de strings de teste migradas:",
              total
          )
          PY

          # Os nomes técnicos antigos devem continuar existindo.
          test -s \
            app/src/test/java/com/gama/assistant/GamaCalendarCommandParserTest.kt

          test -s \
            app/src/test/java/com/gama/assistant/GamaSuperAssistantCoreTest.kt

          test -s \
            app/src/test/java/com/gama/assistant/GamaTimePolicyTest.kt

      # ============================================================
      # TESTES EXTRAS DO FIX100
      # ============================================================

      - name: Add FIX100 regression tests
        working-directory: _gama_build
        run: |
          set -euo pipefail

          TEST_DIR="app/src/test/java/com/gama/assistant"

          mkdir -p "$TEST_DIR"

          cat > "$TEST_DIR/ZevronFix100RegressionTest.kt" <<'KOTLIN'
          package com.gama.assistant

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class ZevronFix100RegressionTest {

              @Test
              fun multiplicationWithWakeWordAndCommaWorks() {

                  val result =
                      ZevronMathTool.solve(
                          "Zevron, quanto é 18 vezes 37?"
                      )

                  assertEquals(
                      "666",
                      result?.spoken
                  )
              }

              @Test
              fun multiplicationWithoutWakeWordWorks() {

                  val result =
                      ZevronMathTool.solve(
                          "quanto é 18 vezes 37?"
                      )

                  assertEquals(
                      "666",
                      result?.spoken
                  )
              }

              @Test
              fun acordadoIsNotWakeOnly() {

                  assertEquals(
                      ZevronConversationEngine.Control.NORMAL,
                      ZevronConversationEngine.control(
                          "Zevron, acordado?"
                      )
                  )
              }

              @Test
              fun zevronAloneIsWakeOnly() {

                  assertEquals(
                      ZevronConversationEngine.Control.WAKE_ONLY,
                      ZevronConversationEngine.control(
                          "Zevron"
                      )
                  )
              }

              @Test
              fun commandAfterWakeWordIsNormal() {

                  assertEquals(
                      ZevronConversationEngine.Control.NORMAL,
                      ZevronConversationEngine.control(
                          "Zevron, abra o WhatsApp"
                      )
                  )
              }
          }
          KOTLIN

      # ============================================================
      # CONFERE REGRAS DE CONVERSA
      # ============================================================

      - name: Verify Zevron conversation rules
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_step.py \
            /tmp/fix99.yml \
            "Verify natural Zevron conversation rules"

      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 \
            || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ============================================================
      # ASSINATURA
      # ============================================================

      - name: Resolve Zevron signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then

            echo \
              "mode=fresh" \
              >> "$GITHUB_OUTPUT"

            echo \
              "artifact=Zevron-1.0-FIX100-FRESH-INSTALL-ONLY" \
              >> "$GITHUB_OUTPUT"

            echo \
              "Stable signing: unavailable" \
              >> "$GITHUB_STEP_SUMMARY"

            echo \
              "::warning::GAMA_SIGNING_SEED não está configurado. O APK será apenas para instalação limpa."

          elif printf '%s' \
            "$GAMA_SIGNING_SEED" \
            | grep -Eq \
            '^[0-9A-Fa-f]{64}$'; then

            echo \
              "mode=stable" \
              >> "$GITHUB_OUTPUT"

            echo \
              "artifact=Zevron-1.0-FIX100-APK" \
              >> "$GITHUB_OUTPUT"

            echo \
              "Stable signing: enabled" \
              >> "$GITHUB_STEP_SUMMARY"

          else

            echo \
              "::error::GAMA_SIGNING_SEED precisa ter exatamente 64 caracteres hexadecimais."

            exit 1
          fi

      # ============================================================
      # VERSÃO
      # ============================================================

      - name: Set Zevron FIX100 version
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path(
              "app/build.gradle.kts"
          )

          source = path.read_text(
              encoding="utf-8"
          )

          version_code = (
              20600000
              + int(
                  os.environ[
                      "GITHUB_RUN_NUMBER"
                  ]
              )
          )

          source, code_count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {version_code}',
              source,
              count=1,
          )

          source, name_count = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "Zevron 1.0 FIX100"',
              source,
              count=1,
          )

          if code_count != 1:
              raise SystemExit(
                  "versionCode não encontrado."
              )

          if name_count != 1:
              raise SystemExit(
                  "versionName não encontrado."
              )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "versionCode:",
              version_code
          )
          PY

          echo \
            "ZEVRON_TAG=zevron-1.0-fix100-${GITHUB_RUN_NUMBER}" \
            >> "$GITHUB_ENV"

      # ============================================================
      # MODELOS OFFLINE
      # ============================================================

      - name: Download and verify offline voice models
        working-directory: _gama_build
        run: |
          set -euo pipefail

          test -s \
            tools/download_models.sh

          bash \
            tools/download_models.sh

      # ============================================================
      # COMPILA O APK
      # ============================================================

      - name: Compile Zevron APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/zevron-build.log"

      # ============================================================
      # RODA TODOS OS TESTES
      # ============================================================

      - name: Run all Zevron unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail

          gradle \
            :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/zevron-tests.log"

      # ============================================================
      # CONFERE QUE NÃO FOI APENAS "GREEN FAKE"
      # ============================================================

      - name: Verify all Zevron tests
        working-directory: _gama_build
        run: |
          set -euo pipefail

          RESULTS="app/build/test-results/testDebugUnitTest"

          test -d "$RESULTS"

          TEST_COUNT="$(
            grep -RhoE \
              'tests="[0-9]+"' \
              "$RESULTS" \
              | sed -E \
                's/[^0-9]//g' \
              | awk \
                '{sum += $1} END {print sum+0}'
          )"

          FAILURE_COUNT="$(
            grep -RhoE \
              'failures="[0-9]+"' \
              "$RESULTS" \
              | sed -E \
                's/[^0-9]//g' \
              | awk \
                '{sum += $1} END {print sum+0}'
          )"

          ERROR_COUNT="$(
            grep -RhoE \
              'errors="[0-9]+"' \
              "$RESULTS" \
              | sed -E \
                's/[^0-9]//g' \
              | awk \
                '{sum += $1} END {print sum+0}'
          )"

          echo \
            "Tests: $TEST_COUNT" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "Failures: $FAILURE_COUNT" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "Errors: $ERROR_COUNT" \
            >> "$GITHUB_STEP_SUMMARY"

          if [ "$TEST_COUNT" -lt 130 ]; then
            echo \
              "::error::Poucos testes foram executados: $TEST_COUNT"
            exit 1
          fi

          if [ "$FAILURE_COUNT" -ne 0 ]; then
            echo \
              "::error::$FAILURE_COUNT testes falharam."
            exit 1
          fi

          if [ "$ERROR_COUNT" -ne 0 ]; then
            echo \
              "::error::$ERROR_COUNT testes tiveram erro."
            exit 1
          fi

          grep -Rqs \
            'ZevronConversationEngineTest' \
            "$RESULTS"

          grep -Rqs \
            'ZevronAppToolTest' \
            "$RESULTS"

          grep -Rqs \
            'ZevronMathToolTest' \
            "$RESULTS"

          grep -Rqs \
            'ZevronCalendarFlowTest' \
            "$RESULTS"

          grep -Rqs \
            'ZevronFix100RegressionTest' \
            "$RESULTS"

          echo \
            "Todos os testes passaram." \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # DIAGNÓSTICO AUTOMÁTICO
      # ============================================================

      - name: Show FIX100 failure
        if: failure()
        run: |
          set +e

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          summary = Path(
              os.environ[
                  "GITHUB_STEP_SUMMARY"
              ]
          )

          with summary.open(
              "a",
              encoding="utf-8"
          ) as out:

              out.write(
                  "## Zevron FIX100 diagnóstico\n\n"
              )

              for name in (
                  "zevron-build.log",
                  "zevron-tests.log",
              ):

                  path = Path(name)

                  if not path.is_file():
                      continue

                  lines = path.read_text(
                      encoding="utf-8",
                      errors="replace"
                  ).splitlines()

                  matches = [
                      line
                      for line in lines
                      if re.search(
                          r'FAILED|FAILURE|error:|^e: |AssertionError|ComparisonFailure|expected|but was|Caused by:',
                          line,
                          re.I
                      )
                  ]

                  selected = (
                      matches[:200]
                      if matches
                      else lines[-200:]
                  )

                  out.write(
                      f"### {name}\n\n"
                  )

                  out.write(
                      "```text\n"
                  )

                  out.write(
                      "\n".join(
                          selected
                      )
                  )

                  out.write(
                      "\n```\n\n"
                  )
          PY

      - name: Upload FIX100 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zevron-1.0-FIX100-build-logs
          path: |
            zevron-build.log
            zevron-tests.log
          if-no-files-found: warn

      # ============================================================
      # ASSINA
      # ============================================================

      - name: Sign Zevron APK
        env:
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          # Reutiliza exatamente a assinatura do FIX93 estável.
          python3 \
            /tmp/run_workflow_step.py \
            /tmp/fix93.yml \
            "Sign and verify Gama.apk"

          test -s \
            _gama_build/dist/Gama.apk

          cp \
            _gama_build/dist/Gama.apk \
            _gama_build/dist/Zevron.apk

          (
            cd _gama_build/dist

            sha256sum \
              Zevron.apk \
              > Zevron.apk.sha256
          )

      # ============================================================
      # VERIFICA APK FINAL
      # ============================================================

      - name: Verify Zevron APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          test -s \
            dist/Zevron.apk

          test -s \
            dist/Zevron.apk.sha256

          (
            cd dist

            sha256sum -c \
              Zevron.apk.sha256
          )

          APK_BYTES="$(
            wc -c \
              < dist/Zevron.apk
          )"

          if [ "$APK_BYTES" -le 1000000 ]; then

            echo \
              "::error::APK pequeno demais: ${APK_BYTES} bytes"

            exit 1
          fi

          echo \
            "## Zevron 1.0 FIX100" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- APK: ${APK_BYTES} bytes" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- Package: com.gama.assistant" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- Nome: Zevron" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- Hotword: Zevron" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- Base: run #87 / FIX93" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
           
