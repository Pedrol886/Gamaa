            "$SRC/GamaScreenContextService.kt"
            "$SRC/GamaCalendarManager.kt"
            "$SRC/GamaMissionStore.kt"
            "$SRC/GamaPersonalCore.kt"
            "$SRC/VoicePolicy.kt"
          )

          for file in "${required[@]}"; do
            test -s "$file"
          done

          grep -Fq 'GamaNextRouter.handleAsync' "$SRC/GamaService.kt"
          grep -Fq 'unlock-hard-watchdog' "$SRC/GamaService.kt"
          grep -Fq 'GamaNotificationIntelligence.eventPriority' "$SRC/GamaNotificationListener.kt"
          grep -Fq 'dispatchGesture' "$SRC/GamaScreenContextService.kt"
          grep -Fq 'queryIntentActivities' "$SRC/GamaService.kt"
          grep -Fq 'getInstalledApplications' "$SRC/GamaService.kt"
          grep -Fq 'GamaMissionStore' "$SRC/GamaService.kt"
          grep -Fq 'GamaMemoryConsentPolicy.allowAdaptiveLearning' "$SRC/GamaSuperAssistantCore.kt"
          grep -Fq 'isDebuggable = false' app/build.gradle.kts
          grep -Fq 'versionName = "Gama 10.3.0 Personal Android Core"' app/build.gradle.kts

          echo "PASS: arquitetura consolidada encontrada."

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

