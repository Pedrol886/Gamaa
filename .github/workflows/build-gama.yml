          package com.gama.assistant
          
          import android.app.Notification
          import android.content.Context
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import org.json.JSONArray
          import org.json.JSONObject
          
          data class GamaMessage(
              val app: String,
              val sender: String,
              val text: String,
              val postedAt: Long
          )
          
          class GamaNotificationListener : NotificationListenerService() {
          
              companion object {
                  @Volatile
                  private var instance: GamaNotificationListener? = null
          
                  private const val PREFS = "gama_message_cache"
                  private const val KEY = "messages"
          
                  fun messages(context: Context): List<GamaMessage> {
                      val live = try {
                          instance?.collectMessages()
                      } catch (_: Exception) {
                          null
                      }
          
                      if (live != null) {
                          try {
                              instance?.saveCache(live)
                          } catch (_: Exception) {}
                          return live
                      }
          
                      return loadCache(context)
                  }
          
                  private fun loadCache(context: Context): List<GamaMessage> {
                      return try {
                          val raw = context
                              .getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                              .getString(KEY, "[]") ?: "[]"
          
                          val arr = JSONArray(raw)
                          buildList {
                              for (i in 0 until arr.length()) {
                                  val o = arr.getJSONObject(i)
                                  add(
                                      GamaMessage(
                                          app = o.optString("app"),
                                          sender = o.optString("sender"),
                                          text = o.optString("text"),
                                          postedAt = o.optLong("postedAt")
                                      )
                                  )
                              }
                          }.sortedByDescending { it.postedAt }
                      } catch (_: Exception) {
                          emptyList()
                      }
                  }
              }
          
              override fun onListenerConnected() {
                  super.onListenerConnected()
                  instance = this
                  refreshCache()
              }
          
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  super.onNotificationPosted(sbn)
                  if (sbn?.packageName != packageName) refreshCache()
              }
          
              override fun onNotificationRemoved(sbn: StatusBarNotification?) {
                  super.onNotificationRemoved(sbn)
                  if (sbn?.packageName != packageName) refreshCache()
              }
          
              override fun onDestroy() {
                  if (instance === this) instance = null
                  super.onDestroy()
              }
          
              private fun refreshCache() {
                  try {
                      saveCache(collectMessages())
                  } catch (_: Exception) {}
              }
          
              private fun saveCache(items: List<GamaMessage>) {
                  val arr = JSONArray()
          
                  for (item in items) {
                      arr.put(
                          JSONObject().apply {
                              put("app", item.app)
                              put("sender", item.sender)
                              put("text", item.text)
                              put("postedAt", item.postedAt)
                          }
                      )
                  }
          
                  getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit()
                      .putString(KEY, arr.toString())
                      .apply()
              }
          
              private fun collectMessages(): List<GamaMessage> {
                  val messagingPackages = setOf(
                      "com.whatsapp",
                      "com.whatsapp.w4b",
                      "com.instagram.android",
                      "org.telegram.messenger",
                      "com.facebook.orca",
                      "com.google.android.apps.messaging",
                      "com.samsung.android.messaging"
                  )
          
                  val notifications = try {
                      activeNotifications?.toList().orEmpty()
                  } catch (_: Exception) {
                      emptyList()
                  }
          
                  return notifications.mapNotNull { sbn ->
                      if (sbn.packageName == packageName) return@mapNotNull null
          
                      val notification = sbn.notification ?: return@mapNotNull null
                      val isMessage =
                          notification.category == Notification.CATEGORY_MESSAGE ||
                          sbn.packageName in messagingPackages
          
                      if (!isMessage) return@mapNotNull null
          
                      val extras = notification.extras
          
                      val title = extras
                          .getCharSequence(Notification.EXTRA_TITLE)
                          ?.toString()
                          ?.trim()
                          .orEmpty()
          
                      var body = extras
                          .getCharSequence(Notification.EXTRA_TEXT)
                          ?.toString()
                          ?.trim()
                          .orEmpty()
          
                      if (body.isBlank()) {
                          body = extras
                              .getCharSequence(Notification.EXTRA_BIG_TEXT)
                              ?.toString()
                              ?.trim()
                              .orEmpty()
                      }
          
                      if (title.isBlank() && body.isBlank()) return@mapNotNull null
          
                      val appName = try {
                          val info = packageManager.getApplicationInfo(sbn.packageName, 0)
                          packageManager.getApplicationLabel(info).toString()
                      } catch (_: Exception) {
                          sbn.packageName.substringAfterLast(".")
                      }
          
                      GamaMessage(
                          app = appName,
                          sender = title.ifBlank { "Mensagem" },
                          text = body.ifBlank { "Nova mensagem" },
                          postedAt = sbn.postTime
                      )
                  }
                      .distinctBy { "${it.app}|${it.sender}|${it.text}" }
                      .sortedByDescending { it.postedAt }
              }
          }
          GAMA_FILE_013_END
