name: Build Gama 9.2.1 Red Core Verified APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-9-2-1-red-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GAMA_BASE_RUN_ID: "37145664875"
      GAMA_BASE_ARTIFACT: "Gama-9.0.1-SUPERVISOR-source"
      GAMA_PATCH_XZ_SHA256: "840ccd6cc741db2b1220dd66e4cfa9c2395c26667113f46ec2583128b711c223"
      GAMA_PATCH_SHA256: "dd8a9a070b129bbc90484b347ede4c8033db99bef7d492d18df95865b7d0da1e"
      GAMA_LOGO_SHA256: "f3acdb73acd8e36fcd0a0221ae5c68c07c78c99d5d078d29efbe5529d59ef050"

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve signing mode
        id: signing_mode
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail
          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-9.2.1-RED-CORE-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"
            echo "::warning::GAMA_SIGNING_SEED não está configurado. O APK será apenas para instalação limpa."
          elif printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-9.2.1-RED-CORE-APK" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GAMA_SIGNING_SEED existe, mas não possui exatamente 64 caracteres hexadecimais."
            exit 1
          fi

      - name: Restore exact successful Gama 9.0.1 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build
          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaNotificationListener.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/MainActivity.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/MessageCommandRouter.kt
          grep -Fq 'versionName = "Gama 9.0.1 Supervisor"' _gama_build/app/build.gradle.kts
          grep -Fq 'GamaSupervisor.acceptWake' _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          echo "Verified base: successful build #131."

