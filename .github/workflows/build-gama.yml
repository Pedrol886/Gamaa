name: Build Gama APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover base Gama project from gama-5
        shell: bash
        run: |
          set -euo pipefail

          git show gama-5:.github/workflows/build-gama.yml > /tmp/gama5.yml

          python3 - <<'PY'
          from pathlib import Path
          import base64

          text = Path('/tmp/gama5.yml').read_text(encoding='utf-8')
          marker = "cat > /tmp/gama.tar.gz.b64 <<'EOF'"

          if marker not in text:
              raise SystemExit('Bloco do projeto não encontrado na tag gama-5.')

          after = text.split(marker, 1)[1]

          lines = []
          for line in after.splitlines():
              if line.strip() == "EOF":
                  break
              lines.append(line.strip())

          payload = ''.join(lines)

          try:
              data = base64.b64decode(payload, validate=True)
          except Exception as exc:
              raise SystemExit(f'Base64 do projeto inválido: {exc}')

          Path('/tmp/gama.tar.gz').write_bytes(data)
          PY

          rm -rf app
          tar -xzf /tmp/gama.tar.gz -C "$GITHUB_WORKSPACE"

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/gama/assistant/MainActivity.kt
      - name: Apply Gama wake and lock-screen update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/gama/assistant
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

          python3 - <<'PY_HUMANOID'
          from pathlib import Path
          import base64

          out = Path("app/src/main/res/drawable")
          out.mkdir(parents=True, exist_ok=True)

          (out / "gama_humanoid_1.webp").write_bytes(
              base64.b64decode("")
          )
          (out / "gama_humanoid_2.webp").write_bytes(
              base64.b64decode("")
          )
          (out / "gama_humanoid_3.webp").write_bytes(
              base64.b64decode("")
          )
          (out / "gama_humanoid_4.webp").write_bytes(
              base64.b64decode("")
          )
          PY_HUMANOID

          python3 - <<'PY_ANDROIDX'
          from pathlib import Path

          path = Path("gradle.properties")
          lines = []
          if path.exists():
              lines = path.read_text(encoding="utf-8").splitlines()

          props = {}
          for line in lines:
              if "=" in line and not line.lstrip().startswith("#"):
                  k, v = line.split("=", 1)
                  props[k.strip()] = v.strip()

          props["android.useAndroidX"] = "true"
          props["android.enableJetifier"] = "true"

          preserved = [
              line for line in lines
              if not line.startswith("android.useAndroidX=")
              and not line.startswith("android.enableJetifier=")
          ]

          preserved += [
              "android.useAndroidX=true",
              "android.enableJetifier=true",
          ]

          path.write_text("\n".join(preserved).rstrip() + "\n", encoding="utf-8")
          PY_ANDROIDX

          python3 - <<'PY_DEPS'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          data = path.read_text(encoding="utf-8")
          dep = 'implementation("com.google.mediapipe:tasks-genai:0.10.27")'

          if dep not in data:
              marker = 'implementation("net.java.dev.jna:jna:5.13.0@aar")'
              if marker not in data:
                  raise SystemExit("Dependência JNA base não encontrada no build.gradle.kts")
              data = data.replace(marker, marker + "\n    " + dep)

          path.write_text(data, encoding="utf-8")
          PY_DEPS

