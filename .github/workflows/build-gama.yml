      - name: Verify fail-soft architecture and privacy-safe diagnostics
        working-directory: _gama_build
        run: |
          set -euo pipefail
          SERVICE=app/src/main/java/com/gama/assistant/GamaService.kt
          APP=app/src/main/java/com/gama/assistant/AssistantRuntime.kt
          BRAIN=app/src/main/java/com/gama/assistant/GamaBrainProcessService.kt

          test -f app/src/main/java/com/gama/assistant/CrashRecorder.kt
          test -f app/src/main/java/com/gama/assistant/RuntimeRecoveryBus.kt
          test -f app/src/main/java/com/gama/assistant/BrainProcessSupervisor.kt
          test -f app/src/main/java/com/gama/assistant/LocalCommandIsolationPolicy.kt
          test -f app/src/main/java/com/gama/assistant/GamaVoiceCatalog.kt
          test -f app/src/main/java/com/gama/assistant/GamaVoiceSettingsActivity.kt
          test -f app/src/main/java/com/gama/assistant/GamaDiagnosticActivity.kt
          test -f app/src/test/java/com/gama/assistant/RuntimeStabilityRegressionTest.kt
          grep -Fq 'android:name=".GamaDiagnosticActivity"' app/src/main/AndroidManifest.xml
          grep -Fq 'GamaDiagnosticActivity::class.java' "$SERVICE"
          grep -Fq 'Copiar diagnóstico' app/src/main/java/com/gama/assistant/GamaDiagnosticActivity.kt

          grep -Fq 'CrashRecorder.install(this)' "$APP"
          test ! -f app/src/main/java/com/gama/assistant/GamaApplication.kt
          test "$(grep -RhsE '^class GamaApplication\b|^class GamaApplication[[:space:]]*:' app/src/main/java/com/gama/assistant/*.kt | wc -l)" -eq 1
          grep -Fq 'RuntimeRecoveryBus.isRecoverableWorker' app/src/main/java/com/gama/assistant/CrashRecorder.kt
          grep -Fq 'gamaLivenessBinder' "$BRAIN"
          grep -Fq 'linkToDeath' app/src/main/java/com/gama/assistant/BrainProcessSupervisor.kt
          grep -Fq 'handleBrainProcessDeath' "$SERVICE"
          grep -Fq 'recoverMicrophoneOnly' "$SERVICE"
          grep -Fq 'requestGeneration' "$SERVICE"
          grep -Fq 'activeBrainGeneration' "$SERVICE"
          grep -Fq 'MessageCommandRouter.isReadRequest' "$SERVICE"
          grep -Fq 'handleCalendarVoiceAction' "$SERVICE"
          grep -Fq 'handleAutomationVoiceCommand' "$SERVICE"
          grep -Fq 'GamaVoiceCatalog.applyPreferred' app/src/main/java/com/gama/assistant/GamaVoice.kt
          grep -Fq 'android:name=".GamaVoiceSettingsActivity"' app/src/main/AndroidManifest.xml
          grep -Fq 'repeat(384)' app/src/main/java/com/gama/assistant/GamaIntroActivity.kt

          if grep -Fq 'LocalBrain(this)' "$SERVICE"; then
            echo '::error::LocalBrain não pode ser criado no processo principal.'
            exit 1
          fi
          if grep -Eq '(android\.os\.)?Process\.killProcess[[:space:]]*\(' "$SERVICE" || \
             grep -Eq '(android\.os\.)?Process\.killProcess[[:space:]]*\(' "$APP"; then
            echo '::error::O processo principal não pode chamar Process.killProcess().'
            exit 1
          fi
          if grep -Fq 'stopSelf(' "$SERVICE"; then
            echo '::error::GamaService não pode deliberadamente encerrar a si próprio.'
            exit 1
          fi
          if grep -Fq 'Meu modelo local' "$SERVICE"; then
            echo '::error::Mensagem técnica do modelo ainda está exposta na conversa.'
            exit 1
          fi

          grep -Fq 'tenho alguma mensagem?' app/src/test/java/com/gama/assistant/RuntimeStabilityRegressionTest.kt
          grep -Fq 'tem mensagem pra mim?' app/src/test/java/com/gama/assistant/RuntimeStabilityRegressionTest.kt
          grep -Fq 'que horas são?' app/src/test/java/com/gama/assistant/RuntimeStabilityRegressionTest.kt
          grep -Fq 'como está minha bateria?' app/src/test/java/com/gama/assistant/RuntimeStabilityRegressionTest.kt
          grep -Fq 'leia minha agenda hoje' app/src/test/java/com/gama/assistant/RuntimeStabilityRegressionTest.kt
          grep -Fq 'abra o zap' app/src/test/java/com/gama/assistant/RuntimeStabilityRegressionTest.kt
          grep -Fq 'todo dia às 7 abra o Spotify' app/src/test/java/com/gama/assistant/RuntimeStabilityRegressionTest.kt
          grep -Fq 'pode descansar' app/src/test/java/com/gama/assistant/RuntimeStabilityRegressionTest.kt

          # Existing run #67 parser/safety tests are preserved, never replaced.
          test -f app/src/test/java/com/gama/assistant/CalendarCommandRouterTest.kt
          test -f app/src/test/java/com/gama/assistant/AutomationCommandRouterTest.kt
          test -f app/src/test/java/com/gama/assistant/AutomationDuePolicyTest.kt
          grep -Rqs 'WhatsAppCommandParser' app/src/test/java/com/gama/assistant || \
            echo '::notice::WhatsApp parser is covered by runtime isolation regression plus existing parser integration.'

          echo 'Fail-soft verification passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Crash recorder stores only process/thread/component/exception class/app stack frames.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Local/private commands are hard-gated before the isolated brain.' >> "$GITHUB_STEP_SUMMARY"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set increasing versionCode and release metadata
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import os, re
          path = Path('app/build.gradle.kts')
          source = path.read_text(encoding='utf-8')
          run = int(os.environ['GITHUB_RUN_NUMBER'])
          code = 20300000 + run
          source, count = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {code}', source, count=1)
          if count != 1:
              raise SystemExit('versionCode não encontrado.')
          if 'versionName = "Gama 6.0"' not in source:
              raise SystemExit('versionName Gama 6.0 não encontrado.')
          path.write_text(source, encoding='utf-8')
          print('versionCode:', code)
          PY_VERSION
          echo "GAMA_TAG=gama-6.0-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "GAMA_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Download and verify offline voice models
        working-directory: _gama_build
        run: bash tools/download_models.sh

      - name: Compile Gama APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"

      - name: Run all Gama unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Verify regression test report exists
        working-directory: _gama_build
        run: |
          set -euo pipefail
          test -d app/build/test-results/testDebugUnitTest
          grep -Rqs 'RuntimeStabilityRegressionTest' app/build/test-results/testDebugUnitTest
          if grep -RqsE 'failures="[1-9]|errors="[1-9]' app/build/test-results/testDebugUnitTest; then
            echo '::error::Há teste de regressão falhando.'
            exit 1
          fi

      - name: Show first failure in summary
        if: failure()
        run: |
          python3 - <<'PY_DIAG'
          from pathlib import Path
          import os, re
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as out:
              out.write('## Gama 6.0: diagnóstico de build\n\n')
              for name in ('gama-build.log', 'gama-tests.log'):
                  log = Path(name)
                  if not log.is_file():
                      continue
                  lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
                  problems = [line for line in lines if re.search(
                      r'(^e: |\berror:|^FAILURE:|^> Task .* FAILED|^\* What went wrong:|^Caused by:)', line)]
                  excerpt = problems[:100] if problems else lines[-100:]
                  out.write('### ' + name + '\n\n```text\n')
                  out.write('\n'.join(excerpt))
                  out.write('\n```\n\n')
          PY_DIAG

      - name: Upload build diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-6.0-FIX77-build-logs
          path: |
            gama-build.log
            gama-tests.log
          if-no-files-found: warn

      - name: Sign and verify Gama.apk
        id: package
        working-directory: _gama_build
        env:
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail
          mkdir -p dist
          input_apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -s "$input_apk"

          if [ "$GAMA_SIGNING_MODE" = "stable" ]; then
            mkdir -p .gama-signing
            chmod 700 .gama-signing
            printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'
            python3 - "$GAMA_SIGNING_SEED" .gama-signing/key.der <<'PY_KEY'
          import sys
          raw = bytes.fromhex(sys.argv[1])
          order = int('FFFFFFFF00000000FFFFFFFFFFFFFFFFBCE6FAADA7179E84F3B9CAC2FC632551', 16)
          d = (int.from_bytes(raw, 'big') % (order - 1)) + 1
          key = d.to_bytes(32, 'big')
          der = bytes.fromhex('30310201010420') + key + bytes.fromhex('A00A06082A8648CE3D030107')
          open(sys.argv[2], 'wb').write(der)
          PY_KEY
            openssl ec -inform DER -in .gama-signing/key.der -out .gama-signing/key.pem >/dev/null 2>&1
            printf '%s' '' | base64 --decode > .gama-signing/cert.pem
            keyhash="$(openssl pkey -in .gama-signing/key.pem -pubout -outform DER | sha256sum | cut -d' ' -f1)"
            certhash="$(openssl x509 -in .gama-signing/cert.pem -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
            test "$keyhash" = "$certhash"
            fingerprint="$(openssl x509 -in .gama-signing/cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            test "$fingerprint" = '6933EDA890C29567A8F4B6CEAD7A39A442DF109D43B813A19F3F6FA7F39B078C'
            openssl pkcs12 -export -inkey .gama-signing/key.pem -in .gama-signing/cert.pem -out .gama-signing/gama.p12 -name gama -passout pass:GamaStable2026
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$input_apk" dist/Gama-aligned.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks .gama-signing/gama.p12 --ks-type PKCS12 --ks-key-alias gama --ks-pass pass:GamaStable2026 --key-pass pass:GamaStable2026 --out dist/Gama.apk dist/Gama-aligned.apk
            rm -f dist/Gama-aligned.apk
            printf '%s\n' "$fingerprint" > dist/signing-cert-sha256.txt
            printf '%s\n' 'stable' > dist/install-mode.txt
            rm -rf .gama-signing
          else
            cp "$input_apk" dist/Gama.apk
            printf '%s\n' 'debug-runner-signature' > dist/signing-cert-sha256.txt
            printf '%s\n' 'FRESH INSTALL ONLY - configure GAMA_SIGNING_SEED for reliable future updates.' > dist/install-mode.txt
            echo "::warning::APK em modo instalação limpa. Pode ser necessário desinstalar a versão anterior."
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Gama.apk | tee dist/signature-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Gama.apk > dist/apk-info.txt
          grep -m1 '^package:' dist/apk-info.txt
          grep -q "name='com.gama.assistant'" dist/apk-info.txt
          grep -q "versionCode='2030" dist/apk-info.txt
          grep -q "versionName='Gama 6.0'" dist/apk-info.txt
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)

      - name: Verify final APK metadata and package size
        working-directory: _gama_build
        run: |
          set -euo pipefail
          test -s dist/Gama.apk
          test -s dist/Gama.apk.sha256
          test -s dist/apk-info.txt
          test -s dist/install-mode.txt
          test -s dist/signing-cert-sha256.txt
          grep -q "name='com.gama.assistant'" dist/apk-info.txt
          grep -q "versionCode='2030" dist/apk-info.txt
          grep -q "versionName='Gama 6.0'" dist/apk-info.txt
          (cd dist && sha256sum -c Gama.apk.sha256)
          apk_bytes="$(wc -c < dist/Gama.apk)"
          test "$apk_bytes" -gt 1000000
          echo "APK bytes: $apk_bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "Install mode: $(cat dist/install-mode.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "Brain process: isolated :gama_brain with Binder death supervision" >> "$GITHUB_STEP_SUMMARY"
          echo "Main process: no killProcess / no stopSelf in GamaService" >> "$GITHUB_STEP_SUMMARY"
          echo "Microphone: worker recovery + progressive backoff watchdog" >> "$GITHUB_STEP_SUMMARY"
          echo "Voice: exact installed voice selection can be persisted" >> "$GITHUB_STEP_SUMMARY"
          echo "Intro: native Canvas particle formation preserved and densified" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/install-mode.txt
            _gama_build/dist/signing-cert-sha256.txt
            _gama_build/dist/signature-info.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-6.0-FIX77-tests
          path: |
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn

      - name: Publish Gama release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/gama-release.md <<'NOTES'
          Gama 6.0 runtime stability build based exactly on successful GitHub Actions run #67 (commit 87d85998667f9e51e39860991398a2e31cd5f3c7).

          Stability changes:
          - keeps Gemma/MediaPipe isolated in :gama_brain;
          - watches the remote brain with a Binder liveness channel;
          - a brain-process death clears only the current AI request and keeps the voice session alive;
          - removes force-kill behavior from the main Gama process;
          - GamaService no longer deliberately stops itself when voice/background state changes;
          - adds a microphone worker watchdog with progressive restart backoff;
          - adds a tiny privacy-safe CrashRecorder for the existing "Gama, diagnóstico" flow;
          - "Gama, diagnóstico" now opens a private on-device screen with selectable crash text plus copy, clear and close controls instead of reading technical details aloud;
          - removes technical model/process failure messages from normal conversation;
          - adds a hard local-command gate before Gemma, including messages, notifications, time, battery, calendar, WhatsApp, apps and automations;
          - preserves generation/request guards so late AI replies cannot overwrite newer local commands;
          - adds persistent installed-voice selection and a native "Voz do Gama" picker with preview;
          - preserves the native particle introduction and slightly densifies the Canvas particle field;
          - preserves Gama 6.0, com.gama.assistant, increasing versionCode, existing automations and all run #67 tests.
          - reuses the original run #67 GamaApplication instead of declaring a duplicate, and binds the persisted voice gate to the real GamaVoice.apply parameters.

          - adds a local morning briefing from overnight messages, important news notifications and today's calendar;
          - saying "boa noite" or "vou dormir" starts a sleep window; "bom dia" delivers the briefing;
          - without an explicit sleep window, the briefing uses the previous 8 hours of locally captured notifications;
          - calendar commands now create real CalendarContract events after the normal Android calendar permission is granted;
          - a pending event is committed automatically after the user grants calendar permission;
          - the selected installed Portuguese TTS voice gets a lower, calmer delivery profile;
          - isolated brain IPC death gets bounded automatic retries that are cancelled when a newer command arrives;
          - briefing notification contents remain on-device and are never sent to Gemma.
          - fixes the Android ongoing-notification flag to Notification.FLAG_ONGOING_EVENT.

          Android security boundaries remain intact. No PIN, biometric, permission, lockscreen, Device Admin or Notification Listener bypass is added.
          NOTES
          if gh release view "$GAMA_TAG" > /dev/null 2>&1; then
            gh release upload "$GAMA_TAG" _gama_build/dist/Gama.apk _gama_build/dist/Gama.apk.sha256 _gama_build/dist/install-mode.txt --clobber
          else
            gh release create "$GAMA_TAG" _gama_build/dist/Gama.apk _gama_build/dist/Gama.apk.sha256 _gama_build/dist/install-mode.txt --target "$GAMA_COMMIT" --title "Gama 6.0 ($GAMA_TAG)" --notes-file /tmp/gama-release.md
          fi
