          from pathlib import Path
          import re

          for path in Path("app/src/main/java").rglob("*.kt"):
              data = path.read_text(encoding="utf-8")
              data = re.sub(
                  r'"([^"\\n]*?)Gama([^"\\n]*?)"',
                  lambda m: '"' + m.group(1) + 'Kavus' + m.group(2) + '"',
                  data,
              )
              path.write_text(data, encoding="utf-8")

          manifest = Path("app/src/main/AndroidManifest.xml")
          if manifest.exists():
              data = manifest.read_text(encoding="utf-8")
              data = re.sub(
                  r'(android:label=")([^"]*?)Gama([^"]*?)(")',
                  lambda m: m.group(1) + m.group(2) + 'Kavus' + m.group(3) + m.group(4),
                  data,
              )
              manifest.write_text(data, encoding="utf-8")

          for path in Path("app/src/main/res").glob("values*/strings*.xml"):
              data = path.read_text(encoding="utf-8")
              data = data.replace("Gama", "Kavus")
              path.write_text(data, encoding="utf-8")
          PY_KAVUS_BRAND

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Portuguese offline speech model
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip" \
            -o /tmp/vosk.zip
          rm -rf /tmp/vosk app/src/main/assets/model
          mkdir -p /tmp/vosk
          unzip -q /tmp/vosk.zip -d /tmp/vosk
          mv /tmp/vosk/vosk-model-small-pt-0.3 app/src/main/assets/model

      - name: Download offline speaker verification model
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            "https://alphacephei.com/vosk/models/vosk-model-spk-0.4.zip" \
            -o /tmp/vosk-spk.zip
          rm -rf /tmp/vosk-spk app/src/main/assets/spk-model
          mkdir -p /tmp/vosk-spk
          unzip -q /tmp/vosk-spk.zip -d /tmp/vosk-spk
          mv /tmp/vosk-spk/vosk-model-spk-0.4 app/src/main/assets/spk-model

      - name: Verify AndroidX config
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^android.useAndroidX=true$' gradle.properties
          grep -q '^android.enableJetifier=true$' gradle.properties

      - name: Build APK
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Kavus.apk
          ls -lh Kavus.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kavus-APK
          path: Kavus.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="kavus-${{ github.run_number }}"
          gh release create "$TAG" Kavus.apk \
            --title "Kavus $TAG" \
            --notes "Kavus v30: reconhecimento do dono mais tolerante a rouquidão, cansaço e variações temporárias da voz. O cadastro novo usa 7 amostras e comparação com múltiplos vetores. Quando a voz fica próxima do perfil mas não forte o bastante, Kavus pede uma segunda confirmação do comando e combina as duas amostras em vez de simplesmente liberar com um limiar baixo. A voz TTS foi mantida sem alterações. O filtro de voz continua protegendo apenas os comandos do Kavus e não substitui PIN, biometria ou a proteção do Android."
