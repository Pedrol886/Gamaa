              # GAMA 9.4.0 Continuous Core

              Source base:
              exact successful GAMA 9.3.0 source from GitHub Actions run #136.

              Root causes found during source audit:
              - fixed 1550 ms endpoint could cut human thinking pauses;
              - initial command window was only 2 seconds;
              - task context was split between several independent memory layers;
              - LLM, live-data and UI work used different stale-response tokens;
              - the local brain exposed failure/restart wording to the user;
              - the brain process had a 45-second total watchdog;
              - WhatsApp opening was split between two launcher implementations;
              - every launcher attempt could loop through several strategies at once,
                preventing the verifier from knowing which strategy actually worked;
              - WhatsApp aliases included unrelated words;
              - CI produced Debug instead of a user Release build.

              Major changes:
              - ActiveTaskContext;
              - GamaOrchestrator;
              - session/turn/generation identity;
              - semantic endpointing;
              - 12-second initial speech window;
              - 15-second follow-up start window;
              - explicit-session lifetime until sleep command;
              - self-speech barge-in guard;
              - context sanity gate;
              - silent bounded local-brain recovery;
              - warm local brain process;
              - single app-launch route pipeline;
              - Accessibility-based app verification;
              - release build with debuggable=false;
              - regression tests for reported failures.

              Streaming:
              the current local MediaPipe integration is synchronous.
              This build does not invent an unsupported token-stream API.
              Warm-engine and turn cancellation are implemented instead.
              '''
