name: Build Gama 12.1 LOCAL VOICE FIX186 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: gama-12-1-local-voice-fix186-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      GAMA_BASE_RUN_ID: "37534345902"
      GAMA_BASE_ARTIFACT: "Gama-12.0-AUTONOMOUS-UNIFIED-FIX183-source"
      GAMA_OVERLAY_SHA256: "78a7217396bf20f059c1003a79be971b0e099cd9880dc3040f788d8b70ab73a8"
