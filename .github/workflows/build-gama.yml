          # ========================================================
          # MANIFEST
          # ========================================================

          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path(
              "app/src/main/AndroidManifest.xml"
          )

          manifest = manifest_path.read_text(
              encoding="utf-8"
          )

          if "<queries>" not in manifest:

              queries = '''
              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

          '''

              pos = manifest.find(
                  "<application"
              )

              if pos < 0:
                  raise SystemExit(
                      "application não encontrado no Manifest."
                  )

              manifest = (
                  manifest[:pos]
                  + queries
                  + manifest[pos:]
              )

          else:

              if (
                  'android:name="com.whatsapp"'
                  not in manifest
              ):

                  manifest = manifest.replace(
                      "</queries>",
                      '''
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
              </queries>
          ''',
                      1
                  )

          manifest_path.write_text(
              manifest,
              encoding="utf-8"
          )
          PY

          # ========================================================
          # NOME DO APP
          # ========================================================

          python3 - <<'PY'
          from pathlib import Path
          import re

          values = Path(
              "app/src/main/res/values"
          )

          values.mkdir(
              parents=True,
              exist_ok=True
          )

          strings = (
              values /
              "strings.xml"
          )

          if strings.exists():

              text = strings.read_text(
                  encoding="utf-8"
              )

              if (
                  'name="app_name"'
                  in text
              ):

                  text = re.sub(
                      r'(<string\s+name="app_name"[^>]*>).*?(</string>)',
                      r'\1Zevron\2',
                      text,
                      count=1
                  )

              else:

                  text = text.replace(
                      "</resources>",
                      '    <string name="app_name">Zevron</string>\n</resources>'
                  )

              strings.write_text(
                  text,
                  encoding="utf-8"
              )

          else:

              strings.write_text(
                  '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zevron</string>
          </resources>
          ''',
                  encoding="utf-8"
              )
          PY

          # ========================================================
          # VERSÃO
          # ========================================================

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "app/build.gradle.kts"
          )

          source = path.read_text(
              encoding="utf-8"
          )

          source, count = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "Zevron 1.0"',
              source,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "versionName não encontrado."
              )

          path.write_text(
              source,
              encoding="utf-8"
          )
          PY

          # ========================================================
          # VERIFICAÇÕES ESTÁTICAS
          # ========================================================

          test -f "$PKG/ZevronConversationEngine.kt"
          test -f "$PKG/ZevronAppTool.kt"
          test -f "$PKG/ZevronMathTool.kt"
          test -f "$PKG/ZevronCalendarFlow.kt"
          test -f "$PKG/ZevronLocalRouter.kt"

          grep -Fq \
            'ZEVRON_FIX97_UNIFIED_ROUTER' \
            "$PKG/GamaService.kt"

          grep -Fq \
            'ZevronLocalRouter.handle' \
            "$PKG/GamaService.kt"

          grep -Fq \
            'com.whatsapp' \
            app/src/main/AndroidManifest.xml

          grep -Fq \
            'versionName = "Zevron 1.0"' \
            app/build.gradle.kts

          if grep -Rqs \
            'removePrefix("gama ")' \
            "$PKG"; then

            echo "::error::Prefixo antigo Gama ainda existe em código executável."
            exit 1
          fi

          echo \
            "Zevron FIX97 core installed." \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # JAVA / ANDROID / GRADLE
      # ============================================================

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android platform and build tools
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ============================================================
      # ASSINATURA
      # ============================================================

      - name: Resolve Zevron signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then

            echo \
              "mode=fresh" \
              >> "$GITHUB_OUTPUT"

            echo \
              "artifact=Zevron-1.0-FRESH-INSTALL-ONLY" \
              >> "$GITHUB_OUTPUT"

            echo \
              "::warning::GAMA_SIGNING_SEED não está configurado. O APK será apenas para instalação limpa."

          elif printf '%s' \
            "$GAMA_SIGNING_SEED" \
            | grep -Eq \
            '^[0-9A-Fa-f]{64}$'; then

            echo \
              "mode=stable" \
              >> "$GITHUB_OUTPUT"

            echo \
              "artifact=Zevron-1.0-APK" \
              >> "$GITHUB_OUTPUT"

          else

            echo \
              "::error::GAMA_SIGNING_SEED precisa ter exatamente 64 caracteres hexadecimais."

            exit 1
          fi

      # ============================================================
      # VERSION CODE
      # ============================================================

      - name: Set Zevron version metadata
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path(
              "app/build.gradle.kts"
          )

          source = path.read_text(
              encoding="utf-8"
          )

          code = (
              20400000 +
              int(
                  os.environ[
                      "GITHUB_RUN_NUMBER"
                  ]
              )
          )

          source, count = re.subn(
              r'versionCode\s*=\s*\d+',
              f'versionCode = {code}',
              source,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "versionCode não encontrado."
              )

          source, count = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "Zevron 1.0"',
              source,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "versionName não encontrado."
              )

          path.write_text(
              source,
              encoding="utf-8"
          )

          print(
              "versionCode:",
              code
          )
          PY

          echo \
            "ZEVRON_TAG=zevron-1.0-${GITHUB_RUN_NUMBER}" \
            >> "$GITHUB_ENV"

      # ============================================================
      # MODELOS OFFLINE
      # ============================================================

      - name: Download and verify offline voice models
        working-directory: _gama_build
        run: |
          set -euo pipefail
          bash tools/download_models.sh

      # ============================================================
      # COMPILA
      # ============================================================

      - name: Compile Zevron APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/zevron-build.log"

      # ============================================================
      # TESTES
      # ============================================================

      - name: Run Zevron tests
        working-directory: _gama_build
        run: |
          set -euo pipefail

          gradle \
            :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/zevron-tests.log"

      - name: Verify Zevron tests
        working-directory: _gama_build
        run: |
          set -euo pipefail

          test -d \
            app/build/test-results/testDebugUnitTest

          grep -Rqs \
            'ZevronConversationEngineTest' \
            app/build/test-results/testDebugUnitTest

          grep -Rqs \
            'ZevronAppToolTest' \
            app/build/test-results/testDebugUnitTest

          grep -Rqs \
            'ZevronMathToolTest' \
            app/build/test-results/testDebugUnitTest

          grep -Rqs \
            'ZevronCalendarFlowTest' \
            app/build/test-results/testDebugUnitTest

          if grep -RqsE \
            'failures="[1-9]|errors="[1-9]' \
            app/build/test-results/testDebugUnitTest; then

            echo \
              "::error::Há teste do Zevron falhando."

            exit 1
          fi

      # ============================================================
      # DIAGNÓSTICO
      # ============================================================

      - name: Show first failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          summary = Path(
              os.environ[
                  "GITHUB_STEP_SUMMARY"
              ]
          )

          with summary.open(
              "a",
              encoding="utf-8"
          ) as out:

              out.write(
                  "## Zevron FIX97 diagnóstico\n\n"
              )

              for name in (
                  "zevron-build.log",
                  "zevron-tests.log"
              ):

                  path = Path(name)

                  if not path.is_file():
                      continue

                  lines = path.read_text(
                      encoding="utf-8",
                      errors="replace"
                  ).splitlines()

                  problems = [
                      line
                      for line in lines
                      if re.search(
                          r'(^e: |\berror:|^FAILURE:|^> Task .* FAILED|^\* What went wrong:|^Caused by:)',
                          line
                      )
                  ]

                  excerpt = (
                      problems[:120]
                      if problems
                      else lines[-120:]
                  )

                  out.write(
                      f"### {name}\n\n"
                  )

                  out.write(
                      "```text\n"
                  )

                  out.write(
                      "\n".join(
                          excerpt
                      )
                  )

                  out.write(
                      "\n```\n\n"
                  )
          PY

      - name: Upload Zevron diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zevron-1.0-FIX97-build-logs
          path: |
            zevron-build.log
            zevron-tests.log
          if-no-files-found: warn

      # ============================================================
      # ASSINA USANDO O SCRIPT ESTÁVEL DO FIX93
      # ============================================================

      - name: Sign Zevron APK
        working-directory: _gama_build
        env:
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          workflow = Path(
              "/tmp/fix93.yml"
          ).read_text(
              encoding="utf-8"
          )

          name = (
              "Sign and verify Gama.apk"
          )

          pattern = re.compile(
              r"^      - name: "
              + re.escape(name)
              + r"\n(?P<body>.*?)(?=^      - name: |\Z)",
              re.MULTILINE |
              re.DOTALL
          )

          match = pattern.search(
              workflow
          )

          if not match:
              raise SystemExit(
                  "Etapa de assinatura do FIX93 não encontrada."
              )

          body = match.group(
              "body"
          )

          lines = body.splitlines()

          start = None

          for index, line in enumerate(
              lines
          ):
              if line.strip() == "run: |":
                  start = index + 1
                  break

          if start is None:
              raise SystemExit(
                  "Script de assinatura não encontrado."
              )

          script_lines = []

          for line in lines[start:]:

              if line.strip() == "":
                  script_lines.append("")
                  continue

              if not line.startswith(
                  "          "
              ):
                  break

              script_lines.append(
                  line[10:]
              )

          script = (
              "\n".join(
                  script_lines
              )
              + "\n"
          )

          subprocess.run(
              [
                  "bash",
                  "-euo",
                  "pipefail",
                  "-c",
                  script
              ],
              cwd=Path.cwd(),
              env=os.environ.copy(),
              check=True
          )
          PY

          test -s dist/Gama.apk

          cp \
            dist/Gama.apk \
            dist/Zevron.apk

          sha256sum \
            dist/Zevron.apk \
            > dist/Zevron.apk.sha256

      # ============================================================
      # VERIFICA APK
      # ============================================================

      - name: Verify Zevron APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          test -s dist/Zevron.apk
          test -s dist/Zevron.apk.sha256

          (
            cd dist
            sha256sum -c \
              Zevron.apk.sha256
          )

          APK_BYTES="$(
            wc -c \
            < dist/Zevron.apk
          )"

          test \
            "$APK_BYTES" \
            -gt 1000000

          echo \
            "Zevron APK bytes: $APK_BYTES" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "Package preservado: com.gama.assistant" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "Nome visível: Zevron" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "Hotword: Zevron" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "Conversation engine: continuous session" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "Local tools: apps, WhatsApp, calendar and math" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "FIX93 anti-noise, screen, face gate, messages, Internet and isolated brain preserved" \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # APK
      # ============================================================

      - name: Upload Zevron APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Zevron.apk
            _gama_build/dist/Zevron.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/install-mode.txt
            _gama_build/dist/signing-cert-sha256.txt
            _gama_build/dist/signature-info.txt

      - name: Upload Zevron test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zevron-1.0-FIX97-tests
          path: |
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn

      # ============================================================
      # EXPORTA O CÓDIGO ANDROID REAL
      # ============================================================

      - name: Upload Zevron source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zevron-1.0-source
          path: |
            _gama_build/app/src
            _gama_build/app/build.gradle.kts
            _gama_build/settings.gradle.kts
            _gama_build/build.gradle.kts
            _gama_build/gradle.properties
            _gama_build/tools
          if-no-files-found: warn

      # ============================================================
      # RELEASE
      # ============================================================

      - name: Publish Zevron release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${ZEVRON_TAG}"

          gh release delete \
            "$TAG" \
            --yes \
            >/dev/null 2>&1 \
            || true

          gh release create \
            "$TAG" \
            "_gama_build/dist/Zevron.apk#Zevron.apk" \
            "_gama_build/dist/Zevron.apk.sha256#Zevron.apk.sha256" \
            --title \
            "Zevron 1.0 FIX97" \
            --notes \
            "Zevron 1.0 FIX97

          - Novo nome e hotword Zevron
          - Package com.gama.assistant preservado para atualização
          - Conversa contínua
          - Zevron + comando responde direto
          - Zevron sozinho apenas ativa
          - Pode descansar encerra a sessão
          - Gama, acordado deixou de ser qualquer regra especial
          - Abertura local de aplicativos
          - WhatsApp e aliases locais
          - Calendário multi-turno
          - Matemática local
          - Contexto matemático
          - Memória curta de sessão
          - FIX93 anti-ruído preservado
          - Screen routing preservado
          - Face gate e biometria Android preservados
          - Mensagens e briefings preservados
          - Internet e cérebro isolado preservados
          - Código-fonte reconstruído também é exportado como artifact"

# ZEVRON_FIX97_COMPLETE_END
