      - name: Sign Release APK
        working-directory: _gama_build
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail

          mkdir -p dist

          input_apk="$(
            find \
              app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              | head -n 1
          )"

          if [ -z "$input_apk" ] || [ ! -s "$input_apk" ]; then
            echo "::error::APK Release não encontrado."
            exit 1
          fi

          aligned="dist/Gama-aligned.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f \
            4 \
            "$input_apk" \
            "$aligned"

          if [ "$GAMA_SIGNING_MODE" = "stable" ]; then
            mkdir -p .gama-signing
            chmod 700 .gama-signing

            printf '%s' "$GAMA_SIGNING_SEED" \
              | grep -Eq '^[0-9A-Fa-f]{64}$'

            python3 - \
              "$GAMA_SIGNING_SEED" \
              .gama-signing/key.der <<'PY'
          import sys

          raw = bytes.fromhex(sys.argv[1])

          order = int(
              "FFFFFFFF00000000"
              "FFFFFFFFFFFFFFFF"
              "BCE6FAADA7179E84"
              "F3B9CAC2FC632551",
              16,
          )

          d = (
              int.from_bytes(
                  raw,
                  "big",
              )
              % (
                  order - 1
              )
          ) + 1

          key = d.to_bytes(
              32,
              "big",
          )

          der = (
              bytes.fromhex(
                  "30310201010420"
              )
              + key
              + bytes.fromhex(
                  "A00A06082A8648CE3D030107"
              )
          )

          with open(
              sys.argv[2],
              "wb",
          ) as handle:
              handle.write(
                  der
              )
          PY

            openssl ec \
              -inform DER \
              -in .gama-signing/key.der \
              -out .gama-signing/key.pem \
              >/dev/null 2>&1

            printf '%s' \
              '' \
              | base64 --decode \
              > .gama-signing/cert.pem

            keyhash="$(
              openssl pkey \
                -in .gama-signing/key.pem \
                -pubout \
                -outform DER \
                | sha256sum \
                | cut -d' ' -f1
            )"

            certhash="$(
              openssl x509 \
                -in .gama-signing/cert.pem \
                -pubkey \
                -noout \
                | openssl pkey \
                    -pubin \
                    -outform DER \
                | sha256sum \
                | cut -d' ' -f1
            )"

            if [ "$keyhash" != "$certhash" ]; then
              echo "::error::GAMA_SIGNING_SEED não corresponde ao certificado estável."
              exit 1
            fi

            openssl pkcs12 \
              -export \
              -inkey .gama-signing/key.pem \
              -in .gama-signing/cert.pem \
              -out .gama-signing/gama.p12 \
              -name gama \
              -passout pass:GamaStable2026

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              sign \
              --ks .gama-signing/gama.p12 \
              --ks-type PKCS12 \
              --ks-key-alias gama \
              --ks-pass pass:GamaStable2026 \
              --key-pass pass:GamaStable2026 \
              --out dist/Gama.apk \
              "$aligned"

            echo "stable-update-capable" \
              > dist/install-mode.txt

            rm -rf .gama-signing
          else
            rm -f /tmp/gama-fresh.jks

            keytool \
              -genkeypair \
              -keystore /tmp/gama-fresh.jks \
              -storepass GamaFresh2026 \
              -keypass GamaFresh2026 \
              -alias gama \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Gama Fresh Test,O=Gama,C=BR"

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              sign \
              --ks /tmp/gama-fresh.jks \
              --ks-key-alias gama \
              --ks-pass pass:GamaFresh2026 \
              --key-pass pass:GamaFresh2026 \
              --out dist/Gama.apk \
              "$aligned"

            echo "fresh-install-only" \
              > dist/install-mode.txt
          fi

          rm -f "$aligned"

      - name: Verify final Release APK
        working-directory: _gama_build
        env:
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail

          test -s dist/Gama.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            dist/Gama.apk \
            | tee dist/signature-info.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            dist/Gama.apk \
            > dist/apk-info.txt

          grep -q \
            "name='com.gama.assistant'" \
            dist/apk-info.txt

          grep -q \
            "versionName='Gama 10.3.1 Personal Android Core'" \
            dist/apk-info.txt

          EXPECTED_VERSION_CODE="$((25310000 + GITHUB_RUN_NUMBER))"

          grep -q \
            "versionCode='$EXPECTED_VERSION_CODE'" \
            dist/apk-info.txt

          if grep -q \
            'application-debuggable' \
            dist/apk-info.txt
          then
            echo "::error::APK Release ainda está debuggable."
            exit 1
          fi

          if [ "$GAMA_SIGNING_MODE" = "stable" ]; then
            actual_cert="$(
              awk -F': ' \
                '/certificate SHA-256 digest/ { print $2; exit }' \
                dist/signature-info.txt \
                | tr -d ':' \
                | tr '[:lower:]' '[:upper:]'
            )"

            if [ "$actual_cert" != "$GAMA_EXPECTED_CERT_SHA256" ]; then
              echo "::error::Certificado final diferente da assinatura estável."
              echo "expected=$GAMA_EXPECTED_CERT_SHA256"
              echo "actual=$actual_cert"
              exit 1
            fi
          fi

          (
            cd dist

            sha256sum \
              Gama.apk \
              > Gama.apk.sha256

            sha256sum \
              -c \
              Gama.apk.sha256
          )

          echo "PASS: Gama.apk realmente existe e foi verificado."

      - name: Generate engineering report
        working-directory: _gama_build
        run: |
          set -euo pipefail

          mkdir -p reports

          cat > reports/GAMA-10.3.1-PERSONAL-ANDROID-CORE.md <<'REPORT'
          # GAMA 10.3.1 Personal Android Core

          Base:
          source exato e verde do GAMA 10 / run #156.

          Método de build:
          mesmo padrão que tornou #155 e #156 estáveis:
          base congelada, upgrade pequeno, auditoria, Gradle, testes, lint,
          assembleRelease, assinatura e verificação do APK.

          Não é usado source do #159 ou #160.

          Preservado da base:
          - conversa contínua;
          - ActiveTaskContext;
          - Personal Intelligence Core;
          - memória;
          - app index via PackageManager;
          - aliases de apps;
          - WhatsApp/zap;
          - fluxo de WhatsApp em vários turnos;
          - RemoteInput;
          - calendário;
          - pesquisa atual;
          - Face Gate;
          - barge-in e self-speech guard;
          - AccessibilityService;
          - NotificationListener;
          - prioridade de notificações já existente;
          - cérebro local;
          - recuperação de falhas.

          Upgrade 10.3.1:
          - Como estamos;
          - timer natural usando Android AlarmClock;
          - sites, inclusive GitHub no Chrome;
          - painel de notificações;
          - Quick Settings;
          - Home;
          - Back;
          - Recents;
          - rolagem;
          - clique por texto/contentDescription através da camada já existente;
          - períodos silenciosos;
          - resumo das mensagens recebidas;
          - continuidade reforçada depois de bloquear/desbloquear;
          - watchdog de voz em 1,8 e 6 segundos.

          CI verde ainda não substitui teste físico.
          REPORT

      - name: Final architecture audit
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"

          test -s dist/Gama.apk
          test -s reports/GAMA-10.3.1-PERSONAL-ANDROID-CORE.md

          grep -Fq \
            'GamaPersonalTools' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'ActiveTaskContext' \
            "$SRC/ConversationSession.kt"

          grep -Fq \
            'GamaSelfSpeechGuard' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaReliableAppLauncher' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'GamaPersonalAICore' \
            "$SRC/GamaNotificationListener.kt"

          grep -Fq \
            'unlock-hard-watchdog' \
            "$SRC/GamaService.kt"

          grep -Fq \
            'AlarmClock.ACTION_SET_TIMER' \
            "$SRC/GamaPersonalTools.kt"

          grep -Fq \
            'isDebuggable = false' \
            app/build.gradle.kts

          echo "PASS: arquitetura final auditada."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.3.1-PERSONAL-ANDROID-CORE-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Upload engineering reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.3.1-engineering-reports
          path: |
            _gama_build/reports/**
            gama-stable-upgrade.py
            gama-compile.log
            gama-tests.log
            gama-lint.log
            gama-release.log
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: warn

      - name: Publish Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test -s _gama_build/dist/Gama.apk

          TAG="gama-v10.3.1-personal-android-core-${{ github.run_number }}"

          gh release create \
            "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            "_gama_build/dist/install-mode.txt#install-mode.txt" \
            "_gama_build/reports/GAMA-10.3.1-PERSONAL-ANDROID-CORE.md#GAMA-10.3.1-PERSONAL-ANDROID-CORE.md" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 10.3.1 Personal Android Core" \
            --notes "Upgrade estável construído diretamente sobre o source verde do #156, usando o mesmo padrão de engenharia que estabilizou #155/#156. Sem reaproveitar os sources quebrados de #159/#160." \
            --latest
