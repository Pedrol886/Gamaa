          cat > "$SRC/ContextSanityCheck.kt" <<'KOTLIN'
          package com.gama.assistant

          import java.text.Normalizer
          import java.util.Locale

          object ContextSanityCheck {
              private val stopWords =
                  setOf(
                      "a",
                      "o",
                      "as",
                      "os",
                      "um",
                      "uma",
                      "de",
                      "da",
                      "do",
                      "das",
                      "dos",
                      "e",
                      "ou",
                      "que",
                      "para",
                      "pra",
                      "por",
                      "com",
                      "sem",
                      "em",
                      "no",
                      "na",
                      "nos",
                      "nas",
                      "eu",
                      "voce",
                      "me",
                      "meu",
                      "minha",
                      "isso",
                      "aquilo",
                      "ele",
                      "ela",
                      "qual",
                      "como",
                      "porque",
                  )

              fun transcriptUsable(
                  raw: String,
                  confidence: Double,
              ): Boolean {
                  val n =
                      normalize(raw)

                  if (
                      n.length < 2
                  ) {
                      return false
                  }

                  val words =
                      n
                          .split(' ')
                          .filter {
                              it.isNotBlank()
                          }

                  if (
                      words.isEmpty()
                  ) {
                      return false
                  }

                  if (
                      confidence.isFinite() &&
                      confidence >=
                      0.0 &&
                      confidence <
                      0.20 &&
                      words.size >=
                      2
                  ) {
                      return false
                  }

                  val consonantGarbage =
                      words.count {
                          word ->
                          word.length >=
                              6 &&
                              word.none {
                                  it in
                                      "aeiou"
                              }
                      }

                  if (
                      words.size >=
                      3 &&
                      consonantGarbage >=
                      words.size -
                          1
                  ) {
                      return false
                  }

                  return true
              }

              fun answerRelated(
                  question: String,
                  context: String?,
                  answer: String,
              ): Boolean {
                  val a =
                      normalize(answer)

                  if (
                      a.isBlank()
                  ) {
                      return false
                  }

                  val internalTerms =
                      listOf(
                          "llminference",
                          "mediapipe",
                          "brain ipc",
                          "isolated process",
                          "processo isolado",
                          "stack trace",
                          "native crash",
                          "jni",
                          "engine indisponivel",
                          "modelo reiniciou",
                          "reiniciei o modelo",
                      )

                  if (
                      internalTerms.any {
                          it in a
                      }
                  ) {
                      return false
                  }

                  /*
                   * Stale answers são bloqueadas primariamente por
                   * sessionId/turnId/generationId/requestId.
                   *
                   * Este sanity check é deliberadamente leniente:
                   * uma resposta correta não precisa repetir palavras
                   * da pergunta.
                   *
                   * Só rejeitamos mudança longa de assunto quando a
                   * pergunta/contexto têm conteúdo específico e não
                   * existe nenhuma ponte lexical.
                   */
                  val sourceTokens =
                      contentTokens(
                          normalize(
                              question +
                                  " " +
                                  context.orEmpty()
                          )
                      )

                  val answerTokens =
                      contentTokens(a)

                  if (
                      answerTokens.size >=
                      7 &&
                      sourceTokens.size >=
                      2 &&
                      sourceTokens
                          .intersect(
                              answerTokens
                          )
                          .isEmpty()
                  ) {
                      return false
                  }

                  return true
              }

              private fun contentTokens(
                  raw: String
              ): Set<String> =
                  raw
                      .split(' ')
                      .asSequence()
                      .map {
                          it.trim()
                      }
                      .filter {
                          it.length >=
                              3 &&
                              it !in
                              stopWords
                      }
                      .toSet()

              private fun normalize(
                  value: String
              ): String =
                  Normalizer.normalize(
                      value.lowercase(
                          Locale.ROOT
                      ),
                      Normalizer.Form.NFD,
                  )
                      .replace(
                          Regex("\\p{M}+"),
                          ""
                      )
                      .replace(
                          Regex("[^a-z0-9 ]+"),
                          " "
                      )
                      .replace(
                          Regex("\\s+"),
                          " "
                      )
                      .trim()
          }
