name: Build Zevron 1.0 FIX99 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write

concurrency:
  group: zevron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    env:
      # Workflow completo usado no run #89.
      FIX98_COMMIT: bf1b2d549ce2973a607dc09ce57931857b3dfb90

      # Base estável confirmada no run #87.
      FIX93_COMMIT: 9921e17c918a2ea358ade085c05b06af85d0b7fb

      # Núcleo Zevron original do run #88.
      FIX97_COMMIT: 1e349c21c1fd344f357f8c84cf656f9ba0565a45

      GAMA_67_COMMIT: 87d85998667f9e51e39860991398a2e31cd5f3c7
      GAMA_43_COMMIT: ae7f8993cad81d749ffdf04dfc84d828705b1a1a

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # CARREGA O WORKFLOW DO RUN #89
      # ============================================================

      - name: Load FIX98 workflow
        run: |
          set -euo pipefail

          git cat-file -e "${FIX98_COMMIT}^{commit}"

          git show \
            "${FIX98_COMMIT}:.github/workflows/build-gama.yml" \
            > /tmp/fix98.yml

          test -s /tmp/fix98.yml

          grep -Fq \
            'Build Zevron 1.0 FIX98 APK' \
            /tmp/fix98.yml

          echo \
            "Workflow do run #89 carregado." \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # EXECUTOR DE ETAPAS DO WORKFLOW ANTERIOR
      # ============================================================

      - name: Create previous-step runner
        run: |
          set -euo pipefail

          cat > /tmp/run_previous_step.py <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import sys

          if len(sys.argv) != 3:
              raise SystemExit(
                  "Uso: run_previous_step.py WORKFLOW STEP"
              )

          workflow_path = Path(
              sys.argv[1]
          )

          step_name = sys.argv[2]

          if not workflow_path.is_file():
              raise SystemExit(
                  f"Workflow ausente: {workflow_path}"
              )

          workflow = workflow_path.read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              r"^      - name: "
              + re.escape(step_name)
              + r"\n(?P<body>.*?)(?=^      - name: |\Z)",
              re.MULTILINE |
              re.DOTALL,
          )

          match = pattern.search(
              workflow
          )

          if match is None:
              raise SystemExit(
                  f"Etapa não encontrada: {step_name}"
              )

          body = match.group(
              "body"
          )

          working_directory = None

          wd = re.search(
              r"^        working-directory:\s*(.+?)\s*$",
              body,
              re.MULTILINE,
          )

          if wd:
              working_directory = (
                  wd.group(1)
                  .strip()
              )

          lines = body.splitlines()

          start = None

          for i, line in enumerate(lines):
              if line.strip() == "run: |":
                  start = i + 1
                  break

          if start is None:
              raise SystemExit(
                  f"run não encontrado: {step_name}"
              )

          script_lines = []

          for line in lines[start:]:

              if line.strip() == "":
                  script_lines.append("")
                  continue

              if not line.startswith(
                  "          "
              ):
                  break

              script_lines.append(
                  line[10:]
              )

          script = (
              "\n".join(
                  script_lines
              )
              + "\n"
          )

          if not script.strip():
              raise SystemExit(
                  f"Script vazio: {step_name}"
              )

          root = Path.cwd()

          cwd = root

          if working_directory:
              cwd = (
                  root /
                  working_directory
              )

          if not cwd.exists():
              raise SystemExit(
                  f"Diretório não existe: {cwd}"
              )

          print()
          print("=" * 72)
          print("Executando:", step_name)
          print("Diretório:", cwd)
          print("=" * 72)

          subprocess.run(
              [
                  "bash",
                  "-euo",
                  "pipefail",
                  "-c",
                  script,
              ],
              cwd=str(cwd),
              env=os.environ.copy(),
              check=True,
          )
          PY

          python3 -m py_compile \
            /tmp/run_previous_step.py

      # ============================================================
      # PREPARA FONTES HISTÓRICAS
      # ============================================================

      - name: Prepare stable workflow sources
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_previous_step.py \
            /tmp/fix98.yml \
            "Prepare stable workflow sources"

          test -s \
            /tmp/gama-67-workflow.yml

          test -s \
            /tmp/fix93.yml

          test -s \
            /tmp/fix97.yml

      # ============================================================
      # CRIA O RUNNER INTERNO QUE O FIX98 UTILIZA
      # ============================================================

      - name: Create workflow step runner
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_previous_step.py \
            /tmp/fix98.yml \
            "Create workflow step runner"

          test -s \
            /tmp/run_workflow_step.py

      # ============================================================
      # RECONSTRÓI A BASE ESTÁVEL
      # ============================================================

      - name: Restore exact stable Gama base
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_previous_step.py \
            /tmp/fix98.yml \
            "Restore exact stable Gama base"

          test -s \
            _gama_build/app/build.gradle.kts

          test -s \
            _gama_build/app/src/main/AndroidManifest.xml

          test -s \
            _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt

      # ============================================================
      # FIX90 + FIX91
      # ============================================================

      - name: Apply stable runtime and anti-noise
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_previous_step.py \
            /tmp/fix98.yml \
            "Apply stable runtime and anti-noise"

      # ============================================================
      # FIX93
      # ============================================================

      - name: Apply stable FIX93
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_previous_step.py \
            /tmp/fix98.yml \
            "Apply stable FIX93"

          grep -Fq \
            'GAMA92_TIME_AND_SCREEN_FAST_LANES' \
            _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt

      # ============================================================
      # INSTALA O ZEVRON
      # ============================================================

      - name: Install Zevron FIX97 core
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_previous_step.py \
            /tmp/fix98.yml \
            "Install Zevron FIX97 core"

          PKG="_gama_build/app/src/main/java/com/gama/assistant"

          test -s \
            "$PKG/ZevronConversationEngine.kt"

          test -s \
            "$PKG/ZevronAppTool.kt"

          test -s \
            "$PKG/ZevronMathTool.kt"

          test -s \
            "$PKG/ZevronCalendarFlow.kt"

          test -s \
            "$PKG/ZevronLocalRouter.kt"

      # ============================================================
      # FIX99
      #
      # CORRIGE OS 7 ERROS KOTLIN ENCONTRADOS NO RUN #89
      # ============================================================

      - name: Repair Zevron Kotlin returns
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path = Path(
              "app/src/main/java/com/gama/assistant/ZevronAppTool.kt"
          )

          calendar_path = Path(
              "app/src/main/java/com/gama/assistant/ZevronCalendarFlow.kt"
          )

          app = app_path.read_text(
              encoding="utf-8"
          )

          calendar = calendar_path.read_text(
              encoding="utf-8"
          )

          fixes = [
              (
                  "app",
                  r'\?:\s*return\s*\n\s*"Não encontrei o aplicativo \$\{request\.target\} instalado\."',
                  '?: return "Não encontrei o aplicativo ${request.target} instalado."',
              ),
              (
                  "app",
                  r'\?:\s*return\s*\n\s*"Encontrei o aplicativo, mas não consegui identificar como abri-lo\."',
                  '?: return "Encontrei o aplicativo, mas não consegui identificar como abri-lo."',
              ),
              (
                  "app",
                  r'\breturn\s*\n\s*"Não consegui abrir \$\{request\.target\}\."',
                  'return "Não consegui abrir ${request.target}."',
              ),
              (
                  "app",
                  r'\breturn\s*\n\s*"Abrindo \$label\."',
                  'return "Abrindo $label."',
              ),
              (
                  "app",
                  r'\breturn\s*\n\s*"Não encontrei o \$label instalado\."',
                  'return "Não encontrei o $label instalado."',
              ),
              (
                  "app",
                  r'return@mapNotNull\s*\n\s*null',
                  'return@mapNotNull null',
              ),
              (
                  "calendar",
                  r'\breturn\s*\n\s*"Certo\. Cancelei\."',
                  'return "Certo. Cancelei."',
              ),
          ]

          count_total = 0

          for target, pattern, replacement in fixes:

              source = (
                  app
                  if target == "app"
                  else calendar
              )

              source, count = re.subn(
                  pattern,
                  replacement,
                  source,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      f"Correção não aplicada exatamente uma vez: {pattern}"
                  )

              count_total += count

              if target == "app":
                  app = source
              else:
                  calendar = source

          if count_total != 7:
              raise SystemExit(
                  f"Esperava 7 correções; obtive {count_total}."
              )

          app_path.write_text(
              app,
              encoding="utf-8"
          )

          calendar_path.write_text(
              calendar,
              encoding="utf-8"
          )

          # Confere especificamente os pontos que falharam.
          expected_app = [
              '?: return "Não encontrei o aplicativo ${request.target} instalado."',
              '?: return "Encontrei o aplicativo, mas não consegui identificar como abri-lo."',
              'return "Não consegui abrir ${request.target}."',
              'return "Abrindo $label."',
              'return "Não encontrei o $label instalado."',
              'return@mapNotNull null',
          ]

          for expected in expected_app:
              if expected not in app:
                  raise SystemExit(
                      "Correção ausente em ZevronAppTool: "
                      + expected
                  )

          if (
              'return "Certo. Cancelei."'
              not in calendar
          ):
              raise SystemExit(
                  "Correção ausente em ZevronCalendarFlow."
              )

          # Nenhum return isolado pode permanecer nesses arquivos.
          for name, source in (
              ("ZevronAppTool.kt", app),
              ("ZevronCalendarFlow.kt", calendar),
          ):

              for number, line in enumerate(
                  source.splitlines(),
                  start=1
              ):

                  if line.strip() in {
                      "return",
                      "return@mapNotNull",
                  }:
                      raise SystemExit(
                          f"{name}:{number}: return isolado."
                      )

                  if (
                      line.rstrip()
                      .endswith(
                          "?: return"
                      )
                  ):
                      raise SystemExit(
                          f"{name}:{number}: Elvis return quebrado."
                      )

          print(
              "FIX99: 7 expressões Kotlin corrigidas."
          )
          PY

          echo \
            "FIX99: Kotlin return expressions repaired." \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # REGRAS DE CONVERSA
      # ============================================================

      - name: Verify natural Zevron conversation rules
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_previous_step.py \
            /tmp/fix98.yml \
            "Verify natural Zevron conversation rules"

      # ============================================================
      # JAVA
      # ============================================================

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID
      # ============================================================

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            >/dev/null 2>&1 \
            || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      # ============================================================
      # GRADLE
      # ============================================================

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ============================================================
      # ASSINATURA
      # ============================================================

      - name: Resolve Zevron signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_previous_step.py \
            /tmp/fix98.yml \
            "Resolve Zevron signing mode"

      # ============================================================
      # VERSÃO
      # ============================================================

      - name: Set Zevron FIX99 version metadata
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_previous_step.py \
            /tmp/fix98.yml \
            "Set Zevron version metadata"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "_gama_build/app/build.gradle.kts"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          text, count = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "Zevron 1.0 FIX99"',
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "versionName não encontrado."
              )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      # ============================================================
      # MODELOS OFFLINE
      # ============================================================

      - name: Download and verify offline voice models
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_previous_step.py \
            /tmp/fix98.yml \
            "Download and verify offline voice models"

      # ============================================================
      # COMPILA
      # ============================================================

      - name: Compile Zevron APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/zevron-build.log"

      # ============================================================
      # TESTES
      # ============================================================

      - name: Run Zevron unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail

          gradle \
            :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            2>&1 \
            | tee \
              "$GITHUB_WORKSPACE/zevron-tests.log"

      - name: Verify Zevron tests
        working-directory: _gama_build
        run: |
          set -euo pipefail

          RESULTS="app/build/test-results/testDebugUnitTest"

          test -d "$RESULTS"

          if grep -RqsE \
            'failures="[1-9][0-9]*"|errors="[1-9][0-9]*"' \
            "$RESULTS"; then

            echo \
              "::error::Há testes falhando."

            exit 1
          fi

          grep -Rqs \
            'ZevronConversationEngineTest' \
            "$RESULTS"

          grep -Rqs \
            'ZevronAppToolTest' \
            "$RESULTS"

          grep -Rqs \
            'ZevronMathToolTest' \
            "$RESULTS"

          grep -Rqs \
            'ZevronCalendarFlowTest' \
            "$RESULTS"

          echo \
            "Todos os testes Zevron passaram." \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # DIAGNÓSTICO
      # ============================================================

      - name: Show build failure
        if: failure()
        run: |
          set +e

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          summary = Path(
              os.environ[
                  "GITHUB_STEP_SUMMARY"
              ]
          )

          with summary.open(
              "a",
              encoding="utf-8"
          ) as out:

              out.write(
                  "## Zevron FIX99 diagnóstico\n\n"
              )

              for name in (
                  "zevron-build.log",
                  "zevron-tests.log",
              ):

                  path = Path(name)

                  if not path.is_file():
                      continue

                  lines = path.read_text(
                      encoding="utf-8",
                      errors="replace",
                  ).splitlines()

                  errors = [
                      line
                      for line in lines
                      if re.search(
                          r'(^e: |\berror:|FAILED|FAILURE:|Caused by:|What went wrong)',
                          line,
                          re.I,
                      )
                  ]

                  selected = (
                      errors[:160]
                      if errors
                      else lines[-160:]
                  )

                  out.write(
                      f"### {name}\n\n"
                  )

                  out.write(
                      "```text\n"
                  )

                  out.write(
                      "\n".join(
                          selected
                      )
                  )

                  out.write(
                      "\n```\n\n"
                  )
          PY

      - name: Upload Zevron build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zevron-1.0-FIX99-build-logs
          path: |
            zevron-build.log
            zevron-tests.log
          if-no-files-found: warn

      # ============================================================
      # ASSINA
      # ============================================================

      - name: Sign Zevron APK
        env:
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          python3 \
            /tmp/run_previous_step.py \
            /tmp/fix98.yml \
            "Sign Zevron APK"

          test -s \
            _gama_build/dist/Zevron.apk

      # ============================================================
      # VERIFICA APK
      # ============================================================

      - name: Verify Zevron APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          test -s \
            dist/Zevron.apk

          test -s \
            dist/Zevron.apk.sha256

          (
            cd dist

            sha256sum -c \
              Zevron.apk.sha256
          )

          APK_BYTES="$(
            wc -c \
              < dist/Zevron.apk
          )"

          if [ "$APK_BYTES" -le 1000000 ]; then

            echo \
              "::error::APK pequeno demais: $APK_BYTES bytes"

            exit 1
          fi

          echo \
            "## Zevron FIX99" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- APK: $APK_BYTES bytes" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- Package: com.gama.assistant" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- Hotword: Zevron" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- Base estável: run #87" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- Erro do run #88 corrigido" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "- 7 erros Kotlin do run #89 corrigidos" \
            >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # APK
      # ============================================================

      - name: Upload Zevron APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Zevron.apk
            _gama_build/dist/Zevron.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/install-mode.txt
            _gama_build/dist/signing-cert-sha256.txt
            _gama_build/dist/signature-info.txt
          if-no-files-found: error

      # ============================================================
      # TESTES
      # ============================================================

      - name: Upload Zevron test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zevron-1.0-FIX99-tests
          path: |
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn

      # ============================================================
      # CÓDIGO-FONTE RECONSTRUÍDO
      # ============================================================

      - name: Upload Zevron source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zevron-1.0-FIX99-source
          path: |
            _gama_build/app/src
            _gama_build/app/build.gradle.kts
            _gama_build/settings.gradle.kts
            _gama_build/build.gradle.kts
            _gama_build/gradle.properties
            _gama_build/tools
          if-no-files-found: warn

      # ============================================================
      # RELEASE
      # ============================================================

      - name: Publish Zevron release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="zevron-1.0-${GITHUB_RUN_NUMBER}"

          gh release delete \
            "$TAG" \
            --yes \
            >/dev/null 2>&1 \
            || true

          gh release create \
            "$TAG" \
            "_gama_build/dist/Zevron.apk#Zevron.apk" \
            "_gama_build/dist/Zevron.apk.sha256#Zevron.apk.sha256" \
            --title \
            "Zevron 1.0 FIX99" \
            --notes \
            "Zevron FIX99

          Correções:
          - corrige a dependência histórica que derrubou o run #88
          - corrige os 7 returns Kotlin que derrubaram o run #89
          - corrige return@mapNotNull para preservar o tipo Pair
          - mantém a base estável do run #87

          Zevron preservado:
          - hotword Zevron
          - conversa contínua
          - abertura de aplicativos
          - WhatsApp e aliases
          - calendário multi-turno
          - matemática local
          - contexto e memória curta
          - Internet
          - notícias
          - clima
          - mensagens
          - briefings
          - leitura de tela
          - anti-ruído
          - cérebro isolado
          - face gate
          - biometria oficial Android"

# ZEVRON_FIX99_COMPLETE_END
