name: Build Gama 11.0 LOCAL AUTONOMOUS APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-gama.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: gama-11-local-autonomous-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GAMA_BASE_RUN_ID: "37445474860"
      GAMA_BASE_ARTIFACT: "Gama-10.6.2-LOCALFIRST177-source"
      GAMA_LEGACY_RUN_ID: "37158343882"
      GAMA_LEGACY_ARTIFACT: "Gama-9.3.0-JARVIS-source"
    steps:
      - uses: actions/checkout@v4
      - name: Restore current base and proven local brain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build _gama_legacy
          mkdir -p _gama_build _gama_legacy
          gh run download "$GAMA_BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$GAMA_BASE_ARTIFACT" --dir _gama_build
          gh run download "$GAMA_LEGACY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$GAMA_LEGACY_ARTIFACT" --dir _gama_legacy
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_legacy/app/src/main/java/com/gama/assistant/LocalBrain.kt
          test -s _gama_legacy/app/src/main/java/com/gama/assistant/AiSetup.kt
          chmod +x _gama_build/gradlew

      - name: Apply Gama 11 autonomous core
