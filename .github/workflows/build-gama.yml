              service,
              r'''
              private\ fun\ finishIsolatedBrainResult\(
              .*?
              \n\ \ \ \ \}
              \n
              \n\ \ \ \ private\ fun\ failIsolatedBrain
              ''',
              r'''private fun finishIsolatedBrainResult(
                      requestId: Long,
                      rawAnswer: String,
                      success: Boolean,
                      sessionId: Long,
                      turnId: Long,
                      generationId: Long,
                  ) {
                      if (
                          requestId !=
                          activeBrainRequestId
                      ) {
                          return
                      }

                      val stamp =
                          activeBrainTurnStamp
                              ?: return

                      val generation =
                          activeBrainGeneration

                      if (
                          sessionId != stamp.sessionId ||
                          turnId != stamp.turnId ||
                          generationId !=
                          stamp.generationId ||
                          !orchestrator
                              .isCurrent(stamp)
                      ) {
                          cancelObsoleteBrainRequest()
                          return
                      }

                      brainHealthToken++
                      brainBusy = false
                      activeBrainRequestId = 0L
                      activeBrainPid = 0

                      if (
                          !running ||
                          generation !=
                          requestGeneration
                      ) {
                          return
                      }

                      val answer =
                          rawAnswer.trim()

                      if (
                          !success ||
                          answer.isBlank()
                      ) {
                          recoverBrainOrAskRepeat(
                              requestId,
                              "generation",
                              stamp,
                          )

                          return
                      }

                      val related =
                          ContextSanityCheck
                              .answerRelated(
                                  brainRetryPrompt,
                                  activeBrainContext,
                                  answer,
                              )

                      if (!related) {
                          recoverBrainOrAskRepeat(
                              requestId,
                              "context-sanity",
                              stamp,
                          )

                          return
                      }

                      brainRetryAttempt = 0
                      brainCooldownUntil = 0L
                      activeBrainTurnStamp = null
                      activeBrainContext = ""

                      uiHandler.post {
                          if (
                              !running ||
                              generation !=
                              requestGeneration ||
                              !orchestrator
                                  .isCurrent(stamp)
                          ) {
                              return@post
                          }

                          if (isDeviceLocked()) {
                              speakForTurn(
                                  "Desbloqueie o Android para continuar.",
                                  stamp,
                                  false,
                              )

                              return@post
                          }

                          updateNotification(
                              answer
                          )

                          speakForTurn(
                              answer,
                              stamp,
                              false,
                          )
                      }
                  }

                  private fun recoverBrainOrAskRepeat(
                      requestId: Long,
                      reason: String,
                      forcedStamp: GamaTurnCoordinator.Stamp? = null,
                  ) {
                      val stamp =
                          forcedStamp
                              ?: activeBrainTurnStamp
                              ?: return

                      val prompt =
                          brainRetryPrompt

                      val current =
                          orchestrator
                              .isCurrent(stamp)

                      val mayRetry =
                          current &&
                              prompt.isNotBlank() &&
                              brainRetryAttempt <
                              GamaRecoveryManager
                                  .MAX_BRAIN_RETRIES

                      Log.w(
                          "GamaBrain",
                          "silent recovery: $reason"
                      )

                      resetIsolatedBrainForSilentRetry(
                          requestId
                      )

                      if (mayRetry) {
                          brainRetryAttempt++

                          GamaSupervisor
                              .onRecovering()

                          val delay =
                              GamaRecoveryManager
                                  .brainRetryDelayMs(
                                      brainRetryAttempt -
                                          1
                                  )

                          uiHandler.postDelayed(
                              {
                                  if (
                                      orchestrator
                                          .isCurrent(
                                              stamp
                                          ) &&
                                      activeBrainRequestId ==
                                      0L
                                  ) {
                                      answerWithBrainAsync(
                                          prompt,
                                          cleanContext = true,
                                      )
                                  }
                              },
                              delay,
                          )

                          return
                      }

                      brainRetryAttempt = 0
                      activeBrainTurnStamp = null
                      activeBrainContext = ""

                      if (current) {
                          speakForTurn(
                              GamaRecoveryManager
                                  .neutralRepeatRequest(),
                              stamp,
                              false,
                          )
                      }
                  }

                  private fun failIsolatedBrain'''
          )

