                      hideWakeUi()
                  }
          """

          if old_screen_off in service:
              service = service.replace(old_screen_off, new_screen_off, 1)

          lock_start = service.find("    private fun lockScreenReply(): String {")
          lock_end = service.find("\n    private fun performDeviceLockNow()", lock_start)

          if lock_start < 0 or lock_end < 0:
              raise SystemExit("lockScreenReply region not found")

          lock_region = service[lock_start:lock_end]
          lock_region = lock_region.replace("            conversation.close()\n", "")
          lock_region = lock_region.replace("            conversation.suspend()\n", "")
          lock_region = lock_region.replace("            GamaSupervisor.onConversationClosed()\n", "")
          lock_region = lock_region.replace("            conversationLastActivityAt = 0L\n", "            conversationLastActivityAt = SystemClock.elapsedRealtime()\n")
          service = service[:lock_start] + lock_region + service[lock_end:]

          unlock_start = service.find("    private fun ensureVoicePipelineAfterUnlock() {")
          unlock_end = service.find("\n    fun cancelRequest()", unlock_start)

          if unlock_start < 0 or unlock_end < 0:
              raise SystemExit("ensureVoicePipelineAfterUnlock region not found")

          unlock_function = r'''    private fun ensureVoicePipelineAfterUnlock() {
              val now = SystemClock.elapsedRealtime()

              val stale =
                  listenerThread?.isAlive != true ||
                      !voiceReady ||
                      !running ||
                      textMode ||
                      (
                          lastScreenOffAt > 0L &&
                              lastAudioReadAt <= lastScreenOffAt
                          ) ||
                      (
                          lastAudioReadAt > 0L &&
                              now - lastAudioReadAt > 3_000L
                          )

              if (stale) {
                  recoverMicrophoneOnly("unlock")
              } else {
                  postAudio {
                      recognizer?.reset()
                      decoderActive = false
                      voicedBlocks = 0
                      preRoll = ByteArray(0)
                      bargePreRoll = ByteArray(0)
                      speechHoldUntil = 0L
                      ignoreAudioUntil = SystemClock.elapsedRealtime() + 350L
                  }
              }

              listOf(1_800L, 6_000L).forEachIndexed { index, delayMs ->
                  uiHandler.postDelayed({
                      if (
                          !running ||
                          isDeviceLocked() ||
                          !BackgroundMode.enabled(this)
                      ) {
                          return@postDelayed
                      }

                      val checkNow = SystemClock.elapsedRealtime()
                      val freshAudio =
                          lastAudioReadAt > 0L &&
                              (
                                  lastScreenOffAt <= 0L ||
                                      lastAudioReadAt > lastScreenOffAt
                                  ) &&
                              checkNow - lastAudioReadAt < 4_500L

                      if (!freshAudio || listenerThread?.isAlive != true || !voiceReady) {
                          recoverMicrophoneOnly(
                              if (index == 0) {
                                  "unlock-watchdog"
                              } else {
                                  "unlock-hard-watchdog"
                              }
                          )
                      }
                  }, delayMs)
              }
          }
          '''

          service = service[:unlock_start] + unlock_function + service[unlock_end:]

          proactive_marker = """    private fun handleProactiveEvent(event: GamaEventHub.Event) {
                  if (!running || event.priority != GamaEventHub.Priority.HIGH) return
          """

          proactive_replacement = """    private fun handleProactiveEvent(event: GamaEventHub.Event) {
                  if (!running || event.priority != GamaEventHub.Priority.HIGH) return

                  if (event.kind == GamaEventHub.Kind.MESSAGE) {
                      val semanticPriority = GamaNotificationIntelligence.classify(
                          this,
                          event.source,
                          event.summary,
                      )

                      if (semanticPriority == GamaNotificationIntelligence.Level.LOW) {
                          return
                      }

                      if (
                          GamaSilentContext.isSilentNow(this) &&
                          semanticPriority != GamaNotificationIntelligence.Level.URGENT
                      ) {
                          updateNotification("Mensagem importante guardada para depois do período silencioso.")
                          return
                      }
                  }
          """

          if "semanticPriority = GamaNotificationIntelligence.classify" not in service:
              service = replace_once(service, proactive_marker, proactive_replacement, "Proactive silent-context gate")

          barge_start = voice.find("    fun shouldBargeIn(partial: String, spoken: String?, headphones: Boolean): Boolean {")
          barge_end = voice.find("\n    fun looksLikePostActionNoise", barge_start)

          if barge_start < 0 or barge_end < 0:
              raise SystemExit("VoicePolicy.shouldBargeIn region not found")

          barge_function = r'''    fun shouldBargeIn(partial: String, spoken: String?, headphones: Boolean): Boolean {
              val p = normalize(partial)
              if (p.isBlank()) return false
              if (hasWake(p)) return true
              if (looksLikeTtsEcho(p, spoken)) return false

              val backchannels = setOf(
                  "sim",
                  "uhum",
                  "aham",
                  "certo",
                  "entendi",
                  "beleza",
                  "ok",
                  "okay",
                  "ta",
              )

              if (p in backchannels) return false

              val explicitInterrupt =
                  p == "nao" ||
                      p == "espera" ||
                      p == "pare" ||
                      p == "para" ||
                      p.startsWith("nao e isso") ||
                      p.startsWith("nao foi isso") ||
                      p.startsWith("voce entendeu errado") ||
                      p.startsWith("espera ai") ||
                      p.startsWith("na verdade")

              if (explicitInterrupt) return true

              val words = p.split(' ').filter { it.isNotBlank() }
              if (headphones) return p.length >= 3
              return words.size >= 2 || p.length >= 8
          }
          '''

          voice = voice[:barge_start] + barge_function + voice[barge_end:]

          if "GamaMemoryConsentPolicy.allowAdaptiveLearning(raw)" not in super_core:
              super_core = replace_once(
                  super_core,
                  "        GamaAdaptiveMemory.observe(context, raw)\n",
                  "        if (GamaMemoryConsentPolicy.allowAdaptiveLearning(raw)) GamaAdaptiveMemory.observe(context, raw)\n",
                  "Sensitive long-term memory guard",
              )

          old_priority = "        val priority = GamaProactivePolicy.messagePriority(body, recent)\n"
          new_priority = "        val priority = GamaNotificationIntelligence.eventPriority(this, source, body, recent)\n"

          if new_priority not in listener:
              listener = replace_once(listener, old_priority, new_priority, "Semantic notification priority")

          planner_marker = """        if (MessageCommandRouter.isReadRequest(c)) return true
                  return false
          """

          planner_replacement = """        if (MessageCommandRouter.isReadRequest(c)) return true
                  if (GamaTimerRouter.recognizes(raw)) return true
                  if (GamaWebsiteRouter.recognizes(raw)) return true
                  if (GamaSystemActionRouter.recognizes(raw)) return true
                  return false
          """

          if "GamaTimerRouter.recognizes(raw)" not in planner:
              planner = replace_once(planner, planner_marker, planner_replacement, "Planner deterministic tools")

          if 'com.android.alarm.permission.SET_ALARM' not in manifest:
              application_index = manifest.find("<application")
              if application_index < 0:
                  raise SystemExit("AndroidManifest application tag not found")
              manifest = (
                  manifest[:application_index]
                  + '<uses-permission android:name="com.android.alarm.permission.SET_ALARM" />\n\n    '
                  + manifest[application_index:]
              )

          version_code = 25_300_000 + int(os.environ["GITHUB_RUN_NUMBER"])

          gradle, code_count = re.subn(
              r"versionCode\s*=\s*\d+",
              f"versionCode = {version_code}",
              gradle,
              count=1,
          )

          gradle, name_count = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              'versionName = "Gama 10.3.0 Personal Android Core"',
              gradle,
              count=1,
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not set Gama 10.3 version")

          service_path.write_text(service, encoding="utf-8")
          voice_path.write_text(voice, encoding="utf-8")
          super_path.write_text(super_core, encoding="utf-8")
          listener_path.write_text(listener, encoding="utf-8")
          planner_path.write_text(planner, encoding="utf-8")
          manifest_path.write_text(manifest, encoding="utf-8")
          gradle_path.write_text(gradle, encoding="utf-8")

          checks = {
              service_path: [
                  "GamaNextRouter.handleAsync",
                  "unlock-hard-watchdog",
                  "GamaSilentContext.isSilentNow",
                  "val appQuery = extractAppQuery",
              ],
              voice_path: [
                  'p == "nao"',
                  '"uhum"',
                  "explicitInterrupt",
              ],
              super_path: [
                  "GamaMemoryConsentPolicy.allowAdaptiveLearning(raw)",
              ],
              listener_path: [
                  "GamaNotificationIntelligence.eventPriority",
              ],
              planner_path: [
                  "GamaTimerRouter.recognizes(raw)",
                  "GamaWebsiteRouter.recognizes(raw)",
                  "GamaSystemActionRouter.recognizes(raw)",
              ],
          }

          for path, tokens in checks.items():
              value = path.read_text(encoding="utf-8")
              for token in tokens:
                  if token not in value:
                      raise SystemExit(f"Integration invariant missing in {path}: {token}")

          print(f"PASS: GAMA Personal Android Core integrated. versionCode={version_code}")
          PY

          python3 -m py_compile /tmp/gama-personal-integrate.py
          python3 /tmp/gama-personal-integrate.py
          rm -f /tmp/gama-personal-integrate.py

      - name: Audit Personal Android Core
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"

          required=(
            "$SRC/GamaTaskStateStore.kt"
            "$SRC/GamaContextPolicy.kt"
            "$SRC/GamaDeviceTools.kt"
            "$SRC/GamaDialogueCore.kt"
            "$SRC/GamaNextRouter.kt"
