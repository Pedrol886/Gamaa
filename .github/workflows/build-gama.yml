                  }

                  private fun launchKnownAppRoute(
                      app: GamaAppRegistry.AppSpec,
                      sequence: Long,
                      attempt: Int,
                  ) {
                      if (
                          !running ||
                          sequence !=
                          userCommandSequence
                      ) {
                          return
                      }

                      if (
                          attempt >
                          GamaReliableAppLauncher
                              .maxAttemptIndex()
                      ) {
                          val reply =
                              "O Android não confirmou a abertura de ${app.label}."

                          GamaTaskMemory
                              .rememberResult(
                                  this,
                                  reply,
                              )

                          GamaContinuityMemory
                              .recordAction(
                                  this,
                                  "abrir ${app.label}",
                                  reply,
                              )

                          speak(
                              reply,
                              false,
                          )

                          return
                      }

                      val result =
                          GamaAppRegistry
                              .launch(
                                  this,
                                  app,
                                  attempt,
                              )

                      if (!result.started) {
                          launchKnownAppRoute(
                              app,
                              sequence,
                              attempt + 1,
                          )

                          return
                      }

                      ZevronConversationEngine
                          .rememberSubject(
                              this,
                              app.label,
                          )

                      updateNotification(
                          "Abrindo ${app.label} • verificando a tela..."
                      )

                      externalLaunchStatusUntil =
                          SystemClock
                              .elapsedRealtime() +
                              6_500L

                      verifyKnownAppLaunch(
                          app,
                          sequence,
                          attempt,
                      )
                  }

                  private fun verifyKnownAppLaunch(
                      app: GamaAppRegistry.AppSpec,
                      sequence: Long,
                      attempt: Int,
                  ) {
                      if (
                          !GamaScreenContextService
                              .isConnected()
                      ) {
                          updateNotification(
                              "Controle de tela necessário para confirmar ${app.label}"
                          )

                          speak(
                              "Ative o controle de tela para eu confirmar ações em outros aplicativos.",
                              false,
                          )

                          return
                      }

                      val deadline =
                          SystemClock
                              .elapsedRealtime() +
                              1_700L

                      val poll =
                          object : Runnable {
                              override fun run() {
                                  if (
                                      !running ||
                                      sequence !=
                                      userCommandSequence
                                  ) {
                                      return
                                  }

                                  val visiblePackage =
                                      GamaScreenContextService
                                          .currentPackageName()

                                  if (
                                      GamaAppRegistry
                                          .isExpectedPackage(
                                              app,
                                              visiblePackage,
                                          )
                                  ) {
                                      GamaSupervisor
                                          .onVerifying()

                                      val reply =
                                          "${app.label} aberto e confirmado na tela."

                                      GamaTaskMemory
                                          .rememberResult(
                                              this@GamaService,
                                              reply,
                                          )

                                      GamaContinuityMemory
                                          .recordAction(
                                              this@GamaService,
                                              "abrir ${app.label}",
                                              reply,
                                          )

                                      orchestrator
                                          .rememberAction(
                                              "abrir ${app.label}",
                                              reply,
                                              app.label,
                                          )

                                      speak(
                                          "Certo.",
                                          false,
                                      )

                                      return
                                  }

                                  if (
                                      SystemClock
                                          .elapsedRealtime() <
                                      deadline
                                  ) {
                                      uiHandler
                                          .postDelayed(
                                              this,
                                              120L,
                                          )

                                      return
                                  }

                                  launchKnownAppRoute(
                                      app,
                                      sequence,
                                      attempt + 1,
                                  )
                              }
                          }

                      uiHandler.post(poll)
                  }

                  private fun handleContextualAppExit(
