name: Build Zevron 1.0 FIX97 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write

concurrency:
  group: zevron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    env:
      # Última base estável confirmada.
      FIX93_COMMIT: 9921e17c918a2ea358ade085c05b06af85d0b7fb

      # Bases históricas que o próprio FIX93 usa.
      GAMA_67_COMMIT: 87d85998667f9e51e39860991398a2e31cd5f3c7
      GAMA_43_COMMIT: ae7f8993cad81d749ffdf04dfc84d828705b1a1a

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # RECONSTRÓI O PROJETO ESTÁVEL
      # ============================================================

      - name: Rebuild stable FIX93 source
        run: |
          set -euo pipefail

          git cat-file -e "${FIX93_COMMIT}^{commit}"

          git show \
            "${FIX93_COMMIT}:.github/workflows/build-gama.yml" \
            > /tmp/fix93.yml

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          workflow = Path("/tmp/fix93.yml").read_text(
              encoding="utf-8"
          )

          steps = [
              "Restore exact Gama 4.3 base used by run 67",
              "Apply FIX90 runtime plus FIX91 priority anti-noise bundle",
              "Add FIX93 strict screen routing, time-aware greetings and sleep window",
          ]

          root = Path.cwd()

          def extract_step(name: str):
              pattern = re.compile(
                  r"^      - name: "
                  + re.escape(name)
                  + r"\n(?P<body>.*?)(?=^      - name: |\Z)",
                  re.MULTILINE | re.DOTALL,
              )

              match = pattern.search(workflow)

              if not match:
                  raise SystemExit(
                      f"Etapa não encontrada no FIX93: {name}"
                  )

              body = match.group("body")

              working = None

              wd_match = re.search(
                  r"^        working-directory:\s*(.+?)\s*$",
                  body,
                  re.MULTILINE,
              )

              if wd_match:
                  working = wd_match.group(1).strip()

              lines = body.splitlines()

              start = None

              for index, line in enumerate(lines):
                  if line.strip() == "run: |":
                      start = index + 1
                      break

              if start is None:
                  raise SystemExit(
                      f"run não encontrado em: {name}"
                  )

              script_lines = []

              for line in lines[start:]:
                  if line.strip() == "":
                      script_lines.append("")
                      continue

                  if not line.startswith("          "):
                      break

                  script_lines.append(line[10:])

              script = "\n".join(script_lines) + "\n"

              return working, script

          for name in steps:
              working, script = extract_step(name)

              cwd = root

              if working:
                  cwd = root / working

              print()
              print("=" * 70)
              print("Executando:", name)
              print("Diretório:", cwd)
              print("=" * 70)

              subprocess.run(
                  [
                      "bash",
                      "-euo",
                      "pipefail",
                      "-c",
                      script,
                  ],
                  cwd=cwd,
                  env=os.environ.copy(),
                  check=True,
              )

          required = [
              root / "_gama_build/app/build.gradle.kts",
              root / "_gama_build/app/src/main/AndroidManifest.xml",
              root / "_gama_build/app/src/main/java/com/gama/assistant/GamaService.kt",
          ]

          for file in required:
              if not file.is_file():
                  raise SystemExit(
                      f"Arquivo obrigatório ausente: {file}"
                  )

          print("FIX93 reconstruído com sucesso.")
          PY

      # ============================================================
      # ZEVRON FIX97
      # ============================================================

      - name: Install Zevron FIX97 core
        working-directory: _gama_build
        run: |
          set -euo pipefail

          PKG="app/src/main/java/com/gama/assistant"
          TEST="app/src/test/java/com/gama/assistant"

          mkdir -p "$PKG"
          mkdir -p "$TEST"

          # ========================================================
          # CONVERSA CONTÍNUA
          # ========================================================

          cat > "$PKG/ZevronConversationEngine.kt" <<'KOTLIN'
          package com.gama.assistant

          import android.content.Context
          import java.text.Normalizer
          import java.util.Locale

          object ZevronConversationEngine {

              private const val PREFS =
                  "zevron_conversation_session"

              private const val KEY_ACTIVE =
                  "conversation_active"

              private const val KEY_LAST_TURN =
                  "last_turn"

              private const val KEY_LAST_SUBJECT =
                  "last_subject"

              private const val SESSION_TIMEOUT_MS =
                  12L * 60L * 1000L

              enum class Control {
                  NORMAL,
                  WAKE_ONLY,
                  SLEEP
              }

              fun control(raw: String): Control {
                  val normalized = normalize(raw)

                  if (
                      normalized == "zevron"
                  ) {
                      return Control.WAKE_ONLY
                  }

                  val withoutWake = normalized
                      .removePrefix("zevron ")
                      .trim()

                  if (
                      withoutWake in setOf(
                          "pode descansar",
                          "pode ir descansar",
                          "descanse",
                          "pode dormir",
                          "encerre a conversa",
                          "encerrar conversa"
                      )
                  ) {
                      return Control.SLEEP
                  }

                  return Control.NORMAL
              }

              fun intercept(
                  context: Context,
                  raw: String
              ): String? {

                  return when (control(raw)) {

                      Control.WAKE_ONLY -> {
                          activate(context)

                          "Estou ouvindo, senhor Pedro."
                      }

                      Control.SLEEP -> {
                          stop(context)

                          "Certo, senhor Pedro."
                      }

                      Control.NORMAL -> {
                          activate(context)
                          rememberTurn(context, raw)
                          null
                      }
                  }
              }

              fun active(
                  context: Context,
                  now: Long =
                      System.currentTimeMillis()
              ): Boolean {

                  val prefs =
                      context.getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                      )

                  if (
                      !prefs.getBoolean(
                          KEY_ACTIVE,
                          false
                      )
                  ) {
                      return false
                  }

                  val last =
                      prefs.getLong(
                          KEY_LAST_TURN,
                          0L
                      )

                  if (
                      last <= 0L ||
                      now - last >
                      SESSION_TIMEOUT_MS
                  ) {

                      prefs.edit()
                          .putBoolean(
                              KEY_ACTIVE,
                              false
                          )
                          .apply()

                      return false
                  }

                  return true
              }

              fun rememberSubject(
                  context: Context,
                  subject: String
              ) {

                  if (subject.isBlank()) return

                  context.getSharedPreferences(
                      PREFS,
                      Context.MODE_PRIVATE
                  )
                      .edit()
                      .putString(
                          KEY_LAST_SUBJECT,
                          subject.take(300)
                      )
                      .putLong(
                          KEY_LAST_TURN,
                          System.currentTimeMillis()
                      )
                      .apply()
              }

              fun lastSubject(
                  context: Context
              ): String? {

                  return context.getSharedPreferences(
                      PREFS,
                      Context.MODE_PRIVATE
                  )
                      .getString(
                          KEY_LAST_SUBJECT,
                          null
                      )
              }

              fun stripWakeWord(
                  raw: String
              ): String {

                  val trimmed =
                      raw.trim()

                  return trimmed.replaceFirst(
                      Regex(
                          """(?i)^\s*zevron[\s,.:;!?-]*"""
                      ),
                      ""
                  )
                      .trim()
              }

              private fun activate(
                  context: Context
              ) {

                  context.getSharedPreferences(
                      PREFS,
                      Context.MODE_PRIVATE
                  )
                      .edit()
                      .putBoolean(
                          KEY_ACTIVE,
                          true
                      )
                      .putLong(
                          KEY_LAST_TURN,
                          System.currentTimeMillis()
                      )
                      .apply()
              }

              private fun stop(
                  context: Context
              ) {

                  context.getSharedPreferences(
                      PREFS,
                      Context.MODE_PRIVATE
                  )
                      .edit()
                      .putBoolean(
                          KEY_ACTIVE,
                          false
                      )
                      .putLong(
                          KEY_LAST_TURN,
                          System.currentTimeMillis()
                      )
                      .apply()
              }

              private fun rememberTurn(
                  context: Context,
                  raw: String
              ) {

                  context.getSharedPreferences(
                      PREFS,
                      Context.MODE_PRIVATE
                  )
                      .edit()
                      .putLong(
                          KEY_LAST_TURN,
                          System.currentTimeMillis()
                      )
                      .apply()
              }

              internal fun normalize(
                  value: String
              ): String {

                  return Normalizer.normalize(
                      value.lowercase(
                          Locale.ROOT
                      ),
                      Normalizer.Form.NFD
                  )
                      .replace(
                          Regex("\\p{M}+"),
                          ""
                      )
                      .replace(
                          Regex(
                              "[^a-z0-9 ]+"
                          ),
                          " "
                      )
                      .replace(
                          Regex("\\s+"),
                          " "
                      )
                      .trim()
              }
          }
          KOTLIN

          # ========================================================
          # ABERTURA DE APPS
          # ========================================================

          cat > "$PKG/ZevronAppTool.kt" <<'KOTLIN'
          package com.gama.assistant

          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ResolveInfo
          import java.text.Normalizer
          import java.util.Locale

          object ZevronAppTool {

              data class Request(
                  val target: String
              )

              private val openVerbs =
                  setOf(
                      "abra",
                      "abre",
                      "abrir",
                      "inicie",
                      "inicia",
                      "iniciar",
                      "execute",
                      "executa"
                  )

              private val whatsAppAliases =
                  setOf(
                      "whatsapp",
                      "zap",
                      "zap zap",
                      "watsap",
                      "watsape",
                      "uatsap",
                      "uatsape",
                      "whats",
                      "whats app"
                  )

              fun parse(
                  raw: String
              ): Request? {

                  var command =
                      normalize(raw)

                  command =
                      command
                          .removePrefix(
                              "zevron "
                          )
                          .trim()

                  val verb =
                      command
                          .substringBefore(" ")

                  if (
                      verb !in openVerbs
                  ) {
                      return null
                  }

                  var target =
                      command
                          .substringAfter(
                              " ",
                              ""
                          )
                          .trim()

                  target =
                      target
                          .removePrefix("o ")
                          .removePrefix("a ")
                          .removePrefix(
                              "app "
                          )
                          .removePrefix(
                              "aplicativo "
                          )
                          .trim()

                  if (
                      target.isBlank()
                  ) {
                      return null
                  }

                  return Request(target)
              }

              fun handle(
                  context: Context,
                  raw: String
              ): String? {

                  val request =
                      parse(raw)
                          ?: return null

                  val target =
                      normalize(
                          request.target
                      )

                  if (
                      target in
                      whatsAppAliases
                  ) {

                      return openKnown(
                          context,
                          listOf(
                              "com.whatsapp",
                              "com.whatsapp.w4b"
                          ),
                          "WhatsApp"
                      )
                  }

                  val pm =
                      context.packageManager

                  val query =
                      Intent(
                          Intent.ACTION_MAIN
                      )
                          .addCategory(
                              Intent.CATEGORY_LAUNCHER
                          )

                  @Suppress("DEPRECATION")
                  val activities =
                      runCatching {
                          pm.queryIntentActivities(
                              query,
                              0
                          )
                      }
                          .getOrDefault(
                              emptyList()
                          )

                  val match =
                      bestMatch(
                          pm,
                          activities,
                          target
                      )
                          ?: return
                              "Não encontrei o aplicativo ${request.target} instalado."

                  val activity =
                      match.activityInfo
                          ?: return
                              "Encontrei o aplicativo, mas não consegui identificar como abri-lo."

                  val packageName =
                      activity.packageName

                  val launch =
                      pm.getLaunchIntentForPackage(
                          packageName
                      )
                          ?: Intent(
                              Intent.ACTION_MAIN
                          )
                              .addCategory(
                                  Intent.CATEGORY_LAUNCHER
                              )
                              .setClassName(
                                  packageName,
                                  activity.name
                              )

                  launch.addFlags(
                      Intent.FLAG_ACTIVITY_NEW_TASK
                  )

                  val opened =
                      runCatching {
                          context.startActivity(
                              launch
                          )
                      }
                          .isSuccess

                  if (!opened) {
                      return
                          "Não consegui abrir ${request.target}."
                  }

                  ZevronConversationEngine
                      .rememberSubject(
                          context,
                          request.target
                      )

                  val label =
                      runCatching {
                          match.loadLabel(pm)
                              .toString()
                      }
                          .getOrDefault(
                              request.target
                          )

                  return "Abrindo $label."
              }

              private fun openKnown(
                  context: Context,
                  packages: List<String>,
                  label: String
              ): String {

                  val pm =
                      context.packageManager

                  for (
                      packageName in packages
                  ) {

                      val intent =
                          pm.getLaunchIntentForPackage(
                              packageName
                          )
                              ?: continue

                      intent.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK
                      )

                      if (
                          runCatching {
                              context.startActivity(
                                  intent
                              )
                          }.isSuccess
                      ) {

                          ZevronConversationEngine
                              .rememberSubject(
                                  context,
                                  label
                              )

                          return
                              "Abrindo $label."
                      }
                  }

                  return
                      "Não encontrei o $label instalado."
              }

              private fun bestMatch(
                  pm: PackageManager,
                  items: List<ResolveInfo>,
                  target: String
              ): ResolveInfo? {

                  val targetCompact =
                      target.replace(
                          " ",
                          ""
                      )

                  return items
                      .mapNotNull {

                          val info =
                              it.activityInfo
                                  ?: return@mapNotNull
                                      null

                          val label =
                              normalize(
                                  runCatching {
                                      it.loadLabel(pm)
                                          .toString()
                                  }
                                      .getOrDefault(
                                          ""
                                      )
                              )

                          val packageName =
                              normalize(
                                  info.packageName
                                      .orEmpty()
                              )

                          val score =
                              when {

                                  label ==
                                  target ->
                                      100

                                  packageName ==
                                  target ->
                                      95

                                  label.startsWith(
                                      target
                                  ) ->
                                      85

                                  target.startsWith(
                                      label
                                  ) &&
                                  label.length >= 3 ->
                                      80

                                  label.contains(
                                      target
                                  ) ->
                                      70

                                  packageName.contains(
                                      targetCompact
                                  ) ->
                                      60

                                  else ->
                                      0
                              }

                          if (
                              score == 0
                          ) {
                              null
                          } else {
                              score to it
                          }
                      }
                      .maxByOrNull {
                          it.first
                      }
                      ?.second
              }

              internal fun normalize(
                  value: String
              ): String {

                  return Normalizer.normalize(
                      value.lowercase(
                          Locale.ROOT
                      ),
                      Normalizer.Form.NFD
                  )
                      .replace(
                          Regex("\\p{M}+"),
                          ""
                      )
                      .replace(
                          Regex(
                              "[^a-z0-9 ]+"
                          ),
                          " "
                      )
                      .replace(
                          Regex("\\s+"),
                          " "
                      )
                      .trim()
              }
          }
          KOTLIN

          # ========================================================
          # MATEMÁTICA LOCAL
          # ========================================================

          cat > "$PKG/ZevronMathTool.kt" <<'KOTLIN'
          package com.gama.assistant

          import android.content.Context
          import java.text.Normalizer
          import java.util.Locale
          import kotlin.math.abs
          import kotlin.math.round
          import kotlin.math.sqrt

          object ZevronMathTool {

              private const val PREFS =
                  "zevron_math_context"

              private const val KEY_EXPRESSION =
                  "last_expression"

              private const val KEY_EXPLANATION =
                  "last_explanation"

              data class Answer(
                  val spoken: String,
                  val explanation: String,
                  val expression: String
              )

              fun handle(
                  context: Context,
                  raw: String
              ): String? {

                  val normalized =
                      normalize(raw)
                          .removePrefix(
                              "zevron "
                          )
                          .trim()

                  if (
                      normalized in setOf(
                          "por que",
                          "porque",
                          "como chegou nisso",
                          "como voce chegou nisso",
                          "explique",
                          "me explique",
                          "explica"
                      )
                  ) {

                      return context
                          .getSharedPreferences(
                              PREFS,
                              Context.MODE_PRIVATE
                          )
                          .getString(
                              KEY_EXPLANATION,
                              null
                          )
                  }

                  contextualReplacement(
                      context,
                      raw
                  )
                      ?.let {
                          save(
                              context,
                              it
                          )

                          return it.spoken
                      }

                  val answer =
                      solve(raw)
                          ?: return null

                  save(
                      context,
                      answer
                  )

                  return answer.spoken
              }

              private fun contextualReplacement(
                  context: Context,
                  raw: String
              ): Answer? {

                  val normalized =
                      normalize(raw)

                  val match =
                      Regex(
                          """e se (?:o )?(-?\d+(?:[.,]\d+)?) fosse (-?\d+(?:[.,]\d+)?)"""
                      )
                          .find(normalized)
                          ?: return null

                  val oldValue =
                      match.groupValues[1]
                          .replace(
                              ",",
                              "."
                          )

                  val newValue =
                      match.groupValues[2]
                          .replace(
                              ",",
                              "."
                          )

                  val prefs =
                      context
                          .getSharedPreferences(
                              PREFS,
                              Context.MODE_PRIVATE
                          )

                  val expression =
                      prefs.getString(
                          KEY_EXPRESSION,
                          null
                      )
                          ?: return null

                  if (
                      oldValue !in expression
                  ) {
                      return null
                  }

                  val changed =
                      expression.replaceFirst(
                          oldValue,
                          newValue
                      )

                  return solveCanonical(
                      changed
                  )
              }

              private fun save(
                  context: Context,
                  answer: Answer
              ) {

                  context
                      .getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                      )
                      .edit()
                      .putString(
                          KEY_EXPRESSION,
                          answer.expression
                      )
                      .putString(
                          KEY_EXPLANATION,
                          answer.explanation
                      )
                      .apply()

                  ZevronConversationEngine
                      .rememberSubject(
                          context,
                          answer.expression
                      )
              }

              fun solve(
                  raw: String
              ): Answer? {

                  var expression =
                      canonical(raw)

                  expression =
                      expression
                          .removePrefix(
                              "zevron "
                          )
                          .removePrefix(
                              "quanto e "
                          )
                          .removePrefix(
                              "calcule "
                          )
                          .removePrefix(
                              "calcula "
                          )
                          .removePrefix(
                              "resolva "
                          )
                          .removePrefix(
                              "resolve "
                          )
                          .trim()

                  return solveCanonical(
                      expression
                  )
              }

              private fun solveCanonical(
                  expression: String
              ): Answer? {

                  if (
                      "=" in expression &&
                      "x" in expression
                  ) {

                      solveQuadratic(
                          expression
                      )
                          ?.let {
                              return it
                          }

                      solveLinear(
                          expression
                      )
                          ?.let {
                              return it
                          }
                  }

                  if (
                      !looksArithmetic(
                          expression
                      )
                  ) {
                      return null
                  }

                  val value =
                      runCatching {
                          ExpressionParser(
                              expression
                          )
                              .parse()
                      }
                          .getOrNull()
                          ?: return null

                  if (
                      !value.isFinite()
                  ) {
                      return null
                  }

                  val pretty =
                      pretty(value)

                  return Answer(
                      spoken = pretty,
                      explanation =
                          "O resultado é $pretty. Fiz o cálculo diretamente.",
                      expression =
                          expression
                  )
              }

              private fun solveLinear(
                  expression: String
              ): Answer? {

                  val sides =
                      expression.split("=")

                  if (
                      sides.size != 2
                  ) {
                      return null
                  }

                  val left =
                      parseLinearSide(
                          sides[0]
                      )
                          ?: return null

                  val right =
                      parseLinearSide(
                          sides[1]
                      )
                          ?: return null

                  val coefficient =
                      left.first -
                      right.first

                  val constant =
                      right.second -
                      left.second

                  if (
                      abs(coefficient) <
                      0.0000001
                  ) {
                      return null
                  }

                  val value =
                      constant /
                      coefficient

                  val result =
                      pretty(value)

                  return Answer(
                      spoken =
                          "x é igual a $result.",
                      explanation =
                          "Passei os termos com x para um lado e os números para o outro. Ficou ${pretty(coefficient)}x igual a ${pretty(constant)}, então x é $result.",
                      expression =
                          expression
                  )
              }

              private fun solveQuadratic(
                  expression: String
              ): Answer? {

                  val compact =
                      expression
                          .replace(
                              " ",
                              ""
                          )
                          .replace(
                              "²",
                              "^2"
                          )

                  val match =
                      Regex(
                          """([+-]?\d*(?:\.\d+)?)x\^2([+-]\d*(?:\.\d+)?)x([+-]\d*(?:\.\d+)?)=0"""
                      )
                          .matchEntire(
                              compact
                          )
                          ?: return null

                  fun coefficient(
                      value: String
                  ): Double {

                      return when (
                          value
                      ) {

                          "",
                          "+" ->
                              1.0

                          "-" ->
                              -1.0

                          else ->
                              value.toDouble()
                      }
                  }

                  val a =
                      coefficient(
                          match.groupValues[1]
                      )

                  val b =
                      coefficient(
                          match.groupValues[2]
                      )

                  val c =
                      match.groupValues[3]
                          .toDouble()

                  if (
                      abs(a) <
                      0.0000001
                  ) {
                      return null
                  }

                  val delta =
                      b * b -
                      4.0 * a * c

                  if (
                      delta < 0.0
                  ) {

                      return Answer(
                          spoken =
                              "Essa equação não tem raízes reais.",
                          explanation =
                              "O discriminante é ${pretty(delta)}, portanto não existem raízes reais.",
                          expression =
                              expression
                      )
                  }

                  val root =
                      sqrt(delta)

                  val x1 =
                      (-b + root) /
                      (2.0 * a)

                  val x2 =
                      (-b - root) /
                      (2.0 * a)

                  val spoken =
                      if (
                          abs(x1 - x2) <
                          0.0000001
                      ) {

                          "x é igual a ${pretty(x1)}."

                      } else {

                          "As raízes são ${pretty(x1)} e ${pretty(x2)}."
                      }

                  return Answer(
                      spoken =
                          spoken,
                      explanation =
                          "Usei a fórmula de Bhaskara. O discriminante é ${pretty(delta)} e as raízes são ${pretty(x1)} e ${pretty(x2)}.",
                      expression =
                          expression
                  )
              }

              private fun parseLinearSide(
                  side: String
              ): Pair<Double, Double>? {

                  val compact =
                      side.replace(
                          " ",
                          ""
                      )

                  if (
                      compact.isBlank()
                  ) {
                      return null
                  }

                  val signed =
                      if (
                          compact.startsWith(
                              "-"
                          ) ||
                          compact.startsWith(
                              "+"
                          )
                      ) {
                          compact
                      } else {
                          "+$compact"
                      }

                  val terms =
                      Regex(
                          """[+-][^+-]+"""
                      )
                          .findAll(
                              signed
                          )
                          .map {
                              it.value
                          }
                          .toList()

                  var x =
                      0.0

                  var number =
                      0.0

                  for (
                      term in terms
                  ) {

                      if (
                          "x" in term
                      ) {

                          val coefficient =
                              term.replace(
                                  "x",
                                  ""
                              )

                          x += when (
                              coefficient
                          ) {

                              "+",
                              "" ->
                                  1.0

                              "-" ->
                                  -1.0

                              else ->
                                  coefficient
                                      .toDoubleOrNull()
                                      ?: return null
                          }

                      } else {

                          number +=
                              term.toDoubleOrNull()
                                  ?: return null
                      }
                  }

                  return x to number
              }

              private fun canonical(
                  raw: String
              ): String {

                  var text =
                      raw.lowercase(
                          Locale.ROOT
                      )
                          .replace(
                              "²",
                              "^2"
                          )

                  text =
                      Normalizer.normalize(
                          text,
                          Normalizer.Form.NFD
                      )
                          .replace(
                              Regex("\\p{M}+"),
                              ""
                          )

                  return text
                      .replace(
                          "×",
                          "*"
                      )
                      .replace(
                          "÷",
                          "/"
                      )
                      .replace(
                          " vezes ",
                          " * "
                      )
                      .replace(
                          " multiplicado por ",
                          " * "
                      )
                      .replace(
                          " dividido por ",
                          " / "
                      )
                      .replace(
                          " dividido ",
                          " / "
                      )
                      .replace(
                          " mais ",
                          " + "
                      )
                      .replace(
                          " menos ",
                          " - "
                      )
                      .replace(
                          ",",
                          "."
                      )
                      .replace(
                          Regex(
                              """[^a-z0-9x+\-*/^().= ]+"""
                          ),
                          " "
                      )
                      .replace(
                          Regex("\\s+"),
                          " "
                      )
                      .trim()
              }

              private fun looksArithmetic(
                  expression: String
              ): Boolean {

                  if (
                      !Regex("\\d")
                          .containsMatchIn(
                              expression
                          )
                  ) {
                      return false
                  }

                  if (
                      !Regex(
                          """[+\-*/^()]"""
                      )
                          .containsMatchIn(
                              expression
                          )
                  ) {
                      return false
                  }

                  val withoutX =
                      expression.replace(
                          "x",
                          ""
                      )

                  return !Regex(
                      """[a-wyz]"""
                  )
                      .containsMatchIn(
                          withoutX
                      )
              }

              private fun pretty(
                  value: Double
              ): String {

                  val rounded =
                      round(value)

                  if (
                      abs(
                          value -
                          rounded
                      ) <
                      0.0000001
                  ) {

                      return rounded
                          .toLong()
                          .toString()
                  }

                  return String.format(
                      Locale.US,
                      "%.6f",
                      value
                  )
                      .trimEnd('0')
                      .trimEnd('.')
              }

              private fun normalize(
                  value: String
              ): String {

                  return Normalizer.normalize(
                      value.lowercase(
                          Locale.ROOT
                      ),
                      Normalizer.Form.NFD
                  )
                      .replace(
                          Regex("\\p{M}+"),
                          ""
                      )
                      .replace(
                          Regex(
                              "[^a-z0-9., ]+"
                          ),
                          " "
                      )
                      .replace(
                          Regex("\\s+"),
                          " "
                      )
                      .trim()
              }

              private class ExpressionParser(
                  private val input: String
              ) {

                  private var index =
                      0

                  fun parse(): Double {

                      val value =
                          expression()

                      skip()

                      if (
                          index != input.length
                      ) {
                          error(
                              "Entrada inesperada."
                          )
                      }

                      return value
                  }

                  private fun expression(): Double {

                      var value =
                          term()

                      while (true) {

                          skip()

                          value =
                              when {

                                  take('+') ->
                                      value +
                                      term()

                                  take('-') ->
                                      value -
                                      term()

                                  else ->
                                      return value
                              }
                      }
                  }

                  private fun term(): Double {

                      var value =
                          power()

                      while (true) {

                          skip()

                          value =
                              when {

                                  take('*') ->
                                      value *
                                      power()

                                  take('/') ->
                                      value /
                                      power()

                                  else ->
                                      return value
                              }
                      }
                  }

                  private fun power(): Double {

                      var value =
                          unary()

                      skip()

                      if (
                          take('^')
                      ) {

                          value =
                              Math.pow(
                                  value,
                                  power()
                              )
                      }

                      return value
                  }

                  private fun unary(): Double {

                      skip()

                      if (
                          take('+')
                      ) {
                          return unary()
                      }

                      if (
                          take('-')
                      ) {
                          return -unary()
                      }

                      return primary()
                  }

                  private fun primary(): Double {

                      skip()

                      if (
                          take('(')
                      ) {

                          val value =
                              expression()

                          if (
                              !take(')')
                          ) {
                              error(
                                  "Parêntese ausente."
                              )
                          }

                          return value
                      }

                      val start =
                          index

                      while (
                          index <
                          input.length &&
                          (
                              input[index]
                                  .isDigit() ||
                              input[index] ==
                              '.'
                          )
                      ) {
                          index++
                      }

                      if (
                          start ==
                          index
                      ) {
                          error(
                              "Número esperado."
                          )
                      }

                      return input.substring(
                          start,
                          index
                      )
                          .toDouble()
                  }

                  private fun skip() {

                      while (
                          index <
                          input.length &&
                          input[index]
                              .isWhitespace()
                      ) {
                          index++
                      }
                  }

                  private fun take(
                      char: Char
                  ): Boolean {

                      skip()

                      if (
                          index <
                          input.length &&
                          input[index] ==
                          char
                      ) {

                          index++

                          return true
                      }

                      return false
                  }
              }
          }
