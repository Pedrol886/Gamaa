name: Build Gama 8.3.0 JARVIS Tools APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-gama.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-8-3-0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GAMA_BASE_RUN_ID: "37119165969"
      GAMA_BASE_ARTIFACT: "Gama-8.2.2-JARVIS-2000-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified Gama 8.2.2 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaAdaptiveMemory.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaRecoveryCoordinator.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaVisionCore.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/LocalBrain.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/AiSetup.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaModelInstallPolicy.kt

      - name: Verify 8.2.2 base
        working-directory: _gama_build
        run: |
          set -euo pipefail
          SRC="app/src/main/java/com/gama/assistant"

          grep -Fq 'GAMA2000_LOCAL_VISION_ROUTER' "$SRC/GamaService.kt"
          grep -Fq 'ACTION_UI_PULSE' "$SRC/GamaService.kt"
          grep -Fq 'GamaAdaptiveMemory' "$SRC/GamaSuperAssistantCore.kt"
          grep -Fq 'GamaRecoveryCoordinator.nextDelayMs(' "$SRC/GamaService.kt"
          grep -Fq 'GamaMissionStore' "$SRC/GamaService.kt"
          grep -Fq 'GamaProactiveBridge' "$SRC/GamaService.kt"
          grep -Fq 'GamaAutomationEngine' "$SRC/GamaService.kt"
          grep -Fq 'interruptSpeechForBargeIn' "$SRC/GamaService.kt"
          grep -Fq 'GamaModelInstallPolicy.isStalled(' "$SRC/AiSetup.kt"
          grep -Fq 'control("Importar IA do celular")' "$SRC/MainActivity.kt"
          grep -Fq 'LlmInference' "$SRC/LocalBrain.kt"
          grep -Fq 'implementation("com.google.mediapipe:tasks-genai:0.10.27")' app/build.gradle.kts
          grep -Fq 'implementation("com.google.mlkit:text-recognition:16.0.1")' app/build.gradle.kts

          echo "Gama 8.2.2 base verified."

      - name: Apply Gama 8.3.0 JARVIS reliability patch
        working-directory: _gama_build
        run: |
          set -euo pipefail

          cat > /tmp/gama-8.3.0.patch.gz.b64 <<'PATCH64'
          
          PATCH64

          base64 --decode /tmp/gama-8.3.0.patch.gz.b64 | gzip -dc > /tmp/gama-8.3.0.patch
          git apply --check /tmp/gama-8.3.0.patch
          git apply /tmp/gama-8.3.0.patch

          SRC="app/src/main/java/com/gama/assistant"
          TEST="app/src/test/java/com/gama/assistant"

          test -s "$SRC/GamaCriticalCommandPolicy.kt"
          test -s "$TEST/GamaCriticalCommandPolicyTest.kt"
          grep -Fq 'continuePlanAfterToolAction(360L)' "$SRC/GamaService.kt"
          grep -Fq 'GamaCriticalCommandPolicy.isLockScreen' "$SRC/GamaService.kt"
          grep -Fq 'dispatchGesture' "$SRC/GamaScreenContextService.kt"
          grep -Fq 'Mode.LIVE_SEARCH' "$SRC/GamaOnlineRouter.kt"
          grep -Fq 'fun liveSearch(query: String)' "$SRC/GamaInternetHub.kt"
          grep -Fq '15 horas' "$TEST/ZevronCalendarFlowTest.kt"
          grep -Fq 'lockThenRestBecomesPlan' "$TEST/ZevronPlannerTest.kt"

          echo "Gama 8.3.0 reliability patch applied."

      - name: Audit consolidated capabilities
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 tools/audit_gama.py

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set Gama 8.3.0 build version
        working-directory: _gama_build
        run: |
          set -euo pipefail
          VC=$((22700000 + GITHUB_RUN_NUMBER))
          sed -Ei "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $VC/" app/build.gradle.kts
          sed -Ei 's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "Gama 8.3.0"/' app/build.gradle.kts
          grep -F 'versionName = "Gama 8.3.0"' app/build.gradle.kts

      - name: Run regression tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            --tests 'com.gama.assistant.GamaRecognitionPolicyTest' \
            --tests 'com.gama.assistant.GamaAudioFrontEndTest' \
            --tests 'com.gama.assistant.ConversationSessionTest' \
            --tests 'com.gama.assistant.VoicePolicyTest' \
            --tests 'com.gama.assistant.ActionFollowUpTest' \
            --tests 'com.gama.assistant.GamaSpeechNoisePolicyTest' \
            --tests 'com.gama.assistant.GamaModelInstallPolicyTest' \
            --tests 'com.gama.assistant.GamaCriticalCommandPolicyTest' \
            --tests 'com.gama.assistant.ZevronPlannerTest' \
            --tests 'com.gama.assistant.ZevronCalendarFlowTest' \
            --tests 'com.gama.assistant.ZevronSystemControlTest' \
            --tests 'com.gama.assistant.GamaOnlineRouterTest' \
            --tests 'com.gama.assistant.FreshnessPolicyTest' \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Build and verify Gama 8.3.0 APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          if [ -x tools/download_models.sh ]; then
            bash tools/download_models.sh
          fi

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"

          mkdir -p dist
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" dist/Gama.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            dist/Gama.apk

          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)

      - name: Upload Gama 8.3.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.3.0-JARVIS-TOOLS-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
          if-no-files-found: error

      - name: Upload Gama 8.3.0 source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.3.0-JARVIS-TOOLS-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Publish Gama 8.3.0 release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="gama-v8.3.0-jarvis-tools-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 8.3.0 JARVIS Tools" \
            --notes "Evolução sobre o source aprovado do run #123. Melhora reconhecimento do comando de bloqueio, executa sequências como bloquear e depois descansar, reforça rolagem por acessibilidade com gesto de fallback, permite OCR/leitura real da tela, entende horários naturais de agenda como 15 horas e consulta a Internet para perguntas atuais que exigem fonte fresca. Mantém IA offline, memória, conversa contínua, proatividade, automações e recuperação automática." \
            --latest

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-8.3.0-JARVIS-TOOLS-diagnostics
          path: |
            gama-build.log
            gama-tests.log
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn
