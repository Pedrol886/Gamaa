              package com.gama.assistant

              object GamaRecoveryManager {
                  const val MAX_BRAIN_RETRIES = 1

                  fun brainRetryDelayMs(
                      attempt: Int
                  ): Long =
                      when (attempt) {
                          0 -> 350L
                          else -> 850L
                      }

                  fun neutralRepeatRequest(): String =
                      "Não entendi essa parte. Pode repetir?"
              }
