              fun policies(
                  kind: GamaPolicyKind? = null,
                  enabledOnly: Boolean = true,
              ): List<GamaPolicyRecord> {
                  val selection =
                      buildList {
                          if (enabledOnly) {
                              add("enabled=1")
                          }

                          if (kind != null) {
                              add("kind=?")
                          }
                      }
                          .joinToString(
                              " AND "
                          )
                          .takeIf {
                              it.isNotBlank()
                          }

                  val args =
                      if (kind != null) {
                          arrayOf(
                              kind.name
                          )
                      } else {
                          null
                      }

                  val result =
                      mutableListOf<GamaPolicyRecord>()

                  readableDatabase
                      .query(
                          "policy",
                          null,
                          selection,
                          args,
                          null,
                          null,
                          "updated_at DESC",
                      )
                      .use { cursor ->
                          while (
                              cursor.moveToNext()
                          ) {
                              result +=
                                  cursor.toPolicy()
                          }
                      }

                  return result
              }

              private fun Cursor.toPolicy():
                  GamaPolicyRecord =
