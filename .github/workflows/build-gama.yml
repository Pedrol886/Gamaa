      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Portuguese offline speech model
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip" \
            -o /tmp/vosk.zip
          rm -rf /tmp/vosk app/src/main/assets/model
          mkdir -p /tmp/vosk
          unzip -q /tmp/vosk.zip -d /tmp/vosk
          mv /tmp/vosk/vosk-model-small-pt-0.3 app/src/main/assets/model

      - name: Download offline speaker verification model
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 \
            "https://alphacephei.com/vosk/models/vosk-model-spk-0.4.zip" \
            -o /tmp/vosk-spk.zip
          rm -rf /tmp/vosk-spk app/src/main/assets/spk-model
          mkdir -p /tmp/vosk-spk
          unzip -q /tmp/vosk-spk.zip -d /tmp/vosk-spk
          mv /tmp/vosk-spk/vosk-model-spk-0.4 app/src/main/assets/spk-model

      - name: Verify AndroidX config
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^android.useAndroidX=true$' gradle.properties
          grep -q '^android.enableJetifier=true$' gradle.properties

      - name: Build APK
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Kavus.apk
          ls -lh Kavus.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kavus-APK
          path: Kavus.apk
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="kavus-${{ github.run_number }}"
          gh release create "$TAG" Kavus.apk \
            --title "Kavus $TAG" \
            --notes "Kavus v29: melhora a identificação do dono com 5 amostras de frases diferentes, vetores normalizados, perfil com múltiplas amostras e limiar adaptativo. A palavra Kavus apenas abre a escuta; nenhum comando é executado antes da verificação da voz do dono. Comandos com evidência de voz insuficiente são recusados em vez de reduzir a segurança. A voz TTS atual foi mantida sem alterações. O desbloqueio continua seguro e não contorna PIN, biometria ou a proteção do Android."
