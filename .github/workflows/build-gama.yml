      - name: Version and source audit
        working-directory: _gama_build
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/gama-unified-audit.py" <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path('.')
          src = root / 'app/src/main/java/com/gama/assistant'
          gradle_path = root / 'app/build.gradle.kts'
          manifest_path = root / 'app/src/main/AndroidManifest.xml'

          required = [
              src / 'GamaService.kt',
              src / 'VoicePolicy.kt',
              src / 'GamaAppRegistry.kt',
              src / 'GamaInstalledAppCatalog.kt',
              src / 'GamaGeminiClient.kt',
              src / 'GamaGeminiPolicy.kt',
              src / 'GamaGeminiSecureStore.kt',
              src / 'GamaGeminiSettingsActivity.kt',
              src / 'GamaGeminiControl.kt',
              src / 'GamaWakePhrasePolicy.kt',
              src / 'GamaPersonalTools.kt',
              src / 'GamaSuperAssistantCore.kt',
              src / 'GamaScreenContextService.kt',
          ]
          for file in required:
              if not file.is_file() or file.stat().st_size == 0:
                  raise SystemExit(f'required file missing: {file}')

          kt_files = list(src.glob('*.kt'))
          kt_lines = sum(len(p.read_text(encoding='utf-8').splitlines()) for p in kt_files)
          base_files = int(os.environ['BASE_KT_FILES'])
          base_lines = int(os.environ['BASE_KT_LINES'])

          if len(kt_files) < base_files:
              raise SystemExit(f'regression: Kotlin files fell from {base_files} to {len(kt_files)}')
          if kt_lines < base_lines:
              raise SystemExit(f'regression: Kotlin lines fell from {base_lines} to {kt_lines}')
          if kt_lines < 30000:
              raise SystemExit(f'Unified source unexpectedly small: {kt_lines} Kotlin lines')

          service = (src / 'GamaService.kt').read_text(encoding='utf-8')
          voice = (src / 'VoicePolicy.kt').read_text(encoding='utf-8')
          registry = (src / 'GamaAppRegistry.kt').read_text(encoding='utf-8')
          catalog = (src / 'GamaInstalledAppCatalog.kt').read_text(encoding='utf-8')
          gemini = (src / 'GamaGeminiClient.kt').read_text(encoding='utf-8')
          secure = (src / 'GamaGeminiSecureStore.kt').read_text(encoding='utf-8')
          manifest = manifest_path.read_text(encoding='utf-8')
          all_text = '\\n'.join(p.read_text(encoding='utf-8', errors='ignore') for p in root.rglob('*') if p.is_file() and p.suffix in {'.kt','.xml','.kts','.md','.py','.sh'})

          checks = [
              ('unified brain routed', 'tryGeminiUnifiedBrain(' in service),
              ('dynamic installed apps routed', 'GamaInstalledAppCatalog.resolveName' in service and '.resolveOpenRequest(' in service),
              ('Gemini endpoint', 'generativelanguage.googleapis.com' in gemini),
              ('Gemini header auth', 'x-goog-api-key' in gemini),
              ('Gemini model discovery', 'discoverModels' in gemini),
              ('Android Keystore', 'AndroidKeyStore' in secure),
              ('dynamic app catalog', 'queryIntentActivities' in catalog and 'LauncherApps' in catalog),
              ('special wake phrase', 'acorda crianca papai chegou' in voice),
              ('Gemini settings activity', '.GamaGeminiSettingsActivity' in manifest),
              ('launcher visibility queries', '<queries>' in manifest and 'android.intent.category.LAUNCHER' in manifest),
              ('no QUERY_ALL_PACKAGES', 'android.permission.QUERY_ALL_PACKAGES' not in manifest),
              ('fresh install release non-debuggable', 'isDebuggable = false' in gradle_path.read_text(encoding='utf-8')),
          ]
          failed = [name for name, ok in checks if not ok]
          if failed:
              raise SystemExit('Unified invariant missing: ' + ', '.join(failed))

          # A key must never be baked into the APK/workflow/source.
          secret_patterns = [
              re.compile(r'AIza[A-Za-z0-9_\-]{20,}'),
              re.compile(r'AQ\.[A-Za-z0-9_\-]{20,}'),
          ]
          for pattern in secret_patterns:
              if pattern.search(all_text):
                  raise SystemExit('Possible API credential embedded in source. Refusing build.')

          gradle = gradle_path.read_text(encoding='utf-8')
          version_code = 25_500_000 + int(os.environ['GITHUB_RUN_NUMBER'])
          gradle, code_count = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {version_code}', gradle, count=1)
          gradle, name_count = re.subn(r'versionName\s*=\s*"[^"]*"', 'versionName = "Gama 10.5.0 Unified Brain Gemini"', gradle, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('version update failed')
          gradle_path.write_text(gradle, encoding='utf-8')

          print(f'PASS: {len(kt_files)} Kotlin files, {kt_lines} lines; versionCode={version_code}')
          PY

          python3 -m py_compile "$GITHUB_WORKSPACE/gama-unified-audit.py"
          python3 "$GITHUB_WORKSPACE/gama-unified-audit.py"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Gradle wrapper
        working-directory: _gama_build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew clean --no-daemon --stacktrace

      - name: Compile Release Kotlin
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-compile.log"

      - name: Unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew test --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew lint --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-lint.log"

      - name: Prepare offline models
        working-directory: _gama_build
        run: |
          set -euo pipefail
          if [ -x tools/download_models.sh ]; then
            bash tools/download_models.sh
          fi

      - name: Assemble Release
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-release.log"

      - name: Sign Release APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          mkdir -p dist

          input_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | head -n 1)"
          if [ -z "$input_apk" ] || [ ! -s "$input_apk" ]; then
            echo "::error::APK Release não encontrado após assembleRelease."
            exit 1
          fi

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          "$ZIPALIGN" -f 4 "$input_apk" dist/Gama-aligned.apk

          rm -f /tmp/gama-unified172.jks
          keytool -genkeypair \
            -keystore /tmp/gama-unified172.jks \
            -storepass GamaUnified2026 \
            -keypass GamaUnified2026 \
            -alias gama \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Gama Unified Test,O=Gama,C=BR"

          "$APKSIGNER" sign \
            --ks /tmp/gama-unified172.jks \
            --ks-key-alias gama \
            --ks-pass pass:GamaUnified2026 \
            --key-pass pass:GamaUnified2026 \
            --out dist/Gama.apk \
            dist/Gama-aligned.apk

          rm -f dist/Gama-aligned.apk /tmp/gama-unified172.jks
          echo "fresh-install-only" > dist/install-mode.txt

      - name: Verify final APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          test -s dist/Gama.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Gama.apk | tee dist/signature-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Gama.apk > dist/apk-info.txt

          grep -q "name='com.gama.assistant'" dist/apk-info.txt
          grep -q "versionName='Gama 10.5.0 Unified Brain Gemini'" dist/apk-info.txt
          EXPECTED_VERSION_CODE="$((25500000 + GITHUB_RUN_NUMBER))"
          grep -q "versionCode='$EXPECTED_VERSION_CODE'" dist/apk-info.txt

          if grep -q 'application-debuggable' dist/apk-info.txt; then
            echo "::error::APK final está debuggable."
            exit 1
          fi

          (
            cd dist
            sha256sum Gama.apk > Gama.apk.sha256
            sha256sum -c Gama.apk.sha256
          )
          echo "PASS: _gama_build/dist/Gama.apk existe, está assinado e foi verificado."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.5.0-UNIFIED172-FRESH-INSTALL-ONLY
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.5.0-UNIFIED172-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.5.0-UNIFIED172-diagnostics-${{ github.run_number }}
          path: |
            gama-unified-audit.py
            gama-unified.patch
            gama-compile.log
            gama-tests.log
            gama-lint.log
            gama-release.log
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: warn

      - name: Publish APK in Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="gama-v10.5.0-unified-${{ github.run_number }}"
          gh release create \
            "$TAG" \
            "_gama_build/dist/Gama.apk#Gama.apk" \
            "_gama_build/dist/Gama.apk.sha256#Gama.apk.sha256" \
            "_gama_build/dist/install-mode.txt#install-mode.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gama 10.5.0 Unified Brain Gemini" \
            --notes "Base NATURAL171 preservada. Adiciona Gemini opcional com chave protegida localmente, cérebro unificado, descoberta dinâmica de apps instalados, frase especial de despertar e travas anti-regressão. Nenhuma chave de API é embutida no APK." \
            --latest
