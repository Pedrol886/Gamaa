          grep -Fq \
            'GamaMemoryConsentPolicy.allowAdaptiveLearning' \
            "$SRC/GamaSuperAssistantCore.kt"

          grep -Fq \
            'GamaTimerRouter.recognizes(raw)' \
            "$SRC/ZevronPlanner.kt"

          grep -Fq \
            'GamaWebsiteRouter.recognizes(raw)' \
            "$SRC/ZevronPlanner.kt"

          grep -Fq \
            'GamaSystemActionRouter.recognizes(raw)' \
            "$SRC/ZevronPlanner.kt"

          grep -Fq \
            'AlarmClock.ACTION_SET_TIMER' \
            "$SRC/GamaDeviceTools.kt"

          grep -Fq \
            'GLOBAL_ACTION_NOTIFICATIONS' \
            "$SRC/GamaDeviceTools.kt"

          grep -Fq \
            'GLOBAL_ACTION_QUICK_SETTINGS' \
            "$SRC/GamaDeviceTools.kt"

          grep -Fq \
