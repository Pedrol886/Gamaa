name: Build Gama 3.9.2 APK (WhatsApp fast launch fix)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write

concurrency:
  group: gama-${{ github.ref }}
  cancel-in-progress: false

