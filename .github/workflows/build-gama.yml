name: Build Gama JARVIS POTENTE FIX107 RELEASE APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-fix107-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      GAMA_BASE_RUN_ID: "37010949358"
      GAMA_BASE_ARTIFACT: "Gama-JARVIS-POTENTE-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last Gama source that built successfully
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build
          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build
          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaCalendarManager.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaWhatsAppAutomation.kt
          test -s _gama_build/tools/download_models.sh

      - name: Apply Gama FIX106 complete actions patch
