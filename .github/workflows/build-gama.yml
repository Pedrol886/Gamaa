          grep -Fq 'tryHandleRawOnlineBeforeContext(command)' "$SERVICE"
          grep -Fq 'Intent.ACTION_BATTERY_CHANGED' "$SERVICE"
          grep -Fq 'Intent.makeMainActivity' "$LAUNCHER"
