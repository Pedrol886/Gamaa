name: Build Gama 13.7 FIX204 APP AND WAKE REPAIR APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: gama-fix204-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      GAMA_BASE_RUN_ID: "37609751648"
      GAMA_BASE_ARTIFACT: "Gama-12.1-LOCAL-VOICE-FIX187-source"
      GAMA_FIX193_COMMIT: "5602684eca7dd692f32be3c3d6a9e28e3d5d4b33"
      GAMA_MODEL_URL: "https://huggingface.co/litert-community/Qwen3-0.6B-int4/resolve/main/qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm?download=true"
      GAMA_MODEL_SHA256: "2df6821ec12702dafd33915e7a1a1adc7c4b053f3672fd9555dfaf3a114c4139"
      GAMA_MODEL_SIZE: "347251840"
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore proven FIX187 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _gama_build
          gh run download "$GAMA_BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$GAMA_BASE_ARTIFACT" --dir _gama_build
          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaLocalLlm.kt
          test -f _gama_build/gradlew
          chmod +x _gama_build/gradlew

      - name: Recover and apply FIX193
        run: |
          set -euo pipefail
          git cat-file -e "$GAMA_FIX193_COMMIT^{commit}"
          git show "$GAMA_FIX193_COMMIT:.github/workflows/build-gama.yml" > "$RUNNER_TEMP/fix193.yml"
          python3 - <<'PY_FIX193'
          from pathlib import Path
          import os,textwrap
          lines=(Path(os.environ['RUNNER_TEMP'])/'fix193.yml').read_text().splitlines()
          start=next((i+1 for i,l in enumerate(lines) if 'cat > "$RUNNER_TEMP/gama193.patch"' in l and 'GAMA193_PATCH' in l),None)
          if start is None: raise SystemExit('FIX193 patch start not found')
          end=next((i for i in range(start,len(lines)) if lines[i].strip()=='GAMA193_PATCH'),None)
          if end is None: raise SystemExit('FIX193 patch end not found')
          patch=textwrap.dedent('\n'.join(lines[start:end])).rstrip()+'\n'
          for required in ('GamaService.kt','GamaLocalLlm.kt','GamaReliableAppLauncher.kt','GamaOnlineRouter.kt','GamaInstalledAppCatalog.kt'):
              if required not in patch: raise SystemExit('Missing FIX193 file: '+required)
          Path('/tmp/gama193.patch').write_text(patch)
          PY_FIX193
          (cd _gama_build && patch -p1 --forward --batch < /tmp/gama193.patch)

      - name: FIX197 search prefix correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_gama_build/app/src/main/java/com/gama/assistant/GamaOnlineRouter.kt')
          s=p.read_text()
          start=s.find('fun classify(raw: String): Mode {')
          if start<0: raise SystemExit('FIX197 classify anchor not found')
          old='val c = normalize(raw)'
          new='val c = normalize(raw).removePrefix("gama ").trim()'
          pos=s.find(old,start,start+1200)
          if new not in s[start:start+1200]:
              if pos<0: raise SystemExit('FIX197 normalize anchor not found')
              s=s[:pos]+new+s[pos+len(old):]
          p.write_text(s)
          PY

      - name: Install FIX201 red animated orb
        working-directory: _gama_build
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/gama/assistant
          cat > app/src/main/java/com/gama/assistant/GamaEnergyView.kt <<'KOTLIN'
          package com.gama.assistant
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.util.AttributeSet
          import android.view.View
          import android.view.animation.LinearInterpolator
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.min
          import kotlin.math.sin

          class GamaEnergyView @JvmOverloads constructor(context: Context, attrs: AttributeSet? = null): View(context,attrs) {
              enum class Mode { LISTENING, THINKING, SPEAKING }
              var mode = Mode.LISTENING
                  set(value) { field=value; invalidate() }
              private var phase=0f
              private val pen=Paint(Paint.ANTI_ALIAS_FLAG).apply { style=Paint.Style.STROKE; strokeCap=Paint.Cap.ROUND }
              private val glow=Paint(Paint.ANTI_ALIAS_FLAG)
              private val animator=ValueAnimator.ofFloat(0f,1f).apply {
                  duration=1400L; repeatCount=ValueAnimator.INFINITE; interpolator=LinearInterpolator()
                  addUpdateListener { phase=it.animatedValue as Float; invalidate() }
              }
              override fun onAttachedToWindow() { super.onAttachedToWindow(); if (!animator.isStarted) animator.start() }
              override fun onDetachedFromWindow() { animator.cancel(); super.onDetachedFromWindow() }
              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val size=min(width,height).toFloat(); if(size<=0f) return
                  val cx=width/2f; val cy=height/2f; val t=phase*PI*2
                  val activity=when(mode) { Mode.LISTENING->0.12f; Mode.THINKING->0.5f; Mode.SPEAKING->1f }
                  val pulse=((1+sin(t*(1+activity*2)))/2).toFloat()
                  glow.color=Color.argb((25+activity*pulse*75).toInt(),255,20,25)
                  canvas.drawCircle(cx,cy,size*(0.19f+activity*pulse*0.025f),glow)
                  val rings=when(mode) { Mode.LISTENING->4; Mode.THINKING->5; Mode.SPEAKING->6 }
                  for (ring in 0 until rings) {
                      val path=Path(); val base=size*(0.27f+ring*0.028f)
                      for(i in 0..128) {
                          val a=i*2*PI/128
                          val wobble=sin(a*(4+ring)+t*(0.7+activity*3))*size*(0.004+activity*0.035)
                          val radius=base+wobble.toFloat()
                          val x=cx+cos(a).toFloat()*radius; val y=cy+sin(a).toFloat()*radius
                          if(i==0) path.moveTo(x,y) else path.lineTo(x,y)
                      }
                      path.close(); pen.color=Color.argb((220-ring*23).coerceAtLeast(65),255,25,30)
                      pen.strokeWidth=size*(0.003f+activity*0.002f)
                      canvas.drawPath(path,pen)
                  }
              }
              fun release() { animator.cancel() }
          }
          KOTLIN

      - name: Install FIX201 app aliases and safe launcher
        working-directory: _gama_build
        run: |
          set -euo pipefail
          cat > app/src/main/java/com/gama/assistant/GamaUniversalAppLauncher.kt <<'KOTLIN'
          package com.gama.assistant
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.ComponentName
          import java.text.Normalizer
          import java.util.Locale

          object GamaUniversalAppLauncher {
              data class Result(val started:Boolean,val label:String)
              fun normalize(raw:String):String = Normalizer.normalize(raw.lowercase(Locale.ROOT),Normalizer.Form.NFD)
                  .replace(Regex("\\p{M}+"),"").replace(Regex("[^a-z0-9 ]+")," ").replace(Regex("\\s+")," ").trim()
              private val aliases=mapOf("zap" to "whatsapp", "watsap" to "whatsapp", "watsapp" to "whatsapp", "insta" to "instagram", "yt" to "youtube")
              fun target(raw:String):String? {
                  val s=normalize(raw).removePrefix("gama ").trim()
                  val match=Regex("^(abrir|abra|abre|abri|abril|iniciar|inicie|executar|execute) (.+)$").find(s) ?: return null
                  val name=match.groupValues[2].replace(Regex("^(o|a|app|aplicativo|do|da) +"),"").trim()
                  if(name.isBlank() || name.contains(" site ") || name.startsWith("site ") || name.contains(" ponto ") || Regex("[a-z0-9]+ (com|org|net|br)$").containsMatchIn(name)) return null
                  return aliases[name] ?: name
              }
              @Suppress("DEPRECATION")
              fun launchIfRequested(context:Context,raw:String):Result? {
                  val name=target(raw) ?: return null
                  val pm=context.packageManager
                  val known=mapOf("whatsapp" to "com.whatsapp", "instagram" to "com.instagram.android", "youtube" to "com.google.android.youtube", "chrome" to "com.android.chrome", "telegram" to "org.telegram.messenger", "spotify" to "com.spotify.music", "discord" to "com.discord", "calculadora" to "com.google.android.calculator")
                  val intent=Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val candidates=pm.queryIntentActivities(intent,PackageManager.MATCH_ALL)
                  val exact=candidates.firstOrNull { normalize(it.loadLabel(pm).toString())==name }
                      ?: candidates.firstOrNull { it.activityInfo.packageName==known[name] }
                  val component=exact?.activityInfo?.let { ComponentName(it.packageName,it.name) }
                  val launch=component?.let { Intent.makeMainActivity(it) } ?: known[name]?.let { pm.getLaunchIntentForPackage(it) }
                  val started=if(launch==null) false else runCatching {
                      launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
                      context.startActivity(launch); true
                  }.getOrDefault(false)
                  return Result(started,name)
              }
          }
          KOTLIN

      - name: Install FIX201 learning and command priority
        working-directory: _gama_build
        run: |
          set -euo pipefail
          cat > app/src/main/java/com/gama/assistant/GamaLearning.kt <<'KOTLIN'
          package com.gama.assistant
          import android.content.Context
          object GamaLearning {
              private fun prefs(c:Context)=c.getSharedPreferences("gama_learned_aliases",Context.MODE_PRIVATE)
              fun handleTeaching(c:Context,raw:String):String? {
                  val s=GamaUniversalAppLauncher.normalize(raw).removePrefix("gama ")
                  val learn=Regex("^(aprenda que|lembre que) ([a-z0-9 ]{2,35}) (significa|e o aplicativo|e o app) ([a-z0-9 ]{2,35})$").find(s)
                  if(learn!=null) {
                      val alias=learn.groupValues[2].trim(); val app=learn.groupValues[4].trim()
                      if(alias in setOf("gama","abrir","bloquear","apagar")) return "Esse apelido está reservado."
                      prefs(c).edit().putString("alias:$alias",app).apply()
                      return "Aprendi que $alias significa $app."
                  }
                  val forget=Regex("^(esqueca|esquece) ([a-z0-9 ]{2,35})$").find(s)
                  if(forget!=null) { val alias=forget.groupValues[2].trim(); prefs(c).edit().remove("alias:$alias").apply(); return "Esqueci $alias." }
                  return null
              }
              fun resolveAppCommand(c:Context,raw:String):String {
                  val target=GamaUniversalAppLauncher.target(raw) ?: return raw
                  val learned=prefs(c).getString("alias:$target",null) ?: return raw
                  return "abrir $learned"
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/gama/assistant/GamaService.kt')
          s=p.read_text()
          needle='if (\n            tryHandleRawBatteryBeforeContext(command)\n        ) return'
          # Locate the existing deterministic routing by its stable function name.
          import re
          m=re.search(r'(?m)^([ \t]*)if\s*\(\s*tryHandleRawBatteryBeforeContext\(command\)\s*\)\s*return',s)
          if not m: raise SystemExit('FIX201 routing anchor missing; refusing unsafe insertion')
          indent=m.group(1)
          injected="""GamaLearning.handleTeaching(this, command)?.let { reply ->
              markResponseStarted()
              speak(reply, false)
              return
          }
          GamaUniversalAppLauncher.launchIfRequested(this, GamaLearning.resolveAppCommand(this,command))?.let { result ->
              markResponseStarted()
              speak(if(result.started) "Abrindo ${result.label}." else "Não consegui abrir ${result.label} neste celular.",false)
              return
          }
          """
          s=s[:m.start()]+''.join(indent+line if line.strip() else line for line in injected.splitlines(True))+s[m.start():]
          p.write_text(s)
          PY

      # ============================================================
      # FIX202: Ferramentas determinísticas e memória de notas
      # ============================================================
      - name: Install FIX202 Android tools and private notes
        working-directory: _gama_build
        run: |
          set -euo pipefail
          cat > app/src/main/java/com/gama/assistant/GamaAssistantTools.kt <<'KOTLIN'
          package com.gama.assistant

          import android.app.KeyguardManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.net.Uri
          import android.os.BatteryManager
          import android.provider.CalendarContract
          import android.provider.AlarmClock
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object GamaAssistantTools {
              private const val STORE = "gama_assistant_notes"
              private const val KEY = "entries"
              private fun normalized(raw: String): String =
                  GamaUniversalAppLauncher.normalize(raw)
                      .removePrefix("gama ").trim()

              private fun open(context: Context, intent: Intent): Boolean =
                  runCatching {
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      context.startActivity(intent)
                      true
                  }.getOrDefault(false)

              private fun browse(context: Context, address: String, label: String): String {
                  val ok = open(context, Intent(Intent.ACTION_VIEW, Uri.parse(address)))
                  return if (ok) "Abrindo $label." else "Não consegui abrir $label."
              }

              private fun battery(context: Context): Int? {
                  val status = context.registerReceiver(
                      null, IntentFilter(Intent.ACTION_BATTERY_CHANGED)
                  ) ?: return null
                  val level = status.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                  val scale = status.getIntExtra(BatteryManager.EXTRA_SCALE, -1)
                  return if (level >= 0 && scale > 0) (100 * level / scale) else null
              }

              fun handle(context: Context, raw: String): String? {
                  val command = normalized(raw)
                  if (command.isEmpty()) return null
                  val prefs = context.getSharedPreferences(STORE, Context.MODE_PRIVATE)

                  if (command in setOf("que horas sao", "horas", "me diga as horas")) {
                      val clock = SimpleDateFormat("HH:mm", Locale("pt", "BR"))
                      return "Agora são ${clock.format(Date())}."
                  }
                  if (command in setOf("qual a bateria", "nivel da bateria", "quanto de bateria tenho")) {
                      return battery(context)?.let { "A bateria está em $it por cento." }
                          ?: "Não consegui verificar a bateria agora."
                  }
                  if (command in setOf("abrir agenda", "minha agenda", "agenda", "abrir calendario", "calendario")) {
                      val ok = open(context, Intent(Intent.ACTION_VIEW, CalendarContract.CONTENT_URI))
                      return if (ok) "Abrindo a agenda." else "Não consegui abrir a agenda."
                  }
                  if (command in setOf("abrir email", "meus emails", "email", "abrir emails")) {
                      val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_APP_EMAIL)
                      return if (open(context, intent)) "Abrindo o e-mail." else "Não encontrei um aplicativo de e-mail."
                  }
                  if (command in setOf("noticias", "ultimas noticias", "abrir noticias")) {
                      return browse(context, "https://news.google.com/", "as notícias")
                  }
                  if (command in setOf("navegador", "abrir navegador")) {
                      return browse(context, "https://www.google.com/", "o navegador")
                  }
                  if (command in setOf("abrir github", "acessar github", "abrir site github")) {
                      return browse(context, "https://github.com/", "GitHub")
                  }
                  if (command in setOf("gama ta ai", "ta ai", "esta ai", "voce ta ai", "voce esta ai")) {
                      return "Estou aqui. Pode falar."
                  }
                  if (command == "minhas notas" || command == "ler minhas notas") {
                      val notes = prefs.getString(KEY, "").orEmpty().lines()
                          .filter { it.isNotBlank() }.takeLast(5)
                      return if (notes.isEmpty()) "Você ainda não tem notas." else
                          "Suas notas recentes: ${notes.joinToString("; ")}."
                  }
                  val note = Regex("^(anote|anota|guarde uma nota|salve uma nota) (.+)$").find(command)
                  if (note != null) {
                      val value = note.groupValues[2].trim().take(400)
                      val current = prefs.getString(KEY, "").orEmpty().lines()
                          .filter { it.isNotBlank() }.takeLast(49)
                      prefs.edit().putString(KEY, (current + value).joinToString("\n")).apply()
                      return "Anotado."
                  }
                  if (command == "apagar minhas notas") {
                      return "Para apagar suas notas, diga: confirme apagar minhas notas."
                  }
                  if (command == "confirme apagar minhas notas") {
                      prefs.edit().remove(KEY).apply()
                      return "Suas notas foram apagadas."
                  }
                  val website = Regex("""^(abrir|acessar|entre no|entrar no) (site |pagina )?([a-z0-9.-]+\.(com|org|net|io|dev|app|br)(\.br)?)$""").find(raw.lowercase(Locale.ROOT).removePrefix("gama ").trim())
                  if (website != null) {
                      val host = website.groupValues[3]
                      return browse(context, "https://$host", host)
                  }
                  val siteSearch = Regex("^(abrir|acessar|entrar no) site (do |da |de )?(.+)$").find(command)
                  if (siteSearch != null) {
                      val term = URLEncoder.encode(siteSearch.groupValues[3] + " site oficial", "UTF-8")
                      return browse(context, "https://www.google.com/search?q=$term", "a pesquisa do site")
                  }
                  if (command == "acorda crianca papai chegou" || command == "acorda crianca pai chegou") {
                      val time = SimpleDateFormat("HH:mm", Locale("pt", "BR")).format(Date())
                      val level = battery(context)
                      val locked = context.getSystemService(KeyguardManager::class.java)?.isDeviceLocked ?: true
                      return buildString {
                          append("Bem-vindo de volta. Agora são $time.")
                          if (level != null) append(" A bateria está em $level por cento.")
                          if (locked) append(" Desbloqueie o Android para consultar informações privadas.")
                      }
                  }
                  return null
              }
          }
          KOTLIN

      # ============================================================
      # FIX202: Memória de contexto e proteção contra falso comando
      # ============================================================
      - name: Install FIX202 conversation memory
        working-directory: _gama_build
        run: |
          set -euo pipefail
          cat > app/src/main/java/com/gama/assistant/GamaConversationMemory.kt <<'KOTLIN'
          package com.gama.assistant

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          object GamaConversationMemory {
              private const val PREFS = "gama_conversation_context"
              private const val KEY = "recent_turns"
              private const val LIMIT = 12

              @Synchronized
              fun remember(context: Context, role: String, content: String) {
                  if (role !in setOf("user", "assistant")) return
                  val clean = content.trim().take(1200)
                  if (clean.isEmpty()) return
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val entries = runCatching {
                      JSONArray(prefs.getString(KEY, "[]"))
                  }.getOrDefault(JSONArray())
                  val updated = JSONArray()
                  val start = (entries.length() - LIMIT + 1).coerceAtLeast(0)
                  for (i in start until entries.length()) updated.put(entries.optJSONObject(i))
                  updated.put(JSONObject().put("role", role).put("content", clean))
                  prefs.edit().putString(KEY, updated.toString()).apply()
              }

              @Synchronized
              fun recent(context: Context): String {
                  val raw = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getString(KEY, "[]") ?: "[]"
                  val entries = runCatching { JSONArray(raw) }.getOrDefault(JSONArray())
                  return buildString {
                      for (i in 0 until entries.length()) {
                          val item = entries.optJSONObject(i) ?: continue
                          val role = if (item.optString("role") == "user") "Usuário" else "Gama"
                          append(role).append(": ").append(item.optString("content")).append('\n')
                      }
                  }.takeLast(6000)
              }

              fun clear(context: Context) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit().remove(KEY).apply()
              }
          }
          KOTLIN

      # ============================================================
      # FIX202: roteamento local antes de IA e antes de apps
      # ============================================================
      - name: Integrate FIX202 tools before app launcher
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_FIX202'
          from pathlib import Path
          p=Path('app/src/main/java/com/gama/assistant/GamaService.kt')
          s=p.read_text(encoding='utf-8')
          marker='GamaLearning.handleTeaching(this, command)?.let { reply ->'
          if marker not in s:
              raise SystemExit('FIX201 learning hook missing: cannot integrate FIX202 safely')
          if 'GamaAssistantTools.handle(this, command)' not in s:
              replacement="""GamaAssistantTools.handle(this, command)?.let { reply ->
              markResponseStarted()
              speak(reply, false)
              return
          }
          """
              s=s.replace(marker,replacement+marker,1)
          p.write_text(s,encoding='utf-8')
          PY_FIX202

      # FIX200: presença, retorno e reconhecimento de fala não devem cair no LLM.
      - name: Integrate FIX200 presence and return briefing
        working-directory: _gama_build
        run: |
          set -euo pipefail
          cat > app/src/main/java/com/gama/assistant/GamaReturnBrief.kt <<'KOTLIN'
          package com.gama.assistant

          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.BatteryManager
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object GamaReturnBrief {
              fun isReturnWake(raw: String): Boolean {
                  val c = GamaUniversalAppLauncher.normalize(raw)
                  return "acorda crianca" in c && ("papai chegou" in c || "pai chegou" in c)
              }
              fun isPresenceWake(raw: String): Boolean {
                  val c = GamaUniversalAppLauncher.normalize(raw).removePrefix("gama ").trim()
                  return c in setOf("ta ai", "esta ai", "voce ta ai", "voce esta ai")
              }
              fun build(context: Context): String {
                  val hour = SimpleDateFormat("HH:mm", Locale("pt", "BR")).format(Date())
                  val battery = runCatching {
                      val status = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                      val level = status?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                      val scale = status?.getIntExtra(BatteryManager.EXTRA_SCALE, -1) ?: -1
                      if (level >= 0 && scale > 0) 100 * level / scale else -1
                  }.getOrDefault(-1)
                  return "Bem-vindo de volta. Agora são $hour." +
                      if (battery in 0..100) " A bateria está em $battery por cento." else ""
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/java/com/gama/assistant/GamaService.kt')
          s=p.read_text()
          marker='GamaLearning.handleTeaching(this, command)?.let { reply ->'
          if marker not in s: raise SystemExit('FIX203 command routing anchor not found')
          code='''GamaReturnBrief.isPresenceWake(command).let { presence ->
              if (presence) {
                  markResponseStarted()
                  speak("Estou aqui. Pode falar.", false)
                  return
              }
          }
          if (GamaReturnBrief.isReturnWake(command)) {
              markResponseStarted()
              speak(GamaReturnBrief.build(this), false)
              return
          }
          '''
          # Use the existing command gate's indentation.
          m=re.search(r'(?m)^([ \t]*)'+re.escape(marker),s)
          if not m: raise SystemExit('FIX203 insertion anchor not found')
          indent=m.group(1)
          s=s[:m.start()]+''.join(indent+line if line.strip() else line for line in code.splitlines(True))+s[m.start():]
          p.write_text(s)
          PY

