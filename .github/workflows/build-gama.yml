name: Build Gama 4.4 INTEGRAL APK (lock-screen voice animation and continuous conversation)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write

concurrency:
  group: gama-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
