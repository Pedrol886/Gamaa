name: Build Giga MAX JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: giga-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      GIGA_BASE_RUN_ID: "37000254395"
      GIGA_BASE_ARTIFACT: "Linx-MAX-JARVIS-source"

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last source that already built successfully
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build
          gh run download "$GIGA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GIGA_BASE_ARTIFACT" \
            --dir _gama_build
          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/tools/download_models.sh
          echo "Base restored from successful run #100." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply Giga identity wake and red visual overlay
