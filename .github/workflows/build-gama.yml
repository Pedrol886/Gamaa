name: Build Gama 10.3.2 SAFE168 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-gama.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: gama-safe168-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      GAMA_BASE_RUN_ID: "37226292316"
      GAMA_BASE_ARTIFACT: "Gama-10.0.0-JARVIS-CONTEXT-source"
      GAMA_PATCH_RUN_ID: "37297324563"
      GAMA_PATCH_ARTIFACT: "Gama-10.3.2-SAFE163-compile-debug-165"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore exact green Gama source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build _gama_patch
          mkdir -p _gama_build _gama_patch

          gh run download \
            "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -x _gama_build/gradlew

          echo "PASS: base #156 restaurada."

      - name: Download verified SAFE165 patch files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh run download \
            "$GAMA_PATCH_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_PATCH_ARTIFACT" \
            --dir _gama_patch

          PATCH_ROOT="_gama_patch/_gama_build"

          test -s "$PATCH_ROOT/app/src/main/java/com/gama/assistant/GamaPersonalTools.kt"
          test -s "$PATCH_ROOT/app/src/main/java/com/gama/assistant/GamaService.kt"

          cp \
            "$PATCH_ROOT/app/src/main/java/com/gama/assistant/GamaPersonalTools.kt" \
            "_gama_build/app/src/main/java/com/gama/assistant/GamaPersonalTools.kt"

          cp \
            "$PATCH_ROOT/app/src/main/java/com/gama/assistant/GamaService.kt" \
            "_gama_build/app/src/main/java/com/gama/assistant/GamaService.kt"

          echo "PASS: Personal Android patch aplicado."

      - name: Set version and audit patched source
        working-directory: _gama_build
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          gradle_path = Path("app/build.gradle.kts")
          service_path = Path("app/src/main/java/com/gama/assistant/GamaService.kt")
          tools_path = Path("app/src/main/java/com/gama/assistant/GamaPersonalTools.kt")
          manifest_path = Path("app/src/main/AndroidManifest.xml")

          gradle = gradle_path.read_text(encoding="utf-8")
          service = service_path.read_text(encoding="utf-8")
          tools = tools_path.read_text(encoding="utf-8")
          manifest = manifest_path.read_text(encoding="utf-8")

          version_code = 25_330_000 + int(os.environ["GITHUB_RUN_NUMBER"])

          gradle, code_count = re.subn(
              r"versionCode\s*=\s*\d+",
              f"versionCode = {version_code}",
              gradle,
              count=1,
          )
          gradle, name_count = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              'versionName = "Gama 10.3.2 Personal Android Core"',
              gradle,
              count=1,
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Falha ao atualizar versionCode/versionName.")

          route_pattern = r"GamaPersonalTools\s*\.handle\s*\("
          route_count = len(re.findall(route_pattern, service))
          if route_count != 1:
              raise SystemExit(
                  f"Roteamento GamaPersonalTools inválido: {route_count}"
              )

          required_tools = (
              "AlarmClock.ACTION_SET_TIMER",
              "GamaScreenContextService",
              "GamaUnreadMessageStore",
              "GamaSilentContext",
          )
          missing = [item for item in required_tools if item not in tools]
          if missing:
              raise SystemExit(f"Personal tools incompleto: {missing}")

          if "com.android.alarm.permission.SET_ALARM" not in manifest:
              raise SystemExit("Permissão SET_ALARM ausente na base.")

          if "isDebuggable = false" not in gradle:
              raise SystemExit("Release debuggable detectado na configuração.")

          gradle_path.write_text(gradle, encoding="utf-8")
          print(f"PASS: source auditado; versionCode={version_code}")
          PY

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Gradle wrapper
        working-directory: _gama_build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew clean --no-daemon --stacktrace

      - name: Compile Release Kotlin
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew \
            :app:compileReleaseKotlin \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-compile.log"

      - name: Unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew \
            test \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew \
            lint \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-lint.log"

      - name: Prepare offline models
        working-directory: _gama_build
        run: |
          set -euo pipefail
          if [ -x tools/download_models.sh ]; then
            bash tools/download_models.sh
          fi

      - name: Assemble Release
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/gama-release.log"

      - name: Sign fresh-install Release APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          mkdir -p dist

          input_apk="$(
            find \
              app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print \
              | head -n 1
          )"

          if [ -z "$input_apk" ] || [ ! -s "$input_apk" ]; then
            echo "::error::APK Release não encontrado após assembleRelease."
            exit 1
          fi

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          "$ZIPALIGN" \
            -f \
            4 \
            "$input_apk" \
            dist/Gama-aligned.apk

          rm -f /tmp/gama-safe168.jks

          keytool \
            -genkeypair \
            -keystore /tmp/gama-safe168.jks \
            -storepass GamaFresh2026 \
            -keypass GamaFresh2026 \
            -alias gama \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Gama Fresh Test,O=Gama,C=BR"

          "$APKSIGNER" \
            sign \
            --ks /tmp/gama-safe168.jks \
            --ks-key-alias gama \
            --ks-pass pass:GamaFresh2026 \
            --key-pass pass:GamaFresh2026 \
            --out dist/Gama.apk \
            dist/Gama-aligned.apk

          rm -f dist/Gama-aligned.apk /tmp/gama-safe168.jks

          echo "fresh-install-only" > dist/install-mode.txt

      - name: Verify final APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          test -s dist/Gama.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            dist/Gama.apk \
            | tee dist/signature-info.txt

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump \
            badging \
            dist/Gama.apk \
            > dist/apk-info.txt

          grep -q \
            "name='com.gama.assistant'" \
            dist/apk-info.txt

          grep -q \
            "versionName='Gama 10.3.2 Personal Android Core'" \
            dist/apk-info.txt

          if grep -q 'application-debuggable' dist/apk-info.txt; then
            echo "::error::APK final está debuggable."
            exit 1
          fi

          (
            cd dist
            sha256sum Gama.apk > Gama.apk.sha256
            sha256sum -c Gama.apk.sha256
          )

          echo "PASS: _gama_build/dist/Gama.apk criado e verificado."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.3.2-SAFE168-FRESH-INSTALL-ONLY
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.3.2-SAFE168-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.3.2-SAFE168-diagnostics-${{ github.run_number }}
          path: |
            gama-compile.log
            gama-tests.log
            gama-lint.log
            gama-release.log
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: warn
