      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set increasing versionCode
        working-directory: _gama_build
        run: |
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import os,re
          file=Path('app/build.gradle.kts')
          source=file.read_text()
          run=int(os.environ['GITHUB_RUN_NUMBER'])
          source,count=re.subn(r'versionCode\s*=\s*\d+',f'versionCode = {max(20261028,20261026+run)}',source,count=1)
          if count!=1: raise SystemExit('versionCode not found')
          file.write_text(source)
          PY_VERSION

      - name: Download and verify offline voice models
        working-directory: _gama_build
        run: bash tools/download_models.sh

      # A etapa de restauracao foi aprovada na execucao anterior.
      # Executar compilacao e testes separadamente mostra a causa de erros futuros.
      - name: Compile Gama APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-build.log"

      - name: Run Gama unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Show first build failure in workflow summary
        if: failure()
        run: |
          python3 - <<'PY_DIAG'
          from pathlib import Path
          import os, re
          path = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with path.open('a', encoding='utf-8') as out:
              out.write('## Gama: diagnóstico de compilação ou testes\n\n')
              for name in ('gama-build.log', 'gama-tests.log'):
                  log = Path(name)
                  if not log.is_file():
                      continue
                  lines = log.read_text(encoding='utf-8', errors='replace').splitlines()
                  problems = [line for line in lines if re.search(r'(^e: |\berror:|^FAILURE:|^> Task .* FAILED|^\* What went wrong:|^Caused by:)', line)]
                  excerpt = problems[:45] if problems else lines[-45:]
                  out.write(f'### {name}\n\n```text\n')
                  out.write(chr(10).join(excerpt))
                  out.write('\n```\n\n')
          PY_DIAG

      - name: Upload build diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-build-logs
          path: |
            gama-build.log
            gama-tests.log
          if-no-files-found: warn

      - name: Sign and verify Gama.apk
        working-directory: _gama_build
        env:
          GAMA_SIGNING_KEY_B64: ${{ secrets.GAMA_SIGNING_KEY_B64 }}
          GAMA_STORE_PASSWORD: ${{ secrets.GAMA_STORE_PASSWORD }}
          GAMA_KEY_ALIAS: ${{ secrets.GAMA_KEY_ALIAS }}
          GAMA_KEY_PASSWORD: ${{ secrets.GAMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Gama.apk
          if [ -n "$GAMA_SIGNING_KEY_B64" ]; then
            test -n "$GAMA_STORE_PASSWORD"
            test -n "$GAMA_KEY_ALIAS"
            test -n "$GAMA_KEY_PASSWORD"
            umask 077
            keyfile="$(mktemp)"
            trap 'rm -f "$keyfile"' EXIT
            printf '%s' "$GAMA_SIGNING_KEY_B64" | base64 --decode > "$keyfile"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$keyfile" --ks-key-alias "$GAMA_KEY_ALIAS" --ks-pass env:GAMA_STORE_PASSWORD --key-pass env:GAMA_KEY_PASSWORD dist/Gama.apk
          else
            echo "::warning::APK assinado com chave de teste; para atualizar um APK anterior, configure os secrets com a MESMA chave de assinatura anterior."
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify dist/Gama.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Gama.apk > dist/apk-info.txt
          grep -m1 '^package:' dist/apk-info.txt
          grep -m1 'application-label:' dist/apk-info.txt | grep -q Gama
          (cd dist && sha256sum Gama.apk > Gama.apk.sha256)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gama-APK
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/Gama.apk.sha256
            _gama_build/dist/apk-info.txt
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-tests
          path: _gama_build/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Publish Gama release
        env:
          GH_TOKEN: ${{ github.token }}
          GAMA_TAG: gama-${{ github.run_number }}
          GAMA_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat > /tmp/gama-release.md <<'NOTES'
          Gama 3.6: botões para baixar, importar e testar IA offline; configuração inicial de permissões e perfil local do proprietário; criador distinto do proprietário; sem cadastro biométrico vocal; comandos pessoais protegidos por credenciais Android; preservada conversa contínua 3.3.
          Não há identificação biométrica pela voz; ações pessoais exigem autenticação do Android. Também mantém agenda autorizada, previsão do tempo por cidade, resumo do dia, foco Android condicionado a acesso especial, avisos proativos opcionais e cadências de voz. Tratamento Senhor/Senhora/Chefe, modo foco local, memória explícita do usuário e respostas da IA offline orientadas a dados, urgência e sugestões úteis. Identificador com.gama.assistant e palavra de ativação Gama preservados. O cérebro offline não consulta dados privados; consultas ao calendário e ao serviço online são executadas por módulos específicos com permissão ou pedido explícito. Desbloqueio somente por PIN/biometria oficiais.

          A instalação sobre uma versão existente exige a mesma chave de assinatura; valide no aparelho após compilar.
          NOTES
          if gh release view "$GAMA_TAG" > /dev/null 2>&1; then
            gh release upload "$GAMA_TAG" _gama_build/dist/Gama.apk _gama_build/dist/Gama.apk.sha256 --clobber
          else
            gh release create "$GAMA_TAG" _gama_build/dist/Gama.apk _gama_build/dist/Gama.apk.sha256 --target "$GAMA_COMMIT" --title "Gama 3.6 (${GAMA_TAG})" --notes-file /tmp/gama-release.md
          fi
