                              )
                              .put(
                                  "action",
                                  it.action
                              )
                              .put(
                                  "period",
                                  it.period
                              )
                              .put(
                                  "enabled",
                                  it.enabled
                              )
                      )
                  }

                  val aliasArray =
                      JSONArray()

                  aliases().forEach {
                      aliasArray.put(
                          JSONObject()
                              .put(
                                  "alias",
                                  it.first
                              )
                              .put(
                                  "target",
                                  it.second
                              )
                      )
                  }

                  root.put(
                      "format",
                      "GAMA_PERSONAL_CONFIG_V1"
                  )

                  root.put(
                      "policies",
                      policyArray
                  )

                  root.put(
                      "aliases",
                      aliasArray
                  )

                  return root
              }

