          python3 - <<'PY'
          from pathlib import Path
          import re

          pkg = Path(
              "app/src/main/java/com/gama/assistant"
          )

          service_path = (
              pkg / "GamaService.kt"
          )

          service = service_path.read_text(
              encoding="utf-8"
          )

          marker = (
              "        val gamaCommandSequence = userCommandSequence\n"
          )

          if (
              "ZEVRON_FIX97_UNIFIED_ROUTER"
              not in service
          ):

              if marker not in service:
                  raise SystemExit(
                      "Marcador de comandos não encontrado em GamaService.kt"
                  )

              injection = '''
                  // ZEVRON_FIX97_UNIFIED_ROUTER
                  ZevronLocalRouter.handle(
                      this,
                      command
                  )?.let { zevronReply ->
                      speak(zevronReply)
                      return
                  }

          '''

              service = service.replace(
                  marker,
                  marker + injection,
                  1
              )

          service_path.write_text(
              service,
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # TROCA DO HOTWORD E IDENTIDADE VISÍVEL
          # --------------------------------------------------------

          for path in pkg.glob("*.kt"):

              text = path.read_text(
                  encoding="utf-8"
              )

              # Prefixos de comandos.
              text = text.replace(
                  'removePrefix("gama ")',
                  'removePrefix("zevron ")'
              )

              text = text.replace(
                  'removePrefix("Gama ")',
                  'removePrefix("Zevron ")'
              )

              # Palavra-chave exata.
              text = text.replace(
                  '"gama"',
                  '"zevron"'
              )

              text = text.replace(
                  '"Gama"',
                  '"Zevron"'
              )

              # Regex de hotword.
              text = text.replace(
                  '\\\\bgama\\\\b',
                  '\\\\bzevron\\\\b'
              )

              # Exemplos e falas.
              text = text.replace(
                  '"Gama,',
                  '"Zevron,'
              )

              text = text.replace(
                  '"Gama ',
                  '"Zevron '
              )

              text = text.replace(
                  ' Gama,',
                  ' Zevron,'
              )

              # Não falar de modelo/processo/cache ao usuário.
              text = re.sub(
                  r'(?i)limpe o cache|limpar o cache|limpe cache|clear cache',
                  'tente novamente daqui a pouco',
                  text
              )

              text = text.replace(
                  "Senhor Pedro, não consegui concluir essa resposta agora, tente novamente.",
                  "Não consegui concluir essa parte agora, senhor Pedro."
              )

              text = text.replace(
                  "Senhor Pedro, não consegui te dar uma resposta agora, tente novamente.",
                  "Não consegui concluir essa parte agora, senhor Pedro."
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )

          print(
              "Zevron FIX97 integrado ao serviço."
          )
