name: Build Gama 10.3.2 Personal Android Core STABLE162

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-gama.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: gama-10-3-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      GAMA_BASE_RUN_ID: "37226292316"
      GAMA_BASE_ARTIFACT: "Gama-10.0.0-JARVIS-CONTEXT-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail

          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-10.3.2-PERSONAL-ANDROID-CORE-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"
            echo "::warning::GAMA_SIGNING_SEED não está configurado."
            echo "::warning::O APK será Release, mas será FRESH-INSTALL-ONLY."
          elif printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Gama-10.3.2-PERSONAL-ANDROID-CORE-APK" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GAMA_SIGNING_SEED deve possuir exatamente 64 caracteres hexadecimais."
            exit 1
          fi

      - name: Restore exact successful Gama 10 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf _gama_build
          mkdir -p _gama_build

          gh run download \
            "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaNotificationListener.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaScreenContextService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/ConversationSession.kt

          grep -Fq 'versionName = "Gama 10.0.0 JARVIS Context Core"' _gama_build/app/build.gradle.kts
          grep -Fq 'isDebuggable = false' _gama_build/app/build.gradle.kts

          echo "PASS: base verde do #156 restaurada."

      - name: Apply stable Personal Android upgrade
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"

          cat > "$SRC/GamaPersonalTools.kt" <<'KOTLIN'
          package com.gama.assistant

          import android.accessibilityservice.AccessibilityService
          import android.app.KeyguardManager
          import android.content.Context
          import android.content.Intent
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.os.BatteryManager
          import android.provider.AlarmClock
          import android.provider.Settings
          import java.lang.reflect.Field
          import java.text.Normalizer
          import java.util.Calendar
          import java.util.Locale

          object GamaPersonalTools {

              fun handle(
                  service: GamaService,
                  raw: String,
              ): String? {
                  GamaSilentContext.handle(
                      service,
                      raw,
                  )?.let {
                      return it
                  }

                  systemStatus(
                      service,
                      raw,
                  )?.let {
                      return it
                  }

                  notificationDigest(
                      service,
                      raw,
                  )?.let {
                      return it
                  }

                  timer(
                      service,
                      raw,
                  )?.let {
                      return it
                  }

                  website(
                      service,
                      raw,
                  )?.let {
                      return it
                  }

                  systemAction(
                      service,
                      raw,
                  )?.let {
                      return it
                  }

                  return null
              }

              private fun systemStatus(
                  context: Context,
                  raw: String,
              ): String? {
                  val text =
                      normalize(raw)

                  if (
                      text !in setOf(
                          "como estamos",
                          "gama como estamos",
                          "como esta o sistema",
                          "como esta o celular",
                          "status do sistema",
                          "status do celular",
                      )
                  ) {
                      return null
                  }

                  val batteryManager =
                      context.getSystemService(
                          BatteryManager::class.java
                      )

                  val battery =
                      batteryManager
                          ?.getIntProperty(
                              BatteryManager.BATTERY_PROPERTY_CAPACITY
                          )
                          ?.takeIf {
                              it in 0..100
                          }

                  val charging =
                      runCatching {
                          batteryManager?.isCharging == true
                      }.getOrDefault(
                          false
                      )

                  val connectivity =
                      context.getSystemService(
                          ConnectivityManager::class.java
                      )

                  val capabilities =
                      connectivity
                          ?.getNetworkCapabilities(
                              connectivity.activeNetwork
                          )

                  val network =
                      when {
                          capabilities?.hasTransport(
                              NetworkCapabilities.TRANSPORT_WIFI
                          ) == true ->
                              "Wi‑Fi"

                          capabilities?.hasTransport(
                              NetworkCapabilities.TRANSPORT_CELLULAR
                          ) == true ->
                              "dados móveis"

                          capabilities?.hasCapability(
                              NetworkCapabilities.NET_CAPABILITY_INTERNET
                          ) == true ->
                              "internet ativa"

                          else ->
                              "sem conexão"
                      }

                  val unread =
                      reflectUnreadCount()

                  return buildString {
                      append("Estamos operacionais.")

                      battery?.let {
                          append(" A bateria está em $it por cento")
                          if (charging) {
                              append(" e carregando")
                          }
                          append(".")
                      }

                      append(" A conexão atual é $network.")

                      unread?.let {
                          append(" Há $it ")
                          append(
                              if (it == 1) {
                                  "mensagem não lida registrada."
                              } else {
                                  "mensagens não lidas registradas."
                              }
                          )
                      }

                      GamaSilentContext
                          .description(context)
                          ?.let {
                              append(" $it")
                          }
                  }
              }

              private fun notificationDigest(
                  context: Context,
                  raw: String,
              ): String? {
                  val text =
                      normalize(raw)

                  val requested =
                      listOf(
                          "o que chegou enquanto eu estava ocupado",
                          "o que chegou enquanto estava ocupado",
                          "o que eu perdi enquanto estava ocupado",
                          "resuma minhas notificacoes",
                          "resumo das notificacoes",
                      ).any {
                          it in text
                      }

                  if (!requested) {
                      return null
                  }

                  val unread =
                      reflectUnreadCount()

                  return if (unread == null) {
                      "Ainda não consegui montar o resumo automático desta parte, mas o GAMA continuou ativo."
                  } else if (unread <= 0) {
                      "Não há mensagens não lidas registradas."
                  } else {
                      "Foram registradas $unread mensagens enquanto você estava ocupado."
                  }
              }

              private fun timer(
                  service: GamaService,
                  raw: String,
              ): String? {
                  val text =
                      normalize(raw)

                  val request =
                      text.contains("timer") ||
                          text.contains("me avisa daqui") ||
                          text.contains("me avise daqui") ||
                          text.contains("daqui a") ||
                          (
                              (
                                  text.startsWith("deixa ") ||
                                      text.startsWith("deixe ")
                                  ) &&
                                  (
                                      text.contains(" minuto") ||
                                          text.contains(" hora")
                                      )
                              )

                  if (!request) {
                      return null
                  }

                  val seconds =
                      parseDurationSeconds(
                          text
                      )
                          ?: return "Entendi o timer, mas não consegui identificar a duração."

                  if (seconds !in 1..86400) {
                      return "Esse tempo ficou fora do limite que posso enviar ao relógio do Android."
                  }

                  val intent =
                      Intent(
                          AlarmClock.ACTION_SET_TIMER
                      )
                          .putExtra(
                              AlarmClock.EXTRA_LENGTH,
                              seconds,
                          )
                          .putExtra(
                              AlarmClock.EXTRA_MESSAGE,
                              "GAMA",
                          )
                          .putExtra(
                              AlarmClock.EXTRA_SKIP_UI,
                              true,
                          )
                          .addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                          )

                  return launchIntentSafely(
                      service,
                      intent,
                      "Timer enviado ao relógio do Android.",
                      "Não consegui iniciar o timer no Android."
                  )
              }

              private fun website(
                  service: Context,
                  raw: String,
              ): String? {
                  val text =
                      normalize(raw)

                  val explicitUrl =
                      Regex(
                          """https?://[^\s]+""",
                          RegexOption.IGNORE_CASE,
                      )
                          .find(raw)
                          ?.value

                  val knownSite =
                      when {
                          "github" in text -> "https://github.com"
                          "google" in text -> "https://www.google.com"
                          "youtube" in text -> "https://www.youtube.com"
                          "wikipedia" in text -> "https://pt.wikipedia.org"
                          else -> null
                      }

                  val asksSite =
                      explicitUrl != null ||
                          " no chrome" in text ||
                          " pelo chrome" in text ||
                          text.startsWith("abra o site ") ||
                          text.startsWith("abre o site ") ||
                          text.startsWith("acesse o site ")

                  if (!asksSite) {
                      return null
                  }

                  val url =
                      explicitUrl ?: knownSite
                      ?: return "Qual site você quer abrir?"

                  var intent =
                      Intent(
                          Intent.ACTION_VIEW,
                          Uri.parse(url),
                      )
                          .addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                          )

                  if ("chrome" in text) {
                      val chrome =
                          service.packageManager
                              .getLaunchIntentForPackage(
                                  "com.android.chrome"
                              )

                      if (chrome != null) {
                          intent =
                              intent.setPackage(
                                  "com.android.chrome"
                              )
                      }
                  }

                  return launchIntentSafely(
                      service,
                      intent,
                      if ("chrome" in text) {
                          "Abrindo o site no Chrome."
                      } else {
                          "Abrindo o site."
                      },
                      "Não consegui abrir o site solicitado."
                  )
              }

              private fun systemAction(
                  context: Context,
                  raw: String,
              ): String? {
                  val text =
                      normalize(raw)

                  val recognized =
                      listOf(
                          "abra as notificacoes",
                          "abrir notificacoes",
                          "painel de notificacoes",
                          "configuracoes rapidas",
                          "quick settings",
                          "voltar",
                          "volte",
                          "tela inicial",
                          "ir para inicio",
                          "recentes",
                          "aplicativos recentes",
                          "role para baixo",
                          "rola para baixo",
                          "role para cima",
                          "rola para cima",
                          "clique em ",
                          "toque em ",
                          "aperte ",
                      ).any {
                          it in text
                      }

                  if (!recognized) {
                      return null
                  }

                  val keyguard =
                      context.getSystemService(
                          KeyguardManager::class.java
                      )

                  val locked =
                      keyguard?.isDeviceLocked == true

                  val privateUiAction =
                      text.contains("clique") ||
                          text.contains("toque") ||
                          text.contains("aperte") ||
                          text.contains("role") ||
                          text.contains("rola") ||
                          text.contains("recentes")

                  if (locked && privateUiAction) {
                      return "Para concluir essa ação na interface, desbloqueie o celular."
                  }

                  val connected =
                      reflectScreenContextConnected()

                  if (!connected) {
                      openAccessibilitySettings(
                          context
                      )
                      return "Para controlar essa parte da interface, ative Gama Contexto da Tela na acessibilidade. Abri a configuração."
                  }

                  when {
                      text.contains("notificacoes") -> {
                          val ok =
                              reflectPerformGlobal(
                                  AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS
                              )

                          return if (ok) {
                              "Abri o painel de notificações."
                          } else {
                              "O Android não permitiu abrir o painel de notificações agora."
                          }
                      }

                      text.contains("configuracoes rapidas") ||
                          text.contains("quick settings") -> {
                          val ok =
                              reflectPerformGlobal(
                                  AccessibilityService.GLOBAL_ACTION_QUICK_SETTINGS
                              )

                          return if (ok) {
                              "Abri as configurações rápidas."
                          } else {
                              "O Android não permitiu abrir as configurações rápidas agora."
                          }
                      }

                      text == "voltar" ||
                          text == "volte" -> {
                          val ok =
                              reflectPerformGlobal(
                                  AccessibilityService.GLOBAL_ACTION_BACK
                              )

                          return if (ok) {
                              "Voltei."
                          } else {
                              "O Android não confirmou a ação de voltar."
                          }
                      }

                      text.contains("tela inicial") ||
                          text.contains("ir para inicio") -> {
                          val ok =
                              reflectPerformGlobal(
                                  AccessibilityService.GLOBAL_ACTION_HOME
                              )

                          return if (ok) {
                              "Voltei para a tela inicial."
                          } else {
                              "O Android não confirmou a tela inicial."
                          }
                      }

                      text.contains("recentes") -> {
                          val ok =
                              reflectPerformGlobal(
                                  AccessibilityService.GLOBAL_ACTION_RECENTS
                              )

                          return if (ok) {
                              "Abri os aplicativos recentes."
                          } else {
                              "O Android não permitiu abrir os aplicativos recentes agora."
                          }
                      }

                      text.contains("role para baixo") ||
                          text.contains("rola para baixo") -> {
                          val ok =
                              reflectScroll(true)

                          return if (ok) {
                              "Rolei a tela para baixo."
                          } else {
                              "Não encontrei uma área acessível que pudesse rolar."
                          }
                      }

                      text.contains("role para cima") ||
                          text.contains("rola para cima") -> {
                          val ok =
                              reflectScroll(false)

                          return if (ok) {
                              "Rolei a tela para cima."
                          } else {
                              "Não encontrei uma área acessível que pudesse rolar."
                          }
                      }
                  }

                  val label =
                      Regex(
                          """(?:clique|toque|aperte)\s+(?:em|no|na)?\s*(.+)$"""
                      )
                          .find(text)
                          ?.groupValues
                          ?.getOrNull(1)
                          ?.trim()
                          .orEmpty()

                  if (label.isNotBlank()) {
                      val ok =
                          reflectClickByLabel(
                              label
                          )

                      return if (ok) {
                          "Pronto."
                      } else {
                          "Não encontrei um elemento acessível chamado $label na tela atual."
                      }
                  }

                  return null
              }

              private fun reflectUnreadCount(): Int? {
                  return runCatching {
                      val clazz =
                          Class.forName(
                              "com.gama.assistant.GamaUnreadMessageStore"
                          )

                      val instance =
                          clazz.getField("INSTANCE")
                              .get(null)

                      val methods =
                          clazz.methods

                      val peekMethod =
                          methods.firstOrNull {
                              it.name == "peekUnread" &&
                                  it.parameterTypes.size == 1
                          }
                              ?: return null

                      val result =
                          peekMethod.invoke(
                              instance,
                              null,
                          )
                              ?: return null

                      val list =
                          result as? Collection<*>
                              ?: return null

                      list.size
                  }.getOrNull()
              }

              private fun reflectScreenContextConnected(): Boolean {
                  return runCatching {
                      val clazz =
                          Class.forName(
                              "com.gama.assistant.GamaScreenContextService"
                          )

                      val instance =
                          clazz.getField("INSTANCE")
                              .get(null)

                      val method =
                          clazz.methods.firstOrNull {
                              it.name == "isConnected" &&
                                  it.parameterTypes.isEmpty()
                          }
                              ?: return false

                      method.invoke(
                          instance
                      ) as? Boolean ?: false
                  }.getOrDefault(false)
              }

              private fun reflectPerformGlobal(
                  action: Int,
              ): Boolean {
                  return runCatching {
                      val clazz =
                          Class.forName(
                              "com.gama.assistant.GamaScreenContextService"
                          )

                      val instance =
                          clazz.getField("INSTANCE")
                              .get(null)

                      val method =
                          clazz.methods.firstOrNull {
                              it.name == "performGlobal" &&
                                  it.parameterTypes.size == 1
                          }
                              ?: return false

                      method.invoke(
                          instance,
                          action,
                      ) as? Boolean ?: false
                  }.getOrDefault(false)
              }

              private fun reflectScroll(
                  down: Boolean,
              ): Boolean {
                  return runCatching {
                      val clazz =
                          Class.forName(
                              "com.gama.assistant.GamaScreenContextService"
                          )

                      val instance =
                          clazz.getField("INSTANCE")
                              .get(null)

                      val method =
                          clazz.methods.firstOrNull {
                              it.name == "scroll" &&
                                  it.parameterTypes.size == 1
                          }
                              ?: return false

                      method.invoke(
                          instance,
                          down,
                      ) as? Boolean ?: false
                  }.getOrDefault(false)
              }

              private fun reflectClickByLabel(
                  label: String,
              ): Boolean {
                  return runCatching {
                      val clazz =
                          Class.forName(
                              "com.gama.assistant.GamaScreenContextService"
                          )

                      val instance =
                          clazz.getField("INSTANCE")
                              .get(null)

                      val method =
                          clazz.methods.firstOrNull {
                              it.name == "clickByLabel" &&
                                  it.parameterTypes.size == 1
                          }
                              ?: return false

                      method.invoke(
                          instance,
                          label,
                      ) as? Boolean ?: false
                  }.getOrDefault(false)
              }

              private fun openAccessibilitySettings(
                  context: Context,
              ) {
                  runCatching {
                      context.startActivity(
                          Intent(
                              Settings.ACTION_ACCESSIBILITY_SETTINGS
                          ).addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                          )
                      )
                  }
              }

              private fun launchIntentSafely(
                  context: Context,
                  intent: Intent,
                  successMessage: String,
                  failureMessage: String,
              ): String {
                  return runCatching {
                      val pm =
                          context.packageManager

                      val canHandle =
                          intent.resolveActivity(pm) != null

                      if (!canHandle) {
                          failureMessage
                      } else {
                          context.startActivity(intent)
                          successMessage
                      }
                  }.getOrElse {
                      failureMessage
                  }
              }

              private fun parseDurationSeconds(
                  text: String,
              ): Int? {
                  if ("meia hora" in text) {
                      return 30 * 60
                  }

                  val digit =
                      Regex(
                          """\b(\d{1,4})\s*(segundo|segundos|minuto|minutos|hora|horas)\b"""
                      )
                          .find(text)

                  if (digit != null) {
                      val amount =
                          digit.groupValues[1]
                              .toIntOrNull()
                              ?: return null

                      return when (
                          digit.groupValues[2]
                      ) {
                          "segundo",
                          "segundos" -> amount

                          "minuto",
                          "minutos" -> amount * 60

                          "hora",
                          "horas" -> amount * 3600

                          else -> null
                      }
                  }

                  val numbers =
                      mapOf(
                          "um" to 1,
                          "uma" to 1,
                          "dois" to 2,
                          "duas" to 2,
                          "tres" to 3,
                          "quatro" to 4,
                          "cinco" to 5,
                          "seis" to 6,
                          "sete" to 7,
                          "oito" to 8,
                          "nove" to 9,
                          "dez" to 10,
                          "onze" to 11,
                          "doze" to 12,
                          "treze" to 13,
                          "catorze" to 14,
                          "quatorze" to 14,
                          "quinze" to 15,
                          "vinte" to 20,
                          "trinta" to 30,
                          "quarenta" to 40,
                          "cinquenta" to 50,
                          "sessenta" to 60,
                      )

                  val tokens =
                      text.split(" ")

                  for (index in tokens.indices) {
                      val amount =
                          numbers[tokens[index]]
                              ?: continue

                      val next =
                          tokens.getOrNull(index + 1)
                              ?: continue

                      when {
                          next.startsWith("segundo") -> return amount
                          next.startsWith("minuto") -> return amount * 60
                          next.startsWith("hora") -> return amount * 3600
                      }
                  }

                  return null
              }

              private fun normalize(
                  value: String,
              ): String =
                  Normalizer
                      .normalize(
                          value.lowercase(
                              Locale("pt", "BR")
                          ),
                          Normalizer.Form.NFD,
                      )
                      .replace(
                          Regex("\\p{M}+"),
                          "",
                      )
                      .replace(
                          Regex("[^a-z0-9:/. ]+"),
                          " ",
                      )
                      .replace(
                          Regex("\\s+"),
                          " ",
                      )
                      .trim()
          }

          object GamaSilentContext {
              private const val PREFS = "gama_silent_context"
              private const val KEY_START = "start"
              private const val KEY_END = "end"
              private const val KEY_BREAK_START = "break_start"
              private const val KEY_BREAK_END = "break_end"
              private const val KEY_LABEL = "label"

              private val rangeRegex =
                  Regex(
                      """(?:das|de)\s*(\d{1,2})(?::(\d{2}))?\s*(?:as|a)\s*(\d{1,2})(?::(\d{2}))?"""
                  )

              fun handle(
                  context: Context,
                  raw: String,
              ): String? {
                  val text =
                      normalize(raw)

                  val requested =
                      listOf(
                          "nao fale comigo",
                          "nao me interrompa",
                          "nao interrompa",
                          "modo silencioso",
                          "fique em silencio",
                          "fica em silencio",
                          "sem me interromper",
                      ).any {
                          it in text
                      }

                  if (!requested) {
                      return null
                  }

                  val ranges =
                      rangeRegex.findAll(text)
                          .toList()

                  if (ranges.isEmpty()) {
                      return "Entendi que você quer silêncio, mas preciso saber o horário de início e fim."
                  }

                  val dayOffset =
                      if ("amanha" in text) 1 else 0

                  val main =
                      toWindow(
                          ranges.first(),
                          dayOffset,
                      )
                          ?: return "Não consegui interpretar esse horário."

                  var breakStart = 0L
                  var breakEnd = 0L

                  if ("intervalo" in text && ranges.size >= 2) {
                      val pause =
                          toWindow(
                              ranges[1],
                              dayOffset,
                          )

                      if (pause != null) {
                          breakStart = pause.first
                          breakEnd = pause.second
                      }
                  }

                  val label =
                      when {
                          "prova" in text -> "prova"
                          "aula" in text -> "aula"
                          else -> "período ocupado"
                      }

                  context
                      .getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE,
                      )
                      .edit()
                      .putLong(KEY_START, main.first)
                      .putLong(KEY_END, main.second)
                      .putLong(KEY_BREAK_START, breakStart)
                      .putLong(KEY_BREAK_END, breakEnd)
                      .putString(KEY_LABEL, label)
                      .apply()

                  return if (breakStart > 0L && breakEnd > breakStart) {
                      "Certo. Vou evitar interrupções durante sua $label, liberar o intervalo informado e voltar ao normal automaticamente depois."
                  } else {
                      "Certo. Vou evitar interrupções não urgentes durante sua $label e voltar ao normal automaticamente depois."
                  }
              }

              fun isSilentNow(
                  context: Context,
                  now: Long = System.currentTimeMillis(),
              ): Boolean {
                  val prefs =
                      context.getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE,
                      )

                  val start =
                      prefs.getLong(KEY_START, 0L)

                  val end =
                      prefs.getLong(KEY_END, 0L)

                  if (
                      start <= 0L ||
                      end <= start ||
                      now !in start until end
                  ) {
                      return false
                  }

                  val breakStart =
                      prefs.getLong(KEY_BREAK_START, 0L)

                  val breakEnd =
                      prefs.getLong(KEY_BREAK_END, 0L)

                  return !(
                      breakStart > 0L &&
                          breakEnd > breakStart &&
                          now in breakStart until breakEnd
                      )
              }

              fun description(
                  context: Context,
              ): String? {
                  if (!isSilentNow(context)) {
                      return null
                  }

                  val label =
                      context
                          .getSharedPreferences(
                              PREFS,
                              Context.MODE_PRIVATE,
                          )
                          .getString(
                              KEY_LABEL,
                              "período ocupado",
                          )

                  return "Você está no período silencioso configurado para $label."
              }

              private fun toWindow(
                  match: MatchResult,
                  dayOffset: Int,
              ): Pair<Long, Long>? {
                  val startHour =
                      match.groupValues[1]
                          .toIntOrNull()
                          ?: return null

                  val startMinute =
                      match.groupValues[2]
                          .toIntOrNull()
                          ?: 0

                  val endHour =
                      match.groupValues[3]
                          .toIntOrNull()
                          ?: return null

                  val endMinute =
                      match.groupValues[4]
                          .toIntOrNull()
                          ?: 0

                  if (
                      startHour !in 0..23 ||
                      endHour !in 0..23 ||
                      startMinute !in 0..59 ||
                      endMinute !in 0..59
                  ) {
                      return null
                  }

                  val start =
                      Calendar.getInstance()
                          .apply {
                              add(
                                  Calendar.DAY_OF_MONTH,
                                  dayOffset,
                              )
                              set(Calendar.HOUR_OF_DAY, startHour)
                              set(Calendar.MINUTE, startMinute)
                              set(Calendar.SECOND, 0)
                              set(Calendar.MILLISECOND, 0)
                          }

                  val end =
                      Calendar.getInstance()
                          .apply {
                              timeInMillis =
                                  start.timeInMillis
                              set(Calendar.HOUR_OF_DAY, endHour)
                              set(Calendar.MINUTE, endMinute)
                              set(Calendar.SECOND, 0)
                              set(Calendar.MILLISECOND, 0)

                              if (timeInMillis <= start.timeInMillis) {
                                  add(Calendar.DAY_OF_MONTH, 1)
                              }
                          }

                  return start.timeInMillis to end.timeInMillis
              }

              private fun normalize(
                  value: String,
              ): String =
                  Normalizer
                      .normalize(
                          value.lowercase(
                              Locale("pt", "BR")
                          ),
                          Normalizer.Form.NFD,
                      )
                      .replace(
                          Regex("\\p{M}+"),
                          "",
                      )
                      .replace(
                          Regex("[^a-z0-9: ]+"),
                          " ",
                      )
                      .replace(
                          Regex("\\s+"),
                          " ",
                      )
                      .trim()
          }
          KOTLIN

          cat > "$GITHUB_WORKSPACE/gama-stable-upgrade.py" <<'PY'
          from pathlib import Path
          import os
          import re

          service_path = Path("app/src/main/java/com/gama/assistant/GamaService.kt")
          manifest_path = Path("app/src/main/AndroidManifest.xml")
          gradle_path = Path("app/build.gradle.kts")

          service = service_path.read_text(encoding="utf-8")
          manifest = manifest_path.read_text(encoding="utf-8")
          gradle = gradle_path.read_text(encoding="utf-8")

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def replace_once(value, old, new, label):
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return value.replace(old, new, 1)

          route_marker = """        val gamaCommandSequence = userCommandSequence
                  val gamaDirectCommand = norm(command)

                  // GAMA109_LOCKSCREEN_PUBLIC_FAST_LANE
          """

          route_replacement = """        val gamaCommandSequence = userCommandSequence
                  val gamaDirectCommand = norm(command)

                  GamaPersonalTools
                      .handle(
                          this,
                          command,
                      )
                      ?.let { personalReply ->
                          markResponseStarted()
                          speak(
                              personalReply,
                              false,
                          )
                          return
                      }

                  // GAMA109_LOCKSCREEN_PUBLIC_FAST_LANE
          """

          if "GamaPersonalTools" not in service:
              service = replace_once(
                  service,
                  route_marker,
                  route_replacement,
                  "Personal tools routing",
              )

          unlock_field = "    @Volatile private var unlockPending = false\n"

          if "lastScreenOffAt" not in service:
              service = replace_once(
                  service,
                  unlock_field,
                  unlock_field + "    @Volatile private var lastScreenOffAt = 0L\n",
                  "screen off field",
              )

          old_screen_off = """                } else if (intent?.action == Intent.ACTION_SCREEN_OFF) {
                      recentOwnerSession = 0L
                      recentAndroidAuth = 0L
                      hideWakeUi()
                  }
          """

          new_screen_off = """                } else if (intent?.action == Intent.ACTION_SCREEN_OFF) {
                      lastScreenOffAt = SystemClock.elapsedRealtime()
                      recentOwnerSession = 0L
                      recentAndroidAuth = 0L
                      hideWakeUi()
                  }
          """

          if "lastScreenOffAt = SystemClock.elapsedRealtime()" not in service:
              service = replace_once(
                  service,
                  old_screen_off,
                  new_screen_off,
                  "screen off timestamp",
              )

          lock_start = service.find("    private fun lockScreenReply(): String {")
          lock_end = service.find("\n    private fun performDeviceLockNow()", lock_start)

          require(
              lock_start >= 0 and lock_end > lock_start,
              "lockScreenReply region not found",
          )

          lock_region = service[lock_start:lock_end]
          lock_region = re.sub(r"(?m)^\s*conversation\.close\(\)\s*$", "", lock_region)
          lock_region = re.sub(r"(?m)^\s*conversation\.suspend\(\)\s*$", "", lock_region)
          lock_region = re.sub(r"(?m)^\s*GamaSupervisor\.onConversationClosed\(\)\s*$", "", lock_region)
          lock_region = lock_region.replace(
              "conversationLastActivityAt = 0L",
              "conversationLastActivityAt = SystemClock.elapsedRealtime()",
          )

          service = service[:lock_start] + lock_region + service[lock_end:]

          unlock_start = service.find("    private fun ensureVoicePipelineAfterUnlock() {")
          unlock_end = service.find("\n    fun cancelRequest()", unlock_start)

          require(
              unlock_start >= 0 and unlock_end > unlock_start,
              "ensureVoicePipelineAfterUnlock region not found",
          )

          unlock_function = r'''    private fun ensureVoicePipelineAfterUnlock() {
              val now =
                  SystemClock.elapsedRealtime()

              val stale =
                  listenerThread?.isAlive != true ||
                      !voiceReady ||
                      !running ||
                      textMode ||
                      (
                          lastScreenOffAt > 0L &&
                              lastAudioReadAt <=
                              lastScreenOffAt
                          ) ||
                      (
                          lastAudioReadAt > 0L &&
                              now -
                              lastAudioReadAt >
                              3_000L
                          )

              if (stale) {
                  recoverMicrophoneOnly(
                      "unlock"
                  )
              } else {
                  postAudio {
                      recognizer?.reset()

                      runCatching {
                          wakeRecognizer?.reset()
                      }

                      runCatching {
                          sleepRecognizer?.reset()
                      }

                      decoderActive =
                          false

                      voicedBlocks =
                          0

                      preRoll =
                          ByteArray(0)

                      wakePreRoll =
                          ByteArray(0)

                      bargePreRoll =
                          ByteArray(0)

                      speechHoldUntil =
                          0L

                      ignoreAudioUntil =
                          SystemClock.elapsedRealtime() +
                              350L
                  }
              }

              listOf(
                  1_800L,
                  6_000L,
              ).forEachIndexed {
                      index,
                      delayMs ->

                  uiHandler.postDelayed(
                      {
                          if (
                              !running ||
                              isDeviceLocked() ||
                              !BackgroundMode.enabled(
                                  this
                              )
                          ) {
                              return@postDelayed
                          }

                          val checkNow =
                              SystemClock.elapsedRealtime()

                          val freshAudio =
                              lastAudioReadAt > 0L &&
                                  (
                                      lastScreenOffAt <= 0L ||
                                          lastAudioReadAt >
                                          lastScreenOffAt
                                      ) &&
                                  checkNow -
                                      lastAudioReadAt <
                                      4_500L

                          if (
                              !freshAudio ||
                              listenerThread?.isAlive != true ||
                              !voiceReady
                          ) {
                              recoverMicrophoneOnly(
                                  if (index == 0) {
                                      "unlock-watchdog"
                                  } else {
                                      "unlock-hard-watchdog"
                                  }
                              )
                          }
                      },
                      delayMs,
                  )
              }
          }
          '''

          service = service[:unlock_start] + unlock_function + service[unlock_end:]

          alarm_permission = '<uses-permission android:name="com.android.alarm.permission.SET_ALARM" />'
          if alarm_permission not in manifest:
              application_index = manifest.find("<application")
              require(application_index >= 0, "AndroidManifest application tag not found")
              manifest = manifest[:application_index] + alarm_permission + "\n\n    " + manifest[application_index:]

          version_code = 25320000 + int(os.environ["GITHUB_RUN_NUMBER"])

          gradle, code_count = re.subn(
              r"versionCode\s*=\s*\d+",
              f"versionCode = {version_code}",
              gradle,
              count=1,
          )

          gradle, name_count = re.subn(
              r'versionName\s*=\s*"[^"]*"',
              'versionName = "Gama 10.3.2 Personal Android Core"',
              gradle,
              count=1,
          )

          require(code_count == 1, "versionCode not found")
          require(name_count == 1, "versionName not found")

          service_path.write_text(service, encoding="utf-8")
          manifest_path.write_text(manifest, encoding="utf-8")
          gradle_path.write_text(gradle, encoding="utf-8")

          final_service = service_path.read_text(encoding="utf-8")

          for token in [
              "GamaPersonalTools",
              "lastScreenOffAt",
              "unlock-hard-watchdog",
          ]:
              require(token in final_service, f"upgrade invariant missing: {token}")

          print("PASS: Gama 10.3.2 stable upgrade applied.")
          print(f"versionCode={version_code}")
          PY

          python3 -m py_compile "$GITHUB_WORKSPACE/gama-stable-upgrade.py"
          python3 "$GITHUB_WORKSPACE/gama-stable-upgrade.py"

      - name: Audit upgrade before build
        working-directory: _gama_build
        run: |
          set -euo pipefail

          SRC="app/src/main/java/com/gama/assistant"

          test -s "$SRC/GamaPersonalTools.kt"
          test -s "$SRC/GamaService.kt"
          test -s "$SRC/GamaNotificationListener.kt"
          test -s "$SRC/GamaScreenContextService.kt"

          grep -Fq 'GamaPersonalTools' "$SRC/GamaService.kt"
          grep -Fq 'unlock-hard-watchdog' "$SRC/GamaService.kt"
          grep -Fq 'AlarmClock.ACTION_SET_TIMER' "$SRC/GamaPersonalTools.kt"
          grep -Fq 'Settings.ACTION_ACCESSIBILITY_SETTINGS' "$SRC/GamaPersonalTools.kt"
          grep -Fq 'isDebuggable = false' app/build.gradle.kts

          echo "PASS: upgrade auditado antes do Gradle."

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 35
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          test -d "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Gradle wrapper
        working-directory: _gama_build
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Clean
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew clean --no-daemon --stacktrace

      - name: Compile Release Kotlin
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-compile.log"

      - name: Upload compile diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.3.2-compile-debug-${{ github.run_number }}
          path: |
            gama-compile.log
            gama-stable-upgrade.py
            _gama_build/app/src/main/java/com/gama/assistant/GamaPersonalTools.kt
            _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
            _gama_build/app/src/main/AndroidManifest.xml
            _gama_build/app/build.gradle.kts
          if-no-files-found: warn

      - name: Unit tests
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew test --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-tests.log"

      - name: Android lint
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew lint --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-lint.log"

      - name: Prepare offline models
        working-directory: _gama_build
        run: |
          set -euo pipefail
          if [ -x tools/download_models.sh ]; then
            bash tools/download_models.sh
          fi

      - name: Assemble Release
        working-directory: _gama_build
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/gama-release.log"

      - name: Sign Release APK
        working-directory: _gama_build
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          set -euo pipefail

          mkdir -p dist

          input_apk="$(
            find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | head -n 1
          )"

          if [ -z "$input_apk" ] || [ ! -s "$input_apk" ]; then
            echo "::error::APK Release não encontrado."
            exit 1
          fi

          aligned="dist/Gama-aligned.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$input_apk" "$aligned"

          if [ "$GAMA_SIGNING_MODE" = "stable" ]; then
            mkdir -p .gama-signing
            chmod 700 .gama-signing

            printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'

            python3 - "$GAMA_SIGNING_SEED" .gama-signing/key.der <<'PY'
          import sys

          raw = bytes.fromhex(sys.argv[1])

          order = int(
              "FFFFFFFF00000000"
              "FFFFFFFFFFFFFFFF"
              "BCE6FAADA7179E84"
              "F3B9CAC2FC632551",
              16,
          )

          d = (int.from_bytes(raw, "big") % (order - 1)) + 1
          key = d.to_bytes(32, "big")

          der = (
              bytes.fromhex("30310201010420")
              + key
              + bytes.fromhex("A00A06082A8648CE3D030107")
          )

          with open(sys.argv[2], "wb") as handle:
              handle.write(der)
          PY

            openssl ec -inform DER -in .gama-signing/key.der -out .gama-signing/key.pem >/dev/null 2>&1

            printf '%s' \
              '' \
              | base64 --decode \
              > .gama-signing/cert.pem

            openssl pkcs12 \
              -export \
              -inkey .gama-signing/key.pem \
              -in .gama-signing/cert.pem \
              -out .gama-signing/gama.p12 \
              -name gama \
              -passout pass:GamaStable2026

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              sign \
              --ks .gama-signing/gama.p12 \
              --ks-type PKCS12 \
              --ks-key-alias gama \
              --ks-pass pass:GamaStable2026 \
              --key-pass pass:GamaStable2026 \
              --out dist/Gama.apk \
              "$aligned"

            echo "stable-update-capable" > dist/install-mode.txt

            rm -rf .gama-signing
          else
            rm -f /tmp/gama-fresh.jks

            keytool \
              -genkeypair \
              -keystore /tmp/gama-fresh.jks \
              -storepass GamaFresh2026 \
              -keypass GamaFresh2026 \
              -alias gama \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=Gama Fresh Test,O=Gama,C=BR"

            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              sign \
              --ks /tmp/gama-fresh.jks \
              --ks-key-alias gama \
              --ks-pass pass:GamaFresh2026 \
              --key-pass pass:GamaFresh2026 \
              --out dist/Gama.apk \
              "$aligned"

            echo "fresh-install-only" > dist/install-mode.txt
          fi

          rm -f "$aligned"

      - name: Verify final Release APK
        working-directory: _gama_build
        run: |
          set -euo pipefail

          test -s dist/Gama.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Gama.apk | tee dist/signature-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Gama.apk > dist/apk-info.txt

          grep -q "name='com.gama.assistant'" dist/apk-info.txt
          grep -q "versionName='Gama 10.3.2 Personal Android Core'" dist/apk-info.txt

          echo "PASS: Gama.apk existe e foi verificado."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Gama.apk
            _gama_build/dist/apk-info.txt
            _gama_build/dist/signature-info.txt
            _gama_build/dist/install-mode.txt
          if-no-files-found: error

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.3.2-PERSONAL-ANDROID-CORE-source
          path: |
            _gama_build/**
            !_gama_build/.gradle/**
            !_gama_build/**/build/**
            !_gama_build/dist/**
          if-no-files-found: error

      - name: Upload engineering reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gama-10.3.2-engineering-reports
          path: |
            gama-stable-upgrade.py
            gama-compile.log
            gama-tests.log
            gama-lint.log
            gama-release.log
            _gama_build/app/build/reports/**
            _gama_build/app/build/test-results/**
          if-no-files-found: warn
