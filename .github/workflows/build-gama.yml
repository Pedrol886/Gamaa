name: Build Zevron 2.0 JARVIS Core FIX104 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: zevron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      FIX101_RUN_ID: "36863175724"
      FIX101_ARTIFACT: "Zevron-1.0-FIX101-source"
      FIX93_COMMIT: "9921e17c918a2ea358ade085c05b06af85d0b7fb"

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last source that compiled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build
          gh run download "$FIX101_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$FIX101_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/ZevronConversationEngine.kt
          test -s _gama_build/tools/download_models.sh

          echo "Restored source artifact from run #92, which already reached Android compilation." >> "$GITHUB_STEP_SUMMARY"

      - name: Apply audited JARVIS core patch
        run: |
          set -euo pipefail
          cat > /tmp/zevron-jarvis-core.patch.xz.b64 <<'PATCH_B64'
          
          PATCH_B64
          tr -d ' \n\r\t' < /tmp/zevron-jarvis-core.patch.xz.b64 | base64 --decode > /tmp/zevron-jarvis-core.patch.xz
          test "$(sha256sum /tmp/zevron-jarvis-core.patch.xz | cut -d' ' -f1)" = "e7066417e9b975e2e9797158e9042aceb49359e93ff0269250015b0ce0fa41ec"
          xz -dc /tmp/zevron-jarvis-core.patch.xz > /tmp/zevron-jarvis-core.patch
          test "$(sha256sum /tmp/zevron-jarvis-core.patch | cut -d' ' -f1)" = "37630a26e9f2331a3bcf91640afb168aba979bdf71409524bef3ff51556708f2"
          cd _gama_build
          patch -p2 --batch --forward < /tmp/zevron-jarvis-core.patch

      - name: Audit Zevron core before compiling
        working-directory: _gama_build
        run: |
          set -euo pipefail
          PKG="app/src/main/java/com/gama/assistant"
          SERVICE="$PKG/GamaService.kt"

          grep -Fq 'android:label="Zevron"' app/src/main/AndroidManifest.xml
          grep -Fq 'private val wake = Regex("\\b(?:zevron|sevron|zevrom|zevrun)\\b")' "$PKG/VoicePolicy.kt"
          ! grep -Eq 'private val wake.*gama|private val wake.*gamma' "$PKG/VoicePolicy.kt"
          grep -Fq 'handleBargeInAudio(rec, buffer, read, now)' "$SERVICE"
          grep -Fq 'interruptSpeechForBargeIn()' "$SERVICE"
          grep -Fq 'ZevronContextResolver.resolve(command)' "$SERVICE"
          grep -Fq 'ZevronContextResolver.brainContext()' "$SERVICE"
          grep -Fq 'GamaAudioNoiseSupervisor.attachNow(recorder)' "$SERVICE"
          grep -Fq 'GamaPersona.formalAddress' "$SERVICE"
          grep -Fq 'ConversationSession.isGoodbye(raw)' "$PKG/SessionExitPolicy.kt"
          grep -Fq 'class ZevronContextResolverTest' app/src/test/java/com/gama/assistant/ZevronContextResolverTest.kt

          ! grep -Fq 'Ativo em segundo plano • diga Gama' "$SERVICE"
          ! grep -Fq 'Em espera • diga Gama' "$SERVICE"
          ! grep -Fq 'android:label="Gama"' app/src/main/AndroidManifest.xml

          echo "Static JARVIS-core audit passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve Zevron signing mode
        id: signing
        env:
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail
          if [ -z "${GAMA_SIGNING_SEED:-}" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "artifact=Zevron-2.0-JARVIS-Core-FRESH-INSTALL-ONLY" >> "$GITHUB_OUTPUT"
            echo "::warning::GAMA_SIGNING_SEED não configurado. APK somente para instalação limpa."
          elif printf '%s' "$GAMA_SIGNING_SEED" | grep -Eq '^[0-9A-Fa-f]{64}$'; then
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "artifact=Zevron-2.0-JARVIS-Core-APK" >> "$GITHUB_OUTPUT"
          else
            echo "::error::GAMA_SIGNING_SEED precisa ter exatamente 64 caracteres hexadecimais."
            exit 1
          fi

      - name: Set Zevron JARVIS-core version
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          from pathlib import Path
          import os, re
          path = Path("app/build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          code = 21000000 + int(os.environ["GITHUB_RUN_NUMBER"])
          source, a = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {code}', source, count=1)
          source, b = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "Zevron 2.0 JARVIS Core FIX104"', source, count=1)
          if a != 1 or b != 1:
              raise SystemExit(f"version metadata patch failed: code={a}, name={b}")
          path.write_text(source, encoding="utf-8")
          print("versionCode", code)
          PY_VERSION
          echo "ZEVRON_TAG=zevron-2.0-jarvis-core-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Download and verify offline models
        working-directory: _gama_build
        run: |
          set -euo pipefail
          bash tools/download_models.sh

      - name: Compile complete Zevron APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/zevron-build.log"

      - name: Run complete Zevron unit-test suite
        working-directory: _gama_build
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest --no-daemon --stacktrace --rerun-tasks 2>&1 | tee "$GITHUB_WORKSPACE/zevron-tests.log"

      - name: Verify complete test suite
        working-directory: _gama_build
        run: |
          set -euo pipefail
          python3 - <<'PY_TESTS'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("app/build/test-results/testDebugUnitTest")
          files = list(root.glob("TEST-*.xml"))
          if not files:
              raise SystemExit("No unit-test XML files were produced")
          tests = failures = errors = skipped = 0
          failed = []
          for path in files:
              suite = ET.parse(path).getroot()
              tests += int(suite.attrib.get("tests", 0))
              failures += int(suite.attrib.get("failures", 0))
              errors += int(suite.attrib.get("errors", 0))
              skipped += int(suite.attrib.get("skipped", 0))
              for case in suite.findall(".//testcase"):
                  node = case.find("failure")
                  if node is None:
                      node = case.find("error")
                  if node is not None:
                      failed.append(f"{case.attrib.get('classname')} > {case.attrib.get('name')}: {node.attrib.get('message','')}")
          print(f"tests={tests} failures={failures} errors={errors} skipped={skipped}")
          for item in failed:
              print("FAILED", item)
          if tests < 130:
              raise SystemExit(f"Unexpectedly low test count: {tests}")
          if failures or errors:
              raise SystemExit(f"Suite failed: failures={failures}, errors={errors}")
          PY_TESTS
          echo "Full Zevron unit-test suite passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare stable signing runner
        run: |
          set -euo pipefail
          git show "${FIX93_COMMIT}:.github/workflows/build-gama.yml" > /tmp/fix93.yml
          test -s /tmp/fix93.yml
          cat > /tmp/run_workflow_step.py <<'PY_RUNNER'
          from pathlib import Path
          import os, re, subprocess, sys
          workflow_path = Path(sys.argv[1])
          step_name = sys.argv[2]
          workflow = workflow_path.read_text(encoding="utf-8")
          pattern = re.compile(r"^      - name: " + re.escape(step_name) + r"\n(?P<body>.*?)(?=^      - name: |\Z)", re.MULTILINE | re.DOTALL)
          match = pattern.search(workflow)
          if match is None:
              raise SystemExit(f"Step not found: {step_name}")
          body = match.group("body")
          wd = re.search(r"^        working-directory:\s*(.+?)\s*$", body, re.MULTILINE)
          cwd = Path.cwd() / wd.group(1).strip() if wd else Path.cwd()
          lines = body.splitlines()
          start = next((i + 1 for i, line in enumerate(lines) if line.strip() == "run: |"), None)
          if start is None:
              raise SystemExit("run block not found")
          script_lines = []
          for line in lines[start:]:
              if line.strip() == "":
                  script_lines.append("")
                  continue
              if not line.startswith("          "):
                  break
              script_lines.append(line[10:])
          subprocess.run(["bash", "-euo", "pipefail", "-c", "\n".join(script_lines) + "\n"], cwd=str(cwd), env=os.environ.copy(), check=True)
          PY_RUNNER
          python3 -m py_compile /tmp/run_workflow_step.py

      - name: Sign Zevron APK
        env:
          GAMA_SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          GAMA_SIGNING_SEED: ${{ secrets.GAMA_SIGNING_SEED }}
        run: |
          set -euo pipefail
          python3 /tmp/run_workflow_step.py /tmp/fix93.yml "Sign and verify Gama.apk"
          test -s _gama_build/dist/Gama.apk
          cp _gama_build/dist/Gama.apk _gama_build/dist/Zevron.apk
          (cd _gama_build/dist && sha256sum Zevron.apk > Zevron.apk.sha256)

      - name: Verify final Zevron APK
        working-directory: _gama_build
        run: |
          set -euo pipefail
          test -s dist/Zevron.apk
          test -s dist/Zevron.apk.sha256
          (cd dist && sha256sum -c Zevron.apk.sha256)
          bytes="$(wc -c < dist/Zevron.apk)"
          test "$bytes" -gt 1000000
          grep -q "name='com.gama.assistant'" dist/apk-info.txt
          echo "## Zevron 2.0 JARVIS Core FIX104" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK bytes: $bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package retained for update compatibility: com.gama.assistant" >> "$GITHUB_STEP_SUMMARY"
          echo "- Zevron hotword, continuous context, voice barge-in and natural persona patch compiled and tested." >> "$GITHUB_STEP_SUMMARY"

      - name: Print exact diagnostics
        if: failure()
        run: |
          set +e
          echo "## FIX104 diagnostics" >> "$GITHUB_STEP_SUMMARY"
          for log in zevron-build.log zevron-tests.log; do
            [ -s "$log" ] || continue
            echo "### $log" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^e: |error:|FAILED|FAILURE:|AssertionError|ComparisonFailure|Caused by:|expected|but was)' "$log" | head -220 >> "$GITHUB_STEP_SUMMARY" || tail -180 "$log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zevron-2.0-FIX104-diagnostics
          path: |
            zevron-build.log
            zevron-tests.log
            _gama_build/app/build/reports/tests
            _gama_build/app/build/test-results
          if-no-files-found: warn

      - name: Upload Zevron APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact }}
          path: |
            _gama_build/dist/Zevron.apk
            _gama_build/dist/Zevron.apk.sha256
            _gama_build/dist/apk-info.txt
            _gama_build/dist/install-mode.txt
            _gama_build/dist/signing-cert-sha256.txt
            _gama_build/dist/signature-info.txt
          if-no-files-found: error

      - name: Upload audited source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zevron-2.0-FIX104-source
          path: |
            _gama_build/app/src
            _gama_build/app/build.gradle.kts
            _gama_build/settings.gradle.kts
            _gama_build/build.gradle.kts
            _gama_build/gradle.properties
            _gama_build/tools
          if-no-files-found: warn

      - name: Publish Zevron release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$ZEVRON_TAG"
          gh release delete "$TAG" --yes >/dev/null 2>&1 || true
          gh release create "$TAG" \
            "_gama_build/dist/Zevron.apk#Zevron.apk" \
            "_gama_build/dist/Zevron.apk.sha256#Zevron.apk.sha256" \
            --title "Zevron 2.0 JARVIS Core FIX104" \
            --notes "Audited core update built from the last source that successfully compiled. Adds Zevron-only wake behavior, real in-session voice barge-in with echo filtering, unified short-term conversational referents, broader brain context, natural non-repetitive addressing, safer masculine-voice selection, corrected sleep/greeting behavior, clean fail-soft AI responses, and visible Zevron identity. Android security boundaries remain intact."

# ZEVRON_FIX104_COMPLETE_END
