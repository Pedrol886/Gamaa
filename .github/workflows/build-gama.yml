name: Build Gama 12.0 AUTONOMOUS UNIFIED APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: gama-12-autonomous-unified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      GAMA_BASE_RUN_ID: "37445474860"
      GAMA_BASE_ARTIFACT: "Gama-10.6.2-LOCALFIRST177-source"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore proven Android base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build
          gh run download "$GAMA_BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$GAMA_BASE_ARTIFACT" \
            --dir _gama_build
          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/assets/model/final.mdl
          test -s _gama_build/app/src/main/assets/model/Gr.fst
          test -s _gama_build/app/src/main/assets/spk-model/final.ext.raw
          test -f _gama_build/gradlew
          chmod +x _gama_build/gradlew

      - name: Install Gama 12 autonomous unified source
        run: |
          set -euo pipefail
          mkdir -p _gama_build/app/src/main/java/com/gama/assistant
          mkdir -p _gama_build/app/src/test/java/com/gama/assistant
          cat > _gama_build/app/build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "com.gama.assistant"
              compileSdk = 35
          
              defaultConfig {
                  applicationId = "com.gama.assistant"
                  minSdk = 26
                  targetSdk = 35
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
                  versionCode = 27000000
                  versionName = "Gama 12.0 Autonomous Unified Core"
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          
          
              kotlinOptions {
                  jvmTarget = "17"
              }
          
              buildTypes {
                  getByName("release") {
                      isDebuggable = false
                      isMinifyEnabled = false
                  }
              }
          }
          
          dependencies {
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("com.google.mlkit:face-detection:16.1.7")
              implementation("androidx.camera:camera-view:1.4.2")
              implementation("androidx.camera:camera-lifecycle:1.4.2")
              implementation("androidx.camera:camera-camera2:1.4.2")
              implementation("androidx.camera:camera-core:1.4.2")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("androidx.activity:activity-ktx:1.9.3")
              testImplementation("junit:junit:4.13.2")
              implementation("com.alphacephei:vosk-android:0.3.47@aar")
              implementation("net.java.dev.jna:jna:5.13.0@aar")
          }
          GRADLE

          cat > _gama_build/app/src/main/AndroidManifest.xml <<'MANIFEST'
