name: Build Linx MAX JARVIS FIX100 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gama.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: zevron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      FIX101_RUN_ID: "36863175724"
      FIX101_ARTIFACT: "Zevron-1.0-FIX101-source"
      FIX93_COMMIT: "9921e17c918a2ea358ade085c05b06af85d0b7fb"

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last Android source that compiled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf _gama_build
          mkdir -p _gama_build
          gh run download "$FIX101_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$FIX101_ARTIFACT" \
            --dir _gama_build

          test -s _gama_build/app/build.gradle.kts
          test -s _gama_build/app/src/main/AndroidManifest.xml
          test -s _gama_build/app/src/main/java/com/gama/assistant/GamaService.kt
          test -s _gama_build/app/src/main/java/com/gama/assistant/ZevronConversationEngine.kt
          test -s _gama_build/tools/download_models.sh

          echo "Restored the source artifact from run #92, which already reached Android compilation." >> "$GITHUB_STEP_SUMMARY"

